空题","type":"填空题","num":1,"text":"物联网闭环的四步依次是：感知、____、处理、反馈。","opts":[],"subs":[],"ans":"传输","al":{"考查点":"物联网闭环四步的完整记忆（记忆）。","解题思路":"闭环四步有固定时序：先感知现实（感知）→再把信号送出去（传输）→在平台判断决策（处理）→最后驱动执行器改变现实（反馈），之后回到感知形成循环。空位在第二步。","易错警示":"顺序颠倒或漏步——把“处理”填到第二空，就违背了“数据先送到才能处理”的物理逻辑；反馈是末端环节，不参与此空。","方法点拨":"顺口溜记忆：“感知传输处理反馈，一圈回来接着来”——填空时按四步顺序对号入座。"}},{"sec":"填空题","type":"填空题","num":2,"text":"超声波传感器的工作原理类似蝙蝠：发出声波、接收____来计算距离。","opts":[],"subs":[],"ans":"回音（回声）","al":{"考查点":"超声波测距原理（记忆）。","解题思路":"超声波测距仿照蝙蝠回声定位：发射器发出超声波，声波遇障碍物反弹形成回音，接收器记录“发出—收到”的时间差，由声速换算距离。","易错警示":"把“回音”写成“反射波”虽意近，但教材标准表述是“回音（回声）”；写“声音”则丢了“回”的关键语义。","方法点拨":"锚定生活原型记原理：蝙蝠夜飞靠“喊一声听回声”，传感器只是把蝙蝠的本领电子化了。"}},{"sec":"填空题","type":"填空题","num":3,"text":"“定点、定时、____”被称为三步采数法。","opts":[],"subs":[],"ans":"定记","al":{"考查点":"三步采数法的规范记忆（记忆）。","解题思路":"采集数据要保证“可比较”，须统一三个维度：在哪采（定点）、何时采（定时）、怎么记（定记——统一格式与单位）。空位在第三步。","易错警示":"“定记”易被误写为“定量/定人”——三步采数法管的是“采得规范”，统一记录格式与单位才是第三步要义。","方法点拨":"“三步采数法”＝定点＋定时＋定记，三“定”齐才叫规范采集，反复出现的表述要按原文记忆。"}},{"sec":"填空题","type":"填空题","num":4,"text":"能让不同厂商设备“说同一种话”的通信规则称为____。","opts":[],"subs":[],"ans":"协议","al":{"考查点":"协议的通俗定义（理解）。","解题思路":"不同厂商设备要互通，必须先约定共同遵守的通信规则——数据怎么封装、地址怎么写、谁先说话，这套规则即“协议”。题干强调“说同一种话”，正是协议的通俗写照。","易错警示":"答案写成“语言/标准”不够精确——协议是“通信双方共同遵守的规则集合”，规则二字是采分关键词。","方法点拨":"“协议＝通信界的普通话”：没有协议，设备各说各话；类比记忆后填空就不会跑偏。"}},{"sec":"填空题","type":"填空题","num":5,"text":"MQTT、CoAP 等消息协议常用于____传输数据量小、设备多的场景。","opts":[],"subs":[],"ans":"物联网（IoT）","al":{"考查点":"MQTT/CoAP 协议的应用场景（理解）。","解题思路":"回看协议选型逻辑：MQTT 采用发布/订阅模式、报文轻量，专为“设备数量巨大＋单条数据量小＋网络可能不稳定”的物联网场景设计。题干两特征恰好对应其设计初衷。","易错警示":"填“互联网/局域网”泛化——题干“数据量小、设备多”是物联网场景的典型描述，须落到物联网语境。","方法点拨":"“协议配对记忆”：互联网传输大文件记 HTTP；物联网海量小报文记 MQTT/CoAP。"}},{"sec":"填空题","type":"填空题","num":6,"text":"用“密码＋手机验证码”双重验证登录，属于____认证策略。","opts":[],"subs":[],"ans":"双因素（双重）","al":{"考查点":"双因素认证的概念理解（理解）。","解题思路":"“双因素”指用两类不同凭证叠加验证：一类是你知道的（密码），另一类是你拥有的（手机验证码/动态令牌）。题干“密码＋验证码”正是标准双因素组合。","易错警示":"写“二次验证/多步验证”只强调了次数——核心在“因素种类不同”，两类凭证叠加才叫双因素。","方法点拨":"判双因素的标尺：两类凭证是否属于“知道/拥有/生物特征”中不同的两类？同一种的两次输入只是“重复验证”。"}},{"sec":"简答题","type":"简答题","num":1,"text":"请用“寄快递”类比解释物联网三层架构，并说明“感知层—网络层—应用层”各层在一次“共享单车开锁”中各做了什么。","opts":[],"subs":[],"ans":"类比：感知层像填单子（知道寄什么），网络层像快递运输（传递包裹），应用层像驿站通知（处理并服务）。共享单车开锁中：感知层——车锁定位与通信模块感知车辆状态与位置；网络层——扫码请求经移动网络传到云端；应用层——云端验证身份与余额后下发开锁指令，车锁执行开锁。（类比与三例各占一半分）","al":{"考查点":"三层架构的类比理解与场景应用（应用）；跨课迁移——寄快递类比贯穿全册。","解题思路":"①类比要抓住三层各自职能的“神似”：感知层像填单子——先搞清楚寄什么（采集数据）；网络层像快递运输——负责把包裹送到（传递数据）；应用层像驿站签收通知——按单处理并服务（处理数据、提供服务）。②共享单车开锁逐层落例：感知层——智能锁内置定位与通信模块，感知车辆位置与状态（被扫码）；网络层——手机扫码请求经移动网络传到云端服务器；应用层——云端核验身份与余额后下发开锁指令，锁具执行开锁。类比贴切给一半分，三例各占余分。","易错警示":"类比与实例“两张皮”——只写类比不落实例，或三层例子里张冠李戴（把“下发指令”放网络层）；实例必须逐层对应“感知—传输—处理”的职责。","方法点拨":"“三层实例套模板”：感知层写传感器/模块采集了什么，网络层写信号走什么网络到了哪里，应用层写平台做了什么决策、执行器做了什么动作。"}},{"sec":"简答题","type":"简答题","num":2,"text":"学校给植物角设计“自动浇灌”：土壤湿度低于设定值就自动浇水。请写出①用到的传感器及感知对象；②完整闭环流程；③该系统还可能是哪两个环节出故障导致“该浇不浇”，并各给一条对策。","opts":[],"subs":[],"ans":"①土壤湿度传感器感知土壤墒情。②感知（测湿度）→传输（送数据）→处理（与阈值比对判断缺水）→反馈（打开滴灌，湿度回升后停止），再感知形成闭环。③故障示例：传感器探头被干土包裹读数失真→定期校准、清洁探头；断电或断网导致数据传不出去→配备备用电源与本地简易判断，保留手动浇水开关。（传感器2分、闭环4分、两处故障与对策各2分）","al":{"考查点":"自动浇灌系统的闭环设计与故障排查（应用）；跨课迁移——U1闭环四步＋U4工程思维。","解题思路":"①传感器对感知对象：土壤湿度传感器感知土壤墒情（含水量）。②闭环写全四步并带“回环”：感知（测湿度）→传输（数据上送）→处理（与设定阈值比对，判断是否缺水）→反馈（打开滴灌电磁阀；湿度回升至阈值以上则停止），随后继续感知，形成循环。③故障要“两处不同环节”且对策可操作：传感端——探头被干土包裹或结垢导致读数失真→定期校准、清洁探头；传输/供电端——断电或断网导致数据送不出去→配备用电源、保留本地简易判断与手动浇水开关。给分：传感器2分、闭环4分、两处故障＋对策各2分。","易错警示":"闭环漏“回环”表述（只写浇水不写湿度回升后停）；故障写成同一环节的两种表象；对策空泛如“加强管理”不给分。","方法点拨":"“该浇不浇”排查口诀：先查感知（读数准吗）→再查传输（数据到了吗）→后查执行（阀门开了吗），按链路逐段找断点。"}},{"sec":"案例分析题","type":"案例分析题","num":1,"text":"某医院为独居老人配备“智能药盒＋远程监护”：药盒到点亮灯提醒服药并记录是否取药，家人手机能收到“今天已服药/未服药”通知；手环监测心率异常会自动联系紧急联系人。请回答：①该系统可能用到哪些传感器，各感知什么？②从“价值与风险”两面各写两点分析。③如果你是监护人，你会怎么向老人解释“这个药盒是帮您，不是监视您”？","opts":[],"subs":[],"ans":"①药盒用重力/光电传感器感知是否取药；手环用光电传感器测心率、加速度计测活动。②价值：按时服药保障疗效、心率异常及时求助、家人远程安心、降低独居风险；风险：老人隐私（服药与作息被记录）可能被滥用、设备故障或断网导致漏报误报、过度依赖技术。③解释示例：药盒像您的“贴心小闹钟”，提醒您该吃药了、我才能放心；它只记录“吃没吃药”，不拍您的生活，数据只有我们家人能看到，您随时可以关掉——让您更安全，不是让您不自在。（传感器2分、价值4分、风险4分、沟通话术4分）","al":{"考查点":"多传感器系统识别＋价值风险两面分析＋科技伦理沟通（评价）；跨课迁移——U1价值风险观＋U5关爱场景。","解题思路":"①传感器与感知对象成对写：药盒——重力/光电传感器感知药瓶是否被拿起（取药动作）；手环——光电传感器测心率、加速度计感知活动与跌倒。②价值与风险各写两点且具体：价值——按时服药保障疗效、异常及时求助、家人远程安心、降低独居风险；风险——服药作息等隐私数据可能被滥用、设备故障或断网导致漏报误报、过度依赖技术弱化自我管理。③沟通话术要“三件套”：定性安抚（贴心小闹钟不是监视器）＋边界澄清（只记录吃没吃药、不拍生活、数据仅家人可见）＋赋权承诺（您随时可关闭）。给分：传感器2分、价值4分、风险4分、沟通4分。","易错警示":"风险只写“泄露隐私”不展开具体泄露什么；价值只写“方便”；话术无边界与赋权，老人无法安心——三个角度都要落到具体点。","方法点拨":"“两面分析”锚点句：价值用“保障/及时/安心/降低”，风险用“隐私/故障/依赖”；伦理沟通四步走：定性→边界→授权→可关闭。"}},{"sec":"综合实践题","type":"综合实践题","num":1,"text":"科技节上，学校请你做“智慧教室”项目策划人，为教室设计一套“感应照明＋自动通风＋安全告警”物联网系统并提交《策划书》。请完成：①画出系统框图：三层架构分别部署什么（写出设备/技术）；②为“安全告警”写出完整闭环（如夜间有人闯入教室）；③用价值四维分析这套系统至少两个维度的价值；④指出系统两个“失灵场景”并给出对策。","opts":[],"subs":[],"ans":"①感知层：红外人体传感器、光照传感器、CO₂/温湿度传感器、门窗磁传感器；网络层：Wi-Fi/无线把数据传至本地网关与云端；应用层：控制器/平台App（自动开关灯、控制风扇、向班主任推送告警）。②安全告警闭环：门窗磁/人体传感器感知异常→信号经网络传至平台→平台判断为闯入→推送告警到班主任手机并触发声光提示；布防解除后传感器继续巡检，形成循环。③价值示例：提效——灯随人亮灭免人工管理；降本——人走灯灭省电、按需通风；安全——闯入告警、CO₂超标自动开窗防缺氧。④失灵与对策：传感器误报（飞虫触发红外）→调整灵敏度与安装角度、加“双重确认”；断网时云端失效→本地网关保留基础控制与告警，保留手动开关。（框图4分、闭环4分、价值4分、失灵与对策4分、整体表达2分）","al":{"考查点":"智慧系统策划书完整设计（创造）；跨课迁移——三层架构＋闭环＋价值四维＋失灵对策的全要素综合。","解题思路":"①框图按层部署：感知层——红外人体传感器（人在检测）、光照传感器（亮度）、CO₂/温湿度传感器（空气）、门窗磁传感器（入侵）；网络层——Wi-Fi/无线网关把数据传至本地与云端；应用层——控制平台/App（自动开关灯、控制风扇、向班主任推送告警）。②安全告警闭环写全：门窗磁/红外感知异常→信号经网络到平台→平台判断“闯入”→推送告警并触发声光提示→布防继续巡检回环。③价值选两维展开：提效（灯随人亮灭免人工）、降本（人走灯灭省电）、安全（闯入告警、CO₂超标通风防缺氧）。④失灵场景各配对策：飞虫触发红外误报→调灵敏度、装角度、加双传感器“与”确认；断网云端失效→本地网关保留基础控制与告警、保留手动开关。给分：框图4分、闭环4分、价值4分、失灵对策4分、整体表达2分。","易错警示":"框图三层设备混放（把传感器写进应用层）；失灵与对策不对应；价值两维写重或只写“很智能”这类空话。","方法点拨":"策划书“四段模板”：框图按层填设备→挑一个功能写闭环→价值四维任选两维展开→找两个失灵点各配对策；结构齐全即稳拿中高分。"}}]},{"t":"全册综合检测卷（二）·素养进阶","n":"全册综合检测卷（二）·素养进阶","isExam":true,"qs":[{"sec":"选择题","type":"选择题","num":1,"text":"某共享单车企业给每辆车装了“智能锁”，手机扫码后由云端验证并下发开锁指令。这一过程最完整地体现了物联网的：","opts":[{"label":"A","text":"仅感知功能"},{"label":"B","text":"仅数据传输"},{"label":"C","text":"“感知—传输—处理—反馈”闭环"},{"label":"D","text":"纯人工控制"}],"subs":[],"ans":"答案C　“感知—传输—处理—反馈”闭环","al":{"考查点":"闭环模型在真实场景中的完整识别（应用）。","解题思路":"把共享单车开锁流程逐段映射四要素：扫码是感知与请求发起→移动网络上传是传输→云端验证身份与余额是处理→下发指令驱动锁开是反馈执行。四步齐全才能选“闭环”。","逐项剖析":"A错：过程不止感知，还有云端验证与执行，说“仅感知”以偏概全；B错：传输只是中间一环，缺处理与反馈；C对：扫码（感知）→网络（传输）→云端验证（处理）→开锁（反馈），四要素完整且成环；D错：扫码开锁是自动决策，不是“纯人工控制”。","易错警示":"只抓住“扫码开锁”的表面动作而忽略云端验证环节——处理层是物联网“智能”的关键，识别闭环必须包含它。","方法点拨":"闭环识题“四步标号法”：把题干事件按感知/传输/处理/反馈标注①②③④，四步齐全才是“最完整体现”。"}},{"sec":"选择题","type":"选择题","num":2,"text":"能实现“非接触、可批量、秒级”读取的自动识别技术是：","opts":[{"label":"A","text":"条形码（需对准扫描）"},{"label":"B","text":"RFID电子标签"},{"label":"C","text":"键盘手动输入"},{"label":"D","text":"纸上登记"}],"subs":[],"ans":"答案B　RFID电子标签","al":{"考查点":"RFID 与条形码等识别技术的性能对比（理解）。","解题思路":"题干给三个限定词：非接触、可批量、秒级。逐一对照各技术特征：能隔空读、能一次读一堆、速度快的只有 RFID。","逐项剖析":"A错：条形码靠光学扫描，必须可见、对准、逐条扫，不能批量更不能隔空；B对：RFID 用无线电波读写，标签无需可见，读写器天线覆盖范围内整箱整摞可同时秒读（物流、ETC、图书借还均靠此）；C错：键盘输入是人工逐键录入，速度最慢且易错；D错：纸上登记属纯人工，谈不上自动识别。","易错警示":"把“条形码”误当可批量——条码识别需要“看得见”，RFID 的“看不见也能读”正是其碾压性优势。","方法点拨":"识别技术对比记忆：条码靠光（需可见）、RFID靠电波（可穿透隔空）、键盘靠手、登记靠纸——见到“批量/非接触/秒级”三词必选 RFID。"}},{"sec":"选择题","type":"选择题","num":3,"text":"把“模糊的大需求”变成“可逐个实现的子功能”，体现的工程思维是：","opts":[{"label":"A","text":"功能分解"},{"label":"B","text":"加大投资"},{"label":"C","text":"堆叠硬件"},{"label":"D","text":"越多越好"}],"subs":[],"ans":"答案A　功能分解","al":{"考查点":"工程思维之功能分解（理解）。","解题思路":"题干描述“大需求→子功能”的转化过程，这正是功能分解树的核心思想：复杂系统先拆成可独立实现的小模块，再逐个攻克。","逐项剖析":"A对：把“智能门禁”拆成识别、开锁、通知、记录等子功能，逐项实现再集成，是工程化第一步；B错：加大投资是用资源堆方案，不是思维方法；C错：堆叠硬件是“数量思维”，与“把需求结构化”无关；D错：“越多越好”无目标导向，工程讲求按需拆解而非贪多。","易错警示":"功能分解是“按职责切分需求”而非“多买设备”——四个选项里只有 A 描述的是思维方法，其余都是错误做法。","方法点拨":"识别工程思维题干关键词：见“拆成/分解/模块化/逐步实现”抓功能分解；见“大需求小模块”直接选分解。"}},{"sec":"选择题","type":"选择题","num":4,"text":"“数据会说话”指的是数据经过处理后能告诉我们规律。下列处理最能体现“数据变信息”的是：","opts":[{"label":"A","text":"把100个数字抄进本子"},{"label":"B","text":"对一周温湿度求平均并发现午后最高、凌晨最低"},{"label":"C","text":"把传感器藏起来"},{"label":"D","text":"把表格打印两份"}],"subs":[],"ans":"答案B　对一周温湿度求平均并发现午后最高、凌晨最低","al":{"考查点":"数据处理让“数据变信息”的本质（理解）。","解题思路":"信息＝数据经过处理后的意义。“数据会说话”指处理揭示规律：排序、求平均、找极值让隐藏的模式浮现。B 选项中处理动作完整且产生了新认识。","逐项剖析":"A错：抄数字只是搬运，不产生任何新认识，数据仍是数据；B对：对一周数据求平均并定位“午后最高、凌晨最低”的规律，处理让趋势显现——典型的数据变信息；C错：藏传感器是中断采集，与处理无关；D错：打印是复制载体，不改变信息含量。","易错警示":"把“记录/复制”误当处理——处理须有“加工动作＋新认识产出”（平均、极值、对比、分类），纯搬运不算。","方法点拨":"“数据→信息”判别标尺：处理动作后你是否知道了原来不知道的规律？知道→信息；只是换个地方存→仍是数据。"}},{"sec":"选择题","type":"选择题","num":5,"text":"寿光智慧大棚“靠数据种菜”：土壤湿度低于阈值自动滴灌、温度过高自动卷帘。这套系统最核心的价值在于：","opts":[{"label":"A","text":"让大棚更好看"},{"label":"B","text":"按需精准管理，节水省力并降低冻害风险"},{"label":"C","text":"完全替代农民"},{"label":"D","text":"让蔬菜更便宜却不管质量"}],"subs":[],"ans":"答案B　按需精准管理，节水省力并降低冻害风险","al":{"考查点":"智慧农业价值的准确归因（理解）。","解题思路":"题干给出“阈值触发滴灌/卷帘”的事实，价值要从事实反推：阈值判断实现按需供水、自动执行省去人工夜巡、异常预警防冻害——核心是“精准与安全”，而非装饰或替代。","逐项剖析":"A错：自动化不是为好看，功能价值与外观无关；B对：阈值触发＝精准滴灌（节水）、自动卷帘＝免凌晨跑棚（省力）、低温预警＝降冻害风险，三项都落到实处；C错：技术是辅助决策，农民的经验与判断不可替代，“完全替代”是夸大；D错：价值在管理效率，题干未提“更便宜且不管质量”这类结论。","易错警示":"“技术替代人”是最常见过度推断——物联网的价值表述须守住“辅助人、赋能人”的边界。","方法点拨":"智慧场景价值归因三步：先列事实（做了什么）→再推价值（省什么、防什么）→最后守边界（不替代人、不包治百病）。"}},{"sec":"选择题","type":"选择题","num":6,"text":"系统提示“检测到新的安全漏洞，请尽快更新”。对此最负责任的做法是：","opts":[{"label":"A","text":"忽略提示，麻烦"},{"label":"B","text":"立即按指引更新并重启设备"},{"label":"C","text":"把设备卖掉"},{"label":"D","text":"关闭所有联网功能再也不升级"}],"subs":[],"ans":"答案B　立即按指引更新并重启设备","al":{"考查点":"安全漏洞响应的负责任态度（理解）。","解题思路":"“检测到新漏洞”的正确响应是标准安全流程的第一步：立即按指引更新补丁，必要时重启完成生效。其他选项都是回避或极端化。","逐项剖析":"A错：忽略提示是把已知漏洞留在家里，风险最高；B对：按指引更新＋重启是厂商设计的标准动作，及时打补丁是用户端最有效的防护；C错：卖设备是逃避，问题并未解决且成本荒谬；D错：关闭联网是因噎废食——物联网设备断网即失去价值，正确做法是更新而非自废武功。","易错警示":"把“断网保安全”当方案——安全应通过更新与防护达成，而非放弃功能；因噎废食式选项常具迷惑性。","方法点拨":"漏洞响应“标准动作链”：看到提示→立即更新→重启生效→继续关注；凡见“忽略/不用管/极端关闭”均为错误态度。"}},{"sec":"判断题","type":"判断题","num":1,"text":"物联网的价值分析只需看好处，风险可以忽略。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"价值分析的全面性（理解）。","解题思路":"负责任的技术分析须“功能—价值—风险”三维并看：功能解决什么问题、价值带来什么好处、风险伴随什么代价。题干“只需看好处”砍掉了风险维度。","易错警示":"“技术乐观主义”陷阱——只说物联网好处而不谈隐私与安全，是不完整的分析；判错后要点明“看到便利同时管理风险才是负责任”。","方法点拨":"“三维分析模板”：任何物联网应用按功能（做什么）→价值（好在哪）→风险（坏在哪）逐条列，缺一维的分析都不完整。"}},{"sec":"判断题","type":"判断题","num":2,"text":"蓝牙传输距离一般在10米左右，适合“当面交接文件”的场景。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"蓝牙的技术特征与适用场景（记忆）。","解题思路":"蓝牙定位为短距离（约10米内）点对点无线技术：低功耗、免流量、免配置，正适合“当面交接文件”等近距离传输。题干描述与教材特征一致。","易错警示":"距离尺度记错——蓝牙约10米级，若场景是“跨楼层/跨城市”则错；当面传文件恰在其射程内。","方法点拨":"无线技术“距离谱”：蓝牙≈10米（当面）、Wi-Fi≈百米级（室内）、蜂窝网络≈公里级（广域），按场景距离对号。"}},{"sec":"判断题","type":"判断题","num":3,"text":"远程控制就是“人直接伸手去按远处的开关”。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"远程控制的链路本质（理解）。","解题思路":"远程控制的标准链路是“手机App→云→设备执行”：指令以数据形式经网络传输，设备端收到后执行。人不在现场，靠的是“网络传指令”。","易错警示":"被“远程”二字带偏成“遥控”——遥控器是近距离红外/射频直控，远程控制须经云中转，两者链路不同；题干“直接伸手去按”根本否认了网络参与。","方法点拨":"“远程≠亲临”：凡远程控制题，链路上必有“网络/云”节点；选项若描述成人到现场操作即可判错。"}},{"sec":"判断题","type":"判断题","num":4,"text":"折线图与柱状图都能呈现数据，选哪种取决于想强调“趋势”还是“对比”。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"图表选型与表达目的的关系（理解）。","解题思路":"图表是表达工具，选型服从目的：时间序列的趋势变化用折线最直观，分类间的数量对比用柱状最清晰。题干对两图适用域的概括准确。","易错警示":"“什么图都能用”的随意选型——选错图会让规律不直观；判√时要点出“目的决定图型”。","方法点拨":"“图型-目的配对记忆”：折线→趋势（随时间），柱状→对比（分类间），饼图→占比；题干给目的即可反推图型。"}},{"sec":"判断题","type":"判断题","num":5,"text":"物联网设备只要设置了强密码，就永远不会被攻击。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"安全策略组合与动态性（理解）。","解题思路":"强密码是重要防线但非唯一防线：攻击还可走漏洞利用、默认端口、钓鱼、物理接触等路径。题干“只要强密码就永不攻击”把单一措施绝对化。","易错警示":"“单点防线万能论”——安全须纵深防御：强密码＋双因素＋及时更新＋最小权限四类策略组合，缺一不可；任何“只要……就永不……”的绝对表述都应警惕。","方法点拨":"绝对化判断口诀：安全题见“只要…就永远/一定不会”，大概率判×——安全是动态的、组合的，没有一劳永逸。"}},{"sec":"填空题","type":"填空题","num":1,"text":"人脸识别通常要经历“采集人脸图像→提取特征→与数据库____→放行或拒绝”的过程。","opts":[],"subs":[],"ans":"比对","al":{"考查点":"人脸识别流程的环节记忆（记忆）。","解题思路":"人脸识别流程有固定时序：先采集人脸图像→再从图像中提取特征向量→拿特征与数据库预存模板比对相似度→达标放行否则拒绝。空位在第三步。","易错警示":"把“提取/采集”填到空位——前三步是“采集→提取→比对”的递进关系，题干已给前两步，空的是比对环节。","方法点拨":"“人脸识别五连拍”记忆：采集→提取→比对→判定→动作，填空按流程顺序找空缺。"}},{"sec":"填空题","type":"填空题","num":2,"text":"在电脑里建一座与真实系统同步的“数字双胞胎”并先演练再执行，这种技术叫____。","opts":[],"subs":[],"ans":"数字孪生","al":{"考查点":"数字孪生的概念识别（理解）。","解题思路":"关键词定位：与真实系统同步的“数字双胞胎”＋先演练再执行——这正是数字孪生的定义：为物理实体建实时镜像的数字模型，先仿真验证再作用于现实。","易错警示":"与“虚拟现实/仿真”混淆——数字孪生的关键是“与真实系统实时同步、双向联动”，不是孤立的虚拟场景。","方法点拨":"“双胞胎”是题眼：见到“同步镜像/先演练再执行”即填数字孪生；考试热词须按教材定义准确再现。"}},{"sec":"填空题","type":"填空题","num":3,"text":"把处理结果送回执行器去控制设备、让系统自动调节的环节叫____。","opts":[],"subs":[],"ans":"反馈","al":{"考查点":"闭环反馈环节的功能识别（理解）。","解题思路":"闭环四步里，“把处理结果送回执行器控制设备、让系统自动调节”描述的正是反馈环节——它是连接“决策”与“现实”的最后一棒，也是形成循环的关键。","易错警示":"与“处理”混淆——处理是做判断（该不该动），反馈是执行动作（去动它）并回读结果；题干“送回执行器去控制设备”明确指向后者。","方法点拨":"“反馈三要素”记忆：接收处理结果→驱动执行器→回读新状态；凡描述“结果送回+控制+自动调节”即反馈。"}},{"sec":"填空题","type":"填空题","num":4,"text":"安全防范四类策略：强密码、____认证、及时更新固件、最小权限。","opts":[],"subs":[],"ans":"双因素（双重）","al":{"考查点":"安全防范四类策略的记忆（记忆）。","解题思路":"四类策略是安全单元的总纲：强密码、双因素认证、及时更新固件、最小权限。题干列举了强密码、更新、最小权限，空位恰好是双因素认证。","易错警示":"写“加密/防火墙”偏题——四类策略是教材明确定义的组合，答案须用规范表述“双因素（双重）认证”。","方法点拨":"“安全四件套”捆绑记忆：密码＋双因＋更新＋权限，四者成组出现，见三补一即答双因素认证。"}},{"sec":"填空题","type":"填空题","num":5,"text":"芯片、操作系统、通信协议的____可控，是保障国家与个人数字安全的重要基础。","opts":[],"subs":[],"ans":"自主","al":{"考查点":"自主可控的维度与意义（理解）。","解题思路":"题干给出三个并列对象：芯片、操作系统、通信协议——这正是自主可控的三大关键领域。三者的“可控”指核心技术不被他人卡脖子，保障国家与个人数字安全。","易错警示":"写成“质量/性能”可控——自主可控强调的是“掌握核心技术、不受制于人”，安全视角落在主权与主动权。","方法点拨":"“自主可控三件套”记忆：芯片（硬件）、操作系统（软件）、通信协议（标准），见三者并列即填自主。"}},{"sec":"填空题","type":"填空题","num":6,"text":"智能门禁的需求可分解为：识别、____、通知、记录等子功能。","opts":[],"subs":[],"ans":"开锁（开门）","al":{"考查点":"功能分解在门禁系统的实例应用（应用）。","解题思路":"功能分解树已给两个子功能：识别（谁来了）、通知（告知谁）、记录（留痕），空位按门禁自然流程推理——识别之后、通知之前必然是“放行/开门”动作。","易错警示":"填“报警/监控”跳出了正常流程——分解树沿“识别→开锁→通知→记录”的正常业务线展开，报警是异常分支，不占主链空位。","方法点拨":"“分解树补空推理法”：先读已给子功能判断业务主线，再按“先识别后动作再通知留痕”的顺序补空，正常流程优先于异常分支。"}},{"sec":"简答题","type":"简答题","num":1,"text":"请对比“RFID门禁卡开锁”与“人脸识别开锁”两条技术路线：①各自的识别依据是什么？②各举一个优点与一个缺点；③从“便利与隐私”角度，给学校食堂门禁选一条路线并说明理由。","opts":[],"subs":[],"ans":"①RFID依据“持卡”（卡片芯片内身份信息），人脸识别依据“生物特征”（人脸几何特征）。②RFID：优点——成本低、识别快；缺点——卡可能丢失被冒用；人脸：优点——无需携带、难伪造；缺点——依赖光线与算法、人脸数据属敏感隐私。③示例：选“RFID＋密码/人脸二选一”。若选人脸需强调数据本地加密、明示采集范围并给不愿使用人脸者提供刷卡替代方案，尊重选择权（对比4分、两面分析4分、选择与理由2分）。","al":{"考查点":"两条技术路线对比＋便利隐私权衡决策（评价）；跨课迁移——RFID（U2）与AI人脸识别（U6）知识缝合。","解题思路":"①识别依据写清本质：RFID 凭“持卡”——卡内芯片存有身份编号，读卡器读取编号认证；人脸识别凭“生物特征”——采集人脸几何特征与数据库比对。②优缺点要具体且对应：RFID 优点——成本低、识别快、不怕光线；缺点——卡易丢易被冒用（捡卡即开）。人脸优点——无需携带、难伪造、体验顺滑；缺点——依赖光线角度、人脸数据属敏感隐私、误识风险。③选型要给明确结论＋双面理由：可选“人脸为主、刷卡兜底”双通道——用刷卡照顾不愿刷脸者、用隐私政策与本地加密消解顾虑；或选刷卡强调低成本。给分：对比4分、两面分析4分、选择与理由2分。","易错警示":"对比只写现象不写本质（“RFID用卡、人脸用脸”太浅）；优缺点不成对；选型无理由或理由只谈一面。","方法点拨":"技术路线对比“四步模板”：识别依据→各一优一劣→结合场景权衡→给结论并兼顾被放弃方的替代方案。"}},{"sec":"简答题","type":"简答题","num":2,"text":"妈妈准备买一款智能门锁，请你帮她列一份《选购与使用安全清单》：从“购买前、安装后、日常用”三个阶段各写两条注意事项。","opts":[],"subs":[],"ans":"购买前：①选正规品牌并有安全认证的产品；②了解其数据存储方式与厂商隐私政策；③确认支持固件更新。安装后：①立即修改默认管理员密码并设置强密码；②开启双因素验证（如密码＋手机验证码）；③仅授权家庭成员必要权限（最小权限）。日常用：①发现系统提示及时更新固件；②定期检查开门记录是否有异常；③不把备用钥匙与密码贴在门上，出现可疑情况及时联系厂商。（三阶段各2分，共6分＋完整性4分）","al":{"考查点":"安全清单的分阶段设计（应用）；跨课迁移——安全四类策略落地为行动清单。","解题思路":"按生命周期三阶段各写两条“可执行动作”：购买前——选正规品牌且带安全认证、了解数据存储与隐私政策、确认支持固件更新；安装后——立即改默认密码并设强密码、开启双因素验证、按最小权限只授权家庭成员必要权限；日常用——提示即更新固件、定期查开门记录有无异常、钥匙密码不贴门、可疑即联系厂商。给分：每阶段2分＋完整性4分。","易错警示":"清单写成口号（“注意安全”）不可执行——每一条都要是“动词＋对象＋标准”的可操作动作；阶段错位（把更新放购买前）也会扣分。","方法点拨":"“安全清单写作公式”：分阶段×每阶段列“动作＋理由”，动作用动词开头（改、开、设、查、更），即构成可执行清单。"}},{"sec":"案例分析题","type":"案例分析题","num":1,"text":"学校“智慧图书馆”上线了自助借还：每本书贴RFID标签，学生把书放在感应区即可同时借还多本，系统自动更新库存并在超期时推送提醒。请回答：①RFID借还比“扫码逐本借还”好在哪两个地方？②系统用到了哪些传感器/识别技术（至少两类）；③分析这套系统的一个潜在风险与一条对策。","opts":[],"subs":[],"ans":"①非接触可批量：整摞书放上感应区一次性识别，无需逐本对准扫码，效率大幅提升；②RFID读写器与标签识别书籍身份、书架重力/红外感应区判断“书已放入”、时间系统记录借还时刻；③风险示例：标签脱落或屏蔽导致漏识别、借阅记录属个人隐私可能泄露。对策：定期巡检标签完好性、多天线覆盖减少漏读、借阅数据脱敏保存并限制访问权限。（①4分、②3分、③3分）","al":{"考查点":"RFID批处理优势＋多技术协同＋风险对策（评价）；跨课迁移——U2 RFID 与 U4 图书场景结合。","解题思路":"①优势落到“对比”上：RFID 借还非接触可批量——整摞书放感应区一次读完，无需逐本打开对准扫码；还可远距离识别，学生抱书走过即完成。②技术清单至少两类且说清分工：RFID 读写器＋书内标签（识别书籍身份）、感应区重力/光电传感器（确认书已放入）、系统时钟（记录借还时刻）。③风险与对策成对：标签脱落或金属屏蔽导致漏识别→定期巡检标签完好性、多天线覆盖减少盲区；借阅记录涉个人隐私→数据脱敏保存、仅授权人员可查。给分：①4分、②3分、③3分。","易错警示":"把 RFID 说成“扫条码”——RFID 的卖点恰是“不用逐本扫”；风险对策不配对；把“书丢了”写成风险而不给技术对策。","方法点拨":"“智慧场景分析三段式”：先讲技术优势（对比传统）→再列技术栈（各写分工）→最后风险对策成对（隐患→手段）。"}},{"sec":"案例分析题","type":"案例分析题","num":2,"text":"某智慧大棚公司的监控平台突然无法登录，管理员发现是“暴力猜密码”攻击：有人用程序每秒尝试几千次密码。请回答：①说出该平台可能被攻破的两个原因；②平台应采用哪些防护策略（至少三条，结合“安全防范四类策略”）；③为什么说“安全是动态过程”——请给这家公司提一条持续改进建议。","opts":[],"subs":[],"ans":"①可能原因：仍使用默认/弱密码、未限制登录失败次数、无双重验证、未及时更新平台固件。②防护：设置强密码（长且不重用）；开启双因素认证（密码＋短信/动态码）；限制登录尝试次数并启用账号锁定；及时更新补丁；按最小权限分配管理员账号（写足三条即可）。③安全没有一劳永逸：攻击手段不断翻新、新漏洞不断被发现，公司应建立定期渗透测试与漏洞监测机制，发现新风险立即评估、打补丁、再验证，形成闭环。（原因2分、策略4分、动态安全论述4分）","al":{"考查点":"暴力破解成因分析＋安全策略组合＋动态安全观（评价）；跨课迁移——U6 安全四类策略实战运用。","解题思路":"①成因从“暴露面”找：仍用默认/弱密码（字典可猜）、无登录失败次数限制（可无限试）、无双因素（只有一道门）、平台固件与补丁滞后（已知漏洞可乘）。②防护策略按四类策略展开且落到平台场景：强密码（长、随机、不重用）；双因素认证（密码＋短信/动态码）；限制尝试次数＋账号锁定（挡住暴力）；及时更新补丁；最小权限（管理员账号分开授权）。写足三条即可。③“安全是动态过程”要论述出“攻防永动”逻辑：攻击手段翻新、新漏洞不断披露，安全须“发现→评估→打补丁→再验证”循环迭代——建议公司建立定期渗透测试与漏洞监测机制。给分：原因2分、策略4分、动态论述4分。","易错警示":"原因只写“密码弱”一条；策略与四类策略脱节；动态论述只喊口号不给机制建议。","方法点拨":"暴力破解题“防御五板斧”：强密码＋双因素＋限次数＋锁账号＋勤补丁；动态安全论述锚点句：“没有一次修复，只有持续更新”。"}},{"sec":"综合实践题","type":"综合实践题","num":1,"text":"市里举办“智慧养老创意赛”，请你以“给独居的爷爷设计一套安全又贴心的智能看护方案”为题完成《方案设计书》：①画出系统框图（感知层/网络层/应用层分别部署什么，至少各写两项）；②用闭环文字流程描述“爷爷夜间在卧室摔倒”这一场景系统如何响应；③用价值四维（提效/降本/安全/便利）分析方案价值，并重点说明“便利”与“隐私”如何平衡；④指出方案两个可能失灵的场景并给出对策。","opts":[],"subs":[],"ans":"①感知层：红外人体传感器/毫米波存在感知（判断活动与跌倒）、门窗磁传感器、床头紧急按钮、智能手环（心率）；网络层：家庭Wi-Fi与4G/5G（断网时本地网关兜底）；应用层：家人手机App、社区监护平台、紧急联系人自动拨号。②闭环：毫米波/红外感知“长时间无活动或姿态异常”→信号经网络上传→平台结合心率数据判断疑似跌倒→推送告警并自动呼叫紧急联系人，同时启动声光提醒；爷爷按铃或恢复活动后系统解除告警并记录，持续巡检形成回路。③价值：安全——跌倒与异常及时救援；提效——家人不用时刻紧盯手机；降本——减少雇工与突发住院成本；便利——远程报平安、一键求助。便利与隐私平衡：只监测活动与心率等“安全必需”数据，不装摄像头拍生活；数据本地加密、可随时一键关闭；明示采集范围并让爷爷有“知情与拒绝”的权利。④失灵与对策：爷爷在沙发睡着被误判为跌倒→算法加“恢复活动确认”与时间窗口，配合紧急按钮人工确认；断网导致告警发不出→本地网关缓存并升级为“本地声光告警＋短信双通道”，保留传统电话求助。（框图4分、闭环4分、价值4分、隐私平衡4分、失灵与对策4分）","al":{"考查点":"适老化智能看护方案全要素设计（创造）；跨课迁移——三层架构＋闭环＋价值四维＋隐私伦理的全册收官综合。","解题思路":"①框图各层至少两项：感知层——红外人体/毫米波存在感知（活动与跌倒检测）、门窗磁传感器、床头紧急按钮、智能手环（心率）；网络层——家庭Wi-Fi＋4G/5G，断网时本地网关兜底；应用层——家人手机App、社区监护平台、紧急联系人自动拨号。②闭环文字流程写全“感知→判断→告警→解除→回环”：毫米波/红外感知“长时间无活动或姿态异常”→经网络上传→平台结合心率判断疑似跌倒→推送告警并自动呼叫紧急联系人＋声光提醒→爷爷按铃或恢复活动后解除告警、持续巡检形成回路。③价值四维各落一点（安全：跌倒及时救援；提效：家人不用紧盯手机；降本：减少雇工与突发住院；便利：远程报平安一键求助）；隐私平衡要“双给”：只测活动与心率等安全必需数据、不装摄像头；数据本地加密、可一键关闭；明示采集范围、给爷爷知情与拒绝权。④失灵各配对策：沙发午睡被误判跌倒→算法加“恢复活动确认”时间窗＋紧急按钮人工确认；断网告警发不出→本地网关缓存＋本地声光告警＋短信双通道＋保留传统电话。给分：框图4分、闭环4分、价值4分、隐私平衡4分、失灵对策4分。","易错警示":"框图少层或设备错层；闭环没有“解除告警”的收尾环节（缺闭环感）；隐私平衡只谈技术不谈“老人知情权”；失灵对策不具体。","方法点拨":"“适老方案设计”四段总模板：框图按层铺设备（至少各二）→挑险情写闭环（含解除回环）→价值四维＋隐私双给（数据最小化＋可关闭可拒绝）→两失灵两对策；这是全册“架构+闭环+伦理”三线并考的收官题，结构即框架分。"}}]}]}];
const app = {
    view: 'home',
    currentUnitIdx: -1,
    currentLessonIdx: -1,
    currentExamIdx: -1,
    history: ['home'],
    progress: {},   // {unitIdx_lessonIdx_qNum: 'right'/'wrong'/...}

    drawerMode: 'stats',

};

/* localStorage 键 */
const STORAGE_KEY = 'itq8_progress_v2';
const WRONG_KEY = 'itq8_wrongbook_v2';

function loadProgress() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) app.progress = JSON.parse(raw);
    } catch(e) {}
    try {
        const raw = localStorage.getItem(WRONG_KEY);
        if (raw) app.wrongBook = JSON.parse(raw);
    } catch(e) {}
}

function saveProgress() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(app.progress)); } catch(e) {}
}
function saveWrong() {
    try { localStorage.setItem(WRONG_KEY, JSON.stringify(app.wrongBook)); } catch(e) {}
}

loadProgress();
/* V2.1a 判分修复迁移：旧'回忆'题按错题本存答重判 + 主观题错题本冤案清洗 */
(function(){
    try {
        var norm = function(s){ return String(s || '').replace(/[（）()【】\[\]，。,、；;\s]/g, '').toLowerCase(); };
        var fuzzy = function(std, usr){
            if (!std || !usr) return false;
            if (usr === std) return true;
            var parts = std.split(/[、；;，,/]/).map(norm).filter(Boolean);
            if (parts.length >= 2) return parts.indexOf(usr) >= 0 || parts.every(function(p){ return usr.indexOf(p) >= 0; });
            var r = Math.min(usr.length, std.length) / Math.max(usr.length, std.length);
            return usr.length >= 2 && r >= 0.45 && (std.indexOf(usr) >= 0 || usr.indexOf(std) >= 0);
        };
        var ESSAY = ['提升','拓展','变式','间隔','简答题','案例分析题','综合实践题'];
        var ch = false;
        DATA.forEach(function(u, ui){ (u.lessons || []).forEach(function(l, li){ (l.qs || []).forEach(function(q, qi){
            if (q.type !== '回忆') return;
            var k = ui + '_' + li + '_' + qi;
            if (app.progress[k] !== 'partial') return;
            var wb = null;
            for (var i = 0; i < app.wrongBook.length; i++) {
                var it = app.wrongBook[i];
                if (it.unitIdx === ui && it.lessonIdx === li && it.qNum === qi) { wb = it; break; }
            }
            if (wb && fuzzy(norm(q.ans), norm(wb.userAnswer))) {
                app.progress[k] = 'right';
                app.wrongBook.splice(app.wrongBook.indexOf(wb), 1);
            } else if (wb) {
                app.progress[k] = 'wrong';
            } else {
                delete app.progress[k]; delete app.userAnswers[k];
            }
            ch = true;
        });});});
        var b = app.wrongBook.length;
        app.wrongBook = app.wrongBook.filter(function(it){
            var u = DATA[it.unitIdx]; var l = u && u.lessons ? u.lessons[it.lessonIdx] : null;
            var q = l && l.qs ? l.qs[it.qNum] : null;
            return !(q && (q.open || ESSAY.indexOf(q.type) >= 0));
        });
        if (b !== app.wrongBook.length) ch = true;
        if (ch) {
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify(app.progress)); } catch(e) {}
            try { localStorage.setItem(WRONG_KEY, JSON.stringify(app.wrongBook)); } catch(e) {}
        }
    } catch(e) {}
})();

/* ========= 工具函数 ========= */
function $(sel) { return document.querySelector(sel); }
function $$(sel) { return Array.from(document.querySelectorAll(sel)); }

function toast(msg, type='info') {
    const t = $('#toast');
    t.textContent = msg;
    t.className = 'toast show ' + type;
    setTimeout(() => { t.className = 'toast'; }, 2400);
}

function htmlEncode(s) {
    return String(s == null ? '' : s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

function escapeRegExp(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

function progressKey(ui, li, qn) { return `${ui}_${li}_${qn}`; }

function getStats() {
    const stats = { total: 0, right: 0, wrong: 0, partial: 0, view: 0, done: 0 };
    DATA.forEach((u, ui) => {
        u.lessons.forEach((l, li) => {
            l.qs.forEach((q, qi) => {
                if (q.open) return;
                stats.total++;
                const k = progressKey(ui, li, qi);
                const s = app.progress[k];
                if (s === 'right') stats.right++;
                else if (s === 'wrong') stats.wrong++;
                else if (s === 'partial') stats.partial++;
                else if (s === 'view') stats.view++;
                if (s) stats.done++;
            });
        });
    });
    stats.wrongBookSize = app.wrongBook.length;
    return stats;
}

function escapeShort(s, n = 30) {
    if (!s) return '';
    s = String(s).replace(/\s+/g, ' ').trim();
    return s.length > n ? s.slice(0, n) + '…' : s;
}

function renderQCard(q, ui, li, idx) {
    const k = progressKey(ui, li, idx);
    const status = app.progress[k];
    let statusClass = '';
    if (status === 'right') statusClass = 'q-status-right';
    else if (status === 'wrong') statusClass = 'q-status-wrong';
    else if (status === 'view' || status === 'partial') statusClass = 'q-status-done';
    const answered = !!status;

    const userAns = app.userAnswers[k];
    const correctAns = q.ans || '';
    const isChallenge = q.open;

    const TMAP = [
        [/^(单选|选择题)$/, 't-single', '🎯', '单选'],
        [/^(判断|判断题)$/, 't-judge', '⚖️', '判断'],
        [/^(填空|填空题)$/, 't-fill', '✏️', '填空'],
        [/^回忆$/, 't-recall', '🧠', '回忆'],
        [/^挑战$/, 't-hard', '⭐', '挑战'],
        [/^提升$/, 't-essay', '📝', '提升'],
        [/^拓展$/, 't-essay', '🚀', '拓展'],
        [/^变式$/, 't-essay', '🔁', '变式'],
        [/^间隔$/, 't-essay', '⏪', '间隔'],
        [/^错题$/, 't-essay', '🩺', '错题'],
        [/^分层$/, 't-essay', '🪜', '分层'],
    ];
    let tCls = 't-essay', tIc = '📌', tTxt = q.type;
    for (const [re, cls, ic, txt] of TMAP) { if (re.test(q.type)) { tCls = cls; tIc = ic; tTxt = txt; break; } }

    function bannerHtml() {
        if (isChallenge) return '<div class="q-banner half"><span class="ba-ic">✨</span>已查看参考方向 · 用自己的话组织答案更有收获</div>';
        if (status === 'right') return '<div class="q-banner right"><span class="ba-ic">🎉</span>答对了！本题已掌握，继续保持</div>';
        if (status === 'wrong') return '<div class="q-banner wrong"><span class="ba-ic">📒</span>答错了 · 已自动加入错题本，对照下方解析弄懂它</div>';
        if (status === 'partial') return '<div class="q-banner half"><span class="ba-ic">📝</span>主观题已记录 · 对照解析核对自己的思路要点</div>';
        if (status === 'view') return '<div class="q-banner half"><span class="ba-ic">👀</span>已查看答案 · 建议合上解析再独立做一遍</div>';
        return '';
    }

    const userMsg = userAns ? (status === 'right' ? `<span class="user-msg right">答: ${escapeShort(userAns, 14)}</span>` : (status === 'wrong' ? `<span class="user-msg wrong">答: ${escapeShort(userAns, 14)}</span>` : formatUserMsg(userAns))) : '';

    let html = `
    <div class="q-card ${statusClass} ${answered ? 'answered' : ''} ${isChallenge ? 'challenge' : ''}" id="q-${ui}-${li}-${idx}" data-num="${idx}">
        ${bannerHtml()}
        <div class="q-meta">
            <div class="q-tags">
                <span class="q-tag ${tCls}">${tIc} ${tTxt}</span>
                ${q.sec ? `<span class="q-tag">${escapeShort(q.sec, 8)}</span>` : ''}
                ${isChallenge ? '<span class="q-tag t-hard">⭐ 开放题</span>' : ''}
                ${userMsg}
            </div>
            <div class="q-num">#${q.num}</div>
        </div>
        <div class="q-text">${highlightBlank(escapeHtml(q.text))}</div>`;

    if (q.opts && q.opts.length > 0) {
        const m = correctAns && correctAns.match(/答案\s*([A-D])/);
        const correctLabel = m ? m[1] : '';
        html += `<div class="q-options">`;
        q.opts.forEach(o => {
            const selected = userAns === o.label;
            let optClass = '';
            if (status === 'right' && selected) optClass = 'is-selected is-correct';
            else if (status === 'wrong') {
                if (o.label === correctLabel) optClass = 'is-correct';
                else if (o.label === selected) optClass = 'is-wrong';
            } else if (selected) optClass = 'is-selected';
            html += `
                <div class="q-option ${optClass}" data-label="${o.label}">
                    <div class="marker">${o.label}</div>
                    <div class="text">${escapeHtml(o.text)}</div>
                </div>`;
        });
        html += `</div>`;
    } else if (q.type === '判断' || q.type === '判断题') {
        const v = correctAns.includes('√') ? '√' : '×';
        const picked = userAns;
        function jc(val) {
            if (status === 'right' && picked === val) return 'is-selected is-correct';
            if (status === 'wrong') { if (v === val) return 'is-correct'; if (picked === val) return 'is-wrong'; }
            if (picked === val) return 'is-selected';
            return '';
        }
        html += `<div class="q-options">
            <div class="q-option ${jc('√')}" data-label="√"><div class="marker">√</div><div class="text">正确</div></div>
            <div class="q-option ${jc('×')}" data-label="×"><div class="marker">×</div><div class="text">错误</div></div>
        </div>`;
    } else if (q.type === '填空' || q.type === '填空题') {
        html += `<input class="q-fill-input" type="text" placeholder="在此处填入你的答案…" value="${escapeAttr(userAns || '')}" ${answered ? 'disabled style="opacity:.75"' : ''}>`;
    } else {
        html += `<textarea class="q-fill-input" rows="3" placeholder="在下面写你的答案，再提交与标准答案对照…" ${answered ? 'disabled style="opacity:.75"' : ''}>${escapeHtml(userAns || '')}</textarea>`;
    }

    html += `<div class="q-actions">
        ${answered
            ? `<button class="btn btn-secondary hint-btn">${status === 'right' ? '✅ 已答对' : status === 'wrong' ? '📒 已入错题本' : status === 'partial' ? '📝 已记录' : '👀 已查看'} · 展开解析</button>`
            : (!isChallenge
                ? `<button class="btn btn-primary submit-btn">✓ 提交 · 判断对错</button>
                   <button class="btn btn-ghost hint-btn">👀 先看答案</button>`
                : `<button class="btn btn-secondary hint-btn">✨ 查看参考方向</button>`)}
        ${app.wrongBook.some(it => it.unitIdx === ui && it.lessonIdx === li && it.qNum === idx) ? '<button class="btn btn-ghost">📓 错题本中</button>' : ''}
    </div>`;

    html += renderAnalysis(q, isChallenge);
    html += `</div>`;
    return html;
}

function renderAnalysis(q, isChallenge) {
    let html = `<div class="analysis">`;
    if (isChallenge) {
        html += `<div class="analysis-title"><span class="at-ic">⭐</span>参考方向<span class="at-line"></span></div>`;
        html += `<div class="a-ans-box"><div class="a-ans-ic">💡</div><div><div class="a-ans-label">开放题 · 无标准答案</div><div class="a-ans-txt">按「问题定位 → 分条方案与理由 → 配图示/对比表」作答，能结合多课知识更佳。</div></div></div>`;
        html += `<div class="analysis-block t-point"><strong><span class="ab-ic">🎯</span>考查点</strong>跨课综合迁移 · 创造性方案设计</div>`;
        html += `<div class="analysis-block t-pit"><strong><span class="ab-ic">⚠️</span>作答建议</strong>结构完整（问题—方案—理由）比辞藻更重要；写完回读一遍检查逻辑。</div>`;
        html += `</div>`;
        return html;
    }
    if (!q.ans && !q.al) {
        html += `<div class="analysis-block t-pit"><strong><span class="ab-ic">📢</span>提示</strong>本题暂未配置标准答案，可参考教材或请教老师。</div>`;
        html += `</div>`;
        return html;
    }
    html += `<div class="analysis-title"><span class="at-ic">✨</span>五维深度解析<span class="at-line"></span></div>`;
    if (q.ans) {
        html += `<div class="a-ans-box"><div class="a-ans-ic">✓</div><div><div class="a-ans-label">正确答案</div><div class="a-ans-txt">${escapeHtml(q.ans)}</div></div></div>`;
    }
    const al = q.al || {};
    if (al.考查点) html += `<div class="analysis-block t-point"><strong><span class="ab-ic">🎯</span>考查点</strong>${escapeHtml(al.考查点)}</div>`;
    if (al.解题思路) html += `<div class="analysis-block t-way"><strong><span class="ab-ic">🧭</span>解题思路</strong>${escapeHtml(al.解题思路)}</div>`;
    if (al.逐项剖析) html += `<div class="analysis-block t-part"><strong><span class="ab-ic">🔬</span>逐项剖析</strong>${escapeHtml(al.逐项剖析)}</div>`;
    if (al.易错警示) html += `<div class="analysis-block t-pit"><strong><span class="ab-ic">⚠️</span>易错警示</strong>${escapeHtml(al.易错警示)}</div>`;
    if (al.方法点拨) html += `<div class="analysis-block t-method"><strong><span class="ab-ic">💡</span>方法点拨</strong>${escapeHtml(al.方法点拨)}</div>`;
    html += `</div>`;
    return html;
}

function renderWrongbook() {
    if (app.wrongBook.length === 0) {
        return `<div class="empty"><div class="icon">📓</div><div class="e-title">错题本是空的</div><p>作答被判错的题会自动归档到这里，方便你集中回炉、逐个攻克。</p>
        <div class="e-act"><button class="btn btn-primary" onclick="goHome()">🏠 去练几道题</button></div></div>`;
    }
    const list = app.wrongBook.slice().reverse();
    let html = `
    <div class="wb-head">
        <div class="wb-t">
            <div class="wb-ic">📓</div>
            <div>
                <h2>错题本</h2>
                <div class="wb-sub">作答被判错的题自动归档 · 点「重练」回到原题再战</div>
            </div>
        </div>
        <div style="display:flex;gap:9px;align-items:center;flex-wrap:wrap">
            <span class="wb-count">共 ${app.wrongBook.length} 道</span>
            <button class="btn btn-ghost" onclick="clearWrongbook()">🗑 清空</button>
        </div>
    </div>`;

    list.forEach(it => {
        const u = DATA[it.unitIdx];
        if (!u) return;
        const l = u.lessons[it.lessonIdx];
        const q = l && l.qs[it.qNum];
        if (!q) return;
        const tm = String(q.type || '').match(/^(单选|选择题)$/) ? '🎯' : String(q.type || '').match(/^(判断|判断题)$/) ? '⚖️' : '📝';
        const when = it.ts ? new Date(it.ts) : null;
        const whenTxt = when ? `${when.getMonth()+1}月${when.getDate()}日 ${String(when.getHours()).padStart(2,'0')}:${String(when.getMinutes()).padStart(2,'0')}` : '';
        html += `<div class="q-card wb-item">
            <div class="wb-src"><span class="q-tag t-hard">📒 错题</span><span>📍 ${escapeShort(u.t, 16)} / ${escapeShort(l.n || l.t, 18)}</span><span>#${q.num} · ${tm} ${escapeHtml(q.type || '')}</span>${whenTxt ? '<span style="margin-left:auto">🗓 ' + whenTxt + '</span>' : ''}</div>
            <div class="q-text" style="font-size:14.5px;margin-bottom:10px">${highlightBlank(escapeHtml(q.text))}</div>
            <div class="wb-compare">
                <div class="wb-yours"><b>✗ 你的答案</b>${escapeHtml(it.userAnswer || '（未作答）')}</div>
                <div class="wb-correct"><b>✓ 正确答案</b>${escapeHtml(q.ans || '')}</div>
            </div>
            <div class="q-actions" style="margin-top:13px">
                <button class="btn btn-primary" onclick="toQ(${it.unitIdx},${it.lessonIdx},${it.qNum})">↻ 重练本题</button>
                <button class="btn btn-secondary" onclick="toggleWbAna(event, this)">🔍 看解析</button>
                <button class="btn btn-ghost" onclick="removeWrong(${it.unitIdx},${it.lessonIdx},${it.qNum})">🗑 移出</button>
            </div>
            <div class="analysis" style="display:none">${buildAna(q)}</div>
        </div>`;
    });
    return html;
}

function buildAna(q) {
    if (!q.al) return '<div class="analysis-block t-point"><strong>提示</strong>暂无解析</div>';
    let h = '';
    const al = q.al;
    if (al.考查点) h += `<div class="analysis-block t-point"><strong><span class="ab-ic">🎯</span>考查点</strong>${escapeHtml(al.考查点)}</div>`;
    if (al.解题思路) h += `<div class="analysis-block t-way"><strong><span class="ab-ic">🧭</span>解题思路</strong>${escapeHtml(al.解题思路)}</div>`;
    if (al.逐项剖析) h += `<div class="analysis-block t-part"><strong><span class="ab-ic">🔬</span>逐项剖析</strong>${escapeHtml(al.逐项剖析)}</div>`;
    if (al.易错警示) h += `<div class="analysis-block t-pit"><strong><span class="ab-ic">⚠️</span>易错警示</strong>${escapeHtml(al.易错警示)}</div>`;
    if (al.方法点拨) h += `<div class="analysis-block t-method"><strong><span class="ab-ic">💡</span>方法点拨</strong>${escapeHtml(al.方法点拨)}</div>`;
    return h;
}
function toggleWbAna(ev, btn) {
    ev.stopPropagation();
    const ana = btn.closest('.q-card').querySelector('.analysis');
    if (ana) ana.style.display = ana.style.display === 'none' ? 'block' : 'none';
}

function highlightBlank(s) {
    return s.replace(/_{2,}|____/g, '<span class="blank"></span>');
}

function escapeHtml(s) {
    return String(s == null ? '' : s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
}
function escapeAttr(s) {
    return escapeHtml(s).replace(/"/g, '&quot;');
}

function formatUserMsg(ans) {
    if (!ans) return '';
    if (ans.length > 16) return `<span class="user-msg partial">答: ${escapeShort(ans, 12)}</span>`;
    return `<span class="user-msg partial">答: ${escapeHtml(ans)}</span>`;
}

/* ========= V3 工具：界面刷新 / 导航 / 统计抽屉 ========= */
function numAnim(el, to, suf) {
    if (!el) return;
    const dur = 850, t0 = performance.now(), from = 0;
    function step(t) {
        const p = Math.min(1, (t - t0) / dur);
        const e = 1 - Math.pow(1 - p, 3);
        el.textContent = Math.round(from + (to - from) * e) + (suf || '');
        if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
}

function updateChrome() {
    const st = getStats();
    const pct = st.total ? Math.round(st.done / st.total * 100) : 0;
    const bar = document.getElementById('topProgBar');
    if (bar) bar.style.width = pct + '%';
    const wb = document.getElementById('wbBadge');
    if (wb) { wb.textContent = st.wrongBookSize; wb.style.display = st.wrongBookSize ? 'grid' : 'none'; }
    document.body.classList.toggle('qdock-on', app.view === 'lesson');
    if (app.view === 'lesson') fillDock();
    if (app.view === 'lesson') {
        const u = DATA[app.currentUnitIdx], l = u && u.lessons[app.currentLessonIdx];
        if (l) document.title = `${l.n || l.t} · 信息科技练习`;
    } else document.title = '信息科技 · 八年级全册练习系统';
}

function dockToggle() {
    const d = document.getElementById('qdock');
    if (d) d.classList.toggle('min');
}
function dockGo(qi) {
    const t = document.getElementById(`q-${app.currentUnitIdx}-${app.currentLessonIdx}-${qi}`);
    if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' });
    const d = document.getElementById('qdock');
    if (d && d.classList.contains('min')) d.classList.remove('min');
    document.querySelectorAll('.qdock .q-jump-item.cur').forEach(x => x.classList.remove('cur'));
    const it = document.querySelector(`.qdock .q-jump-item[data-jump="${qi}"]`);
    if (it) it.classList.add('cur');
}
function fillDock() {
    if (app.view !== 'lesson') return;
    const u = DATA[app.currentUnitIdx];
    const l = u && u.lessons[app.currentLessonIdx];
    const grid = document.getElementById('qdGrid');
    if (!l || !grid) return;
    const state = document.getElementById('qdState');
    let done = 0, total = 0, html = '';
    l.qs.forEach((q, qi) => {
        if (q.open) return;
        total++;
        const s = app.progress[progressKey(app.currentUnitIdx, app.currentLessonIdx, qi)];
        if (s) done++;
        let cls = s === 'right' ? 'done' : s === 'wrong' ? 'wrong' : (s === 'partial' || s === 'view') ? 'half' : '';
        html += `<div class="q-jump-item ${cls}" data-jump="${qi}" onclick="dockGo(${qi})">${qi + 1}</div>`;
    });
    grid.innerHTML = html;
    if (state) state.textContent = `${done}/${total} 已做`;
}

function goContinue() {
    let first = null;
    for (let ui = 0; ui < DATA.length; ui++) {
        const u = DATA[ui];
        for (let li = 0; li < u.lessons.length; li++) {
            const l = u.lessons[li];
            if (!first && !l.isExam) first = { ui, li };
            for (let qi = 0; qi < l.qs.length; qi++) {
                if (l.qs[qi].open) continue;
                if (!app.progress[progressKey(ui, li, qi)]) { toQ(ui, li, qi); return; }
            }
        }
    }
    if (first) { toQ(first.ui, first.li, 0); toast('🎉 全册基本练完，从第一课开始巩固', 'success'); }
    else toast('🎉 恭喜！所有题目都已作答，去错题本巩固吧', 'success');
}

function backToUnit() {
    app.currentLessonIdx = -1;
    app.view = 'unit';
    app.history.push('unit');
    render();
}

function toQ(ui, li, qi) {
    app.currentUnitIdx = ui;
    app.currentLessonIdx = li;
    app.view = 'lesson';
    render();
    setTimeout(() => {
        const t = document.getElementById(`q-${ui}-${li}-${qi}`);
        if (t) { t.scrollIntoView({ behavior: 'smooth', block: 'start' }); t.classList.add('animate-pop'); }
    }, 420);
}

function removeWrong(ui, li, qi) {
    app.wrongBook = app.wrongBook.filter(it => !(it.unitIdx === ui && it.lessonIdx === li && it.qNum === qi));
    saveWrong();
    render();
    toast('已从错题本移出', 'info');
}

function fillDrawer() {
    const st = getStats();
    const pct = st.total ? Math.round(st.done / st.total * 100) : 0;
    const acc = (st.right + st.wrong) ? Math.round(st.right / (st.right + st.wrong) * 100) : 0;
    const accCls = acc >= 80 ? 'ok' : acc >= 50 ? 'war' : 'bad';
    let h = `<div class="dr-overview">
        <div class="dr-ov-card inf"><b>${pct}%</b><span>总完成度</span></div>
        <div class="dr-ov-card ${accCls}"><b>${acc}%</b><span>作答正确率</span></div>
        <div class="dr-ov-card ok"><b>${st.right}</b><span>答对</span></div>
        <div class="dr-ov-card bad"><b>${st.wrong}</b><span>答错</span></div>
    </div>`;
    const CN = ['零','一','二','三','四','五','六'];
    const IC = ['', '🌐', '🧭', '⚡', '🎨', '🚀', '🛡️', '🏆'];
    DATA.forEach((u, ui) => {
        let total = 0, done = 0, rw = 0;
        u.lessons.forEach((l, li) => l.qs.forEach((q, qi) => {
            if (q.open) return;
            total++;
            const s = app.progress[progressKey(ui, li, qi)];
            if (s) done++;
            if (s === 'right') rw++;
        }));
        const up = total ? Math.round(done / total * 100) : 0;
        const uNo = u.isFinal ? 7 : parseInt((String(u.t).match(/第([一二三四五六])\s*单元/) || [])[1] === undefined ? 0 : CN.indexOf(String(u.t).match(/第([一二三四五六])\s*单元/)[1]) + 1) || 0;
        const name = String(u.t).replace(/^第\s*[一二三四五六]\s*单元\s*/, '').slice(0, 12);
        h += `<div class="dr-unit">
            <div class="du-top"><b>${IC[uNo] || '📦'} ${escapeShort(u.t, 20)}</b><span>${done}/${total} · ${up}%</span></div>
            <div class="du-track"><i style="width:${up}%"></i></div>
        </div>`;
    });
    h += `<div class="ai-hint" style="margin-top:18px"><span class="hint-ic">🧠</span><div><b>学习科学提示</b>：检索练习每做一题都是记忆加固；做错的题间隔 1-2 天回炉一次，掌握更牢。</div></div>`;
    document.getElementById('drBody').innerHTML = h;
}
function openDrawer(mode) {
    mode = mode || 'stats';
    const d = document.getElementById('drawer');
    if (d.classList.contains('on') && app.drawerMode === mode) { closeDrawer(); return; }
    app.drawerMode = mode;
    const t = document.getElementById('drTitle');
    if (mode === 'catalog') { if (t) t.textContent = '📚 课时目录'; fillCatalog(); }
    else { if (t) t.textContent = '📊 学习统计'; fillDrawer(); }
    d.classList.add('on');
    document.getElementById('drMask').classList.add('on');
}
function fillCatalog() {
    const CN = ['一','二','三','四','五','六'];
    const IC = ['', '🌐', '🧭', '⚡', '🎨', '🚀', '🛡️', '🏆'];
    let h = '<div class="dr-scroll">';
    DATA.forEach((u, ui) => {
        const uNo = u.isFinal ? 7 : (CN.indexOf((String(u.t).match(/第([一二三四五六])\s*单元/) || ['', ''])[1]) + 1) || 0;
        h += `<div class="cat-unit">${IC[uNo] || '📦'} ${escapeShort(u.t, 22)} <span class="cat-bar"></span></div>`;
        u.lessons.forEach((l, li) => {
            const qc = l.qs.filter(x => !x.open).length;
            const exam = l.isExam ? 'is-exam' : '';
            const no = lessonNo(l) ? '第 ' + lessonNo(l) + ' 课' : (l.isExam ? '★ 达标' : '课时');
            const name = l.isExam ? '单元达标检测卷' : (l.n || l.t);
            h += `<div class="cat-lesson ${exam}" onclick="toQ(${ui},${li},0);closeDrawer()">
                <span class="cl-no">${no}</span><span class="cl-name">${escapeShort(name, 22)}</span><span class="cl-meta">${qc} 题</span>
            </div>`;
        });
    });
    h += '</div>';
    document.getElementById('drBody').innerHTML = h;
}
function printLesson() {
    if (app.view === 'lesson') { toast('🖨 正在准备打印…', 'info'); setTimeout(() => window.print(), 350); }
    else toast('请先进入一个课时再打印', 'warn');
}
function resetLesson() {
    const ui = app.currentUnitIdx, li = app.currentLessonIdx;
    const l = DATA[ui] && DATA[ui].lessons[li];
    if (!l) return;
    if (!confirm(`确定重做「${l.n || l.t}」？本课作答记录与错题将清空。`)) return;
    l.qs.forEach((q, qi) => {
        const k = progressKey(ui, li, qi);
        delete app.progress[k]; delete app.userAnswers[k];
    });
    app.wrongBook = app.wrongBook.filter(it => !(it.unitIdx === ui && it.lessonIdx === li));
    streak = 0;
    saveProgress(); saveWrong();
    render();
    toast('↺ 本课已重置，重新开始吧', 'info');
}
function closeDrawer() {
    document.getElementById('drawer').classList.remove('on');
    document.getElementById('drMask').classList.remove('on');
}

/* ========= 事件绑定 ========= */
function attachEvents() {
    // 单元卡片
    $$('.unit-card').forEach(el => {
        el.addEventListener('click', () => {
            app.currentUnitIdx = +el.dataset.uidx;
            app.currentLessonIdx = -1;
            app.history.push('unit');
            app.view = 'unit';
            render();
        });
    });
    // 课时卡片
    $$('.lesson-card').forEach(el => {
        el.addEventListener('click', () => {
            app.currentLessonIdx = +el.dataset.lidx;
            app.history.push('lesson');
            app.view = 'lesson';
            render();
        });
    });
    // 选项点击
    $$('.q-option').forEach(opt => {
        opt.addEventListener('click', e => {
            const card = opt.closest('.q-card');
            if (card.classList.contains('answered')) return;
            const label = opt.dataset.label;
            const qNum = +card.dataset.num;
            card.querySelectorAll('.q-option').forEach(o => o.classList.remove('is-selected'));
            opt.classList.add('is-selected');
            const k = progressKey(app.currentUnitIdx, app.currentLessonIdx, qNum);
            app.userAnswers[k] = label;
            saveProgress();
        });
    });
    // 提交答案 + 判断对错
    $$('.submit-btn').forEach(btn => {
        btn.addEventListener('click', e => {
            const card = btn.closest('.q-card');
            const qNum = +card.dataset.num;
            const u = DATA[app.currentUnitIdx];
            const l = u.lessons[app.currentLessonIdx];
            const q = l.qs[qNum];
            const k = progressKey(app.currentUnitIdx, app.currentLessonIdx, qNum);
            const userAns = app.userAnswers[k];
            if (!userAns || !String(userAns).trim()) { toast('请先选择或填写答案', 'warn'); return; }

            let isRight = false, isPartial = false;
            if (q.type === '判断' || q.type === '判断题') {
                const correct = q.ans && ((q.ans.includes('√') && userAns === '√') || (q.ans.includes('×') && userAns === '×'));
                isRight = !!correct;
            } else if (q.type === '单选' || q.type === '选择题') {
                const m = q.ans && q.ans.match(/答案\s*([A-D])/);
                const correctLabel = m ? m[1] : '';
                isRight = userAns === correctLabel;
            } else if (q.type === '填空' || q.type === '填空题' || q.type === '回忆') {
                const norm = s => String(s || '').replace(/[（）()【】\[\]，。,、；;\s]/g, '').toLowerCase();
                const std = norm(q.ans), usr = norm(userAns);
                if (std && usr) {
                    if (usr === std) { isRight = true; }
                    else {
                        const parts = std.split(/[、；;，,/]/).map(norm).filter(Boolean);
                        if (parts.length >= 2) { isRight = parts.includes(usr) || parts.every(p => usr.includes(p)); }
                        else {
                            const ratio = Math.min(usr.length, std.length) / Math.max(usr.length, std.length);
                            isRight = usr.length >= 2 && ratio >= 0.45 && (std.includes(usr) || usr.includes(std));
                        }
                    }
                }
                isPartial = !isRight && String(userAns).trim().length > 0;
            } else {
                isPartial = true; isRight = false;
            }

            // 选项着色
            if (q.opts && q.opts.length > 0) {
                const m = q.ans && q.ans.match(/答案\s*([A-D])/);
                const correctLabel = m ? m[1] : '';
                card.querySelectorAll('.q-option').forEach(o => {
                    o.classList.remove('is-selected', 'is-wrong');
                    if (o.dataset.label === correctLabel) o.classList.add('is-correct');
                    else if (o.dataset.label === userAns && !isRight) o.classList.add('is-wrong');
                });
            }
            if (q.type === '判断' || q.type === '判断题') {
                const v = q.ans && q.ans.includes('√') ? '√' : '×';
                card.querySelectorAll('.q-option').forEach(o => {
                    o.classList.remove('is-selected', 'is-wrong');
                    if (o.dataset.label === v) o.classList.add('is-correct');
                    else if (o.dataset.label === userAns && !isRight) o.classList.add('is-wrong');
                });
            }

            if (isRight) app.progress[k] = 'right';
            else if (isPartial) app.progress[k] = 'partial';
            else app.progress[k] = 'wrong';

            if (!isRight && q.ans && !q.open && ['提升','拓展','变式','间隔','简答题','案例分析题','综合实践题'].indexOf(q.type) < 0) {
                const ex = app.wrongBook.find(it => it.unitIdx === app.currentUnitIdx && it.lessonIdx === app.currentLessonIdx && it.qNum === qNum);
                if (ex) { ex.userAnswer = userAns; ex.ts = Date.now(); }
                else { app.wrongBook.push({ unitIdx: app.currentUnitIdx, lessonIdx: app.currentLessonIdx, qNum, userAnswer: userAns, correctAnswer: q.ans, ts: Date.now() }); }
                saveWrong();
            }
            saveProgress();

            // 连对激励 + 本课通关庆祝
            if (isRight) { streak++; if (streak >= 3 && streak % 3 === 0) toast(`🔥 连对 ${streak} 题，手感火热！`, 'success'); }
            else streak = 0;
            let allDone = true;
            l.qs.forEach((qq, qqi) => { if (!qq.open && !app.progress[progressKey(app.currentUnitIdx, app.currentLessonIdx, qqi)]) allDone = false; });
            if (allDone && !app.lessonCelebrated) {
                app.lessonCelebrated = true;
                const dl = document.querySelector('.lesson-header h2');
                const nm = dl ? dl.textContent : (l.n || '本课');
                setTimeout(() => toast(`🏆 恭喜完成「${nm.slice(0, 18)}」！全部 ${l.qs.filter(x=>!x.open).length} 题已作答`, 'success'), 900);
            }

            // 视觉：结果横幅 + 锁定
            card.classList.add('answered', isRight ? 'q-status-right' : isPartial ? 'q-status-done' : 'q-status-wrong');
            const oldB = card.querySelector('.q-banner'); if (oldB) oldB.remove();
            const b = document.createElement('div');
            if (isRight) { b.className = 'q-banner right'; b.innerHTML = '<span class="ba-ic">🎉</span>答对了！本题已掌握，继续保持'; }
            else if (isPartial) { b.className = 'q-banner half'; b.innerHTML = '<span class="ba-ic">📝</span>主观题已记录 · 对照解析核对自己的思路要点'; }
            else { b.className = 'q-banner wrong'; b.innerHTML = '<span class="ba-ic">📒</span>答错了 · 已自动加入错题本，对照下方解析弄懂它'; }
            card.prepend(b);

            card.querySelectorAll('.q-actions .btn').forEach(x => { x.disabled = true; x.classList.add('answered'); });
            const ana = card.querySelector('.analysis');
            if (ana) ana.classList.add('show');
            fillDock(); updateChrome();
            toast(isRight ? '🎉 答对了！' : (isPartial ? '📝 已记录' : '📒 答错 · 已入错题本'), isRight ? 'success' : (isPartial ? 'info' : 'danger'));
        });
    });
    // 只看答案 / 展开解析
    $$('.hint-btn').forEach(btn => {
        btn.addEventListener('click', e => {
            const card = btn.closest('.q-card');
            const ana = card.querySelector('.analysis');
            if (ana) ana.classList.toggle('show');
            const k = progressKey(app.currentUnitIdx, app.currentLessonIdx, +card.dataset.num);
            if (!app.progress[k]) {
                app.progress[k] = 'view';
                card.classList.add('q-status-done');
                saveProgress();
                fillDock(); updateChrome();
            }
        });
    });
    // 填空/简答输入
    $$('.q-fill-input').forEach(input => {
        input.addEventListener('input', e => {
            const card = input.closest('.q-card');
            const k = progressKey(app.currentUnitIdx, app.currentLessonIdx, +card.dataset.num);
            app.userAnswers[k] = input.value;
            saveProgress();
        });
        input.addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey && input.tagName === 'INPUT') {
                e.preventDefault();
                const sb = input.closest('.q-card').querySelector('.submit-btn');
                if (sb) sb.click();
            }
        });
    });
}

/* ========= 全局动作 ========= */
function goHome() {
    app.view = 'home';
    app.currentUnitIdx = -1;
    app.currentLessonIdx = -1;
    app.history = ['home'];
    render();
}
function showWrongbook() {
    app.view = 'wrongbook';
    app.currentUnitIdx = -1;
    app.currentLessonIdx = -1;
    app.history.push('wrongbook');
    render();
}
function toggleStats() { openDrawer('stats'); }
function toggleTheme() {
    document.body.classList.toggle('light');
    const light = document.body.classList.contains('light');
    try { localStorage.setItem('itq_theme', light ? 'light' : 'dark'); } catch (e) {}
    toast(light ? '☀️ 已切换浅色护眼主题' : '🌙 已切换深色专注主题', 'info');
}
function clearWrongbook() {
    if (confirm('确定清空错题本？此操作不可恢复')) {
        app.wrongBook = [];
        saveWrong();
        render();
    }
}

/* ========= 启动 ========= */
(function init() {
    try { if (localStorage.getItem('itq_theme') === 'light') document.body.classList.add('light'); } catch (e) {}
    updateChrome();
    render();
})();

/* ========= 键盘导航：课时内上下翻题 ========= */
document.addEventListener('keydown', e => {
    if (app.view !== 'lesson') return;
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    const k = e.key;
    if (k !== 'ArrowDown' && k !== 'ArrowUp' && k !== 'ArrowRight' && k !== 'ArrowLeft') return;
    const cards = $$('.q-card');
    if (cards.length < 2) return;
    let cur = 0, bestD = 1e9;
    cards.forEach((c, i) => { const r = c.getBoundingClientRect(); if (r.top > -60) { const d = Math.abs(r.top - 100); if (d < bestD) { bestD = d; cur = i; } } });
    let go = cur;
    if (k === 'ArrowDown' || k === 'ArrowRight') go = Math.min(cards.length - 1, cur + 1);
    else if (k === 'ArrowUp' || k === 'ArrowLeft') go = Math.max(0, cur - 1);
    if (go !== cur) { e.preventDefault(); cards[go].scrollIntoView({ behavior: 'smooth', block: 'start' }); }
    const d = document.getElementById('qdock'); if (d && d.classList.contains('min')) d.classList.remove('min');
    document.querySelectorAll('.qdock .q-jump-item.cur').forEach(x => x.classList.remove('cur'));
    const it = document.querySelector(`.qdock .q-jump-item[data-jump="${go}"]`);
    if (it) it.classList.add('cur');
});

/* 路由：浏览器返回按钮 */
window.addEventListener('popstate', e => {
    app.history.pop();
    const v = app.history[app.history.length - 1] || 'home';
    app.view = v;
    render();
});

</script>
<script id="__AGNES_XL__">
(function(){
  if(location.protocol!=="http:" && location.protocol!=="https:") return;
  var m=location.hostname.match(/^\d+(\.\d+)+$/);
  if(!m) return;
  var S=location.protocol+"//"+m[0]+":8001";
  var last=0;
  function beat(){
    var now=Date.now();if(now-last<20000)return;last=now;
    var data={file:document.title.slice(0,60),ts:now};
    try{
      var keys=Object.keys(localStorage).filter(function(k){
        return /save|dash|prof|streak|exp|star|study|xq|score|progress|quiz|learn/i.test(k);
      });
      keys.forEach(function(k){
        try{data[k]=localStorage.getItem(k).slice(0,5000);}catch(e){}
      });
    }catch(e){}
    try{var x=new XMLHttpRequest();x.open("POST",S+"/beat");x.setRequestHeader("Content-Type","application/json");x.send(JSON.stringify(data));}catch(e){}
  }
  document.addEventListener("visibilitychange",function(){if(!document.hidden)beat();});
  setInterval(function(){beat();},25000);
  window.addEventListener("pagehide",function(){try{beat();}catch(e){}});
  setTimeout(beat,1500);
})();
</script>
