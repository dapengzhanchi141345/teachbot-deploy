网络层"},{"label":"C","text":"应用层"},{"label":"D","text":"管理层"}],"subs":[],"ans":"答案A　感知层","al":{"考查点":"三层架构各层职责（识记）。","解题思路":"采集数据的动作发生在最底层的感知层——传感器在这层工作。","易错警示":"处理与展示属于应用层，别与采集混淆。","方法点拨":"“采集→感知、传输→网络、处理→应用”三对应直接对号。"}},{"sec":"选择题","type":"选择题","num":2,"text":"下列设备中，最符合物联网“三条件”的是：","opts":[{"label":"A","text":"靠遥控器控制的玩具车"},{"label":"B","text":"会语音应答并联动家电的智能音箱"},{"label":"C","text":"定时自动断电的普通插座"},{"label":"D","text":"手动开关的台灯"}],"subs":[],"ans":"答案B　会语音应答并联动家电的智能音箱","al":{"考查点":"物联网三条件应用判别（应用）。","解题思路":"逐条套三条件：智能音箱能收音（感知）、联网、自动应答并控家电，三条件齐。","逐项剖析":"遥控玩具车靠人按不自动；定时插座不感知不联网；台灯纯手动——均缺条件。","方法点拨":"判别题打钩三条件，缺一即否。"}},{"sec":"选择题","type":"选择题","num":3,"text":"人的皮肤能感知冷热，最像下列哪种传感器？","opts":[{"label":"A","text":"光线传感器"},{"label":"B","text":"温度传感器"},{"label":"C","text":"超声波传感器"},{"label":"D","text":"红外人体传感器"}],"subs":[],"ans":"答案B　温度传感器","al":{"考查点":"人体感官与传感器类比（理解）。","解题思路":"皮肤感知冷热对应温度传感器。","逐项剖析":"光→眼睛、回声→蝙蝠、人体红外→热感，均不对应皮肤。","方法点拨":"感官类比表：肤→温、眼→光、耳→声、鼻→气。"}},{"sec":"选择题","type":"选择题","num":4,"text":"“今天下午3点教室后排26.5℃”比“26.5”更有价值，原因是前者：","opts":[{"label":"A","text":"数字更大"},{"label":"B","text":"带有单位、时刻、点位等上下文，能支撑判断与决策"},{"label":"C","text":"是手机测的更准"},{"label":"D","text":"经过了取平均"}],"subs":[],"ans":"答案B　带有单位、时刻、点位等上下文，能支撑判断与决策","al":{"考查点":"数据与信息的区别（理解）。","解题思路":"带单位时刻点位才有上下文、可支撑决策——这正是信息与孤立数字的区别。","逐项剖析":"A 数字大与小无关；C 手机测不保证规范；D 是否取平均题干未提——B 是本质。","方法点拨":"“哪个更有价值”看是否带完整上下文。"}},{"sec":"选择题","type":"选择题","num":5,"text":"自动卷帘系统的闭环顺序是：","opts":[{"label":"A","text":"反馈→处理→传输→感知"},{"label":"B","text":"感知→传输→处理→反馈"},{"label":"C","text":"传输→感知→反馈→处理"},{"label":"D","text":"处理→感知→传输→反馈"}],"subs":[],"ans":"答案B　感知→传输→处理→反馈","al":{"考查点":"闭环顺序（识记）。","解题思路":"固定顺序感知→传输→处理→反馈，之后循环。","逐项剖析":"其余选项顺序错乱（反馈在最后、感知在最前）。","方法点拨":"记住“感传处馈”四字环，选项一列即排错。"}},{"sec":"选择题","type":"选择题","num":6,"text":"智能手环把心率数据上传云端后若防护不足，最可能带来的风险是：","opts":[{"label":"A","text":"手环没电"},{"label":"B","text":"健康数据泄露，被用于不当用途"},{"label":"C","text":"测不准心率"},{"label":"D","text":"无法计步"}],"subs":[],"ans":"答案B　健康数据泄露，被用于不当用途","al":{"考查点":"物联网风险的辩证认识（理解）。","解题思路":"健康数据敏感，云端防护不足会被窃取滥用——便利与风险并存。","逐项剖析":"A 缺电、C 测不准、D 无法计步都是功能问题，与“上传云端”风险无关。","方法点拨":"凡问“上传云端”的隐患，优先想数据泄露与滥用。"}},{"sec":"判断题","type":"判断题","num":1,"text":"物联网是“互联网的升级版”，两者只是称呼不同。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"物联vs互联的辨析（理解）。","解题思路":"服务对象不同：互联网连人找人找信息，物联网连物自动响应——不是升级版。","方法点拨":"判断题“只是”句式抹平区别，多为错。"}},{"sec":"判断题","type":"判断题","num":2,"text":"传感器只负责“感觉到”，思考和判断由处理器完成。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"传感器与处理器分工（理解）。","解题思路":"传感器只管感觉到并转信号，思考判断归芯片。","方法点拨":"“感觉”归传感器、“思考”归芯片。"}},{"sec":"判断题","type":"判断题","num":3,"text":"记录环境数据时，只要数字没错，单位写不写无所谓。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"数据记录规范（理解）。","解题思路":"无单位数据无法判断大小含义（26℃与26%天差地别）。","方法点拨":"“单位写不写无所谓”与规范四要素直接冲突。"}},{"sec":"判断题","type":"判断题","num":4,"text":"物联网应用价值与风险并存，应辩证看待并负责任地使用。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"价值的辩证认识（理解）。","解题思路":"技术本身无好坏，关键在如何使用——两面兼顾是正确态度。","方法点拨":"涉及“价值与风险”的判断题，辩证表述多为√。"}},{"sec":"判断题","type":"判断题","num":5,"text":"智能空调自动恒温属于“闭环”，遥控风扇则属于“单向控制”。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"闭环vs单向（理解）。","解题思路":"智能空调感知判断再制冷形成回路；遥控风扇人按才动属单向。","方法点拨":"看有没有“自动反馈”，有即闭环。"}},{"sec":"填空题","type":"填空题","num":1,"text":"物联网系统要成立必须同时具备能____、能联网、能自动反应三个条件。","opts":[],"subs":[],"ans":"感知","al":{"考查点":"三要素识记。","解题思路":"三个条件：感知、联网、自动反应，题空前两已有。"}},{"sec":"填空题","type":"填空题","num":2,"text":"传感器的作用是感知物理量并把它转换成____。","opts":[],"subs":[],"ans":"电信号","al":{"考查点":"传感器机制识记。","解题思路":"传感器把物理量转换成电信号。"}},{"sec":"填空题","type":"填空题","num":3,"text":"“三步采数法”是定点、____、定记。","opts":[],"subs":[],"ans":"定时","al":{"考查点":"三步采数法识记。","解题思路":"定点、定时、定记，缺“定时”。"}},{"sec":"填空题","type":"填空题","num":4,"text":"分析物联网应用价值常用“提效、降本、____、便利”四维卡。","opts":[],"subs":[],"ans":"安全","al":{"考查点":"价值四维识记。","解题思路":"提效、降本、安全、便利四维，缺“安全”。"}},{"sec":"填空题","type":"填空题","num":5,"text":"物联网闭环的最后一步是____，它让系统能根据结果自动调整。","opts":[],"subs":[],"ans":"反馈","al":{"考查点":"闭环四要素识记。","解题思路":"闭环最后一步是反馈，让系统根据结果自动调整。"}},{"sec":"填空题","type":"填空题","num":6,"text":"在电脑里1:1模拟真实系统并先演练再执行的物联网技术叫____。","opts":[],"subs":[],"ans":"数字孪生","al":{"考查点":"数字孪生识记。","解题思路":"1:1虚拟镜像＋先演练后执行＝数字孪生。"}},{"sec":"简答题","type":"简答题","num":1,"text":"用“寄快递”类比写出物联网三层架构的名称，并各用一句话说明其职责。","opts":[],"subs":[],"ans":"感知层（填单子知道寄什么）——用传感器采集环境信息；网络层（快递运输）——把数据传送到平台；应用层（驿站扫码通知）——处理数据并向用户提供服务。（要点齐全、类比贴切即给分）","al":{"考查点":"三层架构类比表述（应用）。","解题思路":"用寄快递三环节逐一映射三层并写职责，句式“××层（类比）——职责”。","易错警示":"只写名称不写职责会丢分。","方法点拨":"答题模板：感知层（填单子）采信息；网络层（运输）传数据；应用层（驿站通知）处理服务。"}},{"sec":"简答题","type":"简答题","num":2,"text":"请用“功能—价值—风险”完整分析“共享单车扫码开锁”，并说明它与家里“遥控玩具车”在本质上有什么不同。","opts":[],"subs":[],"ans":"功能：车锁含定位通信模块能联网，扫码后云端验证下发开锁指令，锁具自动开锁并上报位置；价值：解决短途出行、缓解拥堵、App找车便利；风险：押金与个人信息安全、乱停放管理。本质不同：共享单车是物自动响应（感知联网＋云端验证＋自动开锁）的物联网闭环，遥控玩具车靠人手遥控、不联网不自感知，属于单向控制。（四要素与对比完整即给分）","al":{"考查点":"价值风险框架＋闭环本质的综合（分析）。","解题思路":"前半按“功能—价值—风险”写共享单车；后半对比本质：单车是“感知联网＋云端验证＋自动开锁”的闭环，玩具车是“人遥控”的单向控制。","易错警示":"“本质不同”必须点出闭环vs单向，只描述现象不够。","方法点拨":"两问分开答：框架三栏＋对比落到“自动闭环vs人工单向”。"}},{"sec":"案例分析题","type":"案例分析题","num":1,"text":"寿光张大爷的蔬菜大棚装上了物联网系统：土壤湿度传感器实时上报数据，湿度低于设定值就自动滴灌，达到适宜范围自动停止；温度过高自动卷帘通风，并给张大爷手机发降温提醒。请回答：①该系统用到了哪些传感器，各感知什么？②画出它“感知—传输—处理—反馈”的闭环（用文字说明各步）。③该系统给张大爷带来了哪些价值？还可能带来什么风险？","opts":[],"subs":[],"ans":"①土壤湿度传感器感知土壤墒情，温度传感器感知棚内温度（答光照传感器等合理也给分）。②感知：传感器采集湿度/温度→传输：数据经无线网络传到控制平台→处理：平台与设定阈值比对，判断是否滴灌或卷帘→反馈：自动打开滴灌阀门/卷帘电机，并给手机发提醒；执行后传感器再感知，形成闭环。③价值：提效（免凌晨跑棚卷帘）、降本（按需滴灌省水省肥）、安全（冻害高温预警）；风险：设备故障或断网时无人值守、数据平台被入侵可能导致误操作，需定期维护并保留手动应急开关。（要点分步给分：传感器2分、闭环4分、价值3分、风险2分、表达与完整4分）","al":{"考查点":"本地农业案例的闭环拆解与价值风险分析（分析·应用）。","解题思路":"①传感器按“感知什么”对号（湿度/温度/光照）；②闭环四步写全含“执行后手机提醒”；③价值从提效降本安全三点写，风险从设备/网络/平台三处想。","易错警示":"风险要写“断网时无人值守”等系统性问题，而非“会下雨”。","方法点拨":"案例题答案组织：器件→流程→价值→风险四段，各配证据词。"}},{"sec":"综合实践题","type":"综合实践题","num":1,"text":"学校给各班发来任务：为走廊设计一套“人来灯亮、人走灯灭”的节能照明物联网方案，并写一份《方案说明书》。请完成：①画出方案的系统框图（感知层、网络层、应用层分别是什么设备或技术）；②写出完整闭环流程；③测算价值：走廊每天无人时段约6小时，原40瓦灯常亮一天耗电多少度（40W×24h），改成感应灯后一天大约可省多少度电（写出算式）；④指出方案可能的一个“失灵”场景并给出对策。","opts":[],"subs":[],"ans":"①感知层：红外人体传感器；网络层：线路/无线把信号传给控制器；应用层：控制器＋走廊照明（也可写平台统计）。②感知（探测有人）→传输→处理（判断是否有人、延时计时）→反馈（开灯；人离开超时自动关灯）。③40W常亮一天耗电40W×24h＝960Wh＝0.96度；若无人时段6小时灯灭，可省40W×6h＝240Wh＝0.24度（按天约省25%照明电，写出算式即给分）。④失灵场景示例：传感器误把路过的人当停留，灯频繁亮灭；对策：调整感应角度与延时时间，或“人体＋声音”双传感器判断。（各部分要点齐全、算式正确、对策合理即给分：框图4分、闭环5分、算式6分、失灵与对策5分、表达规范5分）","al":{"考查点":"系统设计＋价值测算＋失效分析的完整应用（创造）。","解题思路":"①框图按三层写设备；②闭环四步走完；③耗电算式写清（40W×24h=960Wh=0.96度，无人6小时省40W×6h=240Wh）；④失灵场景落到“误触发频繁亮灭”并给“调角度延时/双传感器”对策。","易错警示":"算式要带单位且写明“按无人时段计省电比例”，对策要与失灵对应。","方法点拨":"综合实践题按题号分段作答：框图、闭环、算式、失灵对策各成一段，卷面与逻辑双得分。"}}]}]},{"t":"第二单元 万物互联有协议","isFinal":false,"lessons":[{"t":"第 6 课 · 配套练习","n":"数据传输方式多","isExam":false,"qs":[{"sec":"回忆热身","type":"回忆","num":1,"text":"物联网数据“出门”有两条路：走线缆的是____传输，靠电磁波在空中传的是无线传输。","opts":[],"subs":[],"ans":"有线","al":{"考查点":"传输方式两大类的识记（记忆）。","解题思路":"判断标准看“信号走的路”是否依赖实体线缆——走网线、光纤等线缆的是有线传输，靠电磁波在空中传的是无线传输。题干说“走线缆”直接对应“有线”。","易错警示":"别把“通过Wi-Fi路由器上网”误判为有线——只要电脑到路由器之间走的是网线才算有线链路。","方法点拨":"记口诀“有线看线缆，无线看天线”：见线缆即有线、无缆即无线。"}},{"sec":"回忆热身","type":"回忆","num":2,"text":"光纤被称为数据传输的“高铁”，它靠____在玻璃丝里传输信号，又快又稳。","opts":[],"subs":[],"ans":"光（光信号）","al":{"考查点":"光纤传输原理的识记（记忆）。","解题思路":"光纤以光信号为载体，在玻璃纤芯内反复全反射向前传播，速度快、衰减小、抗电磁干扰强，故称“高铁”。","易错警示":"光纤里传的是光不是电，两端仍需光猫完成“电—光—电”转换。","方法点拨":"记转换链“电脑电信号→光猫转光→纤芯传输→对端转回电”，光纤=光在玻璃丝里跑。"}},{"sec":"基础巩固","type":"单选","num":1,"text":"下列传输方式中，属于有线传输的是：","opts":[{"label":"A","text":"Wi-Fi"},{"label":"B","text":"蓝牙"},{"label":"C","text":"双绞线（网线）"},{"label":"D","text":"卫星通信"}],"subs":[],"ans":"答案C　双绞线（网线）","al":{"考查点":"有线/无线传输方式分类的辨析（理解）。","解题思路":"先立分类标准（是否靠实体线缆），再逐项检验：双绞线是实体网线属有线；Wi-Fi、蓝牙、卫星都靠空中电磁波属无线。","逐项剖析":"A Wi-Fi：靠电磁波空中传输，无线，排除；B 蓝牙：短距无线，排除；C 双绞线（网线）：铜质线缆走电信号，有线，正确；D 卫星通信：经太空电磁波链路，无线，排除。","易错警示":"看到“线”字不一定有线——双绞线才是线缆；Wi-Fi路由器上那根线是电源线不是传输介质。","方法点拨":"分类题先立标准再逐项打钩；“有线三兄弟”双绞线、同轴电缆、光纤一次记全。"}},{"sec":"基础巩固","type":"单选","num":2,"text":"宽带光纤入户后，看高清视频不卡、下载飞快，这是因为光纤：","opts":[{"label":"A","text":"不需要任何设备"},{"label":"B","text":"传输速度快、衰减小、抗干扰强"},{"label":"C","text":"只传声音不传图像"},{"label":"D","text":"靠空气就能传"}],"subs":[],"ans":"答案B　传输速度快、衰减小、抗干扰强","al":{"考查点":"光纤传输特性的理解（理解）。","解题思路":"题干现象“高清不卡、下载飞快”指向高带宽低时延——光纤光信号衰减小、抗干扰强，正因如此才又快又稳。","逐项剖析":"A 不需要任何设备：错，光纤两端需光猫等光电转换设备；B 传输速度快、衰减小、抗干扰强：正是光纤优势，正确；C 只传声音不传图像：光纤是通用介质，排除；D 靠空气就能传：光纤靠玻璃纤芯导光，排除。","易错警示":"别把“速度快”与“设备少”混为一谈——快靠低损耗抗干扰，不是免设备。","方法点拨":"光纤关键词组“快、远、稳、抗扰”，凡夸宽带快稳的题基本指向光纤。"}},{"sec":"基础巩固","type":"单选","num":3,"text":"用“速度、距离、抗干扰”三把尺比较，下列关于传输方式的说法正确的是：","opts":[{"label":"A","text":"红外遥控器抗干扰最强，隔着墙也能遥控电视"},{"label":"B","text":"卫星通信覆盖最广，沙漠、海洋也能联网，但成本与延迟较高"},{"label":"C","text":"Wi-Fi比光纤更适合超长距离传输"},{"label":"D","text":"蓝牙传输距离比Wi-Fi更远"}],"subs":[],"ans":"答案B　卫星通信覆盖最广，沙漠、海洋也能联网，但成本与延迟较高","al":{"考查点":"按“速度、距离、抗干扰”三把尺比较传输方式（应用）。","解题思路":"三把尺逐项对照：卫星覆盖全球无死角（距离尺最长）但成本高、时延较大；红外直线传播、穿墙即失效（抗干扰尺差）。","逐项剖析":"A 红外遥控隔墙也能控：红外穿墙能力弱，说法错；B 卫星覆盖沙漠海洋但成本与延迟较高：准确，正确；C Wi-Fi比光纤更适合超长距离：错，Wi-Fi是短距组网技术；D 蓝牙比Wi-Fi更远：错，蓝牙约10米比Wi-Fi更短。","易错警示":"“覆盖广”不等于“样样好”——卫星强在距离、弱在成本时延，评价必须分维度。","方法点拨":"比较题把“速度/距离/抗干扰”写成表头逐格打分，维度齐全不丢分。"}},{"sec":"基础巩固","type":"单选","num":4,"text":"我国“东数西算”工程让西部数据中心与东部城市之间海量数据往来，跨上千公里仍要毫秒级到达。最合适的传输依托是：","opts":[{"label":"A","text":"红外遥控"},{"label":"B","text":"光纤骨干网络"},{"label":"C","text":"蓝牙互传"},{"label":"D","text":"NFC碰一碰"}],"subs":[],"ans":"答案B　光纤骨干网络","al":{"考查点":"按应用场景选传输方式的综合判断（应用）。","解题思路":"先抓关键约束“跨上千公里、海量数据、毫秒级到达”——需要长距离大容量低时延，只有光纤骨干网能胜任。","逐项剖析":"A 红外遥控：厘米级近场，排除；B 光纤骨干网络：跨地域海量数据的主干道，正确；C 蓝牙互传：10米近场，排除；D NFC碰一碰：近场接触式，排除。","易错警示":"“东数西算”这类国家工程题要抓“跨省、海量、毫秒”三个词，直接锁定骨干光纤。","方法点拨":"场景选路四步：读约束（距离/数据量/时延）→排除近场技术→在广域方案中比选→写一句理由。"}},{"sec":"基础巩固","type":"判断","num":1,"text":"无线传输比有线传输更方便自由，所以任何场景都应优先选无线。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"对“无线优于有线”绝对化说法的批判判断（评价）。","解题思路":"找绝对化词“任何场景都应优先”——无线方便但易受干扰、带宽与稳定性常不如有线；骨干网、数据中心必须用光纤，结论应为“按场景选路”。","易错警示":"别因为“无线更现代”就默认它更好——合适才是标准。","方法点拨":"看到“任何/永远/都应”先画问号，再举反例：为什么跨省骨干网不用Wi-Fi？"}},{"sec":"基础巩固","type":"判断","num":2,"text":"双绞线（网线）和光纤都属于有线传输介质。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"有线介质识别的再认（记忆）。","解题思路":"双绞线走电信号、光纤走光信号，但都靠物理线缆传输，同属有线传输介质。","易错警示":"有人因光纤“传光”而怀疑它不算有线——有线无线的划分看线缆而非信号形态。","方法点拨":"“介质看形态不看信号”：电、光都行，关键是走线还是走空。"}},{"sec":"基础巩固","type":"判断","num":3,"text":"低轨卫星互联网让飞机、沙漠、海洋上的设备也能联网。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"低轨卫星互联网应用范围的判断（理解）。","解题思路":"低轨卫星星座组网可覆盖地面网络到不了的飞机、沙漠、海洋等区域，是“万物互联无死角”的补充手段，说法正确。","易错警示":"别误以为卫星会取代地面网络——它是补充，城市里光纤与蜂窝仍是主力。","方法点拨":"卫星的角色一句话：地面管不到的地方，卫星来兜底。"}},{"sec":"能力提升","type":"提升","num":1,"text":"请完成《传输方式图鉴》：分别写出有线（至少2种）与无线（至少3种）传输方式，并为每种配一个“像什么”的类比。","opts":[],"subs":[],"ans":"有线：双绞线（像乡间公路，普及便宜）、光纤（像高铁，快且稳）；无线：Wi-Fi（像小区快递柜，短距离组网）、蜂窝移动（像全国铁路网，跨城随行）、蓝牙（像当面递纸条，近场直连）、卫星（像空中邮路，全球可达）。类比合理即可。","al":{"考查点":"传输方式分类整理与类比表达（应用）。","解题思路":"先按有线/无线两栏盘点已学方式，再为每种配“像什么”的类比——类比要抓该方式最鲜明的特征（距离、速度、场景）。","易错警示":"类比空洞（如“光纤很快”）不给分；要具体到“像高铁——快且稳、有专用轨道”，让听者一秒想到特征。","方法点拨":"图鉴题按“方式—特征词—类比物—一句话理由”四格写，全而有序。"}},{"sec":"能力提升","type":"提升","num":2,"text":"奶奶家宽带常“卡顿”，维修师傅说可能是“路由器旁边放了微波炉”。请用“无线传输易受干扰”的原理解释这句话，并给奶奶两条改善Wi-Fi的建议。","opts":[],"subs":[],"ans":"Wi-Fi靠电磁波传信号，微波炉、大功率电器、厚重墙体都会干扰或阻挡电磁波，导致信号变差卡顿。建议：路由器远离微波炉等电器、放在高处居中位置；或改用网线直连（有线更稳），必要时换双频路由器。","al":{"考查点":"用无线传输受干扰原理解决生活问题（应用）。","解题思路":"把现象翻译成原理：Wi-Fi靠电磁波传信号，微波炉等大功率电器与厚重墙体都会干扰或衰减电磁波→信号变差卡顿；对策从“减少干扰、增强信号”入手（移开电器、抬高居中、改网线直连）。","易错警示":"只答“路由器坏了”没扣原理；要说清“干扰电磁波”而非“微波炉烤坏了网线”。","方法点拨":"“解释生活现象”三步：现象→原理（什么在传、什么挡了它）→对策（移干扰、改有线、换频段）。"}},{"sec":"能力提升","type":"提升","num":3,"text":"请从“速度、距离、抗干扰”三个维度，比较光纤与卫星通信的优劣，并各说一个最适合它的场景。","opts":[],"subs":[],"ans":"速度：光纤极快稳定，卫星延迟较高；距离：光纤需铺缆（跨海可走海底光缆），卫星覆盖全球无死角；抗干扰：光纤几乎不受电磁干扰，卫星受天气与遮挡影响。适合场景：光纤——城市骨干网、数据中心互联；卫星——沙漠科考、远洋船舶、灾区应急通信。","al":{"考查点":"三维度对比传输方式的系统比较（分析）。","解题思路":"按“速度、距离、抗干扰”三行成文：每行先写光纤再写卫星，最后各配一个最能凸显其优势的场景（光纤骨干网、卫星远洋应急）。","易错警示":"场景与优势脱节（给光纤配沙漠）即失分；场景要“放大优势”。","方法点拨":"对比题固定句式：“××维度：A……，B……；A适合——，B适合——”，格式本身就是得分点。"}},{"sec":"能力提升","type":"提升","num":4,"text":"无人机喷药的大棚基地要回传高清画面给管理员，但基地位于偏远农田、没有光纤。请你从“4G/5G蜂窝”和“低轨卫星”中推荐一种方案，并说明理由与局限。","opts":[],"subs":[],"ans":"推荐蜂窝（4G/5G）：农田若在信号覆盖内，资费低、时延小、带宽够回传高清画面，最划算。局限：偏远山区若无基站信号，则改用低轨卫星兜底——覆盖广但成本高、带宽与时延受限。结论：先看现场有没有蜂窝信号，再决定是否用卫星。","al":{"考查点":"依据现场条件做传输选型决策（应用·评价）。","解题思路":"决策题先看“现场有没有蜂窝信号”：有→4G/5G资费低、时延小、带宽够回传高清画面，最划算；无→低轨卫星兜底，覆盖广但成本高、带宽时延受限。结论是“条件分叉式”而非二选一。","易错警示":"直接推荐卫星会忽略“资费与带宽”代价；要体现“先探测现场、再定方案”的决策顺序。","方法点拨":"方案题给决策树：前提条件→主选→备用→一句话理由，逻辑链完整。"}},{"sec":"拓展挑战","type":"拓展","num":1,"text":"学校机房要新建一条“机房到教学楼”的数据线路，工程师在“再铺一条光纤”和“用高性能Wi-Fi桥接”之间犹豫。请你从速度、稳定性、成本、维护四个角度各说一句，帮学校做决定。","opts":[],"subs":[],"ans":"速度：光纤千兆稳定，Wi-Fi桥接易受天气与干扰波动；稳定性：光纤几乎不受干扰、7×24小时可靠，Wi-Fi偶发掉线；成本：短距离铺光纤一次性投入略高；维护：光纤基本免维护，Wi-Fi需定期调优。建议：固定骨干用光纤，教室末端设备多、布线难的地方再补Wi-Fi，两者结合最稳。","al":{"考查点":"多角度综合权衡的决策表达（分析·评价）。","解题思路":"按题给四角度（速度/稳定性/成本/维护）逐格对比：光纤千兆稳定、抗干扰强、免维护但铺设需投入；Wi-Fi桥接灵活便宜但易受天气干扰。最后给组合建议：固定骨干用光纤、末端难布线处补Wi-Fi。","易错警示":"只写“光纤好”不加理由或漏角度；四个角度要一一对应作答。","方法点拨":"决策小论文模板：“每角度一句对比→一句结论→一句组合建议”，三句成段。"}},{"sec":"拓展挑战","type":"拓展","num":2,"text":"爷爷收到一张宣传单：“卫星宽带让您家告别卡顿！”请你结合光纤与卫星的特点，判断这张宣传单哪里“夸张”，并给爷爷讲清家里宽带究竟靠什么。","opts":[],"subs":[],"ans":"夸张处：卫星宽带虽能覆盖偏远地区，但普通城市家庭并不需要；且卫星带宽、时延与资费都不如光纤，用它“告别卡顿”并不成立。家里宽带本质是“光纤到户”：数据经光纤骨干网传输，光猫转成电信号供路由器使用——固定场景光纤才是又快又稳的选择。","al":{"考查点":"批判性审视商业宣传中的技术夸大（评价）。","解题思路":"先定位夸张点：城市家庭本有光纤到户，卫星宽带带宽、时延与资费都不如光纤，“告别卡顿”不成立；再科普家中宽带的本质是“光纤到户+光猫转换”。","易错警示":"别全盘否定卫星——它是偏远地区的合理选择，错在“对城市家庭夸大其词”。","方法点拨":"“打假题”三步：谁被夸大→为什么错（技术对比）→真相是什么（讲清原理）。"}},{"sec":"变式闯关","type":"变式","num":1,"text":"换一个场景：快递员送急件可选“公路运输”或“高铁运输”。请把这一选择迁移到数据传输：什么情况下数据该走“双绞线（公路）”，什么情况下该走“光纤（高铁）”？各举一例。","opts":[],"subs":[],"ans":"数据量小、距离近、成本敏感时走“公路”——如家庭路由器到电脑的短网线（双绞线足够）；数据量大、要快要稳时走“高铁”——如数据中心之间、跨省骨干网（必须光纤）。按数据“多急多重”选路。","al":{"考查点":"真实选型任务中的多维度权衡与容灾设计（创造）；跨课迁移——三把尺比较的实战化。","解题思路":"建议书三段式：①三方案按“距离/抗干扰/月成本”列表对比；②推荐要扣住“80米+跨操场”的现场约束（Wi-Fi定向桥接距离够、成本低）；③备用方案要回答“数据不丢”而非只是“信号恢复”——本地先存一份、雷雨过后自动补传，必要时4G热点兜底。","易错警示":"缺维度比较或推荐无现场依据会失分；备用方案若写成“等天晴”太被动，本地暂存+自动补传才是好答案。","方法点拨":"“选型建议书”通用骨架：比较表→推荐与理由→最坏情况兜底，三块齐全即高分之选。"}},{"sec":"间隔复习","type":"间隔","num":1,"text":"上节课我们体验了物联网的趣味功能。请回忆：一个完整的物联功能通常包含哪几个基本环节？请按顺序写出。","opts":[],"subs":[],"ans":"（第5课《物联功能趣体验》）　感知→传输→处理→反馈（应用）四环节：传感器采集数据、经网络传送、平台/控制器分析判断、再把结果用于控制或通知。","al":{"考查点":"物联网功能链的四环节（识记）。","解题思路":"以\"智能药盒提醒\"等实例对号入座：亮灯采集（感知）、上传（传输）、判断是否取药（处理）、通知家人（反馈）。","易错警示":"漏\"反馈\"环节——只到\"处理\"就结束，系统便无法形成闭环。","方法点拨":"遇到任何物联网场景，先画\"感知→传输→处理→反馈\"四格链。"}},{"sec":"间隔复习","type":"间隔","num":2,"text":"体验中哪类数据最适合用传感器自动采集？为什么？","opts":[],"subs":[],"ans":"（第5课《物联功能趣体验》）　连续变化、需要长期记录的环境量（如温湿度、光照、CO2）最适合自动采集；因为人工读数费时费力且难以全天候连续，传感器可定点、定时、定量地稳定采集。","al":{"考查点":"传感器采集的适用场景判断（理解）。","解题思路":"判断标准：\"连续性+重复性+实时性\"要求越高，越适合自动采集。","易错警示":"答\"所有数据都用传感器\"——主观问卷类数据仍需人工，不能自动化。","方法点拨":"选型口诀：\"变的、久的、要准的交给传感器\"。"}},{"sec":"思维进阶","type":"挑战","num":1,"text":"学校要给“屋顶气象站”选一条把数据传回电脑的路——屋顶到机房约80米，中间要跨过操场，不适合拉线。请你写一份《传输方案建议书》：①比较Wi-Fi定向桥接、4G蜂窝、光纤这三种方案在“距离、抗干扰、月成本”上的表现；②选出你的推荐并说明理由；③若遇到雷雨天信号变差，你会准备什么备用方案？","opts":[],"subs":[],"open":true,"ans":"参考设计要点：①三方案比较：光纤——距离满足（80m可用）、抗干扰最强、需开挖布线且月成本高；Wi-Fi定向桥接——距离可达（加定向天线）、易受天气干扰、成本最低；4G蜂窝——覆盖无距离限制、抗干扰一般、持续月租成本最高；②推荐示例：Wi-Fi定向桥接——80米在定向天线可靠范围内、无需开挖操场、成本最低，气象站数据量小对带宽要求不高；③备用方案：雷雨天信号变差时自动启用4G模块续传（双通道热备），雨停后自动切回并补传中断时段的数据。","al":{"考查点":"开放创造：传输方案的比选与容灾（创造+评价）","解题思路":"比较表覆盖\"距离、抗干扰、成本\"三指标；推荐理由须与场景需求（数据量小、80米、跨操场）匹配；备用方案体现\"自动切换+补传\"","易错警示":"推荐理由与场景脱节；备用方案只写\"换4G\"没有切换与补传机制","方法点拨":"选型题公式：三指标对比→按场景取舍→双通道兜底。"}}]},{"t":"第 7 课 · 配套练习","n":"电子标签我揭秘","isExam":false,"qs":[{"sec":"回忆热身","type":"回忆","num":1,"text":"RFID电子标签通常由____和天线两部分组成。","opts":[],"subs":[],"ans":"芯片","al":{"考查点":"RFID标签结构的识记（记忆）。","解题思路":"标签两件套：芯片（存身份信息、负责应答）＋天线（收发电磁波、取能）。题干已给出“天线”，补“芯片”。","易错警示":"勿填“电池”——无源标签没有电池，靠天线从读写器电磁波中取能。","方法点拨":"记“芯片是大脑、天线是耳朵”，RFID标签=芯片+天线两件套。"}},{"sec":"回忆热身","type":"回忆","num":2,"text":"RFID系统“一刷知身份”靠读写器发出无线电波____标签，标签再回传身份信息。","opts":[],"subs":[],"ans":"唤醒（激活）","al":{"考查点":"RFID工作起始步骤的识记（记忆）。","解题思路":"读写器先发无线电波“叫醒”休眠的标签（赋能使芯片工作），标签才回传信息——这个动作叫唤醒（激活）。","易错警示":"别填“充电”或“开锁”——唤醒是让无源标签临时取能工作，不是长期供电。","方法点拨":"RFID流程首步永远是“读写器发波→唤醒标签”，口诀“先唤醒、后应答”。"}},{"sec":"基础巩固","type":"单选","num":1,"text":"超市收银员把整购物车商品推过一道“门”，屏幕立刻显示所有商品与总价。实现这种“不逐件扫码”识别的是：","opts":[{"label":"A","text":"键盘输入"},{"label":"B","text":"RFID批量读取"},{"label":"C","text":"人工点数"},{"label":"D","text":"条形码逐个扫描"}],"subs":[],"ans":"答案B　RFID批量读取","al":{"考查点":"RFID与条形码读取方式的辨析应用（应用）。","解题思路":"题干“整车推过一道门、不逐件扫码、秒出总价”——关键在“隔空、批量、免对准”，这正是RFID读写器的能力。","逐项剖析":"A 键盘输入：人工录入，排除；B RFID批量读取：隔空唤醒整批标签，正确；C 人工点数：慢且易错，排除；D 条形码逐个扫描：需逐件对准可见码，与“一推车秒过”矛盾，排除。","易错警示":"别被“码”字迷惑——RFID是射频标签不是条形码，条形码做不到隔空批量。","方法点拨":"看见“不扫码/一过门/整批秒读”等词直接锁定RFID。"}},{"sec":"基础巩固","type":"单选","num":2,"text":"校园一卡通“刷卡进门、刷卡吃饭”，卡里存的是：","opts":[{"label":"A","text":"照片和饭量"},{"label":"B","text":"可被读写器读取的身份/账户信息"},{"label":"C","text":"一张二维码图片"},{"label":"D","text":"磁带的录音"}],"subs":[],"ans":"答案B　可被读写器读取的身份/账户信息","al":{"考查点":"校园卡内信息实质的理解（理解）。","解题思路":"一卡通是RFID芯片卡，存的是可被读写器读取的身份标识与账户数据；照片只是外观装饰，不是卡内核心信息。","逐项剖析":"A 照片和饭量：卡内不存这些，排除；B 可被读写器读取的身份/账户信息：芯片核心内容，正确；C 一张二维码图片：一卡通多为RFID非接触卡而非二维码，排除；D 磁带的录音：无关，排除。","易错警示":"别把“卡面照片”当“卡内信息”——芯片存的是数据不是图片。","方法点拨":"RFID卡本质是“身份数据的便携容器”，刷卡=读取并验证数据。"}},{"sec":"基础巩固","type":"单选","num":3,"text":"关于RFID与条形码的区别，下列说法错误的是：","opts":[{"label":"A","text":"RFID可非接触读取，条形码一般要“看见”才能扫"},{"label":"B","text":"RFID可同时读取多张，条形码通常逐张扫描"},{"label":"C","text":"RFID标签内信息可加密、可更新"},{"label":"D","text":"条形码比RFID更适合远距离批量盘点"}],"subs":[],"ans":"答案D　条形码比RFID更适合远距离批量盘点","al":{"考查点":"RFID与条形码区别的多点辨析（理解·评价）。","解题思路":"逆向题找“错误说法”：逐项核对后，D把“远距离批量盘点”安给条形码，与事实（条形码需近距离逐张）相反，故选D。","逐项剖析":"A RFID非接触、条形码要“看见”才能扫：正确；B RFID可同时读多张、条形码通常逐张：正确；C RFID标签信息可加密、可更新：正确；D 条形码更适合远距离批量盘点：错误——这恰是RFID（超高频）的优势，故选D。","易错警示":"“错误的是”题要反着选，别把正确项勾上去；先圈出题眼“错误”。","方法点拨":"区别题列双栏对照表（读取方式/速度/可更新性/适用距离），错项一眼现形。"}},{"sec":"基础巩固","type":"单选","num":4,"text":"服装店用“一推车过门自动计数”的方式盘点新到货品，主要利用了RFID的哪个特点？","opts":[{"label":"A","text":"可以批量快速识别"},{"label":"B","text":"只能一对一识别"},{"label":"C","text":"必须接触才能读"},{"label":"D","text":"靠人眼辨认"}],"subs":[],"ans":"答案A　可以批量快速识别","al":{"考查点":"RFID特点与场景匹配（应用）。","解题思路":"“一推车过门自动计数”的优势落在“整批同时识别、免逐件清点”，即批量性。","逐项剖析":"A 可以批量快速识别：整推车一次完成识别计数，正确；B 只能一对一识别：与题干批量矛盾，排除；C 必须接触才能读：RFID非接触，排除；D 靠人眼辨认：排除。","易错警示":"“盘点”场景最容易误入“信息量大”——此题核心是批量效率而非存储容量。","方法点拨":"抓题干动词：“一推车/整批/秒级”=批量；答案必含“批量/同时”。"}},{"sec":"基础巩固","type":"判断","num":1,"text":"RFID读写器必须贴着标签才能读到信息。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"RFID非接触通信特性的判断（理解）。","解题思路":"RFID靠无线电波通信，无需接触——近场几厘米、远场（超高频）可达数米，“必须贴着才能读”说法错误。","易错警示":"与公交卡“贴一下”的动作混淆：贴只是示意距离近，电磁波读取仍是非接触。","方法点拨":"RFID三大特性“非接触、可批量、隔空读”是判断题高频素材。"}},{"sec":"基础巩固","type":"判断","num":2,"text":"ETC不停车收费、图书自助借还都应用了RFID识别技术。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"RFID典型应用的再认（记忆）。","解题思路":"ETC（车载标签+路边读写器）、图书自助借还（书内标签+借还机）都是“读写器唤醒标签、回传身份”的RFID应用，判断正确。","易错警示":"别把“扫码还书”混入——那是条形码；RFID的特征是“隔空感应、整摞可读”。","方法点拨":"收集生活RFID实例（ETC/门禁/图书/快递分拣）是最佳记忆锚点。"}},{"sec":"基础巩固","type":"判断","num":3,"text":"无源RFID标签不需要电池，靠读写器发出的电磁波取能工作。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"无源标签供能原理的理解（理解）。","解题思路":"无源标签没有电池，天线接收读写器电磁波转化为电能驱动芯片应答——成本低至几毛钱，才能大规模贴在商品上。","易错警示":"“无源”不是“无能量来源”，而是“不自带电池、靠无线取能”。","方法点拨":"有源/无源二分法：有电池主动发信=有源，无电池取能应答=无源。"}},{"sec":"能力提升","type":"提升","num":1,"text":"请写出RFID系统识别一张校园卡的完整过程（至少三步），并说明其中“芯片”“天线”“读写器”各起什么作用。","opts":[],"subs":[],"ans":"①读写器发出无线电波（唤醒）→②卡内天线接收电磁波并为芯片供电→③芯片被唤醒后回传身份信息→④读写器读取并传给后台验证。作用：芯片存身份信息并应答，天线负责收发信号与取能，读写器负责发起通信并读取数据。","al":{"考查点":"RFID工作流程的完整描述（应用）。","解题思路":"按时间线写四步：读写器发波→天线接收并为芯片供电→芯片被唤醒回传身份→读写器读取交后台验证；再分述芯片/天线/读写器各自的职责。","易错警示":"顺序颠倒（先回传再唤醒）或漏“天线取能供电”环节；芯片与读写器职责不能互换。","方法点拨":"流程题“先动作后应答”：读写器永远先发声、标签被动应答，记死主从关系。"}},{"sec":"能力提升","type":"提升","num":2,"text":"图书馆用RFID升级了借还系统。请对比“扫码逐本借还”与“RFID批量借还”，从速度、操作方式两方面写出区别。","opts":[],"subs":[],"ans":"速度：扫码需逐本对准扫，一次一本较慢；RFID把一摞书放上感应区即可同时识别，秒级完成。操作：扫码依赖条形码可见完整、需对准光线；RFID无需对准与可见，书本叠放也能读取，还能顺带盘点防盗。","al":{"考查点":"两种识别技术在具体场景的对比（分析）。","解题思路":"按“速度、操作方式”两维对比：扫码需逐本对准、一次一本较慢；RFID把整摞书放上感应区即可同时识别、秒级完成，还能顺带盘点防盗。","易错警示":"只写“RFID快”不解释为什么（免对准、隔空批量）会显得空。","方法点拨":"对比题按给定维度成行作答，行行用“扫码……RFID……”对照句式。"}},{"sec":"能力提升","type":"提升","num":3,"text":"快递公司要在包裹上贴“数字身份证”实现全程溯源。请写出这项应用依赖的技术、它记录哪些关键信息（至少三项）、以及全程可溯源对消费者有什么好处。","opts":[],"subs":[],"ans":"依赖RFID（或二维码＋RFID结合）：每个包裹贴唯一标签。记录：包裹编号、发货地与时间、途经节点与签收信息。好处：随时查询包裹到哪了、出现问题可精准定位责任环节、防丢防掉包、收货核验更放心。","al":{"考查点":"RFID溯源应用的信息设计（应用）。","解题思路":"技术=RFID（或二维码+RFID结合）；记录信息按“身份+轨迹+签收”三类设计（编号、发货地时间、途经节点、签收）；好处落到消费者可感知的“查询、追责、防丢”。","易错警示":"好处写“方便快递员”偏了——题问对消费者的好处；记录项至少写三项。","方法点拨":"溯源题信息设计三要素：唯一标识、时间地点轨迹、签收闭环。"}},{"sec":"能力提升","type":"提升","num":4,"text":"无源RFID标签成本降到几毛钱后，有人设想“每棵蔬菜都带数字身份证”。请说出这个设想实现后，对食品安全监管有什么价值，并指出它当前的一个困难。","opts":[],"subs":[],"ans":"价值：蔬菜从田间到餐桌全程可溯源——哪里种的、何时采摘、如何运输，出问题可迅速定位并召回，消费者扫码即知“出身”，倒逼生产规范。困难：海量标签的粘贴与数据采集成本、田间恶劣环境下的标签耐久性、隐私与数据标准问题（答出一点合理困难即可）。","al":{"考查点":"技术价值与落地困难的辩证分析（分析·评价）。","解题思路":"价值链从“田间到餐桌”展开：全程溯源→出问题快速定位召回→扫码知出身倒逼生产规范；困难从成本、耐久、隐私、标准四类中选一点具体展开即可。","易错警示":"只讲价值不讲困难会漏答一半；困难要具体（如“田间泥土潮湿、贴标易脱落”）。","方法点拨":"“好设想”题两面写：价值按环节、困难按要素，各写一点就完整。"}},{"sec":"拓展挑战","type":"拓展","num":1,"text":"小区门禁系统原先用“钥匙＋保安登记”，物业想换成“RFID门禁卡”。请分析：①换了以后“刷卡进门”的流程是什么；②给物业、住户各写一条好处和一条需要注意的事。","opts":[],"subs":[],"ans":"①住户刷卡→读写器唤醒卡内标签→验证身份→开锁放行并记录进出时间。②物业好处：进出有记录、可远程挂失（卡丢了一键禁用）；需注意：后台数据要设访问权限防泄露。住户好处：不用带钥匙、丢失可补办；需注意：卡不要借给陌生人、发现异常扣费及时挂失。","al":{"考查点":"RFID系统迁移到新场景的多方分析（分析·评价）。","解题思路":"先写新流程（刷卡→读写器唤醒标签→验证身份→开锁放行并记录），再分“物业/住户”各写一条好处+一条注意，好处与注意要对应同一关切。","易错警示":"好处与注意张冠李戴（把物业的远程挂失写成住户的）；注意要具体（后台数据设访问权限、卡不外借）。","方法点拨":"“换系统”题三段：新流程一句话、受益方各一得一虑、结尾一句总结。"}},{"sec":"拓展挑战","type":"拓展","num":2,"text":"有人担心：“衣服里的RFID标签在我买回家后还能被读出，商家是不是能追踪我？”请你从技术原理和应对两方面，给这位消费者一个安心的解释。","opts":[],"subs":[],"ans":"原理上：RFID标签只存商品编号等简单信息，不存个人身份；一般读卡距离有限，普通商家无法远程随意读取你衣橱里的标签。应对：若仍不放心，可剪掉或破坏服装吊牌中的标签（不影响穿着）；购物时认准正规商家，警惕要求扫描“不明标签”的行为。核心技术问题是“标签里有什么、谁能读、读来做什么”，合法合规使用即可放心。","al":{"考查点":"RFID隐私问题的科学解释与应对（评价）。","解题思路":"从“技术原理+应对”两线安抚：标签只存商品编号等简单信息、不存个人身份，普通读距有限无法远程随意读取；若仍不放心可剪坏吊牌标签，购物认准正规商家。","易错警示":"别简单说“不用担心”没依据；要点明“标签里有什么、谁能读、读来做什么”三问。","方法点拨":"隐私解释“三问法”最有效：存什么→谁可读→做什么用，答完自然安心。"}},{"sec":"变式闯关","type":"变式","num":1,"text":"换一个场景：高速收费站从“停车掏钱”变成“ETC不停车通过”。请用RFID的两件套和两步流程，解释ETC为什么能“车到杆起、自动扣费”。","opts":[],"subs":[],"ans":"两件套：车上的ETC电子标签＋收费站读写器（含车道天线）。两步：车接近时读写器发出无线电波唤醒标签→标签回传车辆身份与账户信息，系统验证后抬杆放行并从绑定账户自动扣费——车不停、人不出，秒级通行。","al":{"考查点":"RFID原理迁移解释真实系统（应用）。","解题思路":"对应两件套（车载ETC标签+收费站读写器/车道天线）与两步（读写器发波唤醒标签→标签回传车辆身份与账户信息，系统验证后抬杆放行并自动扣费），把“车到杆起”拆成自动化动作。","易错警示":"漏“自动扣费由后台账户完成”环节——ETC不只是抬杆，还绑定了账户支付。","方法点拨":"解释“黑科技”三步走：设备有哪些→谁先发话→后台干什么。"}},{"sec":"间隔复习","type":"间隔","num":1,"text":"RFID读写器与标签之间靠什么“传数据”？这种通信属于有线还是无线传输？为什么它不需要接触就能读？","opts":[],"subs":[],"ans":"（第6课《数据传输方式多》）　靠无线电波（电磁波）通信，属无线传输。正因为是无线射频，读写器才能隔空唤醒标签并读取信息，无需接触；这也要注意抗干扰问题（金属、液体环境会影响读取）。","al":{"考查点":"RFID系统设计与防丢逻辑的完整创造（创造）；跨课迁移——把标签状态与门禁联动。","解题思路":"设计按“设备（书内贴RFID标签含书号与借阅状态、门口装读写器天线与报警器）→流程（借书→自助机登记变更状态→出门读写器核验）→异常（未办理借阅=状态未变→触发报警）→伦理（借阅记录属个人信息，加密限权不外泄）”四块作答。","易错警示":"忘记“借阅状态”这一关键变量——防丢的核心是比对“该不该出门”而非单纯“读到标签”。","方法点拨":"安全系统设计“核验状态法”：正常路径设状态翻转，偏离状态即报警，逻辑闭环最严密。"}},{"sec":"思维进阶","type":"挑战","num":1,"text":"学校图书馆丢书问题严重，请你设计一套“图书防丢＋自助借还”的RFID方案并写《方案说明》：①书里贴什么、门口装什么，画出“借书—出门”的流程；②如果一本书没办理借阅就被带出门口，系统如何发现并响应；③为这套系统设计一句面向同学的温馨提示，并指出隐私上要注意的一点。","opts":[],"subs":[],"open":true,"ans":"参考设计要点：①方案：每本书贴RFID标签（含唯一编码），借还台与门口装RFID读写器；借书流程：书放感应区→读写器批量读取标签→系统绑定读者卡与书→消磁/标记已借；出门流程：门口读写器扫描→未办理借阅的书触发报警；②未借书出门响应：门口读写器读到\"未借出\"状态的标签→声光报警并联动记录→管理员按提示拦截办理；③温馨提示：\"自助借还几秒钟，规范归架靠大家\"；隐私注意：借阅记录关联个人，能反映一个人的阅读偏好，系统须加密保存并限制查询权限。","al":{"考查点":"开放创造：RFID系统的全流程设计（创造+应用）","解题思路":"\"书里贴什么、门口装什么\"答具体；流程含\"借—出门\"两端；隐私点落在\"借阅记录=阅读画像\"","易错警示":"只写\"贴标签装感应器\"没有流程；隐私答\"会泄露\"不指明泄露的是什么信息","方法点拨":"RFID题公式：标签+读写器、双端流程、隐私具体化。"}}]},{"t":"第 8 课 · 配套练习","n":"巧用蓝牙做工具","isExam":false,"qs":[{"sec":"回忆热身","type":"回忆","num":1,"text":"蓝牙是____距离（约10米）的点对点无线通信技术。","opts":[],"subs":[],"ans":"短","al":{"考查点":"蓝牙距离特征的识记（记忆）。","解题思路":"蓝牙是近场点对点无线技术，典型通信距离约10米，故空填“短”。","易错警示":"勿填“长/中长”——蓝牙约10米，比Wi-Fi几十米显著更短。","方法点拨":"蓝牙关键词“短距、低功耗、免网络、点对点”四个一组记。"}},{"sec":"回忆热身","type":"回忆","num":2,"text":"使用蓝牙连接设备通常三步：开启蓝牙、____、点击配对。","opts":[],"subs":[],"ans":"搜索设备","al":{"考查点":"蓝牙连接步骤的识记（记忆）。","解题思路":"标准三步：开启蓝牙→搜索设备（发现对方）→点击配对；题干已给“开启、____、点击配对”，中间一步为“搜索设备”。","易错警示":"勿填“输入密码”放中间——密码在配对确认时才出现。","方法点拨":"“开—搜—配”三字诀：先开蓝牙，再搜到对方，最后配对确认。"}},{"sec":"基础巩固","type":"单选","num":1,"text":"下列场景最适合用蓝牙的是：","opts":[{"label":"A","text":"把一部2GB电影从北京传到上海"},{"label":"B","text":"手机与手环之间同步步数数据"},{"label":"C","text":"全校500台电脑统一联网"},{"label":"D","text":"跨太平洋的海底通信"}],"subs":[],"ans":"答案B　手机与手环之间同步步数数据","al":{"考查点":"蓝牙适用场景的判别（应用）。","解题思路":"蓝牙适合“近距离、小数据、低功耗”场景：手机与手环贴身同步步数正合适；其余三项（跨城传电影、全校组网、跨洋通信）都超出蓝牙能力。","逐项剖析":"A 把2GB电影从北京传到上海：远距大流量，排除；B 手机与手环同步步数：近距小数据低功耗，正确；C 全校500台电脑统一联网：需Wi-Fi/有线组网，排除；D 跨太平洋海底通信：需光纤/卫星，排除。","易错警示":"看见“同步/配对/近身设备”锁定蓝牙；看见“全校/跨城/跨洋”立即排除。","方法点拨":"选技术先对“距离与数据量”两把尺，蓝牙只吃“近而小”。"}},{"sec":"基础巩固","type":"单选","num":2,"text":"蓝牙与Wi-Fi都能无线传数据，二者的核心区别是：","opts":[{"label":"A","text":"蓝牙不用电，Wi-Fi耗电"},{"label":"B","text":"蓝牙是近场点对点直连，Wi-Fi是组网覆盖接入"},{"label":"C","text":"蓝牙比Wi-Fi距离远得多"},{"label":"D","text":"蓝牙只能传文字"}],"subs":[],"ans":"答案B　蓝牙是近场点对点直连，Wi-Fi是组网覆盖接入","al":{"考查点":"蓝牙与Wi-Fi本质区别的辨析（理解）。","解题思路":"核心差异在通信结构：蓝牙是设备间直接点对点（像当面递纸条），Wi-Fi是经路由器组网覆盖接入（像接入快递网络）。","逐项剖析":"A 蓝牙不用电、Wi-Fi耗电：错，蓝牙只是功耗低并非不用电；B 蓝牙近场点对点直连、Wi-Fi组网覆盖接入：本质区别，正确；C 蓝牙比Wi-Fi距离远得多：说反了，排除；D 蓝牙只能传文字：蓝牙可传文件音频，排除。","易错警示":"“功耗差异”是结果不是本质；通信结构（有无中心节点）才是分水岭。","方法点拨":"一句话区分：蓝牙“点对点免网络”，Wi-Fi“经路由器上网络”。"}},{"sec":"基础巩固","type":"单选","num":3,"text":"蓝牙耳机连手机听歌一整天，手环用蓝牙上报数据能用一两周，主要是因为蓝牙：","opts":[{"label":"A","text":"功率小、功耗低"},{"label":"B","text":"距离非常远"},{"label":"C","text":"不用开机"},{"label":"D","text":"只传一次"}],"subs":[],"ans":"答案A　功率小、功耗低","al":{"考查点":"蓝牙低功耗特性的归因（理解）。","解题思路":"现象“耳机听一天、手环用一两周”指向同一原因：蓝牙（尤其低功耗蓝牙BLE）发射功率小、空闲休眠，故续航长。","逐项剖析":"A 功率小、功耗低：直接解释长续航，正确；B 距离非常远：与蓝牙短距矛盾，排除；C 不用开机：荒谬，排除；D 只传一次：手环是周期性持续上报，排除。","易错警示":"别答“传输次数少”——手环持续上报仍省电，功耗低才是关键。","方法点拨":"续航题先找“耗电大户”：发射功率+空闲休眠，BLE两样都省。"}},{"sec":"基础巩固","type":"单选","num":4,"text":"关于蓝牙技术发展，下列说法正确的是：","opts":[{"label":"A","text":"蓝牙只能一对一，永远不能组网"},{"label":"B","text":"低功耗蓝牙让门锁、传感器等设备续航大大延长"},{"label":"C","text":"蓝牙传输距离与Wi-Fi一样覆盖整栋楼"},{"label":"D","text":"蓝牙必须连接互联网才能工作"}],"subs":[],"ans":"答案B　低功耗蓝牙让门锁、传感器等设备续航大大延长","al":{"考查点":"蓝牙技术发展的多说法辨析（理解·评价）。","解题思路":"逐项核对：BLE功耗极低让门锁传感器续航大延正确；蓝牙Mesh已能多设备组网、蓝牙不依赖互联网，A/C/D均有硬伤。","逐项剖析":"A 蓝牙只能一对一、永远不能组网：蓝牙Mesh已支持组网，错误；B 低功耗蓝牙让门锁、传感器续航大延：正确；C 蓝牙传输距离覆盖整栋楼：蓝牙约10米，错误；D 蓝牙必须连互联网才能工作：点对点免网络，错误。","易错警示":"“永远”“必须”等绝对词往往是错项信号，先标出再排除。","方法点拨":"判断题组用“找反例法”：一句话若举得出反例即为错。"}},{"sec":"基础巩固","type":"判断","num":1,"text":"蓝牙设备必须连接互联网才能互传文件。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"蓝牙是否需要网络的判断（理解）。","解题思路":"蓝牙是近场点对点直连，两台设备开蓝牙即可传文件，全程不经互联网与流量，说“必须联网”错误。","易错警示":"手机传文件常让人误以为要网——蓝牙本身不依赖任何网络。","方法点拨":"“蓝牙三免”：免网络、免流量、免配置，三免判断题直接得分。"}},{"sec":"基础巩固","type":"判断","num":2,"text":"蓝牙传输距离一般在10米左右，隔两堵墙可能就连不上了。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"蓝牙距离与障碍衰减的判断（理解）。","解题思路":"蓝牙约10米，墙体会衰减信号，隔两堵墙连不上属正常现象，判断正确。","易错警示":"“10米”是开阔环境参考值，不是穿墙保证——障碍物是衰减主因。","方法点拨":"短距无线的通病“距离+遮挡”双杀，记住这一条可解释许多“连不上”。"}},{"sec":"基础巩固","type":"判断","num":3,"text":"蓝牙Mesh技术能让多个蓝牙设备组成一张网，比如全屋灯光联动。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"蓝牙Mesh组网的判断（理解）。","解题思路":"蓝牙Mesh让灯、开关等节点互相接力转发组成一张网，实现全屋联动，突破了传统蓝牙点对点的限制，判断正确。","易错警示":"别以为蓝牙永远是“一对一”——Mesh已支持多跳组网。","方法点拨":"“Mesh=接力组网”，灯控、传感网这类多节点场景是它的主场。"}},{"sec":"能力提升","type":"提升","num":1,"text":"请写出用蓝牙把手机里的照片传给同桌手机的完整操作步骤（至少三步），并说明这个过程为什么不需要连接网络。","opts":[],"subs":[],"ans":"①两台手机都开启蓝牙；②其中一台搜索附近设备，找到同桌手机；③点击“配对”，双方确认配对码；④选择照片→“分享→蓝牙”→发送，接收方点“接受”。不需要网络：蓝牙在设备间直接建立近场无线链路传输，数据不经过互联网，因此免流量。","al":{"考查点":"蓝牙实际操作流程的应用（应用）。","解题思路":"按“双开蓝牙→搜索找到对方→点击配对双方确认→选择分享发送→接收方接受”写全步骤，并解释为何免网络：设备间直接建立近场无线链路，数据不经过互联网。","易错警示":"漏“双方确认配对码”或省掉“接收方点接受”环节；步骤要可复现。","方法点拨":"写操作步骤“动词开头、一步一动作”，别人照做能成功即满分。"}},{"sec":"能力提升","type":"提升","num":2,"text":"请从“通信距离、是否需要网络、典型用途”三方面完成蓝牙与Wi-Fi的对比表。","opts":[],"subs":[],"ans":"距离：蓝牙约10米近场；Wi-Fi几十米可组网覆盖更大区域。网络：蓝牙点对点直连免网络；Wi-Fi需路由器接入（可上互联网）。用途：蓝牙连耳机/手环/传小文件；Wi-Fi上网、多设备共享宽带、智能家居组网。一句话：蓝牙是“递纸条”，Wi-Fi是“接快递网”。","al":{"考查点":"两技术三维度系统对比（分析）。","解题思路":"按题给三维度（距离/网络/用途）成行对比：距离10米近场vs几十米组网覆盖；网络点对点免网vs需路由器接入；用途连耳机手环vs上网共享与组网。句末用“递纸条vs接快递网”比喻收束便于记忆。","易错警示":"漏一维或把“网络”维度答错（蓝牙免网络、Wi-Fi需路由器是关键差异）。","方法点拨":"对比表“三行三列”最清晰，比喻句放最后当记忆钩子。"}},{"sec":"能力提升","type":"提升","num":3,"text":"手环、智能门锁这类小设备为什么偏爱蓝牙而不是Wi-Fi？请从功耗、成本、场景三方面说明。","opts":[],"subs":[],"ans":"功耗：蓝牙（尤其BLE）极低，纽扣电池可用一两年；Wi-Fi功耗高需常供电。成本：蓝牙模块更便宜。场景：手环与手机贴身近距、门锁在门口由手机近距控制，短距直连够用且免配置网络。需要远程查看时才由网关把蓝牙数据转上互联网。","al":{"考查点":"从功耗、成本、场景解释技术选择（分析）。","解题思路":"三点归因：功耗（BLE极低、纽扣电池用一两年，Wi-Fi功耗高需常供电）、成本（蓝牙模块更便宜）、场景（手环贴身、门锁门口，短距直连够用且免配网）；补一句“需远程查看时由网关把蓝牙数据转上互联网”。","易错警示":"只答“省电”一点太单薄；要分别对应功耗、成本、场景三方面。","方法点拨":"“为什么选X”题按“三本账”作答：电费账（功耗）、造价账（成本）、场景账（够不够用）。"}},{"sec":"能力提升","type":"提升","num":4,"text":"教室想布置“上课铃自动响、放学自动静音”的音响系统，管理员在“蓝牙组网”和“Wi-Fi组网”之间选择。请说出各自的优缺点，并给出你的建议。","opts":[],"subs":[],"ans":"蓝牙Mesh：自组网简单、功耗低、成本低，但传输带宽与时延控制一般，适合灯控等简单控制；Wi-Fi组网：带宽大、统一管理方便、可对接校园网与平台，但需路由器与供电。建议：教室音响要统一平台管理与定时播放，选Wi-Fi组网更合适（蓝牙适合单点近场控制场景）。","al":{"考查点":"场景化组网方案比较与决策（应用·评价）。","解题思路":"分别写两方案优缺点：蓝牙Mesh自组网简单、功耗成本低但带宽与时延控制一般；Wi-Fi组网带宽大、可统一平台管理、能对接校园网但需路由与供电。结合“统一平台管理+定时播放”需求推荐Wi-Fi组网。","易错警示":"只说“Wi-Fi好”不结合教室需求（定时、统一管理）会失分。","方法点拨":"决策题最后一句要“回扣需求”：因为要××，所以选××。"}},{"sec":"拓展挑战","type":"拓展","num":1,"text":"爷爷第一次用蓝牙耳机，怎么都连不上手机。请你扮演“小客服”，把连接步骤拆成一步步的口令告诉他（说清每一步做什么、为什么），并提示他两个最常见的失败原因。","opts":[],"subs":[],"ans":"口令：①把耳机从充电盒取出（让耳机进入可搜索状态）——为什么：很多耳机在盒内会关机；②手机设置里打开蓝牙；③点“搜索设备”，在列表里找到耳机名字；④点击配对，若提示输入密码一般填0000或按耳机提示。常见失败：耳机没进入配对模式（新耳机通常长按多功能键到灯快闪）；手机蓝牙列表太旧——关掉重开蓝牙再搜。","al":{"考查点":"操作知识的转译表达（创造·应用）。","解题思路":"扮演“小客服”把步骤拆成口令：取出耳机（让它进入可搜索状态）→开手机蓝牙→搜索找到耳机→点击配对（默认0000）；再补两个最常见的失败原因：耳机没进入配对模式（新耳机长按多功能键到灯快闪）、手机蓝牙列表陈旧需关开刷新。","易错警示":"遗漏“耳机需进入配对模式”这一最常见坑；口令要让老人能照做。","方法点拨":"“教长辈”题=步骤口诀化+常见坑预告，同理心与可操作性并重。"}},{"sec":"拓展挑战","type":"拓展","num":2,"text":"有同学说“蓝牙太落后了，Wi-Fi什么都能干”。请你用两个“蓝牙做得到而Wi-Fi做起来很麻烦”的场景反驳他，并说明蓝牙在物联网里为什么仍不可替代。","opts":[],"subs":[],"ans":"场景一：两机互传大文件——开蓝牙点对点秒传，不需连路由器也不用流量；场景二：手环/耳机这类贴身小设备——蓝牙低功耗续航以周计，Wi-Fi高频连接很快没电。物联网里蓝牙不可替代：大量传感器、门锁、手环节点功耗预算极低、位置近、数据小，蓝牙（尤其BLE/Mesh）是功耗与成本的“最优解”，与Wi-Fi各司其职。","al":{"考查点":"用反例论证技术不可替代性（评价）。","解题思路":"先找两个“蓝牙擅长而Wi-Fi做起来麻烦”的场景：两机免网络免流量点对点传大文件、手环耳机这类贴身低功耗设备（Wi-Fi高频连接很快没电）；再升华——物联网大量节点功耗预算低、位置近、数据小，蓝牙是功耗与成本的最优解，与Wi-Fi各司其职。","易错警示":"反驳要“有理有据两场景”，只喊“不对”没说服力。","方法点拨":"反驳题结构：亮观点（不可替代）→两个反例→升华原因（各司其职），三段式最有力度。"}},{"sec":"变式闯关","type":"变式","num":1,"text":"换一个场景：展会上两台笔记本电脑要快速交换一份机密方案，主办方要求“不能经过任何公共网络”。请你说出该用什么技术、怎样完成，并说明为什么这样最安全。","opts":[],"subs":[],"ans":"用蓝牙（或Wi-Fi直连）点对点传输：双方开启蓝牙→搜索配对→发送文件，全程设备直连、不经公共网络与云端。安全性：数据只在两台设备间近场传输，不经过可能被监控的公共Wi-Fi或服务器，泄露面最小；传完可关闭蓝牙。","al":{"考查点":"蓝牙点对点特性的安全场景迁移（应用）。","解题思路":"抓住“不能经过任何公共网络”的约束→蓝牙（或Wi-Fi直连）点对点最安全：双方开蓝牙→搜索配对→发送文件，全程设备直连、不经公共网络与云端；传完可关闭蓝牙。","易错警示":"有人推荐“加密上传云盘”——违背“不经公共网络”约束；要点明“设备直连、泄露面最小”。","方法点拨":"安全传输题先划红线（禁经公共网络），再选“近场直连”天然规避。"}},{"sec":"间隔复习","type":"间隔","num":1,"text":"蓝牙配对需要“先搜索到对方设备”，这和我们学过的RFID“读写器唤醒标签”有什么相似和不同？","opts":[],"subs":[],"ans":"（第7课《电子标签我揭秘》）　相似：都要先“发现对方”再通信，都属于无线短距通信。不同：RFID通常“读写器主动唤醒标签、标签被动应答”，多用于身份识别（一刷即知）；蓝牙是“双方配对建立连接”的双向通信，多用于传输数据（传文件、连耳机）。","al":{"考查点":"把蓝牙“短距近场”特性化为活动规则的设计创造（创造）；跨课迁移——距离即规则。","解题思路":"规则设计“借特性”：蓝牙约10米短距=天然距离门槛，选手到点位才能搜到信标；流程按“到达→扫描信标→记录点位与时间戳→上传后台”四步；防作弊扣住“代打”漏洞——要求手机与手环/号码牌蓝牙配对、随机口令、后台比对到达时间与轨迹。","易错警示":"防作弊空泛（如“自觉遵守”）不得分；要给出“人机绑定/随机口令/轨迹比对”这类具体机制。","方法点拨":"活动设计题“特性→规则”一步到位：技术能限制什么，规则就立什么。"}},{"sec":"思维进阶","type":"挑战","num":1,"text":"学校要组织“校园寻宝大赛”，请你为裁判设计一套“蓝牙签到打卡”方案并写《规则说明》：①利用蓝牙的哪些特性实现“到点才能打卡”（提示：考虑距离限制）；②画出“选手到达点位—完成打卡—成绩记录”的流程；③指出蓝牙打卡可能被“作弊”的一种方式，并给出防作弊对策。","opts":[],"subs":[],"open":true,"ans":"参考设计要点：①特性利用：蓝牙通信距离有限（约10米量级）——只有选手真正到达点位附近才能连上蓝牙信标完成打卡，远离则连不上，天然实现\"到点才能打\"；②流程：选手到达点位→手机蓝牙连接点位信标→信标校验选手编号与时间戳→打卡成功上传成绩记录；③作弊方式与对策：他人代打——把手机交给先到的队友带去打卡；对策：打卡时要求手机与选手手环（佩戴在身上）近距离同时验证，或打卡瞬间抓拍现场照片留证。","al":{"考查点":"开放创造：蓝牙特性与防作弊设计（创造+应用）","解题思路":"核心是\"距离限制=到场证明\"这一特性转化；流程三环齐；作弊方式与对策成对且对策可执行","易错警示":"把蓝牙说成远距离通信（与特性矛盾）；对策只写\"加强监督\"没有技术手段","方法点拨":"特性题公式：特性→玩法→漏洞→堵漏，环环相扣。"}}]},{"t":"第 9 课 · 配套练习","n":"互联协议仍沿用","isExam":false,"qs":[{"sec":"回忆热身","type":"回忆","num":1,"text":"让不同厂商、不同设备能互相通信的“说话规则”叫做____。","opts":[],"subs":[],"ans":"协议","al":{"考查点":"协议概念的识记（记忆）。","解题思路":"让不同厂商、不同设备互相通信的“说话规则”即协议（protocol）；题干“互相通信的说话规则”直接指向“协议”。","易错警示":"勿填“网络/路由器”——那是通道与设备，规则本身叫协议。","方法点拨":"协议=通信的“普通话”，凡说“规矩/规则/共同语言”即协议。"}},{"sec":"回忆热身","type":"回忆","num":2,"text":"用“寄信三步”理解协议：先____（打包加地址头），再寻址（找路），最后确认（签收）。","opts":[],"subs":[],"ans":"封装","al":{"考查点":"寄信三步中“封装”概念的识记（记忆）。","解题思路":"三步=封装（打包加地址头）→寻址（找路）→确认（签收）；题干已给后两步，第一步为“封装”。","易错警示":"勿填“写信/发送”——封装特指“打包+写地址头”这个动作。","方法点拨":"寄信三步“装—送—收”对应“封装—寻址—确认”，与TCP/IP的分包、路由、应答机制同步记。"}},{"sec":"基础巩固","type":"单选","num":1,"text":"为什么不同品牌的智能设备插到同一个Wi-Fi里就能互相通信？最根本的原因是：","opts":[{"label":"A","text":"它们恰好说同一种语言"},{"label":"B","text":"它们都遵守统一的通信协议"},{"label":"C","text":"路由器会自动翻译所有语言"},{"label":"D","text":"它们都是同一家公司生产的"}],"subs":[],"ans":"答案B　它们都遵守统一的通信协议","al":{"考查点":"设备互通根本原因的辨析（理解）。","解题思路":"异构设备能互认互通的根本=共同遵守统一通信协议（TCP/IP、MQTT等），不是“恰好同语言”，更不是路由器自动翻译。","逐项剖析":"A 它们恰好说同一种语言：设备是机器不是人，说法拟人化不成立，排除；B 它们都遵守统一的通信协议：规则统一才能互认互通，正确；C 路由器会自动翻译所有语言：路由器按协议转发而非翻译，排除；D 同一家公司生产：跨品牌设备也能互通，排除。","易错警示":"“翻译”说法有迷惑性——协议不是翻译，是双方预先约定同一种格式。","方法点拨":"协议题核心句“统一规则是互通前提”，凡问“为什么能通”先答协议。"}},{"sec":"基础巩固","type":"单选","num":2,"text":"“寄信三步”中，“寻址”对应网络通信里靠什么找到对方设备？","opts":[{"label":"A","text":"靠对方设备颜色"},{"label":"B","text":"靠IP地址（网络地址）定位设备"},{"label":"C","text":"靠邮寄包裹大小"},{"label":"D","text":"靠随机乱传总能送到"}],"subs":[],"ans":"答案B　靠IP地址（网络地址）定位设备","al":{"考查点":"寻址概念与IP地址的对应（理解）。","解题思路":"“寻址”=在网络上定位目标设备，靠IP地址（网络地址）标识，就像信封上的地址决定寄往哪里。","逐项剖析":"A 靠设备颜色：无关，排除；B 靠IP地址定位设备：寻址机制，正确；C 靠包裹大小：无关，排除；D 随机乱传总能送到：无寻址必丢，排除。","易错警示":"寻址≠传输本身：寻址回答“送到哪”，传输回答“怎么送”。","方法点拨":"把“IP=门牌号”焊死在记忆里，凡“找设备/定位/地址”必是寻址。"}},{"sec":"基础巩固","type":"单选","num":3,"text":"关于MQTT协议，下列说法正确的是：","opts":[{"label":"A","text":"MQTT是给电脑玩游戏用的超大流量协议"},{"label":"B","text":"MQTT是轻量的物联网消息协议，适合数据量小、设备多的场景"},{"label":"C","text":"MQTT只能传中文"},{"label":"D","text":"MQTT需要专用光纤才能用"}],"subs":[],"ans":"答案B　MQTT是轻量的物联网消息协议，适合数据量小、设备多的场景","al":{"考查点":"MQTT协议定位的理解（理解）。","解题思路":"MQTT=物联网“轻量级普通话”：报文头小、低带宽、支持海量连接，专为“数据小、设备多”的场景而生。","逐项剖析":"A 给电脑玩游戏用的超大流量协议：MQTT轻量而非大流量，排除；B 轻量的物联网消息协议、适合数据量小设备多的场景：正确；C 只能传中文：协议与语言无关，排除；D 需要专用光纤才能用：普通网络即可承载，排除。","易错警示":"别把MQTT当“游戏/视频协议”；它的关键词是“轻、多、弱网可用”。","方法点拨":"MQTT四特征“轻量、发布—订阅、海量连接、弱网可用”，应用场景题直接套。"}},{"sec":"基础巩固","type":"单选","num":4,"text":"“数据发出去后，接收方要回一个‘收到’的信号，没收到就重发”——这对应寄信三步中的：","opts":[{"label":"A","text":"封装"},{"label":"B","text":"寻址"},{"label":"C","text":"确认"},{"label":"D","text":"写信"}],"subs":[],"ans":"答案C　确认","al":{"考查点":"“确认”机制的辨识（理解）。","解题思路":"“对方回收到、没收到就重发”正是寄信三步中的“确认”——保证可靠送达；封装是打包、寻址是定位。","逐项剖析":"A 封装：打包动作，排除；B 寻址：找路定位，排除；C 确认：回执+超时重传机制，正确；D 写信：不在三步之列，排除。","易错警示":"“回执”“重传”“可靠送达”是确认的三关键词，出现任一即选确认。","方法点拨":"三步各配信号词：封装(包/地址头)、寻址(地址/定位)、确认(回执/重传)。"}},{"sec":"基础巩固","type":"判断","num":1,"text":"只要设备连上了同一个网络，就一定能互相通信，不需要任何协议。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"协议必要性的判断（理解）。","解题思路":"物理连通只是“通了线路”，设备还须按统一协议“说同一种话”才能理解彼此数据——协议是通信的灵魂，说法错误。","易错警示":"“连上网就能互通”是常见误区：连上≠说同一种话。","方法点拨":"“线路+规则”双要件记忆法，物理与逻辑两层面缺一不可。"}},{"sec":"基础巩固","type":"判断","num":2,"text":"TCP/IP是互联网与许多物联网系统的“底层通用语言”。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"TCP/IP地位的判断（记忆）。","解题思路":"TCP/IP规定了数据如何分包、寻址与可靠传输，是互联网的底层通用语言，大量物联网设备也沿用其链路，判断正确。","易错警示":"勿与MQTT层级混淆：TCP/IP偏底层传输，MQTT偏上层消息，二者常配合而非互斥。","方法点拨":"层级观：TCP/IP是地基，MQTT是地基之上的应用规矩。"}},{"sec":"基础巩固","type":"判断","num":3,"text":"协议只对电脑重要，传感器、路灯这些“物”不需要协议。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"“物不需要协议”的判断（理解）。","解题思路":"物物通信同样需要协议：温湿度传感器上报数据、路灯接收控制指令都必须遵循统一格式与规则（如MQTT），说法错误。","易错警示":"“物是哑巴”是误解——正是协议让“哑设备”也能开口说话。","方法点拨":"万物互联的本质=万物“说话”，凡有通信处必有协议。"}},{"sec":"能力提升","type":"提升","num":1,"text":"请用“寄信”的类比，把TCP/IP通信的“封装—寻址—确认”三步各写一句，并说明“信封上的地址”对应网络中的什么。","opts":[],"subs":[],"ans":"封装：把要发的数据打包，加上收件地址等“信封头”；寻址：网络根据IP地址像邮局分拣一样把数据包送往目的地；确认：对方收到后回“签收回执”，没收到就重发。“信封上的地址”对应网络中的IP地址（网络地址），它唯一标识了设备所在位置。","al":{"考查点":"TCP/IP三步与网络的对应转译（应用）。","解题思路":"每步写一句类比+一句对应：封装=打包加地址头；寻址=网络按IP地址像邮局分拣一样送抵；确认=对方回签收、未收到重发。“信封上的地址”=IP地址（网络地址）。","易错警示":"类比与术语脱节（只讲寄信不讲对应）会失分；三步要与三个机制一一挂接。","方法点拨":"类比题“一句生活+一句专业”双轨写，让外行听懂、内行点头。"}},{"sec":"能力提升","type":"提升","num":2,"text":"物联网消息协议MQTT常被比作“轻量级普通话”。请从“数据量、设备数量、带宽要求”三方面说明它为什么适合物联网。","opts":[],"subs":[],"ans":"数据量：MQTT报文头小，适合温湿度、开关状态这类小数据，开销极低；设备数量：采用“发布—订阅”模式，一台服务器可挂成千上万台设备；带宽要求：在窄带、弱网环境也能工作（如NB-IoT、2G网络）——因此它是物联网最常用的消息协议。","al":{"考查点":"按三方面解释协议适用性（分析）。","解题思路":"按“数据量（MQTT报文头小、适合小数据开销极低）、设备数量（发布—订阅模式，一台服务器挂成千上万台）、带宽要求（窄带弱网如NB-IoT、2G也能工作）”三线展开，每条一句理由。","易错警示":"漏“发布—订阅”这个规模秘密；只答“轻量”一词无展开。","方法点拨":"“为什么适合”题把特性写成“因为……所以……”因果链，三点即满分骨架。"}},{"sec":"能力提升","type":"提升","num":3,"text":"小明给朋友的电脑传文件，朋友一直“收不到”。请按“封装—寻址—确认”三步，帮他排查可能出问题的三个环节。","opts":[],"subs":[],"ans":"封装环节：文件没传完或格式被破坏，对方解不开；寻址环节：IP地址或设备名填错，数据送错了地方；确认环节：网络丢包且未重传、接收方防火墙拦截了回执，发送方以为失败。排查思路：先看地址对不对，再看网络通不通，最后重试并查看错误提示。","al":{"考查点":"用三步模型诊断网络故障（应用·分析）。","解题思路":"把故障按三步归位：封装环节（文件没传完/格式破坏解不开）、寻址环节（IP地址或设备名填错送错地方）、确认环节（丢包未重传、接收方防火墙拦回执）；最后给出排查顺序（先地址、再网络、后重试看提示）。","易错警示":"排查要“归位到环节”，笼统说“网络不好”显浅；三步各给一个具体原因。","方法点拨":"“排障模型化”是工程思维：故障先分类到环节，再逐环节验证，比瞎试高效。"}},{"sec":"能力提升","type":"提升","num":4,"text":"请解释“协议统一是万物互联的规模前提”这句话，并举一个“各说各话导致无法互联”的反面例子。","opts":[],"subs":[],"ans":"设备数量越多、厂商越杂，越需要统一协议让大家“说同一种话”，否则彼此听不懂、无法协作，规模就上不去。反面例子：早期各品牌智能家居App互不兼容，用户买A牌灯、B牌插座就要装两个App；直到行业统一到MQTT/通用平台，跨品牌联动才成为可能。","al":{"考查点":"用正反例论证协议统一的价值（分析·评价）。","解题思路":"正面论证：设备越多、厂商越杂，越需要统一协议让大家“说同一种话”才能协作、规模才上得去；反面例子：早期各品牌智能家居App互不兼容、一牌一App，直到统一到MQTT/通用平台才实现跨品牌联动。","易错警示":"反面例子要具体真实，不能只喊“否则连不上”。","方法点拨":"论证题“正论+反例”双保险：先讲道理，再用历史教训砸实。"}},{"sec":"拓展挑战","type":"拓展","num":1,"text":"老师要求“用寄信三步给一年级小朋友讲清楚‘电脑怎么把作业传到老师那儿’”。请你写出你的讲解稿（用打比方，小朋友能听懂），并说明每一步对应真实网络里的什么。","opts":[],"subs":[],"ans":"讲解稿示例：把作业装进一个“信封”（封装——电脑把作业分成小包、写上老师的地址）；邮局按地址把信送到（寻址——网络按IP地址把数据送到老师电脑）；老师收到后回一句“收到啦”（确认——对方回应，没收到就再寄一次）。就像寄信要有信封、地址、回执，电脑传文件也一样，这些规矩叫“协议”。","al":{"考查点":"知识转译与类比表达的创造（创造）。","解题思路":"讲解稿=三个生活动作（把作业装进信封=封装打包写地址；邮局按地址送信=寻址按IP地址送达；老师回一句“收到啦”=确认应答）逐一对应，末尾点出“这些规矩叫协议”。","易错警示":"语言太技术化（直接甩IP/TCP术语）违背“一年级能听懂”的要求；要口语化打比方。","方法点拨":"“讲给小朋友”题三法宝：打比方、短句子、最后一句总结规矩。"}},{"sec":"拓展挑战","type":"拓展","num":2,"text":"学校的十几块“电子班牌”要统一接收课表并上报使用情况。技术老师纠结用“每个班牌直接连服务器”还是“用MQTT消息协议”。请你帮他分析MQTT方案好在哪三点，并指出需要保证的一个前提。","opts":[],"subs":[],"ans":"好处：①轻量——班牌资源少也能跑；②一对多——服务器一条课表消息可同时推给所有班牌（发布—订阅）；③断线恢复——班牌离线再上线能自动补收最新课表。前提：网络稳定且班牌与服务器在同一“主题”频道下、身份校验配置正确，否则收错消息。","al":{"考查点":"MQTT三优势与使用前提的分析（应用·分析）。","解题思路":"三优势：轻量（班牌资源少也能跑）、一对多（服务器一条课表可同时推给所有班牌——发布订阅）、断线恢复（班牌离线再上线自动补收最新课表）；前提：网络稳定、班牌与服务器在同一“主题”频道且身份校验配置正确。","易错警示":"前提若答“装好软件”太泛；要落在“同一主题+身份校验”这类MQTT特有机制上。","方法点拨":"方案分析“好处三点+前提一个”结构固定，好处按MQTT特性逐一展开。"}},{"sec":"变式闯关","type":"变式","num":1,"text":"换一个场景：快递包裹要跨国寄送，各国邮政规则不同。请用“协议”的思路说明：为什么包裹仍能顺利到达？这给物联网设备跨国联网带来什么启示？","opts":[],"subs":[],"ans":"因为各国邮政都遵守万国邮政联盟的统一规则（格式、地址、单据互认），包裹才能跨系统接力送达。启示：物联网设备跨国联网也要靠统一协议（TCP/IP、MQTT等）互认互通——规则统一是“全球一张网”的前提。","al":{"考查点":"协议思想跨域迁移（应用·创造）。","解题思路":"先解释跨国包裹能到达=各国邮政都遵守万国邮政联盟的统一规则（格式、地址、单据互认）；再迁移：物联网设备跨国联网也要靠TCP/IP、MQTT等统一协议互认互通——规则统一是“全球一张网”的前提。","易错警示":"止步于“包裹能到”没迁移到物联网，会漏答后半题。","方法点拨":"迁移题结尾必“回到本学科点题”，把比喻的启示写透。"}},{"sec":"间隔复习","type":"间隔","num":1,"text":"数据要“出门”既需要传输介质（有线/无线），也需要协议。请用一句话说清：介质和协议分别解决什么问题？","opts":[],"subs":[],"ans":"（第6课《数据传输方式多》）　介质解决“数据从哪条路走”的物理通道问题（光纤、Wi-Fi等）；协议解决“数据怎么打包、怎么找路、怎么确认送达”的规则问题——路修好了还要有交通规则，二者缺一不可。","al":{"考查点":"协议三机制迁移到应急系统设计（创造）；跨课迁移——寄信三步实战化。","解题思路":"三段作答：①用寄信三步画“一键求助”数据旅程（封装：求助信号+我的编号打包发出；寻址：按地址送到班主任手机；确认：班主任回执已收到、手环显示发送成功）；②必要性用反例（各品牌各说各话，班主任就收不到别家手环的紧急信号）；③比喻设计要传神（“协议好比大家约好的暗号——暗号统一，暗语才传得通、传得准”）。","易错警示":"数据旅程少“确认”一环（紧急消息无回执会重复误报）；比喻空泛扣分。","方法点拨":"应急系统设计“闭环优先”：发出→送达→回执→提示，四环齐全才算可靠。"}},{"sec":"思维进阶","type":"挑战","num":1,"text":"班里要给每位同学发一个“校园安全手环”，手环要能把“一键求助”发给班主任、把“体温异常”上报校医。请你担任协议设计顾问：①用“寄信三步”画出“按下一键求助→班主任收到”的数据旅程；②解释为什么手环与手机、电脑要用“同一种协议”而不是各说各话；③设计一句“协议好比____”的比喻，让全班同学一秒记住协议的作用。","opts":[],"subs":[],"open":true,"ans":"参考设计要点：①\"寄信三步\"数据旅程：第一步\"写好信封\"——手环把求助信息按统一格式打包（收件人=班主任，内容=求助+手环编号）；第二步\"邮政网络投递\"——数据经蓝牙→手机/网关→校园网络逐段转发；第三步\"收信人拆信\"——班主任端App按同一协议解包、响铃提示；②必须用同一种协议：双方对\"信怎么写、地址怎么填、什么时候响铃\"约定一致才能互认——各说各话则收到也\"读不懂\"；③比喻示例：\"协议好比全世界通用的信封格式\"或\"协议好比交通规则——红停绿行，路才不乱\"。","al":{"考查点":"开放创造：协议本质的迁移表达（创造+理解）","解题思路":"数据旅程三步与\"打包—传输—解包\"对应；同协议的理由落在\"格式互认\"；比喻一语中的且不超过一句","易错警示":"旅程漏\"解包\"环节——只有发没有收；比喻写成\"协议很快\"没有抓住\"约定\"本质","方法点拨":"协议题三步：旅程三步、互认理由、一句传神比喻。"}}]},{"t":"第 10 课 · 配套练习","n":"物物互通有新径","isExam":false,"qs":[{"sec":"回忆热身","type":"回忆","num":1,"text":"给物联网设备选“传输新径”要问三问：覆盖广不广、____低不低、能连多少设备。","opts":[],"subs":[],"ans":"功耗","al":{"考查点":"“新径三问”的识记（记忆）。","解题思路":"给物联网设备选“传输新径”要问三问：覆盖广不广、功耗低不低、能连多少设备；题干已给“覆盖广”与“能连多少设备”，缺“功耗低不低”。","易错警示":"勿填“价格/颜值”——三问专指覆盖、功耗、连接规模。","方法点拨":"“三问”口诀：远不远（覆盖）、省不省（功耗）、多不多（规模）。"}},{"sec":"回忆热身","type":"回忆","num":2,"text":"NB-IoT 是____（广域/近场）低功耗物联网通信技术，适合水表、气表这类“远而省”的场景。","opts":[],"subs":[],"ans":"广域","al":{"考查点":"NB-IoT类别的识记（记忆）。","解题思路":"NB-IoT属广域低功耗物联网通信技术（LPWAN），专管“远而省”的水表、气表场景；题干括号提示“广域/近场”，结合“远而省”应填“广域”。","易错警示":"别填“近场”——NB-IoT覆盖以公里计，是广域技术。","方法点拨":"先分阵营再谈应用：近场阵营=蓝牙/星闪，广域阵营=NB-IoT/5G。"}},{"sec":"基础巩固","type":"单选","num":1,"text":"小区要远程抄几千块智能水表，水表装在楼道角落、几年不换电池。最适合的通信方式是：","opts":[{"label":"A","text":"蓝牙"},{"label":"B","text":"Wi-Fi"},{"label":"C","text":"NB-IoT（窄带物联网）"},{"label":"D","text":"红外遥控"}],"subs":[],"ans":"答案C　NB-IoT（窄带物联网）","al":{"考查点":"按“远、省、多”场景选通信技术（应用）。","解题思路":"约束“楼道角落+几年不换电池+几千块表”=远、省、多→NB-IoT（覆盖穿透强能进地下室、功耗极低电池用数年、支持海量连接）全中。","逐项剖析":"A 蓝牙：10米近场，进不了楼道远角，排除；B Wi-Fi：距离近且需供电，排除；C NB-IoT：广覆盖低功耗海量连接，正确；D 红外遥控：要对着才能遥控，排除。","易错警示":"水表题是NB-IoT经典题眼——看见“地下室/几年不换电池/数千终端”直接锁定。","方法点拨":"场景选径先读约束词：“远而省”=NB-IoT，“快而急”=5G，“近而密”=星闪/蓝牙。"}},{"sec":"基础巩固","type":"单选","num":2,"text":"关于5G在物联网中的作用，下列说法正确的是：","opts":[{"label":"A","text":"5G只用于手机看视频"},{"label":"B","text":"5G低时延、大带宽，可支撑远程手术、车路协同等场景"},{"label":"C","text":"5G不需要基站"},{"label":"D","text":"5G比蓝牙距离更近"}],"subs":[],"ans":"答案B　5G低时延、大带宽，可支撑远程手术、车路协同等场景","al":{"考查点":"5G在物联网中角色的理解（理解）。","解题思路":"5G三特征“大带宽、低时延、广连接”，题眼在“远程手术、车路协同”这类要求毫秒级实时的应用。","逐项剖析":"A 5G只用于手机看视频：5G还服务工业与物联网，错误；B 5G低时延、大带宽可支撑远程手术、车路协同：正确；C 5G不需要基站：5G需密集基站覆盖，错误；D 5G比蓝牙距离更近：5G是广域技术，错误。","易错警示":"别把5G窄化成“手机网速快”——毫秒级低时延才是它在物联网的王牌。","方法点拨":"5G关键词“低时延（毫秒级）+大带宽”，见“远程手术/自动驾驶/车路协同”即选。"}},{"sec":"基础巩固","type":"单选","num":3,"text":"星闪（NearLink）是一种新型近场通信技术，与蓝牙相比它的优势是：","opts":[{"label":"A","text":"速率更高、时延更低，可同时连多设备"},{"label":"B","text":"传输距离可达上千公里"},{"label":"C","text":"完全不耗电"},{"label":"D","text":"不需要任何芯片"}],"subs":[],"ans":"答案A　速率更高、时延更低，可同时连多设备","al":{"考查点":"星闪与蓝牙对比的理解（理解）。","解题思路":"星闪是新一代近场通信技术，速率较蓝牙提升数倍、时延更低、可同时连接多设备，适合耳机、车载等场景。","逐项剖析":"A 速率更高、时延更低、可同时连多设备：星闪核心优势，正确；B 传输距离达上千公里：星闪是近场技术，错误；C 完全不耗电：仍需供电，错误；D 不需要任何芯片：荒谬，排除。","易错警示":"“近场”属性易被忽略——星闪再强也是近场，别与广域技术混淆。","方法点拨":"新技术记“阵营+王牌”：星闪=近场阵营，王牌=高速低时延多连。"}},{"sec":"基础巩固","type":"单选","num":4,"text":"“NB-IoT适合远而省、5G适合快而急、星闪适合近而密”——这说明物联网选径的原则是：","opts":[{"label":"A","text":"越贵越好"},{"label":"B","text":"按场景需求多径协同、各取所长"},{"label":"C","text":"只用一种技术最先进"},{"label":"D","text":"能连上就行不用选"}],"subs":[],"ans":"答案B　按场景需求多径协同、各取所长","al":{"考查点":"物联网选径原则的归纳（理解·评价）。","解题思路":"三句话各配场景（远省多/快急大/近而密）恰说明“按场景选径、多径协同互补”，故选B。","逐项剖析":"A 越贵越好：违背成本理性，排除；B 按场景需求多径协同、各取所长：原则正确；C 只用一种技术最先进：场景适配才是标准，排除；D 能连上就行不用选：忽视质量与成本，排除。","易错警示":"“最先进≠最合适”是本课思想核心，选径看需求不看参数。","方法点拨":"选径铁律“够用就好、按需组合”，凡问原则必答场景适配与协同互补。"}},{"sec":"基础巩固","type":"判断","num":1,"text":"NB-IoT比Wi-Fi更适合“埋在地下室、几年不换电池”的设备。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"NB-IoT场景优势的判断（理解）。","解题思路":"NB-IoT覆盖穿透力强（能进地下室）、功耗极低（电池用数年），正补Wi-Fi“距离近、需供电”的短板，判断正确。","易错警示":"对比判断要“成对看”：NB-IoT强在哪正是Wi-Fi弱在哪。","方法点拨":"“补短板”视角读判断题：新技术常为补旧技术短板而生。"}},{"sec":"基础巩固","type":"判断","num":2,"text":"物联网新径出现后，蓝牙、Wi-Fi这些旧技术就会被彻底淘汰。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"新旧技术关系的判断（理解）。","解题思路":"各技术适用场景不同、互补共存：蓝牙管近场穿戴、Wi-Fi管家用组网、NB-IoT/5G管广域——新径是补充而非取代，判断错误。","易错警示":"“新技术必然淘汰旧技术”是常见直觉错误；判断前先问“各管什么场景”。","方法点拨":"通信技术演进是“拼图不是替换”，给每种技术找到专属场景即知共存。"}},{"sec":"基础巩固","type":"判断","num":3,"text":"5G-A（5.5G）把时延压到毫秒级，让远程手术、车路协同成为可能。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"5G-A能力的判断（理解）。","解题思路":"5G-A（5.5G）把时延进一步压到毫秒级、速率再提升，能支撑远程手术、车路协同等实时应用，判断正确。","易错警示":"5G-A≠6G，它是5G的增强版本，别混淆代际。","方法点拨":"技术代际线：4G→5G→5G-A（5.5G）→6G（研发中），逐代“更快、更低时延”。"}},{"sec":"能力提升","type":"提升","num":1,"text":"请用“新径三问”（覆盖、功耗、规模）为下列三个场景各选一条传输新径，并写一句理由：①野外森林防火监测桩；②城市公交车与红绿灯的实时协同；③教室几十副耳机无线连接。","opts":[],"subs":[],"ans":"①NB-IoT：森林覆盖偏远、设备省电久置，广域低功耗正合适；②5G（车联网V2X）：车路协同要求毫秒级低时延大带宽；③星闪/蓝牙：教室近场高密，星闪速率高可同时连多副耳机，蓝牙也够用。","al":{"考查点":"“新径三问”的场景应用（应用）。","解题思路":"逐场景套三问选径并写一句理由：①野外森林防火监测桩——覆盖偏远、设备久置省电→NB-IoT；②公交车与红绿灯实时协同——要毫秒级低时延大带宽→5G（车联网V2X）；③教室几十副耳机——近场高密度、要高速多连→星闪（蓝牙也够用）。","易错警示":"场景与路径错配（车路协同选NB-IoT）是大忌；理由要扣住约束词。","方法点拨":"选径题“场景→约束词→技术”三段式，先翻译约束再落笔。"}},{"sec":"能力提升","type":"提升","num":2,"text":"请从“连接规模、功耗、典型应用”三方面对比NB-IoT与5G，并说明它们为什么是“互补”而非“竞争”关系。","opts":[],"subs":[],"ans":"连接规模：NB-IoT单站可接海量低速率终端，5G侧重高速率关键业务；功耗：NB-IoT极低（表计用数年），5G终端相对耗电；应用：NB-IoT管智能水气表、农田监测等“远省多”，5G管远程手术、自动驾驶等“快急大”。互补：一个面向“海量小数据长续航”，一个面向“关键大流量低时延”，按场景搭配使用。","al":{"考查点":"两类广域技术的系统对比（分析）。","解题思路":"按“连接规模、功耗、典型应用”三维成文：NB-IoT单站可接海量低速率终端、功耗极低（表计用数年）、管水气表农田监测等“远省多”；5G侧重高速率关键业务、终端相对耗电、管远程手术自动驾驶等“快急大”。结论=互补而非竞争。","易错警示":"只说“一个快一个慢”太浅；要从规模、功耗、应用三个维度都展开。","方法点拨":"互补关系用一句话记牢：一个管“海量小数据长续航”，一个管“关键大流量低时延”。"}},{"sec":"能力提升","type":"提升","num":3,"text":"我国NB-IoT基站已超百万、智能水气表年增上亿。请说明“基站多”和“表计多”之间有什么关系，并写出这对普通家庭的一个好处。","opts":[],"subs":[],"ans":"基站多→覆盖广、信号好→更多表计能接入→规模上来后模组成本下降→进一步推动普及，形成正循环。对家庭好处：抄表不用再上门、用水异常（如漏水）系统可预警、缴费线上完成，生活更省心。","al":{"考查点":"基础设施与规模经济正循环的分析（分析）。","解题思路":"因果链：基站多→覆盖广信号好→更多表计接入→规模上来后模组成本下降→进一步普及，形成正循环。家庭好处落到“免上门抄表、漏水异常预警、线上缴费”。","易错警示":"漏“成本下降”这一环，正循环就断链；好处要具体到生活场景。","方法点拨":"“正循环”题把链条写成“A多→B好→C多→成本降”，环环相扣才完整。"}},{"sec":"能力提升","type":"提升","num":4,"text":"请为“给村里蔬菜大棚选通信方案”出主意：大棚分散在几公里外，要传温湿度数据（小、慢）还要偶尔回传监控图片（大、快）。你会怎么组合两种技术？","opts":[],"subs":[],"ans":"方案：温湿度等小数据用NB-IoT（覆盖广、省电、资费低，数据量小正合适）；需要回传监控图片或视频时用4G/5G（带宽够大）；两种共用，大棚网关按数据类型分流——小数据走NB-IoT、大流量走蜂窝，多径协同降低成本。","al":{"考查点":"多径协同的组合设计（应用·创造）。","解题思路":"按数据类型分流：温湿度等小数据走NB-IoT（覆盖广、省电、资费低）；监控图片/视频等大流量走4G/5G蜂窝；大棚网关按数据类型分发，实现多径协同、降低成本。","易错警示":"只选一种技术无法兼顾“小数据省钱+大图带宽”两个需求；要写“组合+分流”。","方法点拨":"“组合方案=按数据类型分流”：给每种数据找最划算的路，网关统一调度。"}},{"sec":"拓展挑战","type":"拓展","num":1,"text":"镇里要给全镇路灯装“智能路灯”（自动调光＋故障上报）。技术员说“NB-IoT和5G都能连，不知选哪个”。请你用“数据大不大、要求快不快、电池换不换”三问帮他分析，并写出推荐结论。","opts":[],"subs":[],"ans":"三问：路灯上报的是开关状态、电压、故障等小数据（不大）；调光无需毫秒级响应（不快）；路灯接市电、供电方便（不存在换电池难题）。结论：NB-IoT已完全满足且资费低、覆盖好，优先选NB-IoT；5G的高速率在这里是“大材小用”。选径先看需求，够用就好。","al":{"考查点":"“三问”选型框架的实战应用（应用·评价）。","解题思路":"三问逐一作答：路灯上报开关状态、电压、故障等小数据（不大）；自动调光无需毫秒级响应（不快）；路灯接市电、供电方便（不换电池）→NB-IoT完全满足且资费低、覆盖好，优先选NB-IoT；5G的高速率在此“大材小用”。","易错警示":"若答“5G先进所以选5G”违背“够用就好”原则；三问每问都要有结论词。","方法点拨":"“三问决策法”是选径题通用解：把三问写成三行，行行有“不大/不快/不换”这类判断，结论自然浮现。"}},{"sec":"拓展挑战","type":"拓展","num":2,"text":"有人说“星闪会把蓝牙彻底比下去”。请你从“应用场景互补”的角度写一段话劝他别急，说明两种技术未来会怎样共存。","opts":[],"subs":[],"ans":"星闪速率高、时延低、多连不卡，在耳机、车载、智能座舱等“近而密”场景确实更优；但蓝牙生态庞大、成本低、已有海量设备与成熟方案，在穿戴、入门物联网里仍会长期存在。两类技术会像Wi-Fi与蜂窝一样共存互补：追求极致近场体验用星闪，性价比与兼容性场景用蓝牙，市场按需选择，而非你死我活。","al":{"考查点":"技术共存论点的论证表达（评价）。","解题思路":"先承认星闪在“近而密”场景（耳机、车载、智能座舱）确实更优；再讲蓝牙生态庞大、成本低、已有海量设备与成熟方案，在穿戴与入门物联网中仍长期存在；最后用“Wi-Fi与蜂窝共存”作历史类比收束：按需选择、共存互补。","易错警示":"全盘否定星闪或蓝牙都偏激；共存论证要“各有主场”而非比高低。","方法点拨":"“劝他别急”论述结构：对方对的部分→我方对的部分→历史类比→共存结论。"}},{"sec":"变式闯关","type":"变式","num":1,"text":"换一个场景：为远洋渔船选“报平安”的通信方式——要覆盖茫茫大海、数据小、设备要省电。请从新径三问出发，说出为什么NB-IoT/地面蜂窝都不合适，并给出可行方案。","opts":[],"subs":[],"ans":"三问排查：大海无地面基站，NB-IoT与蜂窝“覆盖”不够；数据小、要省电适合低功耗。可行方案：用卫星通信（低轨卫星）覆盖公海，报文式短消息即可报平安，兼顾覆盖与省电——这说明“新径”不止一种，要按覆盖极限来选。","al":{"考查点":"“三问”框架在极端场景的应用（应用·创造）。","解题思路":"三问排查：公海无地面基站→NB-IoT与蜂窝“覆盖”这一问不合格直接出局；数据小、要省电→低功耗诉求仍在；可行方案=卫星通信（低轨卫星）覆盖公海，报文式短消息即可报平安，兼顾覆盖与省电。","易错警示":"硬推NB-IoT“覆盖广”却忽略公海无基站是死穴；选径要看覆盖极限。","方法点拨":"“新径不止三条”——三问是思维框架，答案可以超出课本技术清单。"}},{"sec":"间隔复习","type":"间隔","num":1,"text":"NB-IoT、5G解决的是“路”的问题（怎么传），那“话”的问题（传什么格式、如何送达确认）靠什么解决？请把两条线说清楚。","opts":[],"subs":[],"ans":"（第9课《互联协议仍沿用》）　“路”由通信技术解决（NB-IoT/5G提供广域无线通道）；“话”由协议解决——设备按MQTT、TCP/IP等统一规则封装与解析数据、确认送达。技术管“通路”，协议管“通话”，二者配合才能完成物物通信。","al":{"考查点":"三问+多径协同的完整规划创造（创造）；跨课迁移——本地农业真实选型。","解题思路":"建议书三块：①用三问分析场景（大棚分散数公里要广覆盖、传感器多且要省电、控制卷帘无需毫秒级时延）；②两类数据分径（温湿度小数据走NB-IoT覆盖广省电资费低；虫情高清图走4G/5G蜂窝或光纤到村）；③断网兜底（大棚网关本地缓存+网络恢复自动补传的“断点续传”，关键告警如夜间低温同时走短信通道直发农户）。","易错警示":"兜底若只写“等网络恢复”不解决“断网期间低温冻棚”的风险；要“本地缓存+独立告警双保险”。","方法点拨":"规划书“分析→分径→兜底”三段骨架，兜底最能拉开档次——容灾设计是工程师思维的分水岭。"}},{"sec":"思维进阶","type":"挑战","num":1,"text":"镇政府要在全镇推开“智慧大棚”，需要为分散大棚选通信方案。请你当“通信规划师”写一份《选径建议书》：①用“新径三问”分析大棚场景对覆盖、功耗、规模、时延的要求；②为“温湿度上报”和“虫情高清图回传”两种数据各选一条路径，说明理由；③如果村里网络时好时坏，你会设计什么兜底机制保证数据不丢？","opts":[],"subs":[],"open":true,"ans":"参考设计要点：①新径三问分析：大棚分散（覆盖要广）、设备多且供电不便（功耗要低）、数量大（连接规模要大）、温湿度上报不追实时（时延要求宽松）；②路径选择：温湿度上报——选低功耗广域物联网（如NB-IoT类）广覆盖慢速通道，一节电池用数年；虫情高清图回传——选4G/5G蜂窝或WiFi回传大带宽通道，满足图片视频流量；③兜底机制：本地先存——网关带存储，网络中断时数据暂存本地，恢复后自动补传；关键告警走双通道（蜂窝+短信）确保不丢。","al":{"考查点":"开放创造：通信选型的需求分析与容灾（创造+评价）","解题思路":"三问分析要把场景特点翻译成通信需求；两条路径按\"数据量/功耗\"差异化选择；兜底含\"暂存+补传+双通道\"","易错警示":"大小数据用同一条通道（未按需分径）；兜底只写\"换网络\"没有暂存补传","方法点拨":"选径题公式：场景翻译成需求→按数据分路径→断网可续传。"}}]},{"t":"达标检测","n":"第二单元 万物互联有协议 · 达标检测卷","isExam":true,"qs":[{"sec":"选择题","type":"选择题","num":1,"text":"下列传输方式中属于有线传输的是：","opts":[{"label":"A","text":"Wi-Fi"},{"label":"B","text":"光纤"},{"label":"C","text":"蓝牙"},{"label":"D","text":"卫星通信"}],"subs":[],"ans":"答案B　光纤","al":{"考查点":"有线/无线分类辨析（理解）。","解题思路":"按“是否靠实体线缆”判：光纤靠光信号在玻璃纤芯传输、需实体线缆属有线；Wi-Fi、蓝牙、卫星靠空中电磁波属无线。","易错警示":"光纤“传光不传电”易误判为无线——有线看线缆不看信号形态。","方法点拨":"“见线缆即有线”可直接排除三个无线项。"}},{"sec":"选择题","type":"选择题","num":2,"text":"RFID系统中负责“发出无线电波唤醒标签并读取信息”的是：","opts":[{"label":"A","text":"电子标签"},{"label":"B","text":"读写器"},{"label":"C","text":"天线宝宝"},{"label":"D","text":"服务器只负责存钱"}],"subs":[],"ans":"答案B　读写器","al":{"考查点":"RFID系统角色识记（记忆）。","解题思路":"读写器=主动方：发出无线电波唤醒标签并读取信息；标签=被动应答方。题干问“发出唤醒并读取”者，自然是读写器。","易错警示":"“天线宝宝”“服务器只负责存钱”为凑数干扰项；识别角色看“谁先发声”。","方法点拨":"“读写器先说话，标签后回答”，主从关系定角色。"}},{"sec":"选择题","type":"选择题","num":3,"text":"手机给手环传数据、耳机连手机听歌，最适合的技术是：","opts":[{"label":"A","text":"卫星"},{"label":"B","text":"光纤"},{"label":"C","text":"蓝牙（短距低功耗）"},{"label":"D","text":"NB-IoT"}],"subs":[],"ans":"答案C　蓝牙（短距低功耗）","al":{"考查点":"蓝牙场景匹配（应用）。","解题思路":"“手机给手环传数据、耳机连手机听歌”=贴身、近距、省电→蓝牙点对点近场正合适。","易错警示":"NB-IoT面向广域表计、卫星光纤过重，均与“贴身近场”不符。","方法点拨":"见“贴身/省电/免网/近距”即选蓝牙。"}},{"sec":"选择题","type":"选择题","num":4,"text":"不同厂商设备能互相通信，最根本的原因是：","opts":[{"label":"A","text":"颜色相同"},{"label":"B","text":"遵守统一通信协议"},{"label":"C","text":"都在中国生产"},{"label":"D","text":"都用锂电池"}],"subs":[],"ans":"答案B　遵守统一通信协议","al":{"考查点":"协议必要性的理解（理解）。","解题思路":"异构设备互通的根本=遵守统一通信协议；颜色、产地、电池与通信机制无关。","易错警示":"“都在中国生产”“都用锂电池”类干扰项用常识即可排除。","方法点拨":"“互通靠协议”是本单元核心结论，直接套用。"}},{"sec":"选择题","type":"选择题","num":5,"text":"给“装在楼道角落、几年不换电池”的智能水表选通信方式，最合适的是：","opts":[{"label":"A","text":"蓝牙"},{"label":"B","text":"Wi-Fi"},{"label":"C","text":"NB-IoT"},{"label":"D","text":"红外"}],"subs":[],"ans":"答案C　NB-IoT","al":{"考查点":"NB-IoT场景匹配（应用）。","解题思路":"“装在楼道角落、几年不换电池”=远、省、多→NB-IoT覆盖穿透强、功耗极低、支持海量连接。","易错警示":"Wi-Fi距离近需供电、蓝牙更短、红外要对准，均不符。","方法点拨":"表计场景三词“远、省、多”锁定NB-IoT。"}},{"sec":"选择题","type":"选择题","num":6,"text":"“寄信三步”中，发送方等待对方“签收回执”对应网络通信的：","opts":[{"label":"A","text":"封装"},{"label":"B","text":"寻址"},{"label":"C","text":"确认（重传）"},{"label":"D","text":"销毁"}],"subs":[],"ans":"答案C　确认（重传）","al":{"考查点":"寄信三步中“确认”的辨识（理解）。","解题思路":"“等待签收回执”=确认机制：对方收到后回执、超时未确认则重发，保证可靠送达；封装是打包、寻址是定位。","易错警示":"“销毁”为凑数干扰项；回执/重传两词一出即选确认。","方法点拨":"三步各配信号词：封装(包)、寻址(地址)、确认(回执/重传)。"}},{"sec":"判断题","type":"判断题","num":1,"text":"无线传输方便自由，因此任何场景都应优先选无线。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"场景选路原则（评价）。","解题思路":"“任何场景都应优先选无线”含绝对化词即错：骨干网、数据中心等场景必须用光纤有线，应“按场景选路”。","易错警示":"无线方便≠万能；判断看场景约束。","方法点拨":"绝对词“任何/都应”先质疑再举反例。"}},{"sec":"判断题","type":"判断题","num":2,"text":"条形码比RFID更适合远距离批量盘点。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"RFID与条形码的区别（理解）。","解题思路":"远距离批量读取恰是RFID（尤其超高频）的优势；条形码需近距离逐张对准扫描，说反了。","易错警示":"方向颠倒题要看清“谁更适合”——批量/远距/隔空三项专利全归RFID。","方法点拨":"“批量、远距、隔空”三特征一出即RFID。"}},{"sec":"判断题","type":"判断题","num":3,"text":"蓝牙设备之间传文件必须连接互联网。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"蓝牙通信特性（理解）。","解题思路":"蓝牙是近场点对点直连，两台设备开蓝牙即可互传，免网络免流量，“必须联网”错误。","易错警示":"手机传文件≠需要网络——蓝牙本身不依赖互联网。","方法点拨":"蓝牙“三免”：免网络、免流量、免配置。"}},{"sec":"判断题","type":"判断题","num":4,"text":"协议是设备通信的“规矩”，没有协议设备即使连上线也无法互相理解。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"协议必要性的判断（理解）。","解题思路":"物理连通只是通路，协议决定“怎么说、怎么找路、怎么确认”，没有协议设备无法互相理解——判断正确。","易错警示":"误以为“连上就能通”；协议是通信的灵魂。","方法点拨":"“线路+规矩”双要件，缺一不可。"}},{"sec":"判断题","type":"判断题","num":5,"text":"物联网新径（NB-IoT/5G/星闪）出现后，蓝牙、Wi-Fi会被彻底淘汰。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"技术共存观（理解）。","解题思路":"各技术适用场景不同、互补共存：蓝牙近场、Wi-Fi组网、NB-IoT/5G管广域——新径是补充而非取代，判断错误。","易错警示":"“新技术必淘汰旧技术”是直觉陷阱。","方法点拨":"拼图式共存：给每种技术找主场。"}},{"sec":"填空题","type":"填空题","num":1,"text":"物联网数据出门有两条路：有线传输靠____，无线传输靠电磁波。","opts":[],"subs":[],"ans":"线缆（光纤/网线等实体介质）","al":{"考查点":"传输双路径载体识记（记忆）。","解题思路":"有线传输靠实体线缆（光纤、网线等）；写“线缆/光纤/网线”等同义介质均给分。","易错警示":"只写“电”不写介质形态不够准确。","方法点拨":"对照记：有线=线缆，无线=电磁波。"}},{"sec":"填空题","type":"填空题","num":2,"text":"RFID电子标签由____和天线组成。","opts":[],"subs":[],"ans":"芯片","al":{"考查点":"RFID标签结构识记（记忆）。","解题思路":"电子标签=芯片（存信息、应答）+天线（收发电磁波、取能）两件套。","易错警示":"勿填电池——无源标签无电池，靠天线取能。","方法点拨":"“芯片是大脑、天线是耳朵”。"}},{"sec":"填空题","type":"填空题","num":3,"text":"蓝牙是____（约10米）的点对点无线通信技术。","opts":[],"subs":[],"ans":"短距离","al":{"考查点":"蓝牙距离特征识记（记忆）。","解题思路":"蓝牙是短距离（约10米）的点对点无线通信技术。","易错警示":"10米是开阔环境参考值，隔墙更短。","方法点拨":"距离阶梯：蓝牙短（10米）、Wi-Fi中（几十米）、蜂窝广。"}},{"sec":"填空题","type":"填空题","num":4,"text":"让设备“说同一种话”的通信规则叫____。","opts":[],"subs":[],"ans":"协议","al":{"考查点":"协议概念识记（记忆）。","解题思路":"让设备“说同一种话”的通信规则即协议；凡“规矩/共同语言/说话规则”即协议。","易错警示":"勿填“网络”——那是通道，规则才是协议。","方法点拨":"协议=通信的“普通话”。"}},{"sec":"填空题","type":"填空题","num":5,"text":"MQTT是物联网常用的____协议（轻量/重量）。","opts":[],"subs":[],"ans":"轻量（消息）","al":{"考查点":"MQTT特征识记（记忆）。","解题思路":"MQTT报文头小、低带宽、弱网可用，是物联网常用的轻量消息协议。","易错警示":"勿填“重量”——MQTT专为小数据、海量连接设计。","方法点拨":"MQTT三字诀“轻、多、弱”。"}},{"sec":"填空题","type":"填空题","num":6,"text":"NB-IoT是____低功耗物联网通信技术，适合远而省的场景。","opts":[],"subs":[],"ans":"广域","al":{"考查点":"NB-IoT类别识记（记忆）。","解题思路":"NB-IoT是广域低功耗物联网技术，适合“远而省”的水表气表场景。","易错警示":"与近场蓝牙/星闪混淆；NB-IoT覆盖以公里计。","方法点拨":"广域阵营=NB-IoT/5G，近场阵营=蓝牙/星闪。"}},{"sec":"简答题","type":"简答题","num":1,"text":"请用“速度、距离、抗干扰”三把尺，比较光纤与卫星通信，并各举一个最适合它的场景。","opts":[],"subs":[],"ans":"速度：光纤快且稳定、时延低，卫星延迟较高；距离：光纤需铺缆（可走海底光缆），卫星覆盖全球无死角；抗干扰：光纤几乎不受电磁干扰，卫星受天气与遮挡影响。场景：光纤——城市骨干网、数据中心；卫星——远洋船舶、沙漠科考、灾区应急。（每维度1分、场景各1分）","al":{"考查点":"三维比较的表达（应用）。","解题思路":"按速度/距离/抗干扰逐维写光纤与卫星的对照，再各配一个放大优势的场景（光纤——城市骨干网/数据中心；卫星——远洋船舶/沙漠科考/灾区应急）。","易错警示":"维度漏写或场景与优势错配扣分；按“每维度1分+场景各1分”组织答案。","方法点拨":"“三维一行+两场景”结构：3行对比拿6分、2个场景拿2分，全取满分。"}},{"sec":"简答题","type":"简答题","num":2,"text":"请写出RFID识别一张校园卡的完整流程，并用“寄信三步”说明电脑传文件为什么能可靠送达。","opts":[],"subs":[],"ans":"RFID流程：读写器发无线电波唤醒标签→卡内天线接收并为芯片供电→芯片回传身份信息→读写器读取交后台验证。（4分）寄信三步：封装——把数据打包加地址头；寻址——按IP地址把数据送到目标设备；确认——对方回“收到”，未收到自动重传。三步齐备数据才能可靠送达。（8分，每步要点到位即给分）","al":{"考查点":"RFID流程与寄信三步的整合表达（应用）。","解题思路":"分两段作答：RFID识别校园卡流程四步（读写器发波唤醒→天线接收取能→芯片回传身份→读取交后台验证，4分）；寄信三步各配机制解释（封装——打包加地址头；寻址——按IP地址送达；确认——回执未收重传，8分）。","易错警示":"两问混答易漏点；先RFID后网络分块作答，块内按序。","方法点拨":"组合题“分块作答、块内按序”，每块自带小分项自然对齐采分点。"}},{"sec":"案例分析题","type":"案例分析题","num":1,"text":"某市给全市路灯装上了“智能路灯”：光线传感器感知天黑自动亮灯、天亮自动熄灭；灯内通信模块把开关状态与故障信息上报平台；平台发现某盏灯不亮会自动派单维修，并在App上展示全市路灯能耗。请回答：①感知、网络、应用三层各用了什么？②该系统的“感知—传输—处理—反馈”闭环如何运转（以“天黑了”为例）？③给路灯选通信方式时，用“新径三问”分析为什么NB-IoT比5G更合适？","opts":[],"subs":[],"ans":"①感知层：光线传感器、灯内状态监测模块；网络层：NB-IoT/蜂窝等通信模块与基站；应用层：管理平台App（调光、故障派单、能耗统计）。②感知：光线传感器感知天色变暗→传输：状态经NB-IoT上传平台→处理：平台判断到亮灯时间→反馈：下发指令让路灯点亮；天亮同理熄灭，系统持续巡检形成闭环。③三问：路灯上报的是小数据（不大）；自动调光无需毫秒级（不快）；路灯接市电（无需低功耗换电池）——但覆盖广、单站海量接入是刚需，NB-IoT覆盖好、资费低、够用即好；5G的高速低时延在此“大材小用”且成本高。（三层3分、闭环6分、选径分析6分）","al":{"考查点":"三层架构识别+闭环运转+三问选径的综合应用（分析·评价）。","解题思路":"分三问作答：①三层各填设备——感知层：光线传感器、灯内状态监测模块；网络层：NB-IoT/蜂窝等通信模块与基站；应用层：管理平台App（调光、故障派单、能耗统计）。②闭环以“天黑了”为例走完“感知（光线传感器感知变暗）→传输（状态经NB-IoT上传）→处理（平台判断到亮灯时间）→反馈（下发指令亮灯）”四环，天亮同理，系统持续巡检。③三问分析：路灯上报小数据（不大）、自动调光无需毫秒级（不快）、路灯接市电（不换电池）——NB-IoT覆盖好、资费低、够用即好；5G高速低时延在此“大材小用”且成本高。","易错警示":"闭环环节串错序（先处理再感知）或三层设备张冠李戴；每问按分值控制篇幅。","方法点拨":"“案例三问”法：识别题标层名、闭环题写四环链、选径题用三问表，问什么答什么。"}},{"sec":"综合实践题","type":"综合实践题","num":1,"text":"学校要建“智慧快递驿站”：取件高峰人多，希望实现“刷码/刷卡快速取件、包裹防盗、取件记录可查”。请设计一份《智慧驿站方案》：①画出系统框图：RFID/二维码识别、网络传输、平台管理三层各是什么；②写出“取件”的完整流程（从学生到驿站到取走包裹）；③指出用RFID方案相比“人工报号取件”的三个优势；④写出系统的一个失灵场景与对策，并谈谈“取件记录”隐私该注意什么。","opts":[],"subs":[],"ans":"①识别层：包裹RFID标签/取件码＋驿站读写器或扫码枪；网络层：Wi-Fi/4G把数据传上云平台；应用层：驿站管理App与短信/小程序通知。②流程：包裹入库时录入标签与收件人绑定→学生收到取件码→到驿站感应区刷码/刷卡→平台验证身份并定位包裹格口→格口自动弹开→取走包裹，系统更新状态为“已取件”并通知寄件方。③优势：批量入库快（整筐识别）、防错拿（身份与包裹强绑定）、可追溯（谁何时取走有记录、防盗）。④失灵示例：网络断→本地离线验证兜底＋先取件后补传记录；标签损坏→保留取件码人工通道。隐私注意：取件记录属个人信息，只用于驿站管理，不得另作他用，后台需加密、限制访问、定期清理。（框图4分、流程6分、三优势6分、失灵对策4分、隐私5分）","al":{"考查点":"系统设计全流程的创造（创造）。","解题思路":"按四问成文：①框图三层——识别层：包裹RFID标签/取件码+驿站读写器或扫码枪；网络层：Wi-Fi/4G把数据传上云平台；应用层：驿站管理App与短信/小程序通知。②取件流程六步——入库录入绑定→学生收到取件码→到感应区刷码/刷卡→平台验证身份并定位格口→格口弹开取走→系统更新“已取件”并通知寄件方。③RFID相对人工报号三优势——批量入库快（整筐识别）、防错拿（身份与包裹强绑定）、可追溯防盗（谁何时取走有记录）。④失灵场景+隐私——网络断→本地离线验证+先取件后补传；标签损坏→保留取件码人工通道；取件记录属个人信息，只用于驿站管理，后台加密、限制访问、定期清理。","易错警示":"“流程”漏“状态更新”环节、“失灵”只写场景无对策、“隐私”空谈保护——每问都要有落地对策。","方法点拨":"综合设计题“框图→流程→亮点→风险”四段式，风险段写“场景+对策+隐私”三件套，是拉开分差的关键。"}}]}]},{"t":"第三单元 简单物联功能实践","isFinal":false,"lessons":[{"t":"第 11 课 · 配套练习","n":"物联功能细分解","isExam":false,"qs":[{"sec":"回忆热身","type":"回忆","num":1,"text":"把一个“智能门禁”这种大需求，先拆成“识别、开锁、通知、记录”等小模块的方法，叫做____法。","opts":[],"subs":[],"ans":"功能分解","al":{"考查点":"功能分解概念的识记（记忆）。","解题思路":"把“智能门禁”这类大需求先拆成“识别、开锁、通知、记录”等小模块的方法，教材定名为“功能分解法”；题干描述即其定义。","易错警示":"勿填“模块化/分层设计”等近义词——题干问的是本课给定名称。","方法点拨":"记“先功能后设备”，凡“大需求拆小模块”即功能分解。"}},{"sec":"回忆热身","type":"回忆","num":2,"text":"用“分解四问”推敲每个子功能时，要追问：谁触发？感知什么？怎么处理？____什么？","opts":[],"subs":[],"ans":"反馈","al":{"考查点":"分解四问的识记（记忆）。","解题思路":"分解四问=谁触发、感知什么、怎么处理、反馈什么；题干已给前三问（谁触发、感知什么、怎么处理），第四问补“反馈”。","易错警示":"勿填“记录/开锁”——四问末位专指“反馈”（向谁、以什么形式告知结果）。","方法点拨":"四问口诀“触发—感知—处理—反馈”，背四字链条即可对号填空。"}},{"sec":"基础巩固","type":"单选","num":1,"text":"工程师设计一套智能门禁，正确的起步做法是：","opts":[{"label":"A","text":"直接买摄像头和刷卡器"},{"label":"B","text":"先把“智能门禁”总需求分解为识别、开锁等子功能"},{"label":"C","text":"先写控制程序"},{"label":"D","text":"先申请网络带宽"}],"subs":[],"ans":"答案B　先把“智能门禁”总需求分解为识别、开锁等子功能","al":{"考查点":"工程起步顺序的判断（理解）。","解题思路":"教材铁律“先功能后设备”：起步应先把总需求分解为子功能，再谈设备与程序。","逐项剖析":"A 直接买摄像头和刷卡器：跳过功能规划，排除；B 先把“智能门禁”总需求分解为识别、开锁等子功能：正确起步；C 先写控制程序：功能未明先写码必返工，排除；D 先申请网络带宽：运维细节过早，排除。","易错警示":"“先买设备”是生活直觉却是工程误区——功能稳定、设备可变。","方法点拨":"凡问“第一步怎么做”，牢记“先功能后设备、先规划后采购”。"}},{"sec":"基础巩固","type":"单选","num":2,"text":"小明说“我要装个摄像头”。从工程角度看，这句话的问题在于：","opts":[{"label":"A","text":"摄像头太贵"},{"label":"B","text":"把“设备”当成了“功能”，应说实现“识别”功能"},{"label":"C","text":"摄像头不能联网"},{"label":"D","text":"摄像头画质不够"}],"subs":[],"ans":"答案B　把“设备”当成了“功能”，应说实现“识别”功能","al":{"考查点":"功能与设备之辨（理解）。","解题思路":"“装摄像头”说的是设备，“实现识别”才是功能——识别可用刷卡、人脸、密码等多种设备实现。","逐项剖析":"A 摄像头太贵：与工程思维无关，排除；B 把“设备”当成了“功能”，应说实现“识别”功能：正中要害，正确；C 摄像头不能联网：题干无此假设，排除；D 画质不够：无关，排除。","易错警示":"“我要装××”句式是常见陷阱——先问“要它实现什么功能”。","方法点拨":"判断“设备还是功能”：能换一种实现方式的即功能；摄像头、刷卡器都是手段。"}},{"sec":"基础巩固","type":"单选","num":3,"text":"用“点外卖”类比理解功能分解：外卖平台是总系统，下单、接单、配送、评价是它的子功能。这说明：","opts":[{"label":"A","text":"总系统由若干可协作的子功能模块构成"},{"label":"B","text":"买电动车是子功能"},{"label":"C","text":"子功能越多越差"},{"label":"D","text":"总系统和子功能没关系"}],"subs":[],"ans":"答案A　总系统由若干可协作的子功能模块构成","al":{"考查点":"“点外卖”类比的归纳（理解）。","解题思路":"类比要抓结构共性：外卖平台是大系统，下单、接单、配送、评价是协作子功能——总系统由可协作的子功能模块构成。","逐项剖析":"A 总系统由若干可协作的子功能模块构成：正确；B 买电动车是子功能：与平台业务无关，排除；C 子功能越多越差：数量与质量无关，排除；D 总系统和子功能没关系：与分解思想相反，排除。","易错警示":"类比题别被“点外卖”带跑，落点永远是“系统—模块—协作”。","方法点拨":"读类比题先找“本体—喻体”对应：外卖平台=总系统、各环节=子功能。"}},{"sec":"基础巩固","type":"单选","num":4,"text":"在功能分解树中，“记录”子功能的作用是：","opts":[{"label":"A","text":"把门打开"},{"label":"B","text":"感知是否有人"},{"label":"C","text":"保存“谁、何时进出”的数据"},{"label":"D","text":"给主人发消息"}],"subs":[],"ans":"答案C　保存“谁、何时进出”的数据","al":{"考查点":"“记录”子功能职责的理解（理解）。","解题思路":"记录=把“谁、何时进出”等数据保存成日志；通知才是向主人发消息——两者分工不同。","逐项剖析":"A 把门打开：开锁的职责，排除；B 感知是否有人：识别的职责，排除；C 保存“谁、何时进出”的数据：记录的职责，正确；D 给主人发消息：通知的职责，排除。","易错警示":"记录（存数据）与通知（推消息）最易混——一个写库、一个发信。","方法点拨":"按“动词对功能”：打开=开锁、感知=识别、保存=记录、发消息=通知。"}},{"sec":"基础巩固","type":"判断","num":1,"text":"做物联网项目时，应该先确定用哪些设备，再考虑要实现什么功能。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"先功能还是先设备的判断（理解）。","解题思路":"教材铁律“先功能后设备”：功能稳定、设备可变；先确定设备再想功能是本末倒置，判断错误。","易错警示":"“先想买什么”是新手通病；正确顺序是功能→方案→设备。","方法点拨":"判断题一见“先买设备再想功能”即错，反过来说则对。"}},{"sec":"基础巩固","type":"判断","num":2,"text":"智能门禁的“识别”功能只能用摄像头（人脸识别）这一种方式实现。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"识别实现方式唯一性的判断（理解）。","解题思路":"“识别”不只有摄像头人脸识别：刷卡、密码、扫码皆可实现——功能稳定、设备可变。","易错警示":"“只能用××设备”句式是绝对化陷阱，举出替代方案即破。","方法点拨":"“只能”出现即质疑——任一功能至少可举两种实现方式。"}},{"sec":"基础巩固","type":"判断","num":3,"text":"功能分解树的根节点应当写清总目标（如“智能门禁系统”）。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"分解树结构的判断（记忆）。","解题思路":"分解树自顶向下：根节点写总目标（如“智能门禁系统”），一级分支才是各子功能模块，判断正确。","易错警示":"别把根节点误写成子功能——根=总目标，枝=子功能。","方法点拨":"画树顺序：先根（总目标）后枝（子功能），枝枝可再分。"}},{"sec":"能力提升","type":"提升","num":1,"text":"请写出“分解四问”的内容，并用它说明“通知”子功能该如何被实现（谁触发、感知什么、怎么处理、反馈什么）。","opts":[],"subs":[],"ans":"四问：谁触发、感知什么、怎么处理、反馈什么。通知：访客按门铃触发→门铃按键感知→云端或控制器处理→向主人手机推送“有人按门铃”消息。","al":{"考查点":"分解四问的完整应用（应用）。","解题思路":"先默写四问，再按四问逐条说明“通知”子功能：谁触发（访客按门铃）→感知什么（门铃按键被按）→怎么处理（云端/控制器判断）→反馈什么（向主人手机推送消息）。","易错警示":"四问与回答脱节（漏“谁触发”或“反馈”）会扣分；四问一个都不能少。","方法点拨":"“四问造句法”：每问一个主谓宾短句，四句串起来就是该子功能的完整说明。"}},{"sec":"能力提升","type":"提升","num":2,"text":"连线：把左侧说法与右侧类别连线（写序号）。①装个摄像头 ②实现识别功能 ③买刷卡器 ④实现记录功能｜A功能 B设备","opts":[],"subs":[],"ans":"①—B；②—A；③—B；④—A","al":{"考查点":"功能与设备分类的应用（应用）。","解题思路":"按“能否换实现方式”判：识别、记录是功能（A）；摄像头、刷卡器是实现功能的设备（B）。","易错警示":"“装个摄像头”虽含动作，但指向设备采购，别被动词迷惑。","方法点拨":"连线题先把两列各自归类：带具体硬件名词的多为设备。"}},{"sec":"能力提升","type":"提升","num":3,"text":"用“点外卖”类比，把“智能门禁”分解为至少4个子功能，并写出层级（文字描述即可）。","opts":[],"subs":[],"ans":"根：智能门禁系统；一级分支：识别（谁进门）、开锁（放人进）、通知（告诉主人）、记录（记日志）。答出4个合理子功能即可。","al":{"考查点":"分解树的构造（应用·创造）。","解题思路":"自顶向下写层级：根=智能门禁系统；一级分支=识别（谁进门）、开锁（放人进）、通知（告诉主人）、记录（记日志），写4个合理子功能即可。","易错警示":"子功能写成设备名（摄像头、锁）即偏题——分解的是功能不是设备。","方法点拨":"“写功能不写设备”自查法：每写一项先问“它能换一种设备实现吗”。"}},{"sec":"能力提升","type":"提升","num":4,"text":"为什么教材强调“功能不等于设备”？请举“识别”功能的两种不同实现方式说明。","opts":[],"subs":[],"ans":"同一功能可用不同设备实现。识别可用刷卡（射频卡）、人脸识别（摄像头）或密码键盘；先定功能再选设备，方案更灵活。","al":{"考查点":"功能与设备关系的解释（理解·分析）。","解题思路":"论证=同一功能可用不同设备实现：识别可用刷卡（射频卡）、人脸（摄像头）或密码键盘；先定功能再选设备，方案更灵活。","易错警示":"只背结论不给两种实现例证，说服力不足。","方法点拨":"论证题“观点+两个例证”结构，例证选差异大的设备更能说明“可变”。"}},{"sec":"拓展挑战","type":"拓展","num":1,"text":"情境：学校图书馆想装“智能借阅门禁”。请你为它规划功能分解树，至少写出4个子功能，并说明其中两个子功能之间的配合关系。","opts":[],"subs":[],"ans":"子功能：识别（读者身份）、开锁（放行）、通知（借还提醒）、记录（借阅日志）、报警（未借出带出门）。配合：识别通过后触发开锁，并同时写入记录，记录又为通知提供依据。","al":{"考查点":"分解树+子功能配合分析（应用·分析）。","解题思路":"先列子功能（识别、开锁、通知、记录、报警），再挑两个讲配合：识别通过→触发开锁→同时写入记录，记录又为通知提供依据。","易错警示":"“配合关系”要写数据或动作如何在功能间传递，不是简单并列罗列。","方法点拨":"配合关系用“A的结果是B的输入”句式写，系统感立现。"}},{"sec":"拓展挑战","type":"拓展","num":2,"text":"评价：小刚说“我家智能音箱就是物联网，因为我用嘴对它说话它就放歌”。请结合“功能分解”观点评析这句话是否准确，并帮他写出智能音箱的两个子功能。","opts":[],"subs":[],"ans":"不准确：只描述了一个现象，没体现功能分解。可分解为：识别（听懂语音指令）、处理（语义理解）、反馈（播放或控制）、记录（使用习惯）。应先功能后设备。","al":{"考查点":"用功能分解观点评析现象（评价）。","解题思路":"评析分两步：先判“不准确”——只描述一个现象，没体现功能分解；再示范：智能音箱可分解为识别（听懂语音）、处理（语义理解）、反馈（播放/控制）、记录（使用习惯），应先功能后设备。","易错警示":"只评价不给分解示范等于只答一半；评析要先给结论再给理由。","方法点拨":"评析题公式“结论+依据+示范”：用本课工具（功能分解）改造对方的说法。"}},{"sec":"变式闯关","type":"变式","num":1,"text":"换场景：小区快递柜也是物联网系统。把“取快递”类比功能分解，写出它的三个子功能（如识别、开锁、记录）并各举一个实现设备。","opts":[],"subs":[],"ans":"识别（扫码验证）→手机或柜体扫码器；开锁（对应格口弹开）→电控锁；记录（谁何时取）→云端日志；通知（取件提醒）→手机推送。","al":{"考查点":"功能分解树+分解四问+云端依赖的创造应用（创造）；跨课迁移——工程建模到陌生场景。","解题思路":"三段作答：①画树——根=智能就餐管理系统，一级=识别（刷脸/刷卡认人）、计费（算钱）、通知（余额提醒）、记录（消费日志）、显示（扣款反馈）；②四问套“计费”——学生刷卡触发→读卡器感知卡号→系统查餐费标准并计算→显示屏反馈扣款金额与余额；③云端配合要答“为什么”——识别与记录、计费与记录都需跨终端共享同一账户与消费数据，单台设备存不下也同步不了。","易错警示":"计费四问漏“反馈”环节；云端依赖只写“需要”不写原因会扣分。","方法点拨":"“新系统设计”题复用模板：画树→挑一子功能跑四问→找需云端的配对并给理由，三步成文。"}},{"sec":"间隔复习","type":"间隔","num":1,"text":"上节课我们了解了物物互通的新途径。请写出其中两种互联方式，并各给出一个适用场景。","opts":[],"subs":[],"ans":"（第10课《物物互通有新径》）　示例：蓝牙——近距离点对点，如手机连耳机/手环；WiFi——中距离高速传输，如摄像头把画面传到家里路由器；移动网络——远距离广覆盖，如共享单车通过4G上报位置（写出两种合理方式与场景即可）。","al":{"考查点":"常见互联方式与场景匹配（理解）。","解题思路":"按\"距离、速率、功耗\"三维匹配场景：近低耗选蓝牙，中距高速选WiFi，广域移动选蜂窝网络。","易错警示":"把蓝牙说成远距离传输——超出10米量级即不适用。","方法点拨":"记三要素口诀：\"近蓝牙、中WiFi、远蜂窝\"。"}},{"sec":"间隔复习","type":"间隔","num":2,"text":"\"物物互通\"与\"物物相联\"一字之差，两者的侧重点有何不同？请各用一句话说明。","opts":[],"subs":[],"ans":"（第10课《物物互通有新径》）　\"物物相联\"侧重物理连接——设备之间有链路可达；\"物物互通\"侧重数据与语义层面的互认——设备不仅能连上，还能按共同协议\"听懂\"彼此的数据并协同工作。","al":{"考查点":"\"联\"与\"通\"的概念辨析（理解）。","解题思路":"联是通路，通是语义：连上≠听懂，互通=按协议互认并协同。","易错警示":"把\"连了网\"当\"互通\"——两台设备连同一WiFi但协议不通仍无法协作。","方法点拨":"类比：电话接通（联）vs 说同一种语言（通）。"}},{"sec":"思维进阶","type":"挑战","num":1,"text":"【真实情境】学校新建食堂，想装一套“智能就餐管理系统”。请你仿照“功能分解树”方法设计方案：①画出总目标与至少4个子功能模块（如识别、计费、通知、记录）；②用“分解四问”说明“计费”子功能怎么实现（谁触发、感知什么、怎么处理、反馈什么）；③指出哪两个子功能需要“云端”配合，并说明为什么。","opts":[],"subs":[],"open":true,"ans":"参考设计要点：①功能分解树：总目标\"智能就餐管理\"→识别（刷卡/刷脸确认身份）、计费（按餐自动扣费）、通知（余额不足/取餐提醒）、记录（消费明细与营养统计）、库存（菜品余量联动后厨）至少四模块；②计费\"分解四问\"：谁触发——取餐窗口读卡触发；感知什么——餐品对应价格与卡内余额；怎么处理——余额≥餐价则扣款成功，否则拦截；反馈什么——屏幕显示扣款金额与余额，余额不足推送充值提醒；③需云端配合的两模块：记录（数据汇总云端存储、家长可远程查询）与库存（多窗口数据汇总分析才能联动后厨），因为它们需要跨终端汇聚数据、集中处理。","al":{"考查点":"开放创造：功能分解方法的应用（创造+应用）","解题思路":"分解树子功能相互独立且合起来覆盖总目标；四问严格按\"触发—感知—处理—反馈\"；云端判选的依据是\"需不需要集中汇聚\"","易错警示":"子功能互相重叠（识别与计费混写）；云端判选只写\"数据多\"没有说清汇聚逻辑","方法点拨":"分解题公式：树状拆分→单模块四问→云端=集中数据的事。"}}]},{"t":"第 12 课 · 配套练习","n":"刷卡开锁易实现","isExam":false,"qs":[{"sec":"回忆热身","type":"回忆","num":1,"text":"刷卡开锁使用的射频识别（RFID）是____识别技术，卡片靠近读卡器就能被读到，无需插卡。","opts":[],"subs":[],"ans":"非接触（近场）","al":{"考查点":"RFID识别类别的识记（记忆）。","解题思路":"RFID=射频识别，是非接触（近场）识别技术：卡片靠近读卡器即可被读，无需插卡或接触。","易错警示":"勿填“红外/条形码”——近场无线电耦合才是RFID的特征。","方法点拨":"词源记忆法：Radio Frequency（射频）即“隔空用无线电”，天然非接触。"}},{"sec":"回忆热身","type":"回忆","num":2,"text":"RFID刷卡开锁四步流程为：刷卡→读卡→____→开锁。","opts":[],"subs":[],"ans":"验证","al":{"考查点":"刷卡四步流程的识记（记忆）。","解题思路":"四步=刷卡→读卡→验证→开锁；题干已给刷卡、读卡、开锁，缺第三位“验证”。","易错警示":"勿填“比对/授权”等变体——标准答案是“验证”，比对是它内部的动作。","方法点拨":"四步口诀“刷—读—验—开”，验证居安全闸门位，最要紧。"}},{"sec":"基础巩固","type":"单选","num":1,"text":"RFID门禁卡能被读卡器读到，但卡里没有电池。原因是：","opts":[{"label":"A","text":"卡靠太阳能"},{"label":"B","text":"读卡器发射无线电给卡供能并读取唯一编号"},{"label":"C","text":"卡连着电线"},{"label":"D","text":"卡里有大电池"}],"subs":[],"ans":"答案B　读卡器发射无线电给卡供能并读取唯一编号","al":{"考查点":"无源卡供能原理的理解（理解）。","解题思路":"卡里没电池却能读=近场耦合：读卡器发射无线电波为卡供能，同时读取卡内唯一编号。","逐项剖析":"A 卡靠太阳能：荒谬，排除；B 读卡器发射无线电给卡供能并读取唯一编号：正确；C 卡连着电线：非接触卡无物理接线，排除；D 卡里有大电池：与题干“没有电池”矛盾，排除。","易错警示":"“无源≠无能量”再强调：能量来自读卡器的电磁场。","方法点拨":"“无源卡三连问”：电从哪来（读卡器波）→存什么（编号）→怎么读（隔空）。"}},{"sec":"基础巩固","type":"单选","num":2,"text":"刷卡开锁四步中，最关键、不能省略的一步是：","opts":[{"label":"A","text":"刷卡"},{"label":"B","text":"读卡"},{"label":"C","text":"验证（比对卡号是否授权）"},{"label":"D","text":"开锁"}],"subs":[],"ans":"答案C　验证（比对卡号是否授权）","al":{"考查点":"四步中安全核心环节的判断（理解）。","解题思路":"验证=把卡号与授权名单比对，失败即拒绝——它是整个流程的安全闸门，最不能省略。","逐项剖析":"A 刷卡：输入动作，排除；B 读卡：感知编号，排除；C 验证（比对卡号是否授权）：安全判断核心，正确；D 开锁：验证通过后的执行，排除。","易错警示":"“开锁”看似是目的，但无验证的开锁是灾难——安全在验证。","方法点拨":"凡问“最关键/安全闸门”即答验证，这是本课题眼。"}},{"sec":"基础巩固","type":"单选","num":3,"text":"用“钥匙串”类比：门禁卡像电子钥匙，读卡器像锁眼，那么“验证”相当于：","opts":[{"label":"A","text":"把钥匙插进锁"},{"label":"B","text":"看这把钥匙配不配这把锁"},{"label":"C","text":"把门推开"},{"label":"D","text":"给钥匙充电"}],"subs":[],"ans":"答案B　看这把钥匙配不配这把锁","al":{"考查点":"“钥匙串”类比的对应（理解）。","解题思路":"验证=核对卡号是否授权，相当于“看这把钥匙配不配这把锁”，是安全检查而非动作执行。","逐项剖析":"A 把钥匙插进锁：对应“刷卡”接触，排除；B 看这把钥匙配不配这把锁：对应“验证”授权，正确；C 把门推开：对应“开锁”执行，排除；D 给钥匙充电：无对应，排除。","易错警示":"类比要按“动作目的”对号：插=刷卡、配不配=验证、推开=开锁。","方法点拨":"读类比题先定“四步对应物”，再看题干问的是哪一步。"}},{"sec":"基础巩固","type":"单选","num":4,"text":"普通遥控开门与刷卡门禁的本质区别是：","opts":[{"label":"A","text":"遥控更贵"},{"label":"B","text":"遥控按了就开、无验证；门禁刷了先验证，不在名单就拒"},{"label":"C","text":"遥控距离更远"},{"label":"D","text":"门禁不用电"}],"subs":[],"ans":"答案B　遥控按了就开、无验证；门禁刷了先验证，不在名单就拒","al":{"考查点":"遥控与门禁本质区别的辨析（理解）。","解题思路":"遥控=单向“按了就开”，无验证环节；门禁=先验证授权再开，不在名单即拒——验证有无是安全本质。","逐项剖析":"A 遥控更贵：价格非本质，排除；B 遥控按了就开无验证、门禁刷了先验证不在名单就拒：正确；C 遥控距离更远：不是本质区别，排除；D 门禁不用电：错误。","易错警示":"遥控器也“认码”，但认的是固定码、不校验使用者授权身份——区别在“是否验证授权”。","方法点拨":"安全对比题找“验证”二字：有验证=门禁级，无验证=遥控级。"}},{"sec":"基础巩固","type":"判断","num":1,"text":"卡一贴读卡器门就开，说明“刷卡”和“开锁”是同一步，中间没有其他环节。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"刷卡是否直通的判断（理解）。","解题思路":"“一贴就开”是现象错觉——中间必有“读卡→验证”，验证失败则拒绝，刷了未必开，判断错误。","易错警示":"别被生活经验带偏：授权卡秒开正说明验证快速通过，不代表没有验证。","方法点拨":"凡“没有中间环节/刷了必开”的说法，对照四步查缺即判错。"}},{"sec":"基础巩固","type":"判断","num":2,"text":"RFID卡片内有唯一编号，相当于“身份证号”，这正是验证环节比对的依据。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"卡号唯一性意义的判断（理解）。","解题思路":"RFID卡内编号唯一，相当于“身份证号”，验证环节正是拿它比对授权名单，判断正确。","易错警示":"唯一编号是“身份标识”，不是密码，但正因唯一才能作比对凭据。","方法点拨":"“卡号=身份证号”喻记：验证=查这个人有没有进门的资格。"}},{"sec":"基础巩固","type":"判断","num":3,"text":"捡到别人丢的门禁卡也能刷开，说明验证环节可有可无。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"验证必要性与挂失意识的判断（评价）。","解题思路":"捡到授权卡能刷开，恰恰证明验证是必要的安全闸门——正因它在名单上能通过，才要及时挂失注销防冒用，判断错误。","易错警示":"题干推论方向是陷阱：能刷开不是验证无用，而是该卡仍在授权名单上。","方法点拨":"“失卡冒用”题记三步：卡在名单→能开→所以必须挂失注销。"}},{"sec":"能力提升","type":"提升","num":1,"text":"按“刷卡→读卡→验证→开锁”顺序，写出每一步的职责（每步一句）。","opts":[],"subs":[],"ans":"刷卡：用户持卡靠近读卡器（输入）；读卡：读卡器无线电读卡内唯一编号（感知）；验证：系统比对编号是否在授权名单（处理）；开锁：控制器命令电锁打开（执行反馈）。","al":{"考查点":"四步各环节职责表述（应用）。","解题思路":"每步一句职责：刷卡=用户持卡靠近（输入）；读卡=读卡器无线电读唯一编号（感知）；验证=系统比对是否在授权名单（处理）；开锁=控制器命令电锁打开（执行反馈）。","易错警示":"四步职责别张冠李戴；可映射到“输入—感知—处理—执行”四类动作自查。","方法点拨":"把四步映射“输入/感知/处理/执行”，职责自然清楚。"}},{"sec":"能力提升","type":"提升","num":2,"text":"排序：把“门禁卡刷卡开锁”的步骤排成正确顺序（写序号）。①读卡器读到卡号 ②用户持卡靠近 ③电锁打开 ④系统比对授权名单","opts":[],"subs":[],"ans":"②①④③","al":{"考查点":"四步顺序排序（理解·应用）。","解题思路":"先动作后判断再执行：持卡靠近（②）→读到卡号（①）→比对授权名单（④）→电锁打开（③），答案②①④③。","易错警示":"易把“读到卡号”与“比对”顺序弄反——先感知后判断。","方法点拨":"排序题按“先后因果”推：人先动→机器感知→系统判断→设备执行。"}},{"sec":"能力提升","type":"提升","num":3,"text":"为什么“验证”不能省？请举一个省略验证会带来风险的例子。","opts":[],"subs":[],"ans":"省略验证则任何人刷卡都开，捡到丢失卡或复制卡的人也能进，校园安全失守；验证是授权放行的闸门。","al":{"考查点":"省略验证的风险论证（评价）。","解题思路":"反证：省略验证→任何人刷卡都开→捡到丢失卡或复制卡的人也能进→校园安全失守；验证是授权放行的闸门。","易错警示":"举例要具体（丢卡、复制卡），并落到后果，而非空喊“不安全”。","方法点拨":"“不能省”论证模板：省了会怎样（场景）→后果→所以它是闸门。"}},{"sec":"能力提升","type":"提升","num":4,"text":"连线：把左侧与右侧连线（写序号）。①射频识别 ②验证 ③读卡器 ④开锁｜A执行反馈 B感知读编号 C非接触识别技术 D比对授权名单","opts":[],"subs":[],"ans":"①—C；②—D；③—B；④—A","al":{"考查点":"概念与角色连线（理解）。","解题思路":"①射频识别→C非接触识别技术；②验证→D比对授权名单；③读卡器→B感知读编号；④开锁→A执行反馈。","易错警示":"读卡器与验证职责易混：读卡器只负责“感知读取”，判断比对在系统。","方法点拨":"“谁干什么”连线题按四步角色逐项对应，勿跳步。"}},{"sec":"拓展挑战","type":"拓展","num":1,"text":"情境：访客来校，门卫想给一张“临时授权卡”让他当天能进。请设计这张卡的四步流程，并说明“验证”环节如何保证只在授权时段内有效。","opts":[],"subs":[],"ans":"流程：发卡（写入访客编号与时段）→访客刷卡→读卡读到编号→验证（编号在名单且未过期）→开锁。验证时系统同时检查编号与有效期，超时或名单删除即拒绝，保证临时有效。","al":{"考查点":"临时授权+时段验证设计（应用·创造）。","解题思路":"流程=发卡（写入访客编号与时段）→刷卡→读编号→验证（在名单且未过期）→开锁；说明验证环节双条件检查（身份授权+有效期），超时或名单删除即拒绝，保证临时有效。","易错警示":"只答“过期即拒”没答“名单删除也可撤销”会不够完整。","方法点拨":"临时授权题关键词“双条件验证”：身份在名单+时间在窗口，两条件AND才放行。"}},{"sec":"拓展挑战","type":"拓展","num":2,"text":"方案设计：学校要为“图书漂流角”设计刷卡借书装置。请写（文字描述）刷卡式四步流程，并指出它与门禁在“验证”对象上的不同。","opts":[],"subs":[],"ans":"借书卡刷→读卡读编号→验证（是否为注册读者且未超借）→开锁（书柜弹开）。不同：门禁验证“能否进门”，借书验证“借阅资格与限额”，对象从身份变为权限状态。","al":{"考查点":"刷卡应用迁移+验证对象对比（应用·分析）。","解题思路":"流程同四步：借书卡刷→读编号→验证（是否注册读者且未超借）→开锁（书柜弹开）；对比点：门禁验证“能否进门”（身份授权），借书验证“借阅资格与限额”（权限状态）。","易错警示":"“验证对象不同”是本题灵魂——身份 vs 权限状态，别答成流程不同。","方法点拨":"对比验证对象问一句“系统在查什么”：查人=身份，查状态=权限。"}},{"sec":"变式闯关","type":"变式","num":1,"text":"换场景：公交车刷卡机也是射频识别应用。把“上车刷卡”类比门禁四步，写出各步（刷卡、读卡、验证、扣费执行），并指出验证在这里比对的是什么。","opts":[],"subs":[],"ans":"刷卡（举卡靠近）→读卡（读卡内编号与余额）→验证（卡是否有效、余额足够）→扣费执行（自动减额并嘀声）。验证比对的是卡状态与余额，而非门禁的进门授权。","al":{"考查点":"RFID四步迁移公交场景（应用）。","解题思路":"对应四步：刷卡（举卡靠近）→读卡（读编号与余额）→验证（卡是否有效、余额足够）→扣费执行（自动减额并嘀声）；验证比对的是卡状态与余额，而非门禁的进门授权。","易错警示":"公交“验证”比对余额资格，不是门禁式的进门授权——场景不同验证对象不同。","方法点拨":"同技术异场景题，锁定“验证环节在查什么”即抓住场景差异。"}},{"sec":"间隔复习","type":"间隔","num":1,"text":"上节课我们用“功能分解”把智能门禁拆成识别、开锁、通知、记录等子功能。请写出其中一个子功能（如“识别”），并说明它属于“功能”而不是“设备”的理由。","opts":[],"subs":[],"ans":"（第11课《物联功能细分解》）　示例：识别是功能，指确认进门者身份；它可用刷卡、人脸或密码等多种设备实现，所以识别是目的、设备是手段，先功能后设备。","al":{"考查点":"四步流程+防冒用安全规则+对比论证（创造）；跨课迁移——社区安全议题。","解题思路":"①流程含验证：居民刷卡→读卡读编号→验证（编号在授权名单且未挂失）→开锁；②两条防冒用规则：卡丢失可电话挂失立即注销；刷卡同时输入户密码双因子验证；③对比论证：配的钥匙丢了只能换锁，刷卡权限在系统里可随时注销，更可控。","易错警示":"规则要“可执行”（挂失/双因子）而非“提醒保管好”；对比论证要落到“可注销性”。","方法点拨":"安全设计题“流程标验证+两条硬规则+一句对比收束”三段式。"}},{"sec":"思维进阶","type":"挑战","num":1,"text":"【真实情境】老旧小区想给单元楼加装“刷卡门禁”，但居民担心“卡丢了被人捡去开门”。请你设计方案：①写出完整四步流程，并标出“验证”环节；②设计两条防止“丢卡被冒用”的安全规则（可结合限时、挂失、密码等）；③用一句话向居民解释“为什么刷卡比配钥匙更安全”。","opts":[],"subs":[],"open":true,"ans":"参考设计要点：①四步流程：刷卡（读卡器读取卡内唯一编号）→验证（系统核对编号是否有效且未挂失——核心安全环节）→执行（验证通过驱动电机开门）→记录（本次开门时间与卡号存入日志）；②防冒用规则：挂失即失效——卡丢失立即在物业挂失，系统将该卡列入黑名单全网门禁同步生效；限时授权——租户离园/卡长期未使用自动冻结，需本人实名解冻；③一句话：\"钥匙丢了锁也得换，卡丢了轻轻一挂失就作废——挂失比换锁快得多也便宜得多\"。","al":{"考查点":"开放创造：门禁安全的规则设计（创造+应用）","解题思路":"四步标出\"验证\"环节是题眼；两条规则各解决一个冒用途径（捡到卡/长期闲置卡）；解释句点出\"挂失机制\"对比优势","易错警示":"流程无\"记录\"环节不成闭环；规则与\"验证\"环节脱节","方法点拨":"门禁题公式：四步+验证、规则对准冒用路径、一句对比解释。"}}]},{"t":"第 13 课 · 配套练习","n":"门铃通知即时到","isExam":false,"qs":[{"sec":"回忆热身","type":"回忆","num":1,"text":"门铃通知的链路是：感知（按键）→传输（网络）→____（云端推送到手机）。","opts":[],"subs":[],"ans":"推送","al":{"考查点":"门铃通知链路的识记（记忆）。","解题思路":"链路=感知（按键）→传输（网络）→推送（云端推到手机）；题干已给前两步，第三步补“推送”。","易错警示":"勿填“接收”——接收是手机端的动作，云端做的动作叫“推送”。","方法点拨":"链路四动词“按—传—推—收”，云端永远在“推”。"}},{"sec":"回忆热身","type":"回忆","num":2,"text":"通知链路的三类角色是：触发端（门铃）、中转端（__）、接收端（手机）。","opts":[],"subs":[],"ans":"云（云端或服务器）","al":{"考查点":"通知链路三类角色的识记（记忆）。","解题思路":"三类角色=触发端（门铃）、中转端（云/云端或服务器）、接收端（手机）；题干缺中转端，填“云”。","易错警示":"勿填“路由器/基站”——它们只管本地传输，跨空间转交靠云端。","方法点拨":"“三角色”记：触发端发声、云端传话、接收端收信。"}},{"sec":"基础巩固","type":"单选","num":1,"text":"智能门铃按下后，人在外地也能收到手机弹窗。实现“跨空间送达”的关键角色是：","opts":[{"label":"A","text":"门铃自己飞过去"},{"label":"B","text":"云端（服务器）中转"},{"label":"C","text":"手机变聪明"},{"label":"D","text":"路由器单独完成"}],"subs":[],"ans":"答案B　云端（服务器）中转","al":{"考查点":"跨空间送达关键角色的理解（理解）。","解题思路":"“人在外地也收到弹窗”=跨空间——本地链路够不着，必须云端（服务器）中转后再推送。","逐项剖析":"A 门铃自己飞过去：拟人玩笑，排除；B 云端（服务器）中转：跨空间送达关键，正确；C 手机变聪明：与送达机制无关，排除；D 路由器单独完成：路由器只连本地网络，跨网需云端，排除。","易错警示":"别小看云端——它就是“跨空间”三个字的实现者。","方法点拨":"凡题干含“外地/跨空间/远程收”，圈出云端中转。"}},{"sec":"基础巩固","type":"单选","num":2,"text":"用“微信发消息”类比门铃通知：门铃相当于发消息的人，云端相当于微信服务器，手机相当于：","opts":[{"label":"A","text":"收到消息的人"},{"label":"B","text":"路由器"},{"label":"C","text":"服务器"},{"label":"D","text":"门铃本身"}],"subs":[],"ans":"答案A　收到消息的人","al":{"考查点":"“微信发消息”类比的对应（理解）。","解题思路":"三角映射：门铃=发消息的人、云端=微信服务器、手机=收到消息的人（接收端）。","逐项剖析":"A 收到消息的人：正确；B 路由器：无关，排除；C 服务器：那是云端的对应物，排除；D 门铃本身：角色重复，排除。","易错警示":"手机是“收信人”不是“服务器”，别把两端角色颠倒。","方法点拨":"三角色类比题先写“三对三”映射再作答，勿跳步。"}},{"sec":"基础巩固","type":"单选","num":3,"text":"老式门铃“按了屋里响，人不在听不见”，智能门铃“按了手机弹窗，人在外也知”。二者本质区别是：","opts":[{"label":"A","text":"智能门铃声音更大"},{"label":"B","text":"智能门铃多了网络加云端中转，实现跨空间"},{"label":"C","text":"老式门铃不用电"},{"label":"D","text":"智能门铃更便宜"}],"subs":[],"ans":"答案B　智能门铃多了网络加云端中转，实现跨空间","al":{"考查点":"新旧门铃本质区别（理解）。","解题思路":"老式门铃本地响铃、人不在就听不见；智能门铃多了“网络传输+云端推送”，实现跨空间送达。","逐项剖析":"A 智能门铃声音更大：非本质，排除；B 多了网络加云端中转，实现跨空间：正确；C 老式门铃不用电：错误；D 智能门铃更便宜：通常更贵，排除。","易错警示":"本质差异在“跨空间能力”，声音大小是表象。","方法点拨":"“本质区别”题=找功能增量：智能多了网络与云端两个环节。"}},{"sec":"基础巩固","type":"单选","num":4,"text":"关于“云端中转”，下列说法正确的是：","opts":[{"label":"A","text":"云端就是无线网络"},{"label":"B","text":"没有云端，外地手机也能收到"},{"label":"C","text":"云端负责把消息从触发端转发到接收端"},{"label":"D","text":"云端会替用户按门铃"}],"subs":[],"ans":"答案C　云端负责把消息从触发端转发到接收端","al":{"考查点":"云端中转职责的理解（理解）。","解题思路":"云端=接收触发端消息并推送给接收端的中转站，负责跨空间送达。","逐项剖析":"A 云端就是无线网络：云端是服务器集群不是网络，排除；B 没有云端外地手机也能收到：跨网必须中转，错误；C 云端负责把消息从触发端转发到接收端：正确；D 云端会替用户按门铃：拟人歪解，排除。","易错警示":"“云端≠网络”：网络是路，云端是路边的服务器。","方法点拨":"云端角色一句话“收下发来的、推给要收的”，就是个中转站。"}},{"sec":"基础巩固","type":"判断","num":1,"text":"按门铃和手机弹窗之间隔着一段空间，消息必须经过网络传到云端再推送，不是“按了直接响”。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"消息路径的判断（理解）。","解题思路":"门铃与手机隔着空间与不同网络，消息必经网络传到云端再推送，不是“按了直接响”，判断正确。","易错警示":"“按铃本地也响”是附带功能，不代表推送不经云端。","方法点拨":"凡问跨空间消息路径，答案必有“网络+云端”两站。"}},{"sec":"基础巩固","type":"判断","num":2,"text":"断网时智能门铃无法把通知推送到外地手机，说明云端中转不可或缺。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"断网后果与云端必要性的判断（理解）。","解题思路":"断网=消息发不到云端、推送不出去，外地手机收不到——恰证云端中转不可或缺，判断正确。","易错警示":"断网后果题要答“为什么”（消息卡在半路），而非只答“收不到”。","方法点拨":"“不可或缺”论证=做删除实验：撤掉云端→跨空间通知归零。"}},{"sec":"基础巩固","type":"判断","num":3,"text":"门铃通知链路里，触发端、中转端、接收端三者中“云端”最不重要。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"三角色重要性的判断（评价）。","解题思路":"云端是“跨空间”的实现核心，没有它消息送不到外地手机——三角色缺一不可，说“云端最不重要”错误。","易错警示":"别因云端“看不见”就低估它——它恰恰是链路的地基。","方法点拨":"“谁最重要”辩证题：缺谁谁最重要，逐一做删除实验。"}},{"sec":"能力提升","type":"提升","num":1,"text":"按“感知→传输→推送→接收”写出门铃通知链路每步职责（每步一句）。","opts":[],"subs":[],"ans":"感知：访客按门铃按键；传输：消息经网络发往云端；推送：云端把“有人按门铃”推送到主人手机；接收：手机应用弹窗提醒。","al":{"考查点":"通知链路各步职责（应用）。","解题思路":"按四步各写一句：感知=访客按门铃按键；传输=消息经网络发往云端；推送=云端把“有人按门铃”推送到主人手机；接收=手机应用弹窗提醒。","易错警示":"“传输”与“推送”别合并——前者设备→云端，后者云端→手机。","方法点拨":"四步链路写职责以“谁→谁”动词成句，方向不丢。"}},{"sec":"能力提升","type":"提升","num":2,"text":"画出三类角色协作图的文字描述，并标出消息流向（用箭头）。","opts":[],"subs":[],"ans":"触发端（门铃按键）→中转端（云端或服务器）→接收端（手机应用）。箭头方向：门铃→云→手机。","al":{"考查点":"三类角色协作图的文字描述（理解·应用）。","解题思路":"文字图：触发端（门铃按键）→中转端（云端或服务器）→接收端（手机应用）；箭头方向门铃→云→手机。","易错警示":"箭头画反（手机→门铃）即错——那是第14课的远程控制链路。","方法点拨":"画图先定“谁发起”：通知由设备发起，箭头从设备出发。"}},{"sec":"能力提升","type":"提升","num":3,"text":"对比老式门铃与智能门铃，写出智能门铃多出的两个环节及其作用。","opts":[],"subs":[],"ans":"多出“网络传输”和“云端推送”两环节：网络把消息送出本地，云端把消息转给外地手机，实现人在外也即时知。","al":{"考查点":"新旧系统增量对比（分析）。","解题思路":"多出“网络传输”与“云端推送”两环节：网络把消息送出本地，云端把消息转给外地手机，实现人在外也即时知。","易错警示":"“网络”与“云端”是两个环节，别写成一项；各自作用要分写。","方法点拨":"“找增量”题：旧系统缺什么=新系统多什么，逐一列新增环节及作用。"}},{"sec":"能力提升","type":"提升","num":4,"text":"连线：左侧与右侧连线（写序号）。①触发端 ②中转端 ③接收端｜A手机弹窗 B门铃按键 C云端","opts":[],"subs":[],"ans":"①—B；②—C；③—A","al":{"考查点":"三角色连线（理解）。","解题思路":"①触发端→B门铃按键；②中转端→C云端；③接收端→A手机弹窗。","易错警示":"别把云端连到触发端——云端永远在中间当传话人。","方法点拨":"连线先定中间人（云端），两端角色自然归位。"}},{"sec":"拓展挑战","type":"拓展","num":1,"text":"情境：独居的李奶奶家水管半夜爆了漏水。请为她设计“用水异常通知”链路：①写出触发端、中转端、接收端分别是什么；②说明消息从产生到送达子女手机的流向；③指出这个系统对独居老人的价值。","opts":[],"subs":[],"ans":"①触发端：水浸传感器；中转端：云端；接收端：子女手机。②流向：传感器感知漏水→网络发云端→云端推送“漏水报警”→子女手机弹窗。③价值：子女远程即时知情，可及时上门或联系邻居，避免水淹损失，守护独居安全。","al":{"考查点":"三类角色应用+价值分析（应用·分析）。","解题思路":"①三角色：触发端=水浸传感器、中转端=云端、接收端=子女手机；②流向：传感器感知漏水→经网络发云端→云端推送“漏水报警”→子女手机弹窗；③价值：子女远程即时知情、及时上门或联系邻居，避免水淹损失，守护独居安全。","易错警示":"触发端写“水管”错——触发的是传感器，不是水管本身。","方法点拨":"定触发端问“谁感知到异常”：传感器才是系统的眼睛。"}},{"sec":"拓展挑战","type":"拓展","num":2,"text":"评价：有人说“门铃通知和远程控制是一回事，都是手机收到消息”。请结合本课三类角色与第14课（反向链路），评析这句话。","opts":[],"subs":[],"ans":"不准确：门铃通知是设备触发、人接收（门铃→云→手机），人被动知情；远程控制是人发令、设备执行（手机→云→门锁），人主动控制。触发源相反，链路方向不同，不是一回事。","al":{"考查点":"通知与控制的方向辨析（评价）。","解题思路":"判断“不是一回事”：通知=设备触发、人接收（门铃→云→手机），人被动知情；远程控制=人发令、设备执行（手机→云→门锁），人主动控制——触发源与链路方向都相反。","易错警示":"此题预设第14课知识，若只会背三类角色无法作答——方向是灵魂。","方法点拨":"方向辨析看箭头起点：设备起=通知，人起=控制。"}},{"sec":"变式闯关","type":"变式","num":1,"text":"换场景：快递柜“请取件”通知也是物联网通知。把它的链路类比本课三类角色，写出触发端、中转端、接收端各是什么，并说明为什么必须云端中转。","opts":[],"subs":[],"ans":"触发端：快递柜（包裹入柜）；中转端：云端；接收端：用户手机。必须云端：柜与手机分属不同网络，靠云端把取件消息跨网推送到用户手机，否则收不到。","al":{"考查点":"通知链路迁移新场景（应用）。","解题思路":"三角色：触发端=快递柜（包裹入柜）、中转端=云端、接收端=用户手机；必须云端中转的原因=柜与手机分属不同网络，靠云端把取件消息跨网推送到手机，否则收不到。","易错警示":"“为什么必须云端”要答“跨网/异网”这个关键，而非“方便”。","方法点拨":"“为何要云”统一答案=两端不同网络+距离远，本地链路到不了。"}},{"sec":"间隔复习","type":"间隔","num":1,"text":"上节课学了射频识别刷卡开锁四步（刷卡→读卡→验证→开锁）。请写出“验证”环节在系统中的职责，并说明为什么把卡丢了要及时挂失。","opts":[],"subs":[],"ans":"（第12课《刷卡开锁易实现》）　验证：系统比对卡号编号是否在授权名单，不在则拒绝开锁。丢卡不挂失，捡到的人刷卡会通过验证开门，有冒用风险，故需及时注销。","al":{"考查点":"链路建模+冗余通知+降级容错（创造）；跨课迁移——养老安全场景。","解题思路":"①三角色与流向：触发端=跌倒检测传感器（如毫米波雷达）、中转端=云端、接收端=子女手机与社区医生手机，流向传感器→云→手机；②冗余路径：同时推送社区医生与楼栋长，多方接收避免漏看；③云端故障=通知发不出→降级：本地声光报警器仍响、或经蓝牙直连邻居网关兜底。","易错警示":"冗余路径要“真冗余”（不同接收人），降级要“真兜底”（不依赖云）才得分。","方法点拨":"可靠性设计“一主一备”：主链路云端推送，备用本地声光/近场直连，双保险。"}},{"sec":"思维进阶","type":"挑战","num":1,"text":"【真实情境】小区楼道想装“老人摔倒通知系统”，当独居老人跌倒时自动通知子女与社区医生。请设计方案：①画出三类角色（触发端／中转端／接收端）及消息流向；②除“通知子女”外，再设计一条让系统更可靠的通知路径（如同时通知社区医生）；③指出如果云端故障，系统会怎样，并给出一条“降级”应急办法。","opts":[],"subs":[],"open":true,"ans":"参考设计要点：①角色与流向：触发端（跌倒传感器/紧急按钮）→中转端（网关+云端平台：判断事件真伪、决定通知谁）→接收端（子女手机+社区医生终端）；②更可靠的通知路径：多级升级通知——通知子女2分钟无响应则自动升级通知社区值班医生与邻居志愿者，同时拨打老人家中固话确认，形成\"接力式\"保障；③云端故障影响与降级：云端故障则远程通知链路中断——降级办法：网关本地直连社区值班室的独立报警线路（不依赖云端），断网时自动切换本地声光报警+固话外呼。","al":{"考查点":"开放创造：通知系统可靠性的纵深设计（创造+应用）","解题思路":"三角色与流向对应\"触发—中转—接收\"；可靠路径体现\"多级升级\"；降级方案的核心是\"脱离云端也能报警\"","易错警示":"通知路径只是\"多通知一个人\"没有升级机制；降级方案仍依赖云端则无效","方法点拨":"可靠性题公式：角色分端、通知分级、降级走本地。"}}]},{"t":"第 14 课 · 配套练习","n":"远程控制更便捷","isExam":false,"qs":[{"sec":"回忆热身","type":"回忆","num":1,"text":"远程控制的反向链路是：手机（发令）→云（中转）→____（执行）。","opts":[],"subs":[],"ans":"门锁（执行设备）","al":{"考查点":"反向链路末端的识记（记忆）。","解题思路":"远程控制链路=手机（发令）→云（中转）→门锁（执行）；题干缺末端“门锁/执行设备”。","易错警示":"勿填“手机”——那是起点；链路末端是执行设备。","方法点拨":"“发—转—执”三字诀：手机发令、云端转发、门锁执行。"}},{"sec":"回忆热身","type":"回忆","num":2,"text":"给访客的“临时密码”通常采用限时＋限次＋____的设计，像一次性门票。","opts":[],"subs":[],"ans":"自动作废（失效）","al":{"考查点":"临时密码设计的识记（记忆）。","解题思路":"临时密码=限时＋限次＋自动作废，像一次性门票；题干已给“限时、限次”，缺“自动作废（失效）”。","易错警示":"勿填“加密”——作废是时间/次数维度，加密是技术维度，两回事。","方法点拨":"“临时三限”：限时、限次、用完即废。"}},{"sec":"基础巩固","type":"单选","num":1,"text":"远程开门与门铃通知相比，二者最大的不同是：","opts":[{"label":"A","text":"都用云但触发源相反：通知是设备触发，控制是人触发"},{"label":"B","text":"远程开门不需要云"},{"label":"C","text":"通知比控制快"},{"label":"D","text":"两者完全一样"}],"subs":[],"ans":"答案A　都用云但触发源相反：通知是设备触发，控制是人触发","al":{"考查点":"通知与控制核心差异（理解）。","解题思路":"二者都用云端中转，差异在触发源：通知=设备触发（门铃→云→手机），控制=人触发（手机→云→门锁）。","逐项剖析":"A 都用云但触发源相反、通知是设备触发控制是人触发：正确；B 远程开门不需要云：跨网必须云，错误；C 通知比控制快：无依据，排除；D 两者完全一样：方向相反，错误。","易错警示":"“都用云”与“方向相反”要同时说全，只说一半易被当错。","方法点拨":"方向题先问“箭头从哪出发”：设备出发=通知、人出发=控制。"}},{"sec":"基础巩固","type":"单选","num":2,"text":"用“远程关空调”类比远程开门：手机应用相当于发令人，云相当于中转，空调或门锁相当于：","opts":[{"label":"A","text":"执行设备"},{"label":"B","text":"发令人"},{"label":"C","text":"中转"},{"label":"D","text":"接收人"}],"subs":[],"ans":"答案A　执行设备","al":{"考查点":"“远程关空调”类比的对应（理解）。","解题思路":"映射：手机应用=发令人、云=中转、空调/门锁=执行设备（收令动作）。","逐项剖析":"A 执行设备：正确；B 发令人：那是手机，排除；C 中转：那是云端，排除；D 接收人：通知链路的说法，排除。","易错警示":"空调是“被执行者”不是“接收通知的人”——控制链路里它是执行端。","方法点拨":"反向链路类比题统一“三对三”，末端永远写执行设备。"}},{"sec":"基础巩固","type":"单选","num":3,"text":"给快递员“临时开门密码”，最合理的做法是：","opts":[{"label":"A","text":"给永久密码"},{"label":"B","text":"限时（如30分钟）加限次（如1次）加自动作废"},{"label":"C","text":"把主密码告诉他"},{"label":"D","text":"不用密码直接远程开"}],"subs":[],"ans":"答案B　限时（如30分钟）加限次（如1次）加自动作废","al":{"考查点":"临时授权设计原则（应用·评价）。","解题思路":"给快递员开门=一次性授权：限时（如30分钟）＋限次（如1次）＋自动作废，防滥用、防转卖。","逐项剖析":"A 给永久密码：风险敞口，排除；B 限时限次加自动作废：正确；C 把主密码告诉他：等同交出钥匙，排除；D 不用密码直接远程开：需主人随时在，不适用，排除。","易错警示":"“反正只给一个人”是侥幸心理——永久密码可能被转告、转卖。","方法点拨":"临时授权三件套“限时+限次+自动废”，三缺一即不合格。"}},{"sec":"基础巩固","type":"单选","num":4,"text":"关于“为什么远程控制还要经过云端”，正确的是：","opts":[{"label":"A","text":"为了好看"},{"label":"B","text":"人在外地跨网，需云端跨网中转"},{"label":"C","text":"云会偷看指令"},{"label":"D","text":"手机直接连门锁更省电"}],"subs":[],"ans":"答案B　人在外地跨网，需云端跨网中转","al":{"考查点":"远程控制为何经云（理解）。","解题思路":"手机与门锁分属不同网络且距离远，必须云端跨网中转指令——就像跨城电话要经交换局。","逐项剖析":"A 为了好看：荒谬，排除；B 人在外地跨网，需云端跨网中转：正确；C 云会偷看指令：阴谋论，排除；D 手机直接连门锁更省电：跨网无法直连，排除。","易错警示":"“本地Wi-Fi直连”只适用于同网近距；外地控制必经云端。","方法点拨":"“为什么经云”统一答案：异网＋远距，本地链路够不着。"}},{"sec":"基础巩固","type":"判断","num":1,"text":"远程控制和门铃通知都用云端中转，但触发源相反：一个是人主动发令，一个是设备主动告知。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"同云反向的判断（理解）。","解题思路":"控制=人主动发令→设备执行；通知=设备主动告知→人接收；二者都用云端中转但触发源相反，判断正确。","易错警示":"“都用云端”易误判为相同——方向才是关键。","方法点拨":"把两条链路并排画箭头，方向一眼见分晓。"}},{"sec":"基础巩固","type":"判断","num":2,"
