规——训练使用均脱敏、最小授权；③可解释可问责——留判读依据、建出错反馈与改进机制。","易错警示":"每条措施要“可落地”并呼应责任/隐私/问责三个维度。","方法点拨":"负责任AI三件套：人把关（责任）、数据脱敏（隐私）、可解释（问责）。"}},{"sec":"能力提升","type":"提升","num":3,"text":"奶奶第一次用“视频问诊”，总怕“说错话、药开错了”。请用通俗的话向她解释远程问诊的流程，并告诉她哪些情况不适合远程看。","opts":[],"subs":[],"ans":"解释：您在家用手机和医生视频，像面对面聊天一样说病情，医生看您的样子、听您描述，必要时候再开药或让您去化验，处方会传到您手机上。不适合远程看的情况：胸痛、昏迷、大出血等急危重症——这些必须立刻打急救电话或去医院，不能等视频。","al":{"考查点":"远程问诊的通俗解释（应用·表达）。","解题思路":"解释流程：在家和医生视频像面对面聊天说病情，医生看样听述、必要时开药或让化验、处方传手机；再说明不适合远程的急危重症（胸痛昏迷大出血）必须立刻打急救或去医院。","易错警示":"“哪些情况不适合”是安全底线，漏答急危重症会误导老人。","方法点拨":"给老人讲远程医疗=日常小病视频可看+急症必须去医院，两条边界说清。"}},{"sec":"能力提升","type":"提升","num":4,"text":"请从“适老化”角度指出智能医疗设备常见的三个“难为老人”的设计，并各给出改进建议。","opts":[],"subs":[],"ans":"①字太小看不清——放大字体、语音播报；②操作步骤多记不住——一键呼叫、大按钮简化流程；③怕“被监视”心理负担——明示数据用途、让老人可随时关闭或查看自己的数据。让技术“迁就”老人，而不是让老人“迁就”技术。","al":{"考查点":"适老化问题诊断与改进（分析·评价）。","解题思路":"三问题三改进：字小看不清→放大字体+语音播报；步骤多记不住→一键呼叫+大按钮简化；怕被监视→明示数据用途+可随时关闭查看。","易错警示":"每问要“问题+改进”成对，改进要具体可操作。","方法点拨":"适老化设计原则“让技术迁就老人”：字大、键大、可退出。"}},{"sec":"拓展挑战","type":"拓展","num":1,"text":"医院为出院后的心脏病患者提供“家用监测包”（手环＋血压计＋随访App），患者在家测的数据自动传给主治医生。请分析：①这对患者和医生各有什么价值？②存在哪些风险？③如果你是医院信息科人员，会向患者交代哪三条使用与隐私注意事项？","opts":[],"subs":[],"ans":"①患者：出院后持续被监测，异常早发现、复诊有据；医生：掌握患者居家真实数据，调整用药更精准，减少无效复诊。②风险：设备测量误差导致误判、数据在传输存储中被泄露、患者过度依赖设备忽视身体不适信号。③交代：按规范佩戴测量，异常时先自查再联系医生而非自行停药；账号仅本人与授权医生可看，不点陌生链接；发现设备异常及时报修换新。","al":{"考查点":"家用监测包的全面分析（分析·评价）。","解题思路":"三问分答：①价值分写患者（持续监测异常早发现复诊有据）与医生（掌握居家真实数据调药精准）；②风险三条（误差误判、传输存储泄露、过度依赖）；③交代三条（规范测量异常先自查再联系医生不自行停药、账号仅本人与授权医生、异常报修）。","易错警示":"“交代患者”要落到具体行为（不自行停药），而非泛泛提醒。","方法点拨":"医疗物联分析题“价值分角色、风险列场景、交代写行为”，层层落地。"}},{"sec":"拓展挑战","type":"拓展","num":2,"text":"班里辩论赛辩题：“人工智能读片应该全面取代医生的初步阅片”。请为反方写一段辩词（观点＋至少两条理由），说明为什么不能“全面取代”。","opts":[],"subs":[],"ans":"辩词示例：我方的观点是人工智能读片只能辅助、不能全面取代医生阅片。理由一：智能系统依赖训练数据，遇到罕见病、复杂病变可能误判，而医生能结合患者病史、症状综合判断；理由二：医疗是人与人的信任关系，患者需要医生的解释与安抚，机器给不了人文关怀；理由三：一旦机器出错，责任难以界定，而医生把关才能守住安全底线。所以应是人机协作：机器当“火眼金睛”的助手，医生做负责任的决策者。","al":{"考查点":"反方辩词写作（评价·创造）。","解题思路":"辩词结构=观点（只能辅助不能取代）+三条理由（训练数据局限罕见病误判而医生综合判断、医疗需人文关怀与解释安抚、出错责任难界定需医生把关）+结论（人机协作，机器当助手医生做决策）。","易错警示":"理由要有“医疗特殊性”（信任/责任/综合判断），不能只谈技术。","方法点拨":"反方辩词“观点+三理由+升华”骨架，每条理由配一句论证。"}},{"sec":"变式闯关","type":"变式","num":1,"text":"换一个场景：不是病人，而是“学生体质监测”：学校给每位同学发智能手环，体育课实时监测心率防止运动过度。请用“功能—价值—风险”分析这套系统。","opts":[],"subs":[],"ans":"功能：运动时实时测心率，超阈值提醒休息，体育老师后台可看全班负荷；价值：防运动猝倒等意外、数据帮助老师科学安排运动量；风险：学生健康数据（心率、运动习惯）被过度收集或泄露、个别同学因“数据不好看”产生压力——需限定只用于运动安全且数据脱敏管理。","al":{"考查点":"功能—价值—风险框架迁移体质监测（应用）。","解题思路":"三段：功能=体育课实时测心率超阈值提醒休息、老师后台看全班负荷；价值=防运动猝倒、科学安排运动量；风险=健康数据过度收集泄露、个别同学“数据不好看”产生压力——需限定只用于运动安全+数据脱敏。","易错警示":"迁移场景的风险要从“学生视角”写（压力/隐私），别照抄病人版本。","方法点拨":"框架迁移“换主角”：把患者换成学生，风险跟着主角走。"}},{"sec":"间隔复习","type":"间隔","num":1,"text":"家用监测设备（手环、血压计）的读数能直接当诊断依据吗？请结合第22课“数据批判”思想，说明患者拿到异常读数后正确做法是什么。","opts":[],"subs":[],"ans":"（第22课《健康生活新设备》）　不能。消费级/家用设备存在测量误差，只作日常参考；拿到异常读数别恐慌也别自行停药，应在固定条件下复测几次，持续异常再带记录去医疗机构用专业设备确诊，由医生判断处置。","al":{"考查点":"社区适老设备公约+失效兜底设计（创造）；跨课迁移——伦理三问落地社区。","解题思路":"三段作答：①三类数据各写“只用来做什么、绝不做什么”（心率血氧只告警不商用；活动跌倒只求助不录像；用药只提醒不公开）；②失效分析两条（没戴好/算法未识别/断电断网）+改进（物理按钮兜底+算法更新+定期上门检查）；③宣传语一句。","易错警示":"数据边界要“只/绝不”成对写清；失效要“原因+对策”配对。","方法点拨":"适老设备公约=数据边界清单+失效兜底（物理按钮）双保险。"}},{"sec":"思维进阶","type":"挑战","num":1,"text":"社区要给独居老人配“一键求助＋生命体征监测”设备，请你参与制定《设备使用与隐私公约》：①写出设备应监测的3类数据，并说明每类数据“只用来做什么、绝不做什么”；②如果老人在家跌倒且设备没报警，可能的原因有哪些（至少两条）？应如何改进？③为社区写一句“科技助老”宣传语。","opts":[],"subs":[],"open":true,"ans":"参考设计要点：①三类数据：生命体征（心率）——只用于异常告警，绝不向第三方提供；活动状态（是否长时间无活动）——只用于跌倒疑似判断，不生成\"生活轨迹报告\"；位置（是否在家）——只用于紧急联系时定位，不用于日常行为记录；②未报警可能原因与改进：传感器被遮挡或佩戴不规范导致漏采——改进：定期自检提醒与佩戴检测；算法阈值过严/云端通知链路故障——改进：多级告警（本地响铃+子女+社区）与每日自检推送；③宣传语示例：\"一键在手，牵挂不慌；数据守人，不扰人心\"。","al":{"考查点":"开放创造：健康监测的隐私边界与可靠性（创造+评价）","解题思路":"三类数据\"只用来做什么/绝不做什么\"双向限定；故障归因分\"感知与链路\"两侧并给改进；宣传语兼顾温情与隐私","易错警示":"只列数据不写\"绝不\"边界——隐私约束不完整；故障只写\"设备坏了\"不具体","方法点拨":"监测题公式：三类数据双向限、故障两侧归因、宣传语有温度。"}}]},{"t":"第 24 课 · 配套练习","n":"农业生产新模式","isExam":false,"qs":[{"sec":"回忆热身","type":"回忆","num":1,"text":"寿光智慧大棚的三个典型应用是自动卷帘、____和虫情测报。","opts":[],"subs":[],"ans":"滴灌（自动滴灌）","al":{"考查点":"寿光智慧大棚典型应用的识记（记忆）。","解题思路":"三个典型应用=自动卷帘、滴灌（自动滴灌）、虫情测报；题干已给“自动卷帘”与“虫情测报”，缺“滴灌”。","易错警示":"勿填“施肥/遮阳”——课本三典型锁定卷帘、滴灌、虫情。","方法点拨":"“帘—灌—虫”三字诀，对应本地寿光案例记忆最牢。"}},{"sec":"回忆热身","type":"回忆","num":2,"text":"智慧农业把农民从“靠天种菜”变成了“靠____种菜”。","opts":[],"subs":[],"ans":"数据","al":{"考查点":"智慧农业本质转变的识记（记忆）。","解题思路":"智慧农业把农民从“靠天种菜”变为“靠数据种菜”——决策依据从经验直觉变成数据。","易错警示":"勿填“靠机器/靠AI”——教材表述就是“靠数据”。","方法点拨":"“靠天→靠数据”是智慧农业的一句话定义。"}},{"sec":"基础巩固","type":"单选","num":1,"text":"智慧大棚里，土壤湿度传感器发现墒情不足，系统自动打开滴灌。这个“感知—传输—处理—反馈”闭环中，“处理”环节做的是：","opts":[{"label":"A","text":"把湿度显示在屏幕上"},{"label":"B","text":"把湿度数据与设定阈值比较，判断该不该浇水"},{"label":"C","text":"把水直接搬到地里"},{"label":"D","text":"给传感器充电"}],"subs":[],"ans":"答案B　把湿度数据与设定阈值比较，判断该不该浇水","al":{"考查点":"闭环中“处理”环节的辨识（理解）。","解题思路":"处理=把感知数据与设定阈值比较、得出“该不该浇水”的决策；显示是展示、执行是反馈环节。","逐项剖析":"A 把湿度显示在屏幕上：展示动作，排除；B 把湿度数据与设定阈值比较、判断该不该浇水：正确处理职责，是答案；C 把水搬到地里：执行环节，排除；D 给传感器充电：无关，排除。","易错警示":"“处理=比对判断”最易与“执行=动作”混淆，看“想”还是“做”。","方法点拨":"闭环四环各配动词：感知=测、传输=送、处理=想、反馈=做。"}},{"sec":"基础巩固","type":"单选","num":2,"text":"虫情测报灯能“自动数虫子并拍照上报”，对菜农最大的帮助是：","opts":[{"label":"A","text":"把虫子吓跑"},{"label":"B","text":"提前发现虫害苗头，精准施药、减少盲目打药"},{"label":"C","text":"让虫子自己死掉"},{"label":"D","text":"记录虫子品种好卖钱"}],"subs":[],"ans":"答案B　提前发现虫害苗头，精准施药、减少盲目打药","al":{"考查点":"虫情测报价值理解（理解）。","解题思路":"测报灯诱集识别害虫数量趋势，菜农据此提前精准防治、减少盲目大面积打药。","逐项剖析":"A 把虫子吓跑：无此功能，排除；B 提前发现虫害苗头、精准施药减少盲目打药：正确；C 让虫子自己死掉：测报不杀虫，排除；D 记录品种好卖钱：排除。","易错警示":"测报灯的价值在“报”（预警）不在“杀”——杀虫靠后续精准施药。","方法点拨":"“测报”=监测预报：提前发现是它的灵魂价值。"}},{"sec":"基础巩固","type":"单选","num":3,"text":"“无人机巡田＋虫情测报灯”构成“空地一体”监测网，一亩地人工成本下降近四成。这里的价值主要体现在：","opts":[{"label":"A","text":"提效降本（少跑腿、少请工）"},{"label":"B","text":"让农田更好看"},{"label":"C","text":"无人机代替所有农民"},{"label":"D","text":"让蔬菜价格翻倍"}],"subs":[],"ans":"答案A　提效降本（少跑腿、少请工）","al":{"考查点":"空地一体监测的价值（理解）。","解题思路":"无人机巡田+测报灯替代重复劳动、精准发现问题，人力成本显著下降——价值核心是提效降本。","逐项剖析":"A 提效降本（少跑腿少请工）：正确；B 让农田更好看：排除；C 无人机代替所有农民：夸大，排除；D 让蔬菜价格翻倍：技术不直接定价，排除。","易错警示":"“提效降本”是智慧农业经济价值的通用表述。","方法点拨":"价值题抓题干数字（成本降四成）→对应“提效降本”。"}},{"sec":"基础巩固","type":"单选","num":4,"text":"关于“靠数据种菜”，下列说法最准确的是：","opts":[{"label":"A","text":"农民从此不用下地"},{"label":"B","text":"数据辅助决策，但种植经验与责任心仍不可少"},{"label":"C","text":"只要装了传感器就一定丰收"},{"label":"D","text":"数据只用来发朋友圈"}],"subs":[],"ans":"答案B　数据辅助决策，但种植经验与责任心仍不可少","al":{"考查点":"“靠数据种菜”的准确理解（理解·评价）。","解题思路":"数据让浇水卷帘更精准，但品种、市场、异常处置仍靠人——技术“替跑腿”不“替脑子”。","逐项剖析":"A 农民从此不用下地：夸大，排除；B 数据辅助决策但经验责任心不可少：准确，正确；C 装了传感器一定丰收：因果绝对化，排除；D 数据只发朋友圈：窄化，排除。","易错警示":"“技术万能论”与“技术无用论”都不对——人机协同才是答案。","方法点拨":"农业AI题标准立场：机器管重复劳动，人管判断决策。"}},{"sec":"基础巩固","type":"判断","num":1,"text":"智慧大棚就是“给大棚装个App，手机能看一眼”。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"智慧大棚本质的判断（理解）。","解题思路":"核心不是“远程看一眼”而是“数据驱动自动决策”：采集→判断→自动执行，判断错误。","易错警示":"“看”是表象，“自动决策”才是本质——别把智慧大棚降格成摄像头。","方法点拨":"判断题见“就是装个App看一眼”即错，正确答案是自动决策。"}},{"sec":"基础巩固","type":"判断","num":2,"text":"自动滴灌比大水漫灌更节水，一亩地年节水可达30%以上。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"滴灌节水的判断（理解）。","解题思路":"滴灌按墒情按需供水，避免漫灌蒸发渗漏浪费，一亩年节水30%以上——有据可查，判断正确。","易错警示":"节水数据是智慧农业“降本”实证，判√。","方法点拨":"滴灌vs漫灌对比：按需精准vs大水漫灌，节水逻辑直接。"}},{"sec":"基础巩固","type":"判断","num":3,"text":"无人机巡田和虫情测报能完全取代农民下地观察。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"无人机能否取代农民的判断（理解）。","解题思路":"无人机与测报灯扩大眼睛范围、提效，但细微判断与突发处置仍需人到田把关，判断错误。","易错警示":"“完全取代”是绝对化陷阱，见“完全”先质疑。","方法点拨":"技术定位口诀“添帮手不抢饭碗、扩眼睛不替脑子”。"}},{"sec":"能力提升","type":"提升","num":1,"text":"请画出“大棚温度过高自动卷帘”的完整闭环，并标出每一步的设备（感知、传输、处理、反馈）。","opts":[],"subs":[],"ans":"感知：温度传感器测得棚温超过设定上限；传输：数据经无线网络传到控制器/云平台；处理：与阈值比对判定“温度过高需通风降温”；反馈：控制器驱动卷帘电机把帘子卷起通风，温度回落后自动放下，传感器持续监测形成闭环。","al":{"考查点":"温度过高自动卷帘闭环（应用）。","解题思路":"四环带设备：感知（温度传感器测超上限）→传输（无线网络到控制器/云平台）→处理（比对判定需通风降温）→反馈（驱动卷帘电机卷帘，回落自动放下，传感器持续监测成闭环）。","易错警示":"“温度回落后自动放下”是闭环点，漏写即开环。","方法点拨":"卷帘闭环题“四环+设备+回落自动”三要素齐全即满分。"}},{"sec":"能力提升","type":"提升","num":2,"text":"请比较“张大爷凌晨4点跑棚卷帘”与“智慧大棚自动卷帘”在人力、时效、准确性三方面的差别。","opts":[],"subs":[],"ans":"人力：前者天天凌晨往返、风雨无阻，后者几乎无需人工干预；时效：前者靠经验“估摸”，可能卷晚受冻害，后者温度一超限立即响应、毫秒级决策；准确性：前者凭感觉可能过头或不足，后者按设定阈值精确到度，且记录可查可优化。","al":{"考查点":"人工vs自动三维对比（分析）。","解题思路":"按人力/时效/准确性三维成行对比：人力（凌晨往返 vs 免干预）；时效（经验估摸可能卷晚 vs 超限毫秒响应）；准确性（凭感觉 vs 阈值精确到度+记录可查）。","易错警示":"三维度各要“人工方+自动方”对照成句，缺一维即扣分。","方法点拨":"对比题“三维三行、行行对照”，人力/时效/准确逐维写。"}},{"sec":"能力提升","type":"提升","num":3,"text":"寿光智慧大棚里“人工智能结合气象与历史产量，预测最佳灌溉施肥方案”。请说明：系统做预测需要哪几类数据？预测结果对菜农有什么用？","opts":[],"subs":[],"ans":"需要的数据：当前土壤墒情与养分、棚内温湿度、天气预报（降水/气温）、历史同期产量与用肥用水记录。作用：把“经验拍脑袋”变成“数据算出来”——提前告诉菜农明后天要不要浇、浇多少、何时施肥最划算，减少浪费、稳产增收。","al":{"考查点":"预测系统数据需求与用途（分析）。","解题思路":"数据四类：当前墒情养分、棚内温湿度、天气预报、历史产量与用肥用水记录；用途=把“经验拍脑袋”变“数据算出来”——提前告诉菜农要不要浇、浇多少、何时施肥，减浪费稳产增收。","易错警示":"数据要“分类型列举”，用途要落到“提前告知什么”。","方法点拨":"“预测系统”题两问两答：先列输入数据（现在+历史+天气），再写输出价值（提前决策）。"}},{"sec":"能力提升","type":"提升","num":4,"text":"有菜农担心“上了智慧大棚，我这老经验就没用了”。请写一段话宽慰他，说清技术和经验各管什么。","opts":[],"subs":[],"ans":"大叔您放心：系统管的是“跑腿和盯梢”——浇水、卷帘、数虫子这些重复活儿交给传感器和机器；而“种什么、什么时候卖、菜长得好不好看”这些判断，还得靠您几十年看天看地的经验。技术是给您添了帮手，不是抢您的饭碗，您的地您做主，它帮您省力气。","al":{"考查点":"宽慰经验派菜农（应用·表达）。","解题思路":"分责安抚：系统管跑腿盯梢（浇水卷帘数虫）；您管判断决策（种什么、何时卖、长得好不好）——经验仍有大用；技术是添帮手不抢饭碗。","易错警示":"语气要尊重老人经验，不能“技术至上”居高临下。","方法点拨":"安抚话术“分活不抢活”：重复劳动给机器、判断决策留给人，老人自然安心。"}},{"sec":"拓展挑战","type":"拓展","num":1,"text":"村里想给大棚上物联网，但担心“设备坏了没人会修、数据平台要收费”。请你以农技员身份写一份《给村民的答疑卡》：①说明系统“坏了怎么办”（至少两条保障）；②说明一年能省下什么（结合节水、省工算笔账）；③给“先试点还是全村铺开”提个建议。","opts":[],"subs":[],"ans":"①坏了怎么办：设备厂商提供质保与上门维护，村里培训1-2名“土专家”学基础检修；关键控制器可断电重启、保留手动应急开关，坏了也能先用人工顶住。②省钱账：一亩地年节水30%以上＋少请工（巡田卷帘）＋精准用药减少浪费，综合一亩年省数百元至上千元，几年可回本。③建议：先选3-5户试点跑通一年，对比产量与成本，再逐步铺开——用数据说服观望者，稳扎稳打。","al":{"考查点":"村民答疑卡写作（应用·创造）。","解题思路":"三问分答：①坏了怎么办——厂商质保上门+村里培训1-2名土专家+保留手动应急开关；②省什么算账——节水30%+省工+精准用药，综合一亩年省数百至上千元几年回本；③建议——先3-5户试点跑通一年对比数据再铺开。","易错警示":"“算账”要落到具体数字；“先试点后铺开”是稳妥建议的采分点。","方法点拨":"答疑卡“保障+算账+路径”三段：让人放心（有保障）、动心（省多少）、安心（怎么推）。"}},{"sec":"拓展挑战","type":"拓展","num":2,"text":"邻居张大爷的智慧大棚半夜报警“温度骤降”，他赶过去发现是传感器探头被鸟啄歪了。请帮他分析：①这次误报的原因是什么？②除了修探头，系统还应做哪两处改进，避免误报扰民？","opts":[],"subs":[],"ans":"①原因：探头被鸟啄歪后测点异常（可能贴到冷处或线路松动），读到的“温度骤降”并非真实棚温，属于传感器异常导致的误报。②改进：a.加“异常值校验”——单点数据突变超过合理范围时先标记待复核，连续两次确认才告警；b.给探头加防护罩并固定牢靠，减少物理干扰；再叠加“多点取平均”判断，单点异常不再直接触发深夜告警。","al":{"考查点":"误报原因分析与系统改进（分析·评价）。","解题思路":"①原因=探头被鸟啄歪致测点异常，读到“骤降”非真实棚温——传感器异常误报；②改进两条：加异常值校验（单点突变先标复核、连续两次才告警）；探头加防护罩固定牢+多点取平均，单点异常不直接触发深夜告警。","易错警示":"改进要“防误报机制”层面（校验/平均），不能只写“修探头”。","方法点拨":"误报题“原因→防误报机制”两层：先找异常源，再设计校验规则让系统“学会怀疑”。"}},{"sec":"变式闯关","type":"变式","num":1,"text":"换一个场景：学校“开心农场”的小菜园也要搞“智慧化”。请你设计一套最简方案：需要几个传感器、感知什么、自动做什么，并说明为什么比“每天放学去浇水”更好。","opts":[],"subs":[],"ans":"方案：土壤湿度传感器1个（插在土里感知墒情）＋小型滴灌电磁阀＋定时控制。流程：湿度低→控制器判断→开阀滴灌→湿度达标自动停。好处：周末放假也不用担心旱死，浇水按需精准不浪费，还能记录数据观察“多久浇一次最合适”——省心又科学。","al":{"考查点":"智慧农业闭环迁移开心农场（应用）。","解题思路":"最简方案：土壤湿度传感器1个+小型滴灌电磁阀+定时控制——湿度低→控制器判断→开阀滴灌→达标自动停；好处=周末不担心旱死、按需精准不浪费、还能记录数据发现浇水规律。","易错警示":"方案要“最简可行”（传感器数量克制），好处要对比“每天放学浇水”说。","方法点拨":"低成本方案题“一感一阀一控”三件套，够用就好。"}},{"sec":"间隔复习","type":"间隔","num":1,"text":"大棚里的作物和博物馆里的文物，都要靠“闭环守护”。请指出这两个场景闭环的“感知量”和“反馈动作”分别是什么，说明结构为什么相同。","opts":[],"subs":[],"ans":"（第21课《文物保护新手段》）　大棚：感知温湿度/墒情，反馈动作是卷帘、滴灌；博物馆：感知温湿度/震动，反馈动作是除湿、报警。结构相同是因为都遵循“感知—传输—处理—反馈”这一物联网通用闭环——环境变了→系统感知→判断处置→执行调节，所以同一套模型能解释不同行业。","al":{"考查点":"低成本智慧农业创客方案（创造）；跨课迁移——变废为宝的工程实现。","解题思路":"三段作答：①选一功能（自动滴灌）画闭环——感知（湿度传感器或铁钉电极）→传输（单片机/旧手机热点）→处理（阈值判断缺水）→反馈（开电磁阀/小水泵达标自停）；②器件清单（传感器/继电器旧水泵/废旧手机开发板/太阳能板，注明变废为宝项）；③卖点话一句通俗点明省什么。","易错警示":"器件要“可实现”并注明废旧替代；卖点话要落到“省水/省夜跑”。","方法点拨":"创客说明书“闭环+清单+卖点”三段，变废为宝项是亮点加分处。"}},{"sec":"思维进阶","type":"挑战","num":1,"text":"寿光要办“智慧农业少年创客赛”，请你为“我家的大棚”设计一个“低成本智能升级方案”并写《创客说明书》：①从卷帘、滴灌、虫情中选一个功能，画出它的“感知—传输—处理—反馈”闭环；②列出所需器件清单（传感器、执行器、通信模块，可从家中旧手机/废旧材料中“变废为宝”的请注明）；③写一句给菜农的“卖点话”，让人一听就懂它省什么。","opts":[],"subs":[],"open":true,"ans":"参考设计要点：①选滴灌的闭环：土壤湿度传感器感知→数据经网关上传处理平台→与设定阈值比较判断→反馈控制电磁阀开/关滴灌→传感器继续监测形成回路；②器件清单：土壤湿度传感器、温湿度传感器（选配）、电磁阀+水泵（执行器）、WiFi/4G通信模块、旧手机作监控终端与数据显示（变废为宝）、太阳能小电源（选配）；③卖点话示例：\"手机上看墒情，阀门自己开关——一亩地省水三成，人不用天天守大棚\"。","al":{"考查点":"开放创造：农业物联系统的低成本实现（创造+应用）","解题思路":"闭环四环含执行器动作；清单三类器件齐全且\"变废为宝\"标注；卖点量化（省水/省人工）且通俗","易错警示":"闭环缺\"反馈回来\"的回路；卖点写\"高科技\"没有具体省什么","方法点拨":"创客题公式：闭环成环、清单分类、卖点有数字。"}}]},{"t":"第 25 课 · 配套练习","n":"学习探究新工具","isExam":false,"qs":[{"sec":"回忆热身","type":"回忆","num":1,"text":"评价一个智能学习工具有没有用，要问三问：感知什么、怎么帮、是____还是翅膀。","opts":[],"subs":[],"ans":"拐杖","al":{"考查点":"学习工具三问的识记（记忆）。","解题思路":"评价工具三问=感知什么、怎么帮、是拐杖还是翅膀；题干已给前两问，末问“是拐杖还是翅膀”。","易错警示":"勿填“手机/平板”——末问的比喻是“拐杖还是翅膀”。","方法点拨":"“三问”口诀：感什么、怎么帮、杖还是翅。"}},{"sec":"回忆热身","type":"回忆","num":2,"text":"“赋能≠代劳”：看智能讲解后必须____重做一遍，知识才真正变成自己的。","opts":[],"subs":[],"ans":"自己","al":{"考查点":"赋能≠代劳的识记（记忆）。","解题思路":"赋能≠代劳：看智能讲解后必须自己重做一遍，知识才真正变成自己的。","易错警示":"勿填“抄一遍/再讲一遍”——关键词是“自己”。","方法点拨":"学习铁律“看懂≠会做，重做才算数”——先想再看再重做。"}},{"sec":"基础巩固","type":"单选","num":1,"text":"智能错题本收集你的错题并生成“同类题再练”，它最核心的助学逻辑是：","opts":[{"label":"A","text":"替你写作业"},{"label":"B","text":"针对薄弱点精准推送练习，让你把不会的练会"},{"label":"C","text":"把分数变高"},{"label":"D","text":"替老师改卷"}],"subs":[],"ans":"答案B　针对薄弱点精准推送练习，让你把不会的练会","al":{"考查点":"智能错题本助学逻辑（理解）。","解题思路":"错题本核心=数据诊断+精准练习：从错题数据找薄弱点，推送同类巩固。","逐项剖析":"A 替你写作业：代劳，排除；B 针对薄弱点精准推送练习、把不会的练会：正确；C 把分数变高：结果不是逻辑，排除；D 替老师改卷：越界，排除。","易错警示":"“精准诊断+针对练习”是助学逻辑，代写替考是歪用。","方法点拨":"见“错题→同类推送”即“诊断+练习”，学习工具的正确姿势。"}},{"sec":"基础巩固","type":"单选","num":2,"text":"虚拟实验平台能让学生在“爆炸、高压”等危险场景里零风险操作，它最大的价值是：","opts":[{"label":"A","text":"让学生玩得更刺激"},{"label":"B","text":"突破真实实验的安全与器材限制，人人可反复探究"},{"label":"C","text":"取代所有真实实验"},{"label":"D","text":"省去写实验报告"}],"subs":[],"ans":"答案B　突破真实实验的安全与器材限制，人人可反复探究","al":{"考查点":"虚拟实验最大价值（理解）。","解题思路":"虚拟实验突破“危险做不了、器材不够分、成本高”的真实痛点，让学生安全反复试错。","逐项剖析":"A 玩得更刺激：窄化，排除；B 突破安全与器材限制、人人可反复探究：正确；C 取代所有真实实验：夸大，排除；D 省写实验报告：不是价值核心，排除。","易错警示":"虚拟实验“不取代真实动手”——局限在题B之外要自知。","方法点拨":"虚拟实验价值=安全+可反复+人人可得，三维表述。"}},{"sec":"基础巩固","type":"单选","num":3,"text":"“拐杖还是翅膀”的比喻中，属于“翅膀”式用法的是：","opts":[{"label":"A","text":"直接用智能工具搜答案抄上"},{"label":"B","text":"先自己思考错在哪，再看解析，最后合上答案自己重做一遍"},{"label":"C","text":"让工具替自己写作文"},{"label":"D","text":"不会的题永远跳过"}],"subs":[],"ans":"答案B　先自己思考错在哪，再看解析，最后合上答案自己重做一遍","al":{"考查点":"翅膀式用法辨识（应用·评价）。","解题思路":"翅膀=让学习真实发生：先自己思考错在哪→再看解析→合上答案重做——工具帮你飞。","逐项剖析":"A 直接搜答案抄：拐杖甚至躺平，排除；B 先思考再看解析最后重做：翅膀式，正确；C 让工具替写作文：代劳，排除；D 难题永远跳过：逃避，排除。","易错警示":"“先想—再对—后重做”三步是翅膀的判定标准。","方法点拨":"辨“杖还是翅”看学习是否发生：发生=翅膀，代劳=拐杖。"}},{"sec":"基础巩固","type":"单选","num":4,"text":"有人担心“算法推荐会不会把学习视野越推越窄”——比如总推你擅长的、不推你薄弱的。这种担心的本质是：","opts":[{"label":"A","text":"工具太多"},{"label":"B","text":"算法只考虑“让你满意”而非“帮你补齐短板”"},{"label":"C","text":"网速太慢"},{"label":"D","text":"老师不够好"}],"subs":[],"ans":"答案B　算法只考虑“让你满意”而非“帮你补齐短板”","al":{"考查点":"推荐算法窄化视野的本质（理解·评价）。","解题思路":"推荐算法为留用户常“投其所好”，学习需要“补短板”，两者目标冲突——担忧本质是“让你满意vs帮你补齐”。","逐项剖析":"A 工具太多：非本质，排除；B 算法只考虑让你满意而非补齐短板：正确；C 网速太慢：排除；D 老师不够好：转移焦点，排除。","易错警示":"“投其所好”与“补你短板”目标冲突是理解算法局限的钥匙。","方法点拨":"面对推荐内容要主动选择——算法管“留住你”，你管“提升你”。"}},{"sec":"基础巩固","type":"判断","num":1,"text":"只要用了智能学习工具，成绩就一定会提高。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"工具与成绩关系的判断（理解）。","解题思路":"工具只是辅助，效果取决于使用方式（先思后看、重做巩固）；当拐杖或玩具都不会自动提分，判断错误。","易错警示":"“用了就提分”是工具迷信，正解看用法。","方法点拨":"判断题见“只要用××就一定××”即绝对化错误。"}},{"sec":"基础巩固","type":"判断","num":2,"text":"“赋能≠代劳”：看解析后自己重做一遍，才可能真正掌握。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"重做价值的判断（理解）。","解题思路":"看懂≠会做，重做是检索练习能把“看过”变“掌握”；只看不练仍是代劳式学习，判断正确。","易错警示":"“重做”是掌握的分水岭，判√。","方法点拨":"检索练习原理：提取越费劲，记忆越牢固。"}},{"sec":"基础巩固","type":"判断","num":3,"text":"学习手环记录专注时长、久坐提醒，属于物联网对学习习惯的养成助力。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"学习手环归类判断（理解）。","解题思路":"学习手环感知（时长姿势心率）+反馈（提醒休息）助养成习惯，属物联网+学习应用，判断正确。","易错警示":"别因“手环”只想到健康——感知反馈闭环可服务学习场景。","方法点拨":"闭环框架跨领域：换感知量与反馈对象，同一模型适用。"}},{"sec":"能力提升","type":"提升","num":1,"text":"请用“工具三问”（感知什么、怎么帮、拐杖还是翅膀）分析“智能错题本”这个工具。","opts":[],"subs":[],"ans":"感知什么：采集你的答题数据，识别错题与薄弱知识点；怎么帮：自动归类错题、推送同类变式题、生成阶段复习清单；拐杖还是翅膀：取决于用法——抄答案、依赖推送是拐杖；先独立重做、把它当“诊断单”查漏补缺就是翅膀。","al":{"考查点":"工具三问分析错题本（应用）。","解题思路":"三问分答：感知什么=采集答题数据识别错题薄弱点；怎么帮=自动归类、推同类变式、生成复习清单；杖还是翅=抄答案依赖推送是拐杖，独立重做当诊断单是翅膀。","易错警示":"第三问要“两面都答”，不能只答一面。","方法点拨":"三问作答“一问一段”，末问用“取决于用法”辩证收尾。"}},{"sec":"能力提升","type":"提升","num":2,"text":"物理老师用虚拟实验让大家“模拟电路短路”观察后果。请说明虚拟实验相比真实实验的两个优势和一个局限。","opts":[],"subs":[],"ans":"优势：安全（短路、爆炸等危险场景零风险可看）；可反复（器材不限、人人能操作、失败可重来）。局限：虚拟环境无法完全还原真实器件的误差与手感，动手操作、接线等真实技能仍需真实实验培养——虚拟与真实应互补。","al":{"考查点":"虚拟实验优势与局限（分析）。","解题思路":"两优势：安全（危险场景零风险可看）、可反复（器材不限人人能操作失败可重来）；一局限：无法还原真实器件误差与手感，动手接线技能需真实实验——虚拟真实应互补。","易错警示":"“局限”要写真实技能层面，不能空喊“不够真实”。","方法点拨":"“优势+局限”题：优势按场景说，局限往“动手技能”挖，互补收尾。"}},{"sec":"能力提升","type":"提升","num":3,"text":"请设计一个“用智能工具复习错题”的正确流程（至少四步），并说明为什么“先做再看”比“先看再做”效果好。","opts":[],"subs":[],"ans":"流程：①先凭记忆独立重做错题；②对照解析找出卡点（哪一步没想到）；③用工具的“同类题”功能练2-3道变式；④隔天再抽做一次检验是否真会。为什么先做再看：先做是“检索练习”，暴露真实薄弱点，再看解析才有针对性地补；先看再做容易“看着答案觉得会了”，是虚假掌握。","al":{"考查点":"智能复习流程设计+先做再看论证（应用·创造）。","解题思路":"流程四步：①凭记忆独立重做→②对照解析找卡点→③同类变式练2-3道→④隔天抽做检验；论证=先做是检索练习暴露真实薄弱点，再看才有针对性；先看再做是“看着答案觉得会了”的虚假掌握。","易错警示":"“为什么先做再看”要答到检索练习原理，只说“先做更好”缺说服力。","方法点拨":"先做再看=让错误先现形，再让解析对症下药。"}},{"sec":"能力提升","type":"提升","num":4,"text":"学校引进“班级智能学伴”，它能根据你的作业数据生成专属讲解。请写出你作为使用者应该坚守的两条“自主学习纪律”，防止把学伴用成“答案机”。","opts":[],"subs":[],"ans":"纪律一：先独立解题并写出思路，卡住后再请学伴讲，禁止直接要答案；纪律二：学伴讲的要点要自己复述并用变式题验证，不点头就算会。核心：让学伴当“教练”而不是“替身”，独立思考永远走在前头。","al":{"考查点":"自主使用纪律设计（应用·创造）。","解题思路":"两条纪律：①先独立解题写思路、卡住再请学伴讲、禁止直接要答案；②学伴讲的要点自己复述并用变式验证、不点头就算会。核心=学伴当教练不当替身。","易错警示":"纪律要“可执行动作”，不是“要自觉”。","方法点拨":"防“答案机”两闸：先思后问、讲后复述验证。"}},{"sec":"拓展挑战","type":"拓展","num":1,"text":"妈妈看到你用学习平板查资料，担心“你是在学习还是刷视频”。请你设计一个“让妈妈放心”的自律方案：①列出平板里“学习工具”与“娱乐应用”各两个；②写三条你用平板的自我约定；③选一种物联网/数据手段（如学习手环专注记录）说明它能怎么帮妈妈“看得见你的专注”。","opts":[],"subs":[],"ans":"①学习工具：智能错题本、虚拟实验平台（再如英语跟读、思维导图）；娱乐应用：短视频、游戏。②约定：学习时段不开娱乐应用；先用纸笔独立思考再看屏幕解析；每天屏幕学习时长设上限并主动汇报。③学习手环/专注App会记录我的“连续专注时长与休息提醒”，把每日专注数据生成周报给妈妈看——用数据让妈妈放心，也让我自己看见进步。","al":{"考查点":"自律方案综合设计（应用·创造）。","解题思路":"三问分答：①列出学习工具两（错题本/虚拟实验）+娱乐应用两（短视频/游戏）；②自我约定三条（学习时段不开娱乐、先纸笔独立思考再看屏、设时长上限并汇报）；③用学习手环专注记录——记录连续专注时长与休息提醒、生成周报给妈妈看。","易错警示":"“让妈妈看得见专注”要落到具体数据手段（周报），不能空谈自觉。","方法点拨":"自律方案=工具清单+行为约定+数据佐证三件套。"}},{"sec":"拓展挑战","type":"拓展","num":2,"text":"有人提议“用人工智能直接批改并讲解全班作业，老师就不用批改了”。请你从“老师作用”与“学习效果”两个角度分析这个提议的利弊，并给出更合理的分工建议。","opts":[],"subs":[],"ans":"利：机器批改快、统一客观，把老师从机械劳动中解放出来；弊：机器看不到学生解题过程中的思维火花与典型错误背后的情绪与原因，评语缺乏针对性；且学生可能更不愿自己订正。合理分工：机器负责“数据统计”（谁错哪题、共性薄弱点），老师负责“读懂学生”（面批典型错误、设计针对性讲解与鼓励）——人机协同，机器提效、老师育人。","al":{"考查点":"AI批改利弊与分工（分析·评价）。","解题思路":"利弊两角度：利=快且客观、解放机械劳动；弊=看不到思维过程与典型错误背后的情绪原因、评语无针对性、学生更不愿订正；分工=机器管数据统计（谁错哪题共性薄弱点），老师管读懂学生（面批典型错误、设计讲解与鼓励）。","易错警示":"“分工建议”是升华点：机器提效、老师育人。","方法点拨":"人机分工题口诀“机器算数、老师育人”——各管最擅长的。"}},{"sec":"变式闯关","type":"变式","num":1,"text":"换一个场景：不是学生用工具，而是“教练用运动手表带队员训练”。请用“感知—传输—处理—反馈”说明手表如何帮教练科学安排训练量，并指出教练为什么不能只信手表数据。","opts":[],"subs":[],"ans":"感知：手表测心率、步频等；传输：数据传到教练终端；处理：分析负荷是否超限；反馈：提醒队员降速/休息，教练据以调整计划。不能只信手表：设备有误差、队员个体差异大、状态（睡眠、情绪）机器看不全——手表提供数据参考，最终决策要靠教练的专业判断与观察。","al":{"考查点":"感知反馈闭环迁移运动训练（应用）。","解题思路":"四环迁移：感知（手表测心率步频）→传输（到教练终端）→处理（分析负荷是否超限）→反馈（提醒降速休息、教练调整计划）；不能只信手表=设备误差+个体差异+睡眠情绪机器看不全，最终靠教练专业判断。","易错警示":"“为何不能只信”要写机器局限三条，再落回人的决策。","方法点拨":"工具定位迁移题统一结论：数据给参考，人来拍板。"}},{"sec":"间隔复习","type":"间隔","num":1,"text":"“智能学伴”和“远程监护”都是物联网应用。请指出两者在“感知对象”和“反馈对象”上的不同，说明同一种闭环如何服务不同领域。","opts":[],"subs":[],"ans":"（第23课《医疗设施新功能》）　智能学伴感知的是“学习行为数据”（答题、用时），反馈给“学生”（推送讲解与练习）；远程监护感知的是“生命体征”（心率、血氧），反馈给“医生与家属”（告警）。同是“感知—处理—反馈”闭环，只要换掉感知量与服务对象，就能服务学习或医疗——这正是物联网通用框架的价值。","al":{"考查点":"智能学习工具设计+学习科学嵌入（创造）；跨课迁移——间隔重复策略工程化。","解题思路":"三段作答：①感知什么（听写自测正确率与用时、识别易错词）与“真会判定”（新词连续3天默写全对才标掌握+按2-7-21天间隔复测）；②反馈提醒（到期未复习自动进“今日必清”列表）；③防偷懒（限时默写才算打卡、连续敷衍重置进度）。","易错警示":"“真会判定”是本答案的灵魂——用间隔重复+连续正确双标准，不是点一下就算会。","方法点拨":"学习工具设计“判定+提醒+防作弊”三机制，判定标准越严越有学习科学含金量。"}},{"sec":"思维进阶","type":"挑战","num":1,"text":"班里“背单词困难户”很多，请你设计一个“智能单词打卡器”方案并写《产品说明》：①它感知什么数据、怎么判断你“真会了”（提示：可结合间隔重复1-2-7-21天）；②它如何“反馈”帮你不忘（提醒机制设计）；③写一句“防偷懒”设计说明——怎么防止你假装打卡。","opts":[],"subs":[],"open":true,"ans":"参考设计要点：①感知与判断：感知每次打卡的时间、正确率与用时；判断\"真会了\"的标准——按1-2-7-21天间隔重复中，该词在间隔拉长的多次测试中都能秒答正确（而非当天连续抄对），掌握概率达标才算通过；②反馈机制：临近遗忘临界点（第2/7/21天）自动推送该词复习卡；答错立即回到更短间隔并加入\"错词本\"重点复现；每周生成记忆曲线图反馈进步；③防偷懒设计：随机打乱词序防止按位置背；同一词随机换题型（选择/拼写/例句填空）防止\"眼熟假会\"；连续秒答相同用时异常则触发\"重测确认\"。","al":{"考查点":"开放创造：间隔重复算法的产品化（创造+应用）","解题思路":"判断标准体现\"间隔拉长仍答对\"的核心思想；反馈机制对准遗忘临界点；防偷懒三招针对三类作弊行为","易错警示":"把\"当天连对三次\"当真会——违背间隔重复原理；防偷懒只写\"诚信打卡\"没有机制","方法点拨":"打卡器题公式：间隔判会、临界提醒、随机防假。"}}]},{"t":"达标检测","n":"第五单元 物联网应用探索 · 达标检测卷","isExam":true,"qs":[{"sec":"选择题","type":"选择题","num":1,"text":"博物馆给书画展柜装温湿度传感器，最主要是为了：","opts":[{"label":"A","text":"防潮防变形的预防性保护"},{"label":"B","text":"给展柜做装饰"},{"label":"C","text":"统计观众人数"},{"label":"D","text":"照明控制"}],"subs":[],"ans":"答案A　防潮防变形的预防性保护","al":{"考查点":"传感器与文保匹配（应用）。","解题思路":"书画怕潮怕变形，温湿度传感器持续监测调控=防潮防变形预防性保护。","易错警示":"“装饰/统计/照明”均非装温湿度传感器的目的。","方法点拨":"文物怕什么→装什么传感器→预防性保护。"}},{"sec":"选择题","type":"选择题","num":2,"text":"体脂秤能估算体脂率，主要依据的是：","opts":[{"label":"A","text":"人的体重数字"},{"label":"B","text":"微电流测身体电阻抗"},{"label":"C","text":"秤会读心术"},{"label":"D","text":"拍照看身材"}],"subs":[],"ans":"答案B　微电流测身体电阻抗","al":{"考查点":"体脂秤原理（理解）。","解题思路":"脂肪与肌肉导电性不同，微弱电流测阻抗估算体脂率=生物电阻抗法。","易错警示":"“秤体重/读心术/拍照”均非原理。","方法点拨":"见“体脂/电阻抗/导电”即BIA。"}},{"sec":"选择题","type":"选择题","num":3,"text":"“人工智能读片出错谁来负责”引发全球讨论，这属于医疗物联网的哪个问题？","opts":[{"label":"A","text":"算法责任归属"},{"label":"B","text":"网速太慢"},{"label":"C","text":"设备太贵"},{"label":"D","text":"界面不好看"}],"subs":[],"ans":"答案A　算法责任归属","al":{"考查点":"AI读片责任归属（理解）。","解题思路":"辅助诊断出错时责任在医生、厂商还是算法，是“科技向善”的伦理问题，欧盟要求可解释可问责。","易错警示":"“网速/价格/界面”是凑数项，核心是责任归属。","方法点拨":"“AI出错谁负责”=算法责任归属，高频考点。"}},{"sec":"选择题","type":"选择题","num":4,"text":"智慧大棚土壤湿度低于阈值自动滴灌，其中“决定要不要浇水”发生在闭环的哪一步？","opts":[{"label":"A","text":"感知"},{"label":"B","text":"传输"},{"label":"C","text":"处理"},{"label":"D","text":"反馈"}],"subs":[],"ans":"答案C　处理","al":{"考查点":"闭环中处理环节辨识（理解）。","解题思路":"“决定要不要浇水”=比对阈值做判断，是处理环节；感知是测、传输是送、反馈是执行。","易错警示":"“决定”一词直指处理——判断在哪步，答案就是哪步。","方法点拨":"闭环四环看动词：测(感)送(传)想(处)做(馈)。"}},{"sec":"选择题","type":"选择题","num":5,"text":"下列属于“翅膀式”使用智能学习工具的是：","opts":[{"label":"A","text":"直接搜答案抄上"},{"label":"B","text":"先独立重做，再看解析，最后合上答案再验一遍"},{"label":"C","text":"让工具替自己写作文"},{"label":"D","text":"看到难题就跳过"}],"subs":[],"ans":"答案B　先独立重做，再看解析，最后合上答案再验一遍","al":{"考查点":"翅膀式用法辨识（应用）。","解题思路":"“先独立重做→再看解析→合上再验”让学习真实发生，是翅膀式；抄答案/代写/跳过都是拐杖或躺平。","易错警示":"“学习是否发生”是杖翅判断的唯一标准。","方法点拨":"先思后看再重做=翅膀，搜抄代写=拐杖。"}},{"sec":"选择题","type":"选择题","num":6,"text":"远程监护让农村患者也能请城里专家会诊，主要体现了：","opts":[{"label":"A","text":"物联网促进医疗资源公平"},{"label":"B","text":"城市医院生意更好"},{"label":"C","text":"农村不需要医院"},{"label":"D","text":"网络速度变慢"}],"subs":[],"ans":"答案A　物联网促进医疗资源公平","al":{"考查点":"远程医疗公平价值（理解）。","解题思路":"远程医疗打破地域限制，优质资源惠及偏远农村=物联网促进医疗资源公平。","易错警示":"“医院生意更好/农村不需医院”为错误干扰。","方法点拨":"见“偏远地区也能享受优质资源”即公平价值。"}},{"sec":"判断题","type":"判断题","num":1,"text":"文物保护要等文物坏了再修，平时不必监测。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"预防性保护的判断（理解）。","解题思路":"文物损伤多不可逆，核心是预防性保护：持续监测环境提前预警，判断错误。","易错警示":"“坏了再修”是被动思维。","方法点拨":"文物保护第一性原则=预防重于修复。"}},{"sec":"判断题","type":"判断题","num":2,"text":"穿戴设备的健康读数可以直接作为医生的诊断依据。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"穿戴设备定位的判断（理解）。","解题思路":"消费级设备存在误差只作日常参考，诊断需专业设备复核，判断错误。","易错警示":"穿戴≠医用，参考≠诊断。","方法点拨":"穿戴设备定位“参考级”，诊断必须医用级。"}},{"sec":"判断题","type":"判断题","num":3,"text":"医疗物联网只要方便高效，患者隐私可以不那么重视。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"医疗隐私的判断（理解）。","解题思路":"医疗数据最敏感，便利必须以隐私保护为前提——伦理三问第一问，判断错误。","易错警示":"“效率优先隐私让路”严重违背伦理。","方法点拨":"医疗物联红线：隐私是前提不是可选项。"}},{"sec":"判断题","type":"判断题","num":4,"text":"无人机巡田和虫情测报能完全取代农民下地。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"无人机定位的判断（理解）。","解题思路":"无人机与测报灯是扩大眼睛提效的助手，细微判断与应急处置仍需农民到田，判断错误。","易错警示":"“完全取代”是绝对化陷阱。","方法点拨":"技术是帮手不是替代者。"}},{"sec":"判断题","type":"判断题","num":5,"text":"智能学习工具的推荐算法总是为我们好，跟着推荐走一定越学越好。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"推荐算法的判断（评价）。","解题思路":"推荐算法常投其所好而非补你短板，跟着走不一定越学越好——要主动选择先思后看，判断错误。","易错警示":"“算法总是为我们好”是技术盲信。","方法点拨":"推荐管“留住你”，学习提升要靠“你主动”。"}},{"sec":"填空题","type":"填空题","num":1,"text":"文物的三大敌人是潮湿、____和被盗。","opts":[],"subs":[],"ans":"震动","al":{"考查点":"文物三敌识记（记忆）。","解题思路":"三敌=潮湿、震动、被盗，缺“震动”。","易错警示":"勿填“光照”——三敌固定搭配。","方法点拨":"“潮—震—盗”三字诀。"}},{"sec":"填空题","type":"填空题","num":2,"text":"分析健康数据要“看____不看单点”，连续多日记录才有意义。","opts":[],"subs":[],"ans":"趋势","al":{"考查点":"健康数据分析原则（记忆）。","解题思路":"看趋势不看单点——连续多日记录才有意义。","易错警示":"“单点”是反例词。","方法点拨":"“看趋势不看单点”全单元铁律。"}},{"sec":"填空题","type":"填空题","num":3,"text":"医疗物联网分析框架是“功能—____—风险”。","opts":[],"subs":[],"ans":"价值","al":{"考查点":"医疗物联框架识记（记忆）。","解题思路":"框架=功能—价值—风险，缺“价值”。","易错警示":"勿填“价格”。","方法点拨":"“功能价值风险”三词框架。"}},{"sec":"填空题","type":"填空题","num":4,"text":"“科技向善”＝能力＋____。","opts":[],"subs":[],"ans":"责任","al":{"考查点":"科技向善识记（记忆）。","解题思路":"科技向善=能力+责任。","易错警示":"勿填“利益”。","方法点拨":"“能力+责任”公式。"}},{"sec":"填空题","type":"填空题","num":5,"text":"智慧农业把农民从“靠天种菜”变为“靠____种菜”。","opts":[],"subs":[],"ans":"数据","al":{"考查点":"智慧农业本质识记（记忆）。","解题思路":"靠天种菜→靠数据种菜。","易错警示":"勿填“靠机器”。","方法点拨":"“靠天→靠数据”一句话定义。"}},{"sec":"填空题","type":"填空题","num":6,"text":"评价学习工具要问：是帮你飞翔的____，还是替你走路的拐杖。","opts":[],"subs":[],"ans":"翅膀","al":{"考查点":"工具比喻识记（记忆）。","解题思路":"评价学习工具问：帮你飞翔的翅膀，还是替你走路的拐杖。","易错警示":"方向勿填反——翅膀才是正向。","方法点拨":"“翅膀vs拐杖”喻：学习发生与否。"}},{"sec":"简答题","type":"简答题","num":1,"text":"请写出“文展柜湿度超标自动除湿”的完整闭环（感知—传输—处理—反馈各做什么）。","opts":[],"subs":[],"ans":"感知：湿度传感器测得湿度超标；传输：数据上传控制平台；处理：与设定阈值比较，判定需要除湿；反馈：启动除湿机，湿度回落后自动停机并继续监测——四步循环实现自动恒湿。（每步2分）","al":{"考查点":"除湿闭环的完整表述（应用）。","解题思路":"四环各写职责：感知（湿度传感器测超标）→传输（数据上传控制平台）→处理（与阈值比较判定需除湿）→反馈（启动除湿机、湿度回落自动停机并继续监测）。","易错警示":"“自动停机+继续监测”是闭环收尾，漏写降格为开环。","方法点拨":"闭环题四环逐写，末环“回落自停+持续监测”成对收束。"}},{"sec":"简答题","type":"简答题","num":2,"text":"请用“功能—价值—风险”分析“智慧大棚自动滴灌”，并说明它如何体现“靠数据种菜”而不是“靠天种菜”。","opts":[],"subs":[],"ans":"功能：土壤湿度传感器感知墒情，低于阈值自动滴灌，达标自动停；价值：按需供水节水30%以上、免跑腿省人力、减少冻害旱灾风险；风险：设备故障或断网可能误浇漏浇，需维护与手动应急。（8分）体现“靠数据种菜”：过去凭经验、看天色估摸浇水（靠天），现在是传感器实时数据＋阈值判断＋自动执行（靠数据），决策依据从“感觉”变成“数据”。（4分）","al":{"考查点":"自动滴灌的功能价值风险分析+数据农业论证（分析）。","解题思路":"两段：功能（湿度传感器感知墒情低阈自动滴灌达标自停）/价值（节水30%+免跑腿+减旱灾）/风险（设备故障断网误浇漏浇需维护应急）（8分）；再论证“靠数据”——过去凭经验看天色（靠天），现在传感器实时数据+阈值判断+自动执行（靠数据），决策依据从感觉到数据（4分）。","易错警示":"论证段要“过去vs现在”对照，落到“决策依据变了”。","方法点拨":"“靠数据”论证模板：过去靠什么→现在靠什么→依据从哪变到哪。"}},{"sec":"案例分析题","type":"案例分析题","num":1,"text":"某养老院为失能老人配备了“智能床垫＋智能药盒＋呼叫手环”：床垫感知离床与心率，夜间长时间离床会通知护工；药盒到点提醒服药；手环一键呼叫。请回答：①这套系统用到哪些传感器，各感知什么？②它带来哪些价值？③存在什么风险，养老院应如何防范（至少两条）？","opts":[],"subs":[],"ans":"①床垫用压力/振动传感器感知离床与心率；药盒用重力/光电传感感知取药；手环含按键（一键呼叫）与定位模块。（3分）②价值：夜间坠床、跌倒能及时发现；按时服药有保障；老人紧急情况一键呼救——安全与照护效率双提升。（4分）③风险：老人隐私（作息、离床规律）被过度记录、系统误报漏报、数据泄露。防范：数据脱敏、仅护理人员可看并设访问权限；系统定期校准、异常数据人工复核，保留人工巡检不因技术放松。（8分）","al":{"考查点":"养老院物联系统综合分析（分析·应用）。","解题思路":"三问分答：①传感器与感知对象——床垫压力/振动（离床心率）、药盒重力/光电（取药）、手环按键+定位（呼叫位置）（3分）；②价值——夜间坠床早发现、服药有保障、一键呼救，安全照护双提升（4分）；③风险+防范两条——隐私被过度记录/误报漏报/泄露，防范=数据脱敏仅护理可看设权限、系统定期校准+异常人工复核+保留人工巡检（8分）。","易错警示":"“防范”要与“风险”对应并含“不因技术放松人工”的兜底。","方法点拨":"养老物联题“传感器清单→价值→风险+双防范”，隐私与人工兜底是采分亮点。"}},{"sec":"综合实践题","type":"综合实践题","num":1,"text":"学校要为“校园菜园”建设一套智慧种植系统并参加市赛，请你写《系统设计说明书》：①画出“感知—传输—处理—反馈”闭环，说明自动浇水如何工作；②说明系统还能增加哪一项“数据增值应用”（如生长日报），它需要额外采集什么、给谁看、有什么用；③用价值四维分析这套系统；④指出两个可能失灵场景与对策。","opts":[],"subs":[],"ans":"①闭环：土壤湿度传感器感知墒情→无线传到控制器→与阈值比较判定缺水→打开电磁阀滴灌，湿度达标自动停止并持续监测。（5分）②增值应用示例：生成《菜园生长日报》——每天记录温湿度、光照、浇水次数，自动汇总成周报推给科学老师与种植小组，用于分析“哪种条件长得好”，把种菜变成可研究的数据项目。（5分）③价值：提效——自动浇水免每日往返；降本——按需灌溉省水；安全——土壤过干过湿预警防死苗；便利——周末离校也能远程掌握。（6分）④失灵与对策：传感器探头被泥土覆盖读数失真→定期清洁校准；断网→本地控制器保留基础定时功能＋数据缓存补传，保留手动浇水管。（9分，写满并合理即给分）","al":{"考查点":"智慧种植系统全案设计（创造）。","解题思路":"四问分答：①闭环（土壤湿度传感→无线传控制器→阈值判断→开阀滴灌达标自停+持续监测，5分）；②增值应用（《菜园生长日报》——采集温湿度光照浇水次数、推给科学老师与种植小组、用于分析哪种条件长得好，5分）；③价值四维（提效自动浇水、降本省水、安全干湿预警、便利远程掌握，6分）；④两失灵+对策（探头被土盖读数失真→清洁校准；断网→本地控制器保留基础定时+缓存补传+保留手动浇水管，9分）。","易错警示":"增值应用要“采集什么+给谁看+有什么用”三要素齐全。","方法点拨":"综合设计“闭环+增值+四维价值+失灵对策”四段，把单元闭环/数据/价值/容灾全串起来。"}}]}]},{"t":"第六单元 物联网安全","isFinal":false,"lessons":[{"t":"第 26 课 · 配套练习","n":"数字世界有身份","isExam":false,"qs":[{"sec":"回忆热身","type":"回忆","num":1,"text":"数字身份的三件套是：账号（我是谁）、____（私密暗号）、设备ID（机器编号）。","opts":[],"subs":[],"ans":"密码","al":{"考查点":"数字身份三件套的识记（记忆）。","解题思路":"三件套=账号（我是谁）、密码（私密暗号）、设备ID（机器编号）；题干已给“账号”与“设备ID”，缺“密码”。","易错警示":"勿填“手机号/验证码”——三件套固定为账号、密码、设备ID。","方法点拨":"“认人（账号密码）＋认机（设备ID）”双轨记，三件套缺一不可。"}},{"sec":"回忆热身","type":"回忆","num":2,"text":"物联网系统为什么“先认人、后办事”？因为身份是网络世界的____。","opts":[],"subs":[],"ans":"信任基石","al":{"考查点":"数字身份意义的识记（记忆）。","解题思路":"系统“先认人后办事”，因为身份是网络世界的信任基石——先确认“你是谁”，才决定给不给权。","易错警示":"勿填“通行证/敲门砖”——教材表述是“信任基石”。","方法点拨":"一句话记忆：身份=信任的起点，系统先认人后办事。"}},{"sec":"基础巩固","type":"单选","num":1,"text":"数字身份类比现实身份证：身份证上的“编号”最接近数字身份里的：","opts":[{"label":"A","text":"账号"},{"label":"B","text":"设备ID"},{"label":"C","text":"头像"},{"label":"D","text":"签名"}],"subs":[],"ans":"答案B　设备ID","al":{"考查点":"数字身份与现实证件的类比（理解）。","解题思路":"身份证“编号”唯一标识一个人→对应唯一标识一台机器的“设备ID”；账号更像姓名（称呼用），密码像防伪。","逐项剖析":"A 账号：对应姓名而非编号，排除；B 设备ID：唯一标识与证件编号同构，正确；C 头像：外观信息，排除；D 签名：验证用非标识，排除。","易错警示":"“唯一标识”是配对的钥匙：人用证件编号、机器用设备ID。","方法点拨":"类比题抓“唯一性”：谁终身唯一标识谁就对应设备ID。"}},{"sec":"基础巩固","type":"单选","num":2,"text":"“零信任”安全理念的核心思想是：","opts":[{"label":"A","text":"只要第一次验证过，就永远信任"},{"label":"B","text":"每次访问都要重新验证身份，不默认“进来了就都信”"},{"label":"C","text":"完全不设密码最方便"},{"label":"D","text":"只信大公司的设备"}],"subs":[],"ans":"答案B　每次访问都要重新验证身份，不默认“进来了就都信”","al":{"考查点":"零信任理念的理解（理解）。","解题思路":"零信任默认“不可信”：每次访问都重新验证，即使在内网也不放松——与“一次登录终身有效”相反。","逐项剖析":"A 第一次验证就永远信任：传统思维，排除；B 每次访问重新验证、不默认“进来了就都信”：正确；C 完全不设密码最方便：荒谬，排除；D 只信大公司设备：与理念无关，排除。","易错警示":"“零信任≠不信任任何人”，而是“默认不轻信、持续验证”。","方法点拨":"见“每次验证/不默认信任/内网也查”即零信任。"}},{"sec":"基础巩固","type":"单选","num":3,"text":"家里的智能摄像头第一次使用，厂家要求你设置“管理员密码”。这一步的本质是：","opts":[{"label":"A","text":"让摄像头更美观"},{"label":"B","text":"为设备设置数字身份凭证，防止他人随意控制"},{"label":"C","text":"让厂家收集密码卖钱"},{"label":"D","text":"纯粹走流程没用"}],"subs":[],"ans":"答案B　为设备设置数字身份凭证，防止他人随意控制","al":{"考查点":"设备初始设密的本质（理解）。","解题思路":"首次设管理员密码=为设备设数字身份凭证：系统先验证“你是谁”才允许查看控制——防他人随意控制。","逐项剖析":"A 让摄像头更美观：无关，排除；B 为设备设置数字身份凭证、防止他人随意控制：正确；C 让厂家收集密码卖钱：阴谋论，排除；D 纯走流程没用：安全意识缺失，排除。","易错警示":"“默认/弱密码=把钥匙挂门外”，设密是身份凭证不是形式主义。","方法点拨":"凡“首次使用设管理员密码”即“建立设备身份凭证”，答题直接套。"}},{"sec":"基础巩固","type":"单选","num":4,"text":"下列关于数字身份的说法正确的是：","opts":[{"label":"A","text":"数字身份只包括账号，密码和设备ID不算"},{"label":"B","text":"数字身份让系统能区分“谁在访问、谁在指挥”，是安全的第一道门"},{"label":"C","text":"设备ID是人人都能改着玩的昵称"},{"label":"D","text":"数字身份与信息安全毫无关系"}],"subs":[],"ans":"答案B　数字身份让系统能区分“谁在访问、谁在指挥”，是安全的第一道门","al":{"考查点":"数字身份内涵的理解（理解·评价）。","解题思路":"身份=账号+密码（人）＋设备ID（机）完整链条；它是安全第一道门——系统先分辨“谁在访问”再授权。","逐项剖析":"A 只包括账号：漏密码与设备ID，排除；B 让系统区分谁在访问、是安全第一道门：正确；C 设备ID是人人都能改的昵称：设备ID出厂唯一不可乱改，排除；D 与信息安全毫无关系：与事实相反，排除。","易错警示":"“身份是安全前提”是本题核心——先认人认机，才能谈权限。","方法点拨":"安全第一问永远是“你是谁、哪台机器”——身份防线最靠前。"}},{"sec":"基础巩固","type":"判断","num":1,"text":"数字身份就是“账号＋密码”，和设备本身没关系。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"数字身份组成范围的判断（理解）。","解题思路":"数字身份还含设备ID——账号密码管人、设备ID管机器，共同构成信任链，说法错误。","易错警示":"“只包括账号密码”漏了“认机”一半。","方法点拨":"判断身份构成三件套缺一即错。"}},{"sec":"基础巩固","type":"判断","num":2,"text":"智能设备的出厂默认密码很安全，可以一直用。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"默认密码安全性的判断（理解）。","解题思路":"默认密码人人皆知（admin/123456），是最大安全隐患，必须首次使用就改强密码，说法错误。","易错警示":"“默认密码安全”是安全意识最大坑，必判错。","方法点拨":"默认密码=公开钥匙，首用必改。"}},{"sec":"基础巩固","type":"判断","num":3,"text":"“零信任”意味着每次访问都要重新验证，虽然麻烦一点但更安全。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"零信任价值的判断（理解）。","解题思路":"零信任用“每次验证”换更高安全性，适合高安全场景——权衡取舍、安全优先，判断正确。","易错警示":"别嫌“麻烦”——麻烦是安全的代价。","方法点拨":"判断题见“每次验证更安全”即√。"}},{"sec":"能力提升","type":"提升","num":1,"text":"请用“现实身份证”作类比，分别说明账号、密码、设备ID在数字身份中的作用。","opts":[],"subs":[],"ans":"账号像身份证上的姓名——让系统知道“你是谁”，用来称呼与区分用户；密码像证件防伪与签名——只有你才知道的“私密暗号”，验证“确实是你本人”；设备ID像证件编号——每台设备唯一的出厂标识，让系统认得“这是哪台机器”。三者配合完成“认人＋认机”。","al":{"考查点":"数字身份三件套类比说明（应用）。","解题思路":"三件套逐一同构：账号=姓名（称呼区分用户）；密码=防伪与签名（只有你知的暗号、验证本人）；设备ID=证件编号（唯一标识哪台机器）——三者配合完成“认人＋认机”。","易错警示":"三个类比要各自“成句”，只列名词不给功能即不完整。","方法点拨":"类比题“证件元素→功能→对应物”三句式作答，人机双轨不遗漏。"}},{"sec":"能力提升","type":"提升","num":2,"text":"请写出“智能门锁为什么要先验证身份再开门”的两条理由，并说明验证失败时应怎么处理。","opts":[],"subs":[],"ans":"理由：①防止陌生人随意进门——只有录入指纹/密码的人才被信任；②能记录“谁在什么时间开过门”，出了问题可追溯。验证失败处理：提示重试并限制次数（连续错误锁定一段时间）、可临时用备用钥匙或管理员开门，同时检查是否有人尝试破解。","al":{"考查点":"门锁先验证的论证（分析·评价）。","解题思路":"理由两条：①防陌生人进门（只有录入者被信任）；②可记录“谁何时开过门”可追溯；验证失败处理=提示重试限次数（连错锁定）+备用钥匙/管理员开门+检查破解尝试。","易错警示":"“验证失败怎么处理”是第二问，别只答理由。","方法点拨":"安全论证题“两条理由+失败处置”结构，理由落到“信任+追溯”。"}},{"sec":"能力提升","type":"提升","num":3,"text":"请完成《我的数字身份卡》：写出你的两个账号的“用途＋密码强度评价（强/中/弱＋理由）”，并给“弱”的一个提出改进建议。","opts":[],"subs":[],"ans":"示例——账号A：学习平台账号，密码含大小写字母数字共10位（强，长度足够且有组合）；账号B：某游戏账号，密码是生日数字（弱，太短且易被猜中）。改进：把游戏账号密码改成“短语＋数字＋符号”组合（如用一句诗首字母＋数字），且不同平台不重用同一密码。","al":{"考查点":"数字身份卡实践（应用）。","解题思路":"按“用途+强度评价（强/中/弱+理由）”格式写两账号示例，再对弱密码给改进（组合短语+数字符号、不同平台不重用）。","易错警示":"强度评价要“给理由”（长度/组合/可猜性），改进建议要具体。","方法点拨":"“身份卡”自查题=每账号三要素（用途/强度/理由），弱项配改法。"}},{"sec":"能力提升","type":"提升","num":4,"text":"爸爸把家里所有智能设备的密码都设成同一个“123456”，他说“好记”。请用两句话向他说明风险，并给出一个“好记又安全”的设密办法。","opts":[],"subs":[],"ans":"风险：123456是最常见的弱密码，攻击者用“撞库”几分钟就能试出来，且所有设备一把钥匙——破一个全失守。办法：给密码设一个“只有你知道的短语规则”，比如用一句古诗的拼音首字母＋家中门牌号（如“jhssd888”），不同设备再在末尾加不同后缀，既好记又各不相同。","al":{"考查点":"向家人讲弱密码风险（应用·表达）。","解题思路":"风险两句：123456是最常见弱密码、撞库几分钟试出，且一把钥匙开所有门——破一个全失守；办法=短语规则（古诗拼音首字母+门牌号）+不同设备加不同后缀，好记又各异。","易错警示":"说服要有“后果冲击力”（破一个全失守），办法要“好记且能落地”。","方法点拨":"劝改密码“风险说后果+办法给公式”，一吓一哄双管齐下。"}},{"sec":"拓展挑战","type":"拓展","num":1,"text":"奶奶新买了智能摄像头，问：“为什么装的时候非要我设密码，还要绑手机号？”请你用“数字身份”的知识给奶奶讲明白：①设置密码是给谁设的、防谁？②绑手机号有什么用？③如果奶奶怕麻烦想跳过，你会怎么劝她？","opts":[],"subs":[],"ans":"①密码是给“这台摄像头的管理员”设的：系统要靠它确认“来查看画面的确实是您家里人”，防的是陌生人或黑客远程偷看。②绑手机号相当于给身份加一道保险——密码忘了可找回、有人异地登录能收到提醒，还能双重验证。③劝她：跳过设密码就像把家门钥匙挂门口，谁都能进来；花两分钟设好密码，全家才用得安心，我来帮您设一个又好记又安全的。","al":{"考查点":"向长辈讲数字身份（应用·表达）。","解题思路":"三问作答：①密码给管理员设、防陌生人黑客偷看；②绑手机号=身份加保险（找回+异地提醒+双验证）；③劝她=跳过设密像钥匙挂门口，我来帮设好记又安全的。","易错警示":"讲给奶奶要生活化比喻（钥匙挂门口），不能甩术语。","方法点拨":"向长辈科普“比喻+好处+我来帮”三步，信任感与安全感并重。"}},{"sec":"拓展挑战","type":"拓展","num":2,"text":"你的智能手表被同学捡到，同学试着乱划，居然没锁就能看到你的运动记录和消息。请分析：①这暴露出设备缺少什么安全设置？②如果手表里有支付功能，可能有什么后果？③请你列出“捡到就能用”类设备应做的三项防护。","opts":[],"subs":[],"ans":"①缺少锁屏与身份验证——屏幕解锁无密码/无指纹，任何人都能直接查看使用。②后果：可能被用于小额免密支付、查看隐私消息、冒用身份发消息。③防护：设置锁屏密码/图案或指纹、开启“手离开即锁”；开通支付前必须验证；支持“丢失模式”——远程锁定并抹除数据。","al":{"考查点":"设备失窃暴露的缺口（分析·评价）。","解题思路":"①缺口=无锁屏与身份验证；②后果=免密小额支付、隐私消息泄露、冒名发消息；③三防护=锁屏密码/图案/指纹、手离即锁、开通支付必验证+丢失模式远程锁抹。","易错警示":"“捡到就能用”的根因是无身份验证，防护要逐项对应。","方法点拨":"失窃设备题“找缺口→推后果→列三防”，三防中“丢失模式”是加分项。"}},{"sec":"变式闯关","type":"变式","num":1,"text":"换一个场景：学校的电子班牌没设密码，任何路过的同学都能修改课程表。请用“设备ID＋访问控制”的思路，为班牌设计一套“只有电教委员能改、其他同学只能看”的方案。","opts":[],"subs":[],"ans":"方案：给班牌绑定管理员账号（电教委员的手机号/指纹）与设备ID白名单；修改课程表必须管理员身份验证通过，普通浏览无需登录但无修改权限（最小权限）；后台记录每次修改的操作者与时间，防止“改了没人认账”。","al":{"考查点":"身份三件套+三级权限的公约设计（创造）；跨课迁移——最小权限落地校园。","解题思路":"三段作答：①人机身份——人用账号+密码/手机验证码、机用唯一设备ID+白名单指令；②三级权限——查看课表任何人免登录只读、修改内容电教委员账号+密码二次确认、查看日志仅管理员双因素验证；③提示语——账号=数字世界签名，借账号等于借签名章。","易错警示":"权限分级要“身份验证方式”逐级写清，提示语要点“不外借”。","方法点拨":"公约设计“人机分述→权限分级带验证→责任提示语”，层级越清越得高分。"}},{"sec":"间隔复习","type":"间隔","num":1,"text":"上节课我们体验了物联网学习探究工具。请回忆：探究中数据从哪里来、经过什么处理、最后到哪里去？请简要描述。","opts":[],"subs":[],"ans":"（第25课《学习探究新工具》）　数据由传感器（或在线数据源）采集而来，经传输汇总到平台，做清洗、统计与可视化处理，最终以图表呈现给学习者，或用于生成结论与反馈建议。","al":{"考查点":"探究数据的完整流向（理解）。","解题思路":"按\"源—管道—呈现\"三段描述：采集端、处理端、呈现端各说一句。","易错警示":"只答\"从传感器到图表\"跳过了处理环节——清洗与分析是数据变信息的关键。","方法点拨":"数据流描述模板：\"由谁产生→经过什么加工→以什么形式呈现\"。"}},{"sec":"间隔复习","type":"间隔","num":2,"text":"采集到的原始数据为什么要先整理再分析？请用一句话说明。","opts":[],"subs":[],"ans":"（第25课《学习探究新工具》）　原始数据常有缺失、重复、异常或格式不一的\"噪声\"，先清洗整理能避免错误数据干扰结论，保证分析结果真实可靠。","al":{"考查点":"数据清洗的意义（理解）。","解题思路":"\"垃圾进，垃圾出\"：带着噪声分析，结论必然失真。","易错警示":"以为数据越多越准——含异常值的样本反而拉偏结论。","方法点拨":"一句话模板：\"去噪才能求真\"。"}},{"sec":"思维进阶","type":"挑战","num":1,"text":"学校要给“智慧班牌系统”建立使用规范，请你设计《班牌数字身份公约》：①说明班牌系统里“人”（师生）和“机”（班牌）分别靠什么证明身份；②设计三类权限：谁能查看课表、谁能修改内容、谁能查看系统日志，各用什么验证方式；③写一句“身份即责任”的提示语，提醒使用者密码与账号不外借。","opts":[],"subs":[],"open":true,"ans":"参考设计要点：①身份证明：人（师生）——账号密码+绑定校园卡/人脸的唯一身份；机（班牌）——设备ID+数字证书，接入系统时自动核验合法性；②三类权限：查看课表——全体师生刷卡/刷脸即可查看；修改内容——仅班主任与教务管理员，须密码+手机验证码双因素；查看系统日志——仅系统管理员，专用账号+双因素+操作全程留痕；③提示语示例：\"身份即责任——你的账号做的每件事都记在你的名字下，密码不外借，信任不透支\"。","al":{"考查点":"开放创造：身份认证与权限分级设计（创造+应用）","解题思路":"人与机的身份载体区分明确；三类权限按\"最小权限\"原则配不同强度验证；提示语把\"身份\"与\"责任\"绑定","易错警示":"所有人用同一种验证方式（无分级）；权限与验证强度不匹配（看日志只靠密码）","方法点拨":"身份题公式：人机分证、权限分级、验证按风险配强度。"}}]},{"t":"第 27 课 · 配套练习","n":"安全事件与风险","isExam":false,"qs":[{"sec":"回忆热身","type":"回忆","num":1,"text":"分析物联网安全风险用“三步法”：先找____，再找风险点，最后看后果。","opts":[],"subs":[],"ans":"设备","al":{"考查点":"风险三步法的识记（记忆）。","解题思路":"三步=先找设备→再找风险点→最后看后果；题干已给第二三问，第一步“设备”。","易错警示":"勿填“攻击者/网络”——第一步定位“设备”。","方法点拨":"“设—点—果”三步法口诀，分析任何安全事件先问“哪台设备”。"}},{"sec":"回忆热身","type":"回忆","num":2,"text":"弱密码、默认配置、长期不更新、____传输，是物联网常见的四类风险点。","opts":[],"subs":[],"ans":"明文（不加密）","al":{"考查点":"四类风险点的识记（记忆）。","解题思路":"四类风险点=弱密码、默认配置、长期不更新、明文（不加密）传输；题干已给前三，缺“明文（不加密）”。","易错警示":"勿填“断网/故障”——四类风险点是教材固定清单。","方法点拨":"“弱默旧明”四字记：弱密码、默认配置、长期不更新、明文传输。"}},{"sec":"基础巩固","type":"单选","num":1,"text":"某款智能门锁被曝“用App可查看他人开锁记录”，用“三步法”分析，这里的风险点是：","opts":[{"label":"A","text":"门锁本身没锁"},{"label":"B","text":"App权限设计不当导致数据越权访问"},{"label":"C","text":"门锁太重"},{"label":"D","text":"电池没电"}],"subs":[],"ans":"答案B　App权限设计不当导致数据越权访问","al":{"考查点":"三步法定位风险点（应用）。","解题思路":"按“设备—风险点—后果”定位：设备=门锁与App，风险点=权限校验缺失导致越权访问，后果=隐私泄露。","逐项剖析":"A 门锁本身没锁：误读，排除；B App权限设计不当导致数据越权访问：正确；C 门锁太重：无关；D 电池没电：无关。","易错警示":"“App可看他人记录”的根源是权限校验缺失——风险点在软件不在硬件。","方法点拨":"定位风险点问“哪一环放行了不该有的访问”——多为权限/校验问题。"}},{"sec":"基础巩固","type":"单选","num":2,"text":"下列做法中，最容易让家中摄像头被“蹭网入侵”的是：","opts":[{"label":"A","text":"设置复杂Wi-Fi密码"},{"label":"B","text":"摄像头用出厂默认密码且从不更新"},{"label":"C","text":"开启双因素认证"},{"label":"D","text":"定期查看陌生设备连接"}],"subs":[],"ans":"答案B　摄像头用出厂默认密码且从不更新","al":{"考查点":"摄像头被入侵主因（应用）。","解题思路":"默认密码公开可查+固件不更新补漏洞=大门钥匙挂门上，最易被“蹭网入侵”。","逐项剖析":"A 复杂Wi-Fi密码：是防范，排除；B 出厂默认密码且从不更新：最大漏洞，正确；C 开启双因素：防范措施，排除；D 定期查看陌生连接：防范习惯，排除。","易错警示":"“默认密码+不更新”双保险缺失才最危险，选“最容易导致”。","方法点拨":"入侵归因题先找“默认/弱口令+不更新”，双项齐备即高危。"}},{"sec":"基础巩固","type":"单选","num":3,"text":"“风险不等于事故”，这句话的正确理解是：","opts":[{"label":"A","text":"有风险就一定会出事"},{"label":"B","text":"风险降到可控范围即可，不必追求绝对零风险"},{"label":"C","text":"完全没有风险才是正常的"},{"label":"D","text":"出了事故才需要防范"}],"subs":[],"ans":"答案B　风险降到可控范围即可，不必追求绝对零风险","al":{"考查点":"“风险不等于事故”的理解（理解）。","解题思路":"物联网风险无法归零，目标是识别并降到可控——因怕风险不用技术是因噎废食。","逐项剖析":"A 有风险必出事：夸大，排除；B 风险降到可控即可、不必绝对零风险：正确；C 无风险才正常：不现实，排除；D 出事故才需防范：被动，排除。","易错警示":"“零风险”是伪命题——安全目标是可控不是归零。","方法点拨":"风险观三句：风险常在、可降可控、不必因噎废食。"}},{"sec":"基础巩固","type":"单选","num":4,"text":"厂商设立“漏洞赏金”，奖励白帽黑客发现并报告漏洞，这种做法体现的安全理念是：","opts":[{"label":"A","text":"黑客都是坏人，要统统抓起来"},{"label":"B","text":"让发现问题的人成为守护者，以守代攻"},{"label":"C","text":"漏洞越多越好"},{"label":"D","text":"发现漏洞不告诉厂商自己留着用"}],"subs":[],"ans":"答案B　让发现问题的人成为守护者，以守代攻","al":{"考查点":"漏洞赏金理念的理解（理解）。","解题思路":"让发现问题的人成为守护者（白帽）——在漏洞被滥用前报告修复，以守代攻。","逐项剖析":"A 黑客都坏全抓：偏见，排除；B 让发现问题者成为守护者、以守代攻：正确；C 漏洞越多越好：荒谬；D 发现不报自己留着用：黑产思维，排除。","易错警示":"“白帽vs黑帽”：先报先修=守护，私留利用=作恶。","方法点拨":"见“漏洞赏金/白帽”即“主动发现、以守代攻”。"}},{"sec":"基础巩固","type":"判断","num":1,"text":"智能设备只要连了网，就存在被攻击的可能，完全无风险是不现实的。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"联网风险的必然性判断（理解）。","解题思路":"联网即暴露于风险中，安全目标是把风险降到可控而非绝对零风险，判断正确。","易错警示":"“联网=零风险”是错误期待。","方法点拨":"判断题见“联网即存在风险/零风险不现实”即√。"}},{"sec":"基础巩固","type":"判断","num":2,"text":"使用出厂默认密码没有关系，反正没人知道我的设备。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"默认密码风险判断（理解）。","解题思路":"默认密码是公开常识，扫描工具可批量尝试——被扫到只是时间问题，必须第一时间改，判断错误。","易错警示":"“没人知道我的设备”是侥幸心理——扫描是全网的。","方法点拨":"默认密码三字诀“公开、批量、必改”。"}},{"sec":"基础巩固","type":"判断","num":3,"text":"数据“明文传输”比“加密传输”更安全。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"明文vs加密的判断（理解）。","解题思路":"明文=把信写明信片上谁都能看；加密=内容上锁只有收发双方能解——明文不安全，判断错误。","易错警示":"“明文更安全”方向完全说反。","方法点拨":"明信片vs信封比喻记：明文=明信片，加密=信封。"}},{"sec":"能力提升","type":"提升","num":1,"text":"请用“设备—风险点—后果”三步法，分析“家里的Wi-Fi路由器使用默认密码”这一情况。","opts":[],"subs":[],"ans":"设备：无线路由器；风险点：默认管理员密码公开可查＋可能未开启WPA加密；后果：邻居或陌生人蹭网拖慢网速、可能被篡改设置或植入恶意软件，进而危及连在网上的所有智能设备。","al":{"考查点":"三步法分析路由器（应用）。","解题思路":"三步定位：设备=无线路由器；风险点=默认管理员密码公开+可能未开WPA加密；后果=蹭网拖慢、篡改设置、植入恶意软件，危及所有联网设备。","易错警示":"“后果”要写到殃及联网设备，不只停留在蹭网。","方法点拨":"三步法格式“设备：××；风险点：××；后果：××”，一行一要素。"}},{"sec":"能力提升","type":"提升","num":2,"text":"请完成《风险地图》：列出智能门锁、智能摄像头、智能音箱三个设备的“至少一个风险点”与“可能后果”。","opts":[],"subs":[],"ans":"智能门锁——风险点：固件未更新存在漏洞、密码被撞库；后果：外人可开锁进门。智能摄像头——风险点：弱密码＋明文传输；后果：画面被偷看、隐私泄露。智能音箱——风险点：过度收集语音、账号被盗；后果：对话被窃听、被远程操控下单购物。地图式呈现合理即可。","al":{"考查点":"风险地图三设备填写（应用）。","解题思路":"逐设备写“风险点+后果”：门锁（固件漏洞/密码撞库→外人开门）；摄像头（弱密码+明文→画面被偷看）；音箱（过度收集/账号被盗→窃听/被远程下单）。","易错警示":"每设备“风险点与后果”要配对成组，漏后果即不完整。","方法点拨":"风险地图=一设备一行、点果成对，覆盖越全越好。"}},{"sec":"能力提升","type":"提升","num":3,"text":"为什么说“长期不更新固件”是一个高风险点？请从“漏洞被发现到被利用”的角度解释。","opts":[],"subs":[],"ans":"新漏洞被公开后，攻击者会迅速编写利用工具（POC），而固件不更新等于“漏洞一直开着门”。补丁发布后仍不更新的设备，就暴露在已知漏洞之下——攻击门槛低、命中率高，所以“及时更新固件”是四类防范策略之一。","al":{"考查点":"固件不更新的风险机理（分析）。","解题思路":"机理链：漏洞公开→攻击者迅速写利用工具（POC）→不更新=漏洞一直开着门→暴露在已知漏洞下、攻击门槛低命中率高。","易错警示":"要从“公开到利用”的时间线讲，不能只说“不安全”。","方法点拨":"“更新为何重要”论证=公开漏洞+POC武器化+不补=裸奔。"}},{"sec":"能力提升","type":"提升","num":4,"text":"请比较“事中防护”与“事后补救”的思路：摄像头被入侵后再拔电源，与提前设置强密码＋开启加密传输，哪种更值得提倡？为什么？","opts":[],"subs":[],"ans":"更值得提倡的是提前设强密码＋加密传输的“事前防护”。事后补救（被入侵再拔电源）时隐私已被偷看、损失已发生，且难以追查；事前把风险点一一封堵，成本低、效果好——安全的重心应放在“防患于未然”，而不是“亡羊补牢”。","al":{"考查点":"事前防护vs事后补救（评价）。","解题思路":"更提倡事前（强密码+加密）：事后（被入侵再拔电源）隐私已泄露、损失已发生且难追查；事前封堵风险点成本低效果好——安全重心在防患未然。","易错警示":"对比要“分优劣讲理由”，并落到“重心前移”。","方法点拨":"防护观题：事前封堵≫事后补救，防患未然优于亡羊补牢。"}},{"sec":"拓展挑战","type":"拓展","num":1,"text":"新闻说某地发生“智能门锁集体被远程开锁”事件，调查发现这些锁都用了同一款旧固件且密码是默认的。请你以安全记者的身份写一篇简短报道：①说明事件发生的三个原因；②指出哪些用户风险最大；③给用户写三条“现在就该做”的补救建议。","opts":[],"subs":[],"ans":"①原因：旧固件存在已知漏洞未打补丁；出厂默认密码未修改；厂商未强制用户更新或推送不及时。②风险最大：长期不更新固件、密码仍为默认/弱密码、开启远程开锁功能的用户。③建议：立即登录管理后台修改强密码并开启双因素验证；马上检查并更新固件到最新版；暂时关闭用不到的远程开锁功能，出门反锁机械锁芯。","al":{"考查点":"安全事件报道写作（应用·创造）。","解题思路":"三问分答：①原因三条（旧固件已知漏洞未补、默认密码未改、厂商推送不及时）；②风险最大人群（不更新+默认弱密码+开远程开锁者）；③现在就该做三条（改强密码+双因素、立即更新固件、关远程开锁+机械反锁）。","易错警示":"报道要“原因→高危人群→补救”三段逻辑完整。","方法点拨":"安全报道题“三原因三建议”对仗作答，建议要“现在就能做”。"}},{"sec":"拓展挑战","type":"拓展","num":2,"text":"哥哥说：“黑客攻击都是冲着银行、大公司去的，我们家几个小设备谁稀罕？”请用两个反例（或两个理由）反驳他，并说明“小设备”为什么也会成为目标。","opts":[],"subs":[],"ans":"反例一：智能摄像头被入侵的新闻屡见不鲜——黑客拿它偷看隐私甚至“直播”牟利，设备再小也有画面价值；反例二：智能门锁、路由器被攻破后可被当作“肉鸡”发起攻击，或被用来摸清家里作息再上门行窃。小设备目标小但“遍地都是”，攻击者用自动化工具批量扫描弱口令，成本极低——不是“稀罕你”，是“顺手牵羊”。","al":{"考查点":"反驳“小设备没人稀罕”（评价）。","解题思路":"两反例：①摄像头被入侵偷看隐私甚至直播牟利——设备小但有画面价值；②门锁/路由器被攻破当“肉鸡”或摸清作息上门行窃；收尾=攻击者用自动化工具批量扫弱口令、成本极低，是顺手牵羊不是稀罕你。","易错警示":"反驳要“具体反例+机制解释”（批量扫描低成本）。","方法点拨":"反例论证要带“攻击者动机/成本”分析，才有说服力。"}},{"sec":"变式闯关","type":"变式","num":1,"text":"换一个场景：不是家里，而是学校的“智能电表”被曝可被远程篡改读数。请用“三步法”分析它，并说出这对学校电费管理和学生有什么影响。","opts":[],"subs":[],"ans":"设备：智能电表及其抄表系统；风险点：通信未加密、管理后台弱口令、固件有漏洞；后果：读数被篡改导致电费错乱、影响学校预算，更危险的是电表作为电网末梢可能被利用影响供电稳定。影响：学校要多花冤枉钱或账目不清，学生要节约用电的宣传也失去数据依据。","al":{"考查点":"三步法迁移智能电表（应用）。","解题思路":"三步定位：设备=智能电表及抄表系统；风险点=通信未加密/后台弱口令/固件漏洞；后果=读数篡改电费错乱、电表被利用影响供电稳定；影响分写学校（冤枉钱账目乱）与学生（节能宣传失去数据依据）。","易错警示":"“影响”要分主体写（学校/学生），别只停在设备层。","方法点拨":"迁移题“三步定位+双主体影响”，把框架套到新设备上。"}},{"sec":"间隔复习","type":"间隔","num":1,"text":"智能门锁“被远程开锁”事件里，黑客最可能是先攻破了哪一环节？请结合“数字身份”知识说明为什么“密码强度与默认密码”是风险的第一道闸门。","opts":[],"subs":[],"ans":"（第26课《数字世界有身份》）　最可能是先攻破“身份验证”环节——利用默认/弱密码或撞库拿到管理员身份，再像主人一样开锁。因为系统“先认人后办事”，身份凭证一旦失守，后续权限全部敞开；所以强密码＋及时改默认密码，是把守住风险的第一道闸门。","al":{"考查点":"家庭物联风险地图设计（创造）；跨课迁移——三步法转居家行动。","解题思路":"三段作答：①模板栏目——设备/风险点/可能后果/风险等级（高/中/低）/处置建议；②三案例评级+处置——摄像头默认密码→高（偷看隐私→改强密+更新）；门锁固件一年没更新→中（已知漏洞→检查升级）；Wi-Fi密码是手机号→高（易社工猜中→长随机密码+隐藏SSID）；③体检标语一句。","易错警示":"评级要“有依据”，处置要“可操作”，标语要点“回家动手”。","方法点拨":"风险地图模板=五栏（设备/点/果/级/策），示范填写“评+处”成对。"}},{"sec":"思维进阶","type":"挑战","num":1,"text":"学校要开展“物联安全体检月”，请你为班级设计一张《家庭物联风险地图》模板并示范填写：①模板应包含哪些栏目（至少设备、风险点、可能后果、风险等级四栏）；②给“摄像头用默认密码”“门锁固件一年没更新”“Wi-Fi密码是手机号”三个案例各标一个风险等级并写一句处置建议；③写一句“体检标语”提醒同学回家动手查一查。","opts":[],"subs":[],"open":true,"ans":"参考设计要点：①模板栏目：设备名称|所在位置|风险点|可能后果|风险等级（高/中/低）|处置建议——四栏起步、六栏更全；②案例标注：摄像头用默认密码——高风险（可被偷窥与劫持）→立即改强密码+双因素；门锁固件一年没更新——中风险（已知漏洞未修补）→本周内检查更新并开启自动更新；Wi-Fi密码是手机号——高风险（易被猜中撞库）→换长随机密码并定期更换；③体检标语示例：\"回家五分钟，给家里的智能设备做个体检——数一数、查一查、改一改\"。","al":{"考查点":"开放创造：风险地图与分级处置（创造+评价）","解题思路":"模板栏目至少含题干要求的四栏；三个案例的等级与后果匹配且处置可执行；标语有具体动作","易错警示":"三个案例全标\"高风险\"（未做区分度判断）；处置建议写成\"注意安全\"","方法点拨":"风险题公式：模板有列、等级有依据、处置有动作。"}}]},{"t":"第 28 课 · 配套练习","n":"安全防范讲策略","isExam":false,"qs":[{"sec":"回忆热身","type":"回忆","num":1,"text":"安全防范“策略四件套”：强密码、____认证、及时更新固件、最小权限。","opts":[],"subs":[],"ans":"双因素","al":{"考查点":"策略四件套的识记（记忆）。","解题思路":"四件套=强密码、双因素认证、及时更新固件、最小权限；题干已给强密码/及时更新固件/最小权限，缺“双因素”。","易错警示":"勿填“加密/备份”——四件套是教材固定清单。","方法点拨":"“强双更小”四字记：强密码、双因素、更新固件、最小权限。"}},{"sec":"回忆热身","type":"回忆","num":2,"text":"“最小权限”原则的意思是：只给设备或账号____用的权限，够用就好。","opts":[],"subs":[],"ans":"够（必要）","al":{"考查点":"最小权限含义的识记（记忆）。","解题思路":"最小权限=只给设备或账号够（必要）用的权限，够用就好——权限越小被滥用面越小。","易错警示":"勿填“最多/所有”——原则是“够用就好”不是“越多越好”。","方法点拨":"“最小权限=够用就好”，凡权限题先问“他真的需要吗”。"}},{"sec":"基础巩固","type":"单选","num":1,"text":"下列密码中，强度最高、最不容易被破解的是：","opts":[{"label":"A","text":"123456"},{"label":"B","text":"手机号后八位"},{"label":"C","text":"JiHe_shouDou2026!"},{"label":"D","text":"wangmima"}],"subs":[],"ans":"答案C　JiHe_shouDou2026!","al":{"考查点":"强密码辨识（应用）。","解题思路":"强密码要“长+杂+不重用”：字母大小写+数字+符号组合且较长；纯数字/生日/拼音都易被字典或社工破解。","逐项剖析":"A 123456：最弱数字，排除；B 手机号后八位：社工可猜，排除；C JiHe_shouDou2026!：大小写+数字+符号+长度足，正确；D wangmima：拼音字典词，排除。","易错警示":"“好记”不等于“好密码”——强度看长度、复杂度与不可猜性。","方法点拨":"强密码四要素自查：长（≥10）+杂（三类字符）+不重用+不个人信息。"}},{"sec":"基础巩固","type":"单选","num":2,"text":"登录账户时除了输密码，还要输入手机收到的验证码，这种做法叫：","opts":[{"label":"A","text":"双因素认证"},{"label":"B","text":"一键登录"},{"label":"C","text":"人脸识别"},{"label":"D","text":"自动登录"}],"subs":[],"ans":"答案A　双因素认证","al":{"考查点":"双因素认证的辨识（应用）。","解题思路":"“密码+手机验证码”=两种不同因素（你知道的+你拥有的），即使密码泄露没手机也进不来——双保险。","逐项剖析":"A 双因素认证：正确；B 一键登录：免密快捷方式，排除；C 人脸识别：生物因素单因素，排除；D 自动登录：省事但有风险，排除。","易错警示":"“密码+验证码”是经典双因素，别与生物识别单因素混淆。","方法点拨":"双因素=两类不同凭证叠加，“知+拥+生”任取两类即双因素。"}},{"sec":"基础巩固","type":"单选","num":3,"text":"“最小权限”原则在智能家居中的正确应用是：","opts":[{"label":"A","text":"给每个家人管理员权限"},{"label":"B","text":"只给需要的成员必要权限，用不到的权限不开"},{"label":"C","text":"所有设备都开放远程控制"},{"label":"D","text":"把权限全部关掉不用智能功能"}],"subs":[],"ans":"答案B　只给需要的成员必要权限，用不到的权限不开","al":{"考查点":"最小权限的智能家居应用（应用）。","解题思路":"最小权限=够用就好：访客只给临时开门、孩子只给看监控不给改设置——权限越小滥用面越小；全给或全关都不合理。","逐项剖析":"A 给每个家人管理员权限：过度授权，排除；B 只给必要权限、用不到的不开：正确；C 全部开放远程控制：高危，排除；D 权限全关不用智能：因噎废食，排除。","易错警示":"“全给”与“全关”两个极端都不对——分级授权才是答案。","方法点拨":"权限分配按角色分级：家人/访客/孩子各配最小必要权限。"}},{"sec":"基础巩固","type":"单选","num":4,"text":"关于“无密码登录（Passkey）”，下列说法正确的是：","opts":[{"label":"A","text":"用设备本身的生物特征（指纹/面容）代替传统密码，兼具便利与双因素强度"},{"label":"B","text":"完全不验证身份就能登录"},{"label":"C","text":"只能用在一个网站上"},{"label":"D","text":"比密码更容易被盗"}],"subs":[],"ans":"答案A　用设备本身的生物特征（指纹/面容）代替传统密码，兼具便利与双因素强度","al":{"考查点":"无密码登录Passkey的理解（理解）。","解题思路":"Passkey用设备内置生物特征（指纹/面容）+密钥技术验证，免记密码且天然具双因素级强度，是认证新方向。","逐项剖析":"A 用设备生物特征代替密码、兼具便利与双因素强度：正确；B 完全不验证就能登录：误解，排除；C 只能用一个网站：可跨站使用，排除；D 比密码更易被盗：恰恰更难，排除。","易错警示":"“无密码”≠“无验证”——验证从“记密码”换成“生物特征+设备密钥”。","方法点拨":"Passkey理解：无密码≠无安全，验证方式升级了。"}},{"sec":"基础巩固","type":"判断","num":1,"text":"只要密码够复杂，就不需要开双因素认证。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"复杂密码与双因素关系的判断（理解）。","解题思路":"复杂密码也可能在钓鱼/泄露中失守；双因素多一道独立验证（手机），失守概率大幅降——组合才成网，判断错误。","易错警示":"“密码够强就不用双因素”是错误减法。","方法点拨":"纵深防御思想：一道防线再强也不如两道不同防线。"}},{"sec":"基础巩固","type":"判断","num":2,"text":"固件更新提示“修复安全漏洞”，应该尽快安装。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"固件更新的判断（理解）。","解题思路":"漏洞补丁要及时打：拖延越久暴露时间越长、被利用风险越高，判断正确。","易错警示":"“提示更新”是安全信号，点忽略=主动裸奔。","方法点拨":"更新提示=补漏洞窗口，越早打越好。"}},{"sec":"基础巩固","type":"判断","num":3,"text":"给孩子用的智能手表，权限开得越多越方便，不存在风险。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"儿童手表权限的判断（评价）。","解题思路":"权限越多被滥用/泄露面越大；儿童设备更应守“最小权限+家长监管”，定位等敏感功能严格管控，判断错误。","易错警示":"“给孩子设备权限越多越方便”忽视儿童数据敏感性。","方法点拨":"儿童设备权限=最小权限+家长监管双原则。"}},{"sec":"能力提升","type":"提升","num":1,"text":"请完成“红圈配盾牌”配对：把左边的四个风险点与右边的四个防范策略一一对应，并各写一句“为什么能防住”。","opts":[],"subs":[],"ans":"弱密码→强密码：长且杂的密码让字典与撞库难命中；单因素验证→双因素认证：即使密码泄露还需手机第二把钥匙；长期不更新→及时更新固件：补丁堵住已知漏洞的门；过度授权→最小权限：权限小、被滥用面小，出事损失也小。","al":{"考查点":"风险点与策略配对（应用）。","解题思路":"四组一一对应并写“为什么能防”：弱密码→强密码（长杂难命中字典撞库）；单因素→双因素（需手机第二把钥匙）；长期不更新→及时更新（补丁堵已知漏洞门）；过度授权→最小权限（权限小滥用面小损失小）。","易错警示":"配对要“策略对应风险点”，每对给一句防住原理。","方法点拨":"“红圈配盾牌”即风险点配策略：见弱配强、见单配双、见旧配新、见多配少。"}},{"sec":"能力提升","type":"提升","num":2,"text":"请写出“给智能门锁做安全体检”的四个检查项（对应四类策略），每项写出“合格”的标准。","opts":[],"subs":[],"ans":"①密码：是否已改掉默认密码且为强密码（长＋杂＋不重用）——合格：非默认、长度≥10含大小写数字符号；②双因素：是否开启App确认/手机验证——合格：远程开锁需App二次确认；③固件：是否为最新版——合格：系统无更新提示；④权限：家人账号是否只给必要权限——合格：无多余管理员、访客临时密码已清理。","al":{"考查点":"门锁安全体检四检查项（应用）。","解题思路":"四类策略各一检查项+合格标准：密码（非默认且强，≥10含大小写数字符号）；双因素（远程开锁需App二次确认）；固件（无更新提示=最新）；权限（无多余管理员、访客临时密码已清理）。","易错警示":"“合格标准”要写可判断的具体描述，不能写“要好”。","方法点拨":"体检表“检查项+合格线”成对，每条能打钩才算数。"}},{"sec":"能力提升","type":"提升","num":3,"text":"爷爷总忘记密码，想把所有账号都设成“abcd1234”方便记忆。请用“四类策略”中的两条，帮他设计一个“好记又安全”的密码方案。","opts":[],"subs":[],"ans":"策略上要“强密码＋不重用”：给爷爷设计“一句话密码”——比如取他爱看的电视栏目名首字母＋纪念数字（如“Xsdt2023!”），只有他自己能联想；再开启“密码找回＋手机验证”兜底（双因素），忘了能自己找回；不同重要账号在末尾加不同后缀，避免一个泄露全部沦陷。","al":{"考查点":"帮老人设计好记安全密码（应用·创造）。","解题思路":"两条策略落地：强密码+不重用——设计“一句话密码”（电视栏目名首字母+纪念数字），只有本人能联想；开“找回+手机验证”兜底（双因素）；重要账号末位加不同后缀防连锁泄露。","易错警示":"方案要兼顾“好记”（老人可联想）与“安全”（强+不重用）。","方法点拨":"适老密码方案=联想短语+找回兜底+后缀区分三件套。"}},{"sec":"能力提升","type":"提升","num":4,"text":"妈妈要在手机上装一款“智能家居控制App”。请按“最小权限”原则，写出安装时应检查和设置的三项内容。","opts":[],"subs":[],"ans":"①权限申请：只允许它使用“位置/通知”等必要权限，拒绝通讯录、相册等无关权限；②账号授权：只给家人必要角色，不开“游客可控制”；③设备管理：用不到的远程功能关闭、检查已绑定设备清单，发现陌生设备立即移除。","al":{"考查点":"App安装的最小权限检查（应用）。","解题思路":"三项检查：①权限申请——只允许位置/通知等必要权限，拒绝通讯录相册；②账号授权——家人必要角色、不开游客可控制；③设备管理——关用不到的远程功能、检查绑定设备、移除陌生设备。","易错警示":"“检查三项”要具体到权限/角色/设备三个层面。","方法点拨":"装App最小权限三步：拒无关权限、控账号角色、清陌生设备。"}},{"sec":"拓展挑战","type":"拓展","num":1,"text":"小区通知：部分住户的智能门锁需要“立即升级固件修复漏洞”，但升级期间App会暂时无法远程开门。王阿姨嫌麻烦不想升。请从“风险点与后果”角度写一段话劝她升级，并告诉她升级期间忘带钥匙该怎么进门。","opts":[],"subs":[],"ans":"劝她：这次漏洞正是不法分子远程开锁的“后门”，不升级等于家里大门一直虚掩；升级只需几分钟，换来的是把后门焊死。期间忘带钥匙：可用实体钥匙或临时密码开门，也可请物业/家人通过已升级的备用通道协助——短暂不便远好过长期风险。升级后再开启远程功能更安心。","al":{"考查点":"劝老人升级固件（应用·表达）。","解题思路":"劝说=讲清后果（漏洞=远程开锁后门，不升=大门虚掩）+降负担（只需几分钟焊死后门）；期间进门办法=实体钥匙/临时密码/物业家人备用通道，事后重开远程更安心。","易错警示":"“劝”要有风险冲击与降焦虑，并给过渡方案。","方法点拨":"劝升级“风险后果+操作轻量+替代方案”三段话术。"}},{"sec":"拓展挑战","type":"拓展","num":2,"text":"爸爸想给家里智能设备都开“一键远程控制”（人在外面也能操作空调、门锁）。请你从“最小权限＋双因素”角度帮他做一次“该不该开、怎么开才安全”的决策分析。","opts":[],"subs":[],"ans":"决策：能开，但要分级开——空调等低风险设备可开远程，门锁等高风险设备远程功能要谨慎，建议仅开“限时临时密码＋App二次确认”（双因素），不开“无条件远程开锁”。同时设最小权限：只有爸爸与妈妈有远程权，孩子只保留本地控制。出门在外多一道确认，比“想开就开”安全得多。","al":{"考查点":"远程控制开与不开的决策（评价）。","解题思路":"决策=能开但分级：空调等低风险可开远程；门锁等高风险仅开“限时临时密码+App二次确认”（双因素），不开无条件远程开锁；权限=只爸妈有远程权、孩子仅本地——多一道确认安全得多。","易错警示":"决策要“分级+双因素+最小权限”三原则齐说，不一刀切。","方法点拨":"远程控制决策：按风险分级、高险加双因素、权限给必要人。"}},{"sec":"变式闯关","type":"变式","num":1,"text":"换一个场景：班级公用电脑设了开机密码，但同学把密码写在键盘底下。请用“密码管理”的策略指出问题，并给出既方便又不泄密的替代办法。","opts":[],"subs":[],"ans":"问题：把密码写在键盘下等于“明码标价”，任何路过的人都能拿到钥匙，密码形同虚设。替代：使用“班委托管＋定期轮换”——密码只由电教委员掌握并每月更换一次；或改用“指纹/刷卡”等不靠人记的方式；确有需要时用班级加密记事本登记并妥善保管，而不是贴在设备旁。","al":{"考查点":"密码管理迁移班级电脑（应用）。","解题思路":"问题=密码写键盘下等于明码标价，任何路过者都拿到钥匙、密码形同虚设；替代=班委托管+定期轮换（电教委员掌握、每月换）、改指纹/刷卡免记忆、加密记事本登记妥善保管而非贴设备旁。","易错警示":"“替代办法”要同时解决方便与保密，不能换汤不换药。","方法点拨":"密码管理三原则：不落地（不写在设备旁）、要轮换、能托管。"}},{"sec":"间隔复习","type":"间隔","num":1,"text":"第27课我们画了“风险地图”（设备—风险点—后果），本课学了“策略四件套”。请把两者连起来：为“路由器使用默认密码”这个风险点，选择对应的防范策略并说明如何落地。","opts":[],"subs":[],"ans":"（第27课《安全事件与风险》）　对应策略是“强密码”：登录路由器管理后台，把默认密码（admin）改为长度≥10、含大小写与数字符号的强密码，并关闭WPS等易攻破功能；同时开启WPA2/WPA3加密（防蹭网）。这样“默认密码”这个风险点就被封堵，风险地图上的红圈变成绿点。","al":{"考查点":"策略四件套的适老化宣传设计（创造）；跨课迁移——把安全策略写成老人能照做的口诀。","解题思路":"三段作答：①四类各一条“爷爷奶奶能照做”的口诀条目（新设备到家先改成自家暗号、能开短信验证都开上、看到更新别点忽略像打疫苗、用不上功能就关掉）；②案例示范（摄像头默认密码→登录App改强密→开登录提醒→查固件→关画面分享）；③社区广播安全口诀一句。","易错警示":"条目要“像口诀可照做”，案例步骤要完整到App操作层。","方法点拨":"适老安全清单=口诀化条目+完整案例+朗朗上口的总口诀。"}},{"sec":"思维进阶","type":"挑战","num":1,"text":"社区要给老年住户发《家庭物联安全清单》宣传页，请你设计这份清单并示范填写：①按“强密码、双因素、更新固件、最小权限”四类，各设计1条“爷爷奶奶能照做”的具体条目（要写得像口诀）；②为一个案例示范填写（如“家里摄像头还在用默认密码”该怎么改）；③给社区写一句“安全口诀”用于宣传广播。","opts":[],"subs":[],"open":true,"ans":"参考设计要点：①四类口诀条目：强密码——\"密码像牙刷，又长又独不外借\"；双因素——\"密码之外加短信，小偷拿号也白搭\"；更新固件——\"补丁常更新，漏洞不上门\"；最小权限——\"摄像头不给通讯录，App要啥先想想\"；②示范填写：摄像头还在用默认密码——照口诀改法：设置页里把admin/123456改成\"长短句+符号\"专属密码，再开启手机验证码登录，全程五分钟；③安全口诀示例：\"一改二加三更新，四看权限再放心——改密码、加验证、升固件、看权限\"。","al":{"考查点":"开放创造：安全策略的适老化转化（创造+评价）","解题思路":"四类各出\"能照做\"的口诀化条目；示范与条目方法一致且步骤具体；口诀四动作与四策略对应","易错警示":"条目写成原理讲解（老人无法照做）；示范与口诀两张皮","方法点拨":"清单题公式：策略口诀化、示范照着做、口诀可广播。"}}]},{"t":"第 29 课 · 配套练习","n":"自主可控意义大","isExam":false,"qs":[{"sec":"回忆热身","type":"回忆","num":1,"text":"物联网“三类核心技术”是芯片、____和通信协议。","opts":[],"subs":[],"ans":"操作系统","al":{"考查点":"三类核心技术的识记（记忆）。","解题思路":"三类=芯片、操作系统、通信协议；题干已给“芯片”与“通信协议”，缺“操作系统”。","易错警示":"勿填“电池/传感器”——三类核心技术是教材固定清单。","方法点拨":"“芯—系—协”三字记，对应大脑/指挥/通用语言。"}},{"sec":"回忆热身","type":"回忆","num":2,"text":"自主可控被称为物联网的“安全____”——底层稳，门才守得住。","opts":[],"subs":[],"ans":"底牌","al":{"考查点":"自主可控比喻的识记（记忆）。","解题思路":"自主可控=物联网的“安全底牌”——底层稳，门才守得住。","易错警示":"勿填“钥匙/保险箱”——教材比喻是“安全底牌”。","方法点拨":"“底牌”喻记忆：核心底层自己握着，关键时刻不被卡。"}},{"sec":"基础巩固","type":"单选","num":1,"text":"把物联网比作一栋楼，那么芯片相当于：","opts":[{"label":"A","text":"楼的装修风格"},{"label":"B","text":"楼里的大脑——负责计算与控制的“核心器件”"},{"label":"C","text":"楼的招牌"},{"label":"D","text":"楼外的花草"}],"subs":[],"ans":"答案B　楼里的大脑——负责计算与控制的“核心器件”","al":{"考查点":"芯片角色类比（理解）。","解题思路":"芯片=设备“大脑”，负责运算与控制——对应楼的承重核心而非装修外观。","逐项剖析":"A 装修风格：表面部分，排除；B 楼里的大脑、负责计算与控制的核心器件：正确；C 楼的招牌：标识非核心，排除；D 楼外花草：无关。","易错警示":"芯片=大脑是恒定比喻，别被“装修/招牌”表面项迷惑。","方法点拨":"三类技术固定比喻：芯片=大脑、系统=指挥、协议=通用语言。"}},{"sec":"基础巩固","type":"单选","num":2,"text":"“核心技术自主可控”的含义是：","opts":[{"label":"A","text":"所有技术都自己从头发明，不跟国外合作"},{"label":"B","text":"关键底层技术自己掌握，同时坚持开放合作"},{"label":"C","text":"只买国外的技术最安全"},{"label":"D","text":"把别人的技术抄一遍"}],"subs":[],"ans":"答案B　关键底层技术自己掌握，同时坚持开放合作","al":{"考查点":"自主可控内涵（理解）。","解题思路":"自主可控=关键底层自己掌握（有安全底牌），同时坚持开放合作——不是闭门造车也不是全盘照抄。","逐项剖析":"A 全部自己发明不合作：闭关，排除；B 关键底层自己掌握同时开放合作：正确；C 只买国外最安全：放弃自主，排除；D 抄一遍别人的：侵权且无根基，排除。","易错警示":"“自主≠封闭、开放≠依附”是本题思想核心。","方法点拨":"自主可控双轨理解：关键在手+开放合作，二者并行。"}},{"sec":"基础巩固","type":"单选","num":3,"text":"通信协议为什么也属于需要“自主可控”的核心技术？","opts":[{"label":"A","text":"因为协议决定设备之间“说什么话”，标准若被垄断，规则制定权就不在自己手里"},{"label":"B","text":"因为协议会生锈"},{"label":"C","text":"因为协议只有中国才有"},{"label":"D","text":"因为协议与安全无关"}],"subs":[],"ans":"答案A　因为协议决定设备之间“说什么话”，标准若被垄断，规则制定权就不在自己手里","al":{"考查点":"协议为何要自主可控（理解·分析）。","解题思路":"协议=设备间“通用语言”，标准若被垄断，规则制定权不在自己手里——话语权与安全性都受制于人。","逐项剖析":"A 标准垄断则规则制定权旁落：正确；B 协议会生锈：无稽，排除；C 只有中国有协议：错误；D 与安全无关：恰恰最相关，排除。","易错警示":"协议的价值在“标准话语权”——谁定标准谁有底牌。","方法点拨":"协议自主=标准自己定，话语权=安全底牌。"}},{"sec":"基础巩固","type":"单选","num":4,"text":"我国物联网连接规模长期位居世界前列、建成全球最大窄带物联网网络。这说明：","opts":[{"label":"A","text":"我国在物联网规模与部分关键技术上已具备较强实力"},{"label":"B","text":"我国不需要再发展其他技术"},{"label":"C","text":"规模大等于所有技术都世界第一"},{"label":"D","text":"物联网与国家安全无关"}],"subs":[],"ans":"答案A　我国在物联网规模与部分关键技术上已具备较强实力","al":{"考查点":"规模领先的准确解读（理解·评价）。","解题思路":"规模世界前列+全球最大窄带物联网=整体实力与自主建设成效强；但规模≠样样第一，仍需攻坚核心器件与标准。","逐项剖析":"A 已具较强实力：准确，正确；B 不需再发展其他技术：绝对化，排除；C 规模大=所有技术第一：夸大，排除；D 与国家安全无关：错误。","易错警示":"“规模大”不等于“全面第一”——成就要肯定、短板要清醒。","方法点拨":"读成就题“肯定成绩+保持清醒”两面：规模领跑不等于样样领跑。"}},{"sec":"基础巩固","type":"判断","num":1,"text":"自主可控就是“什么都要自己造，拒绝一切国际合作”。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"自主可控与封闭的判断（理解）。","解题思路":"自主可控≠闭关自守：关键底层自己掌握，同时坚持开放合作、深度参与全球协作，判断错误。","易错警示":"“什么都要自己造”是把自主扭曲成封闭。","方法点拨":"判断题见“自主=拒绝合作/闭关”即错。"}},{"sec":"基础巩固","type":"判断","num":2,"text":"操作系统指挥着设备“先干什么后干什么”，属于需要自主可控的核心技术。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"操作系统核心地位的判断（理解）。","解题思路":"操作系统=设备“指挥中枢”，决定先干什么后干什么，关系到数据安全与功能可控，属三类核心技术，判断正确。","易错警示":"别低估操作系统——它管“听谁的指挥”。","方法点拨":"三类核心技术“芯系协”齐列，系统是居中指挥。"}},{"sec":"基础巩固","type":"判断","num":3,"text":"物联网的“安全底牌”只对国家和企业重要，和普通学生没关系。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"安全底牌与个人的关系（理解）。","解题思路":"底层受制于人时，个人设备漏洞后门同样无法掌控；理解自主可控助树立科技安全观、关系未来从业者，判断错误。","易错警示":"“与普通学生无关”是错误割裂——安全观人人相关。","方法点拨":"“国家安全→产业→个人设备→个人认知”传导链，层层相关。"}},{"sec":"能力提升","type":"提升","num":1,"text":"请用“盖房子”作类比，分别说明芯片、操作系统、通信协议在物联网中的角色，并解释“地基自己打”为什么重要。","opts":[],"subs":[],"ans":"芯片像盖楼的“核心承重构件”（大脑），操作系统像“施工指挥图”（决定先干什么后干什么），通信协议像“工地上统一的图纸语言”（大家按同一标准协作）。地基自己打＝关键底层自己掌握：地基（核心技术）在别人手里，别人一“撤图纸”“改标准”，整栋楼就受影响甚至失控——自主可控就是让地基握在自己手里，楼才盖得稳、门才守得住。","al":{"考查点":"盖楼类比三类技术（应用）。","解题思路":"类比成句：芯片=核心承重构件（大脑）、操作系统=施工指挥图（安排先后）、通信协议=工地统一图纸语言（协作标准）；“地基自己打”重要=核心技术在别人手里，一撤图纸改标准整楼受影响失控。","易错警示":"“地基论”要讲清受制于人的后果，类比与道理要挂接。","方法点拨":"盖楼类比题“一物一喻+地基论”，喻后必落“为什么自己打”。"}},{"sec":"能力提升","type":"提升","num":2,"text":"请从“国家安全”与“个人生活”两个层面，各写一条“为什么通信协议要自主可控”的理由。","opts":[],"subs":[],"ans":"国家安全：通信协议是信息传输的“通用语言”，标准与专利若被他人垄断，关键时刻可能被“断供”“留后门”，威胁基础设施安全；个人生活：协议标准不由自己掌握，个人设备的数据流向、更新节奏都可能受制于外部厂商，隐私与使用安全失去主动权。","al":{"考查点":"双层面论协议自主（分析）。","解题思路":"国家层面：协议=传输通用语言，标准专利被垄断则可能被断供留后门、威胁基础设施；个人层面：标准不受己掌，个人设备数据流向与更新节奏受制外部厂商，隐私与安全失去主动权。","易错警示":"两层面要各写一条独立理由，别重复同一论点。","方法点拨":"“国家+个人”双层面题：国家谈基础设施安全、个人谈数据主动权。"}},{"sec":"能力提升","type":"提升","num":3,"text":"班里同学说：“国产操作系统、国产芯片不好用，还是外国的香。”请写一段理性回应：既承认差距，又说明为什么要坚持自主可控。","opts":[],"subs":[],"ans":"差距要正视：起步晚，部分生态、性能与成熟产品确有差距，好用与否可以讨论。但坚持自主可控另有深意：它是“安全底牌”——关键时刻不被卡脖子、不留后门隐患；国产系统芯片在政务、电力、国防等领域已规模应用并不断迭代。理性态度是：好用就大胆用，不好用就一起提意见帮它变好——支持自主不是口号，是用出来的。","al":{"考查点":"理性回应国产vs外国（评价）。","解题思路":"三段理性回应：正视差距（起步晚、生态性能有差距、好用与否可讨论）；讲清深意（安全底牌、防卡脖子防后门、政务电力国防已规模应用）；态度落地（好用大胆用、不好用提意见帮它变好——支持自主是用出来的）。","易错警示":"“理性”=不吹不黑：承认差距同时讲清为何必须坚持。","方法点拨":"回应偏见题“承认差距→讲清战略价值→给行动态度”，理性有温度。"}},{"sec":"能力提升","type":"提升","num":4,"text":"我国建成了全球最大的NB-IoT网络。请写出“网络规模大”与“产业发展”之间的两层关系，并说明它对普通家庭的好处。","opts":[],"subs":[],"ans":"关系：规模大→设备接入多→模组成本下降→更多行业用得起，形成正循环；规模大还倒逼核心器件与标准的国产化需求，带动自主能力提升。对家庭好处：智能水气表、路灯等基础设施更普及、抄表与缴费更方便，物联网服务更便宜可靠。","al":{"考查点":"规模与产业的正循环（分析）。","解题思路":"两层关系：规模大→设备接入多→模组成本降→更多行业用得起→规模更大（正循环）；规模大倒逼核心器件与标准国产化需求、带动自主能力；家庭好处=智能水气表路灯普及、抄表缴费便利、服务便宜可靠。","易错警示":"“两层关系”要写成本循环+能力倒逼两条，别只写一条。","方法点拨":"规模题正循环链+能力反哺双写，落到家庭受益。"}},{"sec":"拓展挑战","type":"拓展","num":1,"text":"爷爷问：“咱们家的智能设备用的芯片、系统都是哪国的？这有关系吗？”请你用通俗的话给爷爷讲清楚：①设备里的“芯片、操作系统、通信协议”分别管什么；②为什么这些底层技术最好自己能掌握；③我国在这方面的两个成就（结合教材/新闻）。","opts":[],"subs":[],"ans":"①芯片是设备“大脑”管计算，操作系统像“指挥官”安排干活顺序，通信协议是设备间“通用语言”。②就像家里钥匙最好自己配、别全押在别人手里——底层技术若受制于人，别人断供或留后门，咱的设备就可能“卡壳”或泄密，所以关键底层要自己能掌握（自主可控）。③成就示例：我国建成全球最大NB-IoT网络、物联网连接规模世界前列；5G标准我国深度参与，国产操作系统与芯片在政务、电力等领域规模应用。","al":{"考查点":"给爷爷讲核心技术（应用·表达）。","解题思路":"三问作答：①三技术管什么——芯片大脑管计算、操作系统指挥官排干活顺序、协议设备间通用语言；②为什么自己能掌握——像钥匙自己配，受制于人则断供留后门会卡壳泄密；③两大成就——全球最大NB-IoT网络、连接规模世界前列，5G深度参与国际标准，国产系统芯片政务电力规模应用。","易错警示":"讲给爷爷要“钥匙比喻+成就具体”，不堆术语。","方法点拨":"科普答题“比喻讲清+举例证实”，成就选教材/新闻实例。"}},{"sec":"拓展挑战","type":"拓展","num":2,"text":"“自主可控”与“开放合作”看似矛盾，实则并行。请结合我国5G、物联网的实际（如参与国际标准制定、与各国共建网络），论述为什么两者能兼得，并说出“自主”是“开放”的前提。","opts":[],"subs":[],"ans":"论述：自主是开放的底气——只有关键核心技术自己掌握，才能在国际谈判与协作中平起平坐、不被“卡脖子”，开放才不会变成“依附”；开放是自主的加速器——闭门造车学不快，参与国际标准、引进消化吸收再创新，能让自主能力成长更快。我国5G既自主创新又参与全球标准制定、与多国共建，就是“自主＋开放”的例证。结论：先自主、后开放，自主越强，开放越有底气。","al":{"考查点":"自主与开放的辩证论述（评价·分析）。","解题思路":"论述两层：自主是开放底气（核心在手才能平起平坐不被卡，开放不变成依附）；开放是自主加速器（参与标准、引进消化再创新成长更快）；例证=我国5G自主创新又参与全球标准、多国共建；结论=先自主后开放，自主越强开放越有底气。","易错警示":"辩证题要“互证关系”而非各说一句；例证落到5G/物联网。","方法点拨":"“看似矛盾实则并行”论述=互为前提双向论证+实例收束。"}},{"sec":"变式闯关","type":"变式","num":1,"text":"换一个场景：不聊国家，聊班级——班级公众号的账号密码掌握在毕业的学长手里，新一届宣传部要用却总受制于人。请用“自主可控”的思想，给宣传部提两条“把主动权拿回来”的建议。","opts":[],"subs":[],"ans":"建议：①重要账号（公众号、网盘、邮箱）的管理权限要“可控可交接”——离任时必办权限移交，账号归属学校/班级而非个人；②平台与密码等“底层资源”要有备份与说明文档（像“技术底稿”），新团队能快速接手，不依赖某个学长。把“底层资产”握在自己组织手里，宣传才不会断档。","al":{"考查点":"自主可控思想迁移班级账号（应用）。","解题思路":"两条建议：①重要账号权限可控可交接——离任必办移交、账号归属班级非个人；②底层资源有备份与说明文档（技术底稿）、新团队快速接手不依赖个人——把底层资产握在组织手里。","易错警示":"迁移要落到“主动权回归组织”，两个建议都要有操作点。","方法点拨":"“自主可控”降维应用：账号/文档=组织的底层资产，握在自己手里。"}},{"sec":"间隔复习","type":"间隔","num":1,"text":"“自主可控”与“风险防范”有什么关系？请结合第27课“风险点—后果”的思路，说明底层技术受制于人会带来哪一类风险。","opts":[],"subs":[],"ans":"（第27课《安全事件与风险》）　底层技术受制于人是“系统性风险点”：设备用的芯片/系统/协议若在他人掌控下，可能出现“断供停服、强制后门、标准封锁”等后果，且这类风险个人难以通过改密码防范。自主可控就是把这类系统性风险从根上消除——它是比“四类策略”更深一层的基础防线。","al":{"考查点":"自主可控科普策展设计（创造）；跨课迁移——知识通俗化与公共表达。","解题思路":"三段作答：①三块展板各写“标题+一句通俗解释”（芯片=大脑自己造、操作系统=指挥官自己当、通信协议=通用语言自己定）；②互动问答带示例答案（协议标准被垄断→可改规则留后门→设备集体失语或泄密）；③主题标语一句。","易错警示":"展板标题要“对仗有力”，问答要自带示例答案。","方法点拨":"策展题“三展板+一问一答+标语”，比喻贴切即成功。"}},{"sec":"思维进阶","type":"挑战","num":1,"text":"学校科技节要办“自主可控”主题展，请你设计一个“大国地基——核心技术知多少”展区：①用“盖楼”比喻设计三块展板，分别介绍芯片、操作系统、通信协议（每块写标题＋一句通俗解释）；②设计一个现场互动小问答（如“如果协议标准不在自己手里，会怎样？”给出示例答案）；③写一句“自主可控”主题标语。","opts":[],"subs":[],"open":true,"ans":"参考设计要点：①三块展板（盖楼比喻）：芯片——\"大楼的地基\"：所有计算都从这块小小的地基上起高楼，地基不牢，楼盖得再高也晃；操作系统——\"大楼的骨架与电梯\"：所有软件都住在里面、靠它上下通行，骨架在别人手里，房间随时可能被停水停电；通信协议——\"大楼对外的道路与门牌\"：路修在谁手里、门牌号怎么编，决定你的楼别人进不进得来、信息走不走得通；②互动问答示例：问\"如果协议标准不在自己手里，会怎样？\"示例答案：别人一改规则我们的设备就可能\"说不了话\"，轻则升级受制、重则被断网——所以标准也要自主可控；③标语示例：\"地基自己打，骨架自己立，道路自己修——大国重器，自主可控\"。","al":{"考查点":"开放创造：自主可控的比喻表达（创造+评价）","解题思路":"三块展板比喻与\"地基/骨架/道路\"职能同构；问答答案点出\"受制于人\"的后果链；标语呼应三比喻","易错警示":"比喻与职能错位（把芯片比成大楼管理员）；问答只问不答","方法点拨":"主题展题公式：比喻同构、问答成对、标语收束。"}}]},{"t":"第 30 课 · 配套练习","n":"系统安全需升级","isExam":false,"qs":[{"sec":"回忆热身","type":"回忆","num":1,"text":"物联网安全的动态三步是：发现漏洞、____、再评估。","opts":[],"subs":[],"ans":"打补丁（修复）","al":{"考查点":"动态三步的识记（记忆）。","解题思路":"动态三步=发现漏洞、打补丁（修复）、再评估；题干已给第一步与第三步，缺“打补丁（修复）”。","易错警示":"勿填“发布公告/升级系统”——中间步标准表述是打补丁。","方法点拨":"“发—打—评”循环三字：发现漏洞→打补丁→再评估，转圈不停。"}},{"sec":"回忆热身","type":"回忆","num":2,"text":"信息安全领域有句话叫：没有绝对安全，只有____。","opts":[],"subs":[],"ans":"持续守护","al":{"考查点":"安全名言的识记（记忆）。","解题思路":"信息安全名言=没有绝对安全，只有持续守护。","易错警示":"勿填“更强密码/更高墙”——教材结论是“持续守护”。","方法点拨":"单元总结句“没有绝对安全，只有持续守护”，背诵即得分。"}},{"sec":"基础巩固","type":"单选","num":1,"text":"“发现漏洞—打补丁—再评估”不断循环，说明物联网安全是一个：","opts":[{"label":"A","text":"一次性的安装动作"},{"label":"B","text":"动态的持续过程"},{"label":"C","text":"只发生在出厂前的事"},{"label":"D","text":"与用户无关的事"}],"subs":[],"ans":"答案B　动态的持续过程","al":{"考查点":"安全是动态过程的判断（理解）。","解题思路":"“发现—打补丁—再评估”不断循环=动态的持续过程；一劳永逸不现实。","逐项剖析":"A 一次性的安装动作：错，排除；B 动态的持续过程：正确；C 只发生在出厂前：错；D 与用户无关：用户也要更新，排除。","易错警示":"“循环/动态/持续”是本题关键词，与“一次性”对立。","方法点拨":"凡说安全是“动态过程/持续循环”即正确，说“一次性”即错。"}},{"sec":"基础巩固","type":"单选","num":2,"text":"某智能音箱厂商发布补丁修复“语音指令越权”漏洞，补丁发布后最不该做的是：","opts":[{"label":"A","text":"及时更新到最新固件"},{"label":"B","text":"更新后复查音箱功能是否正常"},{"label":"C","text":"认为打完补丁就永远安全、不再关注"},{"label":"D","text":"留意是否有新版本推出"}],"subs":[],"ans":"答案C　认为打完补丁就永远安全、不再关注","al":{"考查点":"补丁后最不该做的判断（理解·评价）。","解题思路":"打完补丁只是完成一轮循环，新漏洞还会出现——“认为永远安全不再关注”最不该。","逐项剖析":"A 及时更新到最新固件：该做，排除；B 更新后复查功能：该做，排除；C 认为打完就永远安全不再关注：不该做，正确；D 留意新版本：该做，排除。","易错警示":"题干问“最不该做”，C选项的“一劳永逸”心态即答案。","方法点拨":"“最不该”题找“松懈心态”：永远安全/不用再管即错。"}},{"sec":"基础巩固","type":"单选","num":3,"text":"安全运营中心（SOC）7×24小时监测海量设备日志、异常即派发补丁，它相当于城市的：","opts":[{"label":"A","text":"安全大脑"},{"label":"B","text":"电影院"},{"label":"C","text":"公园管理处"},{"label":"D","text":"加油站"}],"subs":[],"ans":"答案A　安全大脑","al":{"考查点":"SOC的类比理解（理解）。","解题思路":"SOC集中监测分析响应海量日志、异常即派补丁——像城市的“安全大脑”。","逐项剖析":"A 安全大脑：集中监测协调处置，正确；B 电影院/公园/加油站：均不负责安全监测，排除。","易错警示":"“大脑”对应的是“集中分析决策”而非单一执行。","方法点拨":"SOC=安全大脑：7×24看着、想着、指挥着。"}},{"sec":"基础巩固","type":"单选","num":4,"text":"“补丁发布会”模拟活动中，三类角色的分工正确的是：","opts":[{"label":"A","text":"发现者通报漏洞、工程师发布补丁、巡检员复查验证"},{"label":"B","text":"巡检员发现漏洞、发现者发补丁、工程师复查"},{"label":"C","text":"谁都可以随便发补丁"},{"label":"D","text":"发现问题不通报自己偷偷修"}],"subs":[],"ans":"答案A　发现者通报漏洞、工程师发布补丁、巡检员复查验证","al":{"考查点":"补丁发布会角色分工（应用）。","解题思路":"动态三步对应三角色：发现者通报漏洞→工程师发布补丁→巡检员复查验证，各司其职成闭环。","逐项剖析":"A 发现者通报、工程师发补丁、巡检员复查：正确；B 角色错位（巡检发现、发现者发补丁）：排除；C 谁都能发补丁：混乱，排除；D 发现问题不通报私修：反协作，排除。","易错警示":"三角色与三步要一一对应：发现→通报者、修复→工程师、复查→巡检员。","方法点拨":"“发布会”角色题按三步配人，一步一人不错位。"}},{"sec":"基础巩固","type":"判断","num":1,"text":"设备出厂的系统是最安全的，永远不需要升级。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"出厂系统安全性的判断（理解）。","解题思路":"出厂系统未见得覆盖未来发现的漏洞，只有持续更新补丁安全才跟得上威胁，判断错误。","易错警示":"“出厂=最安全=永不升级”是最大误区。","方法点拨":"判断题见“出厂最安全/永不需要升级”即错。"}},{"sec":"基础巩固","type":"判断","num":2,"text":"打了补丁就一劳永逸，以后不用再管安全了。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"一劳永逸心态的判断（理解）。","解题思路":"安全是动态过程：新漏洞不断出现，需“发现—修复—再评估”循环——打了就一劳永逸的说法错误。","易错警示":"“持续守护”是本单元核心结论，一劳永逸必错。","方法点拨":"见“一劳永逸/以后不用管”即判错。"}},{"sec":"基础巩固","type":"判断","num":3,"text":"系统更新前应备份重要设置，更新后应复查功能是否正常。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"负责任升级动作的判断（理解）。","解题思路":"更新有风险（可能引入兼容问题），先备份、后更新、再复查是负责任升级标准动作，判断正确。","易错警示":"“裸升级”是机房大忌——备份+复查是规范。","方法点拨":"升级三步曲“备—更—查”，判断题直接√。"}},{"sec":"能力提升","type":"提升","num":1,"text":"请写出“打补丁”流程的完整动态三步，并为每一步配上执行者（发现者/工程师/巡检员）与其做的事。","opts":[],"subs":[],"ans":"发现漏洞：安全研究者或巡检发现漏洞并通报（发现者）；打补丁：工程师分析漏洞、编写并发布修复补丁（工程师）；再评估：巡检员更新系统、复查功能并确认无新问题（巡检员）。之后继续监测新漏洞，循环往复。","al":{"考查点":"动态三步与角色配对（应用）。","解题思路":"三步配角色：发现漏洞（发现者——研究者/巡检发现通报）→打补丁（工程师——分析编写发布）→再评估（巡检员——更新复查确认无新问题）；之后循环监测。","易错警示":"角色与动作要对应描述“做了什么”，三步循环要写“往复”。","方法点拨":"三步题“一步一角色一动作”，末句补“循环往复”。"}},{"sec":"能力提升","type":"提升","num":2,"text":"请说明“为什么更新前要备份设置、更新后要复查功能”，各举一个可能出问题的例子。","opts":[],"subs":[],"ans":"更新前备份：补丁可能重置或改变设置——如门锁补丁后临时密码策略变化，没备份可能恢复不了原有配置；更新后复查：补丁可能与旧硬件/功能冲突——如摄像头更新后画面黑屏或App连不上，需复查并及时回滚或上报厂商。","al":{"考查点":"备份与复查的必要性论证（分析）。","解题思路":"备份理由+例子：补丁可能重置改变设置（门锁补丁后临时密码策略变化，没备份难恢复）；复查理由+例子：补丁与旧硬件/功能冲突（摄像头更新后黑屏或App连不上），需回滚或上报。","易错警示":"“理由+例子”成对写，两个动作都要给实例。","方法点拨":"“为什么备份/复查”题：备份防配置丢失、复查防兼容冲突，各带一例。"}},{"sec":"能力提升","type":"提升","num":3,"text":"请用“给手机系统升级”为例，写一份“负责任升级三步走”清单（升级前、升级中、升级后各一条），说明每一步为什么重要。","opts":[],"subs":[],"ans":"升级前：连接Wi-Fi并备份重要数据——防止下载中断或升级失败丢失照片资料；升级中：保持电量充足、不关机不强制重启——避免升级中断导致系统损坏；升级后：检查常用App能否正常打开、设置是否保留——确认补丁没有引入新问题，有问题及时反馈。三步入位，升级才安全稳妥。","al":{"考查点":"负责任升级三步走清单（应用·创造）。","解题思路":"三时段各一条+重要性：升级前连Wi-Fi备份（防中断丢失）；升级中保电不关机（防系统损坏）；升级后查App与设置（确认无新问题、及时反馈）。","易错警示":"每步要“动作+为什么”配对，清单才有指导价值。","方法点拨":"升级清单“前备中稳后查”三拍，每拍给理由。"}},{"sec":"能力提升","type":"提升","num":4,"text":"“没有绝对安全，只有持续守护”是本单元的总结句。请结合身份、风险、策略、自主可控四个关键词，用一段话（不少于60字）说说你对这句话的理解。","opts":[],"subs":[],"ans":"示例：物联网里没有一劳永逸的“绝对安全”：身份可能被冒用（第26课）、漏洞总会被发现（第27课），所以要靠强密码、双因素等策略（第28课）和自主可控的底层技术（第29课）不断加固；但攻击手段也在翻新，只有像“补丁发布会”那样发现一个补一个、补完再评估（第30课），持续守护，才能让安全跟上威胁变化。","al":{"考查点":"单元核心句的整合论述（评价·创造）。","解题思路":"用四关键词串段：身份可能被冒用（26课）→漏洞总被发现（27课）→靠强密码双因素策略（28课）与自主可控底层（29课）加固→但攻击翻新，只有“发现一个补一个、补完再评估”（30课）持续守护，安全才能跟上威胁变化。","易错警示":"四关键词必须全部嵌入且成因果链，字数达标（≥60字）。","方法点拨":"“总结句理解”题=用单元课序串成因果链，一词不落。"}},{"sec":"拓展挑战","type":"拓展","num":1,"text":"某品牌儿童手表被曝“可被远程定位窃听”，厂商随后发布固件补丁并召回部分批次。请分析：①这一事件暴露了哪些风险点？②厂商的“发布补丁＋召回”属于动态安全三步中的哪些动作？③作为家长，给孩子选智能手表时应坚持哪三条原则？","opts":[],"subs":[],"ans":"①风险点：通信未加密（明文传输）、权限过大（可被远程开启麦克风定位）、固件漏洞长期未更新。②“发布补丁”对应“打补丁”，“召回换新/强制升级”属于“再评估＋修复确认”——都是动态安全三步的动作。③原则：选正规品牌且支持定期更新固件的；默认关闭非必要功能（定位分享、远程监听）按最小权限使用；关注厂商安全公告、及时升级并设置儿童模式与家长管控。","al":{"考查点":"儿童手表事件综合分析（分析·评价）。","解题思路":"三问分答：①风险点——通信未加密明文传输、权限过大（可远程开麦定位）、固件漏洞长期未更；②厂商动作对应——“发布补丁”=打补丁，“召回换新/强制升级”=再评估+修复确认；③家长三原则——正规品牌且支持定期更新、默认关非必要功能按最小权限、关注安全公告及时升级+儿童模式家长管控。","易错警示":"“厂商动作归位动态三步”是题眼，别漏“召回=再评估”。","方法点拨":"事件分析题“风险点→动作归位三步→家长三原则”，层层落地。"}},{"sec":"拓展挑战","type":"拓展","num":2,"text":"学校机房管理员说：“补丁不能随便打——上次一打补丁，投影软件全连不上了。”请分析：①这说明安全升级要注意什么？②在“安全”与“稳定”之间，机房应该建立怎样的升级机制？请写出两条具体做法。","opts":[],"subs":[],"ans":"①说明升级可能引入兼容性问题——安全与稳定需要平衡，不能“闭眼打补丁”。②机制建议：a.先在备用机/非教学时段“灰度测试”——确认补丁不影响教学软件后再全机房推送；b.建立“升级窗口＋回滚预案”——寒暑假或周末集中升级，升级前镜像备份系统，出问题可快速回滚。让补丁在可控节奏里落地，而不是仓促上马。","al":{"考查点":"安全与稳定的平衡机制（分析·评价）。","解题思路":"①教训=升级可能引入兼容问题，不能“闭眼打补丁”；②机制两条——先在备用机/非教学时段灰度测试再全机房推；建“升级窗口+回滚预案”，寒暑假周末集中升、升级前镜像备份、出问题快速回滚。","易错警示":"机制要体现“灰度+回滚”工程思想，不是“想打就打”。","方法点拨":"机房升级机制=灰度测试+窗口回滚，让补丁可控落地。"}},{"sec":"变式闯关","type":"变式","num":1,"text":"换一个场景：手机App提示“发现新版本，修复了3个安全漏洞”。请用动态三步分析：如果你一直点“以后再说”，一个月后可能发生什么？正确的处理流程又是什么？","opts":[],"subs":[],"ans":"一直忽略的后果：3个漏洞持续暴露，若被攻击者利用（如恶意网页、钓鱼短信结合漏洞），可能导致隐私泄露、账号被盗——漏洞不等人。正确处理：备份重要数据→连接Wi-Fi下载更新→安装后重启并检查常用功能→留意官方公告，养成“提示即更新”的习惯。","al":{"考查点":"动态三步迁移App更新（应用）。","解题思路":"一直忽略后果：3漏洞持续暴露，被恶意网页/钓鱼短信结合利用→隐私泄露账号被盗——漏洞不等人；正确处理：备份→连Wi-Fi下载→安装重启查功能→关注官方公告，养成“提示即更新”。","易错警示":"后果要写“漏洞+攻击方式+结果”因果链，处理流程要完整。","方法点拨":"App更新题“拖一个月的后果→四步正确流程”，正面反面都要答。"}},{"sec":"间隔复习","type":"间隔","num":1,"text":"“及时更新固件”是第28课的四类策略之一。本课学了“动态三步”后，请说明：更新固件在动态安全过程中处于哪一步？为什么“更新完还要再评估”？","opts":[],"subs":[],"ans":"（第28课《安全防范讲策略》）　更新固件就是“打补丁”这一步。更新完还要“再评估”：补丁可能引入兼容问题或未完全覆盖漏洞，需复查功能是否正常、确认漏洞是否真正修复，并持续监测是否出现新漏洞——评估完又回到“发现”环节，循环才完整。","al":{"考查点":"补丁发布会活动策划（创造）；跨课迁移——动态三步转校园实操。","解题思路":"三段作答：①通报漏洞+后果（班牌默认密码admin/123456可登入篡改课表、通知被替换影响考试）；②补丁方案（强制首登改强密绑电教委员手机双因素、后台统一推固件封弱口令、班主任群发限时改密通知）；③巡检复查单三项（抽查5块是否改默认密码、验证电教委员可登学生无法越权、确认一周无改表事件并记录）+大会口号。","易错警示":"补丁方案要“改什么/怎么改/如何通知”三要素，复查单要可执行。","方法点拨":"发布会策划=漏洞后果→补丁三件套→复查三单+口号，闭环完整。"}},{"sec":"思维进阶","type":"挑战","num":1,"text":"学校要举办“补丁发布会”综合活动，请你担任“安全总工程师”，策划一场“智慧班牌漏洞修复发布会”：①写出你要通报的班牌漏洞（如“默认密码可被猜中”）及其后果；②写出你的“补丁方案”（改什么、怎么改、如何通知各班）；③设计发布会后“巡检员”复查的检查单（至少三项），并写一句大会口号。","opts":[],"subs":[],"open":true,"ans":"参考设计要点：①漏洞通报示例：\"班牌默认账号admin/123456且未强制修改——任何人可登录篡改展示内容、查看系统信息\"——后果：内容被恶意篡改误导师生、班牌沦为内网跳板；②补丁方案：改什么——升级系统强制首次登录改密+密码复杂度校验；怎么改——推送统一升级包，默认账号全部锁定重建；如何通知——向各班发布《升级指引》图文，信息课老师协助检查完成率；③复查检查单（至少三项）：抽测各班班牌默认密码是否已全部失效；核对固件版本是否为最新；检查登录日志有无异常IP尝试；口号示例：\"今天补一个洞，明天少一次险——安全是升级出来的\"。","al":{"考查点":"开放创造：漏洞响应的全流程演练（创造+应用）","解题思路":"漏洞具体且后果真实；补丁方案\"改什么/怎么改/如何通知\"三答齐；检查单可逐项勾选","易错警示":"漏洞写成\"可能被黑\"没有具体入口；检查单与漏洞不对应","方法点拨":"发布会题公式：漏洞+后果、补丁三答、检查单闭环。"}}]},{"t":"达标检测","n":"第六单元 物联网安全 · 达标检测卷","isExam":true,"qs":[{"sec":"选择题","type":"选择题","num":1,"text":"数字身份的“三件套”是指：","opts":[{"label":"A","text":"账号、密码、设备ID"},{"label":"B","text":"姓名、照片、手机号"},{"label":"C","text":"指纹、人脸、声纹"},{"label":"D","text":"网名、头像、签名"}],"subs":[],"ans":"答案A　账号、密码、设备ID","al":{"考查点":"数字身份三件套识记（记忆）。","解题思路":"三件套=账号（我是谁）、密码（私密暗号）、设备ID（哪台机器），选项A齐全。","易错警示":"“姓名照片手机号/指纹人脸声纹/网名头像签名”均为干扰组合。","方法点拨":"“账号密码+设备ID”认人又认机，缺一即非三件套。"}},{"sec":"选择题","type":"选择题","num":2,"text":"用“设备—风险点—后果”三步法分析“Wi-Fi用默认密码”，正确的后果是：","opts":[{"label":"A","text":"网速变快"},{"label":"B","text":"可能被蹭网、被篡改设置，危及联网设备"},{"label":"C","text":"路由器自动升级"},{"label":"D","text":"没有任何影响"}],"subs":[],"ans":"答案B　可能被蹭网、被篡改设置，危及联网设备","al":{"考查点":"三步法推后果（应用）。","解题思路":"三步定位：设备=路由器；风险点=默认密码；后果=可能被蹭网、被篡改设置、危及联网设备。","易错警示":"“网速变快/自动升级/无影响”是反常识干扰项。","方法点拨":"默认密码后果三连：蹭网→改设置→殃及设备。"}},{"sec":"选择题","type":"选择题","num":3,"text":"“密码＋手机验证码”登录属于：","opts":[{"label":"A","text":"单因素认证"},{"label":"B","text":"双因素认证"},{"label":"C","text":"免密登录"},{"label":"D","text":"生物识别"}],"subs":[],"ans":"答案B　双因素认证","al":{"考查点":"双因素认证辨识（应用）。","解题思路":"密码（你知道的）+手机验证码（你拥有的）=两种独立因素=双因素认证，拿到密码也进不来。","易错警示":"“免密/生物识别/单因素”均为错误归类。","方法点拨":"“知+拥”两类凭证叠加即双因素。"}},{"sec":"选择题","type":"选择题","num":4,"text":"“最小权限”原则在家庭摄像头上的正确做法是：","opts":[{"label":"A","text":"所有人都有管理员权限"},{"label":"B","text":"只给家庭成员必要权限，关闭用不到的远程分享"},{"label":"C","text":"完全公开直播"},{"label":"D","text":"不给任何人权限"}],"subs":[],"ans":"答案B　只给家庭成员必要权限，关闭用不到的远程分享","al":{"考查点":"最小权限的家庭应用（应用）。","解题思路":"最小权限=够用就好：家人看画面、家长管设置、访客临时授权到期收回——权限越小泄露面越小。","易错警示":"“全员管理员/公开直播/零权限”两极端都不对。","方法点拨":"权限分级“按需分配”，不是越多越好也不是全关。"}},{"sec":"选择题","type":"选择题","num":5,"text":"“自主可控”强调要掌握的三类核心技术是：","opts":[{"label":"A","text":"芯片、操作系统、通信协议"},{"label":"B","text":"电池、屏幕、外壳"},{"label":"C","text":"Wi-Fi、蓝牙、5G"},{"label":"D","text":"账号、密码、验证码"}],"subs":[],"ans":"答案A　芯片、操作系统、通信协议","al":{"考查点":"三类核心技术识记（记忆）。","解题思路":"三类=芯片（大脑）、操作系统（指挥）、通信协议（通用语言）。","易错警示":"“电池屏幕外壳/Wi-Fi蓝牙5G/账号密码验证码”均为干扰。","方法点拨":"“芯系协”三字诀。"}},{"sec":"选择题","type":"选择题","num":6,"text":"安全运营中心（SOC）7×24小时监测日志、异常即派发补丁，最符合本单元哪一结论？","opts":[{"label":"A","text":"没有绝对安全，只有持续守护"},{"label":"B","text":"安全是一次性设置"},{"label":"C","text":"漏洞永远不会出现"},{"label":"D","text":"打补丁会降低网速"}],"subs":[],"ans":"答案A　没有绝对安全，只有持续守护","al":{"考查点":"SOC与单元结论对应（理解）。","解题思路":"SOC把“发现—修复—复查”做成7×24常态化运转=“持续守护”的工程化体现。","易错警示":"“一次性设置/漏洞永不出现”与单元核心结论相反。","方法点拨":"见“7×24监测/常态化”即持续守护。"}},{"sec":"判断题","type":"判断题","num":1,"text":"数字身份只包括账号和密码，与设备本身无关。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"数字身份组成判断（理解）。","解题思路":"设备ID也是数字身份一部分——系统要“认人”也要“认机”，说法错误。","易错警示":"“只含账号密码”漏了认机维度。","方法点拨":"数字身份=人机双轨信任链。"}},{"sec":"判断题","type":"判断题","num":2,"text":"设备的出厂默认密码很安全，无需修改。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"默认密码安全性判断（理解）。","解题思路":"默认密码公开可查（admin/123456），必须首用即改强密码，判断错误。","易错警示":"“出厂密码安全”是安全意识大坑。","方法点拨":"默认密码=公开钥匙，必改。"}},{"sec":"判断题","type":"判断题","num":3,"text":"风险降到可控范围即可，不必追求绝对零风险。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"风险可控观判断（理解）。","解题思路":"联网即存在风险，目标是识别并降到可控而非绝对零风险，判断正确。","易错警示":"“绝对零风险”是伪命题。","方法点拨":"风险观：可降可控不归零，不因噎废食。"}},{"sec":"判断题","type":"判断题","num":4,"text":"打了安全补丁就可以一劳永逸，以后不用再管。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"一劳永逸心态判断（理解）。","解题思路":"新漏洞不断出现，安全是“发现—修复—再评估”动态循环，判断错误。","易错警示":"“打补丁=永远安全”是单元要破除的误区。","方法点拨":"见“一劳永逸/不用再管”即错。"}},{"sec":"判断题","type":"判断题","num":5,"text":"自主可控就是拒绝一切国际合作，闭门造车。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"自主可控内涵判断（理解）。","解题思路":"自主可控≠闭关自守：关键底层自己掌握+坚持开放合作，判断错误。","易错警示":"“拒绝一切合作”是把自主扭曲为封闭。","方法点拨":"自主=关键在手，开放=合作共赢，二者并行。"}},{"sec":"填空题","type":"填空题","num":1,"text":"数字身份的三件套是账号、____、设备ID。","opts":[],"subs":[],"ans":"密码","al":{"考查点":"身份三件套识记（记忆）。","解题思路":"三件套=账号、密码、设备ID，缺“密码”。","易错警示":"勿混“验证码”。","方法点拨":"“账号密码+设备ID”。"}},{"sec":"填空题","type":"填空题","num":2,"text":"风险三步法是：设备→____→后果。","opts":[],"subs":[],"ans":"风险点","al":{"考查点":"三步法识记（记忆）。","解题思路":"风险三步=设备→风险点→后果，缺“风险点”。","易错警示":"勿填“攻击者”。","方法点拨":"“设点果”三字诀。"}},{"sec":"填空题","type":"填空题","num":3,"text":"安全防范策略四件套：强密码、____认证、及时更新固件、最小权限。","opts":[],"subs":[],"ans":"双因素","al":{"考查点":"策略四件套识记（记忆）。","解题思路":"四件套=强密码、双因素、及时更新固件、最小权限，缺“双因素”。","易错警示":"勿填“加密”。","方法点拨":"“强双更小”四字诀。"}},{"sec":"填空题","type":"填空题","num":4,"text":"物联网三类核心技术：芯片、操作系统、____。","opts":[],"subs":[],"ans":"通信协议","al":{"考查点":"三类核心技术识记（记忆）。","解题思路":"三类=芯片、操作系统、通信协议，缺“通信协议”。","易错警示":"勿填“传感器”。","方法点拨":"“芯系协”三字诀。"}},{"sec":"填空题","type":"填空题","num":5,"text":"安全动态三步：发现漏洞→____→再评估。","opts":[],"subs":[],"ans":"打补丁","al":{"考查点":"动态三步识记（记忆）。","解题思路":"三步=发现漏洞→打补丁→再评估，缺“打补丁”。","易错警示":"勿填“发公告”。","方法点拨":"“发打评”循环。"}},{"sec":"填空题","type":"填空题","num":6,"text":"“没有绝对安全，只有____”是本单元的核心结论。","opts":[],"subs":[],"ans":"持续守护","al":{"考查点":"单元核心结论识记（记忆）。","解题思路":"“没有绝对安全，只有持续守护”是本单元核心结论。","易错警示":"勿填“更强密码”。","方法点拨":"总结句背诵即得分。"}},{"sec":"简答题","type":"简答题","num":1,"text":"请为家里的智能摄像头完成一次“安全体检”，写出四个检查项（对应四类防范策略）与各自的合格标准。","opts":[],"subs":[],"ans":"①密码：已改默认密码且为强密码（长度≥10、含大小写数字符号）——合格：非默认、够强；②双因素：开启登录提醒/手机验证——合格：异地或新设备登录需验证；③固件：为最新版本——合格：无更新提示；④权限：分享与远程功能按需开启——合格：仅家庭成员可见、无多余授权。（每项2分）","al":{"考查点":"四类策略体检表（应用）。","解题思路":"四检查项各配合格线：密码（已改默认且强，≥10含大小写数字符号）、双因素（异地或新设备登录需验证）、固件（无更新提示）、权限（仅家庭成员可见、无多余授权）——每项2分。","易错警示":"“合格标准”要可判断，不能写“要好/要强”。","方法点拨":"体检表“检查项+合格线”四行，行行能打钩。"}},{"sec":"简答题","type":"简答题","num":2,"text":"请用“发现—修复—再评估”动态三步，完整描述一次“智能门锁漏洞”从被发现到被妥善处理的经过，并说明为什么安全不能一劳永逸。","opts":[],"subs":[],"ans":"发现：安全研究者发现门锁固件存在“可被远程开锁”的漏洞并通报厂商；修复：厂商开发补丁并推送到用户App，提醒尽快更新，同时关闭受影响功能；再评估：用户更新后验证开锁功能正常、漏洞已封堵，厂商持续监测是否出现新问题——完成后又回到“发现”环节继续循环。（9分）不能一劳永逸：攻击手段不断翻新、新漏洞不断出现，任何修复都只覆盖“已知问题”，必须持续监测与更新才能让安全跟上威胁。（3分）","al":{"考查点":"动态三步完整描述+为何不能一劳永逸（应用·评价）。","解题思路":"三步叙事：发现（研究者发现门锁漏洞通报厂商）→修复（开发补丁推送提醒关闭受影响功能）→再评估（用户更新验证封堵、厂商持续监测）——完成后回“发现”继续循环（9分）；不能一劳永逸=攻击翻新漏洞不断，任何修复只覆盖已知问题，须持续更新（3分）。","易错警示":"叙事要完整含角色动作；末问要点“只覆盖已知问题”。","方法点拨":"“动态三步叙事+持续论”按分值分配：经过9分讲全、结论3分点透。"}},{"sec":"案例分析题","type":"案例分析题","num":1,"text":"某小区多户智能门锁遭“远程开锁”入侵，调查发现：涉事门锁全部使用出厂默认密码、固件停留在两年前、且用户开了“无条件远程开锁”功能。请回答：①用“三步法”指出至少三个风险点及其后果；②针对每个风险点写出一条对应的防范策略；③物业拟发《致业主安全信》，请代拟三条核心建议。","opts":[],"subs":[],"ans":"①风险点与后果：默认密码未改——攻击者用公开默认口令批量登录，远程开锁进门；固件两年未更新——已知漏洞未打补丁，被利用入侵；无条件远程开锁——功能权限过大，攻破账号即等于拿到钥匙。（6分）②对应策略：立即改强密码并开启双因素；检查并更新固件到最新版；远程开锁改为“App确认＋限时临时密码”，平时关闭无条件远程。（6分）③信函建议：请业主今晚完成“改密＋升级＋关闭无条件远程”三件事；发现异常开门记录立即联系物业并改密；后续关注厂商安全公告，养成定期更新习惯。（3分）","al":{"考查点":"门锁入侵事件三步法+策略对应（分析·应用）。","解题思路":"三问分答：①风险点及后果三条（默认密码→批量登录远程开锁；固件两年未更→已知漏洞被利用；无条件远程开锁→权限过大攻破即拿钥匙，6分）；②对应策略（改强密+双因素、更新固件、远程改App确认+限时临时密码并平时关闭，6分）；③物业信三条（今晚改密升级关远程、异常记录即联系改密、关注公告定期更新，3分）。","易错警示":"“风险点→策略”要一一对应成对，信函要“限时行动”。","方法点拨":"事件处置题“三点三策+致业主三条”，对仗结构最易拿全分。"}},{"sec":"综合实践题","type":"综合实践题","num":1,"text":"学校为“智慧教室”部署了一批物联网设备（智能灯、智能插座、电子班牌、温湿度传感器），信息老师请你制定一份《智慧教室物联安全管理制度》。请完成：①用表格列出四类设备各自的“重点风险点＋对应防范策略”（每设备至少一项）；②设计“管理员—教师—学生”三级权限（各能做什么、用什么方式验证）；③写出“漏洞响应流程”（发现—上报—修复—复查各由谁负责、时限建议）；④为制度写一句宣传标语。","opts":[],"subs":[],"ans":"①示例表格：智能灯/插座——风险点：弱密码、固件不更新→策略：改强密码＋开启自动更新；电子班牌——风险点：默认口令可越权改课表→策略：强制改密＋管理员白名单＋日志记录；温湿度传感器——风险点：数据明文传输→策略：开启加密上报、网关设访问控制。（8分）②三级权限：管理员（信息老师）——可配置、可看日志，用账号＋双因素验证；教师——可控制本教室设备，用账号＋密码；学生——仅可浏览班牌课表，无需登录，无控制权。（最小权限，6分）③响应流程：发现（师生报告或系统告警，24小时内上报管理员）→上报（管理员登记漏洞信息）→修复（信息中心1周内发布补丁/配置修复）→复查（修复后3天内验证并通报全班）。（6分）④标语示例：“智慧教室聪明，安全制度护航——权限最小化，守护常态化。”（5分）","al":{"考查点":"智慧教室物联安全制度全案（创造）。","解题思路":"四问分答：①四设备“风险点+策略”表（灯/插座弱密固件→改强密自动更新；班牌默认口令越权→强制改密+白名单+日志；温湿度明文→加密上报+网关访问控制，8分）；②三级权限（管理员双因素可配置看日志、教师账号密码控本教室、学生免登录只读课表，6分）；③漏洞响应流程（发现24h内上报→登记→信息中心1周内修复→3天内复查通报，6分）；④宣传标语（5分）。","易错警示":"四级内容各自独立给分：表/权限/流程/标语缺一即不完整。","方法点拨":"安全制度题“设备表+三级权限+响应流程+标语”四段，把本单元身份/策略/三步全织进制度。"}}]}]},{"t":"全册期末综合检测","isFinal":true,"lessons":[{"t":"全册综合检测卷（一）","n":"全册综合检测卷（一）","isExam":true,"qs":[{"sec":"选择题","type":"选择题","num":1,"text":"物联网系统的本质是“感知—传输—处理—反馈”的闭环。下列设备最能体现“自动反馈”特点的是：","opts":[{"label":"A","text":"智能空调（室温过高自动制冷）"},{"label":"B","text":"机械定时器插座"},{"label":"C","text":"遥控玩具车"},{"label":"D","text":"手动台灯"}],"subs":[],"ans":"答案A　智能空调（室温过高自动制冷）","al":{"考查点":"物联网闭环四要素的理解辨析（理解）。","解题思路":"抓住题干关键词“自动反馈”——反馈的本质是“根据结果自动调整下一次行为”。逐项验证：智能空调感知室温偏高→自动制冷→温度回落→再次感知，形成无人干预的闭环。","逐项剖析":"A对：温度感知→判断→制冷→再感知，四要素齐备且自动循环；B错：定时插座只按预设时刻断电，不感知结果、不形成反馈，属“程序控制”而非“物联反馈”；C错：遥控玩具车的动作完全依赖人按键，是“人控”不是“自动”；D错：手动台灯从感知到执行都无自动环节。","易错警示":"把“自动执行”误当“自动反馈”——定时插座也会自动断电，但没有“感知结果再调整”的闭环，这是二者的分水岭。","方法点拨":"判断题干有没有“回读结果”的环节：能根据执行后的状态再次调节才是闭环反馈。"}},{"sec":"选择题","type":"选择题","num":2,"text":"学校食堂的智能洗碗机要判断“该不该放洗涤剂”，最可能用到的传感器是：","opts":[{"label":"A","text":"浊度（水的脏净程度）传感器"},{"label":"B","text":"GPS定位传感器"},{"label":"C","text":"光线传感器"},{"label":"D","text":"声音传感器"}],"subs":[],"ans":"答案A　浊度（水的脏净程度）传感器","al":{"考查点":"传感器选型与场景匹配（应用）。","解题思路":"先明确任务目标：判断“水脏不脏、该不该放洗涤剂”→需要能感知水质浊度的传感器。再从四类传感器功能逐一排除。","逐项剖析":"A对：浊度传感器测量水中悬浮物对光的阻挡程度，脏水浊度高→信号触发加洗涤剂；B错：GPS 只报经纬度位置，与水质无关；C错：光线传感器测环境明暗，管不了水里脏不脏；D错：声音传感器测响度，洗碗机运行噪声与洗涤剂投放无关。","易错警示":"选型错误多因“没先定义感知对象”——先问“要感知什么物理量”，再找对应传感器，就不会被干扰项带走。","方法点拨":"传感器选型两步法：①定感知对象（水质→浊度）；②排除法（位置/光线/声音均不对应）。"}},{"sec":"选择题","type":"选择题","num":3,"text":"一条规范的环境数据记录“14:30，大棚东区，土壤湿度28%RH”，其中“28%RH”是记录的：","opts":[{"label":"A","text":"点位"},{"label":"B","text":"时刻"},{"label":"C","text":"数值与单位"},{"label":"D","text":"仪器编号"}],"subs":[],"ans":"答案C　数值与单位","al":{"考查点":"规范数据记录的构成要素（理解）。","解题思路":"规范记录需同时含“时刻＋点位＋数值＋单位”，题干把记录拆成三段：14:30（时刻）、大棚东区（点位）、土壤湿度28%RH（物理量＋数值＋单位）。问题只问“28%RH”是哪部分。","逐项剖析":"A错：点位是“大棚东区”，不在本段；B错：时刻是“14:30”，也不在本段；C对：“28”是数值、“%RH”是相对湿度单位，二者共同构成“带单位的数值”，缺一不可；D错：仪器编号在记录中本就未出现，属编造干扰项。","易错警示":"只盯“28”而忽略“%RH”会误选C为“数值”——规范记录的考点恰恰是“数值必须带单位”。","方法点拨":"数据记录“四要素拆解法”：时刻｜点位｜数值｜单位，见到记录先对号入座再作答。"}},{"sec":"选择题","type":"选择题","num":4,"text":"小区门禁卡“一刷就开”，最可能用到的物联网识别技术是：","opts":[{"label":"A","text":"射频识别（RFID）"},{"label":"B","text":"蓝牙广播"},{"label":"C","text":"卫星定位"},{"label":"D","text":"超声波测距"}],"subs":[],"ans":"答案A　射频识别（RFID）","al":{"考查点":"常见自动识别技术的场景识别（理解）。","解题思路":"门禁卡的核心特征：非接触、“一刷”即完成身份识别。四种技术中只有射频识别以“标签+读写器”实现身份认证。","逐项剖析":"A对：门禁卡内置 RFID 标签芯片，读卡器发无线电波、标签回传编号，非接触完成开锁；B错：蓝牙用于短距离数据传输（传文件、连耳机），不能识别“你是谁”；C错：卫星定位只报位置，不能验证身份；D错：超声波测距测量距离（倒车雷达），与身份认证无关。","易错警示":"把“无线通信技术”与“自动识别技术”混为一谈——蓝牙、Wi-Fi 是传输手段，RFID 是识别手段，门禁考的是后者。","方法点拨":"见“刷卡/一刷/门禁/ETC/图书借还”抓 RFID；见“传文件/连耳机”抓蓝牙；见“测距”抓超声波。"}},{"sec":"选择题","type":"选择题","num":5,"text":"奶奶在家按了门铃，远在单位上班的爸爸手机立刻收到“有人按铃”的通知。这条链路的顺序是：","opts":[{"label":"A","text":"手机→云端→门铃"},{"label":"B","text":"门铃（触发）→网络→云端→推送到手机"},{"label":"C","text":"门铃直接打电话给爸爸"},{"label":"D","text":"云端→门铃→手机"}],"subs":[],"ans":"答案B　门铃（触发）→网络→云端→推送到手机","al":{"考查点":"物联通知链路的方向与顺序（应用）。","解题思路":"沿数据流画链：谁产生事件（门铃被按）→ 数据走什么路（经网络上传）→ 谁中转处理（云端）→ 谁接收（爸爸手机）。方向必须是从“事件源”流向“接收者”。","逐项剖析":"A错：方向画反了——手机不是触发端，门铃才是；C错：门铃不能“直接打电话”，跨网络通信必须经云端/服务器中转，这是物联网的基本架构；D错：云端不产生事件，链路起点应是门铃；B对：门铃按键触发（感知）→信号经家庭网络与互联网（传输）→云端判断并匹配推送对象（处理）→推送到爸爸手机（反馈），顺序完整。","易错警示":"“门铃通知”最容易错画成门铃直连手机——脱离云端中转的“直连”在远程场景不成立。","方法点拨":"通知链路画法：触发源→网络→云端→接收端，缺云端这一环的选项基本可判错。"}},{"sec":"选择题","type":"选择题","num":6,"text":"把一周的教室温度画成折线图，最主要是为了：","opts":[{"label":"A","text":"让数据更漂亮"},{"label":"B","text":"直观看出温度随时间的变化趋势"},{"label":"C","text":"代替原始数据表"},{"label":"D","text":"让电脑更省电"}],"subs":[],"ans":"答案B　直观看出温度随时间的变化趋势","al":{"考查点":"数据可视化的目的辨析（理解）。","解题思路":"可视化是为“读图”服务的：把表格里隐藏的趋势变成眼睛能直接捕捉的形状。问“最主要为了什么”要选本质目的，不选装饰性表述。","逐项剖析":"A错：美化是次要效果，不是目的，可视化首先为洞察服务；B对：折线图横轴时间、纵轴温度，线条起伏让人一眼看出“几时最热、整体走势”，这正是趋势分析；C错：图表是原始数据的“转译”，无法也不应完全替代原始数据表（精确定值仍需查表）；D错：与电脑能耗无关，属编造干扰。","易错警示":"“更漂亮”“代替原表”是常见误导——数据可视化的价值是让规律可见，不是装饰也不是替代品。","方法点拨":"数据题问“目的”时，优先找带“规律/趋势/洞察”字样的选项；见到“美观/省电/代替”类表述多为陪跑。"}},{"sec":"选择题","type":"选择题","num":7,"text":"“数字身份”是物联网信任的基石。下列最不属于数字身份要素的是：","opts":[{"label":"A","text":"账号与密码"},{"label":"B","text":"设备的唯一标识（设备ID）"},{"label":"C","text":"手机的机身颜色"},{"label":"D","text":"人脸等生物特征"}],"subs":[],"ans":"答案C　手机的机身颜色","al":{"考查点":"数字身份要素与非要素的判别（理解）。","解题思路":"先界定“数字身份”：能用于验证“我是我/这是这台设备”的信息集合。逐项判断哪些信息能参与验证。","逐项剖析":"A不选：账号＋密码是最基本的身份凭证；B不选：设备ID 是设备在物联网中的“身份证号”，属于数字身份；C选：机身颜色是外观属性，任何人无法凭颜色验证你的身份，与认证无关；D不选：人脸等生物特征具有唯一性，是高级身份凭证。","易错警示":"注意题干问“最不属于”，是反向选择——平时练习多是正向，遇“不属于/不正确”先圈关键词再作答。","方法点拨":"反向题干做法：把四项逐个问“它能验证身份吗？”，唯一答“不能”的即答案；凡“外观/颜色/喜好”等静态外观属性必是陪跑。"}},{"sec":"选择题","type":"选择题","num":8,"text":"家里的智能摄像头提示“固件可更新”，从安全角度看，正确的做法是：","opts":[{"label":"A","text":"尽快更新，补上可能存在的安全漏洞"},{"label":"B","text":"不用管，更新会变慢"},{"label":"C","text":"只有坏的时候才更新"},{"label":"D","text":"先卸载摄像头软件"}],"subs":[],"ans":"答案A　尽快更新，补上可能存在的安全漏洞","al":{"考查点":"物联网安全维护的正确态度（理解）。","解题思路":"固件更新＝厂商发布的安全补丁与功能修复，是“持续守护”的关键动作。判断题干场景中哪种做法符合安全最佳实践。","逐项剖析":"A对：安全漏洞是动态出现的，更新固件补上已知漏洞是最直接有效的防护；B错：“更新会变慢”是误解——更新通常修复问题而非故意降速，为省事不更新等于把漏洞留在家里；C错：等到“坏了才更新”太迟——漏洞在坏之前就可能被利用；D错：卸载软件是因噎废食，摄像头功能被放弃而漏洞风险仍在设备端。","易错警示":"把“更新”当可选项而非必选项——物联网设备的固件补丁就是它的“疫苗”，逾期不打就会中招。","方法点拨":"凡题干出现“可更新/发现漏洞”，正确做法必是“及时更新/打补丁”；警惕“不用管/坏了再更/卸载”三陷阱。"}},{"sec":"判断题","type":"判断题","num":1,"text":"只要设备能自动运行，就一定是物联网设备。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"物联网设备的判定标准（理解）。","解题思路":"拆“物联网设备”的必要条件：能联网＋能感知/执行＋数据可交互。单有“自动”不构成物联网特征，要追问“它联网吗？它感知吗？”。","易错警示":"被“自动运行”迷惑——机械定时器、传统洗衣机都自动，但既不联网也不感知，不是物联网设备；判“是物联网”须三个条件齐备。","方法点拨":"判断物联网设备的“三问法”：能联网吗？有感知吗？数据能交互吗？三问皆“是”才判√。"}},{"sec":"判断题","type":"判断题","num":2,"text":"传感器把温度、湿度等物理量变成电信号，是物联网感知层的基础。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"传感器在感知层的地位与作用（记忆）。","解题思路":"回顾感知层职能：把现实物理量数字化。传感器正是“物理量→电信号”的转换器件，是感知层的核心与入口。","易错警示":"混淆层次——传感器属感知层，不是网络层或应用层；也不要把执行器误当感知器件。","方法点拨":"“三层架构器件归属表”：感知层记传感器、网络层记网关/基站、应用层记平台/App，逐层记忆不易混。"}},{"sec":"判断题","type":"判断题","num":3,"text":"记录数据时数值最重要，单位、时刻、点位都可以省略。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"规范数据记录的价值（理解）。","解题思路":"从“数据的可用性”反推：一条记录只有被读的人理解才有价值。单位缺失则数值无意义（28%RH 与 28 完全不同）；时刻点位缺失则无法比较与溯源。","易错警示":"以为“数值最重要”而忽视上下文——恰恰是单位、时刻、点位让数值“可解读、可比较、可决策”。","方法点拨":"记忆口诀“时点值单四件套”：一条好记录 = 时刻＋点位＋数值＋单位，缺一件都算“半成品数据”。"}},{"sec":"判断题","type":"判断题","num":4,"text":"物联网与互联网互不相干，物联网的数据传输不需要借用互联网技术。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"物联网与互联网的关系（理解）。","解题思路":"物联网并非凭空出现的新网络，其网络层大量复用互联网与移动通信基础设施（Wi-Fi、4G/5G、光纤），可视为互联网在“物与物”维度的延伸。","易错警示":"把物联网说成“独立的另一张网”——实际物联网与互联网是继承与发展、底层共享的关系。","方法点拨":"记“互联网是物联的骨架”：设备数据最终大多经由互联网传输与云端处理，二者不是互不相干的两张网。"}},{"sec":"判断题","type":"判断题","num":5,"text":"人脸识别支付很方便，但也要关注人脸数据被滥用的风险。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"人脸数据的敏感性与风险意识（理解）。","解题思路":"人脸属生物特征，具有唯一性与不可更改性（密码可改、脸不能换），一旦泄露被滥用，后果长期。判“要关注风险”符合负责任使用技术的价值观。","易错警示":"只看到“刷脸方便”的一面而忽略数据滥用风险——便利与安全须权衡，敏感数据更要谨慎授权。","方法点拨":"凡涉及人脸/指纹/虹膜等生物特征，答题锚点：唯一性＋不可更改性＋须合规授权，风险意识题判√。"}},{"sec":"判断题","type":"判断题","num":6,"text":"只要购买了智能设备，安全问题就全部由厂家负责，用户无需做任何事。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"物联网安全的共同责任（理解）。","解题思路":"安全责任二分法：厂家管产品与服务端（出厂安全、服务器防护），用户管使用端（改默认密码、及时更新、合理授权）。题中“全部由厂家负责”否认了用户责任。","易错警示":"“购买即甩锅”思维——默认密码不改等于把家门钥匙挂在门口，这责任在用户；安全永远是双方共同的事。","方法点拨":"记“安全责任棋盘”：用户守“密码+更新+授权”三关，厂家守“产品+平台+响应”三关，只赖一方必失分。"}},{"sec":"填
