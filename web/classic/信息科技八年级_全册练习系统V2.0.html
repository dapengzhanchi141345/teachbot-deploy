text":"给访客的临时密码设成“永久有效”也没关系，反正只给一个人。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"永久密码风险的判断（评价）。","解题思路":"“反正只给一个人”不成立：永久密码一旦外泄或被转卖就无法收回，应限时限次自动作废，判断错误。","易错警示":"临时授权“永久化”是安全大忌，直接判错。","方法点拨":"密码安全第一问“外泄后还能收回吗”——不能收回即危险。"}},{"sec":"基础巩固","type":"判断","num":3,"text":"远程控制的指令发出后，门锁执行完通常会把“已开”状态回传，形成闭环。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"执行反馈闭环的判断（理解）。","解题思路":"门锁执行后把“已开”状态回传手机，人可知指令是否生效——呼应第一单元“感知—处理—反馈”闭环，判断正确。","易错警示":"别把“执行完”当终点——回传状态才是闭环的最后一环。","方法点拨":"闭环检查法：链路的最后有没有箭头“指回人”，没有则闭环缺失。"}},{"sec":"能力提升","type":"提升","num":1,"text":"画出远程开门反向链路（文字描述），并标出与门铃通知相反的方向。","opts":[],"subs":[],"ans":"手机应用（发令）→云（中转）→门锁（执行）；方向：人→设备，与门铃通知（设备→人）相反。","al":{"考查点":"反向链路的描述（理解·应用）。","解题思路":"文字链：手机应用（发令）→云（中转）→门锁（执行）；方向=人→设备，与门铃通知（设备→人）相反。","易错警示":"只画链路不标方向对比，会漏答题眼“相反”。","方法点拨":"“反向”题必写对比句：本链路人→设备，通知链路设备→人。"}},{"sec":"能力提升","type":"提升","num":2,"text":"排序：把“手机远程开门”步骤排成正确顺序（写序号）。①门锁执行开锁 ②手机应用点“开门” ③云端中转指令 ④状态回传“已开”","opts":[],"subs":[],"ans":"②③①④","al":{"考查点":"手机远程开门步骤排序（应用）。","解题思路":"先发令后执行再回传：手机点“开门”（②）→云端中转指令（③）→门锁执行开锁（①）→状态回传“已开”（④），答案②③①④。","易错警示":"易把“④状态回传”当终点省略——回传是闭环不是多余。","方法点拨":"排序题数箭头：四步链路含回传才是完整闭环。"}},{"sec":"能力提升","type":"提升","num":3,"text":"为父母设计一份“访客临时开门授权规则”，写出至少3条（含时段、次数、作废条件）。","opts":[],"subs":[],"ans":"①限时段：仅送货当天9点至18点有效；②限次数：仅可使用1次；③自动作废：过期或用完即失效；④可随时手动撤销。","al":{"考查点":"授权规则设计（应用·创造）。","解题思路":"设计3条以上可执行规则：限时段（仅送货当天9点至18点有效）、限次数（仅可使用1次）、自动作废（过期或用完即失效）、可随时手动撤销。","易错警示":"规则要“机器可执行”（时段/次数/状态），而非“道德提醒”。","方法点拨":"规则设计四要素“时段+次数+作废+可撤销”，写得越具体越可落地。"}},{"sec":"能力提升","type":"提升","num":4,"text":"连线：左侧与右侧连线（写序号）。①手机应用 ②云端 ③门锁｜A执行 B发令 C中转","opts":[],"subs":[],"ans":"①—B；②—C；③—A","al":{"考查点":"三角色连线（理解）。","解题思路":"①手机应用→B发令；②云端→C中转；③门锁→A执行。","易错警示":"发令与中转易混：手机发令，云端只转发不决策。","方法点拨":"反向链路三角色“发—转—执”固定连线。"}},{"sec":"拓展挑战","type":"拓展","num":1,"text":"情境：爸爸出差，家里的花草要浇水，他远程打开智能水龙头。请写出这条远程控制链路，并分析“如果指令没回传状态”会有什么隐患。","opts":[],"subs":[],"ans":"链路：爸爸手机发令→云中转→水龙头电磁阀执行开。隐患：无状态回传则不知是否真的开了，可能没开（草枯）或没关（水淹），闭环缺失导致失控，应加“已开或已关”回传。","al":{"考查点":"远程控制链路+缺反馈隐患（应用·分析）。","解题思路":"链路：爸爸手机发令→云中转→水龙头电磁阀执行开；隐患分析=无状态回传则不知真假——该开没开（草枯）或该关没关（水淹），闭环缺失导致失控，应加“已开/已关”回传。","易错警示":"“没反馈会怎样”要写两个方向的后果（没开、没关），再给对策。","方法点拨":"反馈必要性论证“无反馈=睁眼瞎”：出问题不知、成功与否不知。"}},{"sec":"拓展挑战","type":"拓展","num":2,"text":"评价：妈妈担心“黑客远程开我家门锁”。请结合远程控制链路与授权安全，给她两条安心使用的建议。","opts":[],"subs":[],"ans":"①用强密码加双重验证，不把主密码给外人，临时密码限时限次；②只从官方应用发令、及时更新固件、发现异常立即撤销授权并改密。授权谨慎、密码不外泄即可控。","al":{"考查点":"远程控制安全使用建议（评价）。","解题思路":"两条落地建议：①强密码＋双重验证、主密码不给外人、临时密码限时限次；②只从官方应用发令、及时更新固件、发现异常立即撤销授权并改密。授权谨慎、密码不外泄即可控。","易错警示":"建议要“可操作”，空喊“注意安全”不给分。","方法点拨":"安全建议从“认证、授权、更新、监控”四维各取一条。"}},{"sec":"变式闯关","type":"变式","num":1,"text":"换场景：农民用手机远程打开大棚灌溉阀门。把这条链路类比本课反向控制，写出发令端、中转端、执行端，并说明临时授权可怎么用在大棚帮工上。","opts":[],"subs":[],"ans":"发令端：农民手机；中转端：云端；执行端：灌溉电磁阀。临时授权：雇工来浇水时发限时2小时、限次1次的临时指令权限，过期自动作废，防滥用。","al":{"考查点":"反向链路迁移+临时授权应用（应用·创造）。","解题思路":"三角色：发令端=农民手机、中转端=云端、执行端=灌溉电磁阀；临时授权用于雇工帮浇：发限时2小时、限次1次的临时指令权限，过期自动作废，防滥用。","易错警示":"执行端写“水管/农田”错——执行指令的是电磁阀。","方法点拨":"迁移题末端设备要具体到“可执行部件”（阀/锁/喇叭）。"}},{"sec":"间隔复习","type":"间隔","num":1,"text":"上节课学了门铃通知的“触发端／中转端／接收端”三类角色。请写出“云端”在通知链路中的职责，并说出如果断网会发生什么。","opts":[],"subs":[],"ans":"（第13课《门铃通知即时到》）　云端职责：接收门铃消息并推送到主人手机，实现跨空间中转。断网则消息发不到云端、手机收不到弹窗，跨空间通知失败。","al":{"考查点":"双反向链路+授权规则+触发源辨析（创造）；跨课迁移——校园协同场景。","解题思路":"①两条链路：远程广播=老师手机→云→广播喇叭；临时开门=家长手机→云→校门电锁；②三条规则：限时（接孩子当天16点至17点）、限次（仅1次）、作废（过期或已用即失效，老师可手动撤销）；③触发源辨析：第13课门铃通知是设备（门铃）触发、人接收；本方案是人（老师或家长）触发、设备执行——触发源相反。","易错警示":"链路末端写成“门”不写“电锁/喇叭”不够准确；触发源辨析要明确“谁发起”。","方法点拨":"“一题多链”先画全再对比，执行设备要写具体部件。"}},{"sec":"思维进阶","type":"挑战","num":1,"text":"【真实情境】疫情时老师需“远程打开放学广播”并“授权值班家长临时开门接孩子”。请设计方案：①分别画出“远程广播”与“临时开门”两条反向链路（标出手机／云／执行设备）；②为“家长临时开门”设计限时、限次、作废三条规则；③说明这两条链路与第13课门铃通知在“触发源”上的根本不同。","opts":[],"subs":[],"open":true,"ans":"参考设计要点：①两条链路：远程广播——老师手机→云端验证身份与权限→校园广播终端拉起播放；临时开门——家长手机申请→云端验证限时授权→单元门禁执行开门（两者都是\"控制指令下行\"，与门铃通知的\"消息上行\"方向相反）；②三条规则：限时——授权仅生效10分钟自动作废；限次——一次授权只能开一次门，重复开门须重新申请；作废——教师或管理员可随时手动撤销授权，全程留痕；③与第13课的根本不同：门铃通知的触发源是\"现场事件\"（有人按铃）被动感知上报；远程控制的触发源是\"远端人的指令\"主动下发，方向一上一下。","al":{"考查点":"开放创造：远程控制链路与权限治理（创造+应用）","解题思路":"两链路标清\"手机—云—设备\"方向；三条规则各挡住一类风险（超时/重放/失控）；与门铃的对比抓\"触发源与方向\"","易错警示":"两链路画成同一方向；规则只写\"要授权\"没有时限次数撤销三要素","方法点拨":"控制题公式：链路分方向、规则限三面、对比抓触发源。"}}]},{"t":"第 15 课 · 配套练习","n":"面容钥匙显智能","isExam":false,"qs":[{"sec":"回忆热身","type":"回忆","num":1,"text":"人脸识别开锁四步：采集人脸→提取____（不是存照片）→比对验证→放行或拒绝。","opts":[],"subs":[],"ans":"特征（特征点）","al":{"考查点":"人脸识别四步的识记（记忆）。","解题思路":"四步=采集人脸→提取特征（点）→比对验证→放行或拒绝；题干缺第二步“特征（特征点）”，并提示“不是存照片”。","易错警示":"勿填“照片/视频”——系统存的是特征数据不是图像。","方法点拨":"“采—提—比—放”四字诀＋“存特征不存照”铁律。"}},{"sec":"回忆热身","type":"回忆","num":2,"text":"人脸等生物特征具有“唯一且____”的特点，一旦泄露无法像密码那样重置。","opts":[],"subs":[],"ans":"不可更改（不可重置）","al":{"考查点":"生物特征属性的识记（记忆）。","解题思路":"生物特征“唯一且不可更改”：脸是固定的，泄露后无法像密码那样重置。","易错警示":"勿填“保密”——不可更改才是与密码的本质区别。","方法点拨":"密码可改、脸不可换——这正是人脸数据需更谨慎保护的原因。"}},{"sec":"基础巩固","type":"单选","num":1,"text":"人脸识别“提取特征”指的是：","opts":[{"label":"A","text":"把整张照片存进数据库"},{"label":"B","text":"算出五官比例等特征点并比对"},{"label":"C","text":"给脸上打码"},{"label":"D","text":"把脸拍成视频"}],"subs":[],"ans":"答案B　算出五官比例等特征点并比对","al":{"考查点":"“提取特征”含义的理解（理解）。","解题思路":"提取特征=算出五官比例、轮廓等特征点并用于比对——比的是“特征密码”，不是整张照片。","逐项剖析":"A 把整张照片存进数据库：违背最小存储，错误；B 算出五官比例等特征点并比对：正确；C 给脸上打码：不是识别过程，排除；D 把脸拍成视频：无关，排除。","易错警示":"“提取=拍照存档”是最大误解；提取是计算特征而非保存图像。","方法点拨":"把“提取特征”想成“做脸的数字画像”，画像数据≠照片。"}},{"sec":"基础巩固","type":"单选","num":2,"text":"关于“生物特征唯一且不可更改”，正确的是：","opts":[{"label":"A","text":"脸丢了能像改密码一样换一张"},{"label":"B","text":"人脸唯一但可随意重置"},{"label":"C","text":"人脸泄露后无法重置，风险更高"},{"label":"D","text":"生物特征不如密码安全"}],"subs":[],"ans":"答案C　人脸泄露后无法重置，风险更高","al":{"考查点":"生物特征安全属性的理解（理解）。","解题思路":"人脸唯一且不可更改——泄露后无法换脸，比可重置的密码风险更高，故需最小存储与告知同意。","逐项剖析":"A 脸丢了能像改密码一样换一张：不可能，排除；B 人脸唯一但可随意重置：与事实相反，排除；C 人脸泄露后无法重置、风险更高：正确；D 生物特征不如密码安全：适用场景弄反——密码可改所以更易补救，排除。","易错警示":"“不如密码安全”是把可补救性弄反：不可重置=泄露即永久风险。","方法点拨":"安全比较题比“可补救性”：可重置则风险可控，不可重置则风险更高。"}},{"sec":"基础巩固","type":"单选","num":3,"text":"人脸识别四步中，“比对验证”环节的作用是：","opts":[{"label":"A","text":"把脸拍下来"},{"label":"B","text":"将提取的特征与档案特征比对，匹配则放行、否则拒绝"},{"label":"C","text":"打开摄像头"},{"label":"D","text":"给手机发消息"}],"subs":[],"ans":"答案B　将提取的特征与档案特征比对，匹配则放行、否则拒绝","al":{"考查点":"“比对验证”环节职责（理解）。","解题思路":"比对验证=将提取的特征与档案中的授权特征比对，匹配则放行、否则拒绝——与第12课“验证”同逻辑。","逐项剖析":"A 把脸拍下来：那是采集，排除；B 将特征与档案比对、匹配放行否则拒绝：正确；C 打开摄像头：采集前的准备，排除；D 给手机发消息：通知功能，排除。","易错警示":"比对的是“特征 vs 特征”，不是“照片 vs 照片”。","方法点拨":"凡“验证/比对/匹配”即判断环节，其前是采集、其后是放行。"}},{"sec":"基础巩固","type":"单选","num":4,"text":"用照片去刷脸开门，被系统拒绝。原因是：","opts":[{"label":"A","text":"照片太丑"},{"label":"B","text":"系统有“活体检测”，照片非真人被拒"},{"label":"C","text":"摄像头坏了"},{"label":"D","text":"光线太亮"}],"subs":[],"ans":"答案B　系统有“活体检测”，照片非真人被拒","al":{"考查点":"照片欺骗被拒的原因（理解）。","解题思路":"系统内置“活体检测”（眨眼或红外等），能识别“照片非真人”从而拒绝——体现安全攻防的演进。","逐项剖析":"A 照片太丑：玩笑，排除；B 系统有活体检测、照片非真人被拒：正确；C 摄像头坏了：假设错误；D 光线太亮：光线问题通常提示重试而非直接拒绝，排除。","易错警示":"“活体检测”是防欺骗的关键词——凡“照片/视频能否冒充”题必答它。","方法点拨":"安全升级线：密码→卡→生物特征→活体检测，一层防一层。"}},{"sec":"基础巩固","type":"判断","num":1,"text":"人脸识别提取并存储的是用户的整张照片，方便以后直接调看。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"“存整张照片”说法的判断（理解）。","解题思路":"系统提取并存的是特征点而非整张照片——最小存储既保护隐私又够用，“方便直接调看”纯属误解，判断错误。","易错警示":"“存照便于调看”是反隐私的常见错误认知。","方法点拨":"凡生物识别语境下出现“存整张照片”表述，基本判错。"}},{"sec":"基础巩固","type":"判断","num":2,"text":"人脸开锁免带卡、体验顺滑，这是它相比刷卡、密码的便利之处。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"人脸识别便利性的判断（理解）。","解题思路":"生物特征随身带、免带卡、免记密码、体验顺滑——便利性正是它普及的原因，判断正确。","易错警示":"便利与风险要分开说，本题只考便利一面。","方法点拨":"“免带卡、免记密码”八字即人脸便利性的全部论据。"}},{"sec":"基础巩固","type":"判断","num":3,"text":"“不是不用，而是怎么用”——人脸应用应在告知同意、最小存储、敏感场所慎用间平衡。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"负责任使用观的判断（评价）。","解题思路":"“技术无善恶、用法见责任”：人脸应用应在告知同意、最小存储、敏感场所慎用之间平衡，判断正确。","易错警示":"此题考价值观立场：既不全盘否定技术，也不无脑推广。","方法点拨":"“不是不用，而是怎么用”是AI伦理题的标准答案骨架。"}},{"sec":"能力提升","type":"提升","num":1,"text":"写出人脸识别开锁四步，并说明“提取的是特征不是照片”为什么重要。","opts":[],"subs":[],"ans":"采集（摄像头拍脸）→提取特征点→比对档案→放行或拒。重要：只存特征不存照，泄露后无法被还原照片滥用，且更省空间、更护隐私。","al":{"考查点":"人脸四步与隐私设计原理（应用）。","解题思路":"四步：采集（摄像头拍脸）→提取特征点→与档案比对→放行或拒绝；“只存特征不存照”重要：泄露后无法被还原照片滥用、更省空间、更护隐私。","易错警示":"“为什么重要”要答够两点（防滥用＋护隐私），只答“更安全”太泛。","方法点拨":"“最小存储”论证：存最少的数据仍能完成任务=隐私与功能兼得。"}},{"sec":"能力提升","type":"提升","num":2,"text":"排序：把“刷脸开门”步骤排成正确顺序（写序号）。①摄像头采集人脸 ②提取特征点 ③与档案比对 ④放行或拒绝","opts":[],"subs":[],"ans":"①②③④","al":{"考查点":"刷脸开门步骤排序（应用）。","解题思路":"先采后算再比后放行：摄像头采集人脸（①）→提取特征点（②）→与档案比对（③）→放行或拒绝（④），答案①②③④。","易错警示":"“采集”与“提取”易被合并——拍照≠算特征，两步分开。","方法点拨":"排序按“原始数据→加工→判断→动作”推进。"}},{"sec":"能力提升","type":"提升","num":3,"text":"连线：左侧与右侧连线（写序号）。①采集 ②提取 ③比对 ④活体检测｜A防照片欺骗 B算特征点 C拍脸 D匹配档案","opts":[],"subs":[],"ans":"①—C；②—B；③—D；④—A","al":{"考查点":"四环节连线（理解）。","解题思路":"①采集→C拍脸；②提取→B算特征点；③比对→D匹配档案；④活体检测→A防照片欺骗。","易错警示":"活体检测不是“采集”的别名——它是采集之后对真伪的校验。","方法点拨":"连线四件套按“动作名—做什么”逐一配对。"}},{"sec":"能力提升","type":"提升","num":4,"text":"从“便利”和“风险”两面，各举一个人脸识别的例子（共2条）。","opts":[],"subs":[],"ans":"便利：老人小孩免带卡、刷脸秒进，体验好；风险：人脸数据若泄露无法重置，可能被冒用开户或跟踪。","al":{"考查点":"技术双面性举例（评价）。","解题思路":"各举一例：便利=老人小孩免带卡、刷脸秒进，体验好；风险=人脸数据若泄露无法重置，可能被冒用开户或跟踪。","易错警示":"两面例子要“同维度对应”（同一应用的两面），不能风马牛不相及。","方法点拨":"“两面”题公式：同一技术＋两个场景，一利一弊。"}},{"sec":"拓展挑战","type":"拓展","num":1,"text":"情境：学校想装“人脸门禁”方便学生进校。请写一份《负责任使用建议》：①说明它带来的两点便利；②指出一个隐私风险；③给出两条可落地的保护措施（如告知同意、最小存储）。","opts":[],"subs":[],"ans":"①便利：学生免带卡、防丢卡冒用，早高峰通行更快。②风险：人脸数据集中存储，一旦泄露无法重置。③措施：采集前征得家长同意；只存特征不存照、设最短留存期；敏感场所（宿舍）慎用。","al":{"考查点":"负责任使用方案的写作（应用·创造）。","解题思路":"三问作答：便利两点（学生免带卡、防丢卡冒用、早高峰通行更快）；风险一个（人脸数据集中存储、一旦泄露无法重置）；措施两条（采集前征得家长同意；只存特征不存照＋设最短留存期；宿舍等敏感场所慎用）。","易错警示":"便利与风险要具体到学校场景，不能抄通用话术。","方法点拨":"“负责任使用”三件套：两点便利＋一个风险＋两条可落地保护。"}},{"sec":"拓展挑战","type":"拓展","num":2,"text":"辩论准备：就“小区该不该全面装人脸门禁”写一段平衡立场（既看到便利也看到风险，并给出使用条件）。","opts":[],"subs":[],"ans":"支持在告知同意、最小存储、可选项（保留刷卡）前提下使用：便利在于老人小孩免带卡、安防可追溯；风险在于数据泄露不可重置。条件：不强制、提供替代方式、数据本地加密、定期审计。","al":{"考查点":"平衡立场的论证写作（评价）。","解题思路":"立场=有条件支持：前提（告知同意、最小存储、保留刷卡可选项）；便利（老人小孩免带卡、安防可追溯）；风险（数据泄露不可重置）；条件（不强制、提供替代方式、数据本地加密、定期审计）。","易错警示":"平衡≠和稀泥：要给明确前提与条件，立场才立得住。","方法点拨":"辩论稿结构“有条件支持”：认可价值→点出风险→给出前提与替代方案。"}},{"sec":"变式闯关","type":"变式","num":1,"text":"换场景：手机“刷脸支付”也是生物特征识别。把它的四步类比人脸门禁，写出采集、提取、比对、放行各对应什么，并指出支付场景对“活体检测”要求更高的原因。","opts":[],"subs":[],"ans":"采集（前摄拍脸）→提取特征→与支付账户人脸档案比对→放行（扣款）。支付直接动钱，故活体检测要求更高（防照片或视频欺骗盗刷），常加眨眼、三维结构光。","al":{"考查点":"人脸识别迁移支付场景（应用）。","解题思路":"四步映射：采集（前摄拍脸）→提取特征→与支付账户人脸档案比对→放行（扣款）；支付直接动钱，活体检测要求更高（防照片/视频盗刷），常加眨眼、三维结构光。","易错警示":"“放行”在支付场景=扣款授权，别写成“开门”。","方法点拨":"异场景迁移找“放行动作”的对偶词：门禁=开门、支付=扣款。"}},{"sec":"间隔复习","type":"间隔","num":1,"text":"上节课学了远程控制“手机→云→门锁”的反向链路。请写出它与门铃通知在“触发源”上的根本不同，并说一句临时密码为什么要“自动作废”。","opts":[],"subs":[],"ans":"（第14课《远程控制更便捷》）　通知触发源是设备（门铃），控制触发源是人（手机）；方向相反。临时密码自动作废：防永久密码外泄被转卖滥用，限时限次才安全。","al":{"考查点":"人脸四步+便利隐私平衡+知情同意写作（创造）；跨课迁移——社区养老伦理议题。","解题思路":"①流程四步并标注“提取特征非照片”：摄像头采集→提取特征点（非照片）→与本地档案比对→放行或拒绝；②两条平衡规则：人脸特征仅存社区本地服务器、不联网外传；保留刷卡为可选项，不愿刷脸者可用；③知情同意告知语：仅提取面部特征用于开门、数据本地加密保存、可随时改用刷卡、详情见《知情同意书》。","易错警示":"“提取特征非照片”是评分关键词必须点出；告知语要含“可选＋可退出”才得体。","方法点拨":"人脸伦理方案三件套：流程标特征、规则平衡两权、告知语给选项。"}},{"sec":"思维进阶","type":"挑战","num":1,"text":"【真实情境】社区要建“智慧养老人脸门禁”，既方便健忘老人免带卡进门，又要保护居民人脸隐私。请设计方案：①画出人脸四步流程（采集／提取／比对／放行），标注“提取特征非照片”；②设计两条兼顾“便利”与“隐私”的使用规则（如本地存储特征、可改用刷卡）；③写一句给居民的“知情同意”告知语。","opts":[],"subs":[],"open":true,"ans":"参考设计要点：①四步流程：采集（摄像头采集人脸图像）→提取（提取面部特征值——是数学特征不是保存照片）→比对（与库内已登记特征比对相似度）→放行（达阈值开门，否则拒绝）；②两条规则：特征数据本地存储加密保存，不传外部服务器（便利与隐私兼得）；提供\"刷卡模式\"备选项，居民可自选或随时切换，不强制采集人脸；③知情同意告知语示例：\"本系统采集您的人脸特征仅用于开门验证，数据加密保存在本机、不会外传；您也可选择刷卡方式进出，随时可申请删除您的人脸数据\"。","al":{"考查点":"开放创造：人脸识别的隐私平衡设计（创造+信息社会责任）","解题思路":"四步中\"提取特征≠存照片\"是关键标注；两条规则分别从\"数据存哪\"与\"可否不用\"保护隐私；告知语具备\"用途+保存方式+可退出+可删除\"四要素","易错警示":"流程把\"存照片\"当比对依据（恰恰是隐私风险点）；告知语没有\"可删除\"承诺","方法点拨":"人脸题公式：四步流程、本地+可选双保护、告知语四要素。"}}]},{"t":"达标检测","n":"第三单元 简单物联功能实践 · 达标检测卷","isExam":true,"qs":[{"sec":"选择题","type":"选择题","num":1,"text":"工程师设计物联网系统，第一步应：","opts":[{"label":"A","text":"买齐设备"},{"label":"B","text":"把大需求分解为子功能模块"},{"label":"C","text":"先写代码"},{"label":"D","text":"先联网"}],"subs":[],"ans":"答案B　把大需求分解为子功能模块","al":{"考查点":"系统设计第一步的判别（理解）。","解题思路":"教材铁律“先功能后设备”：第一步是把大需求分解为子功能模块，把模糊需求变成可落地方案。","易错警示":"“买设备/写代码”都是功能明确之后的动作。","方法点拨":"凡问第一步，答案永远是“功能分解/规划”。"}},{"sec":"选择题","type":"选择题","num":2,"text":"射频识别刷卡开锁四步中，安全闸门是：","opts":[{"label":"A","text":"刷卡"},{"label":"B","text":"读卡"},{"label":"C","text":"验证"},{"label":"D","text":"开锁"}],"subs":[],"ans":"答案C　验证","al":{"考查点":"刷卡四步中安全环节的辨识（理解）。","解题思路":"四步=刷卡→读卡→验证→开锁；验证比对授权名单、失败即拒，是安全闸门。","易错警示":"“开锁”看似关键，但无验证的开锁最危险。","方法点拨":"“安全闸门/最关键”即验证，本单元题眼。"}},{"sec":"选择题","type":"选择题","num":3,"text":"门铃通知“跨空间送达”依赖的关键角色是：","opts":[{"label":"A","text":"门铃"},{"label":"B","text":"云端中转"},{"label":"C","text":"手机"},{"label":"D","text":"无线网络"}],"subs":[],"ans":"答案B　云端中转","al":{"考查点":"跨空间通知关键角色（理解）。","解题思路":"“跨空间送达”依赖云端把消息从触发端推到接收端；门铃/手机是两端、网络是通道，云端才是中转核心。","易错警示":"“无线网络”只是通道，不是中转决策者。","方法点拨":"跨空间=云端中转，出现即选。"}},{"sec":"选择题","type":"选择题","num":4,"text":"远程开门与门铃通知的根本不同是：","opts":[{"label":"A","text":"都用云但触发源相反"},{"label":"B","text":"远程更快"},{"label":"C","text":"通知不用云"},{"label":"D","text":"两者完全一样"}],"subs":[],"ans":"答案A　都用云但触发源相反","al":{"考查点":"通知与控制方向辨析（理解）。","解题思路":"都用云端，但触发源相反：通知=设备触发、控制=人触发，链路方向相反。","易错警示":"“远程更快/通知不用云”均为错误干扰项。","方法点拨":"看箭头起点：设备=通知、人=控制。"}},{"sec":"选择题","type":"选择题","num":5,"text":"人脸识别“提取特征”是指：","opts":[{"label":"A","text":"存整张照片"},{"label":"B","text":"算特征点并比对"},{"label":"C","text":"拍视频"},{"label":"D","text":"打码"}],"subs":[],"ans":"答案B　算特征点并比对","al":{"考查点":"“提取特征”含义（理解）。","解题思路":"提取=算特征点并比对，比的是特征不是照片，降低黑箱感并护隐私。","易错警示":"“存整张照片”违背最小存储原则。","方法点拨":"“特征非照片”是本课铁律。"}},{"sec":"选择题","type":"选择题","num":6,"text":"关于临时密码，正确的是：","opts":[{"label":"A","text":"永久有效"},{"label":"B","text":"限时限次自动作废"},{"label":"C","text":"和主密码一样"},{"label":"D","text":"不用设置"}],"subs":[],"ans":"答案B　限时限次自动作废","al":{"考查点":"临时密码设计原则（应用·评价）。","解题思路":"临时授权应限时限次自动作废，防滥用防转卖，像一次性门票。","易错警示":"“永久有效”等同交出钥匙，风险不可收回。","方法点拨":"临时三限“限时、限次、自动废”。"}},{"sec":"判断题","type":"判断题","num":1,"text":"做物联网项目应先买设备再想功能。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"先功能还是先设备的判断（理解）。","解题思路":"应先定功能再选设备——功能稳定、设备可变，先买设备本末倒置。","易错警示":"“先买设备再想功能”是本单元最大认知误区。","方法点拨":"见“先买设备”即判错。"}},{"sec":"判断题","type":"判断题","num":2,"text":"射频识别卡无电池也能被读卡器读到，靠近场无线电供能。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"无源卡供能原理（理解）。","解题思路":"近场耦合：读卡器无线电同时为卡供能并读取编号，故无电池也能读。","易错警示":"“无源”靠取能，不是无能量来源。","方法点拨":"能量来自读卡器电磁场。"}},{"sec":"判断题","type":"判断题","num":3,"text":"门铃通知断网时仍能推送到外地手机。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"断网后果与云端必要性（理解）。","解题思路":"无网络无云端则推送失败——跨空间通知依赖中转，断网必失败。","易错警示":"本地响铃≠推送成功，推送要过云端。","方法点拨":"云端中转是跨空间通知的必要条件。"}},{"sec":"判断题","type":"判断题","num":4,"text":"人脸等生物特征唯一但可以随时重置。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"生物特征安全属性（理解）。","解题思路":"生物特征唯一且不可更改——泄露无法像密码那样重置。","易错警示":"“可随时重置”与生物特征本质矛盾。","方法点拨":"密码可改、脸不可换。"}},{"sec":"判断题","type":"判断题","num":5,"text":"技术本身无善恶，关键在负责任地使用。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"技术伦理观（评价）。","解题思路":"技术本身无善恶，便利与隐私的平衡靠负责任的使用方式。","易错警示":"别被“技术无罪论”或“技术有害论”带偏——关键在于用法。","方法点拨":"“不是不用，而是怎么用”是伦理题定式。"}},{"sec":"填空题","type":"填空题","num":1,"text":"把一个大需求拆成小模块的方法叫____法。","opts":[],"subs":[],"ans":"功能分解","al":{"考查点":"功能分解概念识记（记忆）。","解题思路":"把大需求拆成小模块的方法即“功能分解法”。","易错警示":"勿写“模块化”等变体——标准答案就是功能分解。","方法点拨":"“大拆小=功能分解”。"}},{"sec":"填空题","type":"填空题","num":2,"text":"射频识别刷卡开锁四步：刷卡→读卡→____→开锁。","opts":[],"subs":[],"ans":"验证","al":{"考查点":"刷卡四步顺序识记（记忆）。","解题思路":"四步=刷卡→读卡→验证→开锁，缺第三位“验证”。","易错警示":"验证是安全闸门位，顺序不能错。","方法点拨":"“刷—读—验—开”。"}},{"sec":"填空题","type":"填空题","num":3,"text":"门铃通知三类角色：触发端、____、接收端。","opts":[],"subs":[],"ans":"云端（中转端）","al":{"考查点":"通知三类角色识记（记忆）。","解题思路":"三类=触发端、中转端（云端）、接收端，缺“云端（中转端）”。","易错警示":"中转端是云端不是路由器。","方法点拨":"触发—中转—接收，云端居中。"}},{"sec":"填空题","type":"填空题","num":4,"text":"远程控制反向链路：手机→云→____。","opts":[],"subs":[],"ans":"门锁（执行设备）","al":{"考查点":"反向链路识记（记忆）。","解题思路":"远程控制=手机→云→门锁（执行设备）。","易错警示":"末端是执行设备不是人。","方法点拨":"“发—转—执”。"}},{"sec":"填空题","type":"填空题","num":5,"text":"人脸识别四步：采集→提取特征→____→放行或拒绝。","opts":[],"subs":[],"ans":"比对验证","al":{"考查点":"人脸四步识记（记忆）。","解题思路":"四步=采集→提取特征→比对验证→放行或拒绝，缺“比对验证”。","易错警示":"提取与比对是两个步骤。","方法点拨":"“采—提—比—放”。"}},{"sec":"填空题","type":"填空题","num":6,"text":"生物特征具有唯一且____的特点。","opts":[],"subs":[],"ans":"不可更改（不可重置）","al":{"考查点":"生物特征属性识记（记忆）。","解题思路":"生物特征唯一且不可更改（不可重置）。","易错警示":"勿填“唯一且保密”——不可更改才是关键。","方法点拨":"“唯一＋不可改”成对记。"}},{"sec":"简答题","type":"简答题","num":1,"text":"用“点外卖”类比，说明什么是功能分解，并写出智能门禁的至少4个子功能（8分）。","opts":[],"subs":[],"ans":"功能分解：把总系统（外卖平台）拆成可协作的子功能（下单、接单、配送、评价）；门禁同理拆为识别、开锁、通知、记录等子功能，先功能后设备。（答出类比与4个子功能即给分）","al":{"考查点":"功能分解的类比表达（应用）。","解题思路":"功能分解=把总系统（外卖平台）拆成可协作子功能（下单、接单、配送、评价）；门禁同理拆为识别、开锁、通知、记录等，先功能后设备。","易错警示":"类比与子功能要都答出；子功能不能写成设备。","方法点拨":"“类比一句＋子功能四例”结构，各占一半分。"}},{"sec":"简答题","type":"简答题","num":2,"text":"请分别说明“门铃通知”和“远程控制”的链路与触发源差异，并各举一例（12分）。","opts":[],"subs":[],"ans":"门铃通知：门铃→云→手机，设备触发、人被动接收（如访客按铃手机弹窗）；远程控制：手机→云→门锁，人触发、设备执行（如外地远程开门）。二者同用云端、方向相反。（要点齐全即给分）","al":{"考查点":"通知与控制双链路对比（应用·分析）。","解题思路":"分写两链路与触发源：门铃通知=门铃→云→手机，设备触发、人被动接收（如访客按铃手机弹窗）；远程控制=手机→云→门锁，人触发、设备执行（如外地远程开门）；再总结“同用云端、方向相反”。","易错警示":"只写链路不写触发源差异会漏分；方向对比是本题灵魂。","方法点拨":"对比题“各写链路→各写触发源→一句总结”三步，要点齐全即给分。"}},{"sec":"案例分析题","type":"案例分析题","num":1,"text":"某小区装智能门禁，支持刷卡与人脸两种方式，并给快递员发“临时密码”。请回答：①刷卡开锁四步是什么？②人脸识别四步是什么，提取的是特征还是照片？③临时密码为什么要“限时限次自动作废”？④从隐私角度，给物业提一条人脸识别的使用建议。","opts":[],"subs":[],"ans":"①刷卡→读卡→验证→开锁。②采集→提取特征点→比对→放行或拒；提取的是特征非照片。③临时密码若永久有效，外泄或被转卖将失控，限时限次自动作废防滥用。④建议：人脸数据本地最小存储、不联网外传，采集前告知同意，保留刷卡选项。（每点合理即给分，共15分）","al":{"考查点":"本单元五模块知识整合（分析·应用）。","解题思路":"四问分答：①刷卡四步=刷卡→读卡→验证→开锁；②人脸四步=采集→提取特征点→比对→放行或拒，提取的是特征非照片；③临时密码限时限次自动作废=防外泄转卖失控；④隐私建议=本地最小存储、不联网外传、采集前告知同意、保留刷卡选项。","易错警示":"每问都要答到采分点，缺“特征非照片”这类关键词会被扣分。","方法点拨":"案例题“一问一段”对号作答，把单元关键词（验证/特征/作废/最小存储）全带出。"}},{"sec":"综合实践题","type":"综合实践题","num":1,"text":"为校园“智能门岗系统”写一份《系统总装蓝图说明》，整合本单元五个模块：①画出功能分解树（总目标加至少4子功能）；②分别用一句话说明“刷卡开锁”与“人脸开锁”流程；③写出“门铃通知”与“远程控制”两条链路并指出触发源差异；④就“便利对隐私”写三条负责任使用建议。","opts":[],"subs":[],"ans":"①树：智能门岗→识别、开锁、通知、记录（各子功能）。②刷卡：刷卡→读卡→验证→开锁；人脸：采集→提取特征→比对→放行。③通知：门铃→云→手机（设备触发）；控制：手机→云→门锁（人触发）。④建议：告知同意、最小存储特征非照片、敏感场所慎用并提供刷卡替代。（要点齐全、整合完整即给分，共25分）","al":{"考查点":"单元五模块的总装整合（创造）。","解题思路":"四块成文：①分解树=智能门岗→识别、开锁、通知、记录；②两种开锁各一句话流程；③两条链路及触发源差异（通知设备触发、控制人触发）；④负责任使用建议三条（告知同意、最小存储特征非照片、敏感场所慎用并提供刷卡替代）。","易错警示":"“总装”要体现单元内模块关联，不能五个模块各答各的。","方法点拨":"总装蓝图“树→流程→链路→伦理”四段式，把本单元所有子功能串成一个系统叙述。"}}]}]},{"t":"第四单元 简易物联系统实践","isFinal":false,"lessons":[{"t":"第 16 课 · 配套练习","n":"模块功能先划分","isExam":false,"qs":[{"sec":"回忆热身","type":"回忆","num":1,"text":"简易物联系统由四大功能模块组成，分别是感知（传感）、网络（传输）、处理（分析）和____。","opts":[],"subs":[],"ans":"执行（控制）","al":{"考查点":"四大功能模块的识记（记忆）。","解题思路":"四大模块=感知（传感）、网络（传输）、处理（分析）、执行（控制）；题干已给前三，第四为“执行（控制）”。","易错警示":"勿填“反馈/显示”——执行才是最后一环，反馈是系统行为不是模块名。","方法点拨":"“感—传—析—动”四字诀，按数据流向记顺序不颠倒。"}},{"sec":"回忆热身","type":"回忆","num":2,"text":"开发简易物联系统遵循“规划→采集→分析→可视化→____”的工程流程。","opts":[],"subs":[],"ans":"反馈","al":{"考查点":"工程开发流程的识记（记忆）。","解题思路":"工程流程=规划→采集→分析→可视化→反馈；题干缺最后一步“反馈”。","易错警示":"勿填“发布/展示”——流程闭环的终点是依据结果再调整的“反馈”。","方法点拨":"流程与模块两线对照：规划对框图、采集对感知、反馈对应“再感知”闭环。"}},{"sec":"基础巩固","type":"单选","num":1,"text":"关于四大功能模块，下列说法正确的是：","opts":[{"label":"A","text":"感知层负责给植物浇水"},{"label":"B","text":"网络层负责把数据传到处理设备"},{"label":"C","text":"处理层负责插传感器"},{"label":"D","text":"执行层负责分析数据"}],"subs":[],"ans":"答案B　网络层负责把数据传到处理设备","al":{"考查点":"四大模块职责的辨析（理解）。","解题思路":"先立四模块职责标尺：感知=探环境（传感器）、网络=传输（快递）、处理=分析判断、执行=动作（浇水补光），逐项套用。","逐项剖析":"A 感知层负责给植物浇水：浇水是执行层动作，排除；B 网络层负责把数据传到处理设备：传输职责，正确；C 处理层负责插传感器：插传感器属感知实施，排除；D 执行层负责分析数据：分析是处理层，排除。","易错警示":"“感知探环境、执行做动作”最易互串——传感器只“看”不“干”。","方法点拨":"模块题背“四句职责歌”：感知采集、网络传输、处理判断、执行动作。"}},{"sec":"基础巩固","type":"单选","num":2,"text":"给班级物联种植系统画框图时，数据流向应该是：","opts":[{"label":"A","text":"执行→感知→网络→处理"},{"label":"B","text":"传感器→网络→处理→执行"},{"label":"C","text":"处理→传感器→执行→网络"},{"label":"D","text":"网络→执行→处理→传感器"}],"subs":[],"ans":"答案B　传感器→网络→处理→执行","al":{"考查点":"框图数据流向的判断（理解）。","解题思路":"数据永远从感知出发：传感器采集→网络传输→处理判断→执行动作，流向固定为“传感器→网络→处理→执行”。","逐项剖析":"A 执行→感知…：方向颠倒，排除；B 传感器→网络→处理→执行：标准流向，正确；C 处理→传感器…：处理在采集之前，排除；D 网络→执行…：起点错误，排除。","易错警示":"指令流与控制流方向相反易混——数据从感知流向处理，指令从处理流向执行。","方法点拨":"画框图纸上先写“传感器在最左、执行在最右”，箭头一律向右。"}},{"sec":"基础巩固","type":"单选","num":3,"text":"老师说“模块是功能职责，不是具体器材”。下列对“模块”的理解正确的是：","opts":[{"label":"A","text":"换个传感器，模块就变了"},{"label":"B","text":"模块指“干什么”而非“用什么”"},{"label":"C","text":"一个模块只能装一个设备"},{"label":"D","text":"模块就是买来的零件"}],"subs":[],"ans":"答案B　模块指“干什么”而非“用什么”","al":{"考查点":"“模块是职责非器材”的理解（理解）。","解题思路":"模块=功能边界（干什么），与具体器材无关：换一批传感器而职责不变，模块划分也不变。","逐项剖析":"A 换个传感器模块就变了：换器材不换职责，排除；B 模块指“干什么”而非“用什么”：正确；C 一个模块只能装一个设备：一个感知模块可挂多个传感器，排除；D 模块就是买来的零件：模块是逻辑划分不是零件，排除。","易错警示":"“模块=零件”是把逻辑划分实体化，是第16课要破除的误区。","方法点拨":"判“器材还是职责”：问“换个牌子还能不能干同一件事”，能则它是职责。"}},{"sec":"基础巩固","type":"单选","num":4,"text":"“盖楼先看图纸”类比说明了搭建物联系统的什么道理：","opts":[{"label":"A","text":"先买最贵的器材"},{"label":"B","text":"先规划画框图再动手实施"},{"label":"C","text":"边做边想最省事"},{"label":"D","text":"图纸没用直接砌墙"}],"subs":[],"ans":"答案B　先规划画框图再动手实施","al":{"考查点":"“盖楼先图纸”类比的道理（理解）。","解题思路":"类比内核=先规划后实施：框图是设计语言，先画框图标清模块与流向，再采购动手。","逐项剖析":"A 先买最贵器材：规划反例，排除；B 先规划画框图再动手实施：正确；C 边做边想最省事：返工风险最大，排除；D 图纸没用直接砌墙：工程大忌，排除。","易错警示":"别把“图纸”窄化成画着玩——它是避免买错返工的设计图。","方法点拨":"工程两问先于动手：“画框图了吗？流向标了吗？”没画先画。"}},{"sec":"基础巩固","type":"判断","num":1,"text":"物联系统的“模块”就是买回来的具体零件和传感器。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"模块与器材之辨的判断（理解）。","解题思路":"模块是功能职责划分，不是具体零件：换器材而职责不变，模块划分也不变，判断错误。","易错警示":"“模块=传感器”是把逻辑实体化，本课核心误区。","方法点拨":"见“模块就是零件/传感器”即判错。"}},{"sec":"基础巩固","type":"判断","num":2,"text":"网络层的作用是负责把感知到的数据传送到处理层。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"网络层职责的判断（理解）。","解题思路":"网络层=传输，像快递运输，把传感器采集的数据送达处理层分析，判断正确。","易错警示":"网络层只“运数据”，不“看数据”也不“想数据”。","方法点拨":"“网络=快递”喻记，职责与感知、处理严格分开。"}},{"sec":"基础巩固","type":"判断","num":3,"text":"搭建物联系统可以先买器材动手，回头再补框图。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"先规划后实施的判断（理解）。","解题思路":"工程强调“先规划后实施”：先做框图明确模块与流向，再采购实施更高效，判断错误。","易错警示":"“先买后画”看似快实则返工多。","方法点拨":"判断题见“先动手回头补框图”即错。"}},{"sec":"能力提升","type":"提升","num":1,"text":"请写出简易物联系统四大功能模块的名称，并各用一句话说明其职责。","opts":[],"subs":[],"ans":"感知层：用传感器采集温湿度等环境数据；网络层：把数据传送到处理设备；处理层：分析数据、做判断；执行层：根据指令浇水、补光等动作。","al":{"考查点":"四大模块名称与职责表述（应用）。","解题思路":"四模块各配一句职责：感知层用传感器采集温湿度等环境数据；网络层把数据传送到处理设备；处理层分析数据做判断；执行层按指令浇水、补光等动作。","易错警示":"职责与模块错位（把分析写进感知）即扣分；句式统一“用××做××”。","方法点拨":"“四句职责歌”默写即满分，感知采集、网络传输、处理判断、执行动作。"}},{"sec":"能力提升","type":"提升","num":2,"text":"请为“班级物联种植系统”画出系统框图（文字描述），标出模块名称与数据流向。","opts":[],"subs":[],"ans":"感知层（温湿度传感器）→（数据）→网络层（传输）→（数据）→处理层（判断）→（指令）→执行层（补光灯／报警器），箭头从左向右，体现“探环境—传数据—做判断—做动作”。","al":{"考查点":"系统框图的文字绘制（应用）。","解题思路":"从左到右画四框并标箭头：感知层（温湿度传感器）→网络层（传输）→处理层（判断）→执行层（补光灯/报警器），注明数据/指令流。","易错警示":"箭头漏标方向或循环回馈缺失；框内写“模块名+设备/职责”。","方法点拨":"文字框图“四框+三箭头”齐备即完整，箭头方向不许回头乱指。"}},{"sec":"能力提升","type":"提升","num":3,"text":"把下列需求分入四大模块：测植物角温度、把数据发到电脑、判断“该不该浇水”、亮起缺水报警灯。","opts":[],"subs":[],"ans":"测温度—感知层；发数据到电脑—网络层；判断是否浇水—处理层；亮报警灯—执行层。","al":{"考查点":"需求分入模块的分类应用（应用）。","解题思路":"按职责分类：测温度=感知层；发数据到电脑=网络层；判断是否浇水=处理层；亮报警灯=执行层。","易错警示":"“报警灯”是动作执行，不是“发现情况”的判断，别放处理层。","方法点拨":"分类题先问“这步是看、运、想还是动”，答案自明。"}},{"sec":"能力提升","type":"提升","num":4,"text":"分析：小明想直接网购一套传感器大礼包就开工。请用“规划优先”的工程观说明他可能遇到的问题，并给出正确做法。","opts":[],"subs":[],"ans":"问题：没先规划会买错模块、漏掉执行设备、各部件接不上。正确做法：先按需求划分四大模块、画框图标清接口与流向，再据此采购，做到“先图纸后施工”。","al":{"考查点":"规划优先工程观的论证（分析·评价）。","解题思路":"问题列三条：买错模块、漏执行设备、部件接不上；正确做法=先按需求划分四模块、画框图标清接口流向，再据此采购。","易错警示":"只批评“不规划”却不给“正确做法”会漏后半问。","方法点拨":"“批评+开方”结构：问题从“没图纸施工”推，解法回到“先图纸后施工”。"}},{"sec":"拓展挑战","type":"拓展","num":1,"text":"情境：学校图书馆想装“智能图书除湿系统”。请你当工程师，把系统划分为四大模块，并说明每层用什么设备或技术（至少各1个）。","opts":[],"subs":[],"ans":"感知层用温湿度传感器探测书库潮气；网络层用无线模块把数据传到管理电脑；处理层用电脑程序判断湿度是否超标；执行层用除湿机或通风扇动作。四模块协同实现自动除湿。","al":{"考查点":"四大模块迁移到新场景（应用）。","解题思路":"四模块各配设备：感知=温湿度传感器测书库潮气；网络=无线模块传到管理电脑；处理=程序判断湿度是否超标；执行=除湿机/通风扇动作。","易错警示":"除湿机是执行不是感知；每层要至少写出一个具体设备。","方法点拨":"迁移设计题“四模块×一设备”矩阵填写，设备要与职责严格对应。"}},{"sec":"拓展挑战","type":"拓展","num":2,"text":"评价：同桌把“发现图书发霉”写成感知层职责，把“报警响铃”也写成感知层。请指出错误并说明正确划分。","opts":[],"subs":[],"ans":"错误：感知层只负责“探测数据”，不负责“解释现象”也不负责“动作”。发霉是数据超标后的结果（判断），属处理层；响铃是动作，属执行层。正确：感知=传感器测湿度，处理=比对阈值判断超标，执行=响铃提醒。","al":{"考查点":"模块职责错放的批改（评价）。","解题思路":"先判错：感知层只负责“探测数据”，不负责“解释现象”（那是处理）也不负责“动作”（那是执行）；再给正解：感知=测湿度、处理=比对阈值判断超标、执行=响铃。","易错警示":"“发现发霉”是判断结果不是感知动作——感知只出数据。","方法点拨":"批改题先亮“职责边界”再逐条归位，感知看、处理想、执行动。"}},{"sec":"变式闯关","type":"变式","num":1,"text":"换一个场景：人体也是一个“物联系统”——皮肤感知冷热、神经传信号、大脑判断、肌肉动作。请对应到四大模块，并说明它和我们课堂框图的相同之处。","opts":[],"subs":[],"ans":"皮肤=感知层，神经=网络层，大脑=处理层，肌肉=执行层。相同处：都是“感知—传输—处理—执行”的分工协作结构，与课堂框图同构。","al":{"考查点":"四模块儿童化科普工具设计（创造）；跨课迁移——职责准确性与可理解性的统一。","解题思路":"三段作答：①四模块比喻——感知层像“眼睛鼻子”（感觉环境）、网络层像“电话线”（传消息）、处理层像“大脑”（想怎么办）、执行层像“手脚”（去干活）；②拆解一台校园设备（智能饮水机：水位/水温传感→主板网络→判断加热出水→执行加热/出水阀）；③展板标语邀请同学动手拆解。","易错警示":"比喻要准确（执行层别比喻成“大脑”）；设备拆解四步与模块职责要一一对上。","方法点拨":"儿童科普题“比喻+实例+邀请”三段，比喻以身体器官为锚最易懂。"}},{"sec":"间隔复习","type":"间隔","num":1,"text":"上节课我们体验了面容识别开锁。请回忆：识别过程大体分为哪几步？","opts":[],"subs":[],"ans":"（第15课《面容钥匙显智能》）　大体四步：采集人脸图像→提取特征→与数据库中已登记特征比对→根据相似度放行或拒绝。","al":{"考查点":"人脸识别流程（识记）。","解题思路":"流程链\"采—提—比—判\"：先成像，再数字化为特征，然后比对，最后决策。","易错警示":"以为摄像头\"认人\"是一步完成——实际中间有特征提取与比对两步。","方法点拨":"按\"采提比判\"四字链复述，配合开锁体验回忆。"}},{"sec":"间隔复习","type":"间隔","num":2,"text":"与传统钥匙开锁相比，面容识别的优势与风险各写一条。","opts":[],"subs":[],"ans":"（第15课《面容钥匙显智能》）　优势：免携带、不可转借，\"脸就是钥匙\"更便捷且不易被冒用；风险：人脸属生物特征信息，一旦数据库泄露无法像密码那样更换，存在被滥用的长期风险。","al":{"考查点":"生物识别的利弊权衡（评价）。","解题思路":"优势从\"便捷性+唯一性\"谈，风险从\"不可更改性+隐私\"谈，两面都要落到具体。","易错警示":"只答\"方便\"与\"不安全\"太空泛，须点出\"生物特征不可更换\"这一要害。","方法点拨":"利弊题模板：\"优势看体验，风险看泄露后果\"。"}},{"sec":"思维进阶","type":"挑战","num":1,"text":"学校“创客嘉年华”要你设计一张《物联系统模块划分卡》展板，向初一同学科普“任何智能设备都能拆成四大模块”。请写出：①四大模块各配一句孩子能懂的比喻（如感知层像“感觉器官”）；②选一种校园常见智能设备（如智能饮水机／自动门），用四模块拆解它“怎么工作”；③写一句展板标语，邀请同学用你的卡片去拆解身边的设备。","opts":[],"subs":[],"open":true,"ans":"参考设计要点：①四模块比喻：感知层像\"感觉器官\"（眼耳鼻收集信息）、网络层像\"神经与邮路\"（把信息传出去传回来）、处理层像\"大脑\"（分析判断做决定）、应用层像\"双手\"（真正去做事执行动作）；②智能饮水机四模块拆解：感知层——水位/温度传感器采集水量与水温；网络层——把数据传到控制板/云端；处理层——判断水位是否低于下限、水温是否达标；应用层——自动加水加热并在屏幕提示\"水已烧开\"；③展板标语示例：\"拆一拆身边的智能设备——感觉、神经、大脑、手，四步看穿它\"。","al":{"考查点":"开放创造：四模块模型的科普转化（创造+理解）","解题思路":"比喻须与模块职能同构；拆解实例四层齐全且动作符合真实设备；标语呼应\"拆解\"主题","易错警示":"把执行器当\"处理层\"——大脑与手要分清；实例流程缺一层即不完整","方法点拨":"拆解题公式：比喻同构、实例四层、标语点题。"}}]},{"t":"第 17 课 · 配套练习","n":"物联数据需采集","isExam":false,"qs":[{"sec":"回忆热身","type":"回忆","num":1,"text":"物联系统的数据来自传感器对物理量的____感知。","opts":[],"subs":[],"ans":"持续（连续）","al":{"考查点":"物联数据来源的识记（记忆）。","解题思路":"物联数据来自传感器对物理量的持续（连续）感知——系统实时在采，不是拍一次就完。","易错警示":"勿填“定时/偶尔”——“持续”强调不同断采集，是趋势分析的前提。","方法点拨":"“数据是采出来不是编出来”一句话记牢。"}},{"sec":"回忆热身","type":"回忆","num":2,"text":"采集打卡三要素是：定刻（何时测）、定点（在哪测）、____（带单位）。","opts":[],"subs":[],"ans":"定记","al":{"考查点":"采集打卡三要素的识记（记忆）。","解题思路":"三要素=定刻（何时测）、定点（在哪测）、定记（带单位地记）；题干已给前两，缺“定记”。","易错警示":"勿填“记录员/工具”——三要素专指定刻、定点、定记。","方法点拨":"“三定”口诀：定时、定点、定着记（带单位）。"}},{"sec":"基础巩固","type":"单选","num":1,"text":"关于“物联数据从哪来”，下列说法正确的是：","opts":[{"label":"A","text":"数据是人猜出来的"},{"label":"B","text":"数据来自传感器对环境的持续感知"},{"label":"C","text":"数据靠想象编"},{"label":"D","text":"数据只在发布时才产生"}],"subs":[],"ans":"答案B　数据来自传感器对环境的持续感知","al":{"考查点":"数据来源的理解（理解）。","解题思路":"物联数据=传感器对物理量（温湿度等）的持续感知，是真实采集而非猜测编造。","逐项剖析":"A 数据是人猜出来的：违背实证，排除；B 数据来自传感器对环境的持续感知：正确；C 数据靠想象编：排除；D 数据只在发布时才产生：数据先于发布存在，排除。","易错警示":"“编数据”是最严重的学术问题——数据必须真实采集。","方法点拨":"数据素养第一课：数据来自测量，不来自想象。"}},{"sec":"基础巩固","type":"单选","num":2,"text":"一条规范的采集记录应该是：","opts":[{"label":"A","text":"26.5"},{"label":"B","text":"今天有点热"},{"label":"C","text":"植物角内，9:40，25.8℃，湿度61%"},{"label":"D","text":"湿度大"}],"subs":[],"ans":"答案C　植物角内，9:40，25.8℃，湿度61%","al":{"考查点":"规范记录要素的判断（应用）。","解题思路":"规范记录=点位＋时刻＋数值＋单位四要素齐全，才能脱离上下文独立支撑决策。","逐项剖析":"A “26.5”：无数值单位无上下文，排除；B “今天有点热”：主观模糊，排除；C “植物角内，9:40，25.8℃，湿度61%”：四要素齐全，正确；D “湿度大”：主观无数值，排除。","易错警示":"“差不多30”这类模糊值不能用于决策——数据要精确到单位。","方法点拨":"写记录自查四要素：在哪、何时、多少、什么单位。"}},{"sec":"基础巩固","type":"单选","num":3,"text":"老师强调“连续记录几天”比“只测一次”好，主要因为：","opts":[{"label":"A","text":"多测几次更省事"},{"label":"B","text":"连续记录才能看见变化趋势"},{"label":"C","text":"一次测量不准"},{"label":"D","text":"录表更快"}],"subs":[],"ans":"答案B　连续记录才能看见变化趋势","al":{"考查点":"连续记录价值的理解（理解）。","解题思路":"趋势（如午后升温）需连续记录才能发现；单点只反映瞬间，而趋势才是系统判断依据。","逐项剖析":"A 多测更省事：与事实相反，排除；B 连续记录才能看见变化趋势：正确；C 一次测量不准：仪器若准单次也准，问题在代表性，排除；D 录表更快：排除。","易错警示":"别答“一次不准”——单次可能准但不代表整体，关键是“趋势看不见”。","方法点拨":"“一次是快照、一串才是电影”，判断依据看趋势。"}},{"sec":"基础巩固","type":"单选","num":4,"text":"用“模拟传感器＋教室温湿度计＋电子表格”采集，电子表格的作用是：","opts":[{"label":"A","text":"代替传感器感知"},{"label":"B","text":"把读数规范录入并保存成数据底稿"},{"label":"C","text":"自动浇水"},{"label":"D","text":"代替判断"}],"subs":[],"ans":"答案B　把读数规范录入并保存成数据底稿","al":{"考查点":"电子表格在采集中的角色（理解）。","解题思路":"电子表格=把读数规范录入并保存成数据底稿，是处理层的输入来源。","逐项剖析":"A 代替传感器感知：感知靠传感器，排除；B 把读数规范录入并保存成数据底稿：正确；C 自动浇水：执行层职责，排除；D 代替判断：判断靠处理层，排除。","易错警示":"工具定位别越权——表格只负责“存好数据”。","方法点拨":"按流程给工具定位：传感器采集→表格存数→程序处理，各管一段。"}},{"sec":"基础巩固","type":"判断","num":1,"text":"测一次温度就能代表植物角一整天的情况。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"单次测量代表性的判断（理解）。","解题思路":"环境随时在变，单次测量只是快照；多次连续记录才能反映真实规律，判断错误。","易错警示":"“测一次代表全天”是典型偷懒误区。","方法点拨":"判断题见“一次就够/代表整天”即错。"}},{"sec":"基础巩固","type":"判断","num":2,"text":"记录环境数据时，数值后面可以不写单位，反正大家都懂。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"记录必须带单位的判断（理解）。","解题思路":"没单位无法判断含义（26℃与26%完全不同），规范记录必须带单位，判断正确。","易错警示":"“反正大家都懂”是数据事故源头——跨人跨天必歧义。","方法点拨":"单位是数据的“度量衡身份证”，缺失即无效。"}},{"sec":"基础巩固","type":"判断","num":3,"text":"物联数据就是传感器把物理量持续感知后得到的真实记录。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"物联数据本质的判断（理解）。","解题思路":"物联数据=传感器把物理量持续感知后得到的真实记录，是判断与决策的原料，判断正确。","易错警示":"别混淆“数据”与“信息”——这里是说数据来源。","方法点拨":"“真实采集”四字是本题得分眼。"}},{"sec":"能力提升","type":"提升","num":1,"text":"请按“定刻—定点—定记”三步，写出你的温湿度采集方案（含2个以上点位与记录格式）。","opts":[],"subs":[],"ans":"定刻：每天9:40与15:40两测；定点：植物角内、外各1处；定记：按“点位＋时刻＋温度℃＋湿度%”格式录入，如“植物角内，9:40，25.8℃，61%”。","al":{"考查点":"“定刻—定点—定记”三步方案设计（应用）。","解题思路":"定刻：每天9:40与15:40两测；定点：植物角内、外各1处；定记：按“点位＋时刻＋温度℃＋湿度%”格式录入，并给出一行示例。","易错警示":"三要素要全且具体（含具体时刻、点位、格式示例），缺一即扣分。","方法点拨":"采集方案“三行式”作答：定刻写时间表、定点写位置表、定记写格式示例。"}},{"sec":"能力提升","type":"提升","num":2,"text":"比一比：同是25℃，A组记“25”，B组记“植物角内，9:40，25.0℃，60%”。哪种更有用？为什么？","opts":[],"subs":[],"ans":"B更有用。B带点位、时刻、单位，是可支撑决策的信息；A是孤立数字，脱离上下文，无法比较也无法判断。","al":{"考查点":"规范记录信息量的对比（应用·分析）。","解题思路":"B更有用：带点位、时刻、单位，是可支撑决策的信息；A是孤立数字，脱离上下文无法比较判断。","易错警示":"只答“B好”不解释“为什么”会失分——要点出上下文价值。","方法点拨":"“数据 vs 信息”对比题：数据裸奔无上下文，信息带全语境能决策。"}},{"sec":"能力提升","type":"提升","num":3,"text":"分析：小明说“我下午补测一下就行，不用每天同一时刻”。请说明为什么“同一时刻”很重要，并指出跨天记录还要注意什么。","opts":[],"subs":[],"ans":"同一时刻测才有可比性（控制变量），否则上午与午后混在一起看不出真实变化；跨天还要注意天气、点位一致，避免晴天雨天数据混用污染结论。","al":{"考查点":"控制变量与跨天可比性（分析）。","解题思路":"同一时刻测才有可比性（控制变量），否则上午午后混在一起看不出真实变化；跨天还要注意天气与点位一致，避免晴雨数据混用污染结论。","易错警示":"只答“要同时测”不给理由；跨天注意点（天气/点位）是加分采分点。","方法点拨":"科学采集两原则：变量控制（同刻）＋环境一致（同点同天气）。"}},{"sec":"能力提升","type":"提升","num":4,"text":"设计：为“班级植物角”设计一张采集打卡表，列出至少3个必填栏目，并说明每一栏的作用。","opts":[],"subs":[],"ans":"栏目：点位（记录在哪测，保证一致）、时刻（保证同刻可比）、温度℃（数值＋单位）、湿度%RH（数值＋单位）、记录员（责任到人）。每栏对应数据规范与复核追溯。","al":{"考查点":"采集打卡表设计（应用·创造）。","解题思路":"栏目至少3个并说明作用：点位（保证测点一致）、时刻（保证同刻可比）、温度℃/湿度%RH（数值+单位）、记录员（责任到人）。","易错警示":"只列表头不写“作用”会漏分——每栏都要有设计意图。","方法点拨":"表头设计“栏目+作用”成对写，等于给自己加了规范约束。"}},{"sec":"拓展挑战","type":"拓展","num":1,"text":"情境：奶奶看你天天拿温度计跑植物角，说“测一次不就完了，天天跑干嘛”。请用“一次≠持续”的道理，向奶奶说明为什么连续记录更有用。","opts":[],"subs":[],"ans":"奶奶，下午植物角会比早上热很多，只测一次永远不知道它午后会不会“中暑”。连续几天同一时刻记下来，就能看出一天里啥时候最热、该不该补水——这正是系统后来自动判断的依据。","al":{"考查点":"把持续采集道理讲给长辈（应用·表达）。","解题思路":"用生活化因果解释：下午比早上热，只测一次不知道会不会“中暑”；连续几天同一时刻记录才能看出规律，这正是系统自动判断的依据。","易错警示":"不要堆术语——用“中暑/补水”这类生活词让奶奶秒懂。","方法点拨":"“讲给长辈”题三步：举个变化例子→说清单次局限→落到持续价值。"}},{"sec":"拓展挑战","type":"拓展","num":2,"text":"评价：某组打卡表上写着“植物角，热，差不多30”。请指出它违反了哪几条规范，并给出改写为规范的写法。","opts":[],"subs":[],"ans":"违反：缺精确数值（写“差不多30”不精确）、缺单位、缺时刻、表述模糊。改写：“植物角内，15:40，30.2℃，58%RH”。规范记录要精确、带单位、带时刻。","al":{"考查点":"不规范记录的批改（评价）。","解题思路":"指出违规：缺精确数值（“差不多30”）、缺单位、缺时刻、表述模糊；改写为“植物角内，15:40，30.2℃，58%RH”。","易错警示":"批改要逐条列出问题（至少3条），再给完整改写。","方法点拨":"批记录题“问题清单+标准改写”两步，用“点位+时刻+数值+单位”模板校验。"}},{"sec":"变式闯关","type":"变式","num":1,"text":"换一个场景：妈妈烤面包靠“差不多”旋钮，今天焦了明天生。请模仿采集规范，说明若用电子温控并记录“时刻＋温度℃”，能解决什么问题。","opts":[],"subs":[],"ans":"记录“时刻＋温度℃”可复现每次烘烤条件，今天与明天设置可对比，温度偏高能及时发现并调低；数据闭环让面包稳定一致，不再“差不多”。","al":{"考查点":"采集规范迁移生活场景（应用）。","解题思路":"记录“时刻＋温度℃”可复现每次烘烤条件：今天与明天设置可对比，温度偏高能及时发现调低——数据闭环让面包稳定一致，告别“差不多”。","易错警示":"迁移落点要写“可复现/可对比”而不只是“更精确”。","方法点拨":"规范记录的本质价值=可复现、可对比、可调优，任何场景同理。"}},{"sec":"间隔复习","type":"间隔","num":1,"text":"第16课我们把系统分成四大模块。请写出其中“感知层”的职责，并说明本课“持续采集温湿度数据”是由哪一层来完成的。","opts":[],"subs":[],"ans":"（第16课《模块功能先划分》）　感知层负责用传感器采集环境数据（探环境）。本课用温湿度计持续记录温湿度，正是感知层的工作；采集到的数据随后经网络层传走，由处理层分析。","al":{"考查点":"持续采集装置的活动设计（创造）；跨课迁移——数据素养科普化。","解题思路":"三段作答：①选环境量（光照）配传感器（光线传感器）并说明持续感知什么；②设计打卡记录卡栏目（点位/时刻/光照值lux/记录员），让参观者连记早9点、午12点、下午4点三次；③寄语点明“记一次不够”——同地不同刻差很多。","易错警示":"记录卡要有单位与时刻栏（规范）；寄语要点名“持续”的价值而非泛泛鼓励。","方法点拨":"科普活动设计“一量一感一卡一寄语”，体验者动手记三次即领悟持续意义。"}},{"sec":"思维进阶","type":"挑战","num":1,"text":"学校科技节要办“数据从哪来”科普展，请你设计一个“持续采集小装置”体验活动：①选一种校园环境量（如光照／噪音／温度），说明用什么传感器持续感知；②设计一张“打卡记录卡”（画或描述表格列名），让参观同学能规范记录3次数据；③写一句给参观者的话，说明“为什么记一次不够”。","opts":[],"subs":[],"open":true,"ans":"参考设计要点：①选光照强度：用光照传感器（光敏模块）持续感知，设定每15分钟自动记录一次，覆盖早中晚与阴晴天；②打卡记录卡列名：日期|时刻|光照值(lx)|天气|记录人签名——参观者现场读数并规范填写3次；③给参观者的话：\"一次读数只是一个瞬间的快照，可能恰好赶上一朵云；持续记录才能看到一天的规律、一周的趋势——数据越多，规律越可信\"。","al":{"考查点":"开放创造：持续采集的体验设计（创造+应用）","解题思路":"传感器与被测量匹配；记录卡字段支撑\"规范记录\"（含单位与签名）；第③问点出\"单点vs规律\"的统计思想","易错警示":"记录卡没有单位列——数据不成数据；理由只写\"多记好\"没有统计学依据","方法点拨":"采集体验题公式：传感器对路、卡片可填、理由讲\"点与线\"。"}}]},{"t":"第 18 课 · 配套练习","n":"数据分析与处理","isExam":false,"qs":[{"sec":"回忆热身","type":"回忆","num":1,"text":"数据处理“四步法”是：清洗异常→排序→计算极值平均→____规律。","opts":[],"subs":[],"ans":"提炼（炼）","al":{"考查点":"数据处理四步法的识记（记忆）。","解题思路":"四步=清洗异常→排序→计算极值平均→提炼规律；题干已给前三步，第四步“提炼（规律）”。","易错警示":"勿填“可视化/报告”——提炼是把区间结论“炼”出来，可视化在下一步。","方法点拨":"“洗—排—算—炼”四字诀，按顺序默写不跳步。"}},{"sec":"回忆热身","type":"回忆","num":2,"text":"在电子表格中，求一组温度的平均值时常用的函数是____。","opts":[],"subs":[],"ans":"AVERAGE","al":{"考查点":"电子表格求平均函数的识记（记忆）。","解题思路":"求平均值用AVERAGE函数（=AVERAGE(区域)），是表格统计最常用函数之一。","易错警示":"勿混 MAX（最大）/MIN（最小）/SUM（求和）——按“求平均”锁定AVERAGE。","方法点拨":"函数三兄弟“AVERAGE平均、MAX最大、MIN最小”，配 SUM 求和成一套。"}},{"sec":"基础巩固","type":"单选","num":1,"text":"老师把“原始数据表”比作“没煮的米”，意思是：","opts":[{"label":"A","text":"数据已经能直接用"},{"label":"B","text":"原始数据需清洗计算才能变成有用信息"},{"label":"C","text":"米比数据重要"},{"label":"D","text":"表格像米饭"}],"subs":[],"ans":"答案B　原始数据需清洗计算才能变成有用信息","al":{"考查点":"“数据是米、信息是饭”类比的理解（理解）。","解题思路":"原始数字只是“米”，须经清洗、计算、提炼成规律（饭）才是能指导决策的信息。","逐项剖析":"A 数据已经能直接用：原始数据需加工，排除；B 原始数据需清洗计算才能变成有用信息：正确；C 米比数据重要：类比无关，排除；D 表格像米饭：表格是容器不是成品，排除。","易错警示":"“数据≠信息”是本课灵魂——数字到结论之间隔着加工。","方法点拨":"“米要煮成饭”喻记：数据加工成信息，才能端上决策桌。"}},{"sec":"基础巩固","type":"单选","num":2,"text":"处理数据第一步“清洗”是指：","opts":[{"label":"A","text":"把表格洗干净"},{"label":"B","text":"识别并剔除或标注异常值"},{"label":"C","text":"删除所有小数"},{"label":"D","text":"给数据加水印"}],"subs":[],"ans":"答案B　识别并剔除或标注异常值","al":{"考查点":"“清洗”步骤含义的理解（理解）。","解题思路":"清洗=识别并剔除或标注明显偏离的异常值（如探头发烫的35℃），避免污染结论。","逐项剖析":"A 把表格洗干净：字面玩笑，排除；B 识别并剔除或标注异常值：正确；C 删除所有小数：破坏数据，排除；D 给数据加水印：无关，排除。","易错警示":"清洗是“去噪”不是“删数据”——异常要标注待查而非悄悄删。","方法点拨":"清洗原则“先标注、再决定、留记录”，保证过程可追溯。"}},{"sec":"基础巩固","type":"单选","num":3,"text":"想看“这一周哪天最热”，应该用哪个函数或操作：","opts":[{"label":"A","text":"AVERAGE"},{"label":"B","text":"MAX（求最大值）"},{"label":"C","text":"筛选只看湿度"},{"label":"D","text":"排序看文字"}],"subs":[],"ans":"答案B　MAX（求最大值）","al":{"考查点":"按需求选函数（应用）。","解题思路":"“哪天真最热”=求最高温，用MAX（求最大值）；AVERAGE求平均、筛选按条件提取。","逐项剖析":"A AVERAGE：那是平均值，排除；B MAX求最大值：正确；C 筛选只看湿度：与温度问题无关，排除；D 排序看文字：排序不能直接出最大值，排除。","易错警示":"问题问“最”字对应极值函数：最热=MAX、最冷=MIN。","方法点拨":"题干抓字眼：“平均”=AVERAGE、“最/极值”=MAX/MIN、“占比”=饼图。"}},{"sec":"基础巩固","type":"单选","num":4,"text":"处理后得到“植物喜欢25-28℃、湿度55-65%”，这叫：","opts":[{"label":"A","text":"原始数据"},{"label":"B","text":"异常值"},{"label":"C","text":"提炼出的规律（信息）"},{"label":"D","text":"传感器读数"}],"subs":[],"ans":"答案C　提炼出的规律（信息）","al":{"考查点":"数据与信息区别的应用（理解）。","解题思路":"“植物喜欢25-28℃”是经清洗计算提炼出的结论性区间=信息，能直接指导系统判断。","逐项剖析":"A 原始数据：区间已是加工产物，排除；B 异常值：排除；C 提炼出的规律（信息）：正确；D 传感器读数：那是数据起点，排除。","易错警示":"别把“区间结论”误当原始数据——它是加工后的信息。","方法点拨":"区分数据与信息：能直接指导“该不该做”的就是信息。"}},{"sec":"基础巩固","type":"判断","num":1,"text":"原始记录就是信息，可以直接用来决定浇不浇水。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"数据与信息之辨（理解）。","解题思路":"原始记录只是数据，须经清洗计算提炼成规律才是信息，才能支撑决策，判断错误。","易错警示":"“记录即信息”混淆两概念，判断直接错。","方法点拨":"判断题见“原始就是信息/可直接用”即错。"}},{"sec":"基础巩固","type":"判断","num":2,"text":"发现某行温度明显偏高且查实是探头发烫，应先标注异常再计算。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"清洗优先原则的判断（理解）。","解题思路":"发现偏高且查实是探头发烫，应先标注异常再计算——先去噪再算，避免垃圾进垃圾出，判断正确。","易错警示":"“查实后仍不标注直接算”会污染结论。","方法点拨":"GIGO原则（垃圾进垃圾出）：清洗在计算前。"}},{"sec":"基础巩固","type":"判断","num":3,"text":"平均值能代表整体，所以算完平均就不用看最高最低了。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"平均值与极值互补的判断（理解）。","解题思路":"极值揭示波动范围（如午后高温风险），只看平均会漏关键风险，须结合极值判断，判断错误。","易错警示":"“平均代表一切”是统计盲区——平均掩盖极端。","方法点拨":"看数据要“均+极”双视角：平均看整体、极值看风险。"}},{"sec":"能力提升","type":"提升","num":1,"text":"请写出“四步处理法”每一步做什么，并说明最后一步得到的“规律”长什么样。","opts":[],"subs":[],"ans":"一洗（识别标注异常值）、二排（排序看分布）、三算（MAX／MIN／AVERAGE计算）、四炼（提炼适宜区间）。规律形如“植物喜欢25-28℃、湿度55-65%”，是可指导判断的结论。","al":{"考查点":"四步处理法的完整表述（应用）。","解题思路":"一步一说明：一洗（识别标注异常）、二排（排序看分布）、三算（MAX/MIN/AVERAGE计算）、四炼（提炼适宜区间），并举例规律形如“植物喜欢25-28℃、湿度55-65%”。","易错警示":"最后一步“规律长什么样”要举例，空谈“得到结论”不给分。","方法点拨":"四步题“步骤+动作+示例”写法：每步一句干什么，末步给区间例。"}},{"sec":"能力提升","type":"提升","num":2,"text":"补全计算：给定一组午后温度［24，31，25，24.5，35，26］，请先指出异常值，再算其余的平均与最高。","opts":[],"subs":[],"ans":"异常值：35℃（明显偏高，疑似探头发烫）。其余平均≈（24＋31＋25＋24.5＋26）÷5＝26.1℃；最高为31℃。说明清洗后再算才可信。","al":{"考查点":"异常识别与清洗后计算（应用）。","解题思路":"先识别异常：35℃明显偏高（疑似探头发烫）；剔除后求其余5个的平均（24+31+25+24.5+26）÷5=26.1℃，最高31℃；说明清洗后再算才可信。","易错警示":"直接把35算进平均会拉高结果——先剔异常再算。","方法点拨":"计算题“先圈异常→剔除→再算→一句话解释为何可信”，步骤完整。"}},{"sec":"能力提升","type":"提升","num":3,"text":"分析：两组得出“植物喜欢区间”略有不同（甲25-28℃、乙26-29℃）。请说明可能原因，并指出最终写进报告该怎么处理。","opts":[],"subs":[],"ans":"原因：点位不同、采样日天气不同、是否清洗异常有差异。处理：统一写“本植物角区间”，注明点位与日期，取较稳的区间；差异本身正常，关键是数据可追溯。","al":{"考查点":"两组结论差异的原因分析（分析）。","解题思路":"原因从三处找：点位不同、采样日天气不同、是否清洗异常有差异；处理=注明点位与日期、取较稳区间、保证可追溯，差异本身正常。","易错警示":"只写“一组错了”太武断——要先列可追溯的原因再给处理法。","方法点拨":"“结论打架”题：先找变量差异（点/时/清洗），再统一口径写报告。"}},{"sec":"能力提升","type":"提升","num":4,"text":"设计：为“植物角环境规律发现单”设计栏目，至少含4项，并说明每项填什么。","opts":[],"subs":[],"ans":"栏目：数据来源（哪几天哪几点）、清洗说明（剔除几条异常及原因）、关键计算（最高／最低／平均）、结论区间（适宜温湿度）、一句话故事。保证“数据变信息”全程可查。","al":{"考查点":"规律发现单栏目设计（应用·创造）。","解题思路":"栏目设计4+项并说明填法：数据来源（哪几天哪几点）、清洗说明（剔除几条及原因）、关键计算（最高/最低/平均）、结论区间（适宜温湿度）、一句话故事——保证“数据变信息”全程可查。","易错警示":"栏目要能支撑“可追溯”，只列“结论”一栏无法复核。","方法点拨":"发现单栏目对应四步法设计，让每一步都有落笔处。"}},{"sec":"拓展挑战","type":"拓展","num":1,"text":"情境：张大爷看你的数据表一头雾水：“一堆数，谁看得懂？”请用“数据变信息”的思路，把你的发现单讲成大爷听得懂的一句话加依据。","opts":[],"subs":[],"ans":"大爷，表上几十个数是“米”，我们煮成“饭”就是：您家植物角最舒服是25到28度、湿度五成半到六成半；依据是五天里中午最热31度、平均26度，低于22度苗就冷。照这个数浇水补光最稳。","al":{"考查点":"把数据结论讲给非专业听众（应用·表达）。","解题思路":"先给结论（植物角最舒服25-28℃、湿度五成半到六成半），再给依据（五天中午最热31℃、平均26℃，低于22℃苗就冷），全程用生活语言。","易错警示":"不要先堆数据再下结论——对长辈要先说人话结论。","方法点拨":"“数据变信息”表达法：结论先行+依据一句话+生活化单位（五成半）。"}},{"sec":"拓展挑战","type":"拓展","num":2,"text":"评价：同学小美直接拿原始表上最大数31℃当“适宜温度”去设报警。请指出错误并给出正确做法。","opts":[],"subs":[],"ans":"错误：极值≠适宜值，31℃是午后峰值甚至接近“中暑线”，不能当适宜温度。正确：先用四步法算出适宜区间（如25-28℃），再以区间上下限设报警阈值（超28报警、低于22补光）。","al":{"考查点":"极值误用为阈值的批改（评价）。","解题思路":"指出错误：极值≠适宜值——31℃是午后峰值甚至接近“中暑线”，不能当适宜温度；正确做法：先四步法算出适宜区间（25-28℃），再以区间上下限设报警阈值。","易错警示":"“取最大当阈值”会让系统永远报警——阈值必须来自适宜区间而非极值。","方法点拨":"阈值设计顺序：先算区间（信息）→再设阈值（动作边界），极值只用来发现风险。"}},{"sec":"变式闯关","type":"变式","num":1,"text":"换一个场景：体检报告里有一堆血项数字。请模仿“四步处理法”，说说医生怎么把“原始数值”变成“你健康与否”的结论。","opts":[],"subs":[],"ans":"先清洗（剔除仪器误读异常值），再排序看各项分布，算平均值并与参考区间比对（极值看是否超标），最后提炼结论“正常／需注意”。同样是从数据到信息的加工。","al":{"考查点":"四步法迁移体检场景（应用）。","解题思路":"对照迁移：先清洗（剔除仪器误读异常）、再排序看分布、算平均值并与参考区间比对（极值看超标）、最后提炼结论“正常/需注意”——同样是从数据到信息的加工。","易错警示":"迁移要“一步对一步”，不能只写“医生也会处理数据”。","方法点拨":"“异场景同方法”题用“先…再…最后…”把四步完整重演一遍。"}},{"sec":"间隔复习","type":"间隔","num":1,"text":"第17课我们强调“持续记录、带单位与时刻”。请结合本课“数据变信息”，说明如果记录时漏了单位，会对本课的计算与规律提炼造成什么麻烦。","opts":[],"subs":[],"ans":"（第17课《物联数据需采集》）　漏单位会让数值失去含义（如26到底是℃还是%RH无法区分），清洗与计算时可能把不同量混算，提炼出的“适宜区间”也就不可信——可见第17课的规范记录是本课处理的前提。","al":{"考查点":"数据故事成果模板设计（创造）；跨课迁移——数据叙事素养。","解题思路":"三段作答：①栏目设计能支撑“一眼看懂数据说了什么”（数据来源/清洗记录/关键计算/结论区间/一句故事）；②两个计算当证据——AVERAGE日均证“整体舒适”、MAX找午后峰值证“需遮阳”，证据与结论要配对；③寄语点破数据批判“一个数只是瞬间，一串数才讲真相”。","易错警示":"“证据”必须落在具体计算上（AVERAGE/MAX），不能只写“我观察发现”。","方法点拨":"数据叙事=结论有证据、证据有来源；模板栏目把全链路写透明。"}},{"sec":"思维进阶","type":"挑战","num":1,"text":"学校要评选“最美数据故事奖”，请你为“植物角一周环境报告”设计一张《规律发现单》模板，并向评委说明：①模板要有哪些栏目才能让人“一眼看懂数据说了什么”（至少4栏）；②你打算用哪两个计算（如平均、极值）当“证据”支撑结论；③写一句给全班的话，提醒大家“别被一个数骗了”。","opts":[],"subs":[],"open":true,"ans":"参考设计要点：①模板栏目（至少4栏）：数据图表（折线/柱状）、关键发现（一句话规律）、数据证据（支撑发现的计算值）、异常记录（离群值与原因说明），可加\"改进建议\"栏；②两个计算当证据：一周温度平均值对比（说明总体冷热水平）、最高/最低温及其出现时刻（极值说明波动范围与峰值时段）——结论由计算值支撑而非凭感觉；③提醒：\"别被一个数骗了——某个特别高的读数可能是仪器抖动或偶然事件，看平均、看范围、看趋势，才是一个数据的完整人生\"。","al":{"考查点":"开放创造：数据分析的呈现与统计思维（创造+分析）","解题思路":"栏目让\"数据→发现→证据\"链条可视化；两个计算与结论的对应关系明确；提醒指向\"离群值不轻易当规律\"","易错警示":"只有图表没有\"发现与证据\"栏；结论没有计算支撑","方法点拨":"数据故事题公式：四栏模板、计算做证据、警惕单点。"}}]},{"t":"第 19 课 · 配套练习","n":"数据呈现可视化","isExam":false,"qs":[{"sec":"回忆热身","type":"回忆","num":1,"text":"要看“温度随时间变化趋势”，应选用____图。","opts":[],"subs":[],"ans":"折线","al":{"考查点":"图表选型的识记（记忆）。","解题思路":"看“随时间变化趋势”选折线图——连点成线最能呈现走势。","易错警示":"别与柱状图混淆：趋势=折线、对比=柱状。","方法点拨":"选型口诀“看变化用折线，看对比用柱状，看占比用饼图”。"}},{"sec":"回忆热身","type":"回忆","num":2,"text":"让图表“会说话”的四件套是：标题、图例、坐标轴（含单位）和____。","opts":[],"subs":[],"ans":"数据标签","al":{"考查点":"图表四件套的识记（记忆）。","解题思路":"四件套=标题、图例、坐标轴（含单位）、数据标签；题干已给前三，缺“数据标签”。","易错警示":"勿填“颜色/边框”——四件套是信息要素不是装饰。","方法点拨":"“题例轴签”四件套口诀，画完自查一遍。"}},{"sec":"基础巩固","type":"单选","num":1,"text":"比较“五天里植物角内外的温度对比”，最适合的图是：","opts":[{"label":"A","text":"折线图"},{"label":"B","text":"柱状图"},{"label":"C","text":"饼图"},{"label":"D","text":"散点图"}],"subs":[],"ans":"答案B　柱状图","al":{"考查点":"分类对比的图型选择（应用）。","解题思路":"“内外温度对比”是分类对比，用柱状图；折线看趋势、饼图看占比。","逐项剖析":"A 折线图：适合趋势，排除；B 柱状图：分类对比最直观，正确；C 饼图：看占比，排除；D 散点图：看相关性，排除。","易错警示":"“对比分类”与“随时间变化”是两种题眼，选图前先判断。","方法点拨":"读题先问“比什么”：比类别用柱、看走势用折、看份额用饼。"}},{"sec":"基础巩固","type":"单选","num":2,"text":"想一眼看出“午后温度逐步升高”的趋势，该画：","opts":[{"label":"A","text":"柱状图比高低"},{"label":"B","text":"折线图看走势"},{"label":"C","text":"饼图看比例"},{"label":"D","text":"表格列数字"}],"subs":[],"ans":"答案B　折线图看走势","al":{"考查点":"趋势呈现的图型选择（应用）。","解题思路":"“午后温度逐步升高”是随时间的变化趋势，折线图连点成线最直观。","逐项剖析":"A 柱状图比高低：适合分类对比，排除；B 折线图看走势：正确；C 饼图看比例：排除；D 表格列数字：不直观，排除。","易错警示":"“逐步/趋势/走势”关键词出现即折线。","方法点拨":"题眼捕捉：见“变化/趋势/走势/逐渐”选折线。"}},{"sec":"基础巩固","type":"单选","num":3,"text":"一张“不会说话”的图，最可能缺的是：","opts":[{"label":"A","text":"漂亮颜色"},{"label":"B","text":"标题与图例"},{"label":"C","text":"很多数据"},{"label":"D","text":"大字号"}],"subs":[],"ans":"答案B　标题与图例","al":{"考查点":"“不会说话”图的归因（理解）。","解题思路":"缺标题与图例等规范要素，看图人不知说什么、哪条线代表啥——规范四件套才是沟通关键。","逐项剖析":"A 漂亮颜色：装饰非信息，排除；B 标题与图例：信息要素，正确；C 很多数据：数据多是好事不是“不会说话”主因，排除；D 大字号：无关，排除。","易错警示":"“图不会说话=缺规范要素”而非“数据不够多”。","方法点拨":"“会说话”诊断法：逐件核对标题/图例/轴签，缺谁补谁。"}},{"sec":"基础巩固","type":"单选","num":4,"text":"关于“图是装饰还是工具”，正确的是：","opts":[{"label":"A","text":"图好看就行不用管结论"},{"label":"B","text":"可视化服务于让人一眼看懂并决策"},{"label":"C","text":"图表越多越好"},{"label":"D","text":"手绘的图不算可视化"}],"subs":[],"ans":"答案B　可视化服务于让人一眼看懂并决策","al":{"考查点":"图是工具非装饰的理解（理解）。","解题思路":"可视化服务于让人一眼看懂并决策——规范与选型对，图才是工具；装饰不能替代规范。","逐项剖析":"A 好看就行不用管结论：本末倒置，排除；B 可视化服务于让人一眼看懂并决策：正确；C 图表越多越好：多而无效是负担，排除；D 手绘不算可视化：手绘坐标纸同样有效，排除。","易错警示":"“好看”是加分项不是目的——信息传达才是第一性。","方法点拨":"画图前先问“看完能做什么决定”，答不上来就是废图。"}},{"sec":"基础巩固","type":"判断","num":1,"text":"看变化趋势用柱状图，看分类对比用折线图。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"图型选配的判断（理解）。","解题思路":"说法把用途说反了：趋势用折线、对比用柱状——选错图会让读者误解，判断错误。","易错警示":"这是最高频的图表误区，反过来背就得分。","方法点拨":"口诀纠错：趋势=折线、对比=柱状，反说必错。"}},{"sec":"基础巩固","type":"判断","num":2,"text":"给图表加上标题、图例和坐标轴单位，它才真正“会说话”。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"四件套必要性的判断（理解）。","解题思路":"标题、图例、坐标轴单位让图说明“说什么、哪条线、什么单位”，是有效沟通前提，判断正确。","易错警示":"别嫌四件套麻烦——它们就是图表的“身份证”。","方法点拨":"“会说话=四件套齐”是判断题万能判定。"}},{"sec":"基础巩固","type":"判断","num":3,"text":"没有机房画图工具时，用坐标纸手绘折线图也是可视化。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"手绘是否算可视化的判断（理解）。","解题思路":"双轨保障人人产出：手绘坐标纸同样能呈现趋势——核心是选型与规范而非工具，判断正确。","易错警示":"别把“可视化”窄化为软件图表——纸笔也是可视化。","方法点拨":"判“是否可视化”看信息呈现，不看工具贵贱。"}},{"sec":"能力提升","type":"提升","num":1,"text":"请说出“选型口诀”，并为下列两个需求各选一种图并说明理由：甲看一周温度走势；乙比各点位同日湿度。","opts":[],"subs":[],"ans":"口诀：看变化用折线，看对比用柱状。甲选折线（随时间走势），乙选柱状（内／外分类对比）。","al":{"考查点":"选型口诀的应用（应用）。","解题思路":"先默写口诀“看变化用折线，看对比用柱状”，再逐题选型并给理由：甲一周温度走势→折线（随时间变化）；乙各点位同日湿度→柱状（点位分类对比）。","易错警示":"理由要与需求关键字绑定（“走势”对折线、“点位对比”对柱状）。","方法点拨":"选型题“口诀+需求关键词对应”两步走，理由即口诀的应用。"}},{"sec":"能力提升","type":"提升","num":2,"text":"补全一幅折线图的“四件套”：请你列明画“植物角午后升温趋势”图时必须标出的四项内容。","opts":[],"subs":[],"ans":"标题（如“植物角午后升温趋势”）、图例（哪条线代表温度）、坐标轴（横轴时间／纵轴温度℃）、数据标签（关键读数如峰值31℃）。","al":{"考查点":"折线图四件套的补全（应用）。","解题思路":"列明四项：标题（“植物角午后升温趋势”）、图例（哪条线代表温度）、坐标轴（横轴时间/纵轴温度℃）、数据标签（关键读数如峰值31℃）。","易错警示":"坐标轴必须写单位（℃），标签要举具体数值。","方法点拨":"四件套作答模板“标题+图例+轴（带单位）+标签（带数值）”。"}},{"sec":"能力提升","type":"提升","num":3,"text":"分析：某组把“五天平均温度”画成了饼图，结果大家看不懂。请说明错在哪，并给出正确画法。","opts":[],"subs":[],"ans":"错在图型：五天平均是随时间的变化（趋势），应用折线图而非饼图（饼图看占比）。正确：横轴写周一到周五、纵轴温度℃，连点成线看走势。","al":{"考查点":"图型错用的批改（分析·评价）。","解题思路":"指出错在选型：五天平均是随时间的变化（趋势），应用折线而非饼图（饼图看占比）；正确画法=横轴周一到周五、纵轴温度℃，连点成线看走势。","易错警示":"批改要讲清“为什么该用折线”（趋势）与“为什么饼图不行”（占比语义）。","方法点拨":"“错图批改”三步：说清图型语义→对照需求→给正确画法。"}},{"sec":"能力提升","type":"提升","num":4,"text":"设计：为“班级植物角环境播报”设计一张图表说明卡，写上“这张图说了什么”的一句话结论模板。","opts":[],"subs":[],"ans":"模板：“从__图可见，__（时段／点位）的__（温度／湿度）呈__（上升／对比）趋势，说明植物角__（需遮阳／需补水），建议__。”把数据结论转成行动建议。","al":{"考查点":"图表说明卡设计（应用·创造）。","解题思路":"模板句式：从__图可见__（时段/点位）的__（量）呈__（趋势/对比），说明植物角__（需遮阳/补水），建议__——把数据结论转成行动建议。","易错警示":"结论必须落到“建议行动”，图才闭环。","方法点拨":"“图+一句话结论”卡=选型+结论+行动三合一。"}},{"sec":"拓展挑战","type":"拓展","num":1,"text":"情境：校长只看图不看表。请你用一幅“植物角一周温度折线图”向校长讲一个环境故事，必须包含四件套并说出结论。","opts":[],"subs":[],"ans":"校长，这张“植物角一周温度折线图”（标题），蓝线为每日15:40实测（图例），纵轴温度℃横轴星期（坐标轴），峰值周三31℃（数据标签）。故事：午后持续偏高，周三最热，建议午后遮阳并依此设报警。一图胜过千言。","al":{"考查点":"用图向决策者讲故事（应用·表达）。","解题思路":"按四件套组织讲解：报标题（一周温度折线图）→说图例（蓝线=每日15:40实测）→指坐标轴（纵轴℃横轴星期）→点标签（峰值周三31℃）→给结论建议（午后遮阳+依此设报警）。","易错警示":"讲图要“报四件套+讲结论”，缺单位或图例即不完整。","方法点拨":"“向校长讲图”模板：标题一句、图例一句、轴一句、峰值一句、建议一句。"}},{"sec":"拓展挑战","type":"拓展","num":2,"text":"评价：同学把图做得花花绿绿却没标单位，还说“好看就行”。请指出问题并说明什么是“会说话的图”。","opts":[],"subs":[],"ans":"问题：缺单位与标题图例，读者不知纵轴是什么、线代表啥，是漂亮废图。会说话的图＝选型对（折线／柱状）＋四件套齐全，让人一眼读懂结论并支撑决策，装饰不能替代规范。","al":{"考查点":"“好看废图”的批改（评价）。","解题思路":"指出问题：缺单位、标题、图例，读者不知纵轴是什么、线代表啥——是漂亮废图；正解=选型对（折线/柱状）＋四件套齐，让人读懂并支撑决策。","易错警示":"“装饰不能替代规范”是核心论点，别只批颜色。","方法点拨":"批图三问：选型对吗？四件套齐吗？看完能决策吗？三问不过即废图。"}},{"sec":"变式闯关","type":"变式","num":1,"text":"换一个场景：天气预报工具用曲线显示一周气温。请模仿选型口诀，说明它为什么用折线而非柱状，并指出它图上的“单位”写在哪。","opts":[],"subs":[],"ans":"气温随日期变化是趋势，故用折线图；单位“℃”标在纵轴（坐标轴）上。和课堂“午后升温”同理，趋势类都用折线。","al":{"考查点":"图表选型迁移生活场景（应用）。","解题思路":"气温随日期变化是趋势，故用折线图；单位“℃”标在纵轴坐标轴上——与课堂“午后升温”同理，趋势类都用折线。","易错警示":"单位位置要答对（纵轴），这是常识也是采分点。","方法点拨":"迁移题反查“为什么同类”：抓“随时间变化=趋势=折线”的逻辑链。"}},{"sec":"间隔复习","type":"间隔","num":1,"text":"第18课你算出了“植物喜欢25-28℃”的规律。请结合本课知识，说明若要把这个结论讲给全校听，用一幅什么图最合适，并列出这幅图必须配齐的“四件套”。","opts":[],"subs":[],"ans":"（第18课《数据分析与处理》）　讲“区间规律”最适合用折线图展示区间走势（如各日温度折线＋适宜带）。四件套：标题（说明图意）、图例（哪条线／柱）、坐标轴（时间／温度℃，带单位）、数据标签（关键读数）。缺任一项图就不“会说话”。","al":{"考查点":"数据图叙事作品设计（创造）；跨课迁移——选型+规范+导语的三合一。","解题思路":"三段作答：①两图各选型并说理由——一周温度折线（看午后升温走势）、内外点位湿度柱状（看位置差异）；②每图配齐四件套清单（标题/图例/轴带单位/标签带数值）；③公众号导语要有钩子并点题（“周三最中暑”+“点开看数据怎么救绿植”）。","易错警示":"两图选型理由要不同（趋势vs对比）；四件套要列到具体内容而非只写名词。","方法点拨":"推送作品=一趋势图+一对比图+勾人导语，每图按四件套自查。"}},{"sec":"思维进阶","type":"挑战","num":1,"text":"学校公众号要发一篇《植物角的一周》，请你做一组“会说话的数据图”并写推送文案：①选两种图（各一幅）分别讲“趋势”和“对比”，说明各自选图理由；②为每幅图配齐“四件套”清单；③写一句公众号标题式导语，让没耐心的同学也愿意点开看。","opts":[],"subs":[],"open":true,"ans":"参考设计要点：①两图选择：折线图讲\"趋势\"——一周温度变化，理由：折线擅长展示随时间的升降起伏；柱状图讲\"对比\"——工作日与周末平均湿度对比，理由：柱状高低一眼比出大小差异；②四件套清单：标题（说清这张图讲什么）、坐标轴（含单位）、数据来源（谁测的、哪段时间）、结论标注（图上一句话点出发现）；③导语示例：\"植物角悄悄告诉你：这周它经历了23℃到28℃的‘过山车’——三张图看懂它的一周\"。","al":{"考查点":"开放创造：可视化选型与图表规范（创造+应用）","解题思路":"两图与\"趋势/对比\"一一对应且理由正确；四件套齐全；导语有数据点+悬念感","易错警示":"趋势用饼图、对比用折线——选型与目的错位；四件套漏\"数据来源\"削弱可信度","方法点拨":"可视化题公式：目的定图型、四件套配齐、导语勾人。"}}]},{"t":"第 20 课 · 配套练习","n":"反馈控制有算法","isExam":false,"qs":[{"sec":"回忆热身","type":"回忆","num":1,"text":"反馈控制的核心是“判断→动作→____”，形成闭环。","opts":[],"subs":[],"ans":"再感知（再看一眼）","al":{"考查点":"反馈控制闭环的识记（记忆）。","解题思路":"闭环核心=判断→动作→再感知（再看一眼），动作后回到感知形成循环。","易错警示":"勿填“结束/停止”——闭环的闭环点就在“再感知”。","方法点拨":"“看一眼—判断—动作—再看”循环链默写，环环相扣。"}},{"sec":"回忆热身","type":"回忆","num":2,"text":"描述“超阈值就报警”的控制逻辑，常用的条件分支写法是____。","opts":[],"subs":[],"ans":"if-else（如果…否则…）","al":{"考查点":"条件分支写法的识记（记忆）。","解题思路":"“超阈值就报警”用 if-else（如果…否则…）条件分支描述，是算法基本结构。","易错警示":"勿填“循环/顺序”——判断逻辑用分支；循环管重复执行。","方法点拨":"三大结构分工：顺序按部就班、分支看条件、循环转圈圈。"}},{"sec":"基础巩固","type":"单选","num":1,"text":"第16课框图“执行层”没有箭头回到感知层，说明系统：","opts":[{"label":"A","text":"已经完整"},{"label":"B","text":"还是开环，浇水后没人管后续"},{"label":"C","text":"不需要再感知"},{"label":"D","text":"自动完成所有事"}],"subs":[],"ans":"答案B　还是开环，浇水后没人管后续","al":{"考查点":"开环缺口的识别（理解）。","解题思路":"执行层没有箭头回感知层=缺“再感知”回路，系统是开环——浇完水没人管后续。","逐项剖析":"A 已经完整：缺回路不算完整，排除；B 还是开环，浇水后没人管后续：正确；C 不需要再感知：闭环必需要，排除；D 自动完成所有事：开环做不到自适应，排除。","易错警示":"“画完四框≠系统完整”——缺回箭头就是开环。","方法点拨":"检查闭环看箭头：有没有从执行层指回感知层的回路。"}},{"sec":"基础巩固","type":"单选","num":2,"text":"用阈值判断描述“温度超28℃报警”，正确的是：","opts":[{"label":"A","text":"if 温度>28℃ then 报警"},{"label":"B","text":"if 温度好看 then 报警"},{"label":"C","text":"温度高就报警（无数值）"},{"label":"D","text":"一直报警"}],"subs":[],"ans":"答案A　if 温度>28℃ then 报警","al":{"考查点":"阈值判断的规范表达（应用）。","解题思路":"算法要量化阈值并用 if-then 表达：“温度>28℃则报警”写成 if 温度>28℃ then 报警。","逐项剖析":"A if 温度>28℃ then 报警：量化+分支正确；B if 温度好看 then 报警：模糊词不可执行，排除；C 温度高就报警（无数值）：无数值不精确，排除；D 一直报警：无判断逻辑，排除。","易错警示":"“高/低/渴了”等模糊词机器听不懂——阈值必须数字化。","方法点拨":"写算法自查：条件里有没有具体数值？没有就补。"}},{"sec":"基础巩固","type":"单选","num":3,"text":"流程图里表示“条件判断”应该用：","opts":[{"label":"A","text":"圆角矩形（起止）"},{"label":"B","text":"菱形（判断）"},{"label":"C","text":"矩形（处理）"},{"label":"D","text":"圆形"}],"subs":[],"ans":"答案B　菱形（判断）","al":{"考查点":"流程图符号规范的识记（记忆）。","解题思路":"条件判断用菱形；起止用圆角矩形、处理用矩形，符号各有规范。","逐项剖析":"A 圆角矩形（起止）：那是起止框，排除；B 菱形（判断）：正确；C 矩形（处理）：那是处理框，排除；D 圆形：无此规范，排除。","易错警示":"菱形与矩形最易混：有岔路的是菱形，一路到底的是矩形。","方法点拨":"符号歌“起止圆角、判断菱形、处理矩形、箭头流向”。"}},{"sec":"基础巩固","type":"单选","num":4,"text":"闭环与开环的本质区别是：","opts":[{"label":"A","text":"闭环颜色更漂亮"},{"label":"B","text":"闭环在执行后再次感知形成回路"},{"label":"C","text":"开环用更多传感器"},{"label":"D","text":"闭环不需要判断"}],"subs":[],"ans":"答案B　闭环在执行后再次感知形成回路","al":{"考查点":"闭环与开环的本质区别（理解）。","解题思路":"闭环=动作后回到感知再判断（转圈），开环做一次就结束——是否“再感知”是本质差别。","逐项剖析":"A 闭环颜色更漂亮：无关，排除；B 闭环在执行后再次感知形成回路：正确；C 开环用更多传感器：与传感器数量无关，排除；D 闭环不需要判断：闭环更要判断，排除。","易错警示":"“更智能=更多传感器”是误解——闭环与否看回路不看设备数量。","方法点拨":"一句话判环：执行后还会“回头再看”就是闭环。"}},{"sec":"基础巩固","type":"判断","num":1,"text":"算法就是一段描写步骤的散文，写清楚就行。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"算法规范性的判断（理解）。","解题思路":"算法须是可机器执行的分支逻辑，含条件判断与回路；散文式描述无法执行，判断错误。","易错警示":"“写清楚就行”把算法当作文——可执行才是标准。","方法点拨":"判“是不是算法”问：机器能照着跑吗？不能即不是。"}},{"sec":"基础巩固","type":"判断","num":2,"text":"“温度低于22℃就补光”可以写成 if 温度<22℃ then 补光。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"阈值分支写法的判断（应用）。","解题思路":"“温度低于22℃就补光”可写成 if 温度<22℃ then 补光——量化阈值+if-then 可执行，判断正确。","易错警示":"注意不等号方向：低于=小于（<）。","方法点拨":"把中文“低于/超过/达到”翻译成<、>、≥，翻译对即对。"}},{"sec":"基础巩固","type":"判断","num":3,"text":"系统浇完水就结束了，不需要再看温度降没降。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"开环缺口的判断（理解）。","解题思路":"浇完水就结束=开环，温度还高也无人管；真实反馈控制执行后要再感知形成闭环，判断错误。","易错警示":"“做完就完事”正是开环思维，考试常考。","方法点拨":"判断题见“做完就结束/不用再看”即错（开环）。"}},{"sec":"能力提升","type":"提升","num":1,"text":"请写出“阈值判断模板”（以温度为例），并说明边界“等于28℃算超吗”怎么取。","opts":[],"subs":[],"ans":"if 温度>28℃ then 报警；else if <22℃ then 补光；else 正常。边界取“安全侧”：等于28不报警（不超），等于22不补光，避免临界抖动。","al":{"考查点":"阈值判断模板与边界处理（应用）。","解题思路":"模板：if 温度>28℃ then 报警；else if <22℃ then 补光；else 正常；边界取“安全侧”：等于28不报警、等于22不补光，避免临界抖动。","易错警示":"“等于算不算”是边界题采分点——先定安全侧再答。","方法点拨":"写边界规则用“安全侧原则”：临界值偏向不触发，防反复开关。"}},{"sec":"能力提升","type":"提升","num":2,"text":"补全流程图：请描述“超限报警／自动补光”算法的流程（用文字画出步骤与回路）。","opts":[],"subs":[],"ans":"起→判断温度→（>28）报警；（<22）补光；（正常）不动→回到“再感知温度”，形成回路。判断用菱形，动作与感知用矩形，首尾圆角。","al":{"考查点":"算法流程的文字绘制（应用）。","解题思路":"文字流程：起→判断温度→(>28)报警；(<22)补光；(正常)不动→回到“再感知温度”成回路；判断用菱形、动作与感知用矩形、起止圆角。","易错警示":"“回到再感知”的回箭头是闭环关键，漏了就是开环。","方法点拨":"文字流程图把“回箭头”写成“→回到再感知”，符号规范一并注明。"}},{"sec":"能力提升","type":"提升","num":3,"text":"分析：某同学画的流程图“报警一次就结束”，请指出问题并说明如何改成闭环。","opts":[],"subs":[],"ans":"问题：缺“再感知”回路，属开环，温度再高无人管。改法：报警后加箭头回到“感知／判断”框，使系统持续监测，构成“看一眼—判断—动作—再看”的闭环。","al":{"考查点":"开环流程图的批改（分析·评价）。","解题思路":"指出问题：缺“再感知”回路属开环，报警一次温度再高无人管；改法=报警后加箭头回“感知/判断”框，构成“看一眼—判断—动作—再看”闭环。","易错警示":"批改要落到“加回箭头”这个具体修改动作。","方法点拨":"“改开环为闭环”统一改法：动作后加“回到感知”箭头。"}},{"sec":"能力提升","type":"提升","num":4,"text":"设计：为植物角再加“土壤干则浇水”功能，写出它的if-else分支并说明如何接入现有闭环。","opts":[],"subs":[],"ans":"if 土壤湿度<阈值 then 开水阀浇水；else 关闭。接入：与温度分支并列，都从“感知”框引出判断，动作后统一回到再感知，共用同一闭环。","al":{"考查点":"新功能接入闭环的设计（应用·创造）。","解题思路":"if 土壤湿度<阈值 then 开水阀浇水；else 关闭；接入=与温度分支并列，都从“感知”框引出判断，动作后统一回再感知，共用同一闭环。","易错警示":"新分支要“接入现有闭环”而不是另起炉灶——共用一个再感知回路。","方法点拨":"加功能三步：写分支→并入判断框→共享回感知回路。"}},{"sec":"拓展挑战","type":"拓展","num":1,"text":"情境：爸爸问“补光灯为啥自己亮自己灭”。请用闭环思想，把“温度低→补光→再看”的回路讲成他听得懂的话。","opts":[],"subs":[],"ans":"爸，系统像有记性：温度传感器一直盯着，一低于22度，处理层就命令补光灯亮；亮一会儿它再“看一眼”，温度上来了就灭。这个“看一眼—判断—动作—再看”的圈，就是反馈控制，让它自己稳下来。","al":{"考查点":"用闭环思想解释设备自行动作（应用·表达）。","解题思路":"把系统人格化为“有记性”：传感器一直盯着，低于22℃处理层就命令补光灯亮；亮一会儿再“看一眼”，温度上来就灭——“看一眼—判断—动作—再看”的圈就是反馈控制。","易错警示":"解释要体现“再感知”这一环，讲成只亮不灭就是开环。","方法点拨":"讲闭环给长辈：“它像有记性的人，做完还要回头看”。"}},{"sec":"拓展挑战","type":"拓展","num":2,"text":"评价：小新写算法“if 植物渴了 then 浇水”，被老师退回。请指出不合规处，并帮他改成可执行的写法。","opts":[],"subs":[],"ans":"不合规：“渴了”是模糊词，不可机器执行，也没量化阈值。改法：if 土壤湿度<30%RH then 开水阀浇水；else 关闭。用数值阈值＋if-then，算法才可被系统执行。","al":{"考查点":"模糊算法的批改（评价）。","解题思路":"指出不合规： “渴了”是模糊词不可机器执行、没量化阈值；改写：if 土壤湿度<30%RH then 开水阀浇水；else 关闭。","易错警示":"批改“指出+改写”缺一不可；改写必须含数值阈值。","方法点拨":"模糊→精确三步：找模糊词（渴了/热了）→量化阈值（<30%）→套if-then。"}},{"sec":"变式闯关","type":"变式","num":1,"text":"换一个场景：人体遇烫会缩手——皮肤感知、神经传信、脊髓判断、肌肉缩回，且之后还会再感知。请对应到反馈控制闭环的四个环节。","opts":[],"subs":[],"ans":"皮肤感知温度（感知）→神经传信号（传输／判断输入）→脊髓判断“危险”（处理）→肌肉缩手（执行）→再感知是否还烫（再感知），构成生物版闭环，与物联系统同构。","al":{"考查点":"反馈控制闭环迁移生物反射（应用）。","解题思路":"对应四环节：皮肤感知温度（感知）→神经传信号（传输）→脊髓判断“危险”（处理）→肌肉缩手（执行）→再感知是否还烫（再感知）——生物版闭环与物联系统同构。","易错警示":"“再感知”环节易漏——缩手后还会再试探就是生物的回环。","方法点拨":"跨域找闭环：凡“动作后有回头检查”即闭环，人体反射是最佳例证。"}},{"sec":"间隔复习","type":"间隔","num":1,"text":"第19课你用图表讲了“植物角午后升温”。请结合本课，说明如果想让系统“午后自动遮阳”，需要把第19课发现的什么结论转成算法的什么部分。","opts":[],"subs":[],"ans":"（第19课《数据呈现可视化》）　把第19课折线图发现的“午后峰值常超28℃”转成本课算法的阈值：if 温度>28℃ then 遮阳／报警。也就是说，可视化的结论要变成if-else的判断条件，系统才能自动反应，完成闭环。","al":{"考查点":"自动守护算法的完整设计（创造）；跨课迁移——阈值+分支+闭环三位一体。","解题思路":"三段作答：①监控量配阈值——温度>28℃报警、<22℃补光，土壤湿度<30%RH浇水；②if-else 写出控制逻辑并逐条比对；③流程图含判断菱形与“再感知”回箭头，说明“动作后再感知、温度还高继续处理”故为闭环而非开环。","易错警示":"条件顺序要合理（先判极端高温再判低温）；闭环说明要答“为什么不是开环”。","方法点拨":"算法设计题“列量设阈→写分支→画回路+论证”，三段齐即高分。"}},{"sec":"思维进阶","type":"挑战","num":1,"text":"学校“智能温室”大赛，请你为植物角设计一套“自动守护算法”并画流程图：①列出你要监控的至少两个量及各自阈值（如温度>28报警）；②用if-else写出控制逻辑；③画出含判断菱形与“再感知”回路的流程图（文字描述即可），并说明它为什么是闭环而非开环。","opts":[],"subs":[],"open":true,"ans":"参考设计要点：①监控量与阈值：温度>28℃启动通风降温，土壤湿度<30%启动滴灌（两量两阈值）；②if-else示例：if(温度>28){开风扇;记录时间;}else{关风扇;} if(湿度<30){开水泵;}else{关水泵;}；③流程图说明：开始→读温度→判断>28？是→开风扇/否→关→读湿度→判断<30？是→灌溉/否→等待→回到\"读温度\"再次执行——因为有\"回到开头重新感知判断\"的回路，系统会根据最新数据不断调整，所以是闭环而非一跑到底的开环。","al":{"考查点":"开放创造：控制算法的编程表达（创造+应用）","解题思路":"阈值具体且合理；if-else条件与动作完整；流程图含判断菱形+回路，并能说清\"回环=闭环\"的判断依据","易错警示":"if-else缺else分支（执行器无法自动关闭）；流程图没有\"再感知\"回路就不成闭环","方法点拨":"算法题公式：量+阈值、if-else成对、回路点闭环。"}}]},{"t":"达标检测","n":"第四单元 简易物联系统实践 · 达标检测卷","isExam":true,"qs":[{"sec":"选择题","type":"选择题","num":1,"text":"简易物联系统四大模块中，负责“把数据传到处理设备”的是：","opts":[{"label":"A","text":"感知层"},{"label":"B","text":"网络层"},{"label":"C","text":"处理层"},{"label":"D","text":"执行层"}],"subs":[],"ans":"答案B　网络层","al":{"考查点":"四大模块职责辨识（理解）。","解题思路":"网络层=传输，像快递运输，把传感器数据送达处理层；感知管采集、处理管判断、执行管动作。","易错警示":"“传到处理设备”是传输动作，不是感知或处理。","方法点拨":"四模块职责歌：感知采集、网络传输、处理判断、执行动作。"}},{"sec":"选择题","type":"选择题","num":2,"text":"下列记录最规范、最能支撑决策的是：","opts":[{"label":"A","text":"26"},{"label":"B","text":"今天有点热"},{"label":"C","text":"植物角内，9:40，25.8℃，61%"},{"label":"D","text":"差不多30"}],"subs":[],"ans":"答案C　植物角内，9:40，25.8℃，61%","al":{"考查点":"规范记录要素（应用）。","解题思路":"规范记录=点位＋时刻＋数值＋单位四要素，C选项“植物角内，9:40，25.8℃，61%”齐全。","易错警示":"“26/差不多30/有点热”都缺要素，无法支撑决策。","方法点拨":"四要素自查：在哪、何时、多少、什么单位。"}},{"sec":"选择题","type":"选择题","num":3,"text":"要展示“一周温度随时间的变化走势”，应选用的图表是：","opts":[{"label":"A","text":"柱状图"},{"label":"B","text":"折线图"},{"label":"C","text":"饼图"},{"label":"D","text":"表格"}],"subs":[],"ans":"答案B　折线图","al":{"考查点":"趋势图选型（应用）。","解题思路":"“随时间变化走势”用折线图连点成线最直观；柱状适合分类对比、饼图看占比。","易错警示":"选型口诀不能记反：趋势=折线、对比=柱状。","方法点拨":"见“走势/变化/趋势”即折线。"}},{"sec":"选择题","type":"选择题","num":4,"text":"数据处理“四步法”的第一步“清洗”是指：","opts":[{"label":"A","text":"把表格擦干净"},{"label":"B","text":"识别并标注异常值"},{"label":"C","text":"删除所有小数"},{"label":"D","text":"给数据加水印"}],"subs":[],"ans":"答案B　识别并标注异常值","al":{"考查点":"“清洗”含义（理解）。","解题思路":"清洗=识别并标注异常值（如探头发烫读数），先标注再计算，避免污染结论。","易错警示":"“擦干净/删小数/加水印”均非清洗语义。","方法点拨":"清洗=去噪，不是删数据。"}},{"sec":"选择题","type":"选择题","num":5,"text":"“if 温度>28℃ then 报警”这种写法属于：","opts":[{"label":"A","text":"循环语句"},{"label":"B","text":"阈值判断（if-else）"},{"label":"C","text":"排序操作"},{"label":"D","text":"数据筛选"}],"subs":[],"ans":"答案B　阈值判断（if-else）","al":{"考查点":"阈值判断写法的辨识（理解）。","解题思路":"“if 温度>28℃ then 报警”是量化阈值+if-then 的条件分支（阈值判断），反馈控制典型写法。","易错警示":"模糊词（热了/渴了）不可执行，必须数值化。","方法点拨":"“if+数值+then动作”即阈值判断。"}},{"sec":"选择题","type":"选择题","num":6,"text":"系统“浇完水还再看一眼温度降没降”，这体现了：","opts":[{"label":"A","text":"开环控制"},{"label":"B","text":"闭环控制"},{"label":"C","text":"纯装饰"},{"label":"D","text":"单向控制"}],"subs":[],"ans":"答案B　闭环控制","al":{"考查点":"闭环vs开环的辨识（理解）。","解题思路":"动作后再感知形成回路=闭环；做一次就结束=开环。题干“浇完水还再看一眼”是闭环。","易错警示":"“单向控制/纯装饰”是干扰项，闭环关键词是“再感知”。","方法点拨":"有没有“回头再看”的箭头，是闭环判据。"}},{"sec":"判断题","type":"判断题","num":1,"text":"物联系统的“模块”就是买回来的具体零件和传感器。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"模块与器材之辨（理解）。","解题思路":"模块是功能职责划分不是器材；换器材而职责不变，模块划分也不变，判断错误。","易错警示":"“模块=零件”是第16课核心误区。","方法点拨":"见“模块就是零件/传感器”即判错。"}},{"sec":"判断题","type":"判断题","num":2,"text":"记录环境数据时带单位很重要，否则数值含义不清。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"记录带单位的判断（理解）。","解题思路":"没单位无法判断含义（26℃与26%完全不同），规范记录必须带单位，判断正确。","易错警示":"“大家都懂”会造成跨人歧义。","方法点拨":"单位是数据身份证，缺失即无效。"}},{"sec":"判断题","type":"判断题","num":3,"text":"折线图适合看分类对比，柱状图适合看变化趋势。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"图型选配的判断（理解）。","解题思路":"说反了：趋势用折线、对比用柱状——选错图误导读者，判断错误。","易错警示":"最高频图表误区，反着背。","方法点拨":"趋势=折线、对比=柱状，反说必错。"}},{"sec":"判断题","type":"判断题","num":4,"text":"算法可以用“热了就报警”这种模糊词描述，不用写具体数值。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"算法规范性的判断（理解）。","解题思路":"算法须量化阈值配合if-then，模糊词“热了就报警”不可机器执行，判断错误。","易错警示":"算法不是作文，条件必须数值化。","方法点拨":"见“模糊词描述算法”即判错。"}},{"sec":"判断题","type":"判断题","num":5,"text":"闭环系统执行动作后会再次感知，从而形成控制回路。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"闭环特征的判断（理解）。","解题思路":"闭环=动作后回到感知再判断，持续监测形成回路，是反馈控制核心，判断正确。","易错警示":"“再感知”是闭环与开环的分水岭。","方法点拨":"闭环判断题找“动作后再感知/形成回路”。"}},{"sec":"填空题","type":"填空题","num":1,"text":"简易物联系统四大模块：感知、____、处理、执行。","opts":[],"subs":[],"ans":"网络","al":{"考查点":"四大模块识记（记忆）。","解题思路":"四大模块=感知、网络、处理、执行，缺“网络”。","易错警示":"顺序别乱：感→传→析→动。","方法点拨":"四字诀“感传析动”。"}},{"sec":"填空题","type":"填空题","num":2,"text":"采集打卡三要素是：定刻、定点、____（带单位）。","opts":[],"subs":[],"ans":"定记","al":{"考查点":"采集三要素识记（记忆）。","解题思路":"三要素=定刻、定点、定记（带单位），缺“定记”。","易错警示":"“定记”强调的是规范地记录、带单位。","方法点拨":"“三定”口诀：定时、定点、定着记。"}},{"sec":"填空题","type":"填空题","num":3,"text":"在电子表格中求一组温度的平均值，常用函数是____。","opts":[],"subs":[],"ans":"AVERAGE","al":{"考查点":"求平均函数识记（记忆）。","解题思路":"电子表格求平均值用 AVERAGE 函数。","易错警示":"勿与 SUM/MAX/MIN 混淆。","方法点拨":"平均=AVERAGE，最直接对译。"}},{"sec":"填空题","type":"填空题","num":4,"text":"看变化趋势用____图，看分类对比用柱状图。","opts":[],"subs":[],"ans":"折线","al":{"考查点":"图型识记（记忆）。","解题思路":"看变化趋势用折线图，看分类对比用柱状图。","易错警示":"题干直接考选型口诀，勿填反。","方法点拨":"“趋势折线、对比柱状”。"}},{"sec":"填空题","type":"填空题","num":5,"text":"描述“超阈值就报警”的控制逻辑，常用____条件分支写法。","opts":[],"subs":[],"ans":"if-else（如果…否则）","al":{"考查点":"条件分支写法识记（记忆）。","解题思路":"“超阈值就报警”用 if-else（如果…否则…）条件分支。","易错警示":"勿填“循环/顺序”。","方法点拨":"分支=if-else，判断用。"}},{"sec":"填空题","type":"填空题","num":6,"text":"系统“感知→处理→反馈→再感知”形成一个____。","opts":[],"subs":[],"ans":"闭环","al":{"考查点":"闭环概念识记（记忆）。","解题思路":"“感知→处理→反馈→再感知”首尾相接形成闭环。","易错警示":"闭环的落点是“再感知”回环。","方法点拨":"闭环=转圈的控制，开环=一次性的控制。"}},{"sec":"简答题","type":"简答题","num":1,"text":"用“盖楼先看图纸”类比，说明为什么搭建物联系统要先画系统框图再动手。","opts":[],"subs":[],"ans":"盖楼要先画图纸明确结构再施工，搭物联系统也一样：先划分四大模块、画框图标清数据流向与接口，才能知道买什么、怎么连（4分）；若直接买器材动手，易买错模块、部件接不上、返工浪费（2分）。框图是工程交付的标准语言，体现“先规划后实施”的严谨态度（2分）。","al":{"考查点":"工程规划观的类比论证（应用）。","解题思路":"分三层作答：先画框图明确模块与流向（4分）；再讲盲目动手的后果——买错模块、部件接不上、返工（2分）；最后点出框图是工程标准语言、体现“先规划后实施”（2分）。","易错警示":"“图纸”要落实为“系统框图”，不能空谈盖楼。","方法点拨":"类比题“本体对照”写法：盖楼图纸=系统框图，每句落在物联网。"}},{"sec":"简答题","type":"简答题","num":2,"text":"请写出“数据处理四步法”，并说明最后一步“提炼规律”得到的结论长什么样（举例）。","opts":[],"subs":[],"ans":"四步：一洗（识别标注异常值）、二排（排序看分布）、三算（MAX／MIN／AVERAGE计算）、四炼（提炼适宜区间）（每步1分，共4分）。提炼出的规律形如“植物喜欢25-28℃、湿度55-65%”（3分），它是可指导系统判断与执行的信息，而非原始数字（3分）；举例恰当、说明“数据变信息”再给2分。","al":{"考查点":"数据处理四步法的完整表述（应用）。","解题思路":"四步每步1分：一洗（标注异常）、二排（排序看分布）、三算（MAX/MIN/AVERAGE）、四炼（提炼适宜区间）；再答规律形如“植物喜欢25-28℃、湿度55-65%”（3分）+“数据变信息”说明（3分）+恰当举例（2分）。","易错警示":"按分值分配篇幅：四步+规律示例+数据信息之辨都要覆盖。","方法点拨":"答题顺序即采分点顺序：四步名称→示例→性质说明，不漏层。"}},{"sec":"案例分析题","type":"案例分析题","num":1,"text":"班级植物角装了物联系统：温湿度传感器持续记录，数据进表格经清洗算平均得出“适宜25-28℃、湿度55-65%”，画成折线图发现午后常超28℃。系统设算法：if 温度>28℃ then 报警；else if <22℃ then 补光；else 正常，并持续再感知。请回答：①系统用了哪四大模块，各干什么（4分）；②数据处理四步法如何得出适宜区间（4分）；③为什么用折线图（3分）；④该算法是否闭环，说明理由（4分）。","opts":[],"subs":[],"ans":"①感知层（温湿度传感器采集）→网络层（传数据到电脑）→处理层（算平均、判断阈值）→执行层（报警／补光动作），四模块协同（4分）。②先清洗异常值，再排序、用MAX／MIN／AVERAGE算极值与平均，最后提炼出“25-28℃、55-65%”的适宜区间（4分）。③午后升温是随时间的变化趋势，折线图连点成线最直观（3分）。④是闭环：动作（报警／补光）后系统再次感知温度，温度仍高继续处理，形成“看一眼—判断—动作—再看”的回路（4分）。","al":{"考查点":"单元四课知识综合应用（分析·应用）。","解题思路":"四问分答：①四模块及职责（感知采集→网络传输→处理判断→执行动作，4分）；②四步法得出适宜区间（清洗→排序→算极值平均→提炼，4分）；③为什么折线图（午后升温是随时间变化趋势，3分）；④是否闭环及理由（动作后再感知形成“看一眼—判断—动作—再看”回路，4分）。","易错警示":"每问直击采分关键词：四模块职责、四步名、趋势、再感知回路。","方法点拨":"综合案例题把单元关键词全带出：模块/清洗/平均/折线/闭环，问什么答什么。"}},{"sec":"综合实践题","type":"综合实践题","num":1,"text":"学校“班级植物角”要建一套简易物联系统。请你完成方案：①画四大模块框图（含数据流向，5分）；②设计采集打卡计划（时刻／点位／单位，5分）；③用四步法处理数据并得出适宜区间（5分）；④选一幅图讲趋势并配齐四件套（5分）；⑤写反馈控制算法（if-else＋流程图＋闭环说明，5分）。","opts":[],"subs":[],"ans":"①框图：感知层（传感器）→网络层（传输）→处理层（判断）→执行层（补光／报警），箭头标“数据／指令”（5分）。②计划：每天9:40、15:40两测，植物角内／外两点位，记录“点位＋时刻＋温度℃＋湿度%”（5分）。③四步：清洗异常→排序→算极值平均→提炼“适宜25-28℃、湿度55-65%”（5分）。④选折线图展示午后升温，配标题、图例、坐标轴（℃）、数据标签（5分）。⑤算法：if 温度>28 then 报警；else if <22 then 补光；else 正常；流程图含判断菱形与回感知回路，说明是闭环（5分）。评分要点：框图清晰、计划规范、处理正确、图表合规、算法含闭环。","al":{"考查点":"单元全流程综合实践（创造）。","解题思路":"五问分答对应五个采分点：①框图（感知→网络→处理→执行+数据/指令箭头，5分）；②采集计划（定时/定点/单位格式，5分）；③四步法得区间（5分）；④折线图讲趋势+四件套（5分）；⑤算法（if-else+含回感知的流程图+闭环说明，5分）。","易错警示":"五问各自独立给分，缺任一模块框图都不完整；算法必须含回箭头。","方法点拨":"综合方案题“五段式”即本单元五大课各出一段，把框图/采集/处理/可视化/算法串成一个完整系统方案。"}}]}]},{"t":"第五单元 物联网应用探索","isFinal":false,"lessons":[{"t":"第 21 课 · 配套练习","n":"文物保护新手段","isExam":false,"qs":[{"sec":"回忆热身","type":"回忆","num":1,"text":"文物的三大“敌人”是潮湿、____和被盗。","opts":[],"subs":[],"ans":"震动（破坏）","al":{"考查点":"文物三敌的识记（记忆）。","解题思路":"文物三大“敌人”=潮湿、震动（破坏）、被盗；题干已给“潮湿”与“被盗”，缺“震动”。","易错警示":"勿填“光照/灰尘”——对文物而言震动(移动撞击)与潮、盗并列为三大直接威胁。","方法点拨":"三敌口诀“潮—震—盗”，对应三传感器：湿度、震动、RFID/门磁。"}},{"sec":"回忆热身","type":"回忆","num":2,"text":"文物“预防性保护”的核心思想是____报警、主动干预，而不是坏了再修。","opts":[],"subs":[],"ans":"事前（提前）","al":{"考查点":"预防性保护思想的识记（记忆）。","解题思路":"“预防性保护”=事前报警、主动干预——在损坏发生前预警处置，而非坏了再修。","易错警示":"勿填“事后/被动”——预防性的“预防”二字就指向事前。","方法点拨":"一句话对照：坏了再修=被动补救，提前预警=主动预防。"}},{"sec":"基础巩固","type":"单选","num":1,"text":"博物馆给珍贵书画展柜装了温湿度传感器，最主要是为了：","opts":[{"label":"A","text":"监测温湿度是否适宜，防止书画受潮变形"},{"label":"B","text":"给书画拍照发朋友圈"},{"label":"C","text":"统计参观人数"},{"label":"D","text":"给展柜照明"}],"subs":[],"ans":"答案A　监测温湿度是否适宜，防止书画受潮变形","al":{"考查点":"传感器与文保需求匹配（应用）。","解题思路":"书画怕潮怕变形，温湿度传感器监测环境并调控正对应“防受潮变形”这一预防性保护目的。","逐项剖析":"A 监测温湿度是否适宜、防止书画受潮变形：正确；B 给书画拍照发朋友圈：无关，排除；C 统计参观人数：需红外/客流计数而非温湿度，排除；D 给展柜照明：无关，排除。","易错警示":"别被“高科技”带偏——传感器装什么取决于“保护什么”。","方法点拨":"先想“文物怕什么”→再找“对应传感器”→目的自然浮现。"}},{"sec":"基础巩固","type":"单选","num":2,"text":"展柜里的青铜器若被移动或遭到撞击，最能第一时间报警的物联网手段是：","opts":[{"label":"A","text":"温度传感器"},{"label":"B","text":"震动（振动）传感器"},{"label":"C","text":"光线传感器"},{"label":"D","text":"GPS导航"}],"subs":[],"ans":"答案B　震动（振动）传感器","al":{"考查点":"按风险类型选传感器（应用）。","解题思路":"“被移动或撞击”=异常振动，震动（振动）传感器直接感知，第一时间报警。","逐项剖析":"A 温度传感器：管热不管理“动没动”，排除；B 震动（振动）传感器：感知移动撞击异常振动，正确；C 光线传感器：管明暗，排除；D GPS导航：室外定位用，展柜内无效，排除。","易错警示":"“谁感知哪类量”要对号：动=震动、热=温度、光=光线。","方法点拨":"读题先找风险词（移动/撞击/被盗）→匹配传感器（震动/门磁/RFID）。"}},{"sec":"基础巩固","type":"单选","num":3,"text":"珍贵文物要出馆巡展，馆方想全程知道“它现在在哪、有没有被掉包”。最合适的技术是：","opts":[{"label":"A","text":"给文物箱装RFID定位标签并全程读点"},{"label":"B","text":"给文物贴一张普通纸标签"},{"label":"C","text":"派人24小时目视"},{"label":"D","text":"在箱子上写名字"}],"subs":[],"ans":"答案A　给文物箱装RFID定位标签并全程读点","al":{"考查点":"文物运输防掉包技术选型（应用）。","解题思路":"“全程知在哪、防掉包”=身份识别+定位读点：RFID标签记录唯一身份，沿途读写器读点定位验真。","逐项剖析":"A 装RFID定位标签并全程读点：唯一身份+读点验真，正确；B 贴普通纸标签：不可机读无防伪，排除；C 派人24小时目视：易疲劳难持续，排除；D 箱子写名字：无防伪作用，排除。","易错警示":"“防掉包”的关键是“身份可机读校验”，纸标签做不到。","方法点拨":"运输防伪题关键词“唯一身份+沿途读点”，锁定RFID。"}},{"sec":"基础巩固","type":"单选","num":4,"text":"敦煌研究院为彩塑建了“数字孪生档案”，传感器数据实时映射到虚拟模型上。这套系统最核心的价值是：","opts":[{"label":"A","text":"在电脑里先演练保护方案再处置，避免对文物反复折腾"},{"label":"B","text":"让游客在手机上玩游戏"},{"label":"C","text":"替代所有实体文物"},{"label":"D","text":"只用来拍宣传片"}],"subs":[],"ans":"答案A　在电脑里先演练保护方案再处置，避免对文物反复折腾","al":{"考查点":"数字孪生价值理解（理解）。","解题思路":"数字孪生让保护方案先在虚拟模型上演练验证再落地，减少对真实文物的反复干预。","逐项剖析":"A 先演练保护方案再处置、避免反复折腾文物：核心价值，正确；B 让游客玩游戏：窄化误读，排除；C 替代所有实体文物：夸大，排除；D 只拍宣传片：排除。","易错警示":"“数字孪生≠电子游戏”——它是真实系统的虚拟镜像，用来模拟决策。","方法点拨":"遇“孪生/镜像/虚拟映射”先想“先在虚拟上试，再到真实中做”。"}},{"sec":"基础巩固","type":"判断","num":1,"text":"文物保护只需等文物坏了再修复即可，不必天天监测。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"预防vs修复的判断（理解）。","解题思路":"文物损伤多不可逆，核心是预防性保护——持续监测环境、在损坏前预警干预，“坏了再修”说法错误。","易错警示":"“等坏了再修”违背预防性保护思想，判断题直接错。","方法点拨":"文物保护第一性原则=预防重于修复。"}},{"sec":"基础巩固","type":"判断","num":2,"text":"震动报警传感器只在文物被偷时才有用，平时毫无价值。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"震动传感器价值的判断（理解）。","解题思路":"震动传感器不只防盗：施工震动、游客碰撞、展柜倾倒等风险都能感知，与温湿度共同构成全天候守护，“平时毫无价值”错误。","易错警示":"别低估日常防护——盗是低频事件，环境与意外是高频风险。","方法点拨":"传感器的价值=全时段防护，不止盯一个场景。"}},{"sec":"基础巩固","type":"判断","num":3,"text":"数字孪生可以先在虚拟模型上“演练”保护方案，再在真实文物上执行。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"数字孪生应用方式的判断（理解）。","解题思路":"先在1:1虚拟模型上仿真处置效果、优化方案，再在真实文物执行，能最大限度减少试错与损伤，判断正确。","易错警示":"“演练”与“执行”的顺序不能反。","方法点拨":"数字孪生口诀“先虚拟后真实，先演练再处置”。"}},{"sec":"能力提升","type":"提升","num":1,"text":"请完成《文物守护方案卡》：为一件“古代字画”分别写出防潮、防震、防盗各一种物联网手段。","opts":[],"subs":[],"ans":"防潮：展柜内装温湿度传感器，超限自动启动除湿机并报警；防震：展柜底部装震动传感器，异常振动立即报警；防盗：字画装RFID定位标签＋门磁/红外，未授权移动或夜间入侵触发声光报警并通知安保。","al":{"考查点":"文物三防手段设计（应用）。","解题思路":"按“三敌三防”作答：防潮=展柜温湿度传感器+超限自动除湿报警；防震=展柜底部震动传感器异常即报；防盗=RFID定位标签+门磁/红外，未授权移动或夜间入侵触发声光报警并通知安保。","易错警示":"每防都要“传感器+动作”成对，只写传感器不给动作即不完整。","方法点拨":"守护方案卡“一防一感一动”三栏填写，措施成对不落单。"}},{"sec":"能力提升","type":"提升","num":2,"text":"请画出“温湿度超限自动除湿”的完整闭环（感知—传输—处理—反馈），并写出每一步对应的设备。","opts":[],"subs":[],"ans":"感知：温湿度传感器测到湿度超过设定值；传输：数据经网络传到控制平台；处理：平台与阈值比对，判断需要除湿；反馈：下发指令启动除湿机，湿度回落后自动停机并继续监测——四步循环，实现自动恒湿。","al":{"考查点":"除湿闭环的完整描述（应用）。","解题思路":"按四环写清设备：感知（温湿度传感器测超限）→传输（数据经网络到平台）→处理（与阈值比对判断需除湿）→反馈（启动除湿机，湿度回落自动停机并继续监测）。","易错警示":"“湿度回落自动停”是闭环关键，写成只开不停就是开环。","方法点拨":"闭环题“四环+设备”逐环写，末环必写“回落后自动停并继续监测”。"}},{"sec":"能力提升","type":"提升","num":3,"text":"为什么说“物联网让文物保护从被动修复走向主动预防”？请用“坏了再修”与“提前预警”对比说明。","opts":[],"subs":[],"ans":"被动修复：等字画受潮发霉、彩塑开裂后再修，损伤已发生且修复可能留下痕迹、成本高。主动预防：传感器7×24小时监测温湿度、震动等，数据异常即时报警并自动调控，把风险消灭在萌芽——变“亡羊补牢”为“防患未然”，这就是预防性保护。","al":{"考查点":"被动修复vs主动预防对比论证（分析）。","解题思路":"两段对比：被动修复=损伤已发生、修复留痕成本高（亡羊补牢）；主动预防=7×24监测、异常即时报警自动调控（防患未然）——结论落在“预防性保护”。","易错警示":"对比要“成对出现”，只夸预防不批被动会失分。","方法点拨":"对比论证用“亡羊补牢vs防患未然”两个成语框住，结构立刻清晰。"}},{"sec":"能力提升","type":"提升","num":4,"text":"某博物馆要在展厅部署一套文物守护系统，预算有限。请按重要性排序：温湿度监测、震动报警、RFID定位防盗、人流统计，并说明排序理由。","opts":[],"subs":[],"ans":"排序建议：①温湿度监测——环境是文物慢性损耗的最大隐患，需长期恒控；②震动报警——防施工、防碰撞、防盗窃的即时防线；③RFID定位防盗——主要针对高价值可移动文物，重点展柜优先；④人流统计——辅助管理，优先级最低可后装。理由：先保“不坏不丢”，再谈“管得好”。顺序合理、理由充分即可。","al":{"考查点":"预算有限下的优先级排序（评价）。","解题思路":"按“先保不坏不丢、再谈管得好”排序：①温湿度监测（环境是慢性损耗最大隐患）②震动报警（即时防线）③RFID防盗（高价值移动文物重点）④人流统计（辅助管理最后装）；理由各一句。","易错警示":"排序题要“有理由”，光排顺序不解释会丢一半分。","方法点拨":"资源排序题用“风险优先级”推：谁先威胁“不坏不丢”谁排前。"}},{"sec":"拓展挑战","type":"拓展","num":1,"text":"学校图书馆要把一批“校史老照片”长期保存。照片最怕潮湿、光照和虫蛀。请你设计一个简单的“老照片守护方案”：①需要监测哪些环境量、用什么传感器；②写出“湿度超标就除湿”的闭环流程；③用一句话向保管老师说明“为什么不能等照片发黄了再处理”。","opts":[],"subs":[],"ans":"①监测湿度（湿度传感器）、光照强度（光线传感器）、温度（温度传感器）。②感知：湿度传感器测到超标→传输：数据上报→处理：与阈值比较判定超标→反馈：启动除湿机/拉上遮光帘，恢复后自动停止并继续监测。③因为照片发黄、发霉是不可逆损伤，事后修复又贵又难保原貌——提前控湿控光，才是花钱最少、保护最好的办法。","al":{"考查点":"老照片守护方案设计（应用·创造）。","解题思路":"三问作答：①监测量配传感器——湿度（湿度传感器）、光照（光线传感器）、温度（温度传感器）；②“湿度超标就除湿”闭环四步；③一句话说服——照片发黄发霉不可逆、事后修复贵且难保原貌，提前控湿控光才最省。","易错警示":"说服语要扣“不可逆”三字，才点透“为什么不能等”。","方法点拨":"守护方案题“测什么→怎么闭环→为什么提前”三段式，最后一段是灵魂。"}},{"sec":"拓展挑战","type":"拓展","num":2,"text":"有游客建议：“把珍贵文物都换成高仿复制品展出，真品锁进保险库，不就一劳永逸了？”请你从“文化传播”与“预防性保护”两个角度，评价这个建议的合理之处与不足。","opts":[],"subs":[],"ans":"合理之处：真品少受环境与人为损耗，安全性最高。不足：文物有不可替代的历史与艺术价值，公众看不到真品就失去文化传播意义；且锁进库房也仍需环境监测与养护，并非“一劳永逸”。更好做法：真品轮流展出＋复制品巡展＋数字孪生线上观展，让保护与传播兼得。","al":{"考查点":"高仿替换建议的辩证评价（评价）。","解题思路":"两面评价：合理=真品少损耗、安全性最高；不足=文物价值在真品本身，公众看不到就失去文化传播意义，且库房也需养护非一劳永逸；更好做法=真品轮流展+复制品巡展+数字孪生线上观展。","易错警示":"“全换高仿”是一刀切——传播与保护要兼得而非二选一。","方法点拨":"评价题“合理点+不足点+更优解”三段，给出第三条路才有深度。"}},{"sec":"变式闯关","type":"变式","num":1,"text":"换一个场景：学校的钢琴放在潮湿的阶梯教室，琴弦容易生锈跑音。请把“文物保护闭环”迁移过来，为钢琴设计一个“防潮守护”方案。","opts":[],"subs":[],"ans":"方案：阶梯教室装温湿度传感器＋除湿机联动——传感器感知湿度超过设定值→数据传到控制器→判断需要除湿→启动除湿机；湿度回落后自动停止。还可设“湿度超限提醒”把数据发给音乐老师手机，假期无人时也能远程掌握琴房环境。","al":{"考查点":"文保闭环迁移数字档案+纵深防护（创造）；跨课迁移——从实体守护到数据守护。","解题思路":"三段作答：①环境闭环——温湿光三路传感器+除湿机/遮光帘/空调联动，超限上传比对启动、恢复自动停；②数字档案双防——介质损坏（多副本异地备份+定期校验）、网络攻击与误删（访问权限+离线冷备）；③守护宣言一句贴切口号。","易错警示":"“数字档案防什么”是加分灵魂，只答环境守护就漏了纵深防护。","方法点拨":"“实体+数字”双重守护思维：先护环境、再护介质与权限，一层层加固。"}},{"sec":"间隔复习","type":"间隔","num":1,"text":"上节课我们用算法实现了反馈控制。请写出反馈控制的环节名称（至少两个），并说明数据在其中的流向。","opts":[],"subs":[],"ans":"（第20课《反馈控制有算法》）　环节：感知（采集）→处理（与阈值比较判断）→反馈（下发指令给执行器）；数据流向：传感器采集的原始数据经传输进入控制器，比较判断后生成控制指令，送回执行器动作，执行结果再被传感器采集，形成循环。","al":{"考查点":"反馈控制的环节与数据流（应用）。","解题思路":"抓住\"结果再回到输入\"的循环结构：数据从传感器出发，绕一圈回到执行器动作。","易错警示":"把流向画成单向——反馈控制的核心恰恰是\"回环\"。","方法点拨":"画一张带回环箭头的流程图，比背文字更牢。"}},{"sec":"间隔复习","type":"间隔","num":2,"text":"阈值在反馈控制中起什么作用？请举一个身边实例说明。","opts":[],"subs":[],"ans":"（第20课《反馈控制有算法》）　阈值是判断\"是否动作\"的临界标准：数据越过阈值才触发控制。实例：空调设26℃——室温高于阈值启动制冷，降到阈值以下停止；土壤湿度低于设定值才启动滴灌。","al":{"考查点":"阈值的作用与实例（理解+应用）。","解题思路":"阈值把\"连续变化的量\"切成\"动作/不动作\"的决策点，是算法判断的依据。","易错警示":"把阈值当成\"固定不变的值\"——实际可按场景调节设定。","方法点拨":"实例按\"量+阈值+触发动作\"三要素描述。"}},{"sec":"思维进阶","type":"挑战","num":1,"text":"学校要把一批“50年前的毕业照和档案”数字化并长期保存，请你当“数字文保专员”写一份《守护方案》：①监测哪些环境量、用什么传感器、联动什么设备（写出完整闭环）；②除环境守护外，数字档案本身还要防什么（至少两点），怎么防；③写一句面向师生的“文物/档案守护宣言”。","opts":[],"subs":[],"open":true,"ans":"参考设计要点：①环境监测闭环：温湿度传感器持续监测库房→数据超阈值（如湿度>65%）时控制器联动除湿机/空调启动→传感器继续监测确认回落——感知、传输、处理、反馈四环闭合；②数字档案自身防护：防丢失——本地+异地+云端三份备份，定期抽检可读性；防篡改——重要档案计算摘要值存证，调阅时重新比对即可发现是否被改动，并对存储系统设置只读权限；③守护宣言示例：\"纸质的老去挡不住，数字的新生我们来守护——三份备份、一枚指纹，让50年后的毕业照依然清晰\"。","al":{"考查点":"开放创造：文保双轨防护设计（创造+应用）","解题思路":"闭环含联动执行设备；数字档案防护点出\"备份+防篡改（摘要/只读）\"两条且方法具体；宣言呼应\"数字文保\"主题","易错警示":"把\"防潮\"当数字档案防护——混淆了实体与数字；备份没有\"异地与抽检\"细节","方法点拨":"文保题公式：环境闭环、数字双防（备份+防改）、宣言点题。"}}]},{"t":"第 22 课 · 配套练习","n":"健康生活新设备","isExam":false,"qs":[{"sec":"回忆热身","type":"回忆","num":1,"text":"智能手环测心率、测血氧，主要靠____传感器透过皮肤感知血流变化。","opts":[],"subs":[],"ans":"光学（光电）","al":{"考查点":"手环测心率原理的识记（记忆）。","解题思路":"手环测心率血氧靠光学（光电）传感器：发光照皮肤、探测血流变化折算心率。","易错警示":"勿填“压力/红外测温”——光学反射法才是心率/血氧的通用原理。","方法点拨":"“光测血流”四字记：光电传感器是穿戴健康监测的标配眼睛。"}},{"sec":"回忆热身","type":"回忆","num":2,"text":"分析连续多日的健康数据要看____（趋势/单点），而不是只看某一天的数字。","opts":[],"subs":[],"ans":"趋势","al":{"考查点":"健康数据分析原则的识记（记忆）。","解题思路":"分析连续多日数据要看趋势而非单点——单晚/单日波动大，多日才见规律。","易错警示":"“单点”是反面答案；本题题干已提示“趋势/单点”二选一。","方法点拨":"健康数据第一原则“看趋势不看单点”，全单元反复考。"}},{"sec":"基础巩固","type":"单选","num":1,"text":"体脂秤能“测出”体脂率，主要依据是：","opts":[{"label":"A","text":"称体重顺带猜的"},{"label":"B","text":"向人体发送微弱电流，按电阻抗估算脂肪比例"},{"label":"C","text":"秤会算命"},{"label":"D","text":"拍照识别身材"}],"subs":[],"ans":"答案B　向人体发送微弱电流，按电阻抗估算脂肪比例","al":{"考查点":"体脂秤原理的理解（理解）。","解题思路":"体脂秤靠“生物电阻抗法”：脂肪导电差、肌肉含水导电好，微弱电流测阻抗估算体脂率。","逐项剖析":"A 称体重顺带猜的：无科学依据，排除；B 向人体发送微弱电流、按电阻抗估算脂肪比例：正确；C 秤会算命：排除；D 拍照识别身材：体脂秤无相机，排除。","易错警示":"“生物电阻抗”是关键词——脂肪与肌肉导电性差异是测算基础。","方法点拨":"见“体脂/电阻/导电”即想到生物电阻抗法（BIA）。"}},{"sec":"基础巩固","type":"单选","num":2,"text":"手环昨晚显示“深睡1小时20分”，这个数据对判断睡眠质量的正确用法是：","opts":[{"label":"A","text":"一晚深睡不足2小时就断定失眠"},{"label":"B","text":"结合一周多晚的睡眠时长与规律看趋势"},{"label":"C","text":"数字越大越好，越小越差"},{"label":"D","text":"手环说多少就是多少，不用怀疑"}],"subs":[],"ans":"答案B　结合一周多晚的睡眠时长与规律看趋势","al":{"考查点":"单晚睡眠数据的正确解读（应用）。","解题思路":"单晚深睡数值受多种因素影响波动大，正确用法=结合多晚数据看趋势规律。","逐项剖析":"A 一晚不足2小时就断定失眠：以偏概全，排除；B 结合一周多晚看趋势：科学，正确；C 数字越大越好：深睡占比有适宜区间非越大越好，排除；D 手环说多少就是多少：忽略误差，排除。","易错警示":"“一晚定论”与“数据迷信”都是反数据素养的典型错误。","方法点拨":"睡眠数据解读三不：不拿一晚下结论、不比大小下定论、不迷信单一读数。"}},{"sec":"基础巩固","type":"单选","num":3,"text":"关于健康数据的“数据批判”意识，下列说法最正确的是：","opts":[{"label":"A","text":"手环数据绝对准确，可以当医院诊断依据"},{"label":"B","text":"测量有误差是正常的，健康判断要看长期趋势、异常时就医确认"},{"label":"C","text":"只要手环显示正常，就说明身体百分百健康"},{"label":"D","text":"数据越多越让人恐慌，干脆不测"}],"subs":[],"ans":"答案B　测量有误差是正常的，健康判断要看长期趋势、异常时就医确认","al":{"考查点":"健康数据批判意识（评价）。","解题思路":"消费级设备存在测量误差，正确素养=看长期趋势、异常时就医确认——既不迷信也不因噎废食。","逐项剖析":"A 绝对准确可当诊断依据：夸大，排除；B 测量有误差正常、看趋势异常就医：正确；C 显示正常就百分百健康：以偏概全，排除；D 干脆不测：因噎废食，排除。","易错警示":"“迷信数据”与“拒绝数据”都是极端，中间的科学态度才是答案。","方法点拨":"数据批判三问：准吗？代表整体吗？该不该据此行动？"}},{"sec":"基础巩固","type":"单选","num":4,"text":"新一代手环尝试“无创测血糖”，让糖尿病人免扎手指，这项探索主要依赖：","opts":[{"label":"A","text":"光学传感器＋算法从体征推算血糖"},{"label":"B","text":"手环里装血糖试纸"},{"label":"C","text":"每天抽血化验"},{"label":"D","text":"观察皮肤颜色"}],"subs":[],"ans":"答案A　光学传感器＋算法从体征推算血糖","al":{"考查点":"无创测血糖原理的理解（理解）。","解题思路":"无创血糖=光学传感器+算法从体征间接推算，是前沿探索，精度仍在完善。","逐项剖析":"A 光学传感器+算法从体征推算：正确；B 手环里装血糖试纸：物理不可能，排除；C 每天抽血化验：那是“有创”不是探索方向，排除；D 观察皮肤颜色：不科学，排除。","易错警示":"“无创”的代价是间接推算——精度不如有创是当前局限。","方法点拨":"前沿技术题抓“传感器+算法”组合拳，别期待科幻式奇迹。"}},{"sec":"基础巩固","type":"判断","num":1,"text":"连续几天同一时段测同一指标，比只看一次更值得参考。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"连续记录价值的判断（理解）。","解题思路":"单次测量偶然误差大，多日同条件测量才能看趋势与规律——判断正确。","易错警示":"题干即“三天折线法”的道理，直接判√。","方法点拨":"“同一时段连续测>看一次”是数据素养共识，秒判√。"}},{"sec":"基础巩固","type":"判断","num":2,"text":"健康手环是医疗器械，它的读数可以直接用于医生诊断。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"手环是否为医疗器械的判断（理解）。","解题思路":"多数消费级穿戴设备只作日常健康参考、非医用器械，读数不能直接用于诊断，判断错误。","易错警示":"诊断必须专业设备复核——穿戴设备定位于“参考”而非“诊断”。","方法点拨":"“医疗器械 vs 消费电子”边界：能开处方作诊断=医用，仅供参考=消费级。"}},{"sec":"基础巩固","type":"判断","num":3,"text":"健康数据越全越敏感，保管不当可能泄露个人隐私。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"健康数据敏感性的判断（理解）。","解题思路":"心率、睡眠、体脂属个人敏感健康信息，泄露可能被不当利用，需关注存储与授权，判断正确。","易错警示":"“数据越全越敏感”是隐私意识的核心，判√。","方法点拨":"敏感数据三防：防过度收集、防违规共享、防弱密泄露。"}},{"sec":"能力提升","type":"提升","num":1,"text":"请完成《健康设备全家福》：写出智能手环、体脂秤、睡眠监测带各测什么指标、用了什么传感方式。","opts":[],"subs":[],"ans":"手环：心率、血氧、步数、睡眠——光学传感器（血流）＋加速度计（运动）；体脂秤：体重、体脂率——压力传感＋生物电阻抗；睡眠带/睡眠监测：睡眠周期、翻身呼吸——压力/振动传感＋算法。结合教案说法合理即可。","al":{"考查点":"健康设备全家福整理（应用）。","解题思路":"按“设备—指标—传感方式”三栏：手环（心率血氧步数睡眠——光学+加速度计）、体脂秤（体重体脂率——压力传感+生物电阻抗）、睡眠监测带（睡眠周期翻身呼吸——压力/振动+算法）。","易错警示":"传感方式要写原理（光学/电阻抗），只写“测心率”不给原理会降格。","方法点拨":"“设备全家福”表格化作答：一设备一行，指标与原理成对。"}},{"sec":"能力提升","type":"提升","num":2,"text":"小明连续三天记录“晨起静息心率”为72、75、71次/分，而某天午饭后测是98次/分。请用“看趋势不看单点”帮他分析：这组数据说明什么？午后的98要不要恐慌？","opts":[],"subs":[],"ans":"晨起静息心率三天稳定在71-75之间，说明近期基础状态平稳，这是趋势信号；午后98次/分是饭后、活动后的一过性升高，属正常生理波动，不必恐慌。正确做法：继续按固定条件（晨起静息）记录看趋势，若持续异常升高再去医疗机构复查。","al":{"考查点":"看趋势不看单点的应用分析（应用）。","解题思路":"先读趋势：晨起静息三天71-75稳定=基础状态平稳；再判午后98：饭后活动后一过性升高属正常波动，不必恐慌；正确做法=固定条件（晨起静息）继续记录，持续异常再就医。","易错警示":"“要不要恐慌”要答“不恐慌+理由+后续做法”三步才完整。","方法点拨":"数据分析题“读趋势→判单点→给做法”，单点异常先归因于条件变化。"}},{"sec":"能力提升","type":"提升","num":3,"text":"“健康数据越全越敏感”。请列举健康数据可能被泄露的两种途径，并各写一条防护措施。","opts":[],"subs":[],"ans":"途径一：App过度收集并违规共享给第三方（如保险、广告商）——防护：查看隐私政策、拒绝非必要授权、关闭“共享给第三方”开关；途径二：账号弱密码或设备丢失导致数据被他人读取——防护：设置强密码与双重验证、设备丢失立即远程解绑并删除云端数据。","al":{"考查点":"健康数据泄露途径与防护（分析）。","解题思路":"两途径两防护：①App过度收集违规共享第三方——查隐私政策、拒非必要授权、关共享开关；②弱密码或设备丢失致数据被读——强密码+双验证、丢失立即远程解绑删云数据。","易错警示":"“途径+防护”要一一配对成组，途径两条防护两条。","方法点拨":"隐私题“两径两防”成对作答：泄露从哪来→就在哪堵。"}},{"sec":"能力提升","type":"提升","num":4,"text":"请用“感知—传输—处理—反馈”描述一次“手环提醒久坐”的完整过程，并说明反馈环节做了什么。","opts":[],"subs":[],"ans":"感知：加速度计检测到你连续坐着不动超过设定时长；传输：数据在本地/云端处理（手环本地即可）；处理：与“久坐阈值”比较，判定该起身了；反馈：手环振动并显示“起来动一动”，提醒你起身活动；活动后传感器重新计时，形成循环。","al":{"考查点":"久坐提醒闭环描述（应用）。","解题思路":"按四环：感知（加速度计检测久坐超时）→传输（数据本地/云端）→处理（与久坐阈值比较判定该起身）→反馈（手环振动显示“起来动一动”）；活动后重新计时形成循环。","易错警示":"“反馈”环节要写具体动作（振动+提示），并说清循环如何重新开始。","方法点拨":"手环功能题统一套“感传处馈+重计时”模板，闭环自洽。"}},{"sec":"拓展挑战","type":"拓展","num":1,"text":"爷爷有高血压，想买一个“能测血压还能提醒吃药”的设备。请你给他推荐并说明：①这种设备主要测什么、怎么提醒吃药（用闭环描述）；②爷爷担心“数据被乱用”，你会怎么向他解释隐私设置？","opts":[],"subs":[],"ans":"①推荐“智能血压计＋智能药盒/健康App”：智能血压计用压力传感测血压并自动记录上传；到服药时间药盒亮灯提醒、漏服会推送到家人手机。②解释：您的心率血压数据只保存在您和家人绑定的账户里，可以设置“不共享给任何第三方”；选正规品牌、看隐私政策、设置强密码，数据就像锁在自家抽屉里，您随时能查看和删除。","al":{"考查点":"老人健康设备推荐与隐私解释（应用·创造）。","解题思路":"①推荐智能血压计+智能药盒/健康App：血压计压力传感测压自动记录，药盒到点亮灯、漏服推送家人；②隐私解释要通俗：数据只存您与家人账户、可设不共享、正规品牌+看隐私政策+强密码，像锁在自家抽屉、随时可查可删。","易错警示":"隐私解释要“用具象比喻”（自家抽屉）而非抽象保证。","方法点拨":"给老人解释科技用“抽屉/钥匙”类生活比喻，信任感立增。"}},{"sec":"拓展挑战","type":"拓展","num":2,"text":"同学说“手环显示我睡眠只有5小时，我是不是生病了？”请你先给他科学的回应（怎么正确看待单晚数据），再给他一个“连续观察一周”的记录建议（记什么、怎么判断）。","opts":[],"subs":[],"ans":"回应：单晚手环睡眠数据受入睡时间、环境、贴戴松紧影响，误差不小，别急着下结论；睡眠质量要看多晚的规律，而不是一晚的数字。建议：连续一周每晚记“入睡时刻、手环深睡时长、白天精神状态”三栏；一周后看整体趋势——若多数晚上规律且白天精神好，就无需担心；若长期明显异常伴白天嗜睡，再请家长陪同去医疗机构评估。","al":{"考查点":"单晚数据的科学回应+观察方案（应用）。","解题思路":"先科学回应：单晚受入睡时间/环境/贴戴松紧影响误差不小，看多晚规律别急下结论；再给记录建议：连续一周记“入睡时刻、深睡时长、白天精神状态”三栏，一周后看整体趋势——多数规律且精神好则无忧，长期异常伴嗜睡再就医。","易错警示":"方案要“可执行”（固定三栏+一周）而非空谈“注意观察”。","方法点拨":"“安慰+方案”两段式：先破单点焦虑，再给一周三栏的可操作观察法。"}},{"sec":"变式闯关","type":"变式","num":1,"text":"换一个场景：妈妈用体脂秤记录体重，某天突然重了2公斤很焦虑。请用“数据批判”的视角安慰她，并给出“三天折线法”的操作建议。","opts":[],"subs":[],"ans":"单日体重受喝水、吃饭、排便、衣物影响波动很大，2公斤可能只是“水分和食物”，不是真胖。建议：固定每天晨起空腹、上完厕所后测量并记录，连记三天以上画折线看趋势——只要趋势平稳或缓慢下降就正常，别被单点数字绑架情绪。","al":{"考查点":"数据批判迁移体重焦虑（应用）。","解题思路":"先安慰：单日体重受喝水吃饭排便衣物影响波动大，2公斤可能是水分食物；再给三天折线法：固定晨起空腹排便后测、连记三天画折线看趋势，平稳或缓降即正常。","易错警示":"“固定条件”是折线法的关键，漏写则方法不可靠。","方法点拨":"体重焦虑安慰公式：波动归因→固定条件测量→折线看趋势→别被单点绑架。"}},{"sec":"间隔复习","type":"间隔","num":1,"text":"文物怕“潮”要靠湿度传感器守护，人体健康也怕“潮”吗？请把文保的“预防性保护”思想迁移到健康管理，说出一句你的理解。","opts":[],"subs":[],"ans":"（第21课《文物保护新手段》）　可以迁移：文保是“提前监测、防患未然”，健康也一样——用手环持续监测心率、睡眠等数据，正是想在问题出现前发现苗头（预防性健康管理），而不是等生病了才去医院。","al":{"考查点":"健康数据公约海报设计（创造）；跨课迁移——数据素养科普化表达。","解题思路":"三段作答：①三条守则——看趋势不看单点、固定条件再比较、异常不恐慌持续异常找医生；②三天小实验——晨起记静息心率与前一晚睡眠时长画折线比平稳；③防焦虑提醒一句（“数据是镜子不是裁判”）。","易错警示":"守则要“科学可执行”，实验要写“何时测、记什么、怎么比”。","方法点拨":"科普海报设计=守则（科学）+实验（可操作）+金句（有温度）。"}},{"sec":"思维进阶","type":"挑战","num":1,"text":"学校要办“健康数据小讲堂”，请你设计一张《给同学的健康数据使用公约》海报内容：①写出“正确看数据”的三条守则（如看趋势不看单点）；②设计一个“连续三天健康观察”小实验（测什么、何时测、怎么记录与比较）；③写一句提醒，防止大家“数据焦虑”。","opts":[],"subs":[],"open":true,"ans":"参考设计要点：①三条守则：看趋势不看单点——一次异常不等于健康出问题；数据是参考不是诊断——异常持续或伴随不适要找医生，不信\"手环自诊\"；对比要有基准——和自己过去比、结合作息运动看，不盲目跟同学比数值；②三天观察实验：测静息心率或睡眠时长，每天早晚各一次固定时刻，记录在表格（日期/时刻/数值/当天运动量），三天后计算平均值并观察变化；③防焦虑提醒：\"数据是帮手不是裁判——偶尔一次偏高，可能是没睡好或刚跑完步，先看趋势再谈异常，别让数字绑架了心情\"。","al":{"考查点":"开放创造：健康数据的理性使用设计（创造+评价）","解题思路":"守则覆盖\"趋势/专业/基准\"三视角；实验含变量控制（固定时刻）与比较方法；提醒针对\"数据焦虑\"的成因（单点波动）","易错警示":"守则写成\"多运动多喝水\"偏离数据素养；实验设计无固定时刻导致数据不可比","方法点拨":"健康数据题公式：三守则、三对照、一句话治焦虑。"}}]},{"t":"第 23 课 · 配套练习","n":"医疗设施新功能","isExam":false,"qs":[{"sec":"回忆热身","type":"回忆","num":1,"text":"分析医疗物联网应用要用“功能—____—风险”框架，既要看到好处也要想到隐患。","opts":[],"subs":[],"ans":"价值","al":{"考查点":"医疗物联分析框架的识记（记忆）。","解题思路":"分析医疗物联网用“功能—价值—风险”三框架：既看到好处（价值）也想到隐患（风险），题干缺“价值”。","易错警示":"勿填“价格/效果”——框架定名是功能—价值—风险。","方法点拨":"“三词框架”功能价值风险：好用（功能）、好在哪（价值）、坏在哪（风险）。"}},{"sec":"回忆热身","type":"回忆","num":2,"text":"“科技向善”的含义是：技术应用既要有____，也要担责任。","opts":[],"subs":[],"ans":"能力（本领）","al":{"考查点":"“科技向善”含义的识记（记忆）。","解题思路":"科技向善=技术应用既要有能力（本领），也要担责任——能做得到更要想清楚该不该做。","易错警示":"勿填“利益/利润”——向善落点是“责任”二字。","方法点拨":"“科技向善=能力+责任”公式化记忆，答题直接套。"}},{"sec":"基础巩固","type":"单选","num":1,"text":"独居老人戴的智能手环检测到心率异常，自动联系紧急联系人并发送定位。这主要体现了医疗物联的哪类应用？","opts":[{"label":"A","text":"远程监护"},{"label":"B","text":"智能药盒"},{"label":"C","text":"智慧病房"},{"label":"D","text":"基因测序"}],"subs":[],"ans":"答案A　远程监护","al":{"考查点":"医疗物联应用类型判别（应用）。","解题思路":"“手环监测心率异常自动联系紧急联系人”=远程监护：持续采集体征、异常自动告警求助。","逐项剖析":"A 远程监护：穿戴设备+自动告警，正确；B 智能药盒：管吃药提醒，排除；C 智慧病房：住院场景，排除；D 基因测序：与题干无关，排除。","易错警示":"“自动求助”四个字是远程监护的标志动作。","方法点拨":"应用分类看“服务对象+动作”：独居在家+自动告警=远程监护。"}},{"sec":"基础巩固","type":"单选","num":2,"text":"智能药盒到点亮灯提醒服药，还能记录“是否取药”并告知家人，它的核心价值是：","opts":[{"label":"A","text":"让药盒更好看"},{"label":"B","text":"减少老人漏服、错服药物"},{"label":"C","text":"代替医生开药"},{"label":"D","text":"存放所有药品"}],"subs":[],"ans":"答案B　减少老人漏服、错服药物","al":{"考查点":"智能药盒核心价值（理解）。","解题思路":"提醒服药+记录取药+家属知晓，解决老人“忘吃漏吃”这一最大难题。","逐项剖析":"A 更好看：非价值，排除；B 减少漏服错服：核心价值，正确；C 代替医生开药：越界，排除；D 存放所有药品：不是药盒的智能价值，排除。","易错警示":"药盒“提醒+记录”双功能对应“漏服”痛点，别答成存储功能。","方法点拨":"医疗设备价值题找“解决什么难题”——药盒解决的难题就是漏服。"}},{"sec":"基础巩固","type":"单选","num":3,"text":"“人工智能读片几秒标出CT里的可疑结节”极大提高了筛查效率，但引发的最大争议是：","opts":[{"label":"A","text":"机器比医生贵"},{"label":"B","text":"判断出错时谁来负责（算法责任）"},{"label":"C","text":"机器太慢"},{"label":"D","text":"片子看不清楚"}],"subs":[],"ans":"答案B　判断出错时谁来负责（算法责任）","al":{"考查点":"AI读片责任争议（理解·评价）。","解题思路":"“判断出错谁负责”是最大争议：漏诊误诊时责任在医生、厂商还是算法，是全球立法焦点。","逐项剖析":"A 机器比医生贵：非争议焦点，排除；B 判断出错时谁来负责：算法责任，正确；C 机器太慢：恰恰更快，排除；D 片子看不清：非争议，排除。","易错警示":"“算法责任归属”是AI医疗伦理第一争议，欧盟还要求可解释可问责。","方法点拨":"见“AI+出错/负责”即答算法责任归属，伦理题高频。"}},{"sec":"基础巩固","type":"单选","num":4,"text":"智慧病房里，护士站能实时看到各床生命体征并自动预警，下列不属于它带来的价值的是：","opts":[{"label":"A","text":"护士不用频繁往返也能掌握病情变化"},{"label":"B","text":"病情恶化能更早被发现"},{"label":"C","text":"减少夜间巡视疏漏"},{"label":"D","text":"完全不需要护士了"}],"subs":[],"ans":"答案D　完全不需要护士了","al":{"考查点":"智慧病房价值边界（理解）。","解题思路":"智慧病房“赋能”护士而非取代——系统管重复监测，护士专注护理决策与人文关怀。","逐项剖析":"A 不用频繁往返掌握病情：价值之一，排除；B 恶化更早发现：价值之一，排除；C 减少夜间巡视疏漏：价值之一，排除；D 完全不需要护士：错误说法（题问“不属于价值”），正确。","易错警示":"题干问“不属于价值”——“取代护士”是夸大不是价值。","方法点拨":"“不属于价值”题找夸大说法：凡说“完全取代/不需要人”即错项。"}},{"sec":"基础巩固","type":"判断","num":1,"text":"医疗物联网只要方便高效，隐私问题可以忽略不计。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"便利与隐私关系的判断（理解）。","解题思路":"医疗数据最敏感，便利必须以隐私保护为前提——隐私忽略不计的说法错误。","易错警示":"“效率优先、隐私让路”违背伦理三问第一问。","方法点拨":"医疗物联红线：隐私是前提不是可选项。"}},{"sec":"基础巩固","type":"判断","num":2,"text":"“科技向善”意味着技术开发者要同时考虑能力与责任。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"科技向善含义的判断（理解）。","解题思路":"科技向善=能力+责任：能做得到，还要想清楚该不该做、谁负责，判断正确。","易错警示":"“只谈能力不谈责任”不是向善。","方法点拨":"“能力+责任”双要件，缺一不可。"}},{"sec":"基础巩固","type":"判断","num":3,"text":"远程医疗让农村患者也能请城里专家会诊，体现了物联网的公平价值。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"远程医疗公平价值的判断（理解）。","解题思路":"远程医疗打破地域限制，优质资源惠及偏远农村，体现技术促进公平，判断正确。","易错警示":"“公平价值”是远程医疗的伦理加分项，判√。","方法点拨":"技术公平性判断：谁获益、缩小了什么差距。"}},{"sec":"能力提升","type":"提升","num":1,"text":"请用“功能—价值—风险”三段式分析“远程监护手环”，每段各写一条。","opts":[],"subs":[],"ans":"功能：持续采集心率、血氧等体征并上传，异常自动告警；价值：独居老人异常能被及时发现、家属远程安心、减轻医院床位压力；风险：生命体征数据泄露、设备误报漏报、老人感觉被“监视”产生心理负担。","al":{"考查点":"功能—价值—风险框架应用（应用）。","解题思路":"三段各一条：功能=持续采心率血氧上传+异常自动告警；价值=独居异常早发现、家属安心、减床位压力；风险=数据泄露、误报漏报、老人“被监视”心理负担。","易错警示":"三段要“各写各的”，价值别写成功能、风险别写成价值。","方法点拨":"框架题三段式模板：功能=它做什么，价值=谁受益怎么受益，风险=什么场景下出问题。"}},{"sec":"能力提升","type":"提升","num":2,"text":"医院要上线“人工智能读片”辅助诊断。请你以院方身份列出三条必须准备好的“负责任使用”措施。","opts":[],"subs":[],"ans":"①明确边界：智能系统只做“辅助筛查与提示”，最终诊断必须由医生复核签字，责任清晰；②数据合规：训练与使用都要保护患者隐私，脱敏处理、最小授权；③可解释可问责：保留系统判读依据供医生查看，建立出错反馈与持续改进机制。","al":{"考查点":"AI辅助诊断的负责任措施（应用·创造）。","解题思路":"三条措施：①边界——只做辅助筛查提示，最终诊断医生复核签字、责任清晰；②合
