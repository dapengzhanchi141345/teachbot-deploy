:"“追踪数据经过哪些路由器”→路径科工具tracert，它逐跳显示途经节点。","逐项剖析":"A项ping只测通不通不显示路径，错误；B项ipconfig只看本机，错误；C项tracert逐跳显示本机到目标经过的路由器，正确；D项netstat看本机连接状态，错误。","易错警示":"ping与tracert的区别：ping问“到没到”，tracert问“经过哪”。","方法点拨":"见“经过哪些路由器/路径/逐跳”→tracert，这是它区别于ping的关键。"}},{"sec":"基础巩固","type":"单选","num":3,"text":"诊断网络故障的正确第一步通常是：","opts":[{"label":"A","text":"直接重装系统"},{"label":"B","text":"先ping网关看是否连通"},{"label":"C","text":"先查浏览器历史"},{"label":"D","text":"先换电脑"}],"subs":[],"ans":"答案B　先ping网关看是否连通","al":{"考查点":"网络故障诊断的第一步（理解+应用）。","解题思路":"诊断讲究“由近及远、先易后难”：先ping网关确认本机到路由是否连通，再逐步扩大排查范围。","逐项剖析":"A项直接重装系统是最后手段、代价大，错误；B项先ping网关，连通性问题优先排查，正确；C项查浏览器历史与故障无关，错误；D项先换电脑是设备级粗暴处理，错误。","易错警示":"新手易“头痛医头”直接换设备/重装——科学诊断要先分层定位。","方法点拨":"诊断口诀“先连通→再IP→后路径”：从最近的链路起点查起，逐步向外扩展。"}},{"sec":"基础巩固","type":"单选","num":4,"text":"用“快递多层包装”类比，数据在传输中被一层层“打包”，最外层相当于：","opts":[{"label":"A","text":"数据内容"},{"label":"B","text":"帧（链路层外壳）"},{"label":"C","text":"应用层程序"},{"label":"D","text":"网址"}],"subs":[],"ans":"答案B　帧（链路层外壳）","al":{"考查点":"数据封装分层结构的理解（理解）。","解题思路":"“快递多层包装”由外到内：帧→IP包→TCP段→数据，最外层是帧。","逐项剖析":"A项数据内容是核心在最内层，错误；B项帧是链路层外壳、最外层包装，正确；C项应用层程序在最高层逻辑而非最外层封装，错误；D项网址是应用层信息，不参与链路层封装，错误。","易错警示":"封装顺序方向易反：发送时从内到外逐层加头，最外层是“帧”。","方法点拨":"记包裹顺序：商品→气泡膜→内盒→外箱（帧在最外），每层各写各的地址标签。"}},{"sec":"基础巩固","type":"判断","num":1,"text":"netstat命令用于观察本机当前的活动网络连接。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"netstat命令的功能（识记+理解）。","解题思路":"netstat（network statistics）列出本机当前活动网络连接与端口状态——表述正确，判“√”。","方法点拨":"连接科口诀：netstat＝network＋statistics，看“正在连什么”。"}},{"sec":"基础巩固","type":"判断","num":2,"text":"只要ping不通网关，就一定是网线松动这种物理故障。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"ping不通原因的多因性（理解+辨析）。","解题思路":"找反例：ping不通可能是IP冲突、网关配置错误、对方禁ping、防火墙拦截等多种原因，不一定是网线松动——判“×”。","易错警示":"“一定”是绝对化词；单一归因是诊断大忌，要按流程逐项排查。","方法点拨":"凡“只要A就B”式单一归因判断，想一个其他原因即可判×。"}},{"sec":"基础巩固","type":"判断","num":3,"text":"数据封装指发送时由高层到低层逐层加头部信息，接收时顺序相反拆开。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"数据封装的层次顺序（理解+辨析）。","解题思路":"封装：发送时应用层→传输层→网络层→链路层逐层加头部（由高层到低层）；接收时逆向逐层拆开——表述正确，判“√”。","易错警示":"“发送时从高层到低层加头”与“最外层是帧”要一致理解，别记成反向。","方法点拨":"封装类比快递：发件由内到外层层包装，收件由外到内层层拆箱。"}},{"sec":"能力提升","type":"提升","num":1,"text":"请按“网络医生”诊断流程，写出排查“无法上网”的三步顺序及每步目的。","opts":[],"subs":[],"ans":"①先ping网关——测本机到网关是否连通；②再ipconfig——查本机IP、网关是否配置正确；③后tracert——追踪到目标中途哪跳断。对应“先连通→再IP→后路径”。","al":{"考查点":"网络诊断三步流程的方法论（理解+应用）。","解题思路":"按“先连通→再IP→后路径”组织：①ping网关测本机到网关连通；②ipconfig查本机IP/网关配置是否正确；③tracert目标追踪中断点在哪一跳。每步写清“命令+目的”。","易错警示":"步骤顺序不能乱——IP都没分到就tracert没有意义，连通与地址是前置条件。","方法点拨":"诊断流程答题公式：“第一步X命令查Y问题，第二步…”三步对应三命令，逻辑递进。"}},{"sec":"能力提升","type":"提升","num":2,"text":"连线：将命令与用途连线（写序号）。①ping ②ipconfig ③tracert ④netstat｜A看本机IP B测连通 C看路径 D看连接","opts":[],"subs":[],"ans":"①—B；②—A；③—C；④—D","al":{"考查点":"四命令与用途的连线辨别（应用）。","解题思路":"按口诀连线：ping测连通（B）、ipconfig看本机IP（A）、tracert看路径（C）、netstat看连接（D），即①B②A③C④D。","易错警示":"ping与tracert易互换：ping只测“通不通”，tracert才看“走哪条路”。","方法点拨":"连线前先各写一个动词标签：ping问通、ipconfig问址、tracert问路、netstat问连。"}},{"sec":"能力提升","type":"提升","num":3,"text":"实验记录：若ping网关显示“请求超时”，而ipconfig显示IP为169开头（自动私有地址），说明可能是什么问题？","opts":[],"subs":[],"ans":"169开头说明本机没从路由器拿到正常IP（DHCP失败），可能网关未开或网线松动，导致无法连通，需检查物理连接与DHCP。","al":{"考查点":"命令输出与故障原因的关联推断（分析）。","解题思路":"169.x.x.x是Windows的自动私有地址（APIPA），说明DHCP没拿到正常IP——结合ping超时，判断为没连上路由器/未获地址，应查物理连接与DHCP服务。","易错警示":"看到169开头别当正常IP——它是“没分到地址”的求救信号。","方法点拨":"记169地址的含义＝DHCP失败，见到它先查网线、路由、DHCP三条线。"}},{"sec":"能力提升","type":"提升","num":4,"text":"用“快递包装”类比，说明数据封装中“每层加一层信息”的意义。","opts":[],"subs":[],"ans":"就像快递从商品到气泡膜到内盒到外箱，每层加地址、校验等信息；网络每层也加头部，确保数据能正确寻址、传输与还原。","al":{"考查点":"用类比理解分层封装的意义（理解+表达）。","解题思路":"类比要讲清“每层信息有什么用”：快递每层（气泡膜/内盒/外箱）各有保护与地址标签，网络每层头部负责寻址、校验、重组——分层让各层各司其职，出错可逐层定位。","易错警示":"只写“像快递一样包很多层”不点出每层加的信息（地址/校验）的作用，等于没解释“意义”。","方法点拨":"“包装类比”题三层答：包几层→每层写什么→这层信息解决什么问题。"}},{"sec":"拓展挑战","type":"拓展","num":1,"text":"情境：运动会直播时教师机ping不通网关，ipconfig显示IP正常但tracert第一跳就失败。请推断可能故障环节，并设计下一步排查动作（至少两步）。","opts":[],"subs":[],"ans":"可能环节：本机到网关物理链路或网关故障（第一跳即失败）。下一步：①检查网线、无线是否松动或断开；②换端口或重启交换机；③用netstat看是否有异常连接占用。依流程定位。","al":{"考查点":"多命令综合诊断真实故障（分析+应用）。","解题思路":"症状定位：ping网关不通+IP正常+tracert第一跳失败→问题在本机到网关的物理链路或网关设备。下一步排查：①查网线/无线是否松动断开；②换交换机端口或重启网关；③用netstat看异常连接。","易错警示":"IP正常说明配置对，别再去改IP——要把火力集中到“链路与网关”。","方法点拨":"诊断题先画分层：本机→网关→外网，哪个环节断就查哪个环节，再列2-3个具体动作。"}},{"sec":"拓展挑战","type":"拓展","num":2,"text":"方案设计：为学校机房写一份“网络故障应急三步卡”，要求普通管理员照做就能初步判断问题，语言通俗。","opts":[],"subs":[],"ans":"①ping网关：通→问题在外部；不通→看本机。②ipconfig：IP正常否？异常重连网络。③tracert目标：看断在哪一跳，本地找线路，外网报运维。三步覆盖连通、配置、路径。","al":{"考查点":"诊断流程的可操作化方案设计（创造）。","解题思路":"三步卡要“傻瓜可执行”：第一步ping网关（通→问题在外；不通→查本机）；第二步ipconfig（IP异常→重连网络）；第三步tracert目标（看断在哪跳，本地找线、外网报运维）。每步给判断分支，普通管理员照做即可。","易错警示":"只写命令不写“结果怎么解读”，管理员不知下一步做什么，卡片失效。","方法点拨":"“应急三步卡”设计要点：每步=动作+可能结果+下一步分支，让执行者能“照单操作”。"}},{"sec":"变式闯关","type":"变式","num":1,"text":"换场景：家里智能音箱连不上网。请用本课“先连通→再IP→后路径”的思路，设计三步排查。","opts":[],"subs":[],"ans":"①先看音箱WiFi是否连上（连通）；②进路由器查音箱是否分到IP（地址）；③试ping外网或看App路径提示（路径）。对应网络医生三查法。","al":{"考查点":"诊断方法向家庭智能设备的迁移（应用）。","解题思路":"把三查流程套到智能音箱：①先看WiFi是否连上（连通）；②进路由器查音箱是否分到IP（地址）；③ping外网或看App提示定位断点（路径）。","易错警示":"跳过“连通”直接看路径、或把音箱当电脑执行命令——迁移时保留“由近及远”思想即可。","方法点拨":"排查方法迁移题：不管什么设备，都按“近端连通→地址分配→远端路径”三层检查。"}},{"sec":"间隔复习","type":"间隔","num":1,"text":"上节课我们学了“请求-响应”模式。请用自己的话简述：你在浏览器输入网址后，浏览器和服务器各做了什么？","opts":[],"subs":[],"ans":"（第12课《万维网服务大揭秘》）　浏览器把网址作为请求发给服务器；服务器查找并处理对应网页，再把网页数据作为响应返回，浏览器显示。即请求→处理→响应。","al":{"考查点":"诊断方法论的角色扮演化转译（创造+应用）。","解题思路":"“挂号问诊卡”三部件各有要领：分诊规则要会按症状反推病因（如“QQ能上网页打不开”→DNS/浏览器问题，先查地址与代理而非物理线路）；问诊单照抄“连通—地址—路径”三步流程；就诊前自查要列“物理层最简检查”（电源、网线、无线开关）。","易错警示":"分诊不看症状直接“三步走”、自查提示太专业（让老师敲命令）都会让活动失真。","方法点拨":"“角色扮演+工具设计”题：把自己代入医生，一切设计围绕“高效定位病灶”，先分诊后检查、先简单后复杂。"}},{"sec":"思维进阶","type":"挑战","num":1,"text":"学校想把“网络故障排查”做成一个“校园网络医院”角色扮演活动，让高年级同学当“网络医生”帮老师修电脑。请你设计这套活动的核心部件——“网络医院挂号问诊卡”。请写出：①“挂号分诊”规则：根据患者描述的症状（如“网页打不开”“QQ能上网页打不开”“整栋楼断网”任选一条分析），判断应先去哪个“科室”（连通科/地址科/路径科/连接科）；②“医生问诊单”上的三步诊断流程；③给患者（老师）写一句“就诊前自查”提示，帮老师先排除最简单的故障。","opts":[],"subs":[],"open":true,"ans":"参考设计要点：①挂号分诊（以\"QQ能上网页打不开\"为例）：QQ能联网说明网络连通正常，问题出在网页服务相关环节——应挂\"连接科\"（HTTP/浏览器环节）；②三步诊断流程：第一步问症状范围（只有网页不行还是全部不行），第二步查地址与浏览器（网址对不对、换浏览器试试、看https状态），第三步查DNS与代理设置（换一个网站试试、刷新DNS）；③就诊前自查提示：\"先重启一次光猫路由器、看看别的设备能不能上网——多数小故障这两步就解决了\"。","al":{"考查点":"开放创造：故障排查的分层诊断设计（创造+应用）","解题思路":"分诊逻辑按\"连通→地址→路径→连接\"逐层定位：能连上QQ说明链路通，问题在应用层；三步流程遵循\"从粗到细\"","易错警示":"把\"QQ能上网页不行\"判为断网（连通科）是典型误诊；诊断步骤没有先后逻辑不给高分","方法点拨":"诊断题万能链：先定范围（谁坏了）→再查软件（设置对吗）→最后查配置（DNS/代理）。"}}]},{"t":"达标检测","n":"第三单元 便捷的互联网服务 · 达标检测卷","isExam":true,"qs":[{"sec":"选择题","type":"选择题","num":1,"text":"下列互联网服务中，属于“检索类”的是：","opts":[{"label":"A","text":"微信"},{"label":"B","text":"电子邮箱"},{"label":"C","text":"搜索引擎"},{"label":"D","text":"网课平台"}],"subs":[],"ans":"答案C　搜索引擎","al":{"考查点":"互联网服务类别的辨别（理解）。","解题思路":"按服务目的归类：查信息=检索类。","逐项剖析":"A项微信通信类；B项邮箱通信类；C项搜索引擎查资料=检索类，正确；D项网课学习类。","方法点拨":"归类题看目的动词：搜=检索、聊=通信、学=学习、玩=娱乐。"}},{"sec":"选择题","type":"选择题","num":2,"text":"在URL中，“路径”的主要作用是：","opts":[{"label":"A","text":"指明访问协议"},{"label":"B","text":"定位服务器上的具体页面"},{"label":"C","text":"显示锁标志"},{"label":"D","text":"对数据加密"}],"subs":[],"ans":"答案B　定位服务器上的具体页面","al":{"考查点":"URL路径的作用（理解）。","解题思路":"“路径”回答“服务器上哪个文件”。","逐项剖析":"A项协议管访问方式，错误；B项路径定位服务器上的具体页面，正确；C项锁标志是HTTPS的显示，错误；D项加密是HTTPS做的事，错误。","方法点拨":"URL五要素各司其职：协议管方式、域名管机器、端口管入口、路径管文件、参数管条件。"}},{"sec":"选择题","type":"选择题","num":3,"text":"HTTPS比HTTP更安全的关键原因是：","opts":[{"label":"A","text":"网页更美观"},{"label":"B","text":"传输过程加密"},{"label":"C","text":"不需要域名"},{"label":"D","text":"访问更慢"}],"subs":[],"ans":"答案B　传输过程加密","al":{"考查点":"HTTPS的安全性原理（理解）。","解题思路":"HTTPS＝HTTP+TLS加密，核心在传输加密。","逐项剖析":"A项美观与协议无关；B项传输加密把明文变密文，正确；C项访问仍需域名，错误；D项加密有微小开销不会更快，错误。","方法点拨":"凡问HTTPS“为什么安全”，答案落在“加密”二字。"}},{"sec":"选择题","type":"选择题","num":4,"text":"搜索引擎能“秒出结果”，主要依靠：","opts":[{"label":"A","text":"逐页扫描全网"},{"label":"B","text":"提前建好的索引"},{"label":"C","text":"人工实时查找"},{"label":"D","text":"随机猜测"}],"subs":[],"ans":"答案B　提前建好的索引","al":{"考查点":"搜索引擎的索引机制（理解）。","解题思路":"“秒出”靠预建索引——关键词到网页的映射表。","逐项剖析":"A项逐页扫描要几小时不可能秒出；B项提前建好的索引实现秒级映射，正确；C项人工实时查找规模上不可行；D项随机猜测无意义。","方法点拨":"搜索快的根源是“提前备好目录”，与图书馆编目同理。"}},{"sec":"选择题","type":"选择题","num":5,"text":"排查“无法上网”故障时，正确的第一步通常是：","opts":[{"label":"A","text":"重装系统"},{"label":"B","text":"先ping网关测连通"},{"label":"C","text":"更换浏览器"},{"label":"D","text":"删除文件"}],"subs":[],"ans":"答案B　先ping网关测连通","al":{"考查点":"网络故障排查的第一步（理解）。","解题思路":"诊断由近及远：先测本机到网关连通性。","逐项剖析":"A项重装系统是最后手段；B项先ping网关测连通，正确；C项换浏览器不解决网络层问题；D项删文件无关。","方法点拨":"口诀“先连通→再IP→后路径”，第一步永远测最近一段。"}},{"sec":"选择题","type":"选择题","num":6,"text":"关于地址栏的“锁形标志”，下列说法正确的是：","opts":[{"label":"A","text":"有锁就绝对安全"},{"label":"B","text":"钓鱼网站也可能有锁，需多方验证"},{"label":"C","text":"无锁也能放心付款"},{"label":"D","text":"锁可随意伪造无风险"}],"subs":[],"ans":"答案B　钓鱼网站也可能有锁，需多方验证","al":{"考查点":"锁形标志的安全相对性（理解+辨析）。","解题思路":"锁证明“加密传输”，不证明“网站可信”。","逐项剖析":"A项有锁≠绝对安全，错误；B项钓鱼网站可仿冒证书带锁，须多方验证，正确；C项无锁付款是危险行为；D项“随意伪造无风险”夸大且无依据。","方法点拨":"一句话：小锁管“偷看”，不管“冒充”，身份靠证书+常识验证。"}},{"sec":"判断题","type":"判断题","num":1,"text":"万维网是浏览器里的网页世界，各类服务大多通过它呈现。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"万维网统一入口地位（识记+理解）。","解题思路":"万维网=浏览器网页世界，承载多样服务——表述与教材一致，判“√”。","方法点拨":"复述定义与题干比对，一致即√。"}},{"sec":"判断题","type":"判断题","num":2,"text":"URL的端口号通常可以省略，浏览器会用协议对应的默认端口。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"URL默认端口规则（识记）。","解题思路":"默认端口（http80/https443）可省略，浏览器自动补——表述正确，判“√”。","方法点拨":"记：不写端口=用默认端口。"}},{"sec":"判断题","type":"判断题","num":3,"text":"HTTP是明文传输，在公共WiFi下输入的密码可能被截获。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"HTTP明文传输风险（理解）。","解题思路":"明文=裸奔数据，公共WiFi下可被抓包——表述正确，判“√”。","方法点拨":"“明文+公共网络=可被截获”是HTTPS存在的理由。"}},{"sec":"判断题","type":"判断题","num":4,"text":"搜索结果排在第一条的内容，一定比后面的更权威可信。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"搜索排序的权威性辨析（理解+辨析）。","解题思路":"排序受算法与广告影响，靠前≠权威——判“×”。","方法点拨":"见“一定比…更权威”绝对化表述，回想广告位即可判×。"}},{"sec":"判断题","type":"判断题","num":5,"text":"netstat命令可用于查看本机当前的活动网络连接。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"netstat命令功能（识记）。","解题思路":"netstat列出本机活动网络连接——表述正确，判“√”。","方法点拨":"netstat=network statistics，看连接状态的命令。"}},{"sec":"填空题","type":"填空题","num":1,"text":"互联网服务按功能可分为检索类、通信类、____类和娱乐类。","opts":[],"subs":[],"ans":"学习","al":{"考查点":"服务四分类识记。","解题思路":"检索/通信/学习/娱乐缺一，题干已有三类剩“学习”。","方法点拨":"口诀：搜聊学玩。"}},{"sec":"填空题","type":"填空题","num":2,"text":"打开网页时，浏览器向服务器发送“____”，服务器返回“响应”。","opts":[],"subs":[],"ans":"请求","al":{"考查点":"请求-响应术语识记。","解题思路":"浏览器向服务器发“请求”，服务器回“响应”——一对固定搭档。"}},{"sec":"填空题","type":"填空题","num":3,"text":"HTTPS是在HTTP基础上增加____（如TLS）实现加密传输。","opts":[],"subs":[],"ans":"加密","al":{"考查点":"HTTPS加密机制识记。","解题思路":"HTTP+加密=TLS→HTTPS，填“加密”。"}},{"sec":"填空题","type":"填空题","num":4,"text":"搜索引擎靠____程序自动抓取网页，再分词建索引。","opts":[],"subs":[],"ans":"爬虫","al":{"考查点":"爬虫术语识记。","解题思路":"自动抓取网页的“爬虫”程序，先抓取后建索引。"}},{"sec":"填空题","type":"填空题","num":5,"text":"诊断网络故障的流程是：先连通→再____→后路径。","opts":[],"subs":[],"ans":"IP（或查IP）","al":{"考查点":"诊断流程识记。","解题思路":"教材顺序：先连通→再查IP→后路径，第二环是“IP（查IP）”。"}},{"sec":"填空题","type":"填空题","num":6,"text":"数据封装由外到内依次为：帧→IP包→____→数据。","opts":[],"subs":[],"ans":"TCP段","al":{"考查点":"封装顺序识记。","解题思路":"由外到内：帧→IP包→TCP段→数据，第三层是“TCP段”。","方法点拨":"封装由外到内顺序与发送方向相反，背“帧IP TCP数据”四层链。"}},{"sec":"简答题","type":"简答题","num":1,"text":"用“餐厅点餐”类比，解释万维网的“请求-响应”模式（8分）。","opts":[],"subs":[],"ans":"浏览器像顾客点菜（发请求），服务器像厨房做菜（处理），再把网页像上菜一样响应回来（4分）；每次输入网址都是一次完整的请求-响应闭环（4分）。","al":{"考查点":"请求-响应模式的类比复述（理解+表达，8分）。","解题思路":"按“顾客点菜↔发请求、厨房做菜↔处理、上菜↔响应”展开，点出每次输入网址都是一次闭环。","易错警示":"类比要逐词对应，只写“像点餐”不写对应关系不得分。","方法点拨":"8分题两要点各4分：三步对应+闭环概念。"}},{"sec":"简答题","type":"简答题","num":2,"text":"请说明HTTPS的“三查法”是什么，各写一句为什么这样查，并举一处必须使用HTTPS的场景（12分）。","opts":[],"subs":[],"ans":"一查https://前缀——确认用了加密协议；二查锁形标志——直观判断是否加密；三查证书——确认网站身份可信（每点2分，共6分）。必须用HTTPS的场景：登录账号、网上支付、填写个人信息等任举一项（3分），并说明敏感信息需防窃听（3分）。","al":{"考查点":"HTTPS三查法与应用场景（应用，12分）。","解题思路":"分两部分答：三查法逐条“做法+为什么”（前缀确认加密、锁形直观判断、证书确认身份）；再举敏感场景（登录/支付/填个人信息）并说明防窃听理由。","易错警示":"漏掉“为什么这样查”或场景不说理由，会扣分。","方法点拨":"12分题按分值分配：6分给三查、6分给场景（场景3分+理由3分）。"}},{"sec":"案例分析题","type":"案例分析题","num":1,"text":"小雅在图书馆用免费WiFi想给妈妈网购生日礼物，打开支付页面发现地址栏是“http://”且无锁标志，页面还弹窗“证书错误”。请：（1）分析她此时付款有什么风险（6分）；（2）结合“三查法”说明她应怎么做（9分）。","opts":[],"subs":[],"ans":"（1）http明文传输，免费WiFi下密码与卡号可能被同网设备抓包窃听；弹窗证书错误更说明连接异常，有被钓鱼风险（6分）。（2）三查法：一查前缀——发现是http非https，应立即停止付款；二查锁标志——无锁说明未加密；三查证书——证书错误说明身份可疑。正确做法：关闭页面，改用手机流量或确认官网https地址再支付，不在此页输入任何信息（9分）。","al":{"考查点":"HTTP风险分析与三查法综合应用（分析+应用，15分）。","解题思路":"第（1）问讲清两层风险：http明文在免费WiFi可被抓包窃听+证书错误提示连接异常有钓鱼风险；第（2）问用三查法逐一判断并给出正确行动（停止付款、关页面、换流量或确认官网https再支付）。","易错警示":"只答“有风险”不说明风险机制、或只背三查法不落到“应怎么做”，均丢分。","方法点拨":"案例题先分层答“为什么危险”，再给“怎么办”的操作链，6+9两问呼应。"}},{"sec":"综合实践题","type":"综合实践题","num":1,"text":"班级要完成《万维网解密档案》最后一页“综合探秘”，请完成三项：（1）画一张“打开百度首页”的请求-响应流程图，标出浏览器、服务器、URL、响应（8分）；（2）对比填写HTTP与HTTPS一处核心区别，并说明何时必须用HTTPS（9分）；（3）为“家庭网络故障”写一份三步排查卡（连通/IP/路径），并说明tracert的作用（8分）。","opts":[],"subs":[],"ans":"（1）流程：浏览器输入URL→发请求→服务器处理→返回响应（网页）→显示（节点正确4分，标注四要素4分）。（2）核心区别示例：HTTP明文、HTTPS加密；必须用HTTPS的场景：登录、支付、填个人信息（区别4分，场景5分）。（3）三步卡：①ping网关测连通；②ipconfig查IP配置；③tracert追路径。tracert作用：逐跳显示数据经过的路由器，定位断在哪一跳（三步6分，tracert作用2分）。评分要点：知识准确、流程完整、体现综合应用。","al":{"考查点":"请求-响应流程图绘制与HTTP对比、排查卡的综合实践（应用+创造，25分）。","解题思路":"三个任务按分值组织：流程图画“输入URL→发请求→服务器处理→返回响应→显示”并标四要素；对比表写HTTP明文vs HTTPS加密并举例必须用https的场景；三步排查卡写ping/ipconfig/tracert各一句目的，重点解释tracert逐跳定位断点的作用。","易错警示":"流程图缺“浏览器/URL/响应”任一标注、tracert作用说不清，都会扣分。","方法点拨":"25分综合题先看每题分值分配篇幅，流程图画箭头链、作用解释用“逐跳显示+定位断点”八字。"}}]}]},{"t":"第四单元 校园活动线上展","isFinal":false,"lessons":[{"t":"第 16 课 · 配套练习 · 建议用时15分钟","n":"探秘网页与代码","isExam":false,"qs":[{"sec":"回忆热身","type":"回忆","num":1,"text":"用浏览器开发者工具观察网页时，我们看到网页背后是由____代码生成的。","opts":[],"subs":[],"ans":"HTML","al":{"考查点":"HTML在网页生成中的作用（识记+理解）。","解题思路":"“用开发者工具观察”→看到的是网页的“源代码”，即HTML代码，它决定了网页内容与结构。","易错警示":"勿填“CSS/JavaScript”——本课起点只讲HTML负责结构与内容。","方法点拨":"记住等式：网页＝HTML代码＋浏览器“演出”，代码是源头。"}},{"sec":"回忆热身","type":"回忆","num":2,"text":"“网页是代码的呈现”可以用“____→演出”来类比理解。","opts":[],"subs":[],"ans":"剧本","al":{"考查点":"“剧本→演出”类比的对应（识记+理解）。","解题思路":"“网页是代码的呈现”中代码相当于事先写好的“剧本”，浏览器把剧本演成画面，故填“剧本”。","易错警示":"勿把类比对象搞反：剧本是HTML（先有），演出是网页（后成）。","方法点拨":"本课金句：HTML是剧本，浏览器是导演，网页是演出。"}},{"sec":"基础巩固","type":"单选","num":1,"text":"关于“网页与HTML代码”的关系，下列正确的是：","opts":[{"label":"A","text":"网页是演员，HTML是观众"},{"label":"B","text":"网页是HTML代码经浏览器呈现后的结果"},{"label":"C","text":"没有代码网页也能自动显示"},{"label":"D","text":"HTML只负责网页的颜色"}],"subs":[],"ans":"答案B　网页是HTML代码经浏览器呈现后的结果","al":{"考查点":"网页与HTML代码的因果关系（理解）。","解题思路":"抓住“网页是…的结果”：HTML代码经浏览器渲染呈现，才成为我们看到的网页。","逐项剖析":"A项把网页当演员、HTML当观众，主客颠倒——HTML是源头不是观众，错误；B项网页是HTML代码经浏览器呈现后的结果，正确；C项“没有代码网页自动显示”违背网页生成原理，错误；D项“HTML只负责颜色”漏掉结构与内容这一主业，错误。","易错警示":"“谁产生谁”方向别搞反：代码在先、网页在后。","方法点拨":"判断题/单选题见因果表述，先画箭头“代码→网页”，凡颠倒箭头者必错。"}},{"sec":"基础巩固","type":"单选","num":2,"text":"下列标签中，用于定义网页一级大标题的是：","opts":[{"label":"A","text":"title"},{"label":"B","text":"h1"},{"label":"C","text":"img"},{"label":"D","text":"head"}],"subs":[],"ans":"答案B　h1","al":{"考查点":"一级大标题标签的识别（识记）。","解题思路":"标题标签家族h1~h6中，h1是最高级别的一级大标题。","逐项剖析":"A项title是浏览器标签页上显示的网页名称，不是正文标题，错误；B项h1定义网页一级大标题，正确；C项img插入图片，错误；D项head是头部容器，不直接显示内容，错误。","易错警示":"title与h1最易混淆：title出现在浏览器最上方的标签页，h1出现在网页正文里。","方法点拨":"标题题口诀：正文大标题找h1，浏览器标签找title。"}},{"sec":"基础巩固","type":"单选","num":3,"text":"在开发者工具里把网页文字改掉后刷新，页面又恢复原样，原因是：","opts":[{"label":"A","text":"电脑坏了"},{"label":"B","text":"这是本地临时修改，并未真正保存"},{"label":"C","text":"浏览器不支持中文"},{"label":"D","text":"老师锁定了网页"}],"subs":[],"ans":"答案B　这是本地临时修改，并未真正保存","al":{"考查点":"开发者工具临时修改的原理（理解+分析）。","解题思路":"开发者工具里的改动只作用于“正在显示的这份网页”，不改动服务器上的源文件——刷新即重新加载原文件，故复原。","逐项剖析":"A项电脑坏了与复原无关；B项本地临时修改未真正保存，刷新后重载原文件故复原，正确；C项浏览器不支持中文与实际不符（页面中文正常显示）；D项老师锁定网页没有依据。","易错警示":"“能改”不等于“改了真的网站”——工具改的是浏览器内存里的临时副本。","方法点拨":"记住实验结论：开发者工具＝安全观察窗，随便改、随便试，刷新就回到原样，放心大胆探索。"}},{"sec":"基础巩固","type":"单选","num":4,"text":"下列哪种做法符合“规范修改他人网页”的要求：","opts":[{"label":"A","text":"偷偷改掉别人的网站"},{"label":"B","text":"想改就改不用打招呼"},{"label":"C","text":"先查看学习，要修改须征得同意"},{"label":"D","text":"把整页代码删掉"}],"subs":[],"ans":"答案C　先查看学习，要修改须征得同意","al":{"考查点":"修改他人网页的规范与版权意识（理解+评价）。","解题思路":"“规范修改”=查看学习可以、动手修改须授权，这是数字公民的基本边界。","逐项剖析":"A项“偷偷改”违背授权原则；B项“想改就改”无视他人权利；C项先查看学习、要修改须征得同意，正是规范做法，正确；D项“把整页代码删掉”是破坏行为。","易错警示":"技术上“做得到”≠“可以做”，看与改是两码事。","方法点拨":"网络行为判断题套“授权三问”：这是谁的？我得到许可了吗？改完对别人有伤害吗？"}},{"sec":"基础巩固","type":"判断","num":1,"text":"网页显示出来的样子完全由HTML代码决定，浏览器只是个“播放器”。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"HTML与浏览器在网页生成中的分工（理解+辨析）。","解题思路":"题干说“完全由HTML决定，浏览器只是播放器”——漏掉了浏览器的“导演/演出”作用；HTML提供剧本，浏览器负责解析呈现，二者缺一不可，故判“×”。","易错警示":"“播放器”弱化了浏览器的解析职责——它不只是放，而是把代码“翻译演算”成页面。","方法点拨":"判断题抓角色分工：剧本（HTML）+导演（浏览器）＝演出（网页），说“只靠一方”判×。"}},{"sec":"基础巩固","type":"判断","num":2,"text":"title标签里写的文字会直接显示在网页正文的顶部大标题位置。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"title与h1的作用区分（理解+辨析）。","解题思路":"title里的文字显示在浏览器标签页（网页名称），不是正文顶部大标题——正文大标题由h1负责，故判“×”。","易错警示":"两个“标题”位置不同：标签页上的是title，页面里的大字是h1。","方法点拨":"眼见为实：打开任意网页，看浏览器最上方标签显示的是title内容。"}},{"sec":"基础巩固","type":"判断","num":3,"text":"HTML标签通常成对出现，一对标签把内容“包裹”起来，就像套娃。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"HTML标签成对闭合的规则（识记+理解）。","解题思路":"绝大多数标签成对出现：开始标签〈h1〉＋内容＋结束标签〈/h1〉，像套娃一样包裹嵌套——表述正确，判“√”。","易错警示":"img等少数自闭合标签例外，但“大多数成对”的说法成立。","方法点拨":"标签对儿像括号：有开必有合，嵌套要对称，套娃结构是网页代码的常态。"}},{"sec":"能力提升","type":"提升","num":1,"text":"连线：把左侧标签与右侧作用连线（写序号即可）。左侧：html、head、title、body、h1、p、img、a；右侧：根容器、头部、网页名称、主体、大标题、段落、图片、超链接。","opts":[],"subs":[],"ans":"html—根容器；head—头部；title—网页名称；body—主体；h1—大标题；p—段落；img—图片；a—超链接。","al":{"考查点":"八个核心标签的职责辨识（识记）。","解题思路":"按“容器—头部—名称—主体—标题—段落—图片—链接”逐对连线：html根容器、head头部、title网页名称、body主体、h1大标题、p段落、img图片、a超链接。","易错警示":"head（头部容器）与title（网页名称）是两层，别混为一项。","方法点拨":"八标签分组记：3个“框”（html/head/body）＋1个“名”（title）＋4个“料”（h1/p/img/a）。"}},{"sec":"能力提升","type":"提升","num":2,"text":"用“剧本→演出”类比，向同学解释为什么“看懂代码就能看懂网页”。","opts":[],"subs":[],"ans":"网页像话剧，HTML是剧本写清有什么、怎么排布，浏览器按剧本“演出”成画面；看懂剧本自然明白舞台为何如此呈现，故学代码即学网页原理。","al":{"考查点":"“剧本→演出”类比的迁移解释（理解+表达）。","解题思路":"按对应关系展开：HTML＝剧本（写清有什么、怎么排），浏览器＝导演＋演员（照剧本演成画面）；因此看懂剧本（代码）自然理解舞台（网页）为何这样呈现。","易错警示":"只说“网页由代码生成”而不走一遍类比，说服力不足。","方法点拨":"类比解释题句式：把A比作B，因为B怎么运作，A就怎么运作——本例B是“剧本决定演出”。"}},{"sec":"能力提升","type":"提升","num":3,"text":"观察结构：〈html〉内包含〈head〉与〈body〉，〈head〉内有〈title〉科技节〈/title〉，〈body〉内有〈h1〉欢迎〈/h1〉。回答：(1)哪部分属于头部？(2)h1嵌套在哪个标签之内？","opts":[],"subs":[],"ans":"(1)head标签及其内部title属于头部；(2)h1嵌套在body标签之内，而body与head共同嵌套在html之内。","al":{"考查点":"HTML嵌套层级结构的识读（理解+分析）。","解题思路":"按标签从属关系“剥洋葱”：head与body都直接嵌在html里；title嵌在head里；h1嵌在body里。回答时指明父子层级即可。","易错警示":"常见错误：说“h1在title里”——h1是正文内容，只可能在body里。","方法点拨":"嵌套识读题从最外层往里看：html包 head+body，head里放title，body里放可见内容。"}},{"sec":"能力提升","type":"提升","num":4,"text":"小明想验证“改代码看变化”，他在开发者工具把“欢迎”改成“你好”并刷新，页面又变回“欢迎”。请说明：(1)他想验证的道理是什么？(2)为什么刷新后又复原？","opts":[],"subs":[],"ans":"(1)验证“网页由代码控制、改代码即改显示”的对应关系；(2)开发者工具改动是本地临时修改未保存，刷新后重新加载原文件故复原。","al":{"考查点":"开发者工具实验的意义与复原原理（理解+分析）。","解题思路":"第（1）问回到本课核心：验证“改代码→改显示”的对应关系；第（2）问说明复原机制：改动是本地临时、未保存，刷新重载原文件。","易错警示":"两个问题一个答“好奇”一个答“电脑有问题”就跑偏——要落到“代码控制显示”与“临时修改”两个知识点。","方法点拨":"实验类题把“现象→原理”写成一对应答：现象是改了又复原，原理是临时修改未保存。"}},{"sec":"拓展挑战","type":"拓展","num":1,"text":"奶奶看到你做的科技节网页，问：“这花花绿绿的页面，电脑怎么知道该显示什么？”请用“剧本→演出”类比，用奶奶能听懂的话解释网页是怎么来的（含HTML与浏览器两个角色）。","opts":[],"subs":[],"ans":"好比拍戏先有剧本、再有演员演出。网页也有“剧本”叫HTML，写清页面有什么内容、怎么排；浏览器像导演，照剧本把文字图片“演”成你看到的画面。改剧本，演出就变。","al":{"考查点":"用生活类比向长辈解释网页生成（理解+表达）。","解题思路":"把抽象映射拆成奶奶熟悉的拍戏流程：剧本（HTML）→导演（浏览器）→演出（网页画面）；用“改剧本演出就变”收尾呼应代码控制原理。","易错警示":"直接说“HTML代码渲染”奶奶听不懂——必须全程用“剧本/导演/演出”说话。","方法点拨":"给长辈科普＝全程比喻：选一个她熟悉的场景（拍戏），把每个技术角色换成场景里的角色。"}},{"sec":"拓展挑战","type":"拓展","num":2,"text":"评价：小组长说“反正开发者工具能直接改网页，我们偷偷把学校官网标题改成班级口号吧”。请指出这个想法的问题，并给出正确做法（至少两点）。","opts":[],"subs":[],"ans":"错误：擅自修改他人或官方网页既违反规范也侵犯权益。正确做法：①只可在自己学习用的副本上练习修改；②真要展示班级口号应自己建网页而非改他人站点；③修改前须获授权。","al":{"考查点":"对“擅自改他人网页”的评价（评价+责任意识）。","解题思路":"先定性（违反规范、侵犯权益），再给正解三选：改自己的副本、自建页面表达、先征得授权。","易错警示":"只骂“不对”不给“怎么做”，评价不完整。","方法点拨":"“评价错误想法”题按“错在哪→该怎么做（至少两条）”组织，做法要可执行。"}},{"sec":"变式闯关","type":"变式","num":1,"text":"换一个场景：美术课上老师用投影展示一幅画，说“这是按草图画的”。请类比“剧本→演出”，说明“草图”和“画”分别对应网页制作中的什么，并解释为什么先有草图更稳妥。","opts":[],"subs":[],"ans":"草图对应HTML代码（内容与结构规划），画对应浏览器呈现的网页。先有草图（先设计结构再制作）能避免盲目动手、减少返工，正如做网页要先设计后写码。","al":{"考查点":"HTML结构与规范浏览素养的任务单化转译（创造+应用）。","解题思路":"任务单三部分各考一项能力：观察任务考“标签与元素对应”（h1大标题、img图片）；验证实验考“即改即现＋刷新复原”的科学结论表述；边界提醒考“可看不可乱改”的责任意识——设计时把每项能力变成低年级能完成的动作。","易错警示":"实验结论若写成“网页能随便改”就错了——必须点明“临时修改、未保存、不会改变真网站”。","方法点拨":"“设计任务单”题＝把知识点翻译成“观察指令+验证动作+安全边界”三段，让低年级照做即有所得。"}},{"sec":"间隔复习","type":"间隔","num":1,"text":"上节课我们通过对比实验发现了影响网页加载速度的因素。请写出其中两个因素及对应的实验结论。","opts":[],"subs":[],"ans":"（第15课《互联网实验齐发现》）　示例：①图片数量/大小——图越多越大，加载越慢；②网络带宽——带宽越高，加载越快；③服务器响应速度——响应慢则首屏延迟大（写出两个合理因素与结论即可）。","al":{"考查点":"网页加载影响因素的实验归纳（分析）。","解题思路":"每个因素须配\"改变它→观测到什么\"的结论句式，体现变量间因果。","易错警示":"只写因素不给结论，或结论与因素无因果对应。","方法点拨":"实验结论用\"当…时，…越…，加载越…\"句式最稳。"}},{"sec":"间隔复习","type":"间隔","num":2,"text":"实验中\"每次只改变一个条件\"的做法保证了什么？请用一句话说明。","opts":[],"subs":[],"ans":"（第15课《互联网实验齐发现》）　保证了实验的公平性（控制变量）：加载快慢的差异只能归因于被改变的那一个因素，结论才可靠。","al":{"考查点":"控制变量法的意义（理解）。","解题思路":"同时改变多个条件时无法判断是谁引起了结果变化；控制变量让\"结果差异=该因素的影响\"。","易错警示":"把\"控制变量\"答成\"让实验更快\"是概念错误。","方法点拨":"一句话模板：\"保证结果差异只由被改变的因素引起\"。"}},{"sec":"思维进阶","type":"挑战","num":1,"text":"科普社团要办一期“网页探秘”活动，请你设计一张《网页拆解观察任务单》，带低年级同学用浏览器开发者工具“拆开”一个网页看真相。请写出：①观察任务：要求他们找到并记录网页里的2类元素分别由哪个标签负责（如大标题、图片）；②动手验证任务：设计一个“改文字再刷新”的小实验，并说明实验结论应如何表述；③规范提醒：在任务单末尾写两句“玩转开发者工具的边界”——什么可以看、什么不可以做。","opts":[],"subs":[],"open":true,"ans":"参考设计要点：①观察任务示例：大标题由<h1>（或<h2>等标题标签）负责、图片由<img>标签负责——让同学在开发者工具Elements面板里点击元素看到高亮对应；②动手验证：在Elements面板中双击某段文字修改内容（如把\"欢迎\"改成\"你好\"）→页面立即显示新文字；但按F5刷新后恢复原样；结论表述：\"开发者工具改的只是本机内存中的显示副本，不改变服务器上的真实网页\"；③边界提醒：可以看——页面结构、样式、自己浏览器发送的请求；不可以——利用工具攻击网站、绕过付费/权限限制、把改过的截图当证据传播。","al":{"考查点":"开放创造：网页结构的探查与边界（创造+信息社会责任）","解题思路":"验证实验的结论是题眼：\"刷新即还原\"证明改的是本地副本；边界提醒分\"可以看/不可以做\"两侧且符合法纪","易错警示":"实验结论写成\"网页被我改坏了\"——没理解副本与源的区别；边界只写\"不许搞破坏\"太笼统","方法点拨":"开发者工具题三步：找标签→改副本→说清\"刷新还原\"的原理与边界。"}}]},{"t":"第 17 课 · 配套练习 · 建议用时15分钟","n":"制作网页展活动","isExam":false,"qs":[{"sec":"回忆热身","type":"回忆","num":1,"text":"制作网站的六步流程，前三步依次是：确定主题→收集素材→____。","opts":[],"subs":[],"ans":"设计结构（画结构）","al":{"考查点":"网站制作六步流程的前三步（识记）。","解题思路":"六步口诀“主题→素材→结构→制作→美化→发布”，前三步依次是确定主题、收集素材、设计结构。","易错警示":"“设计结构”常被漏掉——它是在动手写码前画区块草图的关键一步。","方法点拨":"六步记忆链：想清楚（主题）→找材料（素材）→画图纸（结构）→盖房子（制作）→刷墙（美化）→挂招牌（发布）。"}},{"sec":"回忆热身","type":"回忆","num":2,"text":"用AI帮写代码时，我们应把它当作____，而不是代笔。","opts":[],"subs":[],"ans":"助手","al":{"考查点":"AI在创作中的助手定位（理解+价值判断）。","解题思路":"题干空格前后是“当作____，而不是代笔”——对比词锁定“助手”：AI辅助生成、人负责取舍。","易错警示":"勿填“老师/工具”等宽泛词——本题强调与“代笔”的对立关系，答案要落在“助手”。","方法点拨":"本课价值红线：AI是助手不是代笔，思维先行、人做决策。"}},{"sec":"基础巩固","type":"单选","num":1,"text":"下列制作流程顺序正确的是：","opts":[{"label":"A","text":"美化→主题→结构→制作→发布→素材"},{"label":"B","text":"主题→素材→结构→制作→美化→发布"},{"label":"C","text":"素材→发布→主题→制作→结构→美化"},{"label":"D","text":"结构→发布→主题→素材→制作→美化"}],"subs":[],"ans":"答案B　主题→素材→结构→制作→美化→发布","al":{"考查点":"网站制作流程的正确顺序（识记）。","解题思路":"按“先规划后动手”原则排序：定主题（做什么）→收素材（用什么）→画结构（怎么排）→写码制作→美化→发布。","逐项剖析":"A项美化开头、素材结尾，顺序颠倒，错误；B项主题→素材→结构→制作→美化→发布完全符合规范六步，正确；C项素材开头发布第二，乱序，错误；D项结构开头，未定主题先画结构不合逻辑，错误。","易错警示":"“美化”与“发布”的顺序：必须先美化定稿再发布，不能先发布再美化。","方法点拨":"流程排序题抓两端（开头定主题、结尾发布）再排中间，先设计后制作是铁律。"}},{"sec":"基础巩固","type":"单选","num":2,"text":"在HTML中要插入一张图片，应当使用的标签是：","opts":[{"label":"A","text":"h1"},{"label":"B","text":"p"},{"label":"C","text":"img"},{"label":"D","text":"a"}],"subs":[],"ans":"答案C　img","al":{"考查点":"img图片标签的识别（识记）。","解题思路":"“插入图片”→img标签（image缩写），常配src属性指定图片位置。","逐项剖析":"A项h1大标题；B项p段落；C项img插入图片，正确；D项a超链接跳转。","易错警示":"img是自闭合标签（无配对结束标签），但选项题只考功能识别。","方法点拨":"标签功能速记：图（img）链（a）题（h1）段（p），见功能对号入座。"}},{"sec":"基础巩固","type":"单选","num":3,"text":"老师强调“AI是助手不是代笔”，主要为了防止：","opts":[{"label":"A","text":"学生用得太慢"},{"label":"B","text":"学习外包，不动脑只复制"},{"label":"C","text":"AI收费太贵"},{"label":"D","text":"电脑发热"}],"subs":[],"ans":"答案B　学习外包，不动脑只复制","al":{"考查点":"“AI是助手不是代笔”的教育意义（理解+评价）。","解题思路":"“防止”什么＝AI滥用带来的学习风险：直接让AI代劳、自己不动脑，即“学习外包”。","逐项剖析":"A项“用得太慢”不是老师担心的方向（用得快才要防外包）；B项学习外包、不动脑只复制——正是“代笔”的危害，正确；C项收费价格与教学原则无关；D项电脑发热无关。","易错警示":"“AI用得太多”不是问题本质，本质是“用AI替代思考”还是“用AI辅助思考”。","方法点拨":"凡见“防止外包”，回扣本课主张：先独立设计，再请AI帮忙，最后自己取舍。"}},{"sec":"基础巩固","type":"单选","num":4,"text":"小王写网页时图片显示不出，最可能的检查点是：","opts":[{"label":"A","text":"网页标题太长"},{"label":"B","text":"img的src路径写错或图片不在同文件夹"},{"label":"C","text":"段落太多"},{"label":"D","text":"字体太大"}],"subs":[],"ans":"答案B　img的src路径写错或图片不在同文件夹","al":{"考查点":"图片无法显示的原因排查（分析）。","解题思路":"图片由img的src属性定位文件，最常见的故障是src路径写错或图片没和网页放一起。","逐项剖析":"A项标题长短不影响图片显示；B项src路径错误或图片不在同文件夹，浏览器找不到文件自然显示不出，正确；C项段落数量无关；D项字号无关。","易错警示":"中文文件名/文件夹路径也是常见坑——核对文件名大小写与所在目录。","方法点拨":"“图片裂了”排查口诀：一看src路径对没对，二看图片在不在一起（同文件夹），三看文件名写没写错。"}},{"sec":"基础巩固","type":"判断","num":1,"text":"做网页应当先敲键盘写代码，等到一半再想主题也不迟。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"先设计后制作的流程思想（理解+辨析）。","解题思路":"题干主张“先敲键盘、中途再想主题”——颠倒了先规划后动手的原则，盲目写码易返工，故判“×”。","易错警示":"“动手快=效率高”是误区，主题不清时写得越快返工越多。","方法点拨":"流程判断题：先定主题再动手是铁律，凡“边做边想、做了再说”判×。"}},{"sec":"基础巩固","type":"判断","num":2,"text":"HTML标签必须正确闭合、规范嵌套，否则网页可能显示异常。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"标签闭合与规范嵌套的要求（理解）。","解题思路":"标签不闭合、嵌套错位会让浏览器解析混乱、显示异常——表述符合规范要求，判“√”。","方法点拨":"标签如括号：有开有闭、对称嵌套，这是网页正常显示的底线。"}},{"sec":"基础巩固","type":"判断","num":3,"text":"AI生成的网页代码可以直接一字不改地提交作为自己的作品。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"AI生成内容的合理使用（理解+评价）。","解题思路":"题干主张“一字不改直接提交”——正是学习外包；AI产出须经自己取舍修改并说明，故判“×”。","易错警示":"能“直接能用”不代表“可以直接交”——作品的核心是自己设计与取舍的过程。","方法点拨":"凡“AI产出直接提交/一字不改”表述，一律违反“助手不代笔”原则，判×。"}},{"sec":"能力提升","type":"提升","num":1,"text":"排序：把下列步骤按正确顺序排列，写序号。甲设计网页结构草图；乙收集科技节图片与文字；丙确定子页主题；丁用HTML补全代码制作。","opts":[],"subs":[],"ans":"丙（定主题）→乙（收素材）→甲（画结构）→丁（写代码）。","al":{"考查点":"制作流程前四步的排序（应用）。","解题思路":"按六步流程前四步对应：丙定主题→乙收素材→甲画结构→丁写代码制作。","易错警示":"“画结构草图”必须在“写代码”前——草图是代码的图纸。","方法点拨":"排序题先识别各选项属于六步中哪一步，再按固定顺序重排。"}},{"sec":"能力提升","type":"提升","num":2,"text":"补全代码：请在下方的网页骨架中补全缺少的闭合标签，使结构完整。〈html〉〈head〉〈title〉机器人比赛〈/title〉〈/head〉〈body〉〈h1〉欢迎参观〈/h1〉〈p〉今年我们参加了……〈/p〉","opts":[],"subs":[],"ans":"需在末尾依次补上〈/body〉与〈/html〉，使body与html正确闭合；h1、p均已闭合，结构完整。","al":{"考查点":"HTML标签闭合的补全（应用）。","解题思路":"检查嵌套结构：html是根容器必须闭合，body是主体必须闭合；题干缺〈/body〉与〈/html〉两个结束标签，补上即完整。","易错警示":"只补一个漏一个、或顺序写反（先/body后/html）都会错——闭合顺序与开始顺序相反。","方法点拨":"补全标签题从最内层往外检查：先看内层对子齐不齐，最后确认根标签闭合。"}},{"sec":"能力提升","type":"提升","num":3,"text":"分析：比较“手写代码”与“AI生成代码”两种做法的利弊各一条，并说明你会如何结合使用。","opts":[],"subs":[],"ans":"手写利在理解透彻、可控性强，弊在速度慢易出错；AI利在快速出初稿，弊在可能不直接合用。我会先画草图自己试写，再用AI生成对比、保留要用的并改掉不符处。","al":{"考查点":"手写与AI生成代码的辩证比较（分析+评价）。","解题思路":"利弊各一条要“成对”：手写（理解深、可控强 vs 慢易错）、AI（快出稿 vs 未必合用、易外包）。结合方式＝先自己设计试写→AI生成对照→保留适用、修改不符、说明理由。","易错警示":"只说“AI又快又好，以后都用AI”或“AI不可靠不用”都是单边思维。","方法点拨":"“如何结合”题给固定三步：先自己想→请AI对比→人做取舍，取舍是核心。"}},{"sec":"能力提升","type":"提升","num":4,"text":"连线：左侧行为 ①先画结构草图 ②直接使用AI整页输出 ③同桌互查标签闭合 ④给图片写清src路径；右侧归类 属先设计后制作、属学习外包风险、属协作质检、属规范书写。","opts":[],"subs":[],"ans":"①—先设计后制作；②—学习外包风险；③—协作质检；④—规范书写。","al":{"考查点":"良好实践与风险行为的归类（应用）。","解题思路":"按行为本质归类：先画草图＝先设计后制作；直接用AI整页输出＝学习外包风险；同桌互查＝协作质检；给图片写清src＝规范书写。","易错警示":"“直接使用AI整页输出”看着高效，本质是把思考外包——归入风险类。","方法点拨":"归类题先问“这个动作里人有没有在思考”，人思考=良好实践，人缺席=风险行为。"}},{"sec":"拓展挑战","type":"拓展","num":1,"text":"情境：你是科技节“AI画展”子页设计师，已确定主题。请写出制作计划：①选哪类素材；②页面分哪几个区块；③遇到写不出代码时怎么用AI且不外包。","opts":[],"subs":[],"ans":"①素材：学生AI画作图片加创作说明加投票二维码；②区块：大标题、作品展示区、文字介绍、联系方式；③先自己画草图写初稿，再让AI生成候选对比，只采用合适部分并标注改动理由，绝不整页照搬。","al":{"考查点":"制作计划的综合规划与AI取舍（分析+创造）。","解题思路":"计划四问齐答：素材（图片+文字+二维码）→区块（标题/展示/介绍/联系）→AI用法（先自己画草稿写初稿→AI出候选→只取合适部分并注明理由）。","易错警示":"AI部分只写“用AI生成”而无“先自己想＋人工取舍”环节，就是外包写法。","方法点拨":"“制作计划”题按“材料—结构—工具边界”三层答，AI永远放在“人先想”之后。"}},{"sec":"拓展挑战","type":"拓展","num":2,"text":"评价：甲花一小时手写了子页但样式朴素；乙用AI十分钟生成华丽页面直接提交。若你是评审更认可谁？给出两条理由并说明“作品要有你的想法”的含义。","opts":[],"subs":[],"ans":"更认可甲。理由：①甲经自己设计思考，过程即学习；②乙的页面非其原创思路，属外包。作品要有“你的想法”指内容结构由自己规划、代码经自己理解取舍，而非复制他人输出。","al":{"考查点":"作品原创性与学习过程的评价（评价）。","解题思路":"更认可甲：①自己设计的过程就是学习（过程价值）；②乙的页面是AI思路非其原创（外包）。再解释“作品要有你的想法”＝内容结构自己规划、代码自己取舍。","易错警示":"按“谁好看选谁”评价就掉进出品导向陷阱——比赛看的是学习与成长。","方法点拨":"评价“谁更值得认可”题，标准不是成品光鲜度，而是“想法从哪来、学习有没有发生”。"}},{"sec":"变式闯关","type":"变式","num":1,"text":"换场景：班刊也要上线。请照样说出班刊电子版的制作流程前三步，并指出若用AI帮忙写版式代码，应在哪一步之后、且必须做什么。","opts":[],"subs":[],"ans":"前三步：定班刊主题→收集文章与插画素材→设计版面结构。AI应在“设计结构”之后用于生成候选代码，且必须自己审核取舍、说明采用与改动，不得直接提交。","al":{"考查点":"制作流程与AI边界的场景迁移（应用）。","解题思路":"班刊电子版套用同一框架：定主题→收文章插画→设计版面；AI帮忙写版式代码须在“设计版面”之后，且必须自己审核取舍、说明改动。","易错警示":"迁移时把“六步”机械照搬成“六步一样的内容”不对——抓住“先设计后制作＋AI在人工设计后介入”两个灵魂即可。","方法点拨":"变式迁移题抓“不变的流程思想”，换场景不换逻辑：先规划、人主导、AI辅助。"}},{"sec":"间隔复习","type":"间隔","num":1,"text":"上节课认识了核心标签。请写出html、body、h1、img四个标签各自的作用，并指出哪个标签负责“网页里的图片”。","opts":[],"subs":[],"ans":"（第16课《探秘网页与代码》）　html是根容器包裹整页；body是主体放可见内容；h1是一级大标题；img插入图片。负责图片的是img标签。","al":{"考查点":"六步流程的项目化执行与人机分工设计（创造+应用）。","解题思路":"《项目推进表》三件套：流程表要“每步有责任人和可检查的产出”；AI介入点放在“人先设计后”（制作/美化阶段），边界要写清“允许生成候选、禁止代替决策与整页照搬”；完工标准要可自查（打得开、图不裂、链接通、三查过）。","易错警示":"六步产出写“写代码”“美化”等动作而非成果物，或AI边界只写“不能用”不写“怎么用”，都不合格。","方法点拨":"“项目管理表”题的本质：把流程变成“谁＋做什么＋交什么”的三栏清单，AI只是其中一个受约束的“帮手”。"}},{"sec":"思维进阶","type":"挑战","num":1,"text":"你们小组要为学校“AI画展”制作子网页，组长任命你为“项目经理”。请按本课六步流程设计一份《项目推进表》：①写出六步中每一步的“责任人＋要产出的东西”（如主题这一步的产出是一句话主题）；②在第几步引入AI最合适？写明给AI的任务边界（让它干什么、不许它干什么）；③设计一句“完工标准”让小组自查——什么情况下这个页面才算真正做完。","opts":[],"subs":[],"open":true,"ans":"参考设计要点：①六步推进表示例：定主题——项目经理产出\"一句话主题\"；拟提纲——全员产出内容清单；做结构——HTML负责人产出页面骨架；添内容——内容负责人产出图文素材；做美化——CSS负责人产出配色样式；查发布——质检员产出检查记录与上线页面；②引入AI最合适在\"添内容\"步：让AI帮写文案初稿、推荐图片布局，但不许它替小组决定主题与观点、不许直接采用其图片素材（版权风险），所有AI产出须人工核验后使用；③完工标准：\"主题一句话说得清、内容三屏读得完、手机电脑打开都正常、每张图都有来源标注——四条全过才算做完\"。","al":{"考查点":"开放创造：项目流程与人机分工设计（创造+管理）","解题思路":"六步各配\"责任人+产出物\"才成其为推进表；AI引入环节要写清\"能干/不许干\"两条边界；完工标准须可自查","易错警示":"步骤没有产出物=流水账；AI边界只写\"帮忙做\"没有\"不许做\"不符合AI使用规范","方法点拨":"项目题三查：每步有责任人吗？AI边界清晰吗？完工标准可验证吗？"}}]},{"t":"第 18 课 · 配套练习 · 建议用时15分钟","n":"美化网页方法多","isExam":false,"qs":[{"sec":"回忆热身","type":"回忆","num":1,"text":"CSS的中文全称是“____样式表”，它负责网页的“怎么好看”。","opts":[],"subs":[],"ans":"层叠","al":{"考查点":"CSS中文全称的识记（识记）。","解题思路":"CSS＝Cascading Style Sheets，“Cascading”译为“层叠”——强调后写覆盖先写。","易错警示":"“样式表”前的限定词是“层叠”，不是“网页/美化”。","方法点拨":"把CSS记成“给网页化妆的层叠贴纸”，后贴的盖住先贴的。"}},{"sec":"回忆热身","type":"回忆","num":2,"text":"CSS语法的一般形式是：选择器{____:值;}，口诀是“谁{什么:怎么样}”。","opts":[],"subs":[],"ans":"属性","al":{"考查点":"CSS语法结构的识记（识记）。","解题思路":"CSS语法口诀“谁{什么:怎么样}”：选择器{属性:值;}，空格处填“属性”。","易错警示":"“选择器”与“属性”位置别反：选择器在花括号外，属性在花括号内。","方法点拨":"记例句：p{color:red;}——p是“谁”，color是“什么”，red是“怎么样”。"}},{"sec":"基础巩固","type":"单选","num":1,"text":"关于CSS“样式与内容分离”，下列理解正确的是：","opts":[{"label":"A","text":"内容与样式必须写在一起"},{"label":"B","text":"内容由HTML管，样式由CSS集中管，换样式不改内容"},{"label":"C","text":"CSS只能改颜色"},{"label":"D","text":"分离后网页无法显示"}],"subs":[],"ans":"答案B　内容由HTML管，样式由CSS集中管，换样式不改内容","al":{"考查点":"样式与内容分离思想（理解）。","解题思路":"“分离”＝分工：HTML管“说什么”（内容），CSS管“怎么好看”（样式），换样式不必改内容。","逐项剖析":"A项“必须写在一起”违背分离思想，错误；B项内容归HTML、样式归CSS集中管，换样式不动内容，正确；C项“只能改颜色”窄化CSS（还能管字号、背景、对齐等），错误；D项“分离后网页无法显示”与事实相反。","易错警示":"“分离”不是“分开两个文件”这么简单，核心是职责分工——改外观不影响内容结构。","方法点拨":"分离思想一句话：网页像人，HTML是骨架与内容，CSS是衣服，换衣服不用换身体。"}},{"sec":"基础巩固","type":"单选","num":2,"text":"下列CSS属性中，用于设置文字颜色的是：","opts":[{"label":"A","text":"font-size"},{"label":"B","text":"background"},{"label":"C","text":"color"},{"label":"D","text":"text-align"}],"subs":[],"ans":"答案C　color","al":{"考查点":"CSS颜色属性的识别（识记）。","解题思路":"“设置文字颜色”→color属性；其余选项各有分工。","逐项剖析":"A项font-size设字号；B项background设背景；C项color设文字颜色，正确；D项text-align设对齐方式。","易错警示":"color与background易混：color是“字”的颜色，background是“底”的颜色。","方法点拨":"属性速记：色字color、色底background、大字font-size、对齐text-align。"}},{"sec":"基础巩固","type":"单选","num":3,"text":"用HTML的font color等属性美化，改三处要写三遍，这说明它：","opts":[{"label":"A","text":"比CSS更先进"},{"label":"B","text":"烦琐难维护"},{"label":"C","text":"不能改颜色"},{"label":"D","text":"会自动同步"}],"subs":[],"ans":"答案B　烦琐难维护","al":{"考查点":"HTML内联样式缺陷的认识（理解+分析）。","解题思路":"用font属性改三处颜色要写三遍→重复劳动、页面一大就乱，即“烦琐难维护”。","逐项剖析":"A项比CSS更先进与事实相反（CSS正是为解决它而生）；B项重复书写、难维护，正确；C项“不能改颜色”与题干前提矛盾；D项“自动同步”不存在——HTML属性彼此独立不会联动。","易错警示":"“写三遍”的痛点正是CSS“写一次管一片”优势的来源。","方法点拨":"凡问“为什么要学CSS”，答案锚定痛点：HTML分散写法改一处要改多处，CSS集中管理一处生效全局。"}},{"sec":"基础巩固","type":"单选","num":4,"text":"关于CSS“层叠”，下列说法正确的是：","opts":[{"label":"A","text":"前面的样式永远生效"},{"label":"B","text":"后面的样式会覆盖前面的同名样式"},{"label":"C","text":"多个样式无法共存"},{"label":"D","text":"层叠只发生在图片上"}],"subs":[],"ans":"答案B　后面的样式会覆盖前面的同名样式","al":{"考查点":"CSS层叠机制的理解（理解）。","解题思路":"“层叠”＝同名样式后者覆盖前者，如贴纸后贴盖先贴。","逐项剖析":"A项“前面永远生效”与层叠规则相反；B项后面的样式覆盖前面的同名样式，正确；C项“多个样式无法共存”否认了不同属性可叠加共存；D项“只发生在图片上”无稽。","易错警示":"层叠是同名属性“后胜前”，不同属性是“共存叠加”——别把两者搞混。","方法点拨":"记贴纸比喻：两张同款贴纸叠一起，后贴的在上；不同内容的贴纸各贴各的位置。"}},{"sec":"基础巩固","type":"判断","num":1,"text":"CSS能让网页“换衣服不换身体”，说明改样式不必改动HTML内容。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"样式与内容分离的应用（理解+辨析）。","解题思路":"“换衣服不换身体”即改样式不动内容——CSS只调呈现、HTML正文不变，表述正确，判“√”。","方法点拨":"见“换装/换衣服”类比出现，对应分离思想，判√。"}},{"sec":"基础巩固","type":"判断","num":2,"text":"只要用了很多颜色，网页就一定美观专业。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"配色的审美判断（理解+评价）。","解题思路":"题干“只要颜色多就一定美观”绝对化：色彩需协调并服务内容，堆砌反显杂乱——判“×”。","易错警示":"“多彩=好看”是小学生审美误区；专业原则是简洁大方、和谐统一。","方法点拨":"配色判断题：多≠美，协调与主题匹配才是美。"}},{"sec":"基础巩固","type":"判断","num":3,"text":"写CSS时属性与值之间用分号结尾，像句子结尾加句号。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"CSS书写的分号规范（识记+理解）。","解题思路":"CSS声明以分号结尾分隔多条属性（如p{color:red;font-size:12px;}），像句子加句号——表述正确，判“√”。","易错警示":"漏分号会导致后续属性失效或解析错误。","方法点拨":"写CSS口诀：属性冒号值，分号来结尾。"}},{"sec":"能力提升","type":"提升","num":1,"text":"补全CSS：请写出让所有段落文字变蓝色、字号为18像素的代码。","opts":[],"subs":[],"ans":"p{color:blue; font-size:18px;}（颜色也可写具体色值，字号单位px即可）。","al":{"考查点":"CSS选择器与声明的书写（应用）。","解题思路":"“所有段落”用标签选择器p；“蓝色”写color:blue（或具体色值）；“18像素”写font-size:18px——组合成p{color:blue;font-size:18px;}。","易错警示":"属性与值之间是冒号不是等号；多条声明间用分号；单位px不能丢。","方法点拨":"写CSS三步：选“谁”（选择器）→写“什么”（属性:）→填“怎么样”（值;）。"}},{"sec":"能力提升","type":"提升","num":2,"text":"连线：左侧 color、font-size、background、text-align，右侧 文字颜色、字号、背景、对齐方式。","opts":[],"subs":[],"ans":"color—文字颜色；font-size—字号；background—背景；text-align—对齐方式。","al":{"考查点":"四个常用CSS属性的连线（识记）。","解题思路":"按含义连线：color文字颜色、font-size字号、background背景、text-align对齐。","易错警示":"text-align（对齐）与text-decoration（下划线）别混——本课只考前四个。","方法点拨":"属性名背英文含义即可对应：color颜色、size大小、background背景、align对齐。"}},{"sec":"能力提升","type":"提升","num":3,"text":"分析：同样一段文字，甲用HTML的font属性改了红色，乙用CSS改了红色。从“以后要改十处”的角度，谁的做法更好？为什么？","opts":[],"subs":[],"ans":"乙更好。CSS可集中写一次规则就让所有同类元素生效，改十处只改一条；HTML属性要逐处写，改十处需改十次，烦琐难维护。","al":{"考查点":"HTML属性与CSS在维护场景中的优劣比较（分析+评价）。","解题思路":"结论“乙更好”+理由：CSS写一次规则管所有同类元素，改十处只改一条；HTML逐处写、改十处改十次。","易错警示":"别停在“CSS更先进”的口号，要用“改十处”这个具体数字对比说服。","方法点拨":"方案比较题用“改一处vs改十处”的维护成本说话，量化对比最有说服力。"}},{"sec":"能力提升","type":"提升","num":4,"text":"设计：为科技节网页选一套配色（主色加背景加标题色），说明这样配的理由（提示：简洁大方、服务内容）。","opts":[],"subs":[],"ans":"主色科技蓝#1e90ff、背景浅蓝#f0f8ff、标题深蓝#003366。理由：蓝色系冷静专业契合科技主题，深浅搭配层次清晰不刺眼，符合校园简洁大方要求。","al":{"考查点":"主题配色的设计与论证（应用+创造）。","解题思路":"配色三件套：主色+背景+标题色；论证从“契合主题＋便于阅读＋简洁大方”三角度展开，给出具体色值更专业。","易错警示":"只报色名不给色值、或理由空泛（“好看”）不符合“服务内容”的要求。","方法点拨":"设计配色方案答题公式：色（给色值）＋感（传达什么情绪）＋合（为什么配这个主题）＋读（文字清不清晰）。"}},{"sec":"拓展挑战","type":"拓展","num":1,"text":"情境：你负责美化小组主页，组员意见不一——小美要“五彩斑斓”，阿强要“全黑酷炫”。请用本课“配色服务内容、简洁大方”的原则，提出一套折中方案并说明说服两人的理由。","opts":[],"subs":[],"ans":"采用科技蓝主色加浅色背景加深色文字的统一方案。理由：①校园展示受众是师生，清爽配色更专业易读；②五彩或全黑都干扰阅读、偏离科技节主题；③统一风格让各板块协调。先统一再允许小点缀。","al":{"考查点":"审美冲突中的方案协调（分析+评价）。","解题思路":"折中方案要立得住的理由：受众（师生要看易读）＋主题（科技节要专业）＋统一（板块协调）——先统一主调、再允许小点缀，兼顾小美的“彩”与阿强的“酷”。","易错警示":"直接站队“听小美的/听阿强的”没有协调；或方案没有理由支撑，说服不了人。","方法点拨":"协调冲突题三段式：立标准（配色服务内容）→出方案（主色+统一）→给让步（小面积点缀满足个性）。"}},{"sec":"拓展挑战","type":"拓展","num":2,"text":"评价：有人说“既然AI能一键生成配色，学生就不用学CSS了”。结合“层叠机制”和“审美判断仍需人工”，谈谈你的看法（两点）。","opts":[],"subs":[],"ans":"不认同。①CSS层叠等机制学生需懂，才能改AI产出、排查覆盖问题；②配色是否服务内容、是否协调，审美判断AI无法替人决定。学CSS是掌握核心能力，AI只是辅助。","al":{"考查点":"AI与CSS基础技能关系的辨析（评价）。","解题思路":"两点理由：①不懂层叠等机制就无法改AI产出、排查样式覆盖问题；②审美判断（是否服务内容、协调与否）AI无法替人决定。结论：核心技能须先掌握，AI只作辅助。","易错警示":"只说“AI生成的不够好”没有知识依据；要点在“会基础才能用好AI”。","方法点拨":"“有AI还用学基础吗”类题的标准答法：工具替你干活的前提是你会判断它干得好不好。"}},{"sec":"变式闯关","type":"变式","num":1,"text":"换场景：做海报也讲“内容与样式分离”——文字是内容，配色排版是样式。请类比CSS，说明为什么先定文案再统一调色比边写边改色更高效。","opts":[],"subs":[],"ans":"如同HTML与CSS分离，先定文案（内容）再统一调色（样式）可一次性套用整套风格，避免每句单独调色；要改风格只改一处，高效且风格统一。","al":{"考查点":"内容样式分离思想的跨媒介迁移（应用）。","解题思路":"海报制作类比CSS：先定文案（内容）再统一调色（样式）→风格一次套用、要改只改一处，避免边写边调的低效。","易错警示":"迁移要落在“为什么高效”：分离让“全局改样式”成为可能，混写则处处手改。","方法点拨":"“类比CSS”题＝把“内容与样式分层处理”的思想搬到新场景，理由都归结为“一次管全局”。"}},{"sec":"间隔复习","type":"间隔","num":1,"text":"第16课讲过“网页等于HTML代码的呈现”。请写出两个你记得的核心标签，并说明CSS出现后，谁负责“内容”、谁负责“样式”。","opts":[],"subs":[],"ans":"（第16课《探秘网页与代码》）　例：h1（大标题）、p（段落）、img（图片）等任两个。HTML负责内容结构，CSS负责样式美化，二者分工即“内容与样式分离”。","al":{"考查点":"CSS选择器/层叠与配色审美的综合运用（创造+评价）。","解题思路":"“换装方案”三部分层层递进：配色要“色值+感觉+契合主题”三段论证；统一标题用组选择器（h1,h2,h3{...}）体现集中管理；点缀要活用层叠（后写规则局部覆盖）而非推翻主调。","易错警示":"点缀若写成“全部换成红色”就破坏了统一——层叠的正确用法是“小范围、后写入、可覆盖”。","方法点拨":"设计类题记住“统一中求变化”：主色系定基调（统一），后写样式做局部强调（变化），这正是CSS层叠的真实用武之地。"}},{"sec":"思维进阶","type":"挑战","num":1,"text":"你们小组的“班级活动主页”要参加学校“最美网页”评比，评委强调“配色要服务内容、风格统一”。请你担任“视觉总监”，为主页做一套“换装方案”。请写出：①你选定的主色与背景色（可给色值或颜色名），并说明这套配色想传达什么感觉、为什么契合“班级活动”主题；②设计一条CSS规则，让主页所有标题统一成主色（写出选择器与代码）；③如果评委说“颜色太素”，你会怎么用CSS的“层叠”特性做一处小点缀又保持整体统一——写出做法。","opts":[],"subs":[],"open":true,"ans":"参考设计要点：①主色示例：活力橙#FF8C42配浅米背景#FFF8F0——传达温暖、朝气与参与感，契合\"班级活动\"的集体氛围与展示属性；②CSS规则：h1,h2,h3{color:#FF8C42;}——用群组选择器一次性统一所有标题色；③小点缀做法：利用层叠\"后者覆盖前者\"特性，在全局标题规则之后单独为活动日期标题写一条 .hero-title{color:#2E86AB;}——新规则只在特定元素生效，整体主色不变，形成\"万绿丛中一点蓝\"的统一点缀。","al":{"考查点":"开放创造：配色设计层叠特性的应用（创造+应用）","解题思路":"配色要给色值并说\"传达什么感觉+为何契合主题\"；CSS规则要有选择器；点缀必须借\"层叠覆盖\"机制且不破坏统一","易错警示":"只换颜色不说设计理由；点缀做法是\"再改全站主色\"则违背统一原则","方法点拨":"配色题公式：色值+情绪解释+一条可执行的CSS，点缀题必提\"层叠覆盖\"。"}}]},{"t":"第 19 课 · 配套练习 · 建议用时15分钟","n":"多人协同效率高","isExam":false,"qs":[{"sec":"回忆热身","type":"回忆","num":1,"text":"多人同时编辑同一文档、实时同步，这种工作方式叫____编辑。","opts":[],"subs":[],"ans":"在线协同（协同）","al":{"考查点":"在线协同编辑概念的识记（识记+理解）。","解题思路":"“多人同时编辑同一文档、实时同步”→这种工作方式叫在线协同（协同）编辑。","易错警示":"勿写“远程/共享”——本题强调“多人同编+实时同步”的协同本质。","方法点拨":"在线协同三特征：同文档、同时编、实时见。"}},{"sec":"回忆热身","type":"回忆","num":2,"text":"Markdown是一种比HTML更简单的____标记语言，可转换为HTML。","opts":[],"subs":[],"ans":"轻量","al":{"考查点":"Markdown的轻量特性（识记）。","解题思路":"“比HTML更简单的____标记语言”→轻量（标记）语言，用简单符号写作、发布时转成HTML。","易错警示":"“轻量”强调语法简单；勿写“标准/重量级”。","方法点拨":"Markdown＝“写信一样写网页”，符号少、门槛低、能转换。"}},{"sec":"基础巩固","type":"单选","num":1,"text":"相比“各自做完再发给组长合并”，在线协同编辑的最大优势是：","opts":[{"label":"A","text":"必须注册付费"},{"label":"B","text":"实时同步、免手动汇总、可留痕"},{"label":"C","text":"只能一个人写"},{"label":"D","text":"文件更容易丢"}],"subs":[],"ans":"答案B　实时同步、免手动汇总、可留痕","al":{"考查点":"在线协同相对传统汇总的优势（理解+评价）。","解题思路":"对比焦点：省去“先各做再合并”的人工环节——实时同步＋免手动汇总＋留痕可追溯。","逐项剖析":"A项“必须注册付费”不符合事实（多数协同工具免费）；B项实时同步、免手动汇总、可留痕，正是最大优势，正确；C项“只能一个人写”与协同本质矛盾；D项“文件更容易丢”与云端自动保存相反。","易错警示":"别选“免付费”这类次要项——题目问“最大优势”要落在工作方式变革。","方法点拨":"协同优势三件套背熟：实时同步（并行快）、免汇总（省人工）、可留痕（能追溯）。"}},{"sec":"基础巩固","type":"单选","num":2,"text":"下列Markdown语法中，表示“一级标题”的是：","opts":[{"label":"A","text":"**文字**"},{"label":"B","text":"- 文字"},{"label":"C","text":"# 文字"},{"label":"D","text":"| 表格 |"}],"subs":[],"ans":"答案C　# 文字","al":{"考查点":"Markdown一级标题语法（识记）。","解题思路":"Markdown中“# 文字”表示一级标题（井号数=标题级别）。","逐项剖析":"A项**文字**是加粗；B项“- 文字”是无序列表；C项“# 文字”是一级标题，正确；D项“| 表格 |”是表格语法。","易错警示":"#号数量与级别对应：#=一级、##=二级，别写成# #（带空格错误）。","方法点拨":"Markdown速记：#标题、**加粗**、-列表、|表格|。"}},{"sec":"基础巩固","type":"单选","num":3,"text":"《协同公约》中“不覆盖”指的是：","opts":[{"label":"A","text":"不准用电脑"},{"label":"B","text":"不随意改动或删除他人已写的内容"},{"label":"C","text":"不保存文件"},{"label":"D","text":"不联网"}],"subs":[],"ans":"答案B　不随意改动或删除他人已写的内容","al":{"考查点":"协同公约“不覆盖”的含义（理解）。","解题思路":"“不覆盖”＝不随意改动或删除他人已写内容，尊重他人劳动。","逐项剖析":"A项“不准用电脑”荒谬；B项不随意改动删除他人已写内容，正是“不覆盖”的内涵，正确；C项“不保存文件”与协同要求相反；D项“不联网”无法协同。","易错警示":"“不覆盖”不是“不合作”，而是“改前先沟通、不擅自动他人成果”。","方法点拨":"协同黄金法则：先沟通、再动手；分区写作、留痕可查。"}},{"sec":"基础巩固","type":"单选","num":4,"text":"关于Markdown与HTML的关系，正确的是：","opts":[{"label":"A","text":"两者毫无关系"},{"label":"B","text":"Markdown可转换为HTML，是更轻量的写法"},{"label":"C","text":"Markdown比HTML更复杂"},{"label":"D","text":"HTML不能显示Markdown内容"}],"subs":[],"ans":"答案B　Markdown可转换为HTML，是更轻量的写法","al":{"考查点":"Markdown与HTML的关系（理解）。","解题思路":"Markdown是轻量写法，发布时“翻译”成标准HTML——两者是“简化写法→标准语法”的关系。","逐项剖析":"A项“毫无关系”错误；B项Markdown可转换为HTML、是更轻量的写法，正确；C项“比HTML更复杂”与事实相反；D项“HTML不能显示Markdown内容”混淆转换机制（内容经转换后由HTML承载）。","易错警示":"Markdown不能直接被浏览器渲染，要先转换成HTML——但转换后当然能显示。","方法点拨":"记转换链：Markdown（人好写）→转换→HTML（浏览器认）→网页。"}},{"sec":"基础巩固","type":"判断","num":1,"text":"协同编辑就是所有人挤在一台电脑前轮流打字。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"在线协同与轮流打字的区别（理解+辨析）。","解题思路":"题干描述的是“挤一台电脑轮流打字”的旧方式；在线协同是各用各设备同时编辑、实时同步——判“×”。","易错警示":"“协同=多人合作”不等于“共用一台电脑”；真正的协同在空间与时间上都并行。","方法点拨":"判断题抓关键词“轮流”——真正的协同是“同时”。"}},{"sec":"基础巩固","type":"判断","num":2,"text":"Markdown写起来像发消息一样简单，却能在发布时变成规范网页。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"Markdown“简单却实用”的特点（理解）。","解题思路":"Markdown用#、**等轻量符号书写，像发消息一样简单，经转换即成规范网页——表述正确，判“√”。","方法点拨":"Markdown定位：写作时极简，发布时规范，两头兼顾。"}},{"sec":"基础巩固","type":"判断","num":3,"text":"协同中“留痕迹”是为了方便追溯谁改了什么、出问题可回退。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"协同留痕的价值（理解+辨析）。","解题思路":"留痕＝保留编辑历史：谁改了什么一目了然、出错可回退——表述正确，判“√”。","方法点拨":"留痕两用：追溯责任＋恢复数据，是协同规范的保险丝。"}},{"sec":"能力提升","type":"提升","num":1,"text":"连线：左侧 实时同步、免汇总、可留痕、权限可控，右侧归类到协同优势（各写对应项）。","opts":[],"subs":[],"ans":"实时同步、免汇总、可留痕、权限可控均为在线协同的典型优势，可分别对应“并行高效、省去合并、可追历史、安全可控”。","al":{"考查点":"协同优势的归纳（理解）。","解题思路":"把四个优势词各自对到价值上：实时同步→并行高效；免汇总→省去合并；可留痕→可追历史；权限可控→安全可控。","易错警示":"“权限可控”要联系到“谁可改什么、防误删”——别只写“安全”空词。","方法点拨":"归纳题把每个词扩展成“能力→价值”一句话，四项各自成答。"}},{"sec":"能力提升","type":"提升","num":2,"text":"补全Markdown：请写出“二级标题”“加粗”“无序列表第一项”三种语法各一例。","opts":[],"subs":[],"ans":"二级标题：## 简介；加粗：**重点**；列表：- 第一项。","al":{"考查点":"Markdown基础语法书写（应用）。","解题思路":"二级标题“## 简介”；加粗“**重点**”；无序列表第一项“- 第一项”。","易错警示":"#号后要有空格（# 标题）才对；加粗是双星号不是单星号。","方法点拨":"语法示例题写完自查符号：标题数#、加粗对**、列表项前“- ”。"}},{"sec":"能力提升","type":"提升","num":3,"text":"排序：小组用协同工具做主页，下列步骤怎样更合理？甲分工板块；乙各自同时编辑；丙先沟通再动手；丁检查是否覆盖了他人内容。","opts":[],"subs":[],"ans":"甲（分工）→丙（沟通约定）→乙（并行编辑）→丁（检查留痕）。先分工沟通再并行，最后质检。","al":{"考查点":"协同工作流的合理排序（应用）。","解题思路":"工程化顺序：先分工（甲）→再沟通约定（丙）→然后并行编辑（乙）→最后检查留痕（丁）。","易错警示":"“先动手后沟通”会导致覆盖冲突——沟通必须在并行之前。","方法点拨":"协作排序口诀：先分好工，再约好法，然后同时干，最后查留痕。"}},{"sec":"能力提升","type":"提升","num":4,"text":"分析：同桌说“用微信发文件也能合作，何必学协同工具”。请举一个微信传文件的缺点，说明协同工具如何弥补。","opts":[],"subs":[],"ans":"微信传文件要反复收发、手动合并版本，易覆盖丢稿。协同工具多人同时改同一文档、实时同步并保留历史，免去汇总麻烦、避免版本混乱。","al":{"考查点":"对比微信传文件与协同工具（分析+评价）。","解题思路":"抓微信传文件的典型痛点（反复收发、手动合并、版本易乱、易覆盖丢稿），再讲协同工具如何对症弥补（同文档实时改、自动同步、留历史可恢复）。","易错警示":"只列微信缺点不写协同工具的“弥补机制”，对比不闭合。","方法点拨":"“A不好、B怎么好”题用“痛点→对策”一一配对写，逻辑最紧。"}},{"sec":"拓展挑战","type":"拓展","num":1,"text":"情境：你们四人小组做科技节主页，小刚和小丽同时改“简介”板块，结果小刚写的全被覆盖。请分析冲突原因，并依据《协同公约》给出两条避免办法。","opts":[],"subs":[],"ans":"原因：两人改同一板块且未先沟通，后保存覆盖前者。办法：①事先分区，每人负责固定板块不交叉；②改动前在群里说一声、改完留痕备注；③用工具的历史版本恢复被覆盖内容。","al":{"考查点":"协同冲突的原因分析与规避（分析+评价）。","解题思路":"原因：两人改同一板块且未沟通，后保存者覆盖先保存者。对策两条：①事先分区、每人固定板块；②改前群内说明、改后留痕备注；补一条“历史版本恢复”作兜底更完整。","易错警示":"只答“别两个人同时改”没有落到“分区/沟通/留痕”的具体机制，措施空泛。","方法点拨":"冲突题答“原因一句话+办法两三条”，办法必须是公约里可执行的条款式动作。"}},{"sec":"拓展挑战","type":"拓展","num":2,"text":"评价：班级有两个方案——甲用协同文档四人共编主页；乙四人各写各的发微信群由班长拼。你支持哪个？从协同优势角度给两条理由。","opts":[],"subs":[],"ans":"支持甲。理由：①实时同步，四人进度一眼可见，省去班长手工拼合；②可留痕，谁改了什么清清楚楚，出错能回退；乙方式易版本混乱、覆盖丢稿。","al":{"考查点":"用协同优势做方案决策（评价）。","解题思路":"支持甲，给两条硬理由：实时同步免去手工拼合、进度可见；可留痕谁改什么清楚、出错能回退。再点乙方案弱点（版本混乱、覆盖丢稿）作对比。","易错警示":"理由不与“协同优势”挂钩（如“甲软件好看”）就失去本课知识支撑。","方法点拨":"决策题引教材“协同优势”当论据：同步、留痕、免汇总，任选两条即可成立。"}},{"sec":"变式闯关","type":"变式","num":1,"text":"换场景：科学小组要合写实验报告。请照样说出他们会用到的协同优势两条，并写一条他们应遵守的“公约”。","opts":[],"subs":[],"ans":"优势：①多人同时写不同章节、实时汇总；②保留修改历史可追责任。公约示例：不删除他人已写结论，改动前先在群里说明。","al":{"考查点":"协同优势与公约的场景迁移（应用）。","解题思路":"科学小组场景换皮不换核：优势（同时写不同章节实时汇总、历史可追责）＋公约（不删他人结论、改前群内说明）。","易错警示":"公约要与“实验报告”场景贴合（不删结论、标注数据来源），别照抄网页场景条款。","方法点拨":"迁移题把场景词换掉（主页→实验报告），协同原则原样保留即可。"}},{"sec":"间隔复习","type":"间隔","num":1,"text":"第17课学了网站制作六步流程。请写出其中“设计结构”这一步骤的作用，并说明它和本课“先分工沟通再协作”有什么相通之处。","opts":[],"subs":[],"ans":"（第17课《制作网页展活动》）　设计结构是在动手前规划页面区块（标题、文字、图片位置），避免盲目。它与“先分工沟通”都体现“先规划后行动”的工程思维，动手前想清再执行更高效。","al":{"考查点":"协同公约设计＋冲突处理＋Markdown语法的综合创造（创造+应用）。","解题思路":"公约条款要“动作化”（谁+做什么/禁止做什么）；冲突处理必须“预防+补救”成对（分区防撞车、历史版本补救）；Markdown示范要真写出“# 标题、## 条款”并解释符号含义。","易错警示":"条款写成口号（“要团结协作”）没有约束力；补救措施若写“重写一遍”就丢了协同工具留痕的价值。","方法点拨":"“制定公约”题的核心是让条款可执行可检查：每条都能回答“违反了怎么发现”，配上历史版本兜底，公约才立得住。"}},{"sec":"思维进阶","type":"挑战","num":1,"text":"学校文学社的 6 名成员要在一周内合出一期线上社刊，社长请你当“协同顾问”。请为她设计一份《线上共编公约》：①写出 3 条核心条款（每条须有“允许/提倡”或“禁止”的明确动作，例如板块分工怎么做）；②针对“最可能发生的冲突”——两人同时改同一段，写出 1 条预防措施和 1 条补救措施；③用 Markdown 给公约写一个标题与第一条条款，示范“轻量写作”的样子。","opts":[],"subs":[],"open":true,"ans":"参考设计要点：①公约三条：提倡——按板块分工，每人负责自己的栏目（明确边界）；禁止——未经沟通直接删除他人段落（保护劳动）；提倡——每次大改前先复制一版到\"草稿区\"（留好退路）；②冲突预防：编辑前先刷新看最新版本，改同一时段约定\"谁在改\"接龙报备；补救：利用平台的版本历史功能回滚到冲突前版本，再手动合并两人的内容；③Markdown示范：# 线上共编公约（标题）＋ **第一条** 各自负责所属板块，改前先同步（条款加粗）。","al":{"考查点":"开放创造：协同规则与冲突治理设计（创造+应用）","解题思路":"条款须是\"可执行的明确动作\"（动词+对象）；冲突题要\"预防+补救\"成对出现；Markdown示范要真的用标记语法","易错警示":"条款写成\"大家要和谐\"无法执行；补救只说\"叫老师\"没有用到版本历史等技术手段","方法点拨":"公约题三条铁律：动作明确、冲突成对、示范用真语法。"}}]},{"t":"第 20 课 · 配套练习 · 建议用时15分钟","n":"组建网站跟我做","isExam":false,"qs":[{"sec":"回忆热身","type":"回忆","num":1,"text":"把多个独立网页串成一个整体，靠的是____（像书的目录加页码）。","opts":[],"subs":[],"ans":"超链接","al":{"考查点":"超链接组织网站的作用（识记+理解）。","解题思路":"“把多个独立网页串成一个整体”→靠超链接，像书的目录+页码把散页串成册。","易错警示":"勿填“文件夹/导航”——导航栏是超链接的集合，本质串联靠链接。","方法点拨":"本课意象：一个网页是一张纸，一个网站是带目录的书，超链接就是目录页码。"}},{"sec":"回忆热身","type":"回忆","num":2,"text":"链接到同一文件夹里的页面，用的是____路径；写全网址的是____路径。","opts":[],"subs":[],"ans":"相对；绝对","al":{"考查点":"相对路径与绝对路径的区分（识记+理解）。","解题思路":"“同一文件夹里的页面”用相对路径（写文件名即可）；“写全网址”的是绝对路径。","易错警示":"相对路径不只是文件名——它是相对当前页的位置描述（同文件夹就是文件名）。","方法点拨":"路径两兄弟：相对=家门口串门（短），绝对=报全地址（长）。"}},{"sec":"基础巩固","type":"单选","num":1,"text":"超链接在网站中的作用，最贴切的类比是：","opts":[{"label":"A","text":"书里的目录加页码"},{"label":"B","text":"一杯水"},{"label":"C","text":"一张贴纸"},{"label":"D","text":"一块电池"}],"subs":[],"ans":"答案A　书里的目录加页码","al":{"考查点":"超链接作用的类比（理解）。","解题思路":"“把独立网页织成整体”→书的目录+页码：在目录点一下翻到对应页，正如点超链接跳到对应子页。","逐项剖析":"A项目录加页码——点目录到指定页，与超链接跳转完全同构，正确；B项一杯水、C项贴纸、D项电池都无法表达“串联跳转”关系。","易错警示":"类比要看“结构对应”：超链接的本质是“从一个位置跳到另一个位置”。","方法点拨":"凡见“散页→成书”意象，主角就是超链接。"}},{"sec":"基础巩固","type":"单选","num":2,"text":"下列超链接写法正确的是：","opts":[{"label":"A","text":"〈a href=子页.html〉机器人〈/a〉"},{"label":"B","text":"〈img src=子页.html〉机器人"},{"label":"C","text":"〈p href=子页.html〉机器人〈/p〉"},{"label":"D","text":"〈a〉子页.html〈/a〉"}],"subs":[],"ans":"答案A　〈a href=子页.html〉机器人〈/a〉","al":{"考查点":"a标签超链接的正确写法（识记+应用）。","解题思路":"超链接标准写法：〈a href=目标〉显示文字〈/a〉——href给目标，标签内文字可点击。","逐项剖析":"A项〈a href=子页.html〉机器人〈/a〉结构完整（href指向+文字可点），正确；B项用img做链接，img是图片标签无跳转属性，错误；C项p是段落标签，没有href属性，错误；D项〈a〉子页.html〈/a〉把地址当文字显示，缺href不能跳转，错误。","易错警示":"“文字可点”与“能跳转”是两个要件：必须同时有href和文本内容。","方法点拨":"a标签三要素：a是标签、href是目标、中间文字是“按钮脸”。"}},{"sec":"基础巩固","type":"单选","num":3,"text":"链接同一网站内、与当前页同文件夹的页面，一般使用：","opts":[{"label":"A","text":"绝对路径写全网址"},{"label":"B","text":"相对路径写文件名"},{"label":"C","text":"不需要路径"},{"label":"D","text":"只能用手写网址"}],"subs":[],"ans":"答案B　相对路径写文件名","al":{"考查点":"同站同文件夹链接的路径选择（应用）。","解题思路":"同一网站内、同文件夹的页面，写文件名即可（相对路径），简单且便于整体搬运。","逐项剖析":"A项绝对路径写全网址冗长且不便搬运，非首选；B项相对路径写文件名即可，正确；C项“不需要路径”错误（必须指明目标）；D项“只能手写网址”无依据。","易错警示":"相对/绝对的选择看场景：站内同级用相对，跨站引用用绝对。","方法点拨":"路径选择口诀：自家屋里串门用“相对”，出远门（跨站）才报“绝对”。"}},{"sec":"基础巩固","type":"单选","num":4,"text":"发布网站前“三查”不包括：","opts":[{"label":"A","text":"内容是否合法得当"},{"label":"B","text":"版权是否合规"},{"label":"C","text":"隐私是否泄露"},{"label":"D","text":"字体是否最时髦"}],"subs":[],"ans":"答案D　字体是否最时髦","al":{"考查点":"发布前“三查”的内容（识记）。","解题思路":"教材“三查”＝内容（合法得当）、版权（素材合规）、隐私（不泄露）——选“不属于”的项。","逐项剖析":"A项内容是否合法得当属于三查；B项版权合规属于三查；C项隐私是否泄露属于三查；D项“字体是否最时髦”是审美偏好，不属于负责任发布的把关项，正确。","易错警示":"“字体好看”是美化追求，不是发布责任——三查全部指向“责任”。","方法点拨":"三查口诀：内容正（合法）、版权清（授权）、隐私护（不泄）。"}},{"sec":"基础巩固","type":"判断","num":1,"text":"一个网页是单张“纸”，一个网站是装订成册、带目录的“书”。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"网页与网站的关系（理解+辨析）。","解题思路":"网页=单张纸；网站=多个网页经超链接互联成整体，像装订带目录的书——比喻成立，判“√”。","方法点拨":"散页（网页）→装订（超链接互联）→成书（网站），意象题判√。"}},{"sec":"基础巩固","type":"判断","num":2,"text":"相对路径只能用在同一台电脑，绝对路径才能跨网站链接。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"相对/绝对路径适用范围的辨析（理解+辨析）。","解题思路":"题干“相对只能本机、绝对才能跨站”过于绝对：相对路径在同站内部按层级定位很常用（也可指向网络上的站内资源），绝对路径写全网址同样能连站内——判“×”。","易错警示":"别把“同站用相对、跨站用绝对”当成死规定——相对路径的核心是“相对当前位置”，与是否跨电脑无关。","方法点拨":"路径辨析题问“是否只能”：凡含“只能”的路径说法，找反例判×。"}},{"sec":"基础巩固","type":"判断","num":3,"text":"网站发布出去就万事大吉，不需要再检查内容与版权。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"发布后的持续责任（理解+辨析）。","解题思路":"“发布出去就万事大吉”违背负责任的发布观：发布前要三查，发布后对不当内容仍负有管理责任——判“×”。","易错警示":"发布不是终点：内容若更新、被发现有问题，网站主仍需及时处理。","方法点拨":"凡“做完就不用管/发布就没事”的甩手表述，对照数字公民责任判×。"}},{"sec":"能力提升","type":"提升","num":1,"text":"补全超链接：请在横线处补写，使“AI画展”四个字能跳转到ai.html。〈a ____=ai.html〉____〈/a〉","opts":[],"subs":[],"ans":"应填 href 与 AI画展，即〈a href=ai.html〉AI画展〈/a〉。","al":{"考查点":"a标签href与链接文本的补全（应用）。","解题思路":"补两处：跳转目标用href属性；可点击文字填“AI画展”——完整为〈a href=ai.html〉AI画展〈/a〉。","易错警示":"href后要跟“目标文件”，显示文字是给用户看的——两处别写反。","方法点拨":"“让文字能跳”三件套：a标签+href目标+夹在中间的文字。"}},{"sec":"能力提升","type":"提升","num":2,"text":"连线：左侧 相对路径、绝对路径、超链接、导航栏，右侧 同楼串门、报全地址、目录页码、网站地图式的入口。","opts":[],"subs":[],"ans":"相对路径—同楼串门；绝对路径—报全地址；超链接—目录页码；导航栏—网站地图式入口。","al":{"考查点":"路径与链接概念的连线（理解）。","解题思路":"按意象连线：相对路径＝同楼串门（短路径）；绝对路径＝报全地址（全网址）；超链接＝目录页码（跳转）；导航栏＝网站地图式入口（总览导览）。","易错警示":"“导航栏”与“超链接”的区别：超链接是单个跳转，导航栏是成组的入口总览。","方法点拨":"连线先想“本质动作”：串门（相对）、报址（绝对）、翻页（超链接）、看地图（导航）。"}},{"sec":"能力提升","type":"提升","num":3,"text":"分析：小明把网页都做好却互不相连，访客只能手动输网址。这说明缺了什么？请用“散页变书”的类比说明怎么补救。","opts":[],"subs":[],"ans":"缺超链接。散页各自独立像一堆纸，须在主页用超链接（目录页码）指向各子页、子页再回到主页，加导航栏串起来，散页即成“书”——完整网站。","al":{"考查点":"超链接组织价值的理解（分析+表达）。","解题思路":"先诊断“缺超链接”，再用“散页变书”类比说明补救：主页放目录式链接指向子页、子页留返回主页的链接、加导航栏——散页即成册。","易错警示":"只诊断不补救、或补救只说“加链接”不讲“主页↔子页互链+导航”的结构，不够完整。","方法点拨":"“缺什么怎么补”题用比喻讲结构：目录（主页链接）+页码（返回链接）+书脊（导航栏）。"}},{"sec":"能力提升","type":"提升","num":4,"text":"排序：网站发布前的工程步骤，合理顺序是？甲逐条测试所有链接；乙用超链接把子页互链；丙填写发布自查表；丁组织导航栏。","opts":[],"subs":[],"ans":"乙（互链）→丁（导航）→甲（测试修复）→丙（自查发布）。先连后测再把关。","al":{"考查点":"网站发布前的工程排序（应用）。","解题思路":"工程顺序：先互链（乙，把子页串起）→再导航（丁，入口总览）→测试（甲，逐链验证修复）→自查发布（丙，三查把关）。","易错警示":"测试必须在发布前、导航要在互链后——先有骨架才有总览与验收。","方法点拨":"发布流水线口诀：先连（互链）后导（导航），再测（测试）再把（三查）关。"}},{"sec":"拓展挑战","type":"拓展","num":1,"text":"情境：你们组的网站要上线科技节，但互访时发现“机器人”链接点不开。请按工程思路排查：可能原因两条，并说明修复后还应做哪项把关。","opts":[],"subs":[],"ans":"原因：①href写错文件名或子页不在同文件夹（相对路径错）；②链接文字与a标签未正确配对。修复后须逐链接测试并填写发布前自查表（内容、版权、隐私三查），确认无误再发布。","al":{"考查点":"链接故障排查与发布把关（分析+评价）。","解题思路":"排查“点不开”：①href写错文件名或子页不在同文件夹（相对路径错）；②a标签结构错误（缺href或文字错配）。修复后补把关：逐链接测试＋填写发布前自查表（内容/版权/隐私三查）。","易错警示":"只查一处原因不全面；修复后跳过“三查”直接发布则失守责任关。","方法点拨":"排查题列“两条可能原因+修复动作”，再补“测试+三查”两道发布关，工程感就出来了。"}},{"sec":"拓展挑战","type":"拓展","num":2,"text":"评价：有同学说“把别人的获奖照片直接放进我们网站，反正只在学校内展示没关系”。请结合发布“三查”，指出错误并说明正确做法。","opts":[],"subs":[],"ans":"错误：未经授权用他人照片侵犯版权，且校内展示也属公开发布，并非“没关系”。正确做法：①用自己或获授权素材；②注明来源与许可；③自查版权项通过后再发布，落实数字公民责任。","al":{"考查点":"版权意识的辨析（评价）。","解题思路":"“校内展示没关系”是误区：未经授权用他人照片即侵权，校内展示也属公开发布。正解：用自己/获授权素材、注明来源许可、三查过关再发布。","易错警示":"“校内=私密”的想当然要破除——凡对外可访问即属公开使用。","方法点拨":"版权判断题一律问“授权了吗”：有授权可用，无授权再近的“圈子”也不能用。"}},{"sec":"变式闯关","type":"变式","num":1,"text":"换场景：班级要办线上读书节，也需把若干“书评页”连成站点。请照样说明用什么把各页连起来，并指出“读书节主页链接到各书评页”用的是相对还是绝对路径（同文件夹情形）。","opts":[],"subs":[],"ans":"用超链接把各书评页连成站点（主页像目录指向各页）。同文件夹情形下用相对路径写文件名即可，便于整体复制搬运。","al":{"考查点":"超链接与路径选择的场景迁移（应用）。","解题思路":"读书节站点同理：用超链接把各书评页连成站（主页像目录）；同文件夹情形用相对路径写文件名即可，便于整体搬运。","易错警示":"迁移时把“相对路径”答成“写全网址”就反了——同文件夹恰恰是相对路径的主场。","方法点拨":"“换场景”题套用核心公式：组站靠超链接、同目录用相对路径，两个结论直接复用。"}},{"sec":"间隔复习","type":"间隔","num":1,"text":"第18课学了CSS“样式与内容分离”。请写出CSS语法中“选择器”的作用，并说明为什么换一套配色不用改HTML正文。","opts":[],"subs":[],"ans":"（第18课《美化网页方法多》）　选择器指明“给谁设样式”（如p指所有段落）。因样式与内容分离，CSS只控制呈现，改配色只动样式规则、HTML正文不变，故换装不换身体。","al":{"考查点":"发布三查的质检化应用＋侵权处理＋信息架构（创造+评价）。","解题思路":"质检卡三部分：检查项要“三查各一项且写明查法”；侵权处理要走“停用→补授权/替换→复查放行”的合规流程；导航栏设计要给“栏目清单+组织理由”。","易错警示":"检查项只写“查版权”不写“怎么查”；处理流程缺“暂停展示”或“复查放行”环节；导航只列栏目不解释为什么——三处都失分。","方法点拨":"“质检卡/检查表”设计题公式：每项检查＝对象＋动作＋判定标准；处理流程按“止损→修复→复检”三段写，责任与效率兼顾。"}},{"sec":"思维进阶","type":"挑战","num":1,"text":"学校要把各班“科技节成果”汇总成一个大网站，你负责“班级成果站”的质检员。在网站上线前，请你设计一张《网站发布质检卡》：①列出你最看重的3项检查（必须覆盖内容、版权、隐私三个方面各一项），每项写清“查什么、怎么查”；②若发现“某班的获奖照片没有获得授权”，写出你的处理流程（至少3步）；③为“成果站”主页写一句导航栏设计说明：它该包含哪些栏目、为什么这样组织。","opts":[],"subs":[],"open":true,"ans":"参考设计要点：①三项检查：内容——逐页核对文字图片与实际成果一致、无错别字（对照原始材料）；版权——每张图片/音乐是否有授权或来源标注（建素材清单逐项核对）；隐私——页面是否泄露同学真实姓名、班级、电话等信息（用\"查找\"功能搜索敏感词）；②处理流程：第一步立即将该照片下线或打码；第二步联系该班负责人确认授权情况，补办授权则恢复、无法授权则替换素材；第三步在质检记录中登记并全站复查同类问题；③导航栏说明：栏目按\"成果展示/班级风采/活动视频/关于我们\"组织——先给\"看什么\"（成果），再给\"谁做的\"（班级），再给\"怎么更生动\"（视频），最后给\"联系与说明\"（关于），符合观众由浅入深的浏览习惯。","al":{"考查点":"开放创造：网站质检与合规处理（创造+评价）","解题思路":"三项检查必须分别覆盖内容、版权、隐私三个方面且\"查什么怎么查\"齐全；处理流程三步有先后因果；导航说明要给\"为什么这样排\"","易错警示":"只写\"检查内容\"没说怎么查；处理流程漏\"全站复查同类问题\"的举一反三","方法点拨":"质检题公式：三面各一查+流程三步+设计说明带理由。"}}]},{"t":"达标检测","n":"第四单元 校园活动线上展 · 达标检测卷","isExam":true,"qs":[{"sec":"选择题","type":"选择题","num":1,"text":"我们看到的网页，本质上是下面哪项经浏览器“演出”后的结果？","opts":[{"label":"A","text":"HTML代码"},{"label":"B","text":"一张图片"},{"label":"C","text":"一段音乐"},{"label":"D","text":"键盘输入"}],"subs":[],"ans":"答案A　HTML代码","al":{"考查点":"网页本质的识别（理解）。","解题思路":"“网页＝HTML代码经浏览器‘演出’的结果”——源头是代码。","逐项剖析":"A项HTML代码经浏览器呈现成网页，正确；B/C项图片音乐只是网页内容；D项键盘输入不是网页来源。","方法点拨":"本课等式：HTML=剧本、浏览器=导演、网页=演出。"}},{"sec":"选择题","type":"选择题","num":2,"text":"下列标签中负责插入图片的是：","opts":[{"label":"A","text":"h1"},{"label":"B","text":"p"},{"label":"C","text":"img"},{"label":"D","text":"a"}],"subs":[],"ans":"答案C　img","al":{"考查点":"img标签功能识别（识记）。","解题思路":"“插入图片”→img标签。","逐项剖析":"A项h1标题、B项p段落、C项img图片，正确、D项a超链接。","方法点拨":"标签功能速记：h1题、p段、img图、a链。"}},{"sec":"选择题","type":"选择题","num":3,"text":"制作网站六步流程的正确开头是：","opts":[{"label":"A","text":"主题→素材→结构"},{"label":"B","text":"美化→主题→发布"},{"label":"C","text":"结构→素材→主题"},{"label":"D","text":"发布→制作→主题"}],"subs":[],"ans":"答案A　主题→素材→结构","al":{"考查点":"制作流程开头三步（识记）。","解题思路":"六步开头固定“主题→素材→结构”，先规划后动手。","逐项剖析":"A项主题→素材→结构，正确；其余选项顺序颠倒。","方法点拨":"六步链条首尾记牢：主题开头、发布收尾。"}},{"sec":"选择题","type":"选择题","num":4,"text":"CSS的主要作用是：","opts":[{"label":"A","text":"管理网页内容结构"},{"label":"B","text":"集中管理样式让网页好看"},{"label":"C","text":"只能修改图片"},{"label":"D","text":"替代HTML标签"}],"subs":[],"ans":"答案B　集中管理样式让网页好看","al":{"考查点":"CSS的作用定位（理解）。","解题思路":"CSS管“怎么好看”（样式），与HTML内容分离。","逐项剖析":"A项内容结构归HTML；B项集中管理样式让网页好看，正确；C项窄化CSS；D项CSS不替代HTML（互补分工）。","方法点拨":"分工口诀：HTML说什么，CSS怎么好看。"}},{"sec":"选择题","type":"选择题","num":5,"text":"Markdown是一种：","opts":[{"label":"A","text":"重型数据库"},{"label":"B","text":"比HTML简单的轻量标记语言"},{"label":"C","text":"图片格式"},{"label":"D","text":"网页服务器"}],"subs":[],"ans":"答案B　比HTML简单的轻量标记语言","al":{"考查点":"Markdown的定位（识记）。","解题思路":"Markdown是比HTML简单的轻量标记语言，可转HTML。","逐项剖析":"B项描述准确，正确；其余选项（数据库/图片/服务器）张冠李戴。","方法点拨":"Markdown定位三词：轻量、标记、可转换。"}},{"sec":"选择题","type":"选择题","num":6,"text":"把各个子页连成一个网站，靠的是：","opts":[{"label":"A","text":"超链接"},{"label":"B","text":"颜色"},{"label":"C","text":"字体"},{"label":"D","text":"表格"}],"subs":[],"ans":"答案A　超链接","al":{"考查点":"超链接组织网站的作用（理解）。","解题思路":"子页互联成网站靠超链接（目录页码）。","逐项剖析":"A项超链接正确；颜色/字体/表格都无“跳转串联”功能。","方法点拨":"网站＝网页＋超链接，链接是把散页装订成册的线。"}},{"sec":"判断题","type":"判断题","num":1,"text":"开发者工具里改网页文字后刷新又复原，因为是本地临时修改未保存。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"开发者工具临时修改原理（理解）。","解题思路":"本地临时改动不保存，刷新重载原文件故复原——表述正确，判“√”。","方法点拨":"实验结论记牢：工具的修改是临时演示，刷新即还原。"}},{"sec":"判断题","type":"判断题","num":2,"text":"HTML标签不闭合也能正常显示所有内容。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"标签闭合的必要性（理解）。","解题思路":"标签不闭合导致解析混乱——题干说“不闭合也能正常显示”错误，判“×”。","方法点拨":"标签像括号：有开必合，漏合会乱。"}},{"sec":"判断题","type":"判断题","num":3,"text":"CSS“层叠”指后面的样式会覆盖前面的同名样式。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"CSS层叠机制（理解）。","解题思路":"层叠＝后面的样式覆盖前面同名样式（贴纸比喻）——表述正确，判“√”。","方法点拨":"层叠一句记：后写覆盖先写。"}},{"sec":"判断题","type":"判断题","num":4,"text":"协同编辑就是几个人轮流用一台电脑打字。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"在线协同的正确理解（理解）。","解题思路":"在线协同是多人各自设备同时编辑实时同步，非轮流用一台电脑——判“×”。","方法点拨":"“轮流/共用一台”是旧方式，协同的关键词是“同时”。"}},{"sec":"判断题","type":"判断题","num":5,"text":"网站发布前只需检查字体好看，内容与版权不用管。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"发布三查的内容（识记）。","解题思路":"发布须过三查（内容、版权、隐私）——“只查字体、内容版权不用管”错误，判“×”。","方法点拨":"三查口诀：内容正、版权清、隐私护。"}},{"sec":"填空题","type":"填空题","num":1,"text":"网页的“剧本”叫____。","opts":[],"subs":[],"ans":"HTML","al":{"考查点":"HTML名称识记。","解题思路":"网页的“剧本”＝HTML（超文本标记语言）。","方法点拨":"剧本（HTML）→导演（浏览器）→演出（网页）。"}},{"sec":"填空题","type":"填空题","num":2,"text":"定义网页一级大标题的标签是____。","opts":[],"subs":[],"ans":"h1","al":{"考查点":"h1标签识记。","解题思路":"一级大标题＝h1；title是浏览器标签页名。"}},{"sec":"填空题","type":"填空题","num":3,"text":"制作网站六步流程的第四步是____（前三步：主题→素材→结构）。","opts":[],"subs":[],"ans":"制作","al":{"考查点":"六步流程第四步识记。","解题思路":"六步＝主题→素材→结构→制作→美化→发布，第四步“制作”。"}},{"sec":"填空题","type":"填空题","num":4,"text":"CSS语法“选择器{属性:____;}”中空缺处填____。","opts":[],"subs":[],"ans":"值","al":{"考查点":"CSS语法要素识记。","解题思路":"选择器{属性:值;}——空缺处是“值”。","方法点拨":"语法口诀：谁{什么:怎么样}。"}},{"sec":"填空题","type":"填空题","num":5,"text":"Markdown中写一级标题要在文字前加____号。","opts":[],"subs":[],"ans":"#（井号）","al":{"考查点":"Markdown标题语法识记。","解题思路":"一级标题在文字前加“#（井号）”。"}},{"sec":"填空题","type":"填空题","num":6,"text":"链接同一文件夹里的页面，一般使用____路径。","opts":[],"subs":[],"ans":"相对","al":{"考查点":"相对路径适用场景识记。","解题思路":"同一文件夹页面互链用“相对”路径（写文件名）。"}},{"sec":"简答题","type":"简答题","num":1,"text":"用“剧本→演出”类比，解释“网页等于HTML代码的呈现”（8分）。","opts":[],"subs":[],"ans":"网页像话剧，HTML是剧本写清内容与排布，浏览器如导演照剧本“演出”成画面（4分）；看懂代码即懂网页为何如此呈现，故学代码即学网页原理（4分）。","al":{"考查点":"剧本演出类比的复述（理解+表达，8分）。","解题思路":"分两层答：HTML是剧本（内容排布）＋浏览器是导演（演出成画面）；看懂代码即懂网页为何如此呈现。","易错警示":"只写“网页是HTML做的”不展开类比扣分。","方法点拨":"8分题＝比喻4分+原理4分，类比与原理缺一不可。"}},{"sec":"简答题","type":"简答题","num":2,"text":"说说CSS“样式与内容分离”的好处，并举一个常用CSS属性（12分）。","opts":[],"subs":[],"ans":"好处：①换样式（如改配色）不必改动HTML正文，维护方便（3分）；②样式集中管理，一处修改多处生效（3分）。示例属性：color设文字颜色、font-size设字号、background设背景、text-align设对齐，任举一例（3分）；另有说明3分共12分。","al":{"考查点":"CSS分离思想与属性举例（理解+应用，12分）。","解题思路":"好处答两条（换样式不动正文、集中管一处改全局）；再举一个属性并说明其作用（color/font-size/background/text-align任一）。","易错警示":"只写属性名不写“设什么”会扣分。","方法点拨":"12分分配：分离好处6分+属性3分+说明3分，按分值组织篇幅。"}},{"sec":"案例分析题","type":"案例分析题","num":1,"text":"科技节临近，你们组用协同工具分头做主页，结果小刚和小丽都改了“简介”板块，小刚写的内容被覆盖丢失；主页做好后又发现“机器人”链接打不开。请：(1)分析协同冲突原因并给一条避免办法（7分）；(2)说明链接打不开可能的技术原因及修复思路（8分）。","opts":[],"subs":[],"ans":"(1)两人同时改同一板块且未先沟通，后保存覆盖前者（4分）；避免：事先分区每人负责固定板块，改动前群内说明、改完留痕（3分）。(2)原因多为href写错文件名或子页不在同文件夹（相对路径错）、标签未正确配对（4分）；修复：核对文件名与目录、补全a标签，再逐链接测试（4分）。","al":{"考查点":"协同冲突与链接故障的综合分析（分析+应用，15分）。","解题思路":"第（1）问：原因（同板块同时改、未沟通、后存覆盖）＋办法（分区固定板块、改前说明、留痕）。第（2）问：链接技术原因（href错/文件不在同夹/标签错配）＋修复（核对目录文件名、补全a、逐链测试）。","易错警示":"两问各答一半（只答原因不答办法）会丢分；链接原因要写具体技术点。","方法点拨":"15分题两问按7+8分配：每题都走“原因→对策”，对策要可执行。"}},{"sec":"综合实践题","type":"综合实践题","num":1,"text":"学校科技节要办“班级活动主题网页”线上展。请你从零规划并制作：(1)写出制作流程前四步（主题、素材、结构、制作）的具体内容（8分）；(2)为主页设计HTML结构草图（含标题、段落、图片、一个到子页的超链接），写出关键标签（8分）；(3)用CSS给标题设蓝色、背景浅色，写一句语法并说明“样式与内容分离”（5分）；(4)发布前按“三查”列出你要把关的三项及做法（4分）。","opts":[],"subs":[],"ans":"(1)主题：定班级活动主题如“机器人挑战赛”；素材：收集图片与文字说明；结构：画草图标明标题、正文、图片、链接区；制作：用HTML补全代码（每步2分，共8分）。(2)结构示例：html根内head含title，body含h1标题、p段落、img图片、a href链接到子页.html（标签齐全6分，结构合理2分）。(3)h1{color:blue;} body{background:#f0f8ff;}；分离指改样式不动HTML内容（5分）。(4)三查：内容合法得当、素材版权合规、不泄露隐私，逐项核对通过再发布（每项约1.3分，共4分）。评分要点：流程完整、结构清晰、样式合理、责任意识到位。","al":{"考查点":"网站制作全流程的综合实践（创造+应用，25分）。","解题思路":"四任务按分值组织：流程四步给具体内容（主题/素材/结构/制作）；结构草图列关键标签（html/head/title/body/h1/p/img/a）；CSS写一句语法并解释分离；三查三项写明做法。","易错警示":"结构草图缺img或a、CSS语法错误（冒号分号）、三查漏项，都会扣分。","方法点拨":"25分大题先看分值分配（8+8+5+4）再规划篇幅，标签与语法部分要“写得出真代码”。"}}]}]},{"t":"第五单元 互联网创新应用","isFinal":false,"lessons":[{"t":"第 21 课 · 配套练习 · 建议用时15分钟","n":"移动互联新发展","isExam":false,"qs":[{"sec":"回忆热身","type":"回忆","num":1,"text":"移动通信五个代际依次是1G语音、2G短信、3G图文、4G视频和____。","opts":[],"subs":[],"ans":"5G万物互联","al":{"考查点":"移动通信五世代核心特征记忆（识记）。","解题思路":"世代口诀“1语2信3图4频5物联”：1G语音、2G短信、3G图文、4G视频、5G万物互联。题干已给出前四代，末空顺口溜即“5G万物互联”。","易错警示":"勿填“5G网速更快”——速度只是表象，代际本质是能力跃迁，5G标志词是“万物互联+低时延”。","方法点拨":"世代口诀要背成链条，做题时先背口诀再对号入座。"}},{"sec":"回忆热身","type":"回忆","num":2,"text":"用“水管变粗”作类比，带宽越大，能承载的互联网应用就越____。","opts":[],"subs":[],"ans":"丰富（多）","al":{"考查点":"带宽与应用的因果关系理解（理解）。","解题思路":"“水管变粗”类比：带宽=水管粗细，决定单位时间能流过的数据量。水管越粗→能承载的应用越丰富（从文字到视频、实时控制）。","逐项剖析":"填空主体是“能承载的互联网应用就越丰富（多）”，强调应用种类随带宽扩容而增加。","易错警示":"勿答“速度越快”而偏离“应用承载量”。","方法点拨":"凡遇“带宽驱动创新”类题，先写水管类比再答应用升级。"}},{"sec":"基础巩固","type":"单选","num":1,"text":"下列移动通信代际与应用特征的对应，正确的是：","opts":[{"label":"A","text":"1G以图文浏览为主"},{"label":"B","text":"2G实现语音通话"},{"label":"C","text":"3G开启图片与网页浏览"},{"label":"D","text":"5G只比4G速度快一点"}],"subs":[],"ans":"答案C　3G开启图片与网页浏览","al":{"考查点":"移动通信代际与特征一一对应（识记+辨别）。","解题思路":"世代口诀逐项验证：1G语音、2G短信、3G图文网页、4G视频、5G万物互联。","逐项剖析":"A项1G以图文浏览为主——错，1G只能语音通话；B项2G实现语音通话——错，语音是1G的贡献，2G开启短信；C项3G开启图片与网页浏览——对，3G首次支持图文网页；D项5G只比4G速度快一点——错，5G关键是万物互联与低时延，不止提速。","易错警示":"语音/短信/图文/视频四代易张冠李戴，先用口诀定序再判断。","方法点拨":"代际特征题=口诀定序+排除法。"}},{"sec":"基础巩固","type":"单选","num":2,"text":"5G的“大带宽、低时延”最能直接支撑下列哪类应用？","opts":[{"label":"A","text":"短信群发"},{"label":"B","text":"远程精准手术"},{"label":"C","text":"纸质书信"},{"label":"D","text":"拨号上网"}],"subs":[],"ans":"答案B　远程精准手术","al":{"考查点":"5G特性（大带宽、低时延）与实际应用匹配（应用）。","解题思路":"抓住题干关键词“大带宽、低时延”，找最依赖实时、高速传输的应用。远程手术需高清画面实时回传+操控指令极低时延，正是5G核心优势。","逐项剖析":"A项短信群发——2G即可，无需5G；B项远程精准手术——对，依赖低时延大带宽高可靠；C项纸质书信——与网络无关；D项拨号上网——是早期窄带技术。","易错警示":"勿选“短信群发”，它只需小带宽；判断标准是“缺了5G这个应用就做不成”。","方法点拨":"“最能直接支撑”题：想象把应用放到3G时代能否实现，不能的即依赖5G特性。"}},{"sec":"基础巩固","type":"单选","num":3,"text":"关于我国5G建设成就，下列说法正确的是：","opts":[{"label":"A","text":"5G基站占全球少数"},{"label":"B","text":"5G用户规模全球落后"},{"label":"C","text":"5G基站占全球六成以上"},{"label":"D","text":"6G已经全面商用"}],"subs":[],"ans":"答案C　5G基站占全球六成以上","al":{"考查点":"我国5G建设成就事实（识记）。","解题思路":"题干考国情事实：我国5G基站占全球60%以上、用户规模全球第一。","逐项剖析":"A项5G基站占全球少数——错，与事实相反；B项5G用户规模全球落后——错，我国全球第一；C项5G基站占全球六成以上——对，教材数据；D项6G已经全面商用——错，6G预计2030年前后商用，尚处研发试验。","易错警示":"“六成以上”与“全球第一”两数据要绑定记忆，勿混为“八成”。","方法点拨":"国情成就题答案通常选“正向表述+精确数据”项。"}},{"sec":"基础巩固","type":"单选","num":4,"text":"中学生运营短视频账号，符合自媒体规范的是：","opts":[{"label":"A","text":"编造耸动标题吸引流量"},{"label":"B","text":"随意搬运他人视频"},{"label":"C","text":"实名认证并核实信息再发布"},{"label":"D","text":"为涨粉刻意炫富攀比"}],"subs":[],"ans":"答案C　实名认证并核实信息再发布","al":{"考查点":"自媒体发布规范（信息社会责任）。","解题思路":"自媒体规范核心：实名认证、内容审核、不造谣不传谣、尊重版权。找“守规+负责任”的选项。","逐项剖析":"A项编造耸动标题——违反真实与公序良俗；B项随意搬运他人视频——侵犯版权；C项实名认证并核实信息再发布——对，既守规又担责；D项刻意炫富攀比——传播畸形价值观。","易错警示":"勿选“流量高就是好作品”类功利选项，自媒体先讲责任再讲流量。","方法点拨":"凡“符合规范/正确的是”题，选含“核实、认证、尊重、责任”字眼的选项。"}},{"sec":"基础巩固","type":"判断","num":1,"text":"每一代移动通信技术都比上一代只在“网速更快”这一项上有变化。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"移动通信代际变化本质辨析（理解）。","解题思路":"判断句用“只在网速更快这一项变化”设限。代际演进是能力跃迁：3G到4G到5G不只是提速，5G带来低时延、万物互联、海量连接等质变。","易错警示":"看到“网速”就判对是陷阱，题干“只在…一项”是绝对化表述，通常为错。","方法点拨":"判断题遇“只/完全/绝对”等绝对词，先质疑再验证。"}},{"sec":"基础巩固","type":"判断","num":2,"text":"低轨卫星互联网“千帆星座”有助于偏远山区接入网络、缩小数字鸿沟。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"卫星互联网的社会价值（理解+评价）。","解题思路":"低轨卫星互联网不受地面基站覆盖限制，能直达偏远山区，让无基站地区也能联网，缩小数字鸿沟——表述符合事实。","方法点拨":"新技术“普惠”类表述，若逻辑（技术特性→解决某类人痛点）成立，多为正确。"}},{"sec":"基础巩固","type":"判断","num":3,"text":"自媒体发布内容无需负责，只要流量高就是好作品。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"自媒体责任与流量观（信息社会责任）。","解题思路":"“无需负责”“流量高就是好作品”违背自媒体实名、审核、不造谣不传谣的底线；流量至上会滋生谣言与攀比。","易错警示":"“流量高=好作品”是常见错误认知，好作品须内容健康、来源真实、责任到位。","方法点拨":"责任与流量冲突时，责任优先。"}},{"sec":"能力提升","type":"提升","num":1,"text":"填写移动通信迭代对比表（每代一句话）：1G____；3G____；5G____。","opts":[],"subs":[],"ans":"1G实现语音通话；3G支持图片与网页浏览；5G实现万物互联（低时延大带宽）。","al":{"考查点":"五世代特征精炼提取（识记+概括）。","解题思路":"按口诀补全并各配一句话：1G实现语音通话；3G开启图片与网页浏览；5G实现万物互联（低时延、大带宽）。","易错警示":"1G勿写“短信”（短信属2G）、3G勿写“视频”（视频是4G主特征）。","方法点拨":"表格题先标世代轴（1-5），再逐格填口诀对应特征。"}},{"sec":"能力提升","type":"提升","num":2,"text":"用“水管变粗”类比，解释为什么3G时代很少出现直播带货，而5G时代很普遍。","opts":[],"subs":[],"ans":"带宽如水管，越粗能流过的内容越丰富。3G带宽窄、时延高，难以流畅直播；5G大带宽低时延，高清直播与实时互动才成为可能。","al":{"考查点":"带宽驱动模型解释现象（应用）。","解题思路":"水管类比：带宽=水管粗细。3G带宽窄、时延高，视频流无法流畅传输，故直播带货难以出现；5G大带宽低时延使高清直播与实时互动成为可能，带货才普及。","易错警示":"只答“网速快了”不够，须点出“时延”与“实时互动”这两个直播关键需求。","方法点拨":"“为什么以前不行现在行”题=旧技术瓶颈+新技术特性对照回答。"}},{"sec":"能力提升","type":"提升","num":3,"text":"连线：将下列应用与其主要依赖的通信技术连线。①云游戏 ②短信 ③远程手术 ｜A.2G B.5G C.4G及以上","opts":[],"subs":[],"ans":"①—C（或B）；②—A；③—B（或C）。","al":{"考查点":"应用与代际技术匹配（应用）。","解题思路":"短信是2G时代标志应用；云游戏需4G以上带宽且5G低时延体验最佳；远程手术依赖5G低时延高可靠。连线：①—C或B、②—A、③—B或C（云游戏选B或C均可，远程手术强调5G）。","易错警示":"短信勿连2G以外的代际；连线题允许“最佳代际”作答，需理由自洽。","方法点拨":"连线前先把应用按“所需带宽/时延”排序，再与代际对应。"}},{"sec":"能力提升","type":"提升","num":4,"text":"寿光菜农老李想用“智慧大棚”远程查看温湿度。写出他至少需要准备的两种条件，并说明原因。","opts":[],"subs":[],"ans":"①稳定网络（4G/5G或宽带），便于传感器数据上传；②可查看数据的手机或电脑终端。条件不足则无法远程监控。","al":{"考查点":"移动互联落地智慧农业的条件分析（应用+迁移）。","解题思路":"远程查看温湿度=传感器采集+网络传输+终端查看。老李需：①稳定网络（4G/5G或宽带）——保证数据上传下载；②带屏终端（手机/电脑）——查看与操控；隐含条件：大棚内安装传感器。答任意两种+原因即可。","易错警示":"只写“买手机”而漏网络条件，手机无网无法远程。","方法点拨":"“远程XX”题按信息链“采集→传输→呈现”逐环找所需条件，缺哪环补哪环。"}},{"sec":"拓展挑战","type":"拓展","num":1,"text":"爷爷说“我那会儿用的是砖头大的大哥大，只能打电话”。请用“五世代演进”向爷爷说明：从大哥大到今天的手机，通信能力发生了哪三个大变化？各用一句话。","opts":[],"subs":[],"ans":"①从只能语音（1G）到能发短信、看图文、刷视频（2G到4G）；②从单一通话到万物互联，手机能控大棚、看远程手术（5G）；③我国已5G领先，偏远地区还能靠卫星联网。","al":{"考查点":"五世代知识转化为代际沟通（应用+表达）。","解题思路":"面向爷爷须通俗：①从“只能打电话”到能发短信、看图文、刷视频（2G-4G，功能从单一到丰富）；②从“人连人”到万物互联，手机可遥控大棚、远程看手术（5G能力质变）；③我国5G全球领先，偏远山区靠卫星也能联网（成就+普惠）。","易错警示":"勿堆术语“带宽时延”，对象是老人要用生活化语言。","方法点拨":"“向长辈解释”题：选最反差的三点，每点一句大白话，可加手势类比。"}},{"sec":"拓展挑战","type":"拓展","num":2,"text":"方案设计：班级要办“中国通信成就展”，请你规划两个展区并各推荐一个可检索的关键词，再写一句“为什么这样展”的理由。","opts":[],"subs":[],"ans":"示例：展区一“5G领先”——关键词“5G基站占全球六成”；展区二“6G未来”——关键词“千帆星座卫星互联网”。理由：用真实数据展现从跟跑到领跑，增强民族自信。","al":{"考查点":"检索规划+成果物设计（综合+评价）。","解题思路":"展区规划须有“主题+关键词+理由”三件套。示例：展区一“5G领先”配关键词“5G基站占全球六成”，用数据说话；展区二“6G未来”配关键词“千帆星座卫星互联网”，展望前沿。理由回扣主题意义。","易错警示":"只写展区名不配检索词，或理由空泛（“很有意义”）都失分。","方法点拨":"“办展/方案”题统一模板：展区名+一句主题语+一个可搜关键词+一句价值理由。"}},{"sec":"变式闯关","type":"变式","num":1,"text":"换场景：同一“带宽驱动”原理，解释为什么早期微信只能发文字，而现在能开高清视频会议、甚至远程操控无人机。","opts":[],"subs":[],"ans":"早期2G/3G带宽小、时延高，仅支持文字图片；4G/5G大带宽低时延，使高清视频与实时远程控制成为可能，仍是“水管变粗”解锁新应用。","al":{"考查点":"5G特性+移动互联设备方案化综合应用（应用+评价+创造）。","解题思路":"按题目三问分步作答：①设备技术选型（至少两种）——5G高清摄像头识别离校、电子校徽/刷脸闸机定位学生、云端平台处理、家长手机App接收；②信息路径完整描述——“学生离校→设备感应识别→5G网络上传→云端匹配家长→大屏与App同步通知”；③带宽驱动分析——5G大带宽低时延支撑高清画面与实时定位，3G带宽窄时延高做不到，点明“技术特性决定应用可能”。","易错警示":"勿只列设备不讲路径，或路径缺“云端匹配”环节；带宽驱动分析须与3G对比才得分。","方法点拨":"方案设计题三问对应三个采分面（设备合理3分+路径完整4分+原理分析3分），作答时逐问展开、术语与场景结合。"}},{"sec":"间隔复习","type":"间隔","num":1,"text":"上节课我们组建了主题网站。请回忆：一个能被正常访问的网站至少由哪几部分组成？","opts":[],"subs":[],"ans":"（第20课《组建网站跟我做》）　至少包括：网页文件（HTML/CSS 等内容与样式）、存放网页的服务器空间（主机）、可访问的域名（或地址）——三者齐备才能被访问。","al":{"考查点":"网站三大组成要素（识记）。","解题思路":"\"内容+空间+地址\"缺一不可：没有内容是空站，没有空间无处安放，没有地址无从访问。","易错警示":"漏掉\"域名/地址\"最常见——文件做好了却\"找不到门\"。","方法点拨":"类比开店：货（网页）+店面（服务器）+招牌门牌（域名）。"}},{"sec":"间隔复习","type":"间隔","num":2,"text":"网站在发布前后各要做哪些检查？请各写出一条。","opts":[],"subs":[],"ans":"（第20课《组建网站跟我做》）　发布前：检查所有链接可点通、文字图片显示正常（内容校对）；发布后：用不同设备/浏览器实际访问测试，确认加载与显示正常（可用性验证）。","al":{"考查点":"网站发布流程的测试要点（应用）。","解题思路":"发布前查\"内容对不对\"，发布后验\"访问行不行\"，两个阶段职责不同。","易错警示":"只答\"检查一遍\"太笼统，须落到具体检查对象。","方法点拨":"发布检查清单化：链接、显示、兼容、速度逐项打勾。"}},{"sec":"思维进阶","type":"挑战","num":1,"text":"【真实情境】寿光某小学紧邻蔬菜大棚区，放学时常有家长在大棚迷宫里绕路找不到孩子。请你利用移动互联与5G技术，为学校设计一套“智慧放学接送引导系统”。请写出：①系统需要用到哪些移动互联设备或技术（至少两种）及其作用；②描述信息从“学生离校”到“家长手机收到提示”的流动路径；③说明这套系统如何体现“带宽驱动创新”（相比3G时代为什么以前做不到）。","opts":[],"subs":[],"open":true,"ans":"参考设计要点：①设备/技术：学生智能手环或校园卡（刷卡/定位签到，感知\"谁离校\"）、5G网络+云平台（数据实时上传）、家长手机App/小程序（接收推送）、电子班牌（显示离校状态）；②信息流动路径：学生刷卡/手环感应离校→数据经5G上传云平台→平台比对家长绑定关系→实时推送\"孩子已离校\"到家长手机；③带宽驱动创新体现：高清视频、实时位置、大规模并发推送都需要大带宽低时延——3G时代带宽窄、时延高，做不到\"全校同时离校仍秒级推送\"，5G让海量设备的实时交互成为可能。","al":{"考查点":"开放创造：移动互联方案的系统设计（创造+应用）","解题思路":"设备与技术至少两种且各有用途；信息路径按\"感知→传输→处理→接收\"闭环描述；第三问必须对比\"5G能而3G不能\"的点","易错警示":"路径写成单向不闭环；第③问只夸\"5G快\"没有说明为什么3G做不到","方法点拨":"系统题三段：设备清单→信息路径→技术代差论证。"}}]},{"t":"第 22 课 · 配套练习 · 建议用时15分钟","n":"在线学习新变革","isExam":false,"qs":[{"sec":"回忆热身","type":"回忆","num":1,"text":"在线学习的三大突破是突破时空、突破人数和拥有____。","opts":[],"subs":[],"ans":"海量资源（海量数字资源）","al":{"考查点":"在线学习三大突破（识记）。","解题思路":"三大突破：突破时空（随时随地）、突破人数（万人同课）、海量资源（名师课随取）。题干给出前两突破，末空即“海量资源（海量数字资源）”。","易错警示":"勿填“个性化推荐”——它是建立在海量资源上的增值功能，不是与时空、人数并列的第三突破。","方法点拨":"“三大突破”与“两化服务（个性化推荐/智能辅导）”分层记忆，填空先填主干再想增值。"}},{"sec":"回忆热身","type":"回忆","num":2,"text":"平台像“淘宝推荐商品”一样给你推课程，背后靠的是____与算法。","opts":[],"subs":[],"ans":"数据（学习行为数据）","al":{"考查点":"在线学习个性化推荐的实现基础（理解）。","解题思路":"平台“像淘宝推荐商品一样”推课，依据是记录下的学习行为数据（看了什么、停留多久、做错哪些题），再由算法匹配课程。","易错警示":"勿答“老师的评价”，推荐依赖机器可读的行为数据而非主观评价。","方法点拨":"“背后靠什么”题答“数据＋算法”，数据是原料、算法是加工。"}},{"sec":"基础巩固","type":"单选","num":1,"text":"“天宫课堂”太空授课让全国学生同时听课，最能体现在线学习哪一突破？","opts":[{"label":"A","text":"突破时空"},{"label":"B","text":"突破人数"},{"label":"C","text":"海量资源"},{"label":"D","text":"个性化推荐"}],"subs":[],"ans":"答案A　突破时空","al":{"考查点":"在线学习突破点的实例辨析（应用）。","解题思路":"“天宫课堂”太空与地面同时授课：学生分布各地却能同听一堂课，本质是打破地理位置限制（空间），也可含时间同步性——核心是突破时空。","逐项剖析":"A项突破时空——对，太空授课让学生跨地域同时听课；B项突破人数——体现于万人同平台选课而非地域同步；C项海量资源——指课程内容之多，与此情境不符；D项个性化推荐——指千人千面推送，无关。","易错警示":"勿因“全国学生同时听”误选“突破人数”，关键词是“同时、各地”指向时空。","方法点拨":"抓情境关键词：跨地域→突破时空；人数爆满→突破人数；名师课海量→海量资源。"}},{"sec":"基础巩固","type":"单选","num":2,"text":"在线学习“个性化推荐”是指系统根据你的____自动推送适合的内容。","opts":[{"label":"A","text":"生日"},{"label":"B","text":"学习行为与数据"},{"label":"C","text":"好友数量"},{"label":"D","text":"手机价格"}],"subs":[],"ans":"答案B　学习行为与数据","al":{"考查点":"个性化推荐的数据来源（理解）。","解题思路":"“根据你的____自动推送”：推荐系统以学习行为与数据为输入——记录你学过、做错、感兴趣的题，形成用户画像。","逐项剖析":"A项生日——静态信息不反映学习需求；B项学习行为与数据——对，行为数据是推荐的依据；C项好友数量——与学习内容无关；D项手机价格——更不能反映学情。","易错警示":"勿选“生日”等静态标签，推荐靠动态行为数据。","方法点拨":"数据画像三要素：行为（看过）、结果（对错）、偏好（停留）——都来自学习过程。"}},{"sec":"基础巩固","type":"单选","num":3,"text":"关于线上与线下学习，下列说法正确的是：","opts":[{"label":"A","text":"线上完全取代线下"},{"label":"B","text":"线下互动监督更强、线上灵活资源多"},{"label":"C","text":"线下已无价值"},{"label":"D","text":"混合学习不如纯线上"}],"subs":[],"ans":"答案B　线下互动监督更强、线上灵活资源多","al":{"考查点":"线上线下学习关系辩证理解（评价）。","解题思路":"线上与线下各有长短，正确态度是优势互补、混合学习。","逐项剖析":"A项线上完全取代线下——极端错误，线下情感互动、实验操作不可替代；B项线下互动监督更强、线上灵活资源多——对，准确概括两者优势；C项线下已无价值——同样极端；D项混合学习不如纯线上——与主流结论相反。","易错警示":"“完全取代/毫无价值”等绝对化选项基本为错，混合学习是共识。","方法点拨":"“关系类”选择题：选“各有优势、互补融合”的辩证表述。"}},{"sec":"基础巩固","type":"单选","num":4,"text":"长期使用在线学习，下列做法不利于健康的是：","opts":[{"label":"A","text":"每20分钟远眺20秒"},{"label":"B","text":"调节屏幕亮度"},{"label":"C","text":"连续数小时不休息刷课"},{"label":"D","text":"定时起身活动"}],"subs":[],"ans":"答案C　连续数小时不休息刷课","al":{"考查点":"在线学习健康用眼习惯（应用）。","解题思路":"长期在线学习最需防视疲劳：20-20-20法则、调亮度、定时起身。找“不利于健康”的反面选项。","逐项剖析":"A项每20分钟远眺20秒——符合护眼法则，有利；B项调节屏幕亮度——护眼措施；C项连续数小时不休息刷课——对，最伤眼伤身，是“不利于健康”项；D项定时起身活动——有利。","易错警示":"题干问“不利于”，勿惯性选有利项。","方法点拨":"审题先圈“不利/错误/不属于”等反向词再作答。"}},{"sec":"基础巩固","type":"判断","num":1,"text":"在线学习就是把课堂视频原样放到网上，和传统课堂没有区别。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"在线学习本质辨析（理解）。","解题思路":"判断句将在线学习窄化为“视频原样上网”。实际上它还突破人数、提供海量资源、支持个性化推荐，是教学形态重构而非内容搬运。","易错警示":"“没有区别”式绝对表述，找出一处实质差异即可推翻。","方法点拨":"抓“原样/没有区别”等词，用“至少一点不同”反驳。"}},{"sec":"基础巩固","type":"判断","num":2,"text":"国家中小学智慧教育平台让山区孩子也能听名师课，有助于缩小数字鸿沟。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"在线学习促进教育公平（理解+评价）。","解题思路":"国家平台汇集名师课免费共享，山区孩子能听名师课，优质资源跨越地域流动——缩小数字鸿沟、促进公平，表述成立。","方法点拨":"“共享促进公平”逻辑：资源数字化→低成本复制→欠发达地区可得。"}},{"sec":"基础巩固","type":"判断","num":3,"text":"AI学习助手给出的答案一定正确，可以直接抄进作业。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"AI辅助学习边界（AI伦理+防学习外包）。","解题思路":"AI学习助手可能出错或过时，直接抄写等于放弃思考（学习外包）。正确用法是先独立思考再核验，L2级别“先想再验证”。","易错警示":"“一定正确”是绝对化陷阱；凡AI输出须经批判核验。","方法点拨":"凡遇“AI说的都对/可直接抄”类判断，一律判错——人要保持思考主体性。"}},{"sec":"能力提升","type":"提升","num":1,"text":"填写线上线下对比表：从“灵活性、资源丰富度、互动监督”三方面各写一句差异。","opts":[],"subs":[],"ans":"灵活：线上随时回放，线下固定课表；资源：线上海量可检索，线下受课本限制；互动：线下师生当面强，线上需自律。","al":{"考查点":"线上线下多维对比（分析）。","解题思路":"从三方面各写一句差异：灵活性——线上随时回放、线下固定课表；资源丰富度——线上海量可检索、线下受课本与图书馆限制；互动监督——线下师生当面即时、线上靠自觉与工具。","易错警示":"两方面写重（都写“方便”）不得分，须每方面有独立视角。","方法点拨":"对比表题按“维度分行”，每行只写一个维度的双方差异。"}},{"sec":"能力提升","type":"提升","num":2,"text":"用“快递员按地址送货”类比，解释在线学习的个性化推荐是怎么实现的。","opts":[],"subs":[],"ans":"系统像快递员记录你的“地址”（学过的、做错的题），算法据此把合适课程“送”到你面前，实现千人千面。","al":{"考查点":"类比理解个性化推荐机制（理解+迁移）。","解题思路":"快递员按“地址”送货=系统按“你的学习档案（学过的、做错的）”匹配；地址精确则送达精准，数据丰富则推荐精准。","易错警示":"类比须双线对应：快递地址↔学习行为数据、送货↔推课，缺一线即不完整。","方法点拨":"类比解释题先列“本体↔喻体”映射表，再串成一句话。"}},{"sec":"能力提升","type":"提升","num":3,"text":"排序：把“想学Python”的在线学习路径排好：A.在平台选入门课 B.用AI助手制定周计划 C.每日练习并复盘。","opts":[],"subs":[],"ans":"B到A到C（先规划再选课再练习；也可A到B到C，逻辑自洽即可）。","al":{"考查点":"在线学习路径规划（应用）。","解题思路":"“想学Python”合理路径：先定目标与计划（B用AI助手制周计划/自己规划），再选入门课（A），最后每日练习复盘（C）。逻辑自洽即可，标准序B→A→C。","易错警示":"先选课再规划也不算全错，但“先规划再行动”更优；排序题答案须说明逻辑。","方法点拨":"排序题先定“第一步是定目标”的原则，再排执行链。"}},{"sec":"能力提升","type":"提升","num":4,"text":"寿光某中学用“国家智慧教育平台”给大棚种植社团开直播课。写出这同时体现了在线学习的哪两个特点，各举一点好处。","opts":[],"subs":[],"ans":"①突破时空：社团成员课后可回放复习；②海量资源：能调阅各地农业名师课。让本地农业社团获得更广知识。","al":{"考查点":"在线学习特点迁移本地场景（应用）。","解题思路":"直播课给大棚社团体现：①突破时空——课后可回放，错过的同学能补；②海量资源——调阅各地农业名师课，拓宽知识。各举一点好处即可。","易错警示":"只写特点不写好处的会扣一半分，每个特点必须配“所以好处是…”。","方法点拨":"“体现哪两个特点+好处”题=特点名称＋一句场景证据＋一句价值。"}},{"sec":"拓展挑战","type":"拓展","num":1,"text":"山区同学小宇家网络常卡顿，错过直播课。请站在“人本为要”角度，提出两条让在线学习更公平的建议，并说明依据。","opts":[],"subs":[],"ans":"①为薄弱地区补建网络、提供离线资源包，依据是人本导向需保障基本接入；②安排教师同步辅导与回放，依据是混合学习弥补线上监督不足。","al":{"考查点":"在线学习公平思辨（评价+社会责任）。","解题思路":"“人本为要”即关注最弱者的体验。两条建议：①补建网络/发离线资源包——保障基本接入，依据人本导向不让设备网络成为门槛；②教师同步辅导与回放答疑——用混合学习补线上监督与互动的不足。","易错警示":"建议脱离“公平”主题（如“让小宇换个好手机”）即偏题；每条须带依据。","方法点拨":"“更公平”题双管齐下：一条治“够不着”（接入/资源），一条治“学不透”（辅导/互动）。"}},{"sec":"拓展挑战","type":"拓展","num":2,"text":"方案设计：同学想用AI助手制定“期末复习计划”，但担心被AI“代劳思考”。请设计一份“人机分工方案”（含三步），确保自己仍在主导。","opts":[],"subs":[],"ans":"①人先列薄弱科目与目标；②AI出初稿计划；③人核验每周目标是否现实并改两处。人定目标与决策，AI只供初稿，思考权不外包。","al":{"考查点":"人机分工防思考外包（评价+设计）。","解题思路":"三步确保人主导：①人先列薄弱科目与目标（定方向的是人）；②AI据此出初稿计划（AI只当秘书）；③人核验每项目标是否现实并改两处（决策权在人）。思考权不外包。","易错警示":"若方案是“AI全做，我照着执行”即失败；关键评分点是“人定目标、人改定稿”。","方法点拨":"凡“用AI但不想被代劳”的方案题，模板=人定方向→AI出初稿→人核验修改→人拍板。"}},{"sec":"变式闯关","type":"变式","num":1,"text":"换场景：同样用“数据加算法推荐”原理，解释为什么短视频平台总给你推同类视频，以及你可以怎样“破圈”。","opts":[],"subs":[],"ans":"平台记录你的观看偏好持续推送同类（信息茧房雏形）；可主动搜索不同内容、关注多元账号来破圈。","al":{"考查点":"推荐算法迁移解释（迁移）。","解题思路":"短视频平台推同类=记录观看偏好持续推送，与在线课程推荐同一“数据加算法”机制；其副作用是信息茧房。破圈法：主动搜索不同内容、关注多元账号、关闭个性化推荐。","易错警示":"只解释“为什么推”不答“怎么破圈”会答一半；方法须具体可执行。","方法点拨":"“算法推荐”迁移题三连答：机制（数据偏好）→副作用（茧房）→对策（主动跨圈）。"}},{"sec":"间隔复习","type":"间隔","num":1,"text":"上节课学了“带宽驱动创新”。请举一个5G大带宽低时延支撑的新应用，并说明它为什么在3G时代做不到。","opts":[],"subs":[],"ans":"（第21课《移动互联新发展》）　示例：远程手术；3G带宽窄时延高无法实时传输高清画面与操控信号，5G才可行。","al":{"考查点":"在线学习功能设计＋数据推荐＋教育公平综合（应用+评价+创造）。","解题思路":"三问三采分面：①平台功能（至少两点）——跨班选课系统、回放与离线下载、课程分级标签等，须能支撑“跨班选学＋海量资源”；②“数据加算法”推荐——记录学习行为数据，算法推荐相邻难度新课，并刻意推送陌生领域防窄化；③公平措施——离线资源包＋线下答疑，依据“不制造新数字落差、混合学习”。","易错警示":"功能泛泛（“做好平台”）不给分，须具体；公平措施只说“让家长买设备”违背人本导向。","方法点拨":"“设计运行方案”题按题目序号逐问作答，每问先亮方案名再给一句原理支撑。"}},{"sec":"思维进阶","type":"挑战","num":1,"text":"【真实情境】学校想给课后延时服务增加“在线拓展课堂”，让不同年级同学跨班选学（如Python入门、科幻写作、天文观察），又要保证网络差、没设备的同学不掉队。请你当“在线学习管理员”设计运行方案。请写出：①平台需要哪些功能支撑“跨班选学＋海量资源”（至少两点）；②怎样用“数据加算法”帮同学找到合适的课，同时避免只学同一类内容；③针对网络差或无设备的同学设计一条保障公平的具体措施并说明依据。","opts":[],"subs":[],"open":true,"ans":"参考设计要点：①平台功能：选课系统（跨班报名、容量管理、自动排班）与资源库（课程视频分类存储、离线下载包），再加学习进度记录支撑跨班管理；②数据+算法：根据选课记录与观看时长分析兴趣与水平，推荐\"同类进阶+邻近领域\"课程（如选了Python入门再推算法小游戏），并强制混入一定比例的陌生领域课程避免茧房；③公平保障措施：把每门课的核心讲义录制成低码率视频+文字版讲义，通过网络差的教室专用线路同步，并给无设备同学开放机房统一时段——依据是\"在线学习的普惠性：技术要缩小而非扩大差距\"。","al":{"考查点":"开放创造：在线学习平台方案与教育公平设计（创造+评价）","解题思路":"功能要支撑\"跨班+海量\"两个关键词；推荐算法要写\"防单一化\"机制；公平措施要具体可操作并说明依据","易错警示":"推荐只写\"猜你喜欢\"没有防茧房设计；公平措施只喊口号不给落地办法","方法点拨":"平台题三看：功能对应需求？算法有制衡？公平有抓手？"}}]},{"t":"第 23 课 · 配套练习 · 建议用时15分钟","n":"在线生活创意多","isExam":false,"qs":[{"sec":"回忆热身","type":"回忆","num":1,"text":"互联网创新的三种方式是数据打通、场景创新和____。","opts":[],"subs":[],"ans":"工具创新","al":{"考查点":"互联网创新三种方式（识记）。","解题思路":"三方式口诀“数场工”：数据打通（一次录入处处共享）、场景创新（从无到有新服务）、工具创新（新工具降门槛）。题干给出前两，末空“工具创新”。","易错警示":"勿填“技术升级”等自造词，须用规范三方式名称。","方法点拨":"凡“创新方式”填空/归类，先背口诀再套例子。"}},{"sec":"回忆热身","type":"回忆","num":2,"text":"数字人民币是____数字货币，具有可控匿名、无网也可支付的特点。","opts":[],"subs":[],"ans":"法定（国家）","al":{"考查点":"数字人民币属性（识记）。","解题思路":"数字人民币是由中国人民银行发行的法定数字货币，等同现金，特点：可控匿名、双离线支付（无网也能付）。","易错警示":"勿填“商业/企业”发行——它非法定机构不可发行；核心词是“法定”。","方法点拨":"数字人民币三关键词捆绑记：法定＋可控匿名＋无网可付。"}},{"sec":"基础巩固","type":"单选","num":1,"text":"快递“下单后全程可查物流到哪了”，主要体现了哪种创新方式？","opts":[{"label":"A","text":"场景创新"},{"label":"B","text":"数据打通"},{"label":"C","text":"工具创新"},{"label":"D","text":"价格创新"}],"subs":[],"ans":"答案B　数据打通","al":{"考查点":"创新方式实例归类（应用）。","解题思路":"物流“下单后全程可查”=各环节数据（下单、分单、配送、签收）一处录入处处共享，属数据打通。","逐项剖析":"A项场景创新——指创造从无到有的新服务场景，物流查询是优化既有流程而非新场景；B项数据打通——对，全程物流信息共享正是数据打通；C项工具创新——指新工具降门槛，如AI一键做PPT；D项价格创新——非规范三方式之一。","易错警示":"“全程可查”易被误读为场景创新，判别标准：是否依赖“数据在多主体间共享”。","方法点拨":"归类三步：看它靠什么实现——靠数据共享→数据打通；靠新场景→场景创新；靠新工具→工具创新。"}},{"sec":"基础巩固","type":"单选","num":2,"text":"外卖平台在“吃饭”这件事上创造了过去没有的新服务，这属于：","opts":[{"label":"A","text":"数据打通"},{"label":"B","text":"场景创新"},{"label":"C","text":"工具创新"},{"label":"D","text":"算法创新"}],"subs":[],"ans":"答案B　场景创新","al":{"考查点":"场景创新概念辨析（应用）。","解题思路":"外卖把“吃饭”从堂食/食堂扩展为“手机点单送到家”，创造了过去不存在的新服务场景——场景创新。","逐项剖析":"A项数据打通——外卖虽也用数据，但它的本质是开辟“在线点餐到家”新场景；B项场景创新——对，从无到有的服务形态；C项工具创新——指App等工具降低门槛，但“新服务本身”是场景；D项算法创新——非规范三方式。","易错警示":"题干“创造了过去没有的新服务”直指场景创新，勿被“App/平台”干扰选工具创新。","方法点拨":"“创造了以前没有的XX”=场景创新关键词。"}},{"sec":"基础巩固","type":"单选","num":3,"text":"关于数字人民币，下列说法正确的是：","opts":[{"label":"A","text":"它是某支付软件发行的"},{"label":"B","text":"它是国家法定货币等同现金"},{"label":"C","text":"必须联网才能付"},{"label":"D","text":"与纸币完全不同不可控"}],"subs":[],"ans":"答案B　它是国家法定货币等同现金","al":{"考查点":"数字人民币特征辨析（识记）。","解题思路":"数字人民币=国家法定数字货币，等同现金（M0），可控匿名、双离线支付。","逐项剖析":"A项它是某支付软件发行的——错，是央行发行，支付软件只是钱包渠道；B项它是国家法定货币等同现金——对；C项必须联网才能付——错，支持无网（双离线）支付；D项与纸币完全不同不可控——错，它与纸币同为法定货币且可控匿名。","易错警示":"“等同于现金”是核心，勿把数字人民币与“账户余额/第三方支付”混为一谈。","方法点拨":"法定数字货币题：发行主体（央行）＋法律地位（等同现金）双确认。"}},{"sec":"基础巩固","type":"单选","num":4,"text":"下列对“创新两面性”的理解，正确的是：","opts":[{"label":"A","text":"创新只有好处"},{"label":"B","text":"AI主播只创造岗位不替代"},{"label":"C","text":"创新也带来岗位变化与网络犯罪等挑战"},{"label":"D","text":"低空经济毫无风险"}],"subs":[],"ans":"答案C　创新也带来岗位变化与网络犯罪等挑战","al":{"考查点":"创新两面性辩证认知（评价）。","解题思路":"创新不是单利好：带来便利也带来岗位更替、网络犯罪、信息茧房等挑战，需科技向善与规则护航。","逐项剖析":"A项创新只有好处——绝对化错误；B项AI主播只创造岗位不替代——片面，AI既创造新岗位也替代部分岗位；C项创新也带来岗位变化与网络犯罪等挑战——对，辩证全面；D项低空经济毫无风险——绝对化错误。","易错警示":"“只有/毫无/完全”绝对词选项常为错，选含“也带来挑战”的辩证项。","方法点拨":"“两面性”题统一选“既有利好也有挑战＋需规范”的选项。"}},{"sec":"基础巩固","type":"判断","num":1,"text":"用AI一键生成宣传文案，属于互联网“工具创新”的体现。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"工具创新实例判断（理解）。","解题思路":"AI一键生成宣传文案：AI写作工具让不会写文案的人也能产出，降低创作门槛——典型工具创新。","易错警示":"勿因“文案”联想到场景创新，判别看主角是“新工具”还是“新场景”。","方法点拨":"“AI一键做XX”=工具创新高频信号。"}},{"sec":"基础巩固","type":"判断","num":2,"text":"数据打通就是反复手动输入同样的信息到不同系统。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"数据打通概念正解（理解）。","解题思路":"数据打通=一次录入、处处共享、自动同步；反复手动输入同一信息到不同系统恰恰是“数据孤岛”，是数据打通要解决的问题。","易错警示":"把“手动重复输入”当打通是常见误解；打通的核心是“系统间自动同步”。","方法点拨":"用反例辨析：若还要人工重录，说明没打通。"}},{"sec":"基础巩固","type":"判断","num":3,"text":"只要技术够新，互联网创新应用就一定会让所有人受益，没有代价。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"创新两面性判断（评价）。","解题思路":"“技术够新就一定让所有人受益、没有代价”过于绝对：创新伴随数字鸿沟、岗位替代、新型犯罪等代价，须辩证看待并完善规则。","易错警示":"技术进步≠普惠自动实现，中间需要政策与伦理护航。","方法点拨":"含“一定/所有/没有代价”的判断基本为错。"}},{"sec":"能力提升","type":"提升","num":1,"text":"画出“扫码支付”的简易流程图（至少三个环节），并标出其中体现“数据加信用加技术”的一处。","opts":[],"subs":[],"ans":"出示付款码到商家扫码到银行或平台账户扣款完成。扣款环节体现数据（账户信息）加信用（支付信任）加技术（二维码）。","al":{"考查点":"扫码支付流程拆解（应用+建模）。","解题思路":"流程图三段：出示付款码→商家扫码→银行/平台账户扣款。其中“扣款”环节体现“数据（账户信息）＋信用（支付信任）＋技术（二维码识别）”。","易错警示":"漏画“扣款”这一核心环节；或标注时只写“技术”漏“数据与信用”。","方法点拨":"画流程图先定“起点事件→中间动作→终点结果”，再找“三要素”标注点。"}},{"sec":"能力提升","type":"提升","num":2,"text":"连线：将应用归入创新方式。①物流全程跟踪 ②外卖 ③AI一键做PPT ｜A.数据打通 B.场景创新 C.工具创新","opts":[],"subs":[],"ans":"①—A；②—B；③—C。","al":{"考查点":"创新方式归类连线（应用）。","解题思路":"①物流全程跟踪——多主体数据共享→数据打通（A）；②外卖——从无到有的新服务→场景创新（B）；③AI一键做PPT——新工具降门槛→工具创新（C）。","易错警示":"物流跟踪勿连场景创新；判断依据仍是“靠数据共享/新场景/新工具”三分法。","方法点拨":"连线题先逐例套“三方式判别问句”，再落笔。"}},{"sec":"能力提升","type":"提升","num":3,"text":"寿光菜农用“直播电商”把蔬菜卖全国。分析它主要用了哪两种创新方式，各写一句理由。","opts":[],"subs":[],"ans":"①场景创新：把“卖菜”从线下集市搬到直播间新场景；②工具创新：用直播与短视频工具降低推广门槛（也可说是数据打通会员数据）。","al":{"考查点":"创新方式迁移本地案例（应用）。","解题思路":"直播电商卖菜：①场景创新——把“卖菜”从线下集市搬到直播间，开辟线上卖菜新场景；②工具创新——直播、短视频工具降低农户触网门槛（会员数据打通也成立，言之成理即可）。","易错警示":"只写一种方式漏第二种；理由须贴合“直播电商”而非空泛。","方法点拨":"本地案例题：把案例动作逐个对照三方式，选最贴切的两个并各写一句证据。"}},{"sec":"能力提升","type":"提升","num":4,"text":"辩证分析：以“无人收银”为例，写出它带来的一处便利和一处挑战，并各给一条应对。","opts":[],"subs":[],"ans":"便利：结账更快无需排队；挑战：收银员岗位减少。应对：劳动者转学设备维护、客服等新技能（或平台提供转岗培训）。","al":{"考查点":"无人收银两面性分析（评价）。","解题思路":"便利：结账快、免排队、24小时可购；挑战：收银员岗位减少。应对：劳动者转学设备维护、客服、运营新技能，或企业/政府提供转岗培训。","易错警示":"“应对”只写“让收银员失业”没给解决方案不得分；对策须面向受影响的人。","方法点拨":"“一处便利＋一处挑战＋应对”题：便利与挑战须成对（同源于无人化），对策指向人而非技术。"}},{"sec":"拓展挑战","type":"拓展","num":1,"text":"寿光蔬菜大棚装了物联网传感器，蔬菜长势数据可与物流、电商打通。请分析这种“数据打通”给菜农和消费者各带来什么好处，并指出可能的新风险及一条防范办法。","opts":[],"subs":[],"ans":"菜农：精准种植、按需供货；消费者：扫码知溯源更放心。风险：种植数据泄露被竞争对手利用。防范：平台加密授权、最小必要采集。","al":{"考查点":"数据打通综合迁移与风险评估（综合）。","解题思路":"大棚长势数据与物流、电商打通：菜农得精准种植、按需供货之利；消费者得扫码溯源之信。风险：种植与经营数据泄露被竞争对手利用。防范：平台加密存储、最小必要采集、授权访问。","易错警示":"好处要分主体（菜农/消费者）写，风险须具体到“数据被谁怎样利用”。","方法点拨":"“数据打通利弊”题模板：利（供给端＋需求端各一条）＋风险（一种具体泄露场景）＋防范（技术+制度各一条）。"}},{"sec":"拓展挑战","type":"拓展","num":2,"text":"评价决策：班级义卖想用“数字人民币”收款。请对比它与第三方支付的异同，并给出两条使用建议。","opts":[],"subs":[],"ans":"同：都能手机收付、便捷；异：数字人民币是法定货币等同现金、可控匿名、可无网付，第三方是账户存管。建议：小额无网也能收；保留交易凭证防纠纷。","al":{"考查点":"数字人民币与第三方支付异同辨析＋决策建议（评价）。","解题思路":"同：都可用手机便捷收付。异：数字人民币是央行发行的法定货币、等同现金、可控匿名、支持无网支付；第三方支付是“账户存管”，依赖网络与机构信用。建议：义卖小额可用数字人民币实现无网也能收；同时保留交易凭证防纠纷。","易错警示":"只说“差不多”不辨析差异失分；建议须落到“班级义卖”具体场景。","方法点拨":"“对比＋建议”题：先同后异（异从发行主体/法律地位/支付方式切入），建议绑定场景写两条。"}},{"sec":"变式闯关","type":"变式","num":1,"text":"换场景：同样是“场景创新”，请举一个你身边的例子（如扫码乘公交），说明它创造了什么过去没有的新便利。","opts":[],"subs":[],"ans":"示例：扫码乘公交——过去需备零钱或买卡，现在手机一刷即乘，创造了“无接触即时乘车”的新场景。","al":{"考查点":"场景创新迁移（迁移）。","解题思路":"扫码乘公交：过去备零钱/买卡，现在手机一刷即乘——创造了“无接触即时乘车”的新便利，属场景创新（兼用数据与技术）。","易错警示":"只描述“怎么扫”没点出“过去没有的新便利”，未答到场景创新本质。","方法点拨":"“举身边的场景创新”题必须完成“过去怎样→现在怎样→新增了什么便利”三段。"}},{"sec":"间隔复习","type":"间隔","num":1,"text":"上节课提到5G应用有云游戏、远程手术等。请再举一个“5G让新应用成为可能”的例子，并说明它依赖5G的什么特性。","opts":[],"subs":[],"ans":"（第21课《移动互联新发展》）　示例：自动驾驶；依赖5G低时延与大带宽，使车与车、车与路实时通信避免事故。","al":{"考查点":"互联网创新三方式综合策划＋两面性（创造+评价）。","解题思路":"按三问展开：①新场景须亮名＋解痛点（“云上认养”解决买菜麻烦与信任）；②三方式各有着落——工具创新（小程序/直播）、场景创新（云种菜新场景）、数据打通（认养订单×大棚传感器）；③风险防范成对——数据泄露风险对应最小必要采集＋加密＋授权查看。","易错警示":"三种方式必须“分工不同”，全堆在一个环节即失分；风险须与方案自身相关而非泛泛“黑客攻击”。","方法点拨":"“用全三种方式”题先给方案起名立场景，再逐方式找落点，最后自问“这个方案会带来什么新问题”。"}},{"sec":"思维进阶","type":"挑战","num":1,"text":"【真实情境】寿光蔬菜远近闻名，但外地年轻人觉得“逛菜市场麻烦”，网购又怕不新鲜。请你为寿光蔬菜策划一个“互联网＋卖菜”新方案，把三种创新方式都用上。请写出：①新场景叫什么、解决什么痛点；②数据打通、场景创新、工具创新三种方式各落在方案的哪一步；③方案可能带来的一个新风险及一条防范办法。","opts":[],"subs":[],"open":true,"ans":"参考设计要点：①新场景示例：\"寿光菜篮子直通车\"小程序——大棚直采+次日达，解决\"不新鲜、嫌麻烦\"的痛点；②三种创新落位：数据打通——大棚温湿度与产量数据接入平台，成熟度可查、溯源可信（数据创新）；场景创新——\"云认养一垄菜\"：城里人线上认养、直播看长势、成熟寄到家（场景创新）；工具创新——小程序下单+社区自提柜+AI客服自动答疑（工具创新）；③新风险与防范：销售数据与消费者隐私可能被滥用——防范：最小化收集、明示用途、平台加密存储并定期清理。","al":{"考查点":"开放创造：互联网+农业的综合创新设计（创造+评价）","解题思路":"三种创新方式（数据/场景/工具）必须各落一环且互相衔接；风险要来自方案本身而非泛泛而谈","易错警示":"把三种创新混成一句话；风险写\"可能被黑客攻击\"与方案无具体关联","方法点拨":"创新题自查：三方式各就各位了吗？风险与防范成对了吗？"}}]},{"t":"第 24 课 · 配套练习 · 建议用时15分钟","n":"在线交流新气象","isExam":false,"qs":[{"sec":"回忆热身","type":"回忆","num":1,"text":"交流形式从短信到IM、视频，再到弹幕语音和____（AI数字人）。","opts":[],"subs":[],"ans":"数字分身（数字人）","al":{"考查点":"交流形式演进脉络（识记）。","解题思路":"演进链：短信→即时消息IM→视频通话→弹幕语音→数字分身（AI数字人）——交互从文字走向实时、从真人走向虚拟形象。","易错警示":"勿填“表情包”——它是辅助元素而非代际演进节点。","方法点拨":"按“文字→语音→视频→虚拟人”的媒体丰富度记忆演进。"}},{"sec":"回忆热身","type":"回忆","num":2,"text":"建设数字形象要从内容、礼仪和____三方面用心经营。","opts":[],"subs":[],"ans":"隐私（隐私保护）","al":{"考查点":"数字形象建设三方面（识记）。","解题思路":"经营数字形象＝内容（发什么）＋礼仪（怎么说）＋隐私（藏什么）。题干给出内容、礼仪，末空“隐私（隐私保护）”。","易错警示":"勿填“颜值”——数字
