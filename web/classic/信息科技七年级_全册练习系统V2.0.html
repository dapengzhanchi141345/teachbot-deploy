（高到低）：应（用）传（输）网（络）口（网络接口）。"}},{"sec":"基础巩固","type":"单选","num":1,"text":"下列属于TCP/IP四层模型的是：","opts":[{"label":"A","text":"应用层、传输层、网络层、网络接口层"},{"label":"B","text":"应用层、会话层、传输层、物理层"},{"label":"C","text":"表现层、传输层、网络层、链路层"},{"label":"D","text":"应用层、网络层、数据层、接口层"}],"subs":[],"ans":"答案A　应用层、传输层、网络层、网络接口层","al":{"考查点":"TCP/IP四层模型的组成（识记）。","解题思路":"对照教材四层名单逐项核查，干扰项多是OSI七层名称的混搭。","逐项剖析":"A项应用/传输/网络/网络接口正是TCP/IP四层，正确；B项混入“会话层、物理层”（OSI的叫法），错误；C项“表现层、链路层”是OSI体系，错误；D项“数据层、接口层”名称不规范，错误。","易错警示":"TCP/IP四层与OSI七层名称别混：TCP/IP没有“会话层/表现层”概念。","方法点拨":"记四层再认七层：四层=应用传输网络接口；凡出现会话层/表示层/链路层字样的选项直接排除。"}},{"sec":"基础巩固","type":"单选","num":2,"text":"寄快递时，寄件人只管填单交件，不必知道卡车走哪条高速。这体现分层思想的：","opts":[{"label":"A","text":"各层必须互相知道全部细节"},{"label":"B","text":"各层只管自己的事、通过标准接口协作"},{"label":"C","text":"层数越多越慢"},{"label":"D","text":"只有最底层有用"}],"subs":[],"ans":"答案B　各层只管自己的事、通过标准接口协作","al":{"考查点":"分层思想“各司其职”的理解（理解）。","解题思路":"寄件人不管卡车走哪条高速→只管自己这层的事、通过标准接口与下层交接，不深究他人细节。","逐项剖析":"A项“各层必须互相知道全部细节”与分层精神相反；B项各层只管自己、通过标准接口协作，正确；C项“层数越多越慢”无关且错误；D项“只有最底层有用”否定分层价值。","易错警示":"分层不是“层层透明”，恰恰是“层层屏蔽”——每层只见邻居、不管远处。","方法点拨":"分层思想关键词：各司其职、标准接口、只见邻居。"}},{"sec":"基础巩固","type":"单选","num":3,"text":"下列协议中，属于“应用层”的是：","opts":[{"label":"A","text":"IP"},{"label":"B","text":"TCP"},{"label":"C","text":"HTTP"},{"label":"D","text":"UDP"}],"subs":[],"ans":"答案C　HTTP","al":{"考查点":"应用层协议的识别（识记+理解）。","解题思路":"“应用层”负责具体网络服务→HTTP（网页服务）属于应用层；TCP/UDP是传输层、IP是网络层。","逐项剖析":"A项IP在网络层，错误；B项TCP在传输层，错误；C项HTTP是应用层协议（提供网页浏览服务），正确；D项UDP在传输层，错误。","易错警示":"最常错的是把TCP/UDP当应用层——它们是传输层“搬运工”，HTTP/FTP/DNS才是应用层“服务员”。","方法点拨":"协议分层速记：网页HTTP、文件FTP、域名DNS在应用层；TCP/UDP在传输层；IP在网络层。"}},{"sec":"基础巩固","type":"单选","num":4,"text":"快递公司换新卡车，寄件人完全不受影响。这用来类比分层的哪条好处？","opts":[{"label":"A","text":"便于排查"},{"label":"B","text":"独立升级"},{"label":"C","text":"灵活选路"},{"label":"D","text":"负载均衡"}],"subs":[],"ans":"答案B　独立升级","al":{"考查点":"分层“独立升级”好处的理解（理解）。","解题思路":"快递公司换卡车、寄件人不受影响→某层内部技术更新不影响其他层，即“独立升级”。","逐项剖析":"A项“便于排查”是故障隔离的好处，不符“换新车”场景；B项内部升级不影响相邻层用户，正是独立升级，正确；C项“灵活选路”是路由功能；D项“负载均衡”是流量调度，均与题干场景无关。","易错警示":"分层三大好处（各司其职、独立升级、便于排查）要能对号场景：换设备=独立升级。","方法点拨":"“换XX不影响别人”类场景题＝考“独立升级”，直接锁定。"}},{"sec":"基础巩固","type":"判断","num":1,"text":"协议就是某两个人私下约定的暗号，无需统一标准。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"协议必须全网统一的辨析（理解）。","解题思路":"题干说“私下约定的暗号，无需统一标准”——协议恰要全网统一才能让异构设备互通，判“×”。","易错警示":"“暗号”只有两人懂，协议要“全世界都懂”，这是本质差别。","方法点拨":"判断题见“私下/无需统一”，对照“全网统一标准”原则判×。"}},{"sec":"基础巩固","type":"判断","num":2,"text":"网络接口层负责具体的物理传输，如网卡和线缆。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"网络接口层职责的识别（理解）。","解题思路":"最底层管物理传输：网卡、线缆、电信号——表述正确，判“√”。","方法点拨":"底层=干苦力（物理介质），上层=定规则（服务与格式）。"}},{"sec":"基础巩固","type":"判断","num":3,"text":"分层后，某一层出故障更容易被定位和排查。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"分层便于排查的好处（理解）。","解题思路":"职责独立使故障可逐层隔离定位——正是分层三大好处之一，判“√”。","方法点拨":"分层三好处回扣：各司其职、独立升级、便于排查。"}},{"sec":"能力提升","type":"提升","num":1,"text":"填写TCP/IP四层名称，并为每层写出一句职责说明（可参考教材例子）。","opts":[],"subs":[],"ans":"应用层——提供具体网络服务（如HTTP浏览网页）；传输层——保障端到端可靠传输（TCP/UDP）；网络层——负责寻址与路由（IP）；网络接口层——完成物理传输（网卡线缆）。","al":{"考查点":"四层名称与职责对应（识记+理解）。","解题思路":"逐层写：应用层管服务（HTTP）；传输层管可靠（TCP/UDP）；网络层管寻址路由（IP）；网络接口层管物理传输。","易错警示":"职责与层名错位是最常见的丢分点（如把IP写进应用层）。","方法点拨":"四层职责四词：服务、可靠、寻路、传输。"}},{"sec":"能力提升","type":"提升","num":2,"text":"用“公司部门分工”类比，解释什么是协议分层，并说明分层至少带来哪两点好处。","opts":[],"subs":[],"ans":"好比公司分研发、生产、销售，各部门只对接相邻环节、各管一摊；好处：各司其职减少混乱、某部门流程优化（独立升级）不影响其他部门、出问题易定位（便于排查）。","al":{"考查点":"分层思想的生活类比与好处（理解+表达）。","解题思路":"类比给“公司部门分工”，好处答两点以上：各司其职减少混乱、独立升级不影响他部门、出问题易定位。","易错警示":"只答类比不答好处、或好处与类比脱节，答案不完整。","方法点拨":"“类比+好处”题先建立部门对照（研发=应用、生产=传输…），再用部门语言复述三大好处。"}},{"sec":"能力提升","type":"提升","num":3,"text":"排序：将下列寄信过程按TCP/IP四层从上到下排序。A.写信内容并选择邮箱（应用） B.贴邮票交邮局确保送达（传输） C.邮局按地址选路线（网络） D.由汽车光纤等运送到目的地（接口）","opts":[],"subs":[],"ans":"A→B→C→D","al":{"考查点":"寄信过程与四层的排序（应用）。","解题思路":"按写信流程自上而下：写信选邮箱（应用）→贴票保送达（传输）→邮局选路线（网络）→交通工具运送（接口），得A→B→C→D。","易错警示":"“贴邮票交邮局确保送达”对应传输层的“可靠保证”，勿当网络层。","方法点拨":"排序题先给每个环节贴层标签，再按“高到低”排：服务→保障→选路→运输。"}},{"sec":"能力提升","type":"提升","num":4,"text":"运行netstat命令能看到本机很多连接。请说明：为什么观察这些连接能证明“协议正在工作”？","opts":[],"subs":[],"ans":"每条TCP/UDP连接都对应一个正在使用的网络协议（如网页用TCP、域名查询用UDP），能列出来就说明相关协议正在为具体应用服务，协议不是空概念。","al":{"考查点":"连接现象与协议概念的对应（理解+分析）。","解题思路":"每条连接背后都是一种协议在工作（网页=TCP、域名=UDP）：能列出连接=相关协议正在运行=协议是真实机制不是空概念。","易错警示":"别把“看到连接”答成“看到黑客”——实验目的是让抽象协议可观测。","方法点拨":"“现象证明概念”题答“对应+意义”：现象里有什么→证明什么在真实工作。"}},{"sec":"拓展挑战","type":"拓展","num":1,"text":"学校要开发一套“作业提交系统”，前端网页、后端服务、网络传输各由不同小组负责。请运用分层思想，说明三个小组应如何分工协作，并解释为什么这样设计便于后期维护。","opts":[],"subs":[],"ans":"按分层：前端（应用层）管界面与交互，后端（应用/传输）管数据处理与可靠送达，网络（网络/接口层）管寻址与物理连通；各组只对接约定接口、互不深究内部。便于维护：任一组升级（如换框架）不影响他组，故障也可逐层隔离定位。","al":{"考查点":"分层思想在系统开发中的综合应用（应用+评价）。","解题思路":"三组对应三层：前端=应用层（界面交互）、后端=应用/传输（数据处理与可靠）、网络=网络/接口（寻址连通）；协作靠约定接口。维护好处：任一组升级不影响他组、故障逐层隔离。","易错警示":"分工描述停在“各自写代码”而未映射到分层职责，缺“接口约定、互不深究”的关键。","方法点拨":"系统开发题把小组当“层”，强调两件事：层间只认接口、层内自由升级。"}},{"sec":"拓展挑战","type":"拓展","num":2,"text":"有人认为“所有功能放一层更简单，分层纯属多余”。请结合“独立升级”和“便于排查”两条好处反驳这一观点，并举一例。","opts":[],"subs":[],"ans":"反例：若不分层的老系统，换一种传输方式就要重写全部代码；分层后仅改传输层即可。又如网络卡顿，分层可逐层测（应用→传输→网络→接口）快速定位是哪层问题，混在一起则无从下手。","al":{"考查点":"对“分层多余”论的反驳（评价）。","解题思路":"用两条好处当论据+实例：不分层换传输方式要重写全部代码；分层后网络卡顿可按层逐测快速定位。","易错警示":"只喊“分层好”不给反例或实例，论证无力。","方法点拨":"反驳题公式：立观点（分层必要）→举反例（不分层的代价）→给证据（独立升级/便于排查实例）。"}},{"sec":"变式闯关","type":"变式","num":1,"text":"换场景：做一顿饭，洗菜、切菜、炒菜由不同人负责，每人只把成品交给下一位。这体现分层思想哪一点？若炒菜师傅请假，其他人能否直接顶上？说明分层与“独立”的关系。","opts":[],"subs":[],"ans":"体现“各司其职、通过标准接口交接”。炒菜师傅请假，洗菜切菜的人未必会炒——说明分层让各层独立、可单独替换，但也要求每层内部能力完整（独立升级或替换，但接口要对齐）。","al":{"考查点":"分层思想的跨场景迁移（应用）。","解题思路":"做饭分工体现“各司其职、标准交接”；炒菜师傅请假→他人未必会炒，说明分层“独立可替换”的另一面是“每层内部要有人顶得上、接口要对齐”。","易错警示":"此题有思辨深度：既要点出“独立可替换”好处，也要承认“替换需能力+接口对齐”，单答一面不完整。","方法点拨":"“谁能顶上”类变式题，答“独立≠随便顶”：层独立但能力与接口要匹配。"}},{"sec":"间隔复习","type":"间隔","num":1,"text":"上节课学了数据分包与存储转发。请说明：为什么说存储转发让网络具备多路径容错能力？","opts":[],"subs":[],"ans":"（第4课《数据分包灵活传》）　存储转发每到一个节点先收下再决定下一跳，配合多条路径，某节点或链路故障时可绕行其他路线送达，故具容错性。","al":{"考查点":"分层思想的场景化转译与概括（创造+应用）。","解题思路":"三层设计对应三种能力：场景对照考四层职责是否真懂（寄信/快递全程逐层对应）；抽层演示考“每层不可少”的理解（选一层说清罢工后果）；金句考提炼概括（短、准、可传播）。","易错警示":"场景对应张冠李戴（把可靠保障放网络层）、抽层只说“会乱”说不清具体影响，均失分。","方法点拨":"“设计展区互动”题＝把每个知识点变成一个“观众能动手验证”的动作：对照、抽层、带金句回家。"}},{"sec":"思维进阶","type":"挑战","num":1,"text":"你们小组要在科技节布置“网络分层”展区，需要一面能让观众一眼看懂“为什么要分层”的互动墙。请你设计这面墙：①画（或描述）一个“寄快递全程”的四层对照场景——从寄件人打包到快递员派送，各对应TCP/IP哪一层；②设计一个“抽掉一层会怎样”的演示：选其中一层说明如果它“罢工”，寄件和收件会出什么问题；③在墙脚写一句“分层金句”，用不超过15个字概括分层思想，让观众拍照带走。","opts":[],"subs":[],"open":true,"ans":"参考设计要点：①四层对照：应用层=寄件人写清\"寄给谁、寄什么\"（业务信息），传输层=快递公司承诺\"送达且弄丢必赔\"（可靠承诺），网络层=分拣中心规划\"走哪条路线到哪个城市\"（选路），网络接口层=卡车与司机实际把包裹运上路（物理搬运）；②抽掉一层演示：抽掉网络层——分拣中心罢工，包裹不知道该发往哪个城市，堆在原地永远到不了，说明\"没有选路，上层承诺与下层运输都白搭\"；③分层金句示例：\"各管一段，环环相扣\"或\"分工分层，联网共赢\"（不超15字即可）。","al":{"考查点":"开放创造：分层思想的类比表达（创造+理解）","解题思路":"类比要逐层对应且\"职责同名\"：每层的快递角色要干该层协议真实该干的事；\"抽层演示\"选一层讲透即可","易错警示":"层与层职责错位（如把\"打包写地址\"归到卡车层）是最大失分点；金句超字数扣分","方法点拨":"分层类比题先写\"每层干什么\"，再检查职责是否互不重叠又上下衔接。"}}]},{"t":"第 6 课 · 配套练习 · 建议用时15分钟","n":"数字身份辨设备","isExam":false,"qs":[{"sec":"回忆热身","type":"回忆","num":1,"text":"互联网上每台设备都有一个独一无二的数字标识，称为____地址。","opts":[],"subs":[],"ans":"IP","al":{"考查点":"IP地址概念的识记（识记）。","解题思路":"“每台设备独一无二的数字标识”→IP地址。","易错警示":"MAC也是唯一标识，但题干说“数字标识＋互联网上”语境指向可寻址的IP。","方法点拨":"IP=门牌号（可换），MAC=身份证号（出厂固定），先分清再做题。"}},{"sec":"回忆热身","type":"回忆","num":2,"text":"IPv4地址由四段十进制数组成，每段取值范围是0到____。","opts":[],"subs":[],"ans":"255","al":{"考查点":"IPv4每段取值范围（识记）。","解题思路":"IPv4每段是8位二进制，最大11111111即十进制255。","易错警示":"范围是0~255共256个值，勿写成255“个”。","方法点拨":"“8位二进制=0到255”这个换算记牢，合法性判断题全靠它。"}},{"sec":"基础巩固","type":"单选","num":1,"text":"用“门牌号”类比，IP地址的主要作用是：","opts":[{"label":"A","text":"给数据加密"},{"label":"B","text":"标识网络中的设备"},{"label":"C","text":"加快网速"},{"label":"D","text":"替代域名"}],"subs":[],"ans":"答案B　标识网络中的设备","al":{"考查点":"IP地址的定位作用（理解）。","解题思路":"“门牌号”类比指向定位功能：在网络中标识并找到某台设备。","逐项剖析":"A项加密是HTTPS/TLS的事，IP不加密；B项IP标识网络中的设备、供寻址定位，正确；C项网速由带宽决定，与IP无关；D项域名也要解析成IP，IP不替代域名而是被依赖。","易错警示":"“门牌号”的本意是“找得到”，别往加密/提速上联想。","方法点拨":"类比题抓住核心功能词：门牌=定位=寻址。"}},{"sec":"基础巩固","type":"单选","num":2,"text":"地址192.168.1.10中，前三段“192.168.1”通常表示：","opts":[{"label":"A","text":"主机号"},{"label":"B","text":"网络号（类似楼栋）"},{"label":"C","text":"子网掩码"},{"label":"D","text":"端口号"}],"subs":[],"ans":"答案B　网络号（类似楼栋）","al":{"考查点":"网络号与主机号的区分（理解）。","解题思路":"前段标识“在哪个网段”（楼栋），后段标识“哪台主机”（门牌），由子网掩码划分。","逐项剖析":"A项主机号是最后一段，前三段不是；B项前三段通常作网络号（类似楼栋），正确；C项子网掩码是划分工具不是地址本体；D项端口是传输层概念。","易错警示":"“通常”是关键：具体哪几段是网络号由子网掩码决定，普通局域网习惯前三段为网络号。","方法点拨":"IP结构口诀：前面找楼（网络号），后面敲门（主机号）。"}},{"sec":"基础巩固","type":"单选","num":3,"text":"相比IPv4，IPv6最大的优势是：","opts":[{"label":"A","text":"地址数量极其庞大"},{"label":"B","text":"每段只用0到9"},{"label":"C","text":"不再需要路由器"},{"label":"D","text":"地址会自动变短"}],"subs":[],"ans":"答案A　地址数量极其庞大","al":{"考查点":"IPv6的核心优势（理解）。","解题思路":"“最大优势”问两代地址的本质差异：IPv6地址空间指数级扩大。","逐项剖析":"A项约2的128次方个地址，数量极其庞大，正确；B项IPv6是十六进制含字母，并非只用0到9；C项IPv6仍需路由器；D项地址不会自动变短。","易错警示":"“每段只用0到9”是IPv4十进制特征，IPv6恰恰用十六进制含字母。","方法点拨":"记数字对比：IPv4约43亿（2的32次方）vs IPv6约2的128次方——“每粒沙子一个地址”是经典记忆锚点。"}},{"sec":"基础巩固","type":"单选","num":4,"text":"我国大力部署IPv6，重要意义之一是：","opts":[{"label":"A","text":"让电脑更便宜"},{"label":"B","text":"地址资源自主可控"},{"label":"C","text":"取消所有IPv4"},{"label":"D","text":"不再需要域名"}],"subs":[],"ans":"答案B　地址资源自主可控","al":{"考查点":"IPv6部署的战略意义（理解+国情素养）。","解题思路":"“重要意义之一”从国家层面找：掌握充足地址资源、减少对外依赖。","逐项剖析":"A项电脑价格与IP版本无关；B项大规模掌握地址资源实现自主可控，正确；C项“取消所有IPv4”不现实（长期共存过渡）；D项域名依然需要。","易错警示":"把“自主可控”只理解成“省钱”就浅了——它关乎网络主权与供应链安全。","方法点拨":"凡“我国大力部署X的意义”，优先答“自主可控、减少受制于人”，再补充具体好处。"}},{"sec":"基础巩固","type":"判断","num":1,"text":"IPv4地址由四段组成，每段可以是0到255之间的数。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"IPv4格式规则（识记）。","解题思路":"四段十进制、每段0~255——表述正确，判“√”。","方法点拨":"合法IPv4三要素：四段、点分、每段0-255。"}},{"sec":"基础巩固","type":"判断","num":2,"text":"因为IPv6地址太长，所以普通用户完全用不上、也没必要了解。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"IPv6与普通用户的关系（理解+辨析）。","解题思路":"题干说“太长所以完全用不上、没必要了解”——IPv6已规模部署且关系自主可控，人人都将接触，判“×”。","易错警示":"“用不上”是短视判断：未来物联网设备大多用IPv6，了解地址海量特征是数字素养。","方法点拨":"凡断言新技术“与我无关/没必要了解”，对照国家战略与未来趋势判×。"}},{"sec":"基础巩固","type":"判断","num":3,"text":"同一局域网内，两台电脑配置相同的IP地址也能正常互访。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"IP冲突的危害（理解+辨析）。","解题思路":"同一局域网IP必须唯一，相同会冲突致通信混乱——题干说“相同也能正常互访”，判“×”。","易错警示":"“IP唯一性”是组网铁律：冲突时两台都可能掉线。","方法点拨":"IP冲突判断题：同网段同IP=冲突=异常，凡说“也能正常”判×。"}},{"sec":"能力提升","type":"提升","num":1,"text":"写出你本机IPv4地址（或示例192.168.1.10），并说明“网络号+主机号”的含义。","opts":[],"subs":[],"ans":"示例192.168.1.10：网络号192.168.1标识所属网段（楼栋），主机号10标识本机（门牌）；子网掩码划分二者边界。","al":{"考查点":"本机IP结构与含义的落实（识记+理解）。","解题思路":"举例说明：网络号（192.168.1）标识网段、主机号（10）标识本机；子网掩码划定二者边界。","易错警示":"只说“前面是网络号”不解释“标识什么”，答题不完整。","方法点拨":"说明题给“两号各管什么+掩码做什么”三句即可得满分。"}},{"sec":"能力提升","type":"提升","num":2,"text":"对比IPv4与IPv6，填写三项：地址格式、地址数量、是否缓解枯竭。","opts":[],"subs":[],"ans":"IPv4——四段十进制、约43亿个、已枯竭不够用；IPv6——八组十六进制、约2的128次方个、彻底解决枯竭。","al":{"考查点":"IPv4与IPv6的三项对比（识记+理解）。","解题思路":"按表头三行填：格式（四段十进制vs八组十六进制）、数量（约43亿vs 2的128次方）、枯竭（已枯竭vs彻底解决）。","易错警示":"IPv6格式要写“八组十六进制”，写成“更多数字”不够准确。","方法点拨":"对比表题照抄维度逐格填，数字对比记死：43亿 vs 2的128次方。"}},{"sec":"能力提升","type":"提升","num":3,"text":"判一判：下列地址写法哪一个是合法的IPv4地址？A.256.1.1.1 B.192.168.0.1 C.2001:0DB8::1，并说明理由。","opts":[],"subs":[],"ans":"B合法。A中256超出0到255上限；C是IPv6格式而非IPv4；只有B四段均在0到255内且格式正确。","al":{"考查点":"IPv4合法性的判断（应用）。","解题思路":"逐项用规则检验：每段0~255、四段点分。A的256超上限非法；B四段合规合法；C带冒号是IPv6格式。","易错警示":"看到带字母或冒号的地址直接归IPv6，别硬套IPv4规则。","方法点拨":"合法性判定口诀：四段、点分、不超255——三条全过才合法。"}},{"sec":"能力提升","type":"提升","num":4,"text":"每台网卡还有出厂就固定的物理地址（MAC），它与IP地址有什么不同？请各用一句话说明。","opts":[],"subs":[],"ans":"IP是网络层可配置、随接入网络变化的逻辑地址（门牌）；MAC是烧录在网卡上、全球唯一的物理地址（身份证），一般不随网络改变。","al":{"考查点":"IP与MAC的区别（理解+辨析）。","解题思路":"各一句话：IP=网络层可配置、随网络变化的逻辑地址（门牌）；MAC=烧录网卡、全球唯一的物理地址（身份证）。","易错警示":"两者最易混：IP可换（换网络就变）、MAC不变（出厂固定）。","方法点拨":"铁律记忆：IP像门牌（搬家就变），MAC像身份证（终身不变）。"}},{"sec":"拓展挑战","type":"拓展","num":1,"text":"校园直播要用到摄像机、电脑、手机等几十台设备同时上网。请为网络管理员设计一套“设备寻址方案”：说明为什么不能都用同一个IP，以及如何用“网络号+主机号”给它们分组管理。","opts":[],"subs":[],"ans":"同一网段IP必须唯一，重复会冲突掉线，故不能共用。方案：用同一网络号（如192.168.1）表示“校园直播网”这一栋楼，主机号（.2摄像机、.3电脑）区分每台设备，便于统一寻址与管理，冲突时按主机号排查。","al":{"考查点":"IP编址在真实组网中的应用（应用+创造）。","解题思路":"方案三要点：为什么不能共用（冲突掉线）；怎么分组（统一网络号表示“直播网”楼栋）；主机号区分每台设备便于管理与排查。","易错警示":"只答“不能共用”不设计“网络号+主机号”分组方案，缺应用部分。","方法点拨":"“设备寻址方案”题按“问题→分组结构→管理收益”三层写，楼栋门牌类比贯穿始终。"}},{"sec":"拓展挑战","type":"拓展","num":2,"text":"有同学说“IPv4地址早分完了，我们家还能上网，说明IP地址没那么重要”。请结合IPv6与“自主可控”反驳他，并指出我国相关成就。","opts":[],"subs":[],"ans":"家用能上网多靠内网地址加NAT复用公网IP，并非“不缺”。IPv4枯竭是事实，正因如此我国大力推进IPv6规模部署并全球领先，掌握地址资源才自主可控、不被“卡脖子”。忽视IP重要性是误解。","al":{"考查点":"对“IP不重要”论的反驳（评价+国情）。","解题思路":"分三层驳：家能上网是NAT复用公网IP，并非不缺；IPv4枯竭是事实、IPv6是出路；我国IPv6全球领先，地址自主可控防“卡脖子”。","易错警示":"不点出“NAT复用”直接说“你错了”缺乏技术依据。","方法点拨":"反驳题先破误区（NAT让公网IP紧张不被察觉），再立事实（枯竭+部署），最后升价值（自主可控）。"}},{"sec":"变式闯关","type":"变式","num":1,"text":"换场景：小区每户有“栋号-门牌号”两级编号。若把整片小区所有住户只编一个总号（如1到一万），会带来什么麻烦？用“网络号+主机号”思想说明两级编号的好处。","opts":[],"subs":[],"ans":"只编总号则搬家或新增楼栋都要重排全部号码，混乱且难扩展。两级编号（网络号等于栋号，主机号等于门牌）让每栋内部独立编号、新增楼栋只加栋号，扩展灵活、定位清晰，正如IP的分段寻址。","al":{"考查点":"两级编址思想的迁移（应用）。","解题思路":"对比单总号（重排全乱、难扩展）与两级号（网络号=栋号、主机号=门牌，各栋独立编号、新增只加栋号）——好处是扩展灵活、定位清晰。","易错警示":"只答两级号“好”不对比单总号的麻烦，论证缺一半。","方法点拨":"“两级编号好处”题先立反例（单级全排）再立正例（分级扩展），对比即论证。"}},{"sec":"间隔复习","type":"间隔","num":1,"text":"上节课学了TCP/IP四层。其中负责“寻址与路由”的是哪一层？它和本课学的IP地址有什么关系？","opts":[],"subs":[],"ans":"（第5课《网络协议分层设》）　网络层负责寻址与路由；IP地址正是网络层用来标识设备、实现寻址的核心标识，路由器依据IP在网络层选路转发。","al":{"考查点":"IP编址思想与IPv6战略的展区化表达（创造+应用）。","解题思路":"三部件：类比卡要把“省市区门牌”与网络号主机号逐级对上并解释为什么分级不乱；找茬题要“会出题”（含一个非法地址且理由正确）；结语要钉住“数量庞大＋自主可控”两个关键词。","易错警示":"类比里门牌与段位错位、找茬题给的全是合法地址、结语漏“自主可控”，皆失分。","方法点拨":"“展区设计”题的本质是三重能力外化：用类比讲清原理、用出题检验规则、用口号升华意义。"}},{"sec":"思维进阶","type":"挑战","num":1,"text":"学校要办“数字世界地址展”，请你为展区设计一张“IP地址寻人启事对照卡”，帮观众用最直观的方式理解IP的编址思想。请写出：①用“省—市—区—街道—门牌”类比IP分段，说明 IPv4 地址 192.168.1.10 中哪几段相当于“省市区”（网络号）、哪段相当于“门牌”（主机号），为什么这样分段才能让亿万台设备不乱；②给观众出一道“找茬题”：列出 3 个地址让观众找出“非法的 IPv4 地址”并说清理由（可参考 256.1.1.1 这种）；③写一句“为什么我国要大力部署 IPv6”的展板结语，要点出“地址数量”与“自主可控”两个关键词。","opts":[],"subs":[],"open":true,"ans":"参考设计要点：①192.168.1.10 中前三段 192.168.1 相当于\"省市区\"（网络号，定位是哪个网络），末段 10 相当于\"门牌\"（主机号，定位网络里的哪台设备）；分段编址让路由器先按网络号找到网、再按主机号找到设备，层层缩小范围才不会乱；②找茬题示例：256.1.1.1（每段最大255，256非法）、192.168.1（只有三段，格式不完整）、10.0.0.999（末段超255）；③结语示例：\"IPv6 让每粒沙都有地址，更让网络命脉握在自己手中\"。","al":{"考查点":"开放创造：编址思想的类比与纠错（创造+理解）","解题思路":"类比题抓住\"分层定位\"思想：先网络后主机，逐级缩小；找茬题考格式规则——四段、点分、每段0-255","易错警示":"把主机号与网络号的位置说反；非法地址只写答案不说理由不给分","方法点拨":"编址题两步走：先类比定位思想，再用格式规则判合法。"}}]},{"t":"第 7 课 · 配套练习 · 建议用时15分钟","n":"域名解析换编码","isExam":false,"qs":[{"sec":"回忆热身","type":"回忆","num":1,"text":"人们记不住数字IP，于是给网站起好记的名字，这叫____。","opts":[],"subs":[],"ans":"域名","al":{"考查点":"域名概念的识记（识记+理解）。","解题思路":"“给网站起好记的名字”→域名（Domain Name），是IP的“人名版”。","易错警示":"域名≠网址：域名是名字，完整网址还含协议路径等。","方法点拨":"对子记：IP是门牌号（机器用），域名是名字（人用），DNS当翻译。"}},{"sec":"回忆热身","type":"回忆","num":2,"text":"把域名翻译成IP地址的系统，称为____（缩写）。","opts":[],"subs":[],"ans":"DNS（域名系统）","al":{"考查点":"DNS的识别（识记）。","解题思路":"“把域名翻译成IP的系统”→域名系统，缩写DNS（Domain Name System）。","易错警示":"缩写别写错：DNS不是“域名服务器”缩写错写，是域名系统。","方法点拨":"DNS三字对应三功能词：把名字（Domain）解析（Name→IP）成系统可用的地址（System）。"}},{"sec":"基础巩固","type":"单选","num":1,"text":"域名www.baidu.com中，“.com”属于：","opts":[{"label":"A","text":"根"},{"label":"B","text":"顶级域"},{"label":"C","text":"二级域"},{"label":"D","text":"主机名"}],"subs":[],"ans":"答案B　顶级域","al":{"考查点":"域名层级中顶级域的识别（识记）。","解题思路":"域名从右往左：最右一段是顶级域，.com标识商业类别。","逐项剖析":"A项“根”在顶级域之后（更右的隐式层级），不是.com本身；B项.com是最右的顶级域，正确；C项二级域是baidu.com中的baidu；D项主机名是最左的www。","易错警示":"“根”是域名体系最顶端（不显示），.com是顶级域——两者差一层。","方法点拨":"层级从右数：顶级域（.com/.cn）→二级域（baidu）→…→主机（www），最左最具体。"}},{"sec":"基础巩固","type":"单选","num":2,"text":"你在浏览器输入网址后，计算机首先会：","opts":[{"label":"A","text":"直接连到对方电脑"},{"label":"B","text":"向DNS查询该域名对应的IP"},{"label":"C","text":"播放动画"},{"label":"D","text":"关闭网卡"}],"subs":[],"ans":"答案B　向DNS查询该域名对应的IP","al":{"考查点":"浏览器访问前的DNS查询（理解）。","解题思路":"网络只认IP，输入域名后的第一步是查DNS得到对应IP才能通信。","逐项剖析":"A项“直接连对方电脑”无从谈起（不知道IP连谁）；B项向DNS查询域名对应IP，正确；C项播放动画无关；D项关闭网卡反而断网。","易错警示":"“输网址就打开”的直觉掩盖了背后的DNS解析——它每次访问都在发生。","方法点拨":"访问三步曲：输域名→DNS查IP→按IP通信；DNS查询永远在连接之前。"}},{"sec":"基础巩固","type":"单选","num":3,"text":"下列做法中，最能防范“假网站钓鱼”的是：","opts":[{"label":"A","text":"随便点陌生链接"},{"label":"B","text":"认准https锁标并核对域名一字不差"},{"label":"C","text":"把密码告诉客服"},{"label":"D","text":"用相同密码注册所有网站"}],"subs":[],"ans":"答案B　认准https锁标并核对域名一字不差","al":{"考查点":"防钓鱼的实操方法（应用+评价）。","解题思路":"“最能防范”要在“核对身份”上做文章：认准https锁标＋核对域名一字不差，双保险识别真伪。","逐项剖析":"A项随便点陌生链接是危险行为；B项认准https锁标并核对域名全称，正确；C项把密码告诉客服正中钓鱼圈套；D项相同密码所有网站＝撞库风险。","易错警示":"钓鱼站域名往往只差一个字母（baidu→ba1du），核对“一字不差”是关键动作。","方法点拨":"防钓鱼三查：查https锁标、查域名全称逐字核对、查来源（不点陌生链接）。"}},{"sec":"基础巩固","type":"单选","num":4,"text":"域名解析的层级顺序，正确的是：","opts":[{"label":"A","text":"主机→二级域→顶级域→根"},{"label":"B","text":"根→顶级域→二级域→主机"},{"label":"C","text":"顶级域→根→主机→二级域"},{"label":"D","text":"二级域→主机→根→顶级域"}],"subs":[],"ans":"答案B　根→顶级域→二级域→主机","al":{"考查点":"域名解析的层级顺序（识记）。","解题思路":"解析方向与书写相反：从右（根）往左（主机）逐级查询。","逐项剖析":"A项方向反了（主机最具体不该先查）；B项根→顶级域→二级域→主机，从粗到细，正确；C项顶级域与根顺序颠倒且中间乱序；D项以主机开头错误。","易错警示":"解析顺序与书写顺序相反——先查最“大”的根，再逐级缩小到主机。","方法点拨":"“从右往左、由粗到细”八字记住解析方向，顺序题直接过关。"}},{"sec":"基础巩固","type":"判断","num":1,"text":"域名和IP地址是一一对应的“名字与门牌”关系，方便人记忆。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"域名与IP的映射关系（理解）。","解题思路":"域名=给人记的名字，IP=机器用的门牌，DNS做对应——表述正确，判“√”。","方法点拨":"“名字与门牌”成对出现即指向DNS映射，判√。"}},{"sec":"基础巩固","type":"判断","num":2,"text":"只要能打开网页，就说明访问的一定是真实官网，无需核对。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"“能打开不等于真站”的安全观（理解+辨析）。","解题思路":"题干说“能打开就一定是官网无需核对”——DNS可能被劫持导向仿冒页，判“×”。","易错警示":"“打开成功”只说明能连上某个服务器，不说明连的是真官网。","方法点拨":"凡“能打开=可信”的表述，用“DNS劫持/仿冒页”反例判×。"}},{"sec":"基础巩固","type":"判断","num":3,"text":"我国参与建设的“雪人计划”有助于提升根服务器领域的自主可控能力。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"雪人计划的战略意义（识记+理解）。","解题思路":"雪人计划推进IPv6根服务器建设，减少对他国根服务的依赖——表述正确，判“√”。","方法点拨":"“根服务器+自主可控”是我国网络主权话题的固定组合。"}},{"sec":"能力提升","type":"提升","num":1,"text":"写出域名 mail.163.com 的层级拆分（从顶级域到主机），并说明DNS解析大致流程。","opts":[],"subs":[],"ans":"顶级域.com→二级域163.com→主机mail。流程：浏览器发请求→本地DNS查缓存→无则逐级向上（根→顶级域→二级域）查询→得到IP返回。","al":{"考查点":"域名层级拆分与解析流程（识记+理解）。","解题思路":"从右往左拆：顶级域.com→二级域163.com→主机mail；流程按“本地查缓存→无则逐级向上查根→顶级→二级→返回IP”。","易错警示":"拆分方向写反（从主机开始拆）是最常见错误。","方法点拨":"拆域名永远从右边第一段开始数，解析流程记“先缓存、后逐级”。"}},{"sec":"能力提升","type":"提升","num":2,"text":"连线：把下列域名片段与其层级连线。A..cn——①主机名；B.baidu.com——②顶级域；C.www——③二级域。","opts":[],"subs":[],"ans":"A—②；B—③；C—①","al":{"考查点":"域名片段与层级的连线（识记）。","解题思路":"按位置定性：.cn最右=顶级域②；baidu.com整体是二级域③（baidu是二级、com是顶级）；www最左=主机名①。","易错警示":"baidu.com 选项在二级域位置：它是“二级域.baidu”与顶级域组成的域，层级上属二级域，别当顶级域。","方法点拨":"层级看“位置”不看“长短”：右一顶级、右二二级、最左主机。"}},{"sec":"能力提升","type":"提升","num":3,"text":"小明用ping www.baidu.com查到IP后，直接把IP输进浏览器也能访问。这说明域名和IP是什么关系？为什么平时我们更愿用域名？","opts":[],"subs":[],"ans":"二者指向同一台服务器（映射关系），IP能直接访问；但域名好记好传播，人脑记名字比记数字容易，故日常用域名。","al":{"考查点":"域名与IP映射本质的理解（理解+分析）。","解题思路":"两层答：二者指向同一台服务器（IP直接可访问=映射成立）；人脑记名字比记数字容易，故日常用域名。","易错警示":"只说“IP也能访问”不断言“指向同一服务器（映射）”，丢失核心结论。","方法点拨":"“为什么用域名”题两句话：本质（映射同源）＋理由（好记好传播）。"}},{"sec":"能力提升","type":"提升","num":4,"text":"排错：小红输入“www.baidu.com”却被带到一个仿冒页。请结合DNS安全，写出她应立即做的两个动作。","opts":[],"subs":[],"ans":"①立刻关闭页面、不输入任何账号密码；②核对地址栏域名是否一字不差、是否有https锁标；并向平台举报。","al":{"考查点":"DNS安全事件的应急动作（应用）。","解题思路":"两个立即动作：①停止输入任何信息（关闭页面）；②核对域名是否一字不差＋看https锁标，再向平台举报。","易错警示":"只写“别输入密码”而不教“怎么核对真假”，防范动作不完整。","方法点拨":"应急动作排序：先止损（关页面）→再核验（域名+锁）→后举报，三步成链。"}},{"sec":"拓展挑战","type":"拓展","num":1,"text":"班级要办“校园网页展”，打算申请域名campus.school.cn。请设计一份“域名方案”：说明各级域名含义、解析需经过哪些服务器，并提醒同学访问时如何防钓鱼。","opts":[],"subs":[],"ans":"方案：顶级域.cn（中国）→二级域school.cn（学校）→主机campus（班级站）。解析经根→.cn→school.cn逐级得IP。防钓鱼：访问时核对全称campus.school.cn、确认https锁标、不点短链接，发现仿冒立即举报。","al":{"考查点":"域名方案的综合设计（应用+创造）。","解题思路":"方案四件套：各级域名含义（campus主机/school二级/cn顶级）→解析路径（根→.cn→school.cn）→防钓鱼提醒（核对全称+https锁标+不点短链+举报）。","易错警示":"域名含义说不全（漏主机名）、解析路径写反方向，都会扣分。","方法点拨":"“申请域名方案”题按“命名含义→解析链→安全提醒”三段设计，命名要能讲出每级含义。"}},{"sec":"拓展挑战","type":"拓展","num":2,"text":"有人认为“有了域名就不需要IP了”。请从“机器只认数字地址”和“DNS可能被劫持”两个角度，分析这种说法错在哪，并给出正确使用习惯。","opts":[],"subs":[],"ans":"错因：①网络传输最终仍靠IP寻址，域名只是别名，离不开IP；②依赖DNS解析就有被劫持风险，不能盲目信任域名。习惯：记官网域名、访问核对https与完整域名、重要操作前确认真实IP或官方渠道。","al":{"考查点":"对“有了域名不要IP”的反驳（评价）。","解题思路":"两个角度驳：①机器寻址最终靠IP，域名只是别名；②依赖DNS就有被劫持风险，不能盲信域名。再给正确习惯（记官网域名、核对https与完整域名、重要操作确认真实来源）。","易错警示":"只驳“离不开IP”不驳“DNS有风险”，漏一个角度。","方法点拨":"“从两个角度分析错在哪”题：题干给了角度就逐一展开，每个角度=原理+一句反证。"}},{"sec":"变式闯关","type":"变式","num":1,"text":"换场景：手机通讯录里“妈妈”对应真实号码138开头。这和网络中“域名对应IP”有何相似？若通讯录被恶意篡改把“妈妈”指向骗子号，类比网络中发生了什么？应如何防范？","opts":[],"subs":[],"ans":"相似：名字到真实号码的映射，正如域名到IP。篡改通讯录对应“DNS劫持或欺骗”，会把你引向错误对象。防范：核对真实号码（如回拨确认）、不轻信改名、重要转账前电话核实，类比上网核对域名与https。","al":{"考查点":"域名映射与DNS安全的通讯录类比（应用）。","解题思路":"映射相似：通讯录“妈妈→138…”如“域名→IP”；篡改通讯录=DNS劫持/欺骗。防范类比：核对真实号码（回拨）、不轻信改名，如上网核对域名与https。","易错警示":"只类比“名字映射”而不类比“被篡改后的风险与防范”，迁移只做了一半。","方法点拨":"安全类变式题务必走完“相似→风险→防范”三步，防范要对号现实动作。"}},{"sec":"间隔复习","type":"间隔","num":1,"text":"上节课学了IP地址。请说明：域名和IP地址分别“给谁看”，以及为什么上网既要用域名也要用IP？","opts":[],"subs":[],"ans":"（第6课《数字身份辨设备》）　域名给人看（好记），IP给机器看（用于寻址通信）；人用域名方便记忆，机器靠IP定位传输，DNS把二者对应起来，缺一不可。","al":{"考查点":"域名设计、解析流程与防钓鱼的综合创造（创造+应用）。","解题思路":"三任务三层能力：自拟域名要“能讲出每级含义”（主机/二级/顶级三级齐）；流程图要把“输入域名→DNS查IP→按IP访问”链路画完整；防钓鱼提示要点出“核对全称+能打开≠可信（劫持）”两个安全观念。","易错警示":"域名缺级或含义讲不出、流程图漏DNS角色、提示只写“小心骗子”无具体核对动作，均失分。","方法点拨":"“域名规划师”任务=命名（层级对）＋讲流程（环节全）＋教安全（动作实），三块合一是本课能力的完整体检。"}},{"sec":"思维进阶","type":"挑战","num":1,"text":"学校要给班级网站申请一个专属域名，网络中心让你当“域名规划师”。请完成三件事：①为“七年级3班科技作品展”网站设计一个域名（须含主机名、二级域、顶级域三级，写在横线上并标注每级含义）；②画（或文字描述）一张“你输入域名后发生了什么”的解析小流程图，标出浏览器、DNS服务器、IP地址三个角色；③写一句“防钓鱼提示”贴在网站入口：既要教大家核对域名全称，又要说明为什么不能只认“能打开”。","opts":[],"subs":[],"open":true,"ans":"参考设计要点：①域名示例：class3.tech.school.edu.cn——class3 为主机名（三班网站），tech/school 为二级域（科技展/学校），edu.cn 为顶级域（中国教育）；②解析流程：浏览器输入域名→先问 DNS 服务器\"这个域名对应哪个IP\"→DNS 返回 IP 地址→浏览器再按 IP 访问网站服务器；③防钓鱼提示：\"看清域名每一个字符再输密码——假站点常把字母换成形近字；能打开不等于真官网，认全称才是硬道理\"。","al":{"考查点":"开放创造：域名结构与解析流程的综合运用（创造+应用）","解题思路":"域名设计须三级齐全并逐级标注；流程图三角色缺一不可；防钓鱼提示要同时覆盖\"核对全称\"和\"能打开≠真\"两个要点","易错警示":"把顶级域与二级域的位置写反；流程图漏掉\"DNS 返回 IP\"这一步","方法点拨":"域名题按\"起名—解析—防骗\"三问递进，每问都落到具体字符或箭头。"}}]},{"t":"第 8 课 · 配套练习 · 建议用时15分钟","n":"路由路径靠算法","isExam":false,"qs":[{"sec":"回忆热身","type":"回忆","num":1,"text":"网络中的“路口警察+导航员”，负责连接不同网络并选择转发路径的设备叫____。","opts":[],"subs":[],"ans":"路由器","al":{"考查点":"路由器设备功能的识记（识记+理解）。","解题思路":"“路口警察+导航员、连接不同网络并选择转发路径”→路由器。","易错警示":"交换机也在组网中，但它管“局部内分流”，跨网络选路才是路由器的招牌。","方法点拨":"角色区分：交换机=小区物业（楼内分流），路由器=城市交警（网间引路）。"}},{"sec":"回忆热身","type":"回忆","num":2,"text":"路由器转发数据包时，依据的“地图”叫做____表。","opts":[],"subs":[],"ans":"路由（路由表）","al":{"考查点":"路由表的识记（识记+理解）。","解题思路":"“转发数据包依据的‘地图’”=路由表（记录目的网络与下一跳）。","易错警示":"路由表≠域名表：路由表记“去哪个网走哪条路”，域名表记“名字对应哪个IP”。","方法点拨":"路由表一句话：目的网络→下一跳，查表决定包往哪送。"}},{"sec":"基础巩固","type":"单选","num":1,"text":"路由器与交换机的主要区别，下列说法较贴切的是：","opts":[{"label":"A","text":"交换机只在楼内分岔，路由器在网间引路"},{"label":"B","text":"路由器不能连外网"},{"label":"C","text":"交换机负责选路"},{"label":"D","text":"二者完全一样"}],"subs":[],"ans":"答案A　交换机只在楼内分岔，路由器在网间引路","al":{"考查点":"路由器与交换机的区别（理解）。","解题思路":"从工作范围区分：交换机在局部网络内做分流，路由器在不同网络之间选择路径。","逐项剖析":"A项交换机只在楼内分岔、路由器在网间引路，正确；B项路由器恰恰常用于连外网；C项选路是路由器的职责不是交换机的；D项“完全一样”否认二者分工。","易错警示":"家用“路由器”常集成了交换机功能，但概念上两者工作层次不同。","方法点拨":"记忆锚：交换机认MAC在局域网分流，路由器认IP跨网络选路。"}},{"sec":"基础巩固","type":"单选","num":2,"text":"路由表的作用是记录：","opts":[{"label":"A","text":"每个用户的密码"},{"label":"B","text":"目的网络与下一跳的对应关系"},{"label":"C","text":"网页内容"},{"label":"D","text":"域名和IP的映射"}],"subs":[],"ans":"答案B　目的网络与下一跳的对应关系","al":{"考查点":"路由表记录的内容（理解）。","解题思路":"“路由器每到一个节点查表决定下一步”表里存的正是“目的网络→下一跳”对应关系。","逐项剖析":"A项密码是安全信息不入路由表；B项目标网络与下一跳对应关系，正确；C项网页内容属应用数据；D项域名IP映射是DNS的表。","易错警示":"“路由表”与“DNS缓存表”都会答串：一个管“去哪条路”，一个管“名字→号码”。","方法点拨":"看见“决定下一跳/往哪送”就锁定路由表。"}},{"sec":"基础巩固","type":"单选","num":3,"text":"用tracert追踪时，输出中偶尔出现“*”表示：","opts":[{"label":"A","text":"网络彻底断了"},{"label":"B","text":"该节点不响应请求（正常现象）"},{"label":"C","text":"目的地错误"},{"label":"D","text":"命令输错"}],"subs":[],"ans":"答案B　该节点不响应请求（正常现象）","al":{"考查点":"tracert输出中星号的含义（理解+分析）。","解题思路":"“*”=该节点未响应探测（出于安全策略或配置），属正常现象，不代表链路断。","逐项剖析":"A项“网络彻底断”若真断则后续节点也无法到达；B项节点不响应属正常，正确；C项目的地错误会显示超时或失败而非个别星号；D项命令输错不会出现路径输出。","易错警示":"把“*”当故障会误判网络状态——星号常只是对方“沉默”。","方法点拨":"星号判读口诀：个别星号正常（对方不应答），全链星号才是真断。"}},{"sec":"基础巩固","type":"单选","num":4,"text":"我国推进核心路由设备国产化，主要意义在于：","opts":[{"label":"A","text":"让路由器更轻"},{"label":"B","text":"保障网络主权与自主可控"},{"label":"C","text":"取消互联网"},{"label":"D","text":"减少网页数量"}],"subs":[],"ans":"答案B　保障网络主权与自主可控","al":{"考查点":"核心路由设备国产化的意义（理解+国情素养）。","解题思路":"“主要意义”落在国家层面：关键设备自主可控、保障网络主权。","逐项剖析":"A项设备轻重无关；B项保障网络主权与自主可控、防“卡脖子”，正确；C项“取消互联网”荒谬；D项减少网页数量无关。","易错警示":"勿把“国产化”理解成“便宜/好用”——它首先是安全与主权的战略考量。","方法点拨":"“核心设备国产化意义”标准答案：自主可控、防受制于人、保国家安全。"}},{"sec":"基础巩固","type":"判断","num":1,"text":"路由器每次转发只决定“下一跳”，不需要知道全程路径。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"逐跳转发的思想（理解+辨析）。","解题思路":"路由器只查表选“下一跳”，路径由沿途接力完成——表述与逐跳转发机制一致，判“√”。","方法点拨":"“只决定下一跳、不管全程”是路由金句，出现即√。"}},{"sec":"基础巩固","type":"判断","num":2,"text":"tracert命令能看到数据从本机到目标经过的每一个中转节点。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"tracert的路径追踪功能（理解）。","解题思路":"tracert逐跳记录IP与耗时，能看到经过的每个中转节点——表述正确，判“√”。","方法点拨":"tracert=透明地看数据跳过的每一步，命令输出即路径清单。"}},{"sec":"基础巩固","type":"判断","num":3,"text":"路由选择完全随机，和导航软件“择优”没有关系。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"路由选择的择优机制（理解+辨析）。","解题思路":"题干说“完全随机”——路由器按路由表比较路径（距离/拥堵）择优，与导航一致，判“×”。","易错警示":"“择优”是路由的核心：虽然具体算法各异，但绝不是随机。","方法点拨":"凡“路由随机/瞎选”表述，对照“比较择优”判×。"}},{"sec":"能力提升","type":"提升","num":1,"text":"简述路由器的工作过程：数据每到一个路由器，它做了什么？为什么叫“逐跳转发”？","opts":[],"subs":[],"ans":"路由器收到包后查路由表，找到“目的网络→下一跳”，把包发给下一站；沿途每台路由器都重复这一动作，数据一跳跳逼近目标，故称逐跳转发。","al":{"考查点":"路由器工作过程与逐跳转发（理解+表达）。","解题思路":"过程三步：收到包→查路由表找“目的网络→下一跳”→发给下一站；沿途每台重复此动作，一跳跳逼近目标，故称逐跳。","易错警示":"把“查路由表”写成“查域名”或漏掉“发给下一跳”动作，机制讲不清。","方法点拨":"“逐跳”解释模板：每站只做三件事（收、查表、发下一跳），接力到终点。"}},{"sec":"能力提升","type":"提升","num":2,"text":"排序：把下列“城市快递中转”步骤按路由思想排序。A.到达中转站查中转表 B.选下一座城市发出 C.包裹从发货城出发 D.最终抵达收货城","opts":[],"subs":[],"ans":"C→A→B→（循环至）D，即：发货→到站查表→选下一跳→……→抵达。","al":{"考查点":"快递中转与路由思想的排序（应用）。","解题思路":"按流程：包裹从发货城出发（C）→到中转站查表（A）→选下一城发出（B）→循环至最终抵达（D）。","易错警示":"“查表”必须在“发出”之前——先查后发是路由铁序。","方法点拨":"排序题找因果链：先有货出门、到站查表、按表发车，循环至终点。"}},{"sec":"能力提升","type":"提升","num":3,"text":"用导航软件选路类比，说明路由器“比较+择优”的路由思想，并举一个“遇到堵车换路”的对应情形。","opts":[],"subs":[],"ans":"导航按距离或拥堵给多条路线并推荐最优；路由器同样比较各路径代价择优转发。对应：某链路拥堵时，路由器按路由表改走通畅路径，正如导航避开堵车路段。","al":{"考查点":"导航类比理解动态择优（理解+表达）。","解题思路":"类比两条腿：导航给多条路线推荐最优＝路由器比较各路径代价择优；堵车换路＝链路拥堵时路由表更新改走通畅路径。","易错警示":"只类比“选最优路”不举“堵车换路”的对应情形，动态路由部分缺失。","方法点拨":"“导航类比”题答两层：平时择优（静态）+堵车改道（动态），对应路由表与更新机制。"}},{"sec":"能力提升","type":"提升","num":4,"text":"为什么教材说“路由器只决定下一跳，不管全程”？请结合第5课“分层各司其职”的思想解释。","opts":[],"subs":[],"ans":"分层思想下每层只管自己一段：路由器属网络层，只负责把包送到“下一跳”，后续由下一台路由器继续，不必也不应知道全程——各司其职、通过接口协作。","al":{"考查点":"跨课联结分层与路由思想（理解+分析）。","解题思路":"用第5课分层思想解释：路由器属网络层只管“送到下一跳”，后续由下一台接力——各层/各设备各司其职、通过标准接口协作，不必知道全程。","易错警示":"单独复述“路由器只送下一跳”而不引分层“各司其职”视角，跨课联结不到位。","方法点拨":"“结合第X课思想解释”题：先引那课的核心观点，再套到本题机制上。"}},{"sec":"拓展挑战","type":"拓展","num":1,"text":"校园运动会直播，视频要从操场摄像机传到教学楼大屏，中间经过三台路由器。请设计“选路方案”：说明每台路由器依据什么决定下一跳，以及当某条链路临时拥堵时如何保证不中断。","opts":[],"subs":[],"ans":"每台路由器按本地路由表查“目的网络→下一跳”把包发往下一站，三台接力送达。拥堵时：路由表动态更新，路由器改选通畅链路（类似导航绕开堵车），数据包绕行其他路径，故不中断。","al":{"考查点":"路由决策与容错在直播场景的应用（应用+创造）。","解题思路":"方案：每台路由器按本地路由表“目的网络→下一跳”转发、三台接力；拥堵时路由表动态更新改选通畅链路（绕行），故不中断。","易错警示":"只写“三台接力”不写“路由表动态更新/绕行”的容错机制，方案不完整。","方法点拨":"“选路方案”题＝转发机制（查表接力）＋容错机制（动态绕行）两段，缺一不可。"}},{"sec":"拓展挑战","type":"拓展","num":2,"text":"有厂商主张“全部用国外路由器更便宜”。请从“自主可控”和“路由表关乎数据走向”两个角度，写一段给学校采购的建议。","opts":[],"subs":[],"ans":"建议：核心路由设备宜优先国产。理由：①路由表决定数据走向，关键设备受制于人会带来安全与主权风险；②自主可控才能在网络故障时自主排障、不被“卡脖子”。便宜是短期账，安全自主是长期账，学校网络关系教学数据，应重自主可控。","al":{"考查点":"采购决策中的自主可控论证（评价+国情）。","解题思路":"建议国产，两理由：①路由表决定数据走向，设备受制于人=数据走向与安全受制于人；②自主可控才能自主排障不被卡脖子。用“短期账vs长期账”收束。","易错警示":"只喊“支持国产”不落到“路由表决定数据走向”这一技术要害，论证空泛。","方法点拨":"采购论证题走“技术要害→主权风险→长期账”三段，技术细节是说服力来源。"}},{"sec":"变式闯关","type":"变式","num":1,"text":"换场景：快递从北京到广州，途中武汉中转站暴雨停运。快递公司改经郑州中转仍送达。这体现路由的什么思想？若所有包裹都只能走武汉一条线会怎样？","opts":[],"subs":[],"ans":"体现“查表选下一跳加多路径择优或容错”的路由思想。若只有武汉一条线，则武汉停运全网中断，正如网络缺少冗余路径会单点故障——多路径是健壮性的关键。","al":{"考查点":"路由容错思想的场景迁移（应用）。","解题思路":"武汉停运改郑州=多路径择优/容错；若只有武汉一条线则全网中断=单点故障——多路径是网络健壮性关键。","易错警示":"漏掉“只有一条线会怎样”的反面推演，对比论证不完整。","方法点拨":"“改道仍送达”题答两半：能绕行（多路径优势）＋不能绕（单点故障代价），正反对照最有力。"}},{"sec":"间隔复习","type":"间隔","num":1,"text":"上节课学了域名解析。当浏览器拿到IP后，数据要跨网络送达对方，这中间由什么设备负责“选路”？它靠什么表决定下一跳？","opts":[],"subs":[],"ans":"（第7课《域名解析换编码》）　由路由器负责跨网络选路转发；它靠路由表（记录“目的网络→下一跳”）决定每一跳的下一站。","al":{"考查点":"逐跳转发与多路径容错的游戏化转译（创造+应用）。","解题思路":"游戏三部件对应三个考点：接力规则要让“每人只按卡上下一跳传递”重现查表机制；突发状况要演示“绕行不中断”并点出多路径容错；总结要落到“路不止一条所以不怕坏”。","易错警示":"若设计成“队长知道全程指挥队员”就违背逐跳思想——必须让每个队员只看自己那张卡。","方法点拨":"“把机制做成游戏”的诀窍：机制的每个关键点都要变成一条可执行的游戏规则，玩一遍=亲历一遍原理。"}},{"sec":"思维进阶","type":"挑战","num":1,"text":"学校想把“数据如何跨网络送达”做成一个“快递中转接力赛”的操场游戏，让低年级同学跑着体会“逐跳转发”。请你设计这个游戏：①写出比赛规则——队员如何扮演路由器、每人拿到什么“路由卡”（卡片上应写什么信息）、数据包怎么一步步传到终点；②设计一个“突发状况”环节（如某队员临时离场/某条“路线”封闭），说明裁判如何临时改规则让数据包仍能绕行送达——并点出这模拟了网络的什么能力；③给游戏起一个名字，并写一句赛后总结告诉小队员“互联网为什么不怕一条路坏掉”。","opts":[],"subs":[],"open":true,"ans":"参考设计要点：①规则：每名队员扮一台路由器，手持\"路由卡\"（写有：本机地址+一张\"目的地→下一跳\"对照表）；\"数据包\"（信封）从起点出发，每到一站由队员查路由卡决定交给哪位\"下一跳\"，逐站接力直至终点；②突发状况：某队员临时离场即\"该路由器宕机\"，裁判宣布\"邻近队员在卡上补写绕行表项\"，数据包改走其他队员接力送达——这模拟了路由算法的动态选路（自我恢复）能力；③游戏名示例\"逐跳接力·使命必达\"；总结句：\"互联网不怕一条路坏掉，因为每个路口都备着别的走法\"。","al":{"考查点":"开放创造：逐跳转发与动态路由的情境设计（创造+应用）","解题思路":"路由卡必须含\"目的地→下一跳\"信息，这是逐跳转发的心脏；突发环节要落到\"换路仍可达\"并点出是路由的自愈能力","易错警示":"把游戏设计成\"一人直达终点\"就没有逐跳；绕行环节不写\"路由卡如何更新\"则机制不完整","方法点拨":"设计类题自查三问：角色干什么？信息在谁手里？突发后靠什么恢复？"}}]},{"t":"第 9 课 · 配套练习 · 建议用时15分钟","n":"数据传输有新意","isExam":false,"qs":[{"sec":"回忆热身","type":"回忆","num":1,"text":"IP地址用来找到设备，而____用来在设备上找到具体的应用程序。","opts":[],"subs":[],"ans":"端口","al":{"考查点":"端口作用的识记（识记+理解）。","解题思路":"IP找到设备后，由“端口”进一步找到设备上的具体应用（如80网页、443安全网页）。","易错警示":"端口不是设备编号，是“设备内部的应用编号”。","方法点拨":"寻址两段式：IP找楼（设备），端口找房间（应用）——缺一不可。"}},{"sec":"回忆热身","type":"回忆","num":2,"text":"传输层中，像“挂号信”一样可靠、会确认重传的协议是____。","opts":[],"subs":[],"ans":"TCP","al":{"考查点":"TCP协议特性的识记（识记+理解）。","解题思路":"“像挂号信一样可靠、会确认重传”→TCP（Transmission Control Protocol）。","易错警示":"UDP不可靠；可靠的是TCP，别写反。","方法点拨":"TCP三关键词：连接、确认、重传——挂号信式服务。"}},{"sec":"基础巩固","type":"单选","num":1,"text":"关于TCP与UDP，下列说法正确的是：","opts":[{"label":"A","text":"TCP不可靠、UDP可靠"},{"label":"B","text":"TCP可靠但慢，UDP高效但可能丢包"},{"label":"C","text":"两者完全一样"},{"label":"D","text":"UDP只用于网页"}],"subs":[],"ans":"答案B　TCP可靠但慢，UDP高效但可能丢包","al":{"考查点":"TCP与UDP特性的对比（理解）。","解题思路":"核心权衡：TCP可靠但慢（要握手确认重传），UDP高效但可能丢包（不确认不重传）。","逐项剖析":"A项说反了（TCP可靠、UDP不可靠），错误；B项TCP可靠但慢、UDP高效但可能丢包，正确；C项“完全一样”无视设计差异；D项UDP不只用于网页（直播语音都用）。","易错警示":"最易错的是把可靠与高效记反——TCP认“可靠”、UDP认“高效”是铁律。","方法点拨":"对子记忆：TCP=可靠慢（挂号信），UDP=高效险（明信片）。"}},{"sec":"基础巩固","type":"单选","num":2,"text":"看运动会直播画面偶尔模糊但从不卡顿，最可能因为使用了：","opts":[{"label":"A","text":"TCP"},{"label":"B","text":"UDP"},{"label":"C","text":"IP"},{"label":"D","text":"DNS"}],"subs":[],"ans":"答案B　UDP","al":{"考查点":"按场景选协议（应用）。","解题思路":"直播要求实时流畅，“偶尔模糊但不卡”正说明容许丢帧→UDP。","逐项剖析":"A项TCP重传会造成卡顿，与“从不卡顿”矛盾；B项UDP不重传、丢帧保流畅，正确；C项IP是网络层不涉及传输选择；D项DNS是应用层服务。","易错警示":"看到“宁糊勿卡”立即联想UDP——这是教材的经典判定信号。","方法点拨":"选协议口诀：要完整找TCP，要实时找UDP；“直播/语音/游戏位置”归UDP。"}},{"sec":"基础巩固","type":"单选","num":3,"text":"下列应用中，应当选用TCP的是：","opts":[{"label":"A","text":"在线视频直播"},{"label":"B","text":"网络电话语音"},{"label":"C","text":"下载重要文件"},{"label":"D","text":"竞技游戏实时位置"}],"subs":[],"ans":"答案C　下载重要文件","al":{"考查点":"可靠传输场景的选择（应用）。","解题思路":"“下载重要文件”要求完整无误→TCP的确认重传保证不丢不错。","逐项剖析":"A项直播重实时用UDP；B项语音同样重实时；C项文件下载容不得半点缺失，TCP最合适，正确；D项游戏实时位置用UDP。","易错警示":"“重要文件”是可靠需求最强的信号词，直接锁TCP。","方法点拨":"应用归类：下载/网页/网银/邮件=TCP（要完整）；直播/语音/游戏=UDP（要实时）。"}},{"sec":"基础巩固","type":"单选","num":4,"text":"端口的作用是：","opts":[{"label":"A","text":"给设备编IP"},{"label":"B","text":"在同一设备上区分不同应用"},{"label":"C","text":"加快DNS"},{"label":"D","text":"替代路由器"}],"subs":[],"ans":"答案B　在同一设备上区分不同应用","al":{"考查点":"端口的作用（理解）。","解题思路":"端口用于在一台设备上区分不同应用——IP+端口才是精确寻址。","逐项剖析":"A项编IP是DHCP/配置的事；B项同一设备上区分不同应用（80网页、443安全网页），正确；C项DNS加速与端口无关；D项路由器选路在网间。","易错警示":"光答“端口是数字”不答“区分应用”就丢了作用本质。","方法点拨":"记忆链：IP=楼栋，端口=房间号，地址=IP+端口才能把数据送到具体“应用房间”。"}},{"sec":"基础巩固","type":"判断","num":1,"text":"视频直播宁“糊”勿“卡”，所以适合用UDP而非TCP。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"直播用UDP的判断（理解）。","解题思路":"“宁糊勿卡”=容许丢帧保流畅=UDP特性——表述正确，判“√”。","方法点拨":"直播/实时场景配UDP，判断题见“宁糊勿卡”即√。"}},{"sec":"基础巩固","type":"判断","num":2,"text":"端口号是固定的，用户不能也无法理解其含义。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"端口号的约定俗成（理解+辨析）。","解题思路":"题干说“端口固定、用户无法理解其含义”——常见端口是约定俗成的服务号（80网页、443安全、53域名），理解它有助寻址，判“×”。","易错警示":"“固定”不准确：端口有约定的默认值，但用户也可配置理解。","方法点拨":"三个知名端口背熟：80网页、443安全、53域名，判断题就靠它们。"}},{"sec":"基础巩固","type":"判断","num":3,"text":"可靠与高效可以两全，TCP和UDP没有取舍必要。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"可靠与高效的权衡（理解+辨析）。","解题思路":"“可靠高效可以两全，无取舍必要”违背设计权衡：TCP可靠必有开销、UDP高效必冒丢包风险，判“×”。","易错警示":"“又要快又可靠”是外行愿望；工程师必须在两者间按需求取舍。","方法点拨":"凡“可以两全/不必取舍”说法，回扣“权衡”本质判×。"}},{"sec":"能力提升","type":"提升","num":1,"text":"填写TCP与UDP对比表：可靠性、是否有确认重传、典型应用（各一例）。","opts":[],"subs":[],"ans":"TCP——可靠、有握手确认与重传、用于文件下载或网页或网银；UDP——不可靠、无确认重传、用于直播或语音或游戏。","al":{"考查点":"TCP与UDP对比表（识记+理解）。","解题思路":"三行对照：可靠性（可靠vs不可靠）、确认重传（有vs无）、典型应用（下载/网页/网银vs直播/语音/游戏）。","易错警示":"把“网页”塞给UDP、把“直播”塞给TCP即典型错位。","方法点拨":"对比表用“要完整→TCP、要实时→UDP”当判定尺逐格填写。"}},{"sec":"能力提升","type":"提升","num":2,"text":"场景配对：把应用与合适协议连线。A.网银转账——①TCP；B.视频会议——②UDP；C.软件下载——①TCP；D.手机语音——②UDP。","opts":[],"subs":[],"ans":"A—①；B—②；C—①；D—②","al":{"考查点":"应用与协议的配对（应用）。","解题思路":"按需求配对：转账/下载要完整→TCP①；视频会议/语音要实时→UDP②。","易错警示":"网银与视频会议放反是高频错——完整（转账）vs实时（会议）要分清。","方法点拨":"配对题先给每个应用贴标签“完整型/实时型”，标签决定协议。"}},{"sec":"能力提升","type":"提升","num":3,"text":"解释“IP+端口=精确寻址”：为什么光有IP还不够，还要端口？","opts":[],"subs":[],"ans":"IP只能把数据送到某台设备，而一台设备同时跑多个程序；端口指明交给其中哪一个应用（如网页还是邮件），二者结合才能精确投递。","al":{"考查点":"IP+端口的精确寻址理解（理解+表达）。","解题思路":"两层答：IP把数据送到设备，但设备同时跑多个程序；端口指明交给哪个应用，二者结合才精确投递。","易错警示":"只答“端口是编号”不解释“为什么光有IP不够”（多应用并发），逻辑断。","方法点拨":"“为什么还不够”题＝点出“一台设备多个程序同时跑”这一前提。"}},{"sec":"能力提升","type":"提升","num":4,"text":"排序：将TCP“可靠传输”的关键步骤排序。A.三次握手建立连接 B.发送数据并等待确认 C.收到确认继续、未收到则重传 D.传输完毕断开连接","opts":[],"subs":[],"ans":"A→B→C→D","al":{"考查点":"TCP可靠传输的流程排序（理解）。","解题思路":"按可靠机制时序：先三次握手建连接（A）→发数据等确认（B）→收确认继续/未收重传（C）→传完断开（D）。","易错警示":"“握手”必须在发数据前——连接都没建好谈不上可靠传输。","方法点拨":"TCP四拍：握手→发送→确认/重传→断开，像挂号信从寄到签收的全流程。"}},{"sec":"拓展挑战","type":"拓展","num":1,"text":"校园直播既要画面流畅（用UDP），又要聊天区不丢消息（需可靠）。请设计一套“传输方案”：说明直播视频和聊天消息分别用什么协议，并解释这样组合如何兼顾流畅与可靠。","opts":[],"subs":[],"ans":"视频流用UDP：容许少量丢帧保实时不卡；聊天消息用TCP：确保每条发言完整到达不丢失。组合后，画面流畅、文字可靠，按“可靠与效率”权衡为不同数据选不同协议。","al":{"考查点":"双需求场景的协议组合设计（应用+创造）。","解题思路":"设计按数据分类：视频流走UDP（丢帧保流畅）、聊天走TCP（每条必达）；再说明组合兼顾“流畅与可靠”。","易错警示":"两路都选TCP（画面会卡）或都选UDP（聊天丢字），组合设计失败。","方法点拨":"“组合方案”题先把数据分类贴标签，再逐类选协议，最后一句总结“各取所需”。"}},{"sec":"拓展挑战","type":"拓展","num":2,"text":"有同学说“以后网络一定又快又稳，TCP和UDP会合并成一个”。请结合“可靠与效率的权衡”评价这种说法，并指出QUIC等新协议是怎么做的。","opts":[],"subs":[],"ans":"评价：纯粹“又快又稳无代价”不现实，可靠必带开销、高效必冒风险，二者本质是权衡。QUIC（HTTP/3）并非简单合并，而是在UDP基础上加入可靠与加密机制，按需取二者之长，而非消除权衡。","al":{"考查点":"对协议合并论的评价（评价+前沿联结）。","解题思路":"评价：又快又稳无代价不现实，可靠必带开销、高效必冒风险。举QUIC为例：它在UDP上加入可靠与加密机制，取二者之长而非消除权衡。","易错警示":"只说“会合并”或“不会合并”不给原理（权衡）与例证（QUIC），论证空。","方法点拨":"前沿辨析题＝立原理（权衡不可避免）＋举实例（QUIC怎么做）＋下结论（非合并是取长）。"}},{"sec":"变式闯关","type":"变式","num":1,"text":"换场景：你用对讲机喊话（说完不等对方确认，可能漏听）和寄挂号信（签收确认）分别像哪种协议？若用对讲机指挥手术、用挂号信聊闲天，会出现什么问题？","opts":[],"subs":[],"ans":"对讲机不等确认像UDP，挂号信签收确认像TCP。用UDP指挥手术可能漏指令出事故；用TCP闲聊则慢且浪费——说明必须按“在乎可靠还是及时”来选协议。","al":{"考查点":"协议特性的对讲机类比（应用）。","解题思路":"对讲机（不等确认、可能漏听）=UDP；挂号信（签收确认）=TCP。反例推演：UDP指挥手术会漏指令出事、TCP闲聊慢且浪费→必须按“在乎可靠还是及时”选协议。","易错警示":"漏掉“错误场景推演”（手术用UDP会怎样），场景迁移不完整。","方法点拨":"类比题走“配对→推演→结论”三步，推演环节用极端例子最能说明权衡。"}},{"sec":"间隔复习","type":"间隔","num":1,"text":"上节课学了路由器逐跳转发。请说明：路由器决定“下一跳”依靠什么表？这种“只看下一站”的思想和第几课的分层思想相通？","opts":[],"subs":[],"ans":"（第8课《路由路径靠算法》）　依靠路由表（目的网络→下一跳）；“只管自己一段、通过接口协作”与第5课协议分层的“各司其职、每层只见邻居”思想相通。","al":{"考查点":"TCP/UDP权衡的多场景决策（创造+评价）。","解题思路":"方案三步走：先给三路数据逐一贴“完整型/实时型”标签并选协议；取舍环节要立规则（实时类可降质、完整类绝不丢）再应用到“带宽减半”场景；一句话总结要说到“可靠带开销、实时冒风险”的权衡本质。","易错警示":"存档录像若答“用UDP无所谓”就漏了“完整性”标签；取舍只说“都保”没有优先级，均失分。","方法点拨":"“多数据多需求”传输题＝给每类数据写需求清单，按“宁可丢什么、不可丢什么”排出优先级，协议与取舍自然清晰。"}},{"sec":"思维进阶","type":"挑战","num":1,"text":"学校电视台要直播运动会，同时要在聊天区让观众发弹幕，还要把全程录像完整存档。作为技术顾问，请你设计一份《三路数据的传输方案》：①分别说明“直播画面、弹幕文字、存档录像”各该用TCP还是UDP，并各写一句理由；②设计一个“网络变差实验”：如果带宽突然只有原来一半，三路数据中哪一路会最先被牺牲画质、哪一路绝不能丢——说明你的取舍逻辑；③用一句话向台长解释“为什么可靠和实时不能全都要”。","opts":[],"subs":[],"open":true,"ans":"参考设计要点：①直播画面用 UDP——要实时流畅，偶尔掉帧可接受；弹幕文字用 UDP 亦可（低时延优先，丢一条无碍）或 TCP（要确保每条都送达，言之成理即可）；存档录像用 TCP——文件必须完整无缺，宁可慢不可错；②带宽减半实验：最先牺牲画质的是直播画面（降码率保流畅），绝不能丢的是存档录像（完整性第一，可用缓冲换时间）；取舍逻辑=按\"实时性 vs 完整性\"的业务需求分配；③一句话：\"可靠靠重传会延迟，实时靠直冲会丢包，鱼与熊掌按业务取舍\"。","al":{"考查点":"开放创造：TCP/UDP 选型的综合决策（创造+评价）","解题思路":"选型三问：丢得起吗？等得起吗？错得起吗？——直播丢帧不起、录像错不起；实验环节要写出\"牺牲谁、保住谁\"及理由","易错警示":"把 TCP 说成\"更快\"是方向性错误；取舍题只答结论不给业务理由扣一半","方法点拨":"传输协议题万能框架：丢得起选UDP，错不起选TCP，再按场景排序取舍。"}}]},{"t":"第 10 课 · 配套练习 · 建议用时15分钟","n":"综合所学建网络","isExam":false,"qs":[{"sec":"回忆热身","type":"回忆","num":1,"text":"组建小型网络的标准四步是：选设备、定连接、配____、测连通。","opts":[],"subs":[],"ans":"参数（IP参数/网络参数）","al":{"考查点":"组网标准四步的识记（识记）。","解题思路":"四步链：选设备→定连接→配参数→测连通，题干已有三步，缺“配参数（IP参数）”。","易错警示":"“配参数”易被忽略——光连线不配IP是新手最常见的失败原因。","方法点拨":"四步口诀：选、连、配、测，像装新家：买家具、摆位置、设门牌、试开门。"}},{"sec":"回忆热身","type":"回忆","num":2,"text":"网络不通时，可按“三查法”排查：先查线，再查IP，最后查____。","opts":[],"subs":[],"ans":"协议","al":{"考查点":"三查法的识记（识记）。","解题思路":"三查顺序：查线→查IP→查协议，题干已有两项，缺“协议”。","易错警示":"三查法与组网四步别混：四步是建网流程，三查是排障顺序。","方法点拨":"排障三查口诀：由表及里——线（物理）、IP（地址）、协议（规则）。"}},{"sec":"基础巩固","type":"单选","num":1,"text":"运动会直播需要无线接入和多机位，组网时除计算机外还应选配：","opts":[{"label":"A","text":"只加长网线"},{"label":"B","text":"路由器、交换机和无线AP"},{"label":"C","text":"只换大显示器"},{"label":"D","text":"删除所有设备"}],"subs":[],"ans":"答案B　路由器、交换机和无线AP","al":{"考查点":"无线组网的设备选型（应用）。","解题思路":"“无线接入+多机位”决定必须配无线与汇聚设备：路由器引路、交换机分流、无线AP覆盖。","逐项剖析":"A项只加长网线解决不了无线接入；B项路由器、交换机、无线AP协同，正确；C项大显示器无关网络；D项删除设备更不可能。","易错警示":"别漏“无线AP”——只有交换机路由器无法让手机无线接入。","方法点拨":"“要无线+多设备”场景设备三件套：路由器（出口）+交换机（汇聚）+AP（无线）。"}},{"sec":"基础巩固","type":"单选","num":2,"text":"两台电脑连不通，首先应执行“三查法”的哪一步？","opts":[{"label":"A","text":"直接重装系统"},{"label":"B","text":"查线（检查网线或连接）"},{"label":"C","text":"立刻换IP"},{"label":"D","text":"关掉防火墙全部"}],"subs":[],"ans":"答案B　查线（检查网线或连接）","al":{"考查点":"三查法的第一步（理解）。","解题思路":"“先查物理连接”是三查法第一环：线都没接好无从谈通信。","逐项剖析":"A项重装系统是最后手段；B项查线（网线/连接）最先，正确；C项立刻换IP是配置层、应在查线后；D项关防火墙属协议层且“全部关闭”危险。","易错警示":"排查顺序不能跳：先物理后逻辑，由表及里。","方法点拨":"三查顺序记牢：线→IP→协议；答“第一步”永远选“查线”。"}},{"sec":"基础巩固","type":"单选","num":3,"text":"给组内设备配置IP时，最应避开的错误是：","opts":[{"label":"A","text":"使用同一网络号"},{"label":"B","text":"两台设备IP相同造成冲突"},{"label":"C","text":"设置子网掩码"},{"label":"D","text":"记录IP地址"}],"subs":[],"ans":"答案B　两台设备IP相同造成冲突","al":{"考查点":"IP配置的最大忌讳（理解）。","解题思路":"“最应避开的错误”→同网段IP重复（冲突）是配置大忌。","逐项剖析":"A项用同一网络号是正常的（同网段就该相同网络号）；B项两台设备IP相同造成冲突，正确；C项设置子网掩码是必须步骤；D项记录IP是好习惯。","易错警示":"“同网络号”正常、“同主机号（全IP相同）”冲突——一字之差天壤之别。","方法点拨":"IP铁律：同一局域网内完整IP必须唯一；重复=冲突=双双掉线。"}},{"sec":"基础巩固","type":"单选","num":4,"text":"下列做法中，符合“安全组网”的是：","opts":[{"label":"A","text":"Wi-Fi不设密码"},{"label":"B","text":"默认管理员密码不修改"},{"label":"C","text":"设置强密码并控制访问权限"},{"label":"D","text":"把管理账号告诉所有人"}],"subs":[],"ans":"答案C　设置强密码并控制访问权限","al":{"考查点":"安全组网的做法（理解+评价）。","解题思路":"“符合安全组网”→设强密码+控制访问权限，防蹭网与非法接入。","逐项剖析":"A项Wi-Fi不设密码门户大开；B项默认密码不修改极易被破解；C项强密码+访问控制，正确；D项把管理账号告诉所有人等于放弃管理。","易错警示":"默认密码是路由器最薄弱的门——改密码是安全组网第一动作。","方法点拨":"安全组网三件套：强密码、关默认、控权限。"}},{"sec":"基础巩固","type":"判断","num":1,"text":"组网四步中，“测连通”通常用ping命令验证设备能否互访。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"ping用于测连通（识记+理解）。","解题思路":"ping是最常用的连通测试命令，能验证设备是否互通——表述正确，判“√”。","方法点拨":"组网四步“测连通”标配工具就是ping。"}},{"sec":"基础巩固","type":"判断","num":2,"text":"只要设备都连上网线，就一定不需要配置IP也能通信。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"连线与配置的关系（理解+辨析）。","解题思路":"题干“连上线就一定能通信，无需配置”——同网段还需正确唯一的IP与掩码才能寻址，判“×”。","易错警示":"“光连线不配置”是新手幻觉；IP配置是通信寻址的前提。","方法点拨":"凡“连上就能通”说法，回扣“配参数”环节判×。"}},{"sec":"基础巩固","type":"判断","num":3,"text":"无线AP的作用之一是为设备提供无线接入能力。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"无线AP的功能（识记+理解）。","解题思路":"AP（接入点）把有线转无线覆盖，让无线设备接入——表述正确，判“√”。","方法点拨":"AP=无线接入点：有线的“翻译官”，无线设备的“入场券”。"}},{"sec":"能力提升","type":"提升","num":1,"text":"写出组网四步，并各用一句话说明每一步要做什么。","opts":[],"subs":[],"ans":"选设备——按需求挑路由器、交换机、AP等；定连接——按拓扑（多为星型）连好线缆；配参数——给设备设正确唯一的IP与子网掩码；测连通——用ping验证互访。","al":{"考查点":"组网四步的具体做法（识记+应用）。","解题思路":"四步各一句：选设备（按需挑路由器/交换机/AP）；定连接（多为星型连好线）；配参数（设唯一IP与掩码）；测连通（ping验证）。","易错警示":"把“配参数”与“测连通”顺序写反——不配好IP无从ping通。","方法点拨":"四步答题每步“做什么+用什么”，例：测连通=ping，落到具体命令更专业。"}},{"sec":"能力提升","type":"提升","num":2,"text":"画（或描述）一个“校园直播小型网络”的星型拓扑：列出至少4种设备及其连接关系。","opts":[],"subs":[],"ans":"中心交换机连路由器、摄像头、电脑、无线AP；AP再连手机等无线设备。所有终端经交换机汇聚，路由器引出上网。呈星型：中心节点为交换机。","al":{"考查点":"星型拓扑的设备与连接（应用）。","解题思路":"中心是交换机：连路由器（引外网）、摄像头、电脑、无线AP；AP再连无线设备。描述“中心节点+汇聚+引出”即星型。","易错警示":"把路由器放中心、交换机当出口，拓扑就画反了——交换机才是局域网汇聚中心。","方法点拨":"星型拓扑图：画个交换机在中间，四周辐射终端，路由器从交换机引向外部。"}},{"sec":"能力提升","type":"提升","num":3,"text":"故障排查：两台电脑IP分别为192.168.1.10和192.168.1.10，互相ping不通。请用三查法说明问题在哪、怎么修。","opts":[],"subs":[],"ans":"问题在“查IP”这步：两台IP完全相同，构成IP冲突。修复：把其中一台改为主机号不同的地址（如192.168.1.11），保证同网段唯一后重试ping。","al":{"考查点":"IP冲突的诊断与修复（应用）。","解题思路":"用三查法定位：两台IP完全相同→问题在“查IP”环节（IP冲突）；修复：改其中一台主机号为不同值（192.168.1.11）后重ping。","易错警示":"修复要说“改主机号保持唯一”，只写“换个IP”不够精确。","方法点拨":"同IP不通=冲突题答题链：定位（查IP步）→原因（相同冲突）→修复（改主机号唯一）→验证（重ping）。"}},{"sec":"能力提升","type":"提升","num":4,"text":"安全填空式简答：组网后为什么要“设置密码”和“访问控制”？各写一条理由。","opts":[],"subs":[],"ans":"设密码——防止陌生人蹭网或非法接入，保护带宽与数据安全；访问控制——限定谁能连、能访问什么，降低内部风险，符合责任共担的安全原则。","al":{"考查点":"密码与访问控制的安全理由（理解）。","解题思路":"两条各一句：设密码防陌生人蹭网非法接入、护带宽数据；访问控制限定谁能连能访问什么，降低内部风险。","易错警示":"理由写“怕被偷网速”太窄——要提到带宽、数据、非法接入与责任共担。","方法点拨":"安全措施题按“防外部（密码）＋控内部（权限）”两个方向各给一条。"}},{"sec":"拓展挑战","type":"拓展","num":1,"text":"学校委托你班为运动会搭建直播网络。请写一份简易《直播网络设计方案书》框架：包含需求、设备清单、拓扑、IP规划、测试与安全措施六项，并各写一句要点。","opts":[],"subs":[],"ans":"①需求：多机位无线直播到校大屏；②设备：路由器加交换机加AP加摄像头加电脑；③拓扑：以交换机为中心的星型；④IP：统一网络号192.168.1，主机号逐台分配且唯一；⑤测试：ping通组内设备；⑥安全：强密码加访问控制。","al":{"考查点":"直播网络设计方案的六要素（应用+创造）。","解题思路":"六项各写一句要点：需求（多机位无线直播到大屏）；设备（路由器+交换机+AP+摄像头+电脑）；拓扑（以交换机为中心星型）；IP（统一网络号、主机号唯一）；测试（ping）；安全（强密码+访问控制）。","易错警示":"六项漏写任何一项都会在“框架完整性”上失分。","方法点拨":"“设计方案书”题＝把本单元知识装进六个固定格子里，每格一句话，先框架后细节。"}},{"sec":"拓展挑战","type":"拓展","num":2,"text":"直播前一小时，大屏突然黑屏无信号。作为“项目总工”，请用三查法制定排查步骤，并说明若确认是协议层问题（如直播软件端口被挡）应如何处置。","opts":[],"subs":[],"ans":"先查线（线缆、电源、接口是否松），再查IP（设备IP是否冲突或掉线），最后查协议（直播软件端口、服务是否正常）。若为协议层：开放对应端口（如视频端口）、检查防火墙与软件设置，必要时重启服务后重新推流。","al":{"考查点":"直播故障的三查法应急（分析+应用）。","解题思路":"按序排查：查线（线缆电源接口）→查IP（冲突掉线）→查协议（直播端口被挡）；若协议层问题：开放端口、查防火墙与软件设置、重启服务重推流。","易错警示":"跳过前两步直奔协议、或协议层处置只说“重启电脑”，排查不专业。","方法点拨":"应急排查按三查逐层推进，处置要对症“层”（线→物理、IP→地址、协议→端口防火墙）。"}},{"sec":"变式闯关","type":"变式","num":1,"text":"换场景：家里要组“智能家庭小网络”连摄像头和手机。请用四步法说明怎么搭，并指出和校园直播组网相比，家里更可能缺哪种设备、为什么？","opts":[],"subs":[],"ans":"四步：选（光猫或路由器，若需无线则多数路由器自带AP）、连（摄像头连路由器Wi-Fi）、配（设内网IP）、测（手机ping摄像头）。相比校园：家里通常不需独立交换机与大量AP，设备少、覆盖小；但若大户型死角仍需加AP或子路由。","al":{"考查点":"组网四步的居家迁移（应用）。","解题思路":"四步套用：选（光猫/路由器，多数自带AP）→连（摄像头连Wi-Fi）→配（内网IP）→测（手机ping摄像头）；对比校园：家用通常不需独立交换机与多AP，设备少覆盖小。","易错警示":"漏对比（“家里缺什么设备、为什么”）就少了本变式的题眼。","方法点拨":"迁移题套四步框架，再用“规模差异”作答对比：设备少→无需独立汇聚与多AP。"}},{"sec":"间隔复习","type":"间隔","num":1,"text":"上节课我们学了域名解析。请说明：组网时设备用IP互相ping通了，为什么普通用户访问网站仍习惯输入域名？DNS在这一过程中起什么作用？","opts":[],"subs":[],"ans":"（第7课《域名解析换编码》）　IP难记，域名好记，用户习惯用名字；DNS把输入的域名解析成IP，设备才得以按IP寻址通信，域名只是方便人的“别名”。","al":{"考查点":"组网四步的真实项目化应用（创造+应用）。","解题思路":"三任务分别对应四步的后三步＋综合：设备清单要解释“为什么需要无线接入”（移动终端离不开AP）；IP规划要分区给号并点出“唯一性”铁律；验收标准要用ping并写明达标结果（连通、丢包为0）。","易错警示":"设备清单漏无线汇聚设备、IP规划全区同一个号不分区、验收只写“能上网”不用ping，都不到位。","方法点拨":"“组网工程师”任务＝按四步框架出方案：选型说理由、规划讲分区、验收定标准，把工程思维走完整。"}},{"sec":"思维进阶","type":"挑战","num":1,"text":"学校要给美术教室新装一套“无线数字画展系统”——十几台平板同时展示学生画作，还要让参观者扫码在自己的手机上查看。请你担任组网工程师，完成三件事：①列出你的设备选型清单（至少4种，含无线接入与网络汇聚设备），并说明为什么需要“无线接入”这一环；②画出IP规划表：说明会用哪个网段（如192.168.1.x），给“平板展示区、教师管理机、访客Wi-Fi”三类设备各规划一个主机号范围，并强调一条绝不可违反的规则；③写一句“网络验收标准”：用什么命令、达到什么结果才算组网成功。","opts":[],"subs":[],"open":true,"ans":"参考设计要点：①清单：无线接入点AP（平板与访客连接）、交换机（汇聚有线设备）、路由器（连接外网与分配地址）、平板电脑（展示终端）+网线若干；需要\"无线接入\"是因为平板与手机扫码访问都无法拉线，移动终端必须无线入网；②IP规划：网段192.168.1.x——平板区192.168.1.101~150、教师管理机192.168.1.2~10、访客Wi-Fi192.168.2.x（独立网段隔离）；不可违反规则：同一网段内主机号绝不能重复，否则地址冲突双方都掉线；③验收标准：\"在任一台平板上 ping 教师机及网关全部连通（延时稳定无丢包），且访客与内网管理段隔离有效，即组网成功\"。","al":{"考查点":"开放创造：组网方案的综合设计（创造+应用）","解题思路":"设备清单按\"接入—汇聚—出口—终端\"配齐；IP规划体现\"分区管理+隔离访客\"思想；验收标准要落到具体命令与可观测结果","易错警示":"清单漏AP或交换机；规划表不给范围只给单个IP；验收只写\"能上网\"不具体","方法点拨":"组网题四件套：选型+拓扑+地址规划+验收标准，逐项给分。"}}]},{"t":"达标检测","n":"第二单元 直播网络我来建 · 达标检测卷","isExam":true,"qs":[{"sec":"选择题","type":"选择题","num":1,"text":"数据在网中传输常采用分包方式，其主要优势不包括：","opts":[{"label":"A","text":"灵活选择路径"},{"label":"B","text":"单包丢失只需重传该包"},{"label":"C","text":"把文件变大以便发送"},{"label":"D","text":"均衡网络负载"}],"subs":[],"ans":"答案C　把文件变大以便发送","al":{"考查点":"分包优势的辨析（理解）。","解题思路":"题干问“优势不包括”——找出不属于分包优势的说法。","逐项剖析":"A项灵活选择路径是优势；B项单包丢失只重传该包是优势；C项“把文件变大以便发送”荒谬（分包不增加数据总量），不是优势，正确；D项均衡负载是优势。","易错警示":"“分包把文件变大”是经典误解——拆包只是把大象装进小冰箱分次搬。","方法点拨":"“不包括/错误的是”题逐项核验，凡违背原理（如变大笑话）即所选。"}},{"sec":"选择题","type":"选择题","num":2,"text":"关于TCP/IP四层，负责“寻址与路由”的是：","opts":[{"label":"A","text":"应用层"},{"label":"B","text":"传输层"},{"label":"C","text":"网络层"},{"label":"D","text":"网络接口层"}],"subs":[],"ans":"答案C　网络层","al":{"考查点":"TCP/IP四层职责（识记）。","解题思路":"“寻址与路由”是网络层（IP）的职责。","逐项剖析":"A项应用层管服务；B项传输层管可靠；C项网络层由IP负责寻址与路由，正确；D项网络接口层管物理。","方法点拨":"四层职责四词对号：服务/可靠/寻路/传输。"}},{"sec":"选择题","type":"选择题","num":3,"text":"IPv6相比IPv4最大的改进是：","opts":[{"label":"A","text":"地址数量极其庞大"},{"label":"B","text":"每段只用0到9"},{"label":"C","text":"不再需要路由器"},{"label":"D","text":"地址自动缩短"}],"subs":[],"ans":"答案A　地址数量极其庞大","al":{"考查点":"IPv6核心改进（识记）。","解题思路":"IPv6最大改进是地址空间极大扩展。","逐项剖析":"A项约2的128次方地址、足以给每粒沙子编址，正确；B项IPv6用十六进制含字母；C项仍需路由器；D项地址不缩短。","方法点拨":"IPv4≈43亿 vs IPv6≈2的128次方，数字对比即答案。"}},{"sec":"选择题","type":"选择题","num":4,"text":"域名www.tsinghua.edu.cn中，“.cn”属于：","opts":[{"label":"A","text":"主机名"},{"label":"B","text":"二级域"},{"label":"C","text":"顶级域"},{"label":"D","text":"根"}],"subs":[],"ans":"答案C　顶级域","al":{"考查点":"域名层级识别（识记）。","解题思路":".cn在最右=顶级域；edu.cn中edu是二级域。","逐项剖析":"A项主机名是最左的www；B项二级域是edu；C项.cn为顶级域，正确；D项根在更右不显示。","方法点拨":"从右往左数层级：顶级→二级→…→主机。"}},{"sec":"选择题","type":"选择题","num":5,"text":"视频直播流畅优先、容许偶尔模糊，传输层宜选用：","opts":[{"label":"A","text":"TCP"},{"label":"B","text":"UDP"},{"label":"C","text":"IP"},{"label":"D","text":"DNS"}],"subs":[],"ans":"答案B　UDP","al":{"考查点":"直播场景协议选择（应用）。","解题思路":"“流畅优先、容许模糊”→实时型→UDP。","逐项剖析":"A项TCP重传会卡；B项UDP保流畅，正确；C项IP网络层；D项DNS应用服务。","方法点拨":"见“直播/流畅/实时”即锁UDP。"}},{"sec":"选择题","type":"选择题","num":6,"text":"组建小型网络时，连接好线缆后下一步通常应：","opts":[{"label":"A","text":"直接上网不用配"},{"label":"B","text":"配置IP等网络参数"},{"label":"C","text":"拆除路由器"},{"label":"D","text":"关闭所有设备"}],"subs":[],"ans":"答案B　配置IP等网络参数","al":{"考查点":"组网四步的衔接（识记）。","解题思路":"连线后下一步是“配参数”（IP等），之后才测连通。","逐项剖析":"B项配置IP等网络参数，正确；其余（不配/拆路由/关机）荒谬。","方法点拨":"四步顺序：选→连→配→测，连线之后必配置。"}},{"sec":"判断题","type":"判断题","num":1,"text":"存储转发是指中间节点先把数据包存下再转发给下一站。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"存储转发定义（识记+理解）。","解题思路":"“先存下再转发”正是存储转发的准确含义——表述正确，判“√”。","方法点拨":"存储转发=先缓存后转送，是容错与多路径的基础。"}},{"sec":"判断题","type":"判断题","num":2,"text":"协议只是两个人私下约定的暗号，不需全网统一。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"协议的全局统一性（理解+辨析）。","解题思路":"协议须全网统一，私下暗号无法互通异构设备——判“×”。","方法点拨":"协议=共同语言，必须全网统一。"}},{"sec":"判断题","type":"判断题","num":3,"text":"同一局域网内两台电脑配置相同IP也能正常互访。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"IP冲突的危害（理解+辨析）。","解题思路":"同网段IP必须唯一，相同会造成通信混乱——判“×”。","方法点拨":"IP唯一性是组网铁律。"}},{"sec":"判断题","type":"判断题","num":4,"text":"路由器转发数据时只决定“下一跳”，不需知道全程路径。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"逐跳转发思想（理解）。","解题思路":"路由器只选下一跳、路径接力完成——表述正确，判“√”。","方法点拨":"“只决定下一跳”是路由金句。"}},{"sec":"判断题","type":"判断题","num":5,"text":"组网只要把所有设备用网线连上，就一定能相互通信，无需配置。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"连线与配置的关系（理解+辨析）。","解题思路":"光连线不配置无法寻址通信——还需唯一IP与掩码，判“×”。","方法点拨":"连上≠能通，配参数不可省。"}},{"sec":"填空题","type":"填空题","num":1,"text":"数据分包后，接收端需要按序____才能还原原文件。","opts":[],"subs":[],"ans":"重组","al":{"考查点":"分包传输术语识记。","解题思路":"接收端把分片按序拼回=重组。","方法点拨":"三环节：分包（源）、存储转发（途）、重组（终）。"}},{"sec":"填空题","type":"填空题","num":2,"text":"TCP/IP四层中，负责具体网络服务（如HTTP）的是____层。","opts":[],"subs":[],"ans":"应用","al":{"考查点":"四层职责识记。","解题思路":"HTTP等服务在应用层工作。"}},{"sec":"填空题","type":"填空题","num":3,"text":"IPv4地址每段取值范围是0到____。","opts":[],"subs":[],"ans":"255","al":{"考查点":"IPv4段取值范围识记。","解题思路":"每段8位二进制=0到255。"}},{"sec":"填空题","type":"填空题","num":4,"text":"把域名翻译成IP地址的系统缩写为____。","opts":[],"subs":[],"ans":"DNS","al":{"考查点":"DNS缩写识记。","解题思路":"域名系统DNS把域名译成IP。"}},{"sec":"填空题","type":"填空题","num":5,"text":"路由器转发依据“目的网络→____”的路由表。","opts":[],"subs":[],"ans":"下一跳","al":{"考查点":"路由表结构识记。","解题思路":"路由表记录“目的网络→下一跳”。"}},{"sec":"填空题","type":"填空题","num":6,"text":"网络不通时可用“查线、查IP、查____”的三查法排查。","opts":[],"subs":[],"ans":"协议","al":{"考查点":"三查法顺序识记。","解题思路":"查线→查IP→查协议，末环是“协议”。"}},{"sec":"简答题","type":"简答题","num":1,"text":"用“快递分箱”类比，说明数据分包传输的三个优势（8分）。","opts":[],"subs":[],"ans":"分包如快递分箱：①灵活——各箱可走不同路线送达；②容错——某箱丢失只补发该箱，不必整批重来；③均衡——多箱分摊到不同运输线，避免一条线拥堵（每点约2到3分）。","al":{"考查点":"分包优势的类比复述（理解+表达，8分）。","解题思路":"用快递分箱展开三个优势：灵活（各箱走不同路线）、容错（丢一箱只补一箱）、均衡（多线分摊防拥堵）。","易错警示":"只答“分包很好”不给三优势，或三优势写不全，扣分。","方法点拨":"8分题三点优势各约2-3分，先列三点再逐点一句话。"}},{"sec":"简答题","type":"简答题","num":2,"text":"比较TCP与UDP的特点，并各举两个适用场景；说明选择时遵循什么原则（12分）。","opts":[],"subs":[],"ans":"TCP可靠（握手确认重传、有序）适用于文件下载、网页、网银；UDP高效（不确认不重传）适用于直播、语音、游戏（特点各2分，场景各1分）。原则：按需求在“可靠与效率”间权衡——在乎完整用TCP，在乎实时用UDP（原则2分）。","al":{"考查点":"TCP/UDP对比与选型原则（理解+应用，12分）。","解题思路":"分三段答：TCP特点（握手确认重传、可靠）+场景（下载/网页/网银）；UDP特点（不确认不重传、高效）+场景（直播/语音/游戏）；原则=按需求在可靠与效率间权衡。","易错警示":"场景与协议放错（下载配UDP）扣分；漏“权衡原则”一问丢分。","方法点拨":"12分分配：特点各2分+场景各1分+原则2分，先列结构再填内容。"}},{"sec":"案例分析题","type":"案例分析题","num":1,"text":"校园运动会直播筹备中：摄像机、电脑、手机需同时上网；直播画面偶尔模糊但流畅；但开播前两台电脑因IP相同互相ping不通；还有同学担心“输网址被带到假网站”。请你：（1）指出直播画面流畅宜用哪种传输协议并说明原因（5分）；（2）用“三查法”说明两台电脑故障出在哪、怎么修（5分）；（3）给同学提两条防范假网站的建议（5分）。","opts":[],"subs":[],"ans":"（1）宜用UDP：直播重实时，UDP不确认重传、容许少量丢帧，保证流畅不卡；TCP重传反而致延迟（5分）。（2）故障在“查IP”环节：两台IP相同造成冲突；修复——改其中一台为主机号不同的唯一地址后重ping（5分）。（3）①认准地址栏https锁标；②核对域名一字不差、不点陌生短链接，发现仿冒即举报（每条2.5分）。","al":{"考查点":"协议选择+三查法+防钓鱼的综合（应用+评价，15分）。","解题思路":"三问各自独立成段：(1)UDP理由=实时不重传保流畅；（2）三查定位IP冲突→改主机号唯一后重ping；（3）防假站两条=认https锁标＋核对域名不点短链。","易错警示":"三问答串（用TCP理由去答防钓鱼）或各问不完整，会连环丢分。","方法点拨":"15分=5+5+5，逐问作答先看分值，每题写足“结论+理由/步骤”。"}},{"sec":"综合实践题","type":"综合实践题","num":1,"text":"你是“直播网络工程项目部”总工，请完成《校园运动会直播网络设计方案书》：包含①需求分析 ②设备清单与选型理由 ③网络拓扑（星型）设计 ④IP规划（网络号+主机号，避免冲突）⑤连通测试与故障三查法 ⑥安全措施。请分点写出，并说明评分要点。","opts":[],"subs":[],"ans":"①需求：多机位无线直播到校大屏，设备并行上网（4分）；②设备：路由器（网间引路）、交换机（分流）、无线AP（无线覆盖）、摄像头或电脑或手机（4分）；③拓扑：以交换机为中心星型，终端汇聚、路由器引外网（4分）；④IP：统一网络号如192.168.1，主机号逐台唯一分配，避免冲突（4分）；⑤测试：ping互访，故障按查线→查IP→查协议排查（4分）；⑥安全：强密码加访问控制（3分）。评分要点：六项齐全、IP不冲突、体现分包/分层/路由/TCP-UDP等单元知识综合应用、方案可落地（2分）。","al":{"考查点":"网络方案设计书的综合写作（创造+应用，25分）。","解题思路":"按六项框架逐项填充：需求→设备（含选型理由）→星型拓扑→IP规划（网络号+主机号避冲突）→测试与三查→安全。结尾说明评分要点（六项齐全、IP不冲突、单元知识综合应用）。","易错警示":"漏“选型理由”或IP规划未避冲突、未体现分包/分层/路由/TCP-UDP等单元知识，失分严重。","方法点拨":"25分按项分配（4+4+4+4+4+3+2），先写六格框架再逐格充实，知识综合是拉分点。"}}]}]},{"t":"第三单元 便捷的互联网服务","isFinal":false,"lessons":[{"t":"第 11 课 · 配套练习 · 建议用时15分钟","n":"互联网服务应用广","isExam":false,"qs":[{"sec":"回忆热身","type":"回忆","num":1,"text":"互联网服务按功能可分为检索类、通信类、____类和娱乐类。","opts":[],"subs":[],"ans":"学习","al":{"考查点":"互联网服务四大分类的识记（识记）。","解题思路":"题干已给出三个类名，按教材“检索/通信/学习/娱乐”补齐——查资料＝检索、传消息＝通信、上网课＝学习、看视频＝娱乐，缺的是“学习”。","易错警示":"勿填“购物/游戏”——教材分类为四大类，购物常归入检索或娱乐、游戏归娱乐。","方法点拨":"四类口诀：搜（检索）、聊（通信）、学（学习）、玩（娱乐），记全不重不漏。"}},{"sec":"回忆热身","type":"回忆","num":2,"text":"万维网（WWW）被称为各种互联网服务的“统一入口”，我们通过____进入它的网页世界。","opts":[],"subs":[],"ans":"浏览器","al":{"考查点":"万维网与浏览器的关系（识记+理解）。","解题思路":"“统一入口”指通过浏览器这一入口进入各类网页服务，故填“浏览器”。","易错警示":"勿填“网址/搜索引擎”——入口是软件工具（浏览器），不是地址或某个网站。","方法点拨":"把万维网想成一座大商场，浏览器是商场大门，网址是门牌号。"}},{"sec":"基础巩固","type":"单选","num":1,"text":"下列互联网服务中，属于“通信类”的是：","opts":[{"label":"A","text":"搜索引擎百度"},{"label":"B","text":"电子邮箱"},{"label":"C","text":"在线学习平台"},{"label":"D","text":"短视频平台"}],"subs":[],"ans":"答案B　电子邮箱","al":{"考查点":"互联网服务类别的辨别（理解）。","解题思路":"先定“通信类”的含义＝传递消息（即时通信、电子邮件），再逐项归类。","逐项剖析":"A项搜索引擎用于查资料，属检索类，错误；B项电子邮箱用于收发消息，属通信类，正确；C项在线学习平台属学习类，错误；D项短视频平台属娱乐类，错误。","易错警示":"微信/邮箱这类“聊天工具”常与“社交娱乐”混淆——传递信息的功能本质是通信。","方法点拨":"归类题抓“服务目的”：目的在查＝检索、在传＝通信、在学＝学习、在乐＝娱乐。"}},{"sec":"基础巩固","type":"单选","num":2,"text":"小明想查“寿光蔬菜价格”，最合适的服务类型是：","opts":[{"label":"A","text":"通信类"},{"label":"B","text":"学习类"},{"label":"C","text":"检索类"},{"label":"D","text":"娱乐类"}],"subs":[],"ans":"答案C　检索类","al":{"考查点":"按需求选择服务类型（应用）。","解题思路":"需求是“查价格”→要获取信息，属信息检索，选择检索类服务（搜索引擎）。","逐项剖析":"A项通信类用于传消息，查价格用不上，错误；B项学习类用于上课，错误；C项检索类帮人查找信息，“查寿光蔬菜价格”正合适，正确；D项娱乐类与查价无关，错误。","方法点拨":"“想要X，用哪类”题＝看动作：查/搜→检索；发/聊→通信；学→学习；看/玩→娱乐。"}},{"sec":"基础巩固","type":"单选","num":3,"text":"万维网被称为“统一入口”，主要原因是：","opts":[{"label":"A","text":"它比App功能更多"},{"label":"B","text":"各类服务大多通过浏览器网页呈现"},{"label":"C","text":"它只用于看新闻"},{"label":"D","text":"它不需联网"}],"subs":[],"ans":"答案B　各类服务大多通过浏览器网页呈现","al":{"考查点":"万维网“统一入口”地位的成因（理解）。","解题思路":"“统一入口”强调的是把多样服务汇聚到同一访问方式——各类服务大多通过浏览器网页呈现，一个浏览器可进所有门。","逐项剖析":"A项“比App功能更多”不是“入口”含义（入口讲汇聚不讲多少），错误；B项各类服务大多通过浏览器网页呈现，故浏览器成统一入口，正确；C项“只用于看新闻”严重窄化万维网，错误；D项“不需联网”违背网页访问前提，错误。","易错警示":"“统一入口”考的是访问方式统一，不是功能数量。","方法点拨":"见“统一入口”想“一个浏览器逛所有网站”，凡与“多/好/大”有关的选项先怀疑。"}},{"sec":"基础巩固","type":"单选","num":4,"text":"下列关于“服务新形态”的说法，正确的是：","opts":[{"label":"A","text":"AI智能体让服务从人找服务走向服务找人"},{"label":"B","text":"云游戏必须下载几十G客户端"},{"label":"C","text":"协同办公已完全取代线下办公"},{"label":"D","text":"短视频不属于互联网服务"}],"subs":[],"ans":"答案A　AI智能体让服务从人找服务走向服务找人","al":{"考查点":"互联网服务新形态的趋势判断（理解+分析）。","解题思路":"题干问“正确的说法”，逐项用事实核验：AI智能体主动代劳是真实趋势，云游戏主打免下载，协同办公并未完全取代线下。","逐项剖析":"A项AI智能体（如订票助手）主动帮人完成任务，服务从“人找服务”走向“服务找人”，正确；B项云游戏恰恰免去下载几十G客户端、即点即玩，“必须下载”与云游戏理念相反，错误；C项“完全取代线下办公”绝对化，现实中线上线下混合办公，错误；D项短视频是典型娱乐类互联网服务，“不属于”说法错误。","易错警示":"B项是反义陷阱——云游戏的卖点正是“免下载”，审题勿被“必须”带偏。","方法点拨":"“正确说法”题逐项找反例：绝对化（完全/必须/只）表述基本是错的。"}},{"sec":"基础巩固","type":"判断","num":1,"text":"万维网特指浏览器里的网页世界，微信App本身不算万维网。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"万维网与App的概念边界（理解+辨析）。","解题思路":"回忆定义：万维网特指浏览器中通过网页呈现的服务世界；微信是独立App，虽内嵌网页却不等于万维网本身——表述与教材一致，判“√”。","易错警示":"“App也联网，所以App就是万维网”是常见混淆——万维网看的是访问载体（浏览器+网页）。","方法点拨":"判断题先复述定义再对照：题干给的是“特指…不算…”的精准表述，通常为√。"}},{"sec":"基础巩固","type":"判断","num":2,"text":"互联网服务种类固定不变，不会再有新服务出现。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"互联网服务持续创新的认识（理解+辨析）。","解题思路":"找反例：AI智能体、协同办公、云游戏、短视频平台都是近年新出现的服务形态，服务种类在持续生长——故判“×”。","易错警示":"“固定不变”“不会再出现”是违背创新事实的静止观点。","方法点拨":"新技术类判断题凡断言“到此为止”，想想近年新应用即可判×。"}},{"sec":"基础巩固","type":"判断","num":3,"text":"使用互联网服务时，只需娱乐无需注意时间管理。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"理性用网与时间管理（理解+辨析）。","解题思路":"“只需娱乐无需时间管理”把娱乐绝对化，违背健康用网理念；学习与娱乐需平衡，判“×”。","方法点拨":"含“只需…无需…”单向表述，对照“平衡/节制”原则判×。"}},{"sec":"能力提升","type":"提升","num":1,"text":"请写出互联网服务的四种分类，并为“检索类”举一例。","opts":[],"subs":[],"ans":"检索类（如百度搜索）、通信类（如电子邮箱）、学习类（如网课）、娱乐类（如音视频平台）。检索类示例：搜索引擎。","al":{"考查点":"服务四大分类与检索类举例（识记+应用）。","解题思路":"先默写四类名（检索/通信/学习/娱乐），再各配一个代表工具；检索类示例优先写搜索引擎（百度/必应）。","易错警示":"分类名与举例要匹配：把“抖音”当通信类就错了，它是娱乐类。","方法点拨":"“分类+举例”题先列类名再对号填工具，写完自查一遍类别是否放对。"}},{"sec":"能力提升","type":"提升","num":2,"text":"连线：将左侧服务与右侧类别连线（写序号）。①微信 ②中国大学MOOC ③抖音 ④必应搜索｜A通信 B学习 C娱乐 D检索","opts":[],"subs":[],"ans":"①—A；②—B；③—C；④—D","al":{"考查点":"服务类别连线辨别（应用）。","解题思路":"按服务用途归类：微信聊天＝通信；MOOC上课＝学习；抖音刷视频＝娱乐；必应搜索＝检索。","易错警示":"微信易误归娱乐——其核心是即时通信；抖音才是娱乐。","方法点拨":"连线题给每个服务写一个“动词”（聊/学/玩/搜），动词决定类别。"}},{"sec":"能力提升","type":"提升","num":3,"text":"为什么说万维网是“统一入口”？请结合“统一入口＋图文并茂”用一句话说明。","opts":[],"subs":[],"ans":"打开浏览器输入网址即可点开图文声像并茂的各类网页服务，无需记命令，万维网把多样服务汇聚到一个入口。","al":{"考查点":"万维网“统一入口＋图文并茂”的概括表达（理解+表达）。","解题思路":"抓住两个要点组织成一句话：入口统一（打开浏览器输网址即可）＋内容多样（图文声像并茂），无需记命令、老少皆宜。","易错警示":"只答“入口统一”漏掉“图文并茂”会缺一半要点。","方法点拨":"“结合A和B用一句话说明”题：把A、B各压缩成半句，再用“不仅…而且…”或“因为…所以…”串成一句。"}},{"sec":"能力提升","type":"提升","num":4,"text":"为“家庭服务使用图”设计一个统计维度（如按类别计数），并说明它能反映什么。","opts":[],"subs":[],"ans":"维度：按检索、通信、学习、娱乐四类统计家人各用几次。它能反映全家最依赖哪类服务，发现娱乐是否过度。","al":{"考查点":"统计维度设计与数据解读意识（应用+分析）。","解题思路":"先定可统计的维度（按四类计数），再说明它能揭示什么（家庭最依赖哪类服务、娱乐是否过度）——维度决定能回答什么问题。","易错警示":"只给维度不写“能反映什么”，丢后半问的分数。","方法点拨":"“设计统计维度”题自问：这个维度能让我发现什么？答不出发现，说明维度没选好。"}},{"sec":"拓展挑战","type":"拓展","num":1,"text":"奶奶说“现在的手机啥都能干”。请结合本课所学，从“内容形式、统一入口”角度，用奶奶能听懂的话解释万维网为什么像个“服务超市大门”。","opts":[],"subs":[],"ans":"万维网像超市大门：打开浏览器这个大门，点一下就能进搜索、聊天、上课、看戏等不同店铺，而且页面图文声音都有，不用记命令，老少都会用。","al":{"考查点":"用生活类比解释万维网概念（理解+表达）。","解题思路":"把“服务超市大门”类比拆开讲：大门＝浏览器；超市里不同货架＝搜索/聊天/上课/看戏等网页服务；图文声像＝货品琳琅满目。用奶奶熟悉的“逛超市”还原整个体验。","易错警示":"只比喻不落点：类比后必须补一句“打开浏览器这个大门…”，让对应关系显性化。","方法点拨":"生活化解释题三步：选类比→逐个对应（门/货架/货品）→收尾一句话说清好处。"}},{"sec":"拓展挑战","type":"拓展","num":2,"text":"方案设计：班级要办“互联网服务博览会”，请你规划3个展区主题，并为每个展区推荐1个可现场体验的服务。","opts":[],"subs":[],"ans":"展区一“信息检索”——体验搜索引擎查资料；展区二“沟通无界”——体验电子邮箱发信；展区三“在线学习”——体验网课平台。各展区分工明确、覆盖不同类别。","al":{"考查点":"服务分类知识在活动策划中的应用（应用+评价）。","解题思路":"按“分类不重复”原则设计展区：检索、通信、学习各一个展区即可覆盖不同类别；每区配“可现场体验”的服务，保证观众能动手。","易错警示":"三个展区都放娱乐类或都放“看视频”，分类维度缺失，规划失败。","方法点拨":"展区规划题先立分类维度（四大类取三类），再为每区找可体验的实物服务。"}},{"sec":"变式闯关","type":"变式","num":1,"text":"换场景：学校评选“最受欢迎的互联网服务”。若让你设计一张“服务分类投票表”，你会列哪四类，并各给一个候选？","opts":[],"subs":[],"ans":"检索类（百度）、通信类（微信）、学习类（网课）、娱乐类（短视频）。四类对应教材分类，各举一例候选。","al":{"考查点":"服务分类体系的自主建构与理性用网表达（创造+评价）。","解题思路":"按“定标准→分类→配场景→写提醒”四步设计：分类标准决定后面所有安排，先想清“按需求分还是按领域分”；每类举例要“场景+工具”成对出现；安全提醒要落到具体时间控制与理由。","易错警示":"分类标准与类别对不上、场景与推荐服务不匹配（“上课查资料→音乐App”），逻辑即断。","方法点拨":"“编手册/做导航”题＝做信息架构：标准定维度，维度下填实例，实例要经得起“这个场景真的用它吗”的追问。"}},{"sec":"间隔复习","type":"间隔","num":1,"text":"上节课我们综合组建了小型局域网。请回忆：组建时至少需要哪几类硬件设备？你选择的网络结构是什么，为什么？","opts":[],"subs":[],"ans":"（第10课《综合所学建网络》）　至少需要：终端设备（电脑）、网卡、网线（或无线AP）、交换机；机房组网通常选星型结构——布线集中、管理方便、单台故障不影响全网（中心设备需做好备份）。","al":{"考查点":"组网硬件与拓扑选择的综合运用（应用）。","解题思路":"硬件按\"终端—传输—交换\"三层清点；结构选择须给理由，常见理由是星型易管理、故障易排查。","易错警示":"漏写交换机或只写\"电脑和网线\"不完整；选结构不给理由会扣分。","方法点拨":"组网题按\"设备清单+拓扑图+选择理由\"三件套作答。"}},{"sec":"间隔复习","type":"间隔","num":2,"text":"设备接入网络后靠什么互相\"认出\"对方？请写出这一标识的名称与格式特点。","opts":[],"subs":[],"ans":"（第10课《综合所学建网络》）　靠 IP 地址。IPv4 格式为 4 段 0-255 的十进制数、用点分隔（如 192.168.1.101），同一局域网内每台设备的 IP 须唯一。","al":{"考查点":"IP 地址的标识作用与格式（识记）。","解题思路":"IP 是网络中的\"门牌号\"：格式记\"点分四段、每段不超255\"；局域网内唯一是互通前提。","易错警示":"把 IP 与 MAC 混为一谈：IP 逻辑可变，MAC 物理固化。","方法点拨":"写一遍自家电脑的 ipconfig 输出，对号入座记得牢。"}},{"sec":"思维进阶","type":"挑战","num":1,"text":"新学期，学校要为七年级新生制作一本《校园互联网服务使用手册》，请你担任“总编辑”。请写出：①你按什么标准给校园常用的互联网服务分类、分几类（可参考“检索/通信/学习/娱乐”，也可自创更贴合校园生活的分类）；②每一类列出1个校园真实场景与1个推荐服务；③在手册开头写一句“安全用网提醒”，指出哪类服务最需要控制使用时间并说明理由。","opts":[],"subs":[],"open":true,"ans":"参考设计要点：①分类标准示例：按\"用途\"分为检索查询类、通信交流类、学习提升类、生活服务类四类（自创分类须有明确依据）；②每类一景一服务：检索类—查科技节资料/搜索引擎；通信类—家校联系/班级群与邮件；学习类—课后拓展/国家中小学智慧教育平台；生活服务类—校园卡充值/网上缴费平台；③安全用网提醒：\"娱乐类服务最需要控制使用时间——它按算法设计得让人停不下来，过度沉浸会挤占学习与睡眠\"。","al":{"考查点":"开放创造：服务分类与安全提醒（创造+应用）","解题思路":"分类要给\"依据\"，场景与服务要一一对应；提醒须点名\"哪类+为什么\"，落点在算法沉浸设计","易错警示":"分类无标准依据；提醒只写\"少玩手机\"没有指向具体服务类型","方法点拨":"手册题模板：标准→分类→实例→提醒，层层具体。"}}]},{"t":"第 12 课 · 配套练习 · 建议用时15分钟","n":"万维网服务大揭秘","isExam":false,"qs":[{"sec":"回忆热身","type":"回忆","num":1,"text":"在浏览器输入网址后，浏览器会向____发出“请求”，服务器再把网页“响应”回来。","opts":[],"subs":[],"ans":"服务器","al":{"考查点":"请求-响应模式中服务器的角色（识记+理解）。","解题思路":"“浏览器向____发请求，服务器响应”——请求的接收方、响应的发出方都是服务器，填“服务器”。","易错警示":"勿填“路由器/运营商”——它们只转发，不直接回应网页请求。","方法点拨":"记对称关系：浏览器＝客户端（提问者），服务器＝服务方（应答者）。"}},{"sec":"回忆热身","type":"回忆","num":2,"text":"一个完整的URL通常由协议、域名、端口、____和参数五部分构成。","opts":[],"subs":[],"ans":"路径","al":{"考查点":"URL五要素的识记（识记）。","解题思路":"题干列出协议、域名、端口、____、参数，按教材URL五要素补齐第五个“路径”。","易错警示":"“路径”常与“参数”混淆：路径定位到哪个页面，参数附在路径后传查询条件。","方法点拨":"URL五要素口诀：协议开头、域名指路、端口敲门、路径找页、参数带话。"}},{"sec":"基础巩固","type":"单选","num":1,"text":"用“餐厅点餐”类比，“顾客点菜”对应网络中的：","opts":[{"label":"A","text":"服务器做菜"},{"label":"B","text":"浏览器发送请求"},{"label":"C","text":"网络传输菜"},{"label":"D","text":"域名解析"}],"subs":[],"ans":"答案B　浏览器发送请求","al":{"考查点":"请求-响应与点餐类比的对应（理解）。","解题思路":"抓住“顾客点菜”＝用户发起动作：浏览器像顾客主动发请求，服务器像厨房被动做菜。","逐项剖析":"A项“服务器做菜”对应请求之后的处理环节，不是顾客行为，错误；B项顾客点菜＝浏览器发送请求，对应正确；C项网络传输相当于服务员传菜，不在“顾客点菜”范围，错误；D项域名解析是访问前的寻址步骤，错误。","易错警示":"类比题要“逐词对应”：顾客↔浏览器、点菜↔发请求、做菜↔处理、上菜↔响应。","方法点拨":"画一张“点餐↔上网”对照表，谁先动（主动方）永远对应浏览器/顾客。"}},{"sec":"基础巩固","type":"单选","num":2,"text":"下列URL各部分中，用于指明“要访问服务器上哪个具体页面”的是：","opts":[{"label":"A","text":"协议"},{"label":"B","text":"域名"},{"label":"C","text":"端口"},{"label":"D","text":"路径"}],"subs":[],"ans":"答案D　路径","al":{"考查点":"URL路径的作用（理解）。","解题思路":"“指明访问服务器上哪个具体页面”→定位资源的位置，这正是“路径”的职责。","逐项剖析":"A项协议规定访问方式（https/http），不定位页面，错误；B项域名指明是哪台服务器，粒度到“站”不到“页”，错误；C项端口标识服务入口，错误；D项路径如/news指明服务器内的具体文件，正确。","易错警示":"域名回答“哪台机器”，路径才回答“哪个文件”，两层别混。","方法点拨":"URL五要素各管一段：协议管方式、域名管机器、端口管入口、路径管文件、参数管条件。"}},{"sec":"基础巩固","type":"单选","num":3,"text":"在URL https://www.baidu.com:443/s?wd=天气 中，“https”表示的是：","opts":[{"label":"A","text":"域名"},{"label":"B","text":"访问协议"},{"label":"C","text":"服务器IP"},{"label":"D","text":"网页内容"}],"subs":[],"ans":"答案B　访问协议","al":{"考查点":"URL中协议的识别（理解）。","解题思路":"URL开头第一个冒号前的字符串即协议（https），它规定了访问方式与加密规则。","逐项剖析":"A项域名在协议之后（www.baidu.com），错误；B项https正是“访问协议”（超文本传输安全协议），正确；C项IP在域名解析后才出现，不在URL开头，错误；D项网页内容是请求后拿到的结果，不是URL的一部分，错误。","易错警示":"别把“https”当网址品牌——它是协议名，读作“超文本传输安全协议”。","方法点拨":"见URL先切段：第一个“://”之前是协议，之后到第一个“/”是域名。"}},{"sec":"基础巩固","type":"单选","num":4,"text":"观察简易Web服务器日志出现“GET / HTTP/1.1”，说明：","opts":[{"label":"A","text":"服务器拒绝访问"},{"label":"B","text":"浏览器刚发出一次请求"},{"label":"C","text":"网页已损坏"},{"label":"D","text":"网络断开"}],"subs":[],"ans":"答案B　浏览器刚发出一次请求","al":{"考查点":"服务器日志与请求的对应关系（理解+分析）。","解题思路":"“GET / HTTP/1.1”是浏览器向服务器发请求的标准格式，日志中每出现一条即代表一次请求。","逐项剖析":"A项“拒绝访问”会返回403/404状态而非正常记录，错误；B项GET开头正是浏览器发出的HTTP请求，说明一次访问刚发生，正确；C项“网页损坏”与日志记录无关，错误；D项“网络断开”根本不会产生日志，错误。","易错警示":"看到“GET / HTTP/1.1”要认出它是请求行，不是服务器回应内容。","方法点拨":"日志题先认格式：GET/POST开头＝请求；HTTP/1.1后跟状态码（200/404）＝响应。"}},{"sec":"基础巩固","type":"判断","num":1,"text":"万维网采用分布式网状结构，网页存在哪台固定服务器上由用户决定。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"网页存放位置与分布式结构的理解（理解+辨析）。","解题思路":"拆句验证：网页存于网站运营者的服务器，“由用户决定”存放位置是错的；万维网“分布式”指资源分布在世界各地服务器协同服务，不是用户决定，故判“×”。","易错警示":"“分布”易误解为用户随意存放——分布的是服务器，不是网页内容的选择权。","方法点拨":"判断题抓主宾关系：存放者＝网站方，用户只请求、不决定存储。"}},{"sec":"基础巩固","type":"判断","num":2,"text":"端口号在URL中通常可省略，因为浏览器会用协议对应的默认端口。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"URL默认端口规则（识记+理解）。","解题思路":"浏览器访问时若不写端口，会自动用协议默认端口（http→80、https→443），因此端口常省略——表述成立，判“√”。","易错警示":"端口省略的前提是“默认端口”，自定义端口不能省。","方法点拨":"记两对默认值：http=80、https=443；URL里没写端口就是用了默认值。"}},{"sec":"基础巩固","type":"判断","num":3,"text":"网页上的文字、图片也有版权，引用时应注明出处。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"网页内容的版权意识（理解+辨析）。","解题思路":"网页上的文字、图片由作者创作，受版权保护，引用应注明出处——符合版权规范与信息社会责任，判“√”。","易错警示":"“网上找到就能用”是常见误区：能看≠能随便用，引用须注明。","方法点拨":"版权判断题口诀：可浏览、可学习，商用转载要授权，引用务必注出处。"}},{"sec":"能力提升","type":"提升","num":1,"text":"按“请求→处理→响应”顺序，用自己的话简述一次打开网页的过程（不少于三句）。","opts":[],"subs":[],"ans":"浏览器把网址（URL）作为请求发给服务器；服务器收到后查找对应网页并处理；再把网页数据作为响应传回并显示。整个过程类似点菜上菜。","al":{"考查点":"请求-处理-响应的过程复述（理解+表达）。","解题思路":"按“请求→处理→响应”三步组织：浏览器发URL请求→服务器查找并处理网页→服务器把网页数据作为响应返回→浏览器显示；点菜类比可作收尾。","易错警示":"漏掉“浏览器显示”这最后一步，闭环不完整。","方法点拨":"过程复述题画三步箭头：请求→处理→响应，每步写清“谁对谁做了什么”。"}},{"sec":"能力提升","type":"提升","num":2,"text":"拆解URL：https://www.example.com:443/news?class=1，分别写出协议、域名、端口、路径、参数。","opts":[],"subs":[],"ans":"协议https；域名www.example.com；端口443；路径/news；参数class=1。","al":{"考查点":"URL五要素拆解（应用）。","解题思路":"按分隔符切段：协议＝https；域名＝www.example.com；端口＝443；路径＝/news；参数＝class=1。","易错警示":"“://”后到第一个“/”之间都是域名（含www与主域名）；参数从“?”开始。","方法点拨":"拆URL顺序：先找“://”（协议），再找第一个“/”（域名与端口），端口前有“:数字”，问号后是参数。"}},{"sec":"能力提升","type":"提升","num":3,"text":"排序：把下列“点餐”步骤按正确顺序排列（写序号）。①厨房做菜 ②顾客看菜单点单 ③服务员上菜 ④顾客吃到菜","opts":[],"subs":[],"ans":"②①③④","al":{"考查点":"请求-响应顺序的排序（理解）。","解题思路":"以“点餐”还原：先点单（②）→厨房做（①）→上菜（③）→开吃（④），得②①③④。","易错警示":"把“上菜”排在“做菜”前是常见错位——服务器先处理完才能响应。","方法点拨":"排序题找“因果起点”（先有请求）与“终点”（用户拿到结果），中间顺序自然就位。"}},{"sec":"能力提升","type":"提升","num":4,"text":"实验中观察到教师机Web服务器的访问日志。为什么每刷新一次网页，日志就新增一条记录？","opts":[],"subs":[],"ans":"每次刷新浏览器都会重新向服务器发送一次请求，服务器每收到请求就记一条GET记录，刷新次数与日志条数对应。","al":{"考查点":"刷新与请求日志的因果关系（理解+分析）。","解题思路":"一次刷新＝浏览器重新发一次请求，服务器每收一次请求记一条日志——刷新次数与日志条数一一对应。","易错警示":"误以为日志是“网页内容变化记录”——它记录的是访问动作本身。","方法点拨":"“为什么每刷一次多一条”题：把刷新翻译成“再请求一次”，对应关系立刻清晰。"}},{"sec":"拓展挑战","type":"拓展","num":1,"text":"情境：舅舅开小店，想让顾客用手机访问“店铺介绍网页”。请帮他梳理顾客手机到看到网页经历了哪些角色与步骤，并指出他需提供什么（至少两点）。","opts":[],"subs":[],"ans":"角色：顾客手机（浏览器）、网络、店铺服务器。步骤：手机发请求→服务器处理并返回网页→显示。需准备：①可访问的服务器与网页文件；②域名或IP；③稳定网络（两点即可）。","al":{"考查点":"请求-响应知识在建站场景中的综合应用（分析+应用）。","解题思路":"从“顾客手机看到网页”倒推整条链路：手机浏览器发请求→（经网络）→服务器处理返回→浏览器显示；再反推“要提供什么”：网页文件+能访问它的服务器、域名/IP、稳定网络。","易错警示":"漏掉域名/IP或服务器任一要素，方案就跑不通。","方法点拨":"“梳理角色与步骤”题先画链路图再补“材料清单”，角色、步骤、材料三者呼应。"}},{"sec":"拓展挑战","type":"拓展","num":2,"text":"评价：有人说“只要知道网址就能随便看别人的服务器文件”。请结合URL的路径与权限知识，评析这句话的对错并说明原因。","opts":[],"subs":[],"ans":"错。URL路径只能访问服务器对外开放的指定资源，服务器有访问权限控制，未授权目录不会返回；合法网站会做安全配置，随便看不成立。","al":{"考查点":"URL路径与服务器权限的辨析（评价）。","解题思路":"“随便看别人服务器文件”是对URL权限的误解：路径只能访问对外开放的指定资源，服务器有访问控制，未授权目录不会返回——结论“错”，理由给两层（路径边界+权限控制）。","易错警示":"只答“错”不给理由，或理由只在“要密码”上打转，分析不深入。","方法点拨":"评析题模板：亮结论→引原理（URL只能访问公开资源）→补机制（权限控制拦截）→收尾定论。"}},{"sec":"变式闯关","type":"变式","num":1,"text":"换场景：校园广播站播“点歌请求”。把“听众发短信点歌→站里找歌→播出”类比网络请求-响应，三者各对应什么？","opts":[],"subs":[],"ans":"听众发短信＝浏览器发请求；广播站找歌＝服务器处理；播出歌曲＝服务器响应。说明请求-响应是通用模式。","al":{"考查点":"请求-响应模式的场景迁移（应用）。","解题思路":"按“主动方发起→中间处理→结果返回”找对应：听众发短信＝请求；站里找歌＝处理；播出＝响应。","易错警示":"把“点歌短信”对应到“播出后的收听”，就漏掉了请求环节。","方法点拨":"模式迁移题找“发起者—处理者—送达物”三件套，在任何场景都能套用。"}},{"sec":"间隔复习","type":"间隔","num":1,"text":"上节课我们把万维网比作“统一入口”。请举一个你通过浏览器进入的具体服务，并说出它属于哪一类（检索/通信/学习/娱乐）。","opts":[],"subs":[],"ans":"（第11课《互联网服务应用广》）　示例：用浏览器打开百度查资料——检索类；或打开网课平台上课——学习类。（答出具体服务＋正确类别即可）","al":{"考查点":"请求-响应流程与URL结构的创造性转译（创造）；跨课迁移：戏剧表演、语言表达。","解题思路":"按“角色→剧情→道具”三层设计剧本：角色要与流程环节一一对应（浏览器发请求、服务器处理、网页被请求），剧情分幕忠实还原“请求—处理—响应”三环节，横幅把URL五要素落到实物标注。","易错警示":"角色与动作错配（让服务器主动发请求）、URL标注缺“路径”是两大失分点。","方法点拨":"“情景剧演示原理”题＝给流程配音：先写流程三节点，再为每节点配“演员+台词+道具”，原理就演出来了。"}},{"sec":"思维进阶","type":"挑战","num":1,"text":"科技节上，你所在的展位要用“人偶情景剧”向观众演示一次完整的网页访问。请写出：①你设定的角色名单（演员扮演什么，至少4个，可从浏览器/服务器/网络/网页中选择并说明分工）；②按顺序写出剧情分幕（每幕对应“请求—处理—响应”的哪个环节）；③在舞台上挂一张“URL解析横幅”，标注 https://www.example.com:443/news?class=1 的五个部分并解释“路径”的作用。","opts":[],"subs":[],"open":true,"ans":"参考设计要点：①角色（至少4个）：浏览器（观众代表，发起请求）、DNS服务器（查号台，翻译域名）、Web服务器（厨房，备好页面）、网络（快递员，来回传包裹）；②分幕：第一幕\"点单\"——浏览器发出HTTP请求（请求环节）；第二幕\"备餐\"——服务器找到对应网页资源（处理环节）；第三幕\"上菜\"——服务器把HTML响应返回，浏览器渲染展示（响应环节）；③URL横幅：https（协议：加密的超文本传输）+ www.example.com（服务器域名）+ :443（端口）+ /news（路径：定位服务器上的哪个页面）+ ?class=1（查询参数）；路径的作用：像楼层房号一样定位网站里的具体资源。","al":{"考查点":"开放创造：网页访问全流程的戏剧化表达（创造+理解）","解题思路":"三幕必须与\"请求—处理—响应\"一一对应；URL五部分拆解要逐段标注，路径的作用要单独说明","易错警示":"角色只有浏览器和服务器没有DNS/网络则链路不完整；把端口写成\"网址名称\"属概念错误","方法点拨":"流程演示题用\"角色表+分幕+标注图\"三件套，一段一检查。"}}]},{"t":"第 13 课 · 配套练习 · 建议用时15分钟","n":"万维网安全新协议","isExam":false,"qs":[{"sec":"回忆热身","type":"回忆","num":1,"text":"HTTP协议传输数据时是____的，途中设备可能“看”到内容。","opts":[],"subs":[],"ans":"明文","al":{"考查点":"HTTP明文传输特征的识记（识记+理解）。","解题思路":"“途中设备可能‘看’到内容”→数据未被加密，以原始形态传输，即“明文”。","易错警示":"勿填“密文/乱码”——明文才是能被直接读出的特征。","方法点拨":"明文=不设防的明信片，密文=上锁的保险柜，一词之差定安全等级。"}},{"sec":"回忆热身","type":"回忆","num":2,"text":"HTTPS是在HTTP基础上增加了____（如TLS），让数据变成看不懂的密文。","opts":[],"subs":[],"ans":"加密","al":{"考查点":"HTTPS加密机制的识记（识记+理解）。","解题思路":"“让数据变成看不懂的密文”的手段即“加密”，TLS是实现加密的具体协议。","易错警示":"TLS是加密的实现技术，答案主体填“加密（TLS）”均可，勿只写“锁”。","方法点拨":"HTTPS＝HTTP＋加密，抓住“把明文变密文”这一核心即可贯穿全课。"}},{"sec":"基础巩固","type":"单选","num":1,"text":"小明在咖啡店免费WiFi输入银行卡密码，若网站用HTTP，最大风险是：","opts":[{"label":"A","text":"网页打不开"},{"label":"B","text":"密码可能被同网设备截获偷看"},{"label":"C","text":"网速变慢"},{"label":"D","text":"手机没电"}],"subs":[],"ans":"答案B　密码可能被同网设备截获偷看","al":{"考查点":"公共WiFi下HTTP明文传输的风险（理解+分析）。","解题思路":"“免费WiFi+输入密码+HTTP”三要素齐备→明文数据可被同网设备抓包截获，最大风险是密码泄露。","逐项剖析":"A项网页打不开与是否加密无关，错误；B项同网设备可抓包看到明文密码，正是最大风险，正确；C项网速变慢不是安全问题，错误；D项手机没电与传输无关，错误。","易错警示":"免费WiFi是“公共场所”，明文如明信片，人人可看——这正是警示场景。","方法点拨":"风险题先看“传输是否加密+是否公共场所”：明文+公网=高危，立即停止输密码。"}},{"sec":"基础巩固","type":"单选","num":2,"text":"HTTPS相比HTTP最本质的改进是：","opts":[{"label":"A","text":"网页更漂亮"},{"label":"B","text":"传输过程加密"},{"label":"C","text":"不要域名"},{"label":"D","text":"访问更快"}],"subs":[],"ans":"答案B　传输过程加密","al":{"考查点":"HTTPS的本质改进（理解）。","解题思路":"对比HTTP与HTTPS：唯一本质差别在传输是否加密，其余（美观、速度、域名）均非本质。","逐项剖析":"A项网页美观由CSS决定，与协议无关，错误；B项HTTPS在HTTP上叠加加密（TLS），把明文变密文，正确；C项“不要域名”荒谬（访问仍需域名），错误；D项HTTPS因加解密略增开销，不会更快，错误。","易错警示":"“HTTPS更慢”是常见误解——现代加密开销可忽略，安全优先。","方法点拨":"“最本质改进”题＝找HTTP与HTTPS的唯一差异点，其他选项都是陪衬。"}},{"sec":"基础巩固","type":"单选","num":3,"text":"判断网站是否启用HTTPS，地址栏应同时看：","opts":[{"label":"A","text":"只看网址长度"},{"label":"B","text":"https前缀＋锁形标志＋证书"},{"label":"C","text":"只看网页颜色"},{"label":"D","text":"是否有图片"}],"subs":[],"ans":"答案B　https前缀＋锁形标志＋证书","al":{"考查点":"HTTPS“三查法”的完整识别（理解+应用）。","解题思路":"教材“三查法”：https前缀+锁形标志+证书三者缺一不可，逐一核验才可靠。","逐项剖析":"A项只看网址长度毫无意义，错误；B项前缀、锁、证书三要素齐全，正是三查法，正确；C项网页颜色与安全无关，错误；D项有无图片与加密无关，错误。","易错警示":"只查一项（如有锁）不够——钓鱼网站也能带锁，须三项同查。","方法点拨":"“判断网站安全”题背口诀：一查前缀https，二查小锁，三查证书，三项同亮才放心。"}},{"sec":"基础巩固","type":"单选","num":4,"text":"关于“锁形标志”，下列说法正确的是：","opts":[{"label":"A","text":"有锁就一定绝对安全"},{"label":"B","text":"钓鱼网站也可能有锁，需多方验证"},{"label":"C","text":"无锁网站都能放心付款"},{"label":"D","text":"锁标志可随意伪造无风险"}],"subs":[],"ans":"答案B　钓鱼网站也可能有锁，需多方验证","al":{"考查点":"锁形标志的安全相对性（理解+辨析）。","解题思路":"锁≠绝对安全：钓鱼网站可申请证书带锁，须结合网址、证书颁发机构与场景多方验证。","逐项剖析":"A项“有锁绝对安全”绝对化，错误；B项钓鱼网站也可能有锁，需多方验证，正确；C项“无锁也能放心付款”危险误导，错误；D项锁虽可仿冒但“随意伪造无风险”夸大且忽视验证作用，错误。","易错警示":"锁只是“传输加密”的证据，不是“网站可信”的保证——两者是不同问题。","方法点拨":"牢记一句话：小锁证明“路上安全”，不证明“对面是好人”，身份要靠证书与常识验证。"}},{"sec":"基础巩固","type":"判断","num":1,"text":"HTTPS因为加了密，就绝对不会被骗，可放心在任何带锁网站付款。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"HTTPS安全性的相对性（理解+辨析）。","解题思路":"找反例：钓鱼网站也能申请证书显示小锁；加密只防窃听，不防欺骗——故“绝对不会被骗”“放心付款”判“×”。","易错警示":"把“加密”等同于“可信”是最大误区：加密解决偷看，不解决冒充。","方法点拨":"凡“加密了就绝对安全”类表述，用钓鱼网站反例直接判×。"}},{"sec":"基础巩固","type":"判断","num":2,"text":"HTTP明文传输意味着输入的密码在传输途中可能被第三方读取。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"HTTP明文传输的隐患（理解）。","解题思路":"明文=未加密原始数据，途经的路由器/同网设备理论上可抓包读取——表述与原理一致，判“√”。","易错警示":"“理论上可读”不等于“一定被读”，但隐患真实存在，这正是要用HTTPS的原因。","方法点拨":"明文隐患判断题：数据裸奔+中间环节可读=隐患成立，判√。"}},{"sec":"基础巩固","type":"判断","num":3,"text":"我国政务、银行、电商等网站已基本100%使用HTTPS。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"我国HTTPS覆盖现状（识记）。","解题思路":"教材前沿资料：我国持续推进HTTPS全覆盖，政务、银行、电商等关键领域已基本100%部署——表述属实，判“√”。","易错警示":"“基本100%”不等于所有网站——普通内容型网站仍可能用HTTP。","方法点拨":"数据题以教材口径为准：“基本/约”等留有余地的数据表述多为√。"}},{"sec":"能力提升","type":"提升","num":1,"text":"填写对比表：从“传输方式、安全风险、适用场景”三方面比较HTTP与HTTPS（各写一句）。","opts":[],"subs":[],"ans":"传输：HTTP明文、HTTPS加密；风险：HTTP易被窃听、HTTPS难被读懂；场景：HTTP适合普通浏览、HTTPS适合登录与支付。","al":{"考查点":"HTTP与HTTPS的多维对比（理解+表达）。","解题思路":"按“传输方式—安全风险—适用场景”三行填表：明文vs加密；易被窃听vs难被读懂；普通浏览vs登录支付。","易错警示":"“适用场景”一格只写“https好”不落场景，等于没对比。","方法点拨":"对比表题照抄表头维度逐格填写，敏感操作（登录/支付）必配HTTPS。"}},{"sec":"能力提升","type":"提升","num":2,"text":"用“保险柜”类比解释加密传输：发送方、传输中、接收方分别发生了什么？","opts":[],"subs":[],"ans":"发送方把数据锁进保险柜（加密）；传输中即便被截获，没钥匙也打不开（密文）；接收方用钥匙开锁取出（解密）读懂。","al":{"考查点":"加密传输的保险柜类比理解（理解）。","解题思路":"把加密三环节映射到保险柜：发送方上锁（加密）→途中无钥匙打不开（密文抗窃听）→接收方开锁（解密）。","易错警示":"漏掉“接收方解密”环节，闭环不完整。","方法点拨":"加密类类比题记“锁—运—开”三段：发送上锁、中途安全、到达开锁。"}},{"sec":"能力提升","type":"提升","num":3,"text":"“三查法”是哪三查？请按顺序列出，并说明哪一步能看证书。","opts":[],"subs":[],"ans":"一查https://前缀，二查锁形标志，三查证书；点击锁标志可查看证书详情，确认颁发机构与网站身份。","al":{"考查点":"三查法的顺序与证书查看（识记+应用）。","解题思路":"按教材顺序答：一查https前缀、二查锁形标志、三查证书；点锁形标志即可展开证书详情核对颁发机构与网站身份。","易错警示":"顺序不可乱（先粗后细），且要写清“点锁查看证书”的操作。","方法点拨":"操作步骤题按“粗查→细查”递进：先看前缀，再看锁，最后点锁看证书。"}},{"sec":"能力提升","type":"提升","num":4,"text":"判断下列网址状态（写安全/注意/危险）：①https开头且锁亮 ②http开头无锁 ③锁旁显示“证书过期”。","opts":[],"subs":[],"ans":"①安全；②注意（明文有风险，避免输密码）；③危险（证书异常，勿提交信息）。","al":{"考查点":"网址安全状态的“红绿灯”判断（应用）。","解题思路":"按加密三要素打分：https+锁亮=安全（绿灯）；http无锁=注意（黄灯，避免输敏感信息）；证书过期=危险（红灯，立即退出）。","易错警示":"证书过期≠没加密，但代表身份校验失效，危险级别高于普通http。","方法点拨":"红绿灯口诀：锁亮前缀对=绿；有锁证书坏=红；http无锁=黄灯谨慎走。"}},{"sec":"拓展挑战","type":"拓展","num":1,"text":"情境：小宇在二手平台买游戏账号，对方发来“客服”链接让他填银行卡，链接是http开头且无锁。请结合本课知识，给他两条具体建议并说明理由。","opts":[],"subs":[],"ans":"①不在此页填卡：http无加密，密码易被窃听；②核对网址与卖家身份，警惕钓鱼：带锁也需多方验证。应走平台官方HTTPS流程交易。","al":{"考查点":"HTTPS知识在防骗情境中的应用（分析+应用）。","解题思路":"对方发来的链接是http无锁——两条建议直击要害：①不填银行卡（明文风险）；②核对网址与卖家身份（防钓鱼，带锁也要验证）；再给正解：走平台官方HTTPS流程。","易错警示":"只劝“别点链接”不说“为什么”（明文可窃听、身份可冒充），建议缺乏知识支撑。","方法点拨":"安全建议题每条都要“做法+理由”成对，理由用本课原理（加密/身份）支撑。"}},{"sec":"拓展挑战","type":"拓展","num":2,"text":"方案设计：为低年级同学写一份“安全上网三句话”提示语，要求涵盖HTTPS识别与密码习惯，语言通俗。","opts":[],"subs":[],"ans":"示例：①输密码前先看地址栏有没有小锁和https；②不点陌生人发来的不明链接；③不同网站用不同密码。三句分别对应识别、防骗、习惯。","al":{"考查点":"安全素养的通俗化方案设计（创造+表达）。","解题思路":"面向低年级要“短、顺口、可执行”：选三个最关键的防护点各写成一句押韵提示——识别（输密码先看锁和https）、防骗（不点陌生链接）、习惯（不同网站不同密码）。","易错警示":"提示语过长或术语太多，低年级记不住，方案失败。","方法点拨":"“写提示语”题先定三个安全要点，再各压缩成一句朗朗上口的话，一句一防。"}},{"sec":"变式闯关","type":"变式","num":1,"text":"换场景：校园内网系统用http，老师说“内网相对安全”。请分析什么情况下http内网可接受，什么情况仍要用https？","opts":[],"subs":[],"ans":"可接受：纯内网、无敏感信息、物理隔离时风险低；须用https：涉及登录密码、成绩、支付等敏感数据，或跨公网传输时，必须加密防窃听。","al":{"考查点":"http与https的内外网适用分析（评价）。","解题思路":"分场景判断：纯内网+无敏感信息+物理隔离→明文风险低可接受；一旦涉及登录密码、成绩、支付等敏感数据或跨公网传输→必须https。判断标准是“数据敏感度+是否公网”。","易错警示":"“内网就绝对安全”是误区——内网也可能被攻破，敏感数据仍应加密。","方法点拨":"“什么情况可接受/必须”题看两把尺：数据有多敏感、网络是否可信，两尺同量再下结论。"}},{"sec":"间隔复习","type":"间隔","num":1,"text":"上节课我们学了URL结构。请写出URL的五部分，并指出在 https://www.baidu.com:443/s 中哪一段是“路径”。","opts":[],"subs":[],"ans":"（第12课《万维网服务大揭秘》）　五部分：协议、域名、端口、路径、参数；本例中/s是路径，用于定位服务器上的具体页面。","al":{"考查点":"加密思想的游戏化转译与防骗素养表达（创造+应用）。","解题思路":"按“道具模拟→考验设计→一句话科普”三层设计：先想一个能直观演示“变乱码/上锁”的道具（密码本、带锁信箱），规则要让人看懂“加密—传输—解密”全流程；钓鱼考验要挑“最像真的假网站”特征；科普句要落在“小锁=信加了锁”。","易错警示":"游戏只演示“藏信”没演示“偷看也读不懂”，或钓鱼环节无判断标准，设计即失败。","方法点拨":"“体验式科普设计”题：先定要传递的一个原理点，再设计“亲手做一遍”的动作，原理就内化了。"}},{"sec":"思维进阶","type":"挑战","num":1,"text":"班级要办“网络安全体验周”，请你设计一个“密信小邮局”互动游戏，让低年级同学亲手体验“加密传输保护隐私”。请写出：①游戏道具与规则（用什么当“明文”、用什么当“加密钥匙”，怎么演示“偷看也看不懂”）；②设置一个“钓鱼考验”环节，让玩家识别一个假网站特征；③用一句话向小玩家解释“为什么网上输密码要找带锁的https”。","opts":[],"subs":[],"open":true,"ans":"参考设计要点：①道具与规则：明文=写有悄悄话的卡片，加密钥匙=一张\"字母替换表\"；发件人按表逐字替换成\"密文\"，中途由\"偷看员\"展示密文——念出来谁也听不懂；收件人持同款钥匙反向替换还原明文；②钓鱼考验：出示一个假银行网站，特征如网址把字母l换成数字1、域名后缀多了一截、页面粗糙但\"能打开\"——玩家找出两处可疑即可过关；③一句话：\"带锁的https会给信息加上只有你和网站能解的密码，没锁的网站寄出的密码就像明信片人人能看\"。","al":{"考查点":"开放创造：加密与防钓鱼的体验设计（创造+应用）","解题思路":"加密演示的核心是\"没有钥匙看不懂\"，替换表道具最直观；钓鱼环节要给出\"可识别的具体特征\"；解释句同时点\"加密\"与\"明信片类比\"","易错警示":"密文做成\"乱码\"但没演示还原过程，等于没讲加密；钓鱼特征写成\"网站很丑\"不具体","方法点拨":"互动设计题自查：道具能不能演示原理？考验能不能识别特征？话术有没有类比？"}}]},{"t":"第 14 课 · 配套练习 · 建议用时15分钟","n":"互联网搜索新发展","isExam":false,"qs":[{"sec":"回忆热身","type":"回忆","num":1,"text":"搜索引擎能“秒出结果”，关键是它提前建好了____（关键词到网页的映射表）。","opts":[],"subs":[],"ans":"索引","al":{"考查点":"搜索引擎索引概念的识记（识记+理解）。","解题思路":"“秒出结果”靠的是提前建好的关键词→网页映射表，即“索引”。","易错警示":"勿把“索引”写成“缓存”——缓存是网页副本，索引是查找目录。","方法点拨":"索引=图书馆目录卡，提前编好才能秒查，这是搜索“快”的根源。"}},{"sec":"回忆热身","type":"回忆","num":2,"text":"想只搜某个网站内的内容，可在关键词后加“____:站点”语法。","opts":[],"subs":[],"ans":"site","al":{"考查点":"site:检索语法的识记（识记+应用）。","解题思路":"“只搜某网站内的内容”对应site:语法，格式为“关键词 site:站点域名”。","易错警示":"site:后不加空格直接跟域名；勿与filetype:（限文件类型）混淆。","方法点拨":"三大语法记用法：site限站点、filetype限格式、引号限词组。"}},{"sec":"基础巩固","type":"单选","num":1,"text":"搜索引擎“爬虫”的作用是：","opts":[{"label":"A","text":"给用户发广告"},{"label":"B","text":"自动抓取互联网上的网页"},{"label":"C","text":"删除不良信息"},{"label":"D","text":"给网页排序"}],"subs":[],"ans":"答案B　自动抓取互联网上的网页","al":{"考查点":"爬虫程序的功能（理解）。","解题思路":"搜索引擎第一步要先有网页数据，“自动抓取网页”正是爬虫的职责。","逐项剖析":"A项发广告是商业行为与爬虫无关，错误；B项爬虫（Spider/Crawler）自动在网络上抓取网页供后续建索引，正确；C项删除不良信息是平台审核职责，错误；D项给网页排序发生在查询之后、由排序算法完成，错误。","易错警示":"爬虫只管“抓”，排序是另一套算法，别把工作流水线串台。","方法点拨":"搜索引擎四步分工：爬虫抓→分词→索引建→排序出，抓取永远在最前。"}},{"sec":"基础巩固","type":"单选","num":2,"text":"用引号把“人工智能教育”括起来搜索，主要目的是：","opts":[{"label":"A","text":"扩大结果范围"},{"label":"B","text":"精确匹配完整词组"},{"label":"C","text":"只搜图片"},{"label":"D","text":"加快网速"}],"subs":[],"ans":"答案B　精确匹配完整词组","al":{"考查点":"引号精确匹配的作用（应用）。","解题思路":"引号把多词“锁”成一个完整词组，搜索引擎按整词精确匹配，避免被拆开打散。","逐项剖析":"A项引号恰恰是收窄范围而非扩大，错误；B项“人工智能教育”被当整体精确匹配，正确；C项搜图用图片搜索而非引号，错误；D项引号不改变网速，错误。","易错警示":"引号是“精确”，不是“更宽泛”——方向别搞反。","方法点拨":"检索式调范围口诀：引号锁词、site锁站、filetype锁格式。"}},{"sec":"基础巩固","type":"单选","num":3,"text":"关于“排序”，下列说法正确的是：","opts":[{"label":"A","text":"排前面的一定最好最准"},{"label":"B","text":"排序受相关性与商业因素影响"},{"label":"C","text":"排序完全随机"},{"label":"D","text":"用户无法影响"}],"subs":[],"ans":"答案B　排序受相关性与商业因素影响","al":{"考查点":"搜索排序的非绝对性（理解+评价）。","解题思路":"排序是算法综合相关度、权威性、商业因素的结果，排前≠最好最可信。","逐项剖析":"A项“排前面一定最好最准”绝对化——广告与算法都会影响，错误；B项排序受相关性（算法）与商业（广告位）因素共同影响，正确；C项“完全随机”否认算法存在，错误；D项“用户无法影响”否认点击行为与搜索习惯对结果的反馈作用，错误。","易错警示":"看到搜索结果第一条别急着信，先看有没有“广告”标识、来源是否权威。","方法点拨":"对排序结果保持“甄别三问”：谁写的？有无证据？别人也这么说吗？"}},{"sec":"基础巩固","type":"单选","num":4,"text":"使用AI对话搜索时，最重要的习惯是：","opts":[{"label":"A","text":"直接抄AI给的答案"},{"label":"B","text":"对AI答案交叉核验再使用"},{"label":"C","text":"不问来源"},{"label":"D","text":"相信AI绝不会错"}],"subs":[],"ans":"答案B　对AI答案交叉核验再使用","al":{"考查点":"AI对话搜索的核验习惯（理解+评价）。","解题思路":"AI会“一本正经说错”（幻觉），所以最重要的习惯是交叉核验后再使用。","逐项剖析":"A项直接抄AI答案放弃思考，错误；B项对AI答案交叉核验再使用，正是教材强调的素养，正确；C项“不问来源”纵容错误，错误；D项“相信AI绝不会错”违背AI幻觉常识，错误。","易错警示":"AI答案看着流畅专业，不代表正确——流畅性与正确性无关。","方法点拨":"AI搜索铁律：把AI当“参考助手”不当“权威答案”，关键事实二次查证。"}},{"sec":"基础巩固","type":"判断","num":1,"text":"搜索引擎靠“现用现找、逐页扫描全网”来回答查询，所以很慢但准确。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"搜索引擎预建索引的工作机制（理解+辨析）。","解题思路":"找反例：搜索引擎靠提前建好的索引“秒查”，不是现用现找逐页扫网——若真逐页扫，一次查询要几小时，判“×”。","易错警示":"“现用现找”是把搜索想成了实时爬网——实际爬取与查询是分离的两步。","方法点拨":"“所以很慢”的反常识推理题：想想平时搜索瞬间出结果，就知道“逐页扫描”说法是错的。"}},{"sec":"基础巩固","type":"判断","num":2,"text":"高级搜索中，filetype:pdf 可以限定只返回PDF格式的文件。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"filetype语法的识别（识记+理解）。","解题思路":"filetype:pdf即限定只返回PDF格式文件——语法含义与题干一致，判“√”。","方法点拨":"三大语法再记一遍：site站点、filetype类型、引号词组，看到语法与功能对应即√。"}},{"sec":"基础巩固","type":"判断","num":3,"text":"搜索结果排在第一条的内容，一定比后面的更权威可信。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"搜索排序与权威性的关系（理解+辨析）。","解题思路":"找反例：广告与算法都影响排序，靠前不等于权威，需甄别——判“×”。","易错警示":"“排第一=最权威”是把商业排序当学术评价，正是信息素养要破除的迷思。","方法点拨":"排序权威判断题：谁排前面是算法+广告决定的，谁更可信要靠甄别三问。"}},{"sec":"能力提升","type":"提升","num":1,"text":"请把搜索引擎工作流程按正确顺序排序（写序号）：①建立索引 ②爬虫抓取 ③用户查询 ④分词处理 ⑤结果排序","opts":[],"subs":[],"ans":"②①④③⑤","al":{"考查点":"搜索引擎工作流程的排序（理解）。","解题思路":"按数据流向排：先抓取（②爬虫）→建立索引（①）→用户查询时先分词（④）→匹配排序（⑤），查询（③）作为触发点与分词相邻。正确序：②①④③⑤。","易错警示":"“分词”发生在用户查询之后（对查询词切分）而非建索引前——①②④的顺序易错。","方法点拨":"流程排序题分清“离线准备”（爬取、索引）与“在线服务”（查询、分词、排序）两阶段，先准备后服务。"}},{"sec":"能力提升","type":"提升","num":2,"text":"用“图书馆查书”类比，说明“索引”为什么让搜索变快。","opts":[],"subs":[],"ans":"图书馆提前编好目录卡（索引），读者查书名直接翻目录秒定位；若无目录只能逐架找书。索引＝关键词到网页的映射，免去全量扫描。","al":{"考查点":"用类比解释索引提速原理（理解+表达）。","解题思路":"类比要落到“提前编目”四字：图书馆提前编好目录卡→读者翻目录秒定位；搜索引擎提前建索引→关键词直达网页，免去全量扫描。","易错警示":"只说“索引就像目录”不解释“为什么快”，少了“免全量扫描”这个关键。","方法点拨":"“用类比解释为什么快”题：喻体（目录卡）→本体（索引）→提速原因（提前备好、免逐架找）三段完整。"}},{"sec":"能力提升","type":"提升","num":3,"text":"补全检索式：想找“教育部官网”上关于“人工智能”的PDF文件，请写出含引号和两种语法的检索式。","opts":[],"subs":[],"ans":"“人工智能” site:edu.cn filetype:pdf（或 site:moe.gov.cn filetype:pdf “人工智能”）。","al":{"考查点":"检索语法综合运用（应用+创造）。","解题思路":"三个限定条件分别对应三个语法：词组用引号（“人工智能”）、站点用site:（edu.cn或moe.gov.cn）、格式用filetype:（pdf），三者自由组合即得检索式。","易错警示":"site:后必须跟“站内域名”，写“教育部官网”中文会失效；语法大小写与空格要规范。","方法点拨":"“补全检索式”题＝把每个条件翻译成一个语法再拼接：词组加引号、范围加site、格式加filetype。"}},{"sec":"能力提升","type":"提升","num":4,"text":"面对一条搜索结果，请用“甄别三问”写一句你会怎么判断它是否可信。","opts":[],"subs":[],"ans":"我会问：这条是谁写的（看来源是否权威）？有没有引用证据？其他网站是否也这么说？三者吻合才采信。","al":{"考查点":"信息甄别三问的应用（理解+应用）。","解题思路":"甄别三问是“谁写的（来源）、有无证据、是否多方印证”——用第一人称把三问写成自己的判断流程即得分。","易错警示":"只背“三问”名称不写出具体问法，等于没答。","方法点拨":"凡是判断信息可信度的题，默认套三问：来源权威吗？有证据吗？能交叉验证吗？"}},{"sec":"拓展挑战","type":"拓展","num":1,"text":"情境：你要写“校园垃圾分类”小论文，用AI搜索得到一段数据但拿不准真假。请设计一套“先想再核验”的检索方案（至少三步）。","opts":[],"subs":[],"ans":"①先自己列出想查的问题与关键词；②用传统搜索加高级语法（site:政府网）找权威来源；③把AI答案与2-3个独立来源交叉比对，不一致处再查并标注来源。","al":{"考查点":"AI时代的检索核验方案设计（分析+创造）。","解题思路":"“先想再核验”的核心是“思维先行+证据兜底”：先自己想清问题与关键词（不依赖AI），再用高级语法找权威源（site:政府网），最后把AI答案与2-3个独立来源交叉比对，不一致处标记来源。","易错警示":"方案只写“问AI然后自己判断”，没有具体核验动作（查什么网站、怎么比对），不够“可执行”。","方法点拨":"“核验方案”题步骤化：列问题→定关键词→权威源检索→交叉比对→标注来源，五步成方案。"}},{"sec":"拓展挑战","type":"拓展","num":2,"text":"评价：同学习惯“有问题就问AI，AI说啥信啥”。请结合“甄别三问”和“AI会一本正经说错”，评析这种做法并给出改进。","opts":[],"subs":[],"ans":"有风险：AI可能编造（幻觉），直接采信易传错。改进：把AI当助手而非权威，用甄别三问（来源、证据、交叉验证）核验，重要事实以权威网站为准。","al":{"考查点":"对AI依赖误区的批判评价（评价）。","解题思路":"先评风险（AI幻觉会编造、直接采信会传错），再给改进（定位为助手非权威、用甄别三问核验、重要事实以权威网站为准）。","易错警示":"只骂“AI不靠谱”不给替代方案，评价不完整；说“AI永远可信”则方向全错。","方法点拨":"“评析做法并改进”题按“风险→定位→方法”三段：说清错在哪，再给出“怎么用才对”。"}},{"sec":"变式闯关","type":"变式","num":1,"text":"换场景：图书馆数字化后也能“搜书名秒定位”。请类比搜索引擎，说出图书馆系统的“爬虫、索引、排序”分别对应什么。","opts":[],"subs":[],"ans":"爬虫＝图书采购员录入新书；索引＝编好的馆藏目录卡；排序＝按书名相关度或索书号排列检索结果。","al":{"考查点":"搜索引擎机制向图书馆系统的迁移（应用）。","解题思路":"把图书馆流程与搜索引擎步骤一一对应：采购录入新书=爬虫抓取；编馆藏目录卡=建索引；按相关度排列检索结果=排序。","易错警示":"把“借书”对应到“排序”，环节错位——借书对应的是用户查询后的取书环节。","方法点拨":"类比迁移题按“输入→存储→输出”三阶段对应：抓取入库对应编目建卡对应排序展示。"}},{"sec":"间隔复习","type":"间隔","num":1,"text":"上节课学了HTTPS加密。请说出HTTPS比HTTP安全的关键原因，并举一个“应该使用HTTPS”的场景。","opts":[],"subs":[],"ans":"（第13课《万维网安全新协议》）　HTTPS在HTTP基础上加了加密（TLS），传输中变密文，被截获也读不懂；登录、支付、填个人信息等场景必须使用HTTPS。","al":{"考查点":"AI幻觉核验素养的规则化设计（创造+评价）。","解题思路":"守则设计要“双向约束”：对使用者定“先自己想、必查证”，对AI定“拿不准就明说、不编造出处”；核验示范必须演示完整的“先想—查证—比对—标注”动作链，而不是停留在口号。","易错警示":"只约束同学不约束“机器人”、示范环节没有具体查证动作（用什么语法、查什么网站），守则空洞。","方法点拨":"“制定使用守则”题分主体写条款（谁+必须做什么/禁止做什么），再配一个能“演出来”的示范案例。"}},{"sec":"思维进阶","type":"挑战","num":1,"text":"学校“AI小助手”社团想开发一个给同学们答疑的问答机器人，但你提醒大家：AI会“一本正经地说错”。请你为社团设计一份《AI回答核验守则》。请写出：①给“提问的同学”定2条使用规则（例如什么必须自己先想、什么必须再查证）；②给“机器人”定2条自我约束（例如拿不准时怎么表态）；③设计一个“核验示范”：给出一个AI可能说错的常见话题（如历史年份、科学常识任选其一），演示按你的守则该怎么查证。","opts":[],"subs":[],"open":true,"ans":"参考设计要点：①给提问同学的两条规则：先自己想出初步答案或思路再来对照（思维先行）；凡涉及年份、数据、法条等事实性内容，必须再查权威来源核验后才能采信；②给机器人的两条自我约束：拿不准时明确回答\"我不确定\"并建议向老师或权威渠道核实；回答末尾附上信息出处，方便人工复核；③核验示范示例：问\"中国全功能接入互联网是哪一年？\"——机器人答1996（错）；按守则：识别这是事实性问题→查政府公报或权威教材→核实为1994→修正记录并标注来源。","al":{"考查点":"开放创造：AI使用的核验规则设计（创造+信息社会责任）","解题思路":"规则分\"人\"与\"机器\"两侧：人侧强调\"先想+核验\"，机器侧强调\"示弱+给出处\"；示范要完整走一遍\"识别—查证—修正\"","易错警示":"只对人有规则、机器人\"永远正确\"的设定违背守则初衷；示范只说\"去查\"不给查证过程","方法点拨":"AI守则题按\"人规—机规—示范\"三段，每条规则都要可执行。"}}]},{"t":"第 15 课 · 配套练习 · 建议用时15分钟","n":"互联网实验齐发现","isExam":false,"qs":[{"sec":"回忆热身","type":"回忆","num":1,"text":"想测试本机到网关是否连通，最常用的命令是____。","opts":[],"subs":[],"ans":"ping","al":{"考查点":"网络连通性测试命令的识记（识记）。","解题思路":"“测试本机到网关是否连通”→连通性测试命令ping，教材“网络医生连通科”的招牌工具。","易错警示":"勿填ipconfig（查地址）或tracert（查路径）——三命令用途要分清。","方法点拨":"命令用途口诀：ping连通、ipconfig地址、tracert路径、netstat连接。"}},{"sec":"回忆热身","type":"回忆","num":2,"text":"查看本机IP地址、子网掩码等配置，应使用的命令是____。","opts":[],"subs":[],"ans":"ipconfig","al":{"考查点":"查看网络配置命令的识记（识记）。","解题思路":"“查看本机IP地址、子网掩码等配置”→地址科工具ipconfig。","易错警示":"Windows下查IP用ipconfig，不是Linux的ifconfig，注意拼写。","方法点拨":"四命令速记卡：通（ping）、址（ipconfig）、路（tracert）、连（netstat）。"}},{"sec":"基础巩固","type":"单选","num":1,"text":"“网络医院”中负责“查本机IP配置”的科室对应的命令是：","opts":[{"label":"A","text":"ping"},{"label":"B","text":"ipconfig"},{"label":"C","text":"tracert"},{"label":"D","text":"netstat"}],"subs":[],"ans":"答案B　ipconfig","al":{"考查点":"ipconfig命令功能的辨别（理解）。","解题思路":"“查本机IP配置”=地址科职能，对应命令ipconfig。","逐项剖析":"A项ping测连通，与查配置无关，错误；B项ipconfig显示本机IP、子网掩码、网关等配置，正确；C项tracert追踪路径，错误；D项netstat看连接，错误。","易错警示":"四命令读音相近易混，答题先看“要做什么科室的活”。","方法点拨":"科室对照表：地址科→ipconfig，凡见“查IP/配置”优先选它。"}},{"sec":"基础巩固","type":"单选","num":2,"text":"想追踪数据从本机到目标服务器经过哪些路由器，应使用的命令是：","opts":[{"label":"A","text":"ping"},{"label":"B","text":"ipconfig"},{"label":"C","text":"tracert"},{"label":"D","text":"netstat"}],"subs":[],"ans":"答案C　tracert","al":{"考查点":"tracert命令功能的辨别（理解）。","解题思路"
