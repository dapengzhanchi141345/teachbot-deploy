形象重言行不重外貌。","方法点拨":"“数字形象三方面”与“公约”类题通用：内容、礼仪、隐私三词必带。"}},{"sec":"基础巩固","type":"单选","num":1,"text":"下列交流形式中，信息量通常最大的是：","opts":[{"label":"A","text":"纯文字短信"},{"label":"B","text":"语音消息"},{"label":"C","text":"视频通话"},{"label":"D","text":"表情包"}],"subs":[],"ans":"答案C　视频通话","al":{"考查点":"交流形式信息量比较（理解）。","解题思路":"信息量取决于同时传递的通道数：视频同时含画面、声音、表情、文字，通道最全。","逐项剖析":"A项纯文字短信——仅文字一通道；B项语音消息——加声音通道；C项视频通话——对，画面＋声音＋表情＋文字多通道并发，信息量最大；D项表情包——单图符号。","易错警示":"勿因“表情包生动”误选，信息量按“通道数量”而非“生动程度”比较。","方法点拨":"“信息量最大”题按媒体通道排序：纯文字＜语音＜图文＜视频。"}},{"sec":"基础巩固","type":"单选","num":2,"text":"小宇总刷篮球视频，平台越来越只推篮球内容，这现象叫：","opts":[{"label":"A","text":"数字分身"},{"label":"B","text":"信息茧房"},{"label":"C","text":"网络礼仪"},{"label":"D","text":"云存储"}],"subs":[],"ans":"答案B　信息茧房","al":{"考查点":"信息茧房概念（理解）。","解题思路":"平台按偏好持续只推篮球内容→视野越收越窄，如同被茧包裹——信息茧房。","逐项剖析":"A项数字分身——指AI虚拟形象；B项信息茧房——对，算法推荐导致的内容窄化；C项网络礼仪——指交流规范；D项云存储——数据存储服务。","易错警示":"“总刷同类→总推同类”是茧房标准信号，勿与“个性化推荐”混淆（推荐本身中性，茧房是过度窄化）。","方法点拨":"识别茧房三要素：算法＋偏好＋视野变窄，缺一不可。"}},{"sec":"基础巩固","type":"单选","num":3,"text":"下列做法有助于“破茧”的是：","opts":[{"label":"A","text":"只关注同类账号"},{"label":"B","text":"主动搜索不同领域内容"},{"label":"C","text":"卸载所有App"},{"label":"D","text":"整天刷同一类视频"}],"subs":[],"ans":"答案B　主动搜索不同领域内容","al":{"考查点":"破茧方法（应用）。","解题思路":"破茧=主动跳出算法舒适区：主动搜索不同领域、关注多元信源、交叉验证。","逐项剖析":"A项只关注同类账号——加剧茧房；B项主动搜索不同领域内容——对，主动跨圈重置推荐；C项卸载所有App——因噎废食不可行；D项整天刷同一类视频——正是茧房行为。","易错警示":"“卸载App”看似决绝实则不可行，破茧要“主动拓宽”而非“逃避”。","方法点拨":"凡破茧题，答案落点＝“主动＋多元＋跨圈”。"}},{"sec":"基础巩固","type":"单选","num":4,"text":"遇到网络欺凌，下列做法最恰当的是：","opts":[{"label":"A","text":"以暴制暴回骂"},{"label":"B","text":"沉默忍受不声张"},{"label":"C","text":"截图留证并求助老师家长或举报"},{"label":"D","text":"把对方隐私也曝光"}],"subs":[],"ans":"答案C　截图留证并求助老师家长或举报","al":{"考查点":"网络欺凌正确应对（应用）。","解题思路":"反欺凌三步：不沉默、截图留证、求助举报（老师/家长/平台）。","逐项剖析":"A项以暴制暴回骂——激化矛盾且自己也违规；B项沉默忍受——纵容欺凌、伤害自己；C项截图留证并求助老师家长或举报——对，理性合法；D项曝光对方隐私——以错制错涉嫌侵权。","易错警示":"“回骂/曝光隐私”看似解气实则违法，勿选；截图留证是铁律。","方法点拨":"欺凌应对记住“留证—求助—举报”六字诀，凡涉“以暴制暴”皆错。"}},{"sec":"基础巩固","type":"判断","num":1,"text":"网上的“第二身份”不存在，别人不会通过你的发言形成对你的印象。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"数字形象客观存在（理解）。","解题思路":"“第二身份不存在”是错误认知：每条评论、动态都在塑造他人对你的印象，数字形象真实累积。","易错警示":"勿因“网络是虚拟的”而判对——言行是真实的，形象随之真实。","方法点拨":"判断“形象是否存在”看影响：能影响他人评价即存在。"}},{"sec":"基础巩固","type":"判断","num":2,"text":"信息茧房完全是用户自己的错，与平台算法无关。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"信息茧房成因（理解）。","解题思路":"茧房=算法推荐＋用户偏好共同作用：算法负责“投喂”，用户点击负责“强化”。平台设计负有重要责任，不能全怪用户。","易错警示":"“完全是用户自己的错”把责任单方化——技术设计因素不可推卸。","方法点拨":"凡“完全是/全都是”归因判断，先想“另一主体是否也有责任”。"}},{"sec":"基础巩固","type":"判断","num":3,"text":"在评论区辱骂他人属于不文明网络礼仪，严重时可能构成网络欺凌。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"网络礼仪与欺凌边界（理解）。","解题思路":"评论区辱骂违背文明礼仪；持续、针对性地攻击他人即可能构成网络欺凌。表述成立。","方法点拨":"礼仪→欺凌是从量变到质变：偶发言辞不当属礼仪问题，持续针对即欺凌。"}},{"sec":"能力提升","type":"提升","num":1,"text":"填写“数字形象自评”三方面各一句改进目标：内容____；礼仪____；隐私____。","opts":[],"subs":[],"ans":"内容：多分享学习公益类；礼仪：评论先思考不攻击；隐私：不晒住址与证件。","al":{"考查点":"数字形象自评落地（应用）。","解题思路":"三方面各写一条可执行改进：内容——多分享学习、公益、家乡类正向内容；礼仪——评论先思考、不攻击不抬杠；隐私——不晒住址、证件、定位。","易错警示":"目标须“可执行”而非口号（如“我要变好”）；三方面不要写重。","方法点拨":"“自评改进”题按内容/礼仪/隐私三列各给“一个具体动作”。"}},{"sec":"能力提升","type":"提升","num":2,"text":"连线：将做法与所属素养连线。①发布有益内容 A.隐私保护 ②不晒证件住址 B.内容经营 ③评论文明 C.网络礼仪","opts":[],"subs":[],"ans":"①—B；②—A；③—C。","al":{"考查点":"素养归类连线（应用）。","解题思路":"①发布有益内容——内容经营（B）；②不晒证件住址——隐私保护（A）；③评论文明——网络礼仪（C）。","易错警示":"“发布有益内容”易被误连礼仪，判别：内容是“发什么”，礼仪是“怎么交流”。","方法点拨":"连线先定维度语义：内容=说什么、礼仪=怎么说、隐私=藏什么。"}},{"sec":"能力提升","type":"提升","num":3,"text":"排序：遭遇网络欺凌后的合理应对顺序：A.截图留证 B.告诉老师家长 C.平台举报。","opts":[],"subs":[],"ans":"A到B与C（先留证，再求助与举报；B、C可并行）。","al":{"考查点":"欺凌应对流程排序（应用）。","解题思路":"正确顺序：先截图留证（A）保存证据，再告知老师家长（B）并平台举报（C）——B、C可并行求助。","易错警示":"先举报后留证则证据可能被删；留证必须第一步。","方法点拨":"应急流程排序原则：固定证据→寻求支援→平台处置。"}},{"sec":"能力提升","type":"提升","num":4,"text":"寿光某同学想用短视频宣传家乡，却在评论区被嘲讽口音。写一句他既能维护形象又化解尴尬的得体回复。","opts":[],"subs":[],"ans":"示例：“谢谢观看！家乡口音是我的特色，欢迎来寿光尝尝大棚草莓。”既大方又传递善意，维护正面形象。","al":{"考查点":"网络礼仪迁移得体表达（应用+创造）。","解题思路":"面对嘲讽口音，得体回复＝大方认特色＋善意邀约＋不卑不亢：“谢谢观看！家乡口音是我的特色，欢迎来寿光尝尝大棚草莓。”既维护形象又化解尴尬。","易错警示":"反唇相讥或自卑道歉都失分；得体=既不受伤也不伤人。","方法点拨":"“写一句得体回复”题：先承认/接纳，再转正面话题，语气带善意。"}},{"sec":"拓展挑战","type":"拓展","num":1,"text":"小明发现自己关注的账号越来越单一，担心陷入信息茧房。请帮他设计一份“破茧行动计划”（至少两点具体做法），并说明为什么有效。","opts":[],"subs":[],"ans":"①每周主动搜索一个陌生领域（如天文），打破算法惯性；②关注观点不同的优质账号，接触多元视角。有效因主动跨圈能重置推荐、拓宽视野。","al":{"考查点":"破茧行动计划设计（创造）。","解题思路":"两点具体做法＋有效性说明：①每周主动搜索一个陌生领域（如天文）——主动跨圈能重置算法推荐；②关注观点不同的优质账号——接触多元视角拓宽认知。","易错警示":"做法须“主动/跨圈”，只说“少刷手机”是逃避不是破茧；每条须解释为何有效。","方法点拨":"“行动计划”题=具体动作＋频次＋一句原理（为什么能破茧）。"}},{"sec":"拓展挑战","type":"拓展","num":2,"text":"评价：班级群有人转发“某食物致癌”的未经证实文章。请你从“数字形象”与“网络礼仪”角度，写一句既劝阻又不伤和的回复。","opts":[],"subs":[],"ans":"示例：“这个我查了官方没说哦，先别急着转，免得误导大家，也保护咱们群的靠谱形象。”既劝核验又顾全对方面子。","al":{"考查点":"数字形象与礼仪综合沟通（评价+创造）。","解题思路":"劝阻转发谣言须“既劝核验又不伤和”：先给台阶（“这个我查了官方没说哦”），再讲后果（“免得误导大家”），最后拉回共同价值（“也保护咱们群的靠谱形象”）。","易错警示":"直接斥责“你造谣”伤和气，效果反而不佳；委婉+依据双管齐下。","方法点拨":"“劝阻类”回复模板：事实核验＋群体会员责任＋给对方留面子。"}},{"sec":"变式闯关","type":"变式","num":1,"text":"换场景：同样是“算法推荐”，解释为什么购物平台总推你刚搜过的商品，并给一条避免冲动消费的小方法。","opts":[],"subs":[],"ans":"平台记录你的搜索浏览数据持续推送同类商品（类似茧房）；可清空浏览记录、设购物冷静期，或关闭个性化推荐减少诱惑。","al":{"考查点":"算法推荐迁移到购物场景（迁移）。","解题思路":"购物平台推你刚搜过的商品＝记录搜索浏览数据持续推荐，与内容平台同一机制。防冲动消费：清空/管理浏览记录、设“购物冷静期”、关闭个性化推荐减少诱惑。","易错警示":"只答“为什么推”漏“防冲动”方法，或方法与机制脱节。","方法点拨":"迁移题把“茧房解法”翻译到对应场景：内容靠跨圈，购物靠冷静期与关推荐。"}},{"sec":"间隔复习","type":"间隔","num":1,"text":"上节课学了在线学习的“个性化推荐”。请说明它依赖什么，并举一例说明它可能带来什么副作用。","opts":[],"subs":[],"ans":"（第22课《在线学习新变革》）　依赖学习行为数据加算法；副作用：只推你已会的，可能窄化视野（类似茧房），需主动拓展。","al":{"考查点":"数字形象＋反欺凌＋破茧三知识整合设计（综合+创造）。","解题思路":"三问三采分面：①公约条款（两条）——从内容（真实有益）、礼仪（评论文明）、隐私（不晒住址证件）中选两条写成“可张贴”的祈使句；②欺凌响应机制——完整闭环“发现→截图留证→告知班主任家长→调解处理→平台举报”，突出“谁发现谁响应、留证先行”；③破茧活动——如“每周跨圈分享会”，说明主动跨圈能重置推荐、拓宽视野的原理。","易错警示":"条款太虚（“文明上网”）不给分；机制缺“留证”或“求助对象”环节即不闭环。","方法点拨":"“公约/机制”设计题：条款要像规章制度一样具体，机制要画出“谁→做什么→找谁”的闭环链。"}},{"sec":"思维进阶","type":"挑战","num":1,"text":"【真实情境】班里要开展“文明上网小卫士”主题活动，请你设计一份能张贴上墙的《班级网络文明公约》。请写出：①针对“数字形象建设”的两条条款（从内容、礼仪、隐私三方面任选两条落笔）；②针对“网络欺凌”设计一条“发现即响应”机制（谁发现、怎么做、找谁求助）；③针对“信息茧房”设计一个班级层面的破解活动并说明它为什么有效。","opts":[],"subs":[],"open":true,"ans":"参考设计要点：①数字形象条款示例：内容上——发布前\"三思\"：真实、不伤人、经得起三年后回看；隐私上——不发布他人照片影像，未经同意不@不转发涉及他人的内容；②欺凌响应机制：任何人发现即\"留证—报障—支持\"三步：截图保存→立即报告班长或老师→在群内明确声援当事人\"这不是你的错\"，禁止跟风起哄；③信息茧房破解活动：每周\"换频道日\"——班级推荐一个大家平时不看的优质栏目集体观看并讨论；有效原因是集体行动强制打破算法推荐的单一信息流，让同学体验陌生领域、重建多元信息习惯。","al":{"考查点":"开放创造：网络文明的制度设计（创造+信息社会责任）","解题思路":"条款要可执行（动作+场景）；响应机制须有\"谁发现、做什么、找谁\"三要素；破茧活动要说明\"为什么有效\"的机制","易错警示":"公约写成口号集合；破茧活动写成\"少刷手机\"没有集体行为设计","方法点拨":"文明公约题三步：条款可执行、机制有闭环、活动有原理。"}}]},{"t":"第 25 课 · 配套练习 · 建议用时15分钟","n":"网络创新云服务","isExam":false,"qs":[{"sec":"回忆热身","type":"回忆","num":1,"text":"云计算就像“公共水厂”，用户不必自己挖井，而是按需取用____的资源。","opts":[],"subs":[],"ans":"远程（云端）","al":{"考查点":"云计算类比理解（理解）。","解题思路":"“公共水厂”类比：用户不必自己挖井（自建机房），按需取用远程（云端）资源池的计算与存储。","易错警示":"填空关键词是“远程（云端）”，勿写“免费”或“别人的电脑”。","方法点拨":"云的三特征：按需、远程、资源池——类比题先还原这三个词。"}},{"sec":"回忆热身","type":"回忆","num":2,"text":"云存储“秒传”靠的是____算法，给文件算出一个唯一的“指纹”。","opts":[],"subs":[],"ans":"摘要（摘要算法）","al":{"考查点":"云存储秒传原理（理解）。","解题思路":"秒传靠摘要算法：给文件内容算一个固定长度的“指纹”（摘要/哈希），内容相同则指纹相同，系统判定已存在，免重复上传。","易错警示":"勿填“压缩算法”——压缩是减小体积，去重靠摘要指纹。","方法点拨":"“指纹”是摘要算法的通俗名：内容→指纹→比对→去重。"}},{"sec":"基础巩固","type":"单选","num":1,"text":"用“公共水厂”类比，云计算的本质是：","opts":[{"label":"A","text":"每台电脑自建机房"},{"label":"B","text":"按需取用远程资源池"},{"label":"C","text":"数据只能存本地"},{"label":"D","text":"云是一朵真云"}],"subs":[],"ans":"答案B　按需取用远程资源池","al":{"考查点":"云计算本质（理解）。","解题思路":"“公共水厂”类比指向云的本质：集中资源、按需取用、远程访问。","逐项剖析":"A项每台电脑自建机房——正是云要替代的旧模式；B项按需取用远程资源池——对，云的准确画像；C项数据只能存本地——与云相反；D项云是一朵真云——字面误解，云是比喻。","易错警示":"云不是“真云”也不是“本地”，核心在“远程资源池＋按需”。","方法点拨":"云的判断题统一对照三特征：远程、按需、共享资源池。"}},{"sec":"基础巩固","type":"单选","num":2,"text":"同一个文件你第二次上传却“秒传”完成，原因是：","opts":[{"label":"A","text":"网速突然变快"},{"label":"B","text":"系统算出摘要相同判定已存在"},{"label":"C","text":"文件被自动删除"},{"label":"D","text":"平台免费用"}],"subs":[],"ans":"答案B　系统算出摘要相同判定已存在","al":{"考查点":"秒传机制原理（理解）。","解题思路":"第二次上传“秒传”因为系统算出文件摘要（指纹）与已存文件相同，判定内容已存在，只建引用不重复上传。","逐项剖析":"A项网速突然变快——秒传与网速无关，是省去了上传；B项系统算出摘要相同判定已存在——对；C项文件被自动删除——与现象矛盾；D项平台免费用——与存储机制无关。","易错警示":"秒传≠网速快，本质是“算指纹+去重”。","方法点拨":"凡“秒传”题直接答摘要算法去重，勿被“网速”干扰。"}},{"sec":"基础巩固","type":"单选","num":3,"text":"“东数西算”工程把数据送到西部计算，主要因为西部：","opts":[{"label":"A","text":"人口更多"},{"label":"B","text":"能源足气候凉适合建机房"},{"label":"C","text":"网络更好"},{"label":"D","text":"地价最高"}],"subs":[],"ans":"答案B　能源足气候凉适合建机房","al":{"考查点":"东数西算战略意图（理解）。","解题思路":"“东数西算”把东部数据送到西部计算：西部绿电充足、气候凉爽利于散热，适合布局大型数据中心。","逐项剖析":"A项人口更多——错，西部人口少；B项能源足气候凉适合建机房——对，数据中心耗电大需散热；C项网络更好——错，网络反而不如东部；D项地价最高——错，西部地价低。","易错警示":"数据中心两大刚需=电力+散热，正对应西部“绿电+凉爽”。","方法点拨":"“为什么建在西部”题从数据中心成本结构（电费/散热）切入。"}},{"sec":"基础巩固","type":"单选","num":4,"text":"下列最符合“安全备份三备份”原则的是：","opts":[{"label":"A","text":"只存手机"},{"label":"B","text":"本地硬盘加云端加异地各一份"},{"label":"C","text":"只发朋友圈"},{"label":"D","text":"只存网盘"}],"subs":[],"ans":"答案B　本地硬盘加云端加异地各一份","al":{"考查点":"三备份安全原则（应用）。","解题思路":"“安全备份三备份”=同一份数据至少三份，分处本地、云端、异地，分散单点风险。","逐项剖析":"A项只存手机——单点，丢手机即全丢；B项本地硬盘加云端加异地各一份——对，符合三备份；C项只发朋友圈——非备份且泄露风险；D项只存网盘——单点，账号出问题即丢失。","易错警示":"“多备份”须强调“分处不同位置”，都在同一台设备不算。","方法点拨":"三备份口诀“本地＋云端＋异地”，目的=鸡蛋不放一个篮子。"}},{"sec":"基础巩固","type":"判断","num":1,"text":"云盘里的文件永远绝对安全，永远不会丢也不会泄露。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"云存储风险认知（评价）。","解题思路":"“永远绝对安全”是绝对化表述：云服务存在账号被盗、服务中断、数据泄露等风险，仍需加密与多备份。","易错警示":"安全是“相对可控”而非“绝对”，凡“永远/绝对”判错。","方法点拨":"安全类判断题：出现“永远/绝对/完全”即怀疑，再想一种失效场景。"}},{"sec":"基础巩固","type":"判断","num":2,"text":"摘要算法算出的“文件指纹”相同，说明两个文件内容相同，因此可秒传。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"摘要算法原理判断（理解）。","解题思路":"摘要（指纹）相同→极高概率内容相同，系统据此免重复存储实现秒传。表述符合原理。","易错警示":"严谨说法是“相同则内容一致（碰撞概率极低）”，教辅层面判定为对即可。","方法点拨":"指纹相同→内容相同→去重，三步因果链清晰即可判对。"}},{"sec":"基础巩固","type":"判断","num":3,"text":"把重要文件压缩并加密码再上传网盘，比直接上传更安全。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"加密上传安全性判断（应用）。","解题思路":"压缩＋密码再上传：即使云端或传输中被截获，无密码也无法读取内容——比明文直传更安全。","方法点拨":"加密的意义=把“内容安全”转化为“密钥安全”，密文泄露也不怕。"}},{"sec":"能力提升","type":"提升","num":1,"text":"画出“云端—终端”模型简图并标注：终端与云端之间发生了什么。","opts":[],"subs":[],"ans":"终端（手机或电脑）↔网络↔云端（服务器资源池）；终端发送请求取用算力或存储，云端返回结果，按需使用。","al":{"考查点":"云端-终端模型建构（理解+建模）。","解题思路":"简图：终端（手机/电脑）↔网络↔云端（服务器资源池）。箭头含义：终端发送请求按需取用云端算力或存储，云端处理后返回结果。","易错警示":"漏画“网络”中间层或只画单向箭头；须标出“请求—返回”双向。","方法点拨":"画模型图先定三节点（终端/网络/云），再标双向箭头与数据流文字。"}},{"sec":"能力提升","type":"提升","num":2,"text":"解释：为什么两个内容相同的电影文件，在网盘里只占一份空间？","opts":[],"subs":[],"ans":"上传时摘要算法算出相同指纹，系统判定已存在，只新增一个引用而不重复存实体，故只占一份空间。","al":{"考查点":"去重机制解释（理解）。","解题思路":"两个相同电影文件：系统各自算摘要，指纹相同判定内容重复，只保留一份实体+两个引用，故只占一份空间。","易错警示":"勿答“压缩了”，压缩也会占一份体积；本质是去重不是压缩。","方法点拨":"“为什么只占一份”题=指纹比对+只存实体建引用。"}},{"sec":"能力提升","type":"提升","num":3,"text":"排序：安全备份手机照片的合理步骤：A.压缩加密 B.上传云端 C.复制到本地硬盘或异地设备。","opts":[],"subs":[],"ans":"A到B到C（先加密压缩，再上云，再存本地或异地，构成多备份）。","al":{"考查点":"安全备份流程排序（应用）。","解题思路":"合理步骤：先压缩加密（A）保证内容安全→再上传云端（B）作异地备份→再复制到本地硬盘/异地设备（C）构成多份。","易错警示":"“先传云端再加密”则加密动作已晚；加密应在离开本机前完成。","方法点拨":"排序铁律：加密在传输前，备份要分多处。"}},{"sec":"能力提升","type":"提升","num":4,"text":"寿光大棚的监测数据想“既不怕丢又不外泄”。结合本课，给老李三条存储与防护建议。","opts":[],"subs":[],"ans":"①本地硬盘存一份；②加密后传云端一份；③U盘或异地再存一份（三备份）；并设强密码、不乱发共享链接。","al":{"考查点":"云安全迁移本地农业数据（应用）。","解题思路":"三条建议：①本地硬盘存一份；②加密后传云端一份；③U盘或异地再存一份（三备份防丢）；配套：设强密码、不随意发共享链接防泄。","易错警示":"只讲“存云上”不讲加密/密码，防丢不防泄，答不完整。","方法点拨":"“既不怕丢又不外泄”题=备份三处防丢＋加密强密码防泄，双线作答。"}},{"sec":"拓展挑战","type":"拓展","num":1,"text":"奶奶担心“照片存网盘会被别人看到”。请用“公共水厂加指纹”的类比，向奶奶解释云存储是什么、为什么同文件能秒传，以及怎样防止泄露。","opts":[],"subs":[],"ans":"云像自来水厂集中存水，你按需取用不必自家挖井；秒传因系统算指纹相同不再重复存；防泄露：给压缩包加密、设强密码、不随便发共享链接给陌生人。","al":{"考查点":"云存储类比生活化解释（理解+表达）。","解题思路":"面向奶奶：①云像自来水厂集中存水，你按需取用不必自家挖井——解释“存在哪”；②秒传因系统算“指纹”相同不再重复存——解释“为何快”；③防泄露：压缩包加密、强密码、不把共享链接发给陌生人。","易错警示":"面向老人忌术语轰炸（“哈希/资源池”），用“水厂/指纹/锁”生活类比。","方法点拨":"“向长辈解释”三步：类比说明原理→分点讲清三问→落到安全提醒。"}},{"sec":"拓展挑战","type":"拓展","num":2,"text":"方案设计：为家庭的“成长照片与学习资料”设计一份“三备份”方案，写明三处存放位置与一条加密建议。","opts":[],"subs":[],"ans":"①本机电脑一份；②加密压缩传网盘一份；③U盘或异地电脑一份。建议：压缩包设独立强密码，密码记在纸质本不外泄。","al":{"考查点":"三备份家庭方案设计（应用+创造）。","解题思路":"三处存放：①本机电脑（常用）；②加密压缩传网盘（云端异地）；③U盘或异地电脑（第三份）。加密建议：压缩包独立强密码，密码记纸质本不外泄。","易错警示":"三处不能同处一室（同一火灾/失窃全毁），异地是关键。","方法点拨":"“设计备份方案”题=三个物理隔离位置＋一份密码管理规则。"}},{"sec":"变式闯关","type":"变式","num":1,"text":"换场景：同样用“摘要算法等于指纹”原理，解释为什么音乐平台能识别你上传的歌曲是否侵权（与已存曲库重复）。","opts":[],"subs":[],"ans":"平台对曲库与新歌算摘要（指纹），若相同则判定为同一首，可秒判重复或侵权，原理同文件秒传去重。","al":{"考查点":"摘要算法原理迁移（迁移）。","解题思路":"音乐平台识别侵权：对曲库已有歌曲与新上传歌曲各算摘要（指纹），相同则判定同一首，实现秒判重复/侵权——原理与文件秒传去重一致。","易错警示":"须点明“同一原理迁移”，并说清指纹比对流程。","方法点拨":"“换场景”题：找到原场景的算法内核（指纹比对），在新场景（音乐识别）复述一遍。"}},{"sec":"间隔复习","type":"间隔","num":1,"text":"上节课学了互联网创新的三种方式。请举一个“数据打通”的例子，并说明它创造了什么价值。","opts":[],"subs":[],"ans":"（第23课《在线生活创意多》）　示例：物流全程跟踪；下单到签收数据打通，用户随时查进度、企业优化调度，创造透明高效价值。","al":{"考查点":"云存储分工＋摘要算法应用＋安全设计（综合+创造）。","解题思路":"三问三采分面：①分工存储——本地保底＋云端随时访问＋异地第三份（三备份），理由要落到“防单点丢失＋按需访问”；②摘要算法功能——上传算指纹、相同只建索引，检索按标签与时间定位，讲清“去重＋秒传”原理；③防泄露措施成对——分级授权防越权、加密＋限时链接防账号被盗与扩散。","易错警示":"存储策略只写“都放云上”则防不了云意外；防泄露措施须指明“防住哪种风险”。","方法点拨":"“设计师”类方案题：存储答分工、算法答原理、安全答“措施—风险”配对。"}},{"sec":"思维进阶","type":"挑战","num":1,"text":"【真实情境】学校想把历届运动会、文艺汇演的照片视频建成“校园记忆云档案”，让师生按需随时查看，又怕数据丢失或外泄。请你当“云档案设计师”。请写出：①云端与本地应如何分工存储（说明存储策略与理由）；②怎样利用“摘要算法”设计一个防重复上传、快速检索的功能并讲清原理；③设计两条防泄露措施，并说明各防住哪种风险。","opts":[],"subs":[],"open":true,"ans":"参考设计要点：①存储分工：原始照片视频本地留存一份（教育网盘/移动硬盘），云端存\"精选+压缩版\"供随时查看——本地保底防丢失，云端便捷供访问，两端互为备份；②防重与快检：上传时用摘要算法给每个文件算\"指纹\"（哈希值），指纹库比对——相同指纹直接跳过上传（防重复）、检索时按指纹秒定位文件（快速检索），原理是指纹唯一且计算极快；③防泄露措施：一是账号开双因素认证+分级访问权限（防外部盗用），二是敏感人物照片（如涉及个人影像）默认仅校内可见并关闭下载（防内部扩散）。","al":{"考查点":"开放创造：云存储的架构与安全设计（创造+应用）","解题思路":"分工要讲清\"为什么这样放\"；摘要算法要落到\"指纹比对\"的防重与检索两个用途；防泄露措施要与风险类型一一对应","易错警示":"把摘要算法说成\"加密\"——摘要用于比对验证不用于保密；措施与风险不对应","方法点拨":"云档案题公式：分工+理由、指纹+原理、措施+风险成对。"}}]},{"t":"第 26 课 · 配套练习 · 建议用时15分钟","n":"创意展示我家乡","isExam":false,"qs":[{"sec":"回忆热身","type":"回忆","num":1,"text":"制作家乡短视频的六步流程是：主题→脚本→素材→剪辑→字幕配音→____。","opts":[],"subs":[],"ans":"发布（分享）","al":{"考查点":"短视频六步流程（识记）。","解题思路":"六步口诀“主脚素剪字发”：确定主题→撰写脚本→收集素材→剪辑合成→字幕配音→发布分享。末空“发布（分享）”。","易错警示":"勿把“剪辑”当末步，发布分享才是流程终点。","方法点拨":"流程链题先背六步口诀，按“创意→加工→成品”逻辑校验。"}},{"sec":"回忆热身","type":"回忆","num":2,"text":"人机协作中，人定主题把关像____，AI出初稿像____。","opts":[],"subs":[],"ans":"导演；编剧","al":{"考查点":"人机协作角色分工（理解）。","解题思路":"人机协作模型：人定主题、把关质量像“导演”；AI提供初稿、出点子像“编剧”。人掌舵，AI出力。","易错警示":"两空易颠倒；记住“灵魂在人（导演），效率在AI（编剧）”。","方法点拨":"“导演/编剧”比喻是课标级人机分工模型，凡协作题先写这对角色。"}},{"sec":"基础巩固","type":"单选","num":1,"text":"下列不属于短视频六步流程的是：","opts":[{"label":"A","text":"确定主题"},{"label":"B","text":"撰写脚本"},{"label":"C","text":"收集素材"},{"label":"D","text":"购买手机"}],"subs":[],"ans":"答案D　购买手机","al":{"考查点":"短视频流程环节辨析（识记+应用）。","解题思路":"六步=主题、脚本、素材、剪辑、字幕配音、发布。找不属于流程的项。","逐项剖析":"A项确定主题——第一步；B项撰写脚本——第二步；C项收集素材——第三步；D项购买手机——对，工具准备不属于创作流程环节。","易错警示":"“收集素材”与“买设备”易混：素材是内容原料，买设备是前提条件非流程。","方法点拨":"“不属于流程”题：把六步背出逐一对照，落单即答案。"}},{"sec":"基础巩固","type":"单选","num":2,"text":"分镜脚本卡通常不包含下列哪项：","opts":[{"label":"A","text":"镜头"},{"label":"B","text":"景别"},{"label":"C","text":"文案"},{"label":"D","text":"股票代码"}],"subs":[],"ans":"答案D　股票代码","al":{"考查点":"分镜脚本卡要素（识记）。","解题思路":"脚本卡要素：镜头（第几个）、景别（远/中/近/特写）、画面内容、文案、时长等；股票代码与视频创作无关。","逐项剖析":"A项镜头——脚本卡必含；B项景别——必含；C项文案——必含；D项股票代码——对，与创作无关。","易错警示":"景别（远景/近景/特写）是脚本卡核心概念，须记牢。","方法点拨":"脚本卡五要素记忆“镜景文素时”：镜头、景别、文案、素材来源、时长。"}},{"sec":"基础巩固","type":"单选","num":3,"text":"用AI生成短视频文案时，正确的做法是：","opts":[{"label":"A","text":"直接照抄不改"},{"label":"B","text":"先自己写脚本再让AI优化并修改两处"},{"label":"C","text":"完全不让AI参与"},{"label":"D","text":"把AI当最终裁判"}],"subs":[],"ans":"答案B　先自己写脚本再让AI优化并修改两处","al":{"考查点":"AI辅助创作正确姿势（应用+AI伦理）。","解题思路":"正确人机协作：先自己写脚本（思维先行）→AI优化润色→人工修改两处定稿，人始终主导。","逐项剖析":"A项直接照抄不改——思考外包，禁止；B项先自己写脚本再让AI优化并修改两处——对，符合“人定题把关、AI提效”；C项完全不让AI参与——否定工具价值，非最优；D项把AI当最终裁判——决策权应在人。","易错警示":"“完全不用AI”和“全信AI”都失偏颇，正确姿势是L3-L4的人机协作。","方法点拨":"凡AI使用选择题，选含“人先想/人修改/人把关”字眼的选项。"}},{"sec":"基础巩固","type":"单选","num":4,"text":"关于AI辅助创作，下列说法正确的是：","opts":[{"label":"A","text":"AI做的不用标注"},{"label":"B","text":"素材可随意盗用"},{"label":"C","text":"AI帮忙处应显著标注、素材须版权合规"},{"label":"D","text":"作品越假越好"}],"subs":[],"ans":"答案C　AI帮忙处应显著标注、素材须版权合规","al":{"考查点":"AI内容标识与版权合规（理解）。","解题思路":"按《人工智能生成合成内容标识办法》，AI辅助生成内容应显著标注；素材须版权合规、内容健康真实。","逐项剖析":"A项AI做的不用标注——违反标识办法；B项素材可随意盗用——侵权；C项AI帮忙处应显著标注、素材须版权合规——对，透明且合规；D项作品越假越好——违背真实健康导向。","易错警示":"“AI生成须显著标注”是法规要求，2025年9月起施行，须记牢。","方法点拨":"AI创作三底线：内容真实、AI标注、版权合规。"}},{"sec":"基础巩固","type":"判断","num":1,"text":"短视频发布时无需说明哪些部分由AI生成。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"AI内容标识义务（识记）。","解题思路":"按《人工智能生成合成内容标识办法》，AI辅助生成内容应显著标注，保障观众知情权——“无需说明”错误。","易错警示":"“显著标注”不等于片尾小字，须让观众容易看到。","方法点拨":"AI内容标识是国家规定而非可选，判断题遇“无需/不用标注”即错。"}},{"sec":"基础巩固","type":"判断","num":2,"text":"使用网上的图片做视频素材，不用管版权，谁都能用。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"素材版权意识（理解）。","解题思路":"网图有作者与版权，随意使用侵权；应使用无版权（CC0）、已授权或自拍素材。","易错警示":"“网上能搜到=能用”是错误认知，可搜≠可商用。","方法点拨":"素材版权三问：谁拍的？允许商用吗？需要署名吗？"}},{"sec":"基础巩固","type":"判断","num":3,"text":"人是导演、AI是编剧，最终修改与把关权应在学生手中。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"人机协作主体性（理解）。","解题思路":"“人是导演、AI是编剧，最终修改把关权在学生手中”——符合人机协作主体性原则，表述正确。","方法点拨":"判断人机关系正误看“决策权归属”：学生保留价值判断与最终修改权即正确。"}},{"sec":"能力提升","type":"提升","num":1,"text":"为“寿光蔬菜大棚”短视频填写分镜脚本卡（至少两个镜头）：镜头、景别、文案、素材来源。","opts":[],"subs":[],"ans":"镜头1近景：大棚番茄特写，文案“寿光大棚四季鲜”，素材自拍或图库；镜头2中景：菜农采摘，文案“一颗草莓甜透全国”，素材自拍。","al":{"考查点":"分镜脚本卡制作（应用+创造）。","解题思路":"为“寿光蔬菜大棚”写至少两镜头，每镜头四要素：镜头1近景大棚番茄特写＋文案“寿光大棚四季鲜”＋素材自拍/图库；镜头2中景菜农采摘＋文案“一颗草莓甜透全国”＋素材自拍。","易错警示":"漏任一要素（尤其景别与素材来源）脚本卡不完整；文案须与画面呼应。","方法点拨":"脚本卡模板化写作：镜头序→景别→画面→文案→素材，逐格填空。"}},{"sec":"能力提升","type":"提升","num":2,"text":"连线：将人机协作分工连线。①定主题把关 A.编剧（AI） ②出文案初稿 B.导演（人） ③最终修改定稿","opts":[],"subs":[],"ans":"①—B；②—A；③—B（人改定稿）。","al":{"考查点":"人机分工连线（理解）。","解题思路":"①定主题把关——导演（人）B；②出文案初稿——编剧（AI）A；③最终修改定稿——导演（人）B。","易错警示":"③易误连编剧；定稿是人的决策权，必须归导演。","方法点拨":"分工记忆：初始创意与最终决策是人，初稿与发散是AI。"}},{"sec":"能力提升","type":"提升","num":3,"text":"排序：家乡短视频制作合理顺序：A.写分镜脚本 B.确定主题 C.剪辑加字幕 D.收集素材。","opts":[],"subs":[],"ans":"B到A到D到C（先定主题，再脚本，再素材，最后剪辑发布）。","al":{"考查点":"六步流程排序（应用）。","解题思路":"合理顺序：先确定主题（B）→再写分镜脚本（A）→收集素材（D）→剪辑加字幕（C）→配音发布。","易错警示":"素材应在剪辑前收集完毕，勿把剪辑提前。","方法点拨":"流程排序先找“起点（主题）与终点（发布）”，再填中间三步。"}},{"sec":"能力提升","type":"提升","num":4,"text":"寿光同学用AI生成了“蔬菜大棚”文案，但需要人工修改。请指出两处他可能要改的地方并说明原因。","opts":[],"subs":[],"ans":"①把笼统赞美改为具体事实（如“千亩大棚”），更真实；②补充本地口音或亲身感受，避免千篇一律。改后更贴家乡、有温度。","al":{"考查点":"人改定稿的批判性使用（应用+评价）。","解题思路":"AI文案须人工改两处：①把笼统赞美改成具体事实（“千亩大棚”）更真实可信；②补充本地口音、亲身见闻，避免千篇一律。修改让作品贴家乡、有温度。","易错警示":"只写“改错别字”太浅；要指出“AI通病（空泛、套路）→人工补真实细节”。","方法点拨":"“指出AI稿问题”题从真实性、个性化、本土化三角度挑刺。"}},{"sec":"拓展挑战","type":"拓展","num":1,"text":"你是“寿光文旅推介官”，要为家乡设计一条1分钟短视频。请写出主题、三个镜头创意，并说明其中哪部分用AI辅助、怎么标注。","opts":[],"subs":[],"ans":"主题“寿光：从一棵菜到一座城”。镜头：①航拍大棚群；②菜农笑脸特写；③夜市尝鲜。AI辅助文案初稿，片尾标注“文案由AI辅助生成，画面实拍”。","al":{"考查点":"短视频综合创意策划（创造）。","解题思路":"①主题亮眼（“寿光：从一棵菜到一座城”）；②三个镜头创意分景别（航拍大棚群/菜农笑脸特写/夜市尝鲜）；③AI辅助环节与标注方式（AI出文案初稿，片尾标注“文案由AI辅助生成，画面实拍”）。","易错警示":"镜头要“可拍”不要空想特效；标注方式须写明放在哪里。","方法点拨":"“策划一条视频”题三件套：主题句＋分镜表（镜头与景别）＋AI边界说明。"}},{"sec":"拓展挑战","type":"拓展","num":2,"text":"评价：有人用AI生成“虚拟寿光”视频冒充真实记录。请从健康传播与版权标识角度，写两条你的反对理由与一条改进建议。","opts":[],"subs":[],"ans":"理由：①未标注AI易误导观众，违背健康传播；②虚构风景冒充真实侵犯知情权。建议：片中明确标注“AI生成概念片”，并附真实素材对照。","al":{"考查点":"AI虚构内容的伦理批判（评价）。","解题思路":"两条反对理由：①未标注AI易误导观众，违背健康传播与真实性；②虚构风景冒充真实记录侵犯观众知情权，破坏家乡形象可信度。改进建议：片中明确标注“AI生成概念片”并附真实素材对照。","易错警示":"理由须扣“健康传播/知情权/版权标识”知识，不能只凭感觉说“不好”。","方法点拨":"“批判AI乱用”题=理由引法规与伦理概念＋建议落到具体标注动作。"}},{"sec":"变式闯关","type":"变式","num":1,"text":"换场景：同样用“六步流程”，为“班级运动会”设计短视频，写出主题与两个镜头，并指出AI可在哪步帮忙。","opts":[],"subs":[],"ans":"主题“拼搏的瞬间”。镜头1起跑特写、镜头2冲线慢动作。AI可在“脚本或文案”步生成解说词初稿，人再修改定稿。","al":{"考查点":"六步流程迁移（迁移）。","解题思路":"主题“拼搏的瞬间”：镜头1起跑特写、镜头2冲线慢动作。AI可在“脚本/文案”步生成解说词初稿，人修改定稿。","易错警示":"换场景后流程与角色分工不变，须点明AI介入的“具体步骤”。","方法点拨":"“换场景”题：原模板（六步＋人机分工）整体平移，只换内容素材。"}},{"sec":"间隔复习","type":"间隔","num":1,"text":"本单元前面我们学了互联网创新的三种方式。请举一个“工具创新”的例子，并说明它降低了什么门槛。","opts":[],"subs":[],"ans":"（第23课《在线生活创意多》）　示例：AI一键生成PPT；让不擅长设计的人也能快速做出美观幻灯片，降低了设计创作门槛。","al":{"考查点":"短视频全流程策划＋人机协作＋AI标识（创造+评价）。","解题思路":"三问三采分面：①主题+创意卖点——主题要小切口（“一棵菜到一座城”），卖点一句话说清创意钩子；②分镜脚本表——至少三镜头，逐格写镜头/景别/画面/文案，体现从脚本到成片的可执行性；③AI边界——写明哪些环节用AI（文案初稿/字幕润色）、标注放哪（片尾显著标注）、如何保主导（先列真实见闻→AI润色→自己核实数据→人定稿）。","易错警示":"脚本表缺景别、AI标注位置含糊、把AI当主创（人变工具）均扣分。","方法点拨":"“参赛作品策划”题=创意（主题卖点）＋工程（脚本表）＋伦理（AI透明与主体性）三足鼎立。"}},{"sec":"思维进阶","type":"挑战","num":1,"text":"【真实情境】市里办“我的家乡我代言”短视频大赛，要求作品真实、有创意、如实标注AI使用情况。请你当导演，为家乡策划一条参赛作品。请写出：①主题与一句话创意卖点；②分镜脚本表（至少三个镜头：镜头/景别/画面内容/文案）；③说明哪些环节用AI辅助、如何标注，以及你怎样保证“人不被AI带跑”。","opts":[],"subs":[],"open":true,"ans":"参考设计要点：①主题示例\"一颗寿光番茄的四季旅行\"，卖点：\"跟着一颗番茄，看懂一座蔬菜之城\"；②分镜脚本（三镜）：镜头1远景——清晨大棚航拍，文案\"这里的冬天长出春天\"；镜头2近景——番茄特写与菜农笑脸，文案\"四十年种菜史，种进了每一颗的甜\"；镜头3中景——智慧大棚数据屏+年轻人直播，文案\"老手艺遇上新算法\"；③AI辅助环节：用AI生成背景音乐小样与转场字幕初稿，标注\"本片配乐/字幕由AI辅助生成，人工审核后采用\"；保证\"人不被带跑\"的方法：先自己定主题写文案再让AI润色，AI产出逐条人工核验，事实性内容一律以官方资料为准。","al":{"考查点":"开放创造：短视频创作与人机协作规范（创造+评价）","解题思路":"分镜三要素齐全（景别/画面/文案）且有叙事递进；AI环节要\"标注+人工核验\"双合规；\"不被带跑\"落到\"人先想、AI后助、事实人核\"","易错警示":"分镜无景别或文案；AI部分没有标注使用情况不符合大赛要求","方法点拨":"创作题四件套：主题卖点、分镜表、AI标注、人工把关机制。"}}]},{"t":"达标检测","n":"第五单元 互联网创新应用 · 达标检测卷","isExam":true,"qs":[{"sec":"选择题","type":"选择题","num":1,"text":"移动通信代际与应用特征对应正确的是：","opts":[{"label":"A","text":"1G以图文浏览为主"},{"label":"B","text":"2G实现语音通话"},{"label":"C","text":"3G开启图片与网页浏览"},{"label":"D","text":"5G只比4G速度快一点"}],"subs":[],"ans":"答案C　3G开启图片与网页浏览","al":{"考查点":"移动通信代际特征（识记）。","解题思路":"按口诀逐项验证：1G语音、2G短信、3G图文网页、4G视频、5G万物互联。","逐项剖析":"A项1G以图文浏览为主——错，1G只能语音；B项2G实现语音通话——错，语音属1G，2G开启短信；C项3G开启图片与网页浏览——对；D项5G只比4G速度快一点——错，5G关键是万物互联与低时延。","易错警示":"语音/短信/图文/视频四代最易错位，先背口诀再判断。"}},{"sec":"选择题","type":"选择题","num":2,"text":"在线学习的“个性化推荐”主要依赖：","opts":[{"label":"A","text":"生日信息"},{"label":"B","text":"学习行为与数据"},{"label":"C","text":"好友数量"},{"label":"D","text":"手机价格"}],"subs":[],"ans":"答案B　学习行为与数据","al":{"考查点":"个性化推荐的数据基础（理解）。","解题思路":"推荐系统依据学习行为与数据建立用户画像，再以算法匹配课程。","逐项剖析":"A项生日——静态信息无学习价值；B项学习行为与数据——对；C项好友数量——无关；D项手机价格——无关。","易错警示":"“数据加算法”是推荐双引擎，缺一不可。"}},{"sec":"选择题","type":"选择题","num":3,"text":"快递“下单后全程可查物流到哪了”主要体现哪种创新方式？","opts":[{"label":"A","text":"场景创新"},{"label":"B","text":"数据打通"},{"label":"C","text":"工具创新"},{"label":"D","text":"价格创新"}],"subs":[],"ans":"答案B　数据打通","al":{"考查点":"创新方式归类（应用）。","解题思路":"物流全流程可查=各环节数据一处录入、处处共享。","逐项剖析":"A项场景创新——从无到有的新服务，与查询类不符；B项数据打通——对；C项工具创新——新工具降门槛，无关；D项价格创新——非三方式。","方法点拨":"看核心机制：靠数据共享即数据打通。"}},{"sec":"选择题","type":"选择题","num":4,"text":"平台总推同类视频让你视野变窄，这种现象是：","opts":[{"label":"A","text":"数字分身"},{"label":"B","text":"信息茧房"},{"label":"C","text":"云存储"},{"label":"D","text":"网络礼仪"}],"subs":[],"ans":"答案B　信息茧房","al":{"考查点":"信息茧房概念（理解）。","解题思路":"平台按偏好持续推同类→视野收窄。","逐项剖析":"A项数字分身——AI虚拟形象；B项信息茧房——对；C项云存储——存储服务；D项网络礼仪——交流规范。","易错警示":"茧房=算法＋偏好＋视野变窄三者叠加。"}},{"sec":"选择题","type":"选择题","num":5,"text":"同一文件第二次上传却“秒传”完成，靠的是：","opts":[{"label":"A","text":"网速突然变快"},{"label":"B","text":"摘要算法算出指纹相同"},{"label":"C","text":"文件被自动删除"},{"label":"D","text":"平台免费"}],"subs":[],"ans":"答案B　摘要算法算出指纹相同","al":{"考查点":"秒传与摘要算法（理解）。","解题思路":"系统算文件“指纹”（摘要），与已存相同即免重复上传。","逐项剖析":"A项网速变快——秒传与网速无关；B项摘要算法算出指纹相同——对；C项文件被删除——矛盾；D项平台免费——无关。","易错警示":"秒传≠快网速，是“去重”机制。"}},{"sec":"选择题","type":"选择题","num":6,"text":"短视频人机协作中，AI的角色更接近：","opts":[{"label":"A","text":"导演定题"},{"label":"B","text":"编剧出初稿"},{"label":"C","text":"最终裁判"},{"label":"D","text":"替代思考"}],"subs":[],"ans":"答案B　编剧出初稿","al":{"考查点":"人机协作角色（理解）。","解题思路":"人定题把关像导演，AI出初稿像编剧，人改定稿。","逐项剖析":"A项导演定题——那是人的角色；B项编剧出初稿——对；C项最终裁判——决策权在人；D项替代思考——思考外包是禁区。","方法点拨":"“导演/编剧”分工模型是人机协作核心考点。"}},{"sec":"判断题","type":"判断题","num":1,"text":"我国5G基站占全球六成以上，用户规模全球第一。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"我国5G建设成就（识记）。","解题思路":"教材数据：我国5G基站占全球60%以上、用户规模全球第一。","易错警示":"“六成以上”须与“全球第一”绑定记忆。"}},{"sec":"判断题","type":"判断题","num":2,"text":"在线学习能完全取代线下课堂，无需混合学习。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"线上线下学习关系（评价）。","解题思路":"“完全取代”过于绝对：线下互动监督强、线上灵活资源多，混合学习最优。","易错警示":"绝对化表述多为错。"}},{"sec":"判断题","type":"判断题","num":3,"text":"数字人民币是法定数字货币，可无网支付、可控匿名。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"数字人民币属性（识记）。","解题思路":"数字人民币=法定数字货币，等同现金，可控匿名、支持无网支付——表述与教材一致。"}},{"sec":"判断题","type":"判断题","num":4,"text":"遭遇网络欺凌应沉默忍受，以免惹麻烦。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"网络欺凌应对（应用）。","解题思路":"正确做法=截图留证＋求助老师家长＋平台举报；沉默忍受会纵容欺凌。","方法点拨":"反欺凌“留证—求助—举报”六字诀。"}},{"sec":"判断题","type":"判断题","num":5,"text":"云存储文件绝对安全，永不丢失也不会泄露。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"云存储安全认知（评价）。","解题思路":"云服务仍有账号被盗、中断、泄露风险，“绝对安全”不成立。","易错警示":"“永远/绝对”即陷阱词。"}},{"sec":"填空题","type":"填空题","num":1,"text":"移动通信五世代中，4G以____为主，5G实现万物互联。","opts":[],"subs":[],"ans":"视频（视频直播）","al":{"考查点":"代际填空（识记）。","解题思路":"口诀“1语2信3图4频5物联”：4G以视频为主。","易错警示":"4G主特征是视频，勿填图文（3G）。"}},{"sec":"填空题","type":"填空题","num":2,"text":"在线学习三大突破：突破时空、突破人数、____。","opts":[],"subs":[],"ans":"海量资源","al":{"考查点":"在线学习三大突破（识记）。","解题思路":"三大突破=突破时空、突破人数、海量资源。"}},{"sec":"填空题","type":"填空题","num":3,"text":"互联网创新三方式：数据打通、场景创新、____。","opts":[],"subs":[],"ans":"工具创新","al":{"考查点":"创新三方式（识记）。","解题思路":"三方式=数据打通、场景创新、工具创新。"}},{"sec":"填空题","type":"填空题","num":4,"text":"建设数字形象要从内容、礼仪、____三方面经营。","opts":[],"subs":[],"ans":"隐私","al":{"考查点":"数字形象三方面（识记）。","解题思路":"三方面=内容、礼仪、隐私。"}},{"sec":"填空题","type":"填空题","num":5,"text":"安全备份“三备份”指本地、云端、____。","opts":[],"subs":[],"ans":"异地","al":{"考查点":"三备份原则（识记）。","解题思路":"三备份=本地、云端、异地。","方法点拨":"口诀“本地＋云端＋异地，鸡蛋分篮放”。"}},{"sec":"填空题","type":"填空题","num":6,"text":"短视频六步流程最后一步是____。","opts":[],"subs":[],"ans":"发布（分享）","al":{"考查点":"短视频六步流程（识记）。","解题思路":"六步=主题→脚本→素材→剪辑→字幕配音→发布，末步为发布。"}},{"sec":"简答题","type":"简答题","num":1,"text":"用“水管变粗”类比，解释为什么5G能让远程手术、自动驾驶等新应用成为可能（8分）。","opts":[],"subs":[],"ans":"带宽如水管，越粗能承载内容越丰富（2分）。5G大带宽、低时延，使高清画面与操控信号实时传输（3分）；而3G、4G时延高难支撑，故新应用依赖5G特性（3分）。","al":{"考查点":"带宽驱动模型解释5G新应用（应用）。","解题思路":"水管类比：带宽越粗承载越丰富（2分）。5G大带宽低时延使高清画面与操控信号实时传输（3分）；3G/4G时延高难支撑，故新应用依赖5G（3分）。","易错警示":"须含“对比旧代际”才完整。","方法点拨":"答题链=类比＋5G特性＋旧网瓶颈。"}},{"sec":"简答题","type":"简答题","num":2,"text":"请回答：（1）互联网创新的三种方式是什么（6分）；（2）以“信息茧房”为例，说明算法推荐可能带来的问题及一条破解办法（6分）。","opts":[],"subs":[],"ans":"（1）数据打通、场景创新、工具创新（每点2分）。（2）问题：平台按偏好持续推同类，视野变窄（3分）；破解：主动搜索不同领域、关注多元账号（3分）。","al":{"考查点":"创新方式＋茧房双知识点（应用）。","解题思路":"（1）三方式各2分：数据打通、场景创新、工具创新。（2）问题：算法按偏好持续推同类使视野变窄（3分）；破解：主动搜索不同领域、关注多元账号（3分）。","易错警示":"茧房破解要“主动”，勿写“卸载App”。"}},{"sec":"案例分析题","type":"案例分析题","num":1,"text":"寿光某合作社用物联网传感器采集大棚温湿度，数据上传云端，社员手机查看，还与物流、电商数据打通，消费者扫码即可溯源。请分析：（1）这体现了哪些互联网创新方式（6分）；（2）数据上传云端用了本课哪种技术原理，如何保障数据不丢不泄（9分）。","opts":[],"subs":[],"ans":"（1）数据打通（传感、云端、物流、电商一处录入处处共享）、工具创新（物联网与直播工具）（每点3分）。（2）用云计算（云端到终端模型）按需取用远程资源（3分）；保障：三备份（本地加云端加异地）防丢（3分），加密压缩、强密码、谨慎共享链接防泄（3分）。","al":{"考查点":"创新方式与云安全综合案例（综合）。","解题思路":"（1）数据打通（传感/云端/物流/电商一处录入处处共享）＋工具创新（物联网与直播工具），各3分。（2）原理：云计算——终端按需取用云端资源（3分）；防丢：三备份本地+云端+异地（3分）；防泄：加密压缩＋强密码＋谨慎分享（3分）。","方法点拨":"案例题先定位“数据流向”，再按“防丢/防泄”分线作答。"}},{"sec":"综合实践题","type":"综合实践题","num":1,"text":"你是寿光文旅小使者，要为家乡设计一份《寿光文旅数字推广方案》，须融合本单元多课知识，要求包含：（1）用移动互联或5G设想一个沉浸式体验项目（5分）；（2）用在线学习思路规划“云游寿光”公开课（5分）；（3）用创新三方式设计两个推广新场景（5分）；（4）用云服务设计游客数据备份与分享方案（5分）；（5）用短视频六步加人机协作策划一条推介视频（5分）。","opts":[],"subs":[],"ans":"评分要点：（1）如5G加VR云逛大棚，体现大带宽低时延（5分）；（2）国家平台开“蔬菜之乡”课，突破时空人数（5分）；（3）场景创新如直播带货文旅、工具创新如AI导游（各2.5分）；（4）云端存游客照片，三备份加加密分享（5分）；（5）六步流程清晰，人定题AI出文案并标注（5分）。整体体现跨课综合与科技向善。","al":{"考查点":"跨课综合方案设计（创造+评价）。","解题思路":"五问采分面：（1）5G+VR云逛大棚，体现大带宽低时延（5分）；（2）国家平台“蔬菜之乡”公开课，突破时空人数（5分）；（3）场景创新（直播带货文旅）＋工具创新（AI导游）（5分）；（4）游客数据云备份三备份＋加密分享（5分）；（5）短视频六步＋人定题AI出文案并标注（5分）。","易错警示":"每问须“用对知识”，综合卷按采分点得分，未用的单元知识不会自动得分。","方法点拨":"综合实践题先拆五问，每问标出对应知识与关键词再作答，宁分点勿整段。"}}]}]},{"t":"第六单元 共同守护互联网","isFinal":false,"lessons":[{"t":"第 27 课 · 配套练习 · 建议用时15分钟","n":"个人信息防泄露","isExam":false,"qs":[{"sec":"回忆热身","type":"回忆","num":1,"text":"姓名、电话、住址等一旦被他人非法获取并用于牟利，就发生了____。","opts":[],"subs":[],"ans":"个人信息泄露（隐私泄露）","al":{"考查点":"个人信息泄露概念（识记）。","解题思路":"姓名、电话、住址等个人信息一旦被非法获取并用于牟利，即构成“个人信息泄露（隐私泄露）”。","易错警示":"泄露的关键是“未经同意被获取+可能被利用”，不只是“被看到”。","方法点拨":"凡涉个人信息保护概念题，抓住“非法获取+用于牟利”两个要件。"}},{"sec":"回忆热身","type":"回忆","num":2,"text":"不同账号应使用不同密码，这一做法叫“____”；在密码之外再验证短信或指纹，叫____。","opts":[],"subs":[],"ans":"一密一用；双因素认证","al":{"考查点":"密码管理与双因素认证术语（识记）。","解题思路":"“不同账号不同密码”叫“一密一用”；在密码之外叠加短信验证码、指纹等第二重验证叫“双因素认证”。","易错警示":"两术语易颠倒：一密一用管“密码不重复”，双因素管“多一道锁”。","方法点拨":"防护三宝捆绑记忆：强密码（一密一用）＋双因素认证＋最小授权。"}},{"sec":"基础巩固","type":"单选","num":1,"text":"下列场景中，最容易导致个人信息泄露的是：","opts":[{"label":"A","text":"在正规平台购物填真实地址"},{"label":"B","text":"随手把快递单扔掉不撕毁"},{"label":"C","text":"用官方App缴纳话费"},{"label":"D","text":"在单位加密WiFi办公"}],"subs":[],"ans":"答案B　随手把快递单扔掉不撕毁","al":{"考查点":"泄露途径识别（应用）。","解题思路":"找“最易泄露”场景：含姓名电话住址的快递单被随意丢弃，等于把隐私直接交给收集者。","逐项剖析":"A项正规平台购物填真实地址——正规渠道有保护机制，属正常使用；B项随手把快递单扔掉不撕毁——对，面单信息裸露易被收集倒卖；C项用官方App缴费——官方渠道相对可信；D项单位加密WiFi办公——加密网络有基本防护。","易错警示":"勿把“一切填真实信息”当泄露，泄露的区分在渠道是否正规、信息是否被不当处置。","方法点拨":"泄露途径题按“信息暴露面”判断：撕碎/打码快递单是标配动作。"}},{"sec":"基础巩固","type":"单选","num":2,"text":"妈妈用“123456”做所有账号密码，最合理的建议是：","opts":[{"label":"A","text":"这样好记没毛病"},{"label":"B","text":"改成生日更个性"},{"label":"C","text":"不同账号设强密码并开双因素认证"},{"label":"D","text":"密码越短越好记"}],"subs":[],"ans":"答案C　不同账号设强密码并开双因素认证","al":{"考查点":"密码安全建议（应用）。","解题思路":"“123456”做所有账号密码，一处泄露则全盘沦陷。最优解=不同账号设强密码（一密一用）＋开双因素认证。","逐项剖析":"A项这样好记没毛病——忽视安全；B项改成生日更个性——生日易被猜到，是弱密码；C项不同账号设强密码并开双因素认证——对，防连锁泄露；D项密码越短越好记——短密码极易被破解。","易错警示":"“生日、手机号”是中国人最爱用也最易破的弱密码，须警示。","方法点拨":"密码三不：不用生日、不共用、不设短；三要：要长、要乱、要一密一用。"}},{"sec":"基础巩固","type":"单选","num":3,"text":"收到“好友”视频借钱，画面像本人却疑为AI换脸。最稳妥的做法是：","opts":[{"label":"A","text":"立刻转账帮忙"},{"label":"B","text":"让其做指定动作并电话核实"},{"label":"C","text":"把视频发朋友圈"},{"label":"D","text":"直接拉黑对方"}],"subs":[],"ans":"答案B　让其做指定动作并电话核实","al":{"考查点":"AI换脸诈骗识别（应用）。","解题思路":"眼见不一定为实：AI换脸可高度仿真。稳妥做法=实时互动验证（让其做指定动作）＋官方渠道电话核实，双通道确认。","逐项剖析":"A项立刻转账帮忙——正中骗子下怀；B项让其做指定动作并电话核实——对，动态验证+多渠道确认戳穿深度伪造；C项把视频发朋友圈——扩散隐私且无助于核实；D项直接拉黑对方——若真是好友则误伤，应核实而非拉黑。","易错警示":"“像本人”不等于“是本人”，深度伪造时代要建立“眼见不为实”的警觉。","方法点拨":"防AI诈骗口诀：要钱先验证——指定动作+回拨原号码，双保险再转账。"}},{"sec":"基础巩固","type":"单选","num":4,"text":"依据《个人信息保护法》，平台收集用户信息应遵循的原则是：","opts":[{"label":"A","text":"想收就收"},{"label":"B","text":"最小必要且经同意"},{"label":"C","text":"全部公开"},{"label":"D","text":"只收不准删"}],"subs":[],"ans":"答案B　最小必要且经同意","al":{"考查点":"个人信息保护法原则（识记）。","解题思路":"《个人信息保护法》确立“知情同意、最小必要”原则：平台收集信息须告知并获同意，且只收与业务相关的最少信息。","逐项剖析":"A项想收就收——违法；B项最小必要且经同意——对，法律核心原则；C项全部公开——违背保护；D项只收不准删——法律保障删除权。","易错警示":"“最小必要”与“经同意”两个关键词缺一不可。","方法点拨":"凡问平台收集信息原则，标准答案=知情同意＋最小必要。"}},{"sec":"基础巩固","type":"判断","num":1,"text":"只要不上网，个人信息就绝对安全，无需任何防护。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"线下泄露风险认知（评价）。","解题思路":"“不上网就绝对安全”是误区：快递单、办卡登记、纸质表单等线下场景同样泄露信息。","易错警示":"“绝对”是陷阱词；泄露不只发生在网络。","方法点拨":"凡“绝对/只要…就”判断，先想线下或非常规场景找反例。"}},{"sec":"基础巩固","type":"判断","num":2,"text":"连接公共场所无需密码的免费WiFi一般很安全。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"公共WiFi安全（理解）。","解题思路":"无需密码的公共WiFi可能被不法分子架设劫持，嗅探账号密码（中间人攻击），不安全。","方法点拨":"免费WiFi风险=传输被监听，敏感操作应走加密网络（HTTPS/自己热点/手机流量）。"}},{"sec":"基础巩固","type":"判断","num":3,"text":"发现有人用AI换脸冒充自己视频诈骗，应及时向平台和警方举报。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"AI诈骗举报意识（理解）。","解题思路":"用AI换脸冒充诈骗是新型犯罪，发现后向平台与警方举报是正确的止损与维权方式。","方法点拨":"诈骗类事件处置三步：停止转账→保留证据→平台与警方双举报。"}},{"sec":"能力提升","type":"提升","num":1,"text":"连线：把下列防护做法与名称连线（写序号）。①不同账号不同密码 ②密码加短信验证码 ③只授权必要权限｜A.双因素认证 B.最小授权 C.一密一用","opts":[],"subs":[],"ans":"①—C；②—A；③—B","al":{"考查点":"防护技能归类连线（识记）。","解题思路":"①不同账号不同密码——一密一用（C）；②密码加短信验证码——双因素认证（A）；③只授权必要权限——最小授权（B）。","易错警示":"短信验证码是“第二因素”的典型，勿与最小授权混淆。","方法点拨":"连线先译术语：验证码=双因素、权限=最小授权、密码区分=一密一用。"}},{"sec":"能力提升","type":"提升","num":2,"text":"排序：下列“网购信息流转”环节按真实顺序排成一条链（写序号）。①支付（银行卡号） ②注册（手机号） ③物流（姓名电话） ④下单（收货地址）","opts":[],"subs":[],"ans":"②→④→①→③（注册→下单→支付→物流）","al":{"考查点":"信息流转链排序（理解）。","解题思路":"网购全流程：先注册（手机号②）→再下单（收货地址④）→支付（银行卡①）→物流配送（姓名电话③）。","易错警示":"注册在最先（没有账号无法下单），支付在物流之前。","方法点拨":"“流转即风险”题：信息每经一站就多一份暴露，排序即走一遍真实购物流程。"}},{"sec":"能力提升","type":"提升","num":3,"text":"写出两个身边可能的个人信息泄露途径，并各说一句防护办法。","opts":[],"subs":[],"ans":"示例：①社交平台晒含定位照片→关闭定位或打码；②点击陌生钓鱼链接→不点不明链接、核验网址。","al":{"考查点":"泄露途径与防护迁移（应用）。","解题思路":"途径须来自身边真实场景并与防护一一对应：①社交平台晒含定位照片→关闭定位/发布前打码；②点击陌生钓鱼链接→不点不明链接、先核验网址。","易错警示":"“途径—防护”必须成对，只写途径不写防护扣一半分。","方法点拨":"写“身边泄露途径”从四口想：口（说出去的）、手（点出去的）、单（扔出去的）、晒（发出去的）。"}},{"sec":"能力提升","type":"提升","num":4,"text":"为什么老师说“信息每经过一站都可能被复印”？用“快递流转”类比说明。","opts":[],"subs":[],"ans":"信息像快递在注册、下单、支付、物流间传递，每站都可能被记录或截获，故流动即风险，需在每站设防。","al":{"考查点":"流转即风险类比（理解）。","解题思路":"信息像快递在注册、下单、支付、物流各站传递，每站都可能被记录或截获（“复印”），所以流动即风险，须在每一站设防。","易错警示":"须点明“每一站都可能被复印”与“逐站设防”两个要点。","方法点拨":"类比题把“快递员/中转站”映射“信息/处理方”，说清为什么中转越多风险越大。"}},{"sec":"拓展挑战","type":"拓展","num":1,"text":"两难：表哥发来“免费领皮肤”链接，点开要填游戏账号和密码。你很想要皮肤，又怕被盗号。请写出处置方案（至少三步）。","opts":[],"subs":[],"ans":"①不填账号密码，免费领皮肤多为钓鱼；②提醒表哥链接可能带毒别填；③用官方渠道核实活动真伪，必要时举报。理由：想要不等于冒险，先验证再行动。","al":{"考查点":"两难情境多步处置（应用+决策）。","解题思路":"三步处置：①不填账号密码——“免费领皮肤”多为钓鱼诱饵；②提醒表哥链接可能带毒，别转别填；③用官方渠道核实活动真伪，必要时举报。理由：想要不等于冒险，先验证再行动。","易错警示":"“很想要皮肤就填”是危险选项；处置必须包含“提醒他人”一环。","方法点拨":"两难处置题模板：自己不碰→提醒身边人→官方核实→必要时举报，四步缺一不可。"}},{"sec":"拓展挑战","type":"拓展","num":2,"text":"责任行动：以“校园网络安全卫士”身份，为班级写一条《个人信息保护》倡议（含警示、措施、法律依据三点）。","opts":[],"subs":[],"ans":"警示——快递单、不明WiFi正偷走隐私；措施——一密一用、双因素认证、最小授权、不点钓鱼链接；依据——《个人信息保护法》规定最小必要与知情同意。","al":{"考查点":"公共倡议写作（综合+责任）。","解题思路":"倡议三点：警示（快递单、不明WiFi正在偷走隐私）＋措施（一密一用、双因素、最小授权、不点钓鱼链接）＋法律依据（《个人信息保护法》的最小必要与知情同意）。","易错警示":"倡议须同时含“警示—措施—依据”三要素，缺法律依据则高度不足。","方法点拨":"“倡议书”题公式：一句警示立危机→一串措施给方法→一条法律立依据。"}},{"sec":"变式闯关","type":"变式","num":1,"text":"换场景：物业说“刷脸进楼更安全，请把人脸交给门禁公司”。这与网上填资料有何相同风险？如何既方便又防护？","opts":[],"subs":[],"ans":"人脸属敏感生物信息，泄露难更改；可问清用途与保存方式、确认最小必要，必要时用门禁卡替代，并索要授权说明。","al":{"考查点":"AI诈骗防范＋个人信息保护全流程设计（综合+创造）。","解题思路":"按三问设计：①识别可疑信号（至少两条）——如“视频画面轻微卡顿/口型不同步”“催促立刻转账不许挂断”“避开官方渠道只让转私人账户”；②家庭反诈机制——约定专属“反诈暗号”（一句只有家人知道的话），遇AI换脸要钱先对暗号＋指定动作＋回拨原号码，双通道验证；③泄露后处置——立即冻结相关账户、修改密码（一密一用）、开启双因素认证、保存证据并向平台与警方（12377/110）举报。","易错警示":"只教“别信”不教“怎么验”不算方案；处置阶段勿漏“改密+举报”闭环。","方法点拨":"“防诈方案”题按时间线作答：事前（信号识别+暗号）→事中（验证动作）→事后（止损+举报）。"}},{"sec":"间隔复习","type":"间隔","num":1,"text":"上节课我们用云工具协作完成了家乡创意展示。请回忆：多人同时编辑时，怎样避免互相覆盖内容？","opts":[],"subs":[],"ans":"（第26课《创意展示我家乡》）　分工分区编辑（各管各的板块）、编辑前先刷新获取最新版本、约定提交节奏并利用平台的版本历史恢复误删内容。","al":{"考查点":"云端协作的冲突避免策略（应用）。","解题思路":"核心三招：分区、同步、版本历史；平台\"自动保存+历史版本\"是兜底保障。","易错警示":"\"大家同时改同一页\"正是覆盖事故的根源，答\"小心点\"不得分。","方法点拨":"协作规则题按\"分工—同步—恢复\"三层作答最完整。"}},{"sec":"间隔复习","type":"间隔","num":2,"text":"分享作品链接时，应设置哪些权限来保护作品与个人信息？","opts":[],"subs":[],"ans":"（第26课《创意展示我家乡》）　设置为\"指定成员可查看/评论\"而非公开分享；关闭匿名编辑；不在作品页面暴露真实姓名、班级、住址等个人信息（可用昵称或集体署名）。","al":{"考查点":"分享权限与隐私保护（应用）。","解题思路":"权限按\"最小可见\"原则：只给需要的人；个人信息按\"最小披露\"原则：能不写就不写。","易错警示":"图省事选\"所有人可编辑\"，等于把作品和隐私同时裸奔。","方法点拨":"分享前自查两问：\"谁能看？泄露了什么？\""}},{"sec":"思维进阶","type":"挑战","num":1,"text":"【真实情境】奶奶接到“孙子”的视频电话，画面是熟悉的脸，却开口就要两万元“急用”，还叮嘱“别告诉爸妈”。请你为家庭设计一套“反AI诈骗演练方案”。请写出：①识别这类诈骗的两条可疑信号；②设计一个家庭“反诈验证机制”（如专属暗号、指定动作、回拨原号码等，至少两条措施并说明作用）；③若家人已转账被骗，写出后续处置流程（至少三步）。","opts":[],"subs":[],"open":true,"ans":"参考设计要点：①可疑信号：视频里\"孙子\"回避做指定动作（如眨眼挥手验证）或画质忽真忽假；开口即谈钱、催得急且\"不让告诉父母\"——凡涉钱+催促+隔离三合一，高度可疑；②家庭验证机制：设置只有家人知道的\"专属暗号\"，凡借钱先对暗号；要求对方当场做指定动作（如用左手摸鼻子）验证真人与AI换脸的区别；挂断后回拨孙子常用号码核实；③已转账处置：立即拨打110并保留转账记录与聊天截图→联系银行申请止付冻结→告知社区反诈中心并配合提供证据，同时安慰老人不二次受骗。","al":{"考查点":"开放创造：AI诈骗的识别与家庭防御设计（创造+应用）","解题思路":"识别信号要同时覆盖\"技术破绽\"与\"话术破绽\"；验证机制至少两条且各有作用说明；处置流程三步有先后","易错警示":"只写\"多留心\"没有可操作信号；处置漏\"银行止付\"这一黄金步骤","方法点拨":"反诈题三段：识破绽→设机制→急处置，钱的事永远先打110。"}}]},{"t":"第 28 课 · 配套练习 · 建议用时15分钟","n":"数字版权要保护","isExam":false,"qs":[{"sec":"回忆热身","type":"回忆","num":1,"text":"作品一经创作完成即自动受保护，无需登记，这叫“____”原则。","opts":[],"subs":[],"ans":"创作即享有","al":{"考查点":"版权自动保护原则（识记）。","解题思路":"我国著作权法实行“创作即享有”：作品一经创作完成即自动受保护，无需登记注册。","易错警示":"勿把“登记”当获权前提——登记是加强证据，不是权利来源。","方法点拨":"“创作即享有”是版权第一原则，记忆点=自动、无需登记。"}},{"sec":"回忆热身","type":"回忆","num":2,"text":"判断使用他人作品是否侵权，可问“四问”：目的是否学习、____是否适当、是否署名、是否影响原作者____。","opts":[],"subs":[],"ans":"数量（用量）；收益","al":{"考查点":"合理使用四问（识记）。","解题思路":"四问：目的是否学习、数量（用量）是否适当、是否署名、是否影响原作者收益。题干给出首尾，中两空分别为“数量（用量）”与“收益”。","易错警示":"第二问是“用量”不是“时间长短”；末问落脚“收益”。","方法点拨":"四问浓缩为“目的—用量—署名—收益”，判断侵权先过四问。"}},{"sec":"基础巩固","type":"单选","num":1,"text":"下列属于侵犯数字版权的是：","opts":[{"label":"A","text":"下载正版音乐付费收听"},{"label":"B","text":"作文里引用资料并注明出处"},{"label":"C","text":"把付费字体用于店招盈利"},{"label":"D","text":"观看免费授权视频"}],"subs":[],"ans":"答案C　把付费字体用于店招盈利","al":{"考查点":"版权侵权识别（应用）。","解题思路":"找侵权项：付费字体有使用授权边界，未经许可用于店招营利即超出授权、构成侵权。","逐项剖析":"A项下载正版音乐付费收听——付费即获授权，合法；B项作文里引用资料并注明出处——合理使用；C项把付费字体用于店招盈利——对，商用超出个人授权范围属侵权；D项观看免费授权视频——在授权范围内，合法。","易错警示":"“买了字体”≠“可随意商用”，个人版与商用版授权不同，须看授权范围。","方法点拨":"侵权题先问“用途是否超出授权”：学习引用→合理，商用牟利→侵权。"}},{"sec":"基础巩固","type":"单选","num":2,"text":"同学把网上图片去掉水印、署自己名参赛。主要侵犯原作者的：","opts":[{"label":"A","text":"财产权"},{"label":"B","text":"署名权（人身权）"},{"label":"C","text":"肖像权"},{"label":"D","text":"名誉权"}],"subs":[],"ans":"答案B　署名权（人身权）","al":{"考查点":"署名权（人身权）辨析（理解）。","解题思路":"去掉水印、署自己名参赛：隐瞒真实作者、冒名顶替，侵犯作者的署名权——版权中的人身权。","逐项剖析":"A项财产权——指复制发行等经济权益，此题核心是“冒名”；B项署名权（人身权）——对，去水印改署名的本质是侵占署名；C项肖像权——针对人像，图片未必含人像；D项名誉权——针对人格评价，非本题。","易错警示":"“去水印+改名”直指署名权；即使图片不商用也侵犯署名权。","方法点拨":"“署名权（人身权）vs财产权”判别：涉“冒充/不署名/改署名”即人身权。"}},{"sec":"基础巩固","type":"单选","num":3,"text":"用AI生成一张图发朋友圈，最恰当的做法是：","opts":[{"label":"A","text":"说是自己手绘的"},{"label":"B","text":"标注“AI生成”并说明来源"},{"label":"C","text":"随便商用赚钱"},{"label":"D","text":"不标注直接参赛"}],"subs":[],"ans":"答案B　标注“AI生成”并说明来源","al":{"考查点":"AI生成内容标识（应用）。","解题思路":"按《人工智能生成合成内容标识办法》，AI生成图发布应显著标注“AI生成”并说明来源，尊重原创与观众知情权。","逐项剖析":"A项说是自己手绘的——隐瞒AI来源，不诚信；B项标注“AI生成”并说明来源——对；C项随便商用赚钱——AI图商用仍须看平台授权与素材权利；D项不标注直接参赛——违反标识要求。","易错警示":"AI生成≠免费无主，使用仍须标注来源、尊重他人权利。","方法点拨":"凡涉AI内容，正确项必含“标注/标识/说明来源”。"}},{"sec":"基础巩固","type":"单选","num":4,"text":"“合理使用四问”区分“借书读”与“抄书卖”的关键是看：","opts":[{"label":"A","text":"是否好看"},{"label":"B","text":"是否影响原作者收益"},{"label":"C","text":"是否彩色"},{"label":"D","text":"是否在新平台"}],"subs":[],"ans":"答案B　是否影响原作者收益","al":{"考查点":"合理使用与侵权边界（理解）。","解题思路":"“借书读”合法（学习借鉴），“抄书卖”违法（盗版牟利），核心区别在是否影响原作者收益。","逐项剖析":"A项是否好看——无关；B项是否影响原作者收益——对，四问之末问是关键标尺；C项是否彩色——无关；D项是否在新平台——平台无关紧要。","易错警示":"边界判据是“对原作者权益的影响”，不是“是否付费或在哪发布”。","方法点拨":"“借与抄”判别一句话：个人学习借鉴不损收益合法，复制传播牟利损收益违法。"}},{"sec":"基础巩固","type":"判断","num":1,"text":"网上图片“免费看”就等于“可以免费商用”。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"观看权与使用权区分（理解）。","解题思路":"“免费看”只代表可在线观看（浏览权），不代表获得复制、商用等使用权；商用常需另获授权。","易错警示":"“能看=能用=能卖”是版权三大误区之首。","方法点拨":"把权利拆层：看（浏览）＜存（复制）＜用（传播）＜卖（商用），越往后越需授权。"}},{"sec":"基础巩固","type":"判断","num":2,"text":"用区块链存证能为原创作品留下权属证据，有助于维权。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"区块链存证价值（理解）。","解题思路":"区块链存证将作品信息与时间戳写入不可篡改的链上记录，为原创留下权属证据，维权时举证有力。","方法点拨":"新技术保护版权思路：先“留痕”（时间戳存证）再“维权”（举证起诉）。"}},{"sec":"基础巩固","type":"判断","num":3,"text":"自己用AI写的作文交作业，不算侵权，所以无需任何标注。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"AI写作的使用规范（评价）。","解题思路":"“AI写作文不算侵权故无需标注”有两处错误：①AI生成内容依规应标注来源；②作业须自己消化理解，直接交AI稿属于学习外包、冒充实写。","易错警示":"“不侵权”≠“可冒充原创”，学术诚信与标注义务是两回事。","方法点拨":"AI辅助作业三问：标了吗？懂了吗？是自己的思考吗？"}},{"sec":"能力提升","type":"提升","num":1,"text":"连线：版权客体与例子配对（写序号）。①文字 ②音乐 ③软件 ④视频｜A.自编小程序 B.原创歌曲 C.短视频 D.日记","opts":[],"subs":[],"ans":"①—D；②—B；③—A；④—C","al":{"考查点":"版权客体归类（识记）。","解题思路":"版权保护客体五类（文字/音乐/软件/视频/美术等）：①文字—D日记；②音乐—B原创歌曲；③软件—A自编小程序；④视频—C短视频。","易错警示":"“短视频”是视频类版权客体，勿与软件混淆；自编小程序属软件版权。","方法点拨":"客体归类按“表达形式”而非“载体”：歌是音乐、代码是软件、片是视频。"}},{"sec":"能力提升","type":"提升","num":2,"text":"用“借书读和抄书卖”类比，说明合理使用与侵权的边界。","opts":[],"subs":[],"ans":"借书读是学习借鉴（合法），抄书卖是盗版牟利（违法）；判断看是否适量、是否署名、是否损及原作者收益。","al":{"考查点":"合理使用边界类比（理解）。","解题思路":"“借书读”=个人学习借鉴，适量、署名、不损收益→合理使用；“抄书卖”=复制传播牟利、损及原作者收益→侵权。边界四问：目的/用量/署名/收益。","易错警示":"只答“借合法抄违法”不答“边界标准（四问）”得一半分。","方法点拨":"类比题收尾必回扣“四问”判据，形成闭环。"}},{"sec":"能力提升","type":"提升","num":3,"text":"排序：小明想合法使用网络素材，正确步骤（写序号）。①注明作者与来源 ②确认授权许可 ③搜免费素材库 ④用于作业","opts":[],"subs":[],"ans":"③→②→①→④","al":{"考查点":"合法使用素材流程（应用）。","解题思路":"正确步骤：先到免费素材库搜可用素材（③）→确认授权许可范围（②）→使用并注明作者来源（①）→用于作业（④）。","易错警示":"“确认授权”必须先于“使用”，边用边找授权是常见错误。","方法点拨":"素材使用四步口诀“搜—看权—署名—再用”。"}},{"sec":"能力提升","type":"提升","num":4,"text":"数字水印、加密、授权管理（CC协议）分别怎样保护版权？各用一句话。","opts":[],"subs":[],"ans":"数字水印隐形标记归属便于溯源；加密防止未授权复制传播；授权管理明确使用条件与范围。","al":{"考查点":"版权保护技术作用（理解）。","解题思路":"三种技术各司其职：数字水印——隐形标记归属便于溯源；加密——防止未授权复制传播；授权管理（CC协议）——明确使用条件与范围。","易错警示":"“水印”管溯源、“加密”管防复制、“CC协议”管授权，三者勿混。","方法点拨":"技术题按“标记/防复制/定规则”三功能配对记忆。"}},{"sec":"拓展挑战","type":"拓展","num":1,"text":"两难：班刊想用一张网络热图做封面，搜不到作者也不敢商用，不用图就不够好看。请权衡并给合规方案（多步）。","opts":[],"subs":[],"ans":"①优先找无版权或CC协议素材替代；②若必须用，溯源联系作者获授权并署名；③宁可留白也不盗用。理由：美观让位于合法，尊重原创是底线。","al":{"考查点":"两难场景合规决策（评价+决策）。","解题思路":"合规方案三步：①优先用无版权或CC协议素材替代；②若必须用此图，溯源联系作者获授权并署名；③宁留白不盗用。理由：美观让位于合法，尊重原创是底线。","易错警示":"“偷偷用反正没人知道”违背底线；“不用图就不够好看”是伪两难，替代素材可解。","方法点拨":"“美观vs合法”冲突一律合法优先，先替代、再授权、绝不盗。"}},{"sec":"拓展挑战","type":"拓展","num":2,"text":"评价：有人认为“AI一键生成百张图，版权谁也说不清，干脆随便用”。请发表观点并给两条理由。","opts":[],"subs":[],"ans":"观点：不能随便用。理由：①AI内容依规需显著标识，隐瞒来源违背诚信；②创意归人、标注必行，冒用侵犯他人劳动与权益，法律规则在完善。","al":{"考查点":"AI版权争议评价（评价+思辨）。","解题思路":"观点：不能随便用。理由：①AI内容依规需显著标识，隐瞒来源违背诚信与知情权；②“创意归人、标注必行”，AI作品的生成工具与素材可能涉及他人权利，使用者冒用会侵犯他人劳动与权益，相关规则正在完善。","易错警示":"“版权说不清就随便用”是鸵鸟心态；规则不完善≠无规则。","方法点拨":"评价AI版权题：先亮观点→给两条有学理依据的理由→不回避争议但守住底线。"}},{"sec":"变式闯关","type":"变式","num":1,"text":"换场景：音乐课翻唱一首流行歌上传平台获赞，算侵权吗？若要售票开演唱会，又该如何？","opts":[],"subs":[],"ans":"个人翻唱非商用一般属合理使用范畴；若售票商用则须获词曲作者授权，否则侵犯表演与复制权。","al":{"考查点":"翻唱版权边界迁移（应用）。","解题思路":"个人翻唱分享非商用，一般属合理使用范畴；一旦售票商用（演唱会），须获词曲作者授权并支付报酬，否则侵犯表演权与复制权。","易错警示":"“非商用自由唱，商用必授权”——分界线是“是否营利”。","方法点拨":"“换场景”题抓住分界变量（是否商用），其余规则平移。"}},{"sec":"间隔复习","type":"间隔","num":1,"text":"上节课学了“防护三宝”。写出强密码与双因素认证分别防什么，并举一例说明“最小授权”。","opts":[],"subs":[],"ans":"（第27课《个人信息防泄露》）　强密码防被轻易破解，双因素认证防密码单独被盗后被冒用；最小授权如App只给必要权限、拒绝通讯录访问。","al":{"考查点":"数字版权＋AI标识＋维权路径综合设计（创造+法治思维）。","解题思路":"三问三采分面：①三类素材分类处置——AI图显著标注生成来源、原创歌词署真名并征得同意、校园视频须获本人与家长影像授权、音乐用无版权曲库；②侵权维权链——保存原始文件与创作时间（区块链存证）→联系主办方撤下更正署名→平台投诉/法律途径；③AI与人类作品差异——AI作品须标注工具与AI辅助部分、创意与把关归人，AI生成内容侵权不能以“AI所为”免责。","易错警示":"素材处置易漏“同学影像授权”与“音乐授权”；维权只写“报警”不写取证步骤即不完整。","方法点拨":"“合规清单”题=逐类素材定规则；“维权”题按“留证→交涉→举报/法律”三阶作答。"}},{"sec":"思维进阶","type":"挑战","num":1,"text":"【真实情境】学校科技节要出版班级《AI创意作品集》，同学们的作品含AI生成图片、原创歌词、采集的校园视频。请你担任“版权小法官”，为作品集制定一份《素材与版权合规清单》。请写出：①三类素材（AI图/原创歌词/校园视频）分别怎么处理版权（是否标注、如何署名）；②若发现有人把你的原创歌词改个名参赛，你打算怎样取证与维权（至少三步）；③说明“AI参与创作的作品”与“纯人类原创”在署名与责任上有什么不同。","opts":[],"subs":[],"open":true,"ans":"参考设计要点：①三类素材处理：AI生成图片——标注\"AI辅助生成+所用工具\"，不署他人名；原创歌词——作者本人署名并注明\"原创\"，可加\"创作过程说明\"存档自证；校园视频——出镜同学知情同意，拍摄者署名，使用素材须有授权；②取证维权三步：第一时间保存发表证据（截图带时间、链接、保存原始文件与创作底稿）→向活动主办方提交权属证明要求核查处理→若涉及公开发表侵权，要求对方删除道歉，必要时告知老师家长通过平台投诉渠道维权；③AI参与作品与纯人类原创的不同：AI作品须如实标注AI参与环节且人对内容负责（署名者为责任人）；纯人类原创署名即作者，权利完整——共同点：无论是否用AI，最终责任都由提交作品的人承担。","al":{"考查点":"开放创造：AI时代版权合规设计（创造+信息社会责任）","解题思路":"三类素材逐一给\"标注+署名\"方案；维权按\"取证—申诉—追责\"递进；AI与人类创作的差异落在\"标注义务+责任归属\"","易错警示":"AI作品不标注即违规；取证漏\"创作底稿\"导致自证困难","方法点拨":"版权题三步：分类处理、证据链、责任归属说清楚。"}}]},{"t":"第 29 课 · 配套练习 · 建议用时15分钟","n":"企业责任勇担当","isExam":false,"qs":[{"sec":"回忆热身","type":"回忆","num":1,"text":"互联网企业四责：创新驱动、保护用户、尊重____、保障安全。","opts":[],"subs":[],"ans":"版权","al":{"考查点":"企业四责（识记）。","解题思路":"互联网企业四责：创新驱动、保护用户、尊重版权、保障安全。题干给出三责，末空“版权”。","易错警示":"“保障安全”与“保护用户”易混：保护用户侧重用户权益，保障安全侧重内容与系统安全。","方法点拨":"四责口诀“创保版安”，做题先背口诀再补空。"}},{"sec":"回忆热身","type":"回忆","num":2,"text":"芯片、____和根服务器是网络核心技术命脉，须握在自己手中，这叫____。","opts":[],"subs":[],"ans":"操作系统；自主可控","al":{"考查点":"自主可控概念（识记）。","解题思路":"网络核心技术命脉=芯片、操作系统、根服务器；掌握在自己手中叫“自主可控”。","易错警示":"末空是“自主可控”不是“自主研发”（研发是手段，可控是目标）。","方法点拨":"“三件套＋自主可控”捆绑记忆：芯片、操作系统、根服务器——命脉在己手。"}},{"sec":"基础巩固","type":"单选","num":1,"text":"某平台主动拦截诈骗信息并提醒用户，主要体现企业四责中的：","opts":[{"label":"A","text":"创新驱动"},{"label":"B","text":"保护用户"},{"label":"C","text":"尊重版权"},{"label":"D","text":"保障安全"}],"subs":[],"ans":"答案B　保护用户","al":{"考查点":"企业四责实例归类（应用）。","解题思路":"平台主动拦截诈骗信息并提醒用户，保护的是用户的财产与信息安全。","逐项剖析":"A项创新驱动——指研发新产品新技术；B项保护用户——对，防诈提醒直接护用户；C项尊重版权——指打击盗版；D项保障安全——侧重平台内容与系统安全治理。","易错警示":"“防诈提醒”最贴近“保护用户”，勿与“保障安全”混选——保障安全更偏“内容生态治理”。","方法点拨":"四责归类看“直接受益对象”：护用户财产→保护用户；清违规内容→保障安全。"}},{"sec":"基础巩固","type":"单选","num":2,"text":"最能体现“自主可控”意义的是：","opts":[{"label":"A","text":"多用进口软件更先进"},{"label":"B","text":"核心技术命脉握在自己手里"},{"label":"C","text":"系统越复杂越好"},{"label":"D","text":"根服务器在国外更方便"}],"subs":[],"ans":"答案B　核心技术命脉握在自己手里","al":{"考查点":"自主可控意义（理解）。","解题思路":"自主可控=芯片、操作系统、根服务器等核心技术命脉握在自己手里，避免断供受制于人。","逐项剖析":"A项多用进口软件更先进——短期便利但受制于人；B项核心技术命脉握在自己手里——对；C项系统越复杂越好——复杂度与安全无关；D项根服务器在国外更方便——正是不自主可控的表现。","易错警示":"“先进”不等于“可控”，自主可控优先于表面先进。","方法点拨":"自主可控题核心句“命脉握在自己手中，断供不受制于人”。"}},{"sec":"基础巩固","type":"单选","num":3,"text":"假如国外操作系统突然不允许使用，影响最直接的是：","opts":[{"label":"A","text":"太阳升起变慢"},{"label":"B","text":"电脑与手机大量无法正常运行"},{"label":"C","text":"学校放假"},{"label":"D","text":"快递变快"}],"subs":[],"ans":"答案B　电脑与手机大量无法正常运行","al":{"考查点":"操作系统断供推演（应用）。","解题思路":"操作系统是设备的底座软件，一旦无法使用，装其上的电脑与手机大量无法正常运行。","逐项剖析":"A项太阳升起变慢——荒谬无关；B项电脑与手机大量无法正常运行——对，底座断供直接瘫痪设备；C项学校放假——夸大且非直接；D项快递变快——无关。","易错警示":"此题考“直接/最直接影响”，操作系统失效=设备无法启动运行。","方法点拨":"“断供影响推演”先想“被断的东西在系统里处于什么位置”（底座→全盘受影响）。"}},{"sec":"基础巩固","type":"单选","num":4,"text":"下列国产技术中，属于“自主可控”进展的是：","opts":[{"label":"A","text":"某国外社交App"},{"label":"B","text":"鸿蒙与麒麟操作系统"},{"label":"C","text":"进口芯片"},{"label":"D","text":"境外云盘"}],"subs":[],"ans":"答案B　鸿蒙与麒麟操作系统","al":{"考查点":"国产自主可控成果（识记）。","解题思路":"鸿蒙（华为）与麒麟（统信）是国产操作系统代表，是自主可控的实质进展。","逐项剖析":"A项某国外社交App——境外产品；B项鸿蒙与麒麟操作系统——对，国产系统；C项进口芯片——进口非自主；D项境外云盘——数据存境外风险大。","易错警示":"“国产”≠“自主可控”关键词，鸿蒙/麒麟/龙芯/飞腾等为典型成果。","方法点拨":"记国产自主代表：操作系统看鸿蒙麒麟、芯片看龙芯飞腾、浏览器看红芯等。"}},{"sec":"基础巩固","type":"判断","num":1,"text":"企业拿用户数据后若泄露，只需说“我们也是受害者”就不用担责。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"企业泄露担责（理解）。","解题思路":"企业负有保护用户责任，数据泄露依法须承担责任并整改赔偿，“我们是受害者”不能免责。","易错警示":"“道歉就免责”是错误认知；责任认定看是否有过错与是否尽到保护义务。","方法点拨":"凡“只需道歉/说句受害者就免责”判断一律错。"}},{"sec":"基础巩固","type":"判断","num":2,"text":"企业安全、用户安全与国家安全三者互不相干。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"个人-企业-国家安全一体（理解）。","解题思路":"“三者互不相干”错误：企业掌握海量用户数据，企业安全失守→用户数据泄露→汇聚危及国家安全，层层传导。","方法点拨":"安全观题目记住等式：企业安全＝用户安全＝国家安全。"}},{"sec":"基础巩固","type":"判断","num":3,"text":"国家推进国产芯片、操作系统研发，只是为了省钱。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"自主可控战略意义（评价）。","解题思路":"“只是为了省钱”片面：国产化更关键的是技术自主可控与国家安全，避免在关键环节被“卡脖子”，省钱只是附带。","易错警示":"勿把国家战略矮化为成本考量。","方法点拨":"评价国家战略题，答“安全与自主优先，成本是次要考虑”。"}},{"sec":"能力提升","type":"提升","num":1,"text":"连线：企业四责与表现配对（写序号）。①创新驱动 ②保护用户 ③尊重版权 ④保障安全｜A.审核违规内容 B.研发好产品 C.打击盗版 D.防诈提醒","opts":[],"subs":[],"ans":"①—B；②—D；③—C；④—A","al":{"考查点":"四责内涵连线（识记）。","解题思路":"①创新驱动——研发好产品（B）；②保护用户——防诈提醒（D）；③尊重版权——打击盗版（C）；④保障安全——审核违规内容（A）。","易错警示":"“审核违规内容”属保障安全（内容治理），勿与保护用户混。","方法点拨":"连线先分“面向产品/面向用户/面向版权/面向内容”四域再配对。"}},{"sec":"能力提升","type":"提升","num":2,"text":"“假如芯片断供”会连锁发生什么？写出三步推演。","opts":[],"subs":[],"ans":"芯片断供→手机电脑变砖无法使用→网络与支付系统瘫痪→社会运转受阻，凸显核心技术命脉在己手之重要。","al":{"考查点":"断供连锁推演（分析）。","解题思路":"三步推演：芯片断供→手机电脑等设备“变砖”无法使用→依赖设备的网络与支付系统瘫痪→社会运转受阻。结论：核心技术命脉必须握在自己手中。","易错警示":"推演须“步步相连”（每步是上步结果），跳步即失分。","方法点拨":"连锁推演写作：设备→系统→应用→社会，四级传导链。"}},{"sec":"能力提升","type":"提升","num":3,"text":"排序：为学校网站选国产软硬件，合理顺序（写序号）。①确认需求 ②选国产操作系统 ③选国产芯片 ④试用评估","opts":[],"subs":[],"ans":"①→③→②→④","al":{"考查点":"国产化选型流程（应用）。","解题思路":"为学校网站选国产软硬件：先确认需求（①）→再选国产芯片（③）→选国产操作系统（②）→最后试用评估（④）。","易错警示":"“确认需求”永远第一；芯片是硬件底座应先于操作系统确定兼容性。","方法点拨":"选型流程=需求→硬件→软件→验证，四步不可倒。"}},{"sec":"能力提升","type":"提升","num":4,"text":"为何《数据安全法》要求企业保障数据安全？用“企业安全=用户安全=国家安全”说明。","opts":[],"subs":[],"ans":"企业握海量数据，一旦泄露用户隐私与财产受损，汇聚起来危及国家安全，故企业守法守责是整体安全一环。","al":{"考查点":"数据安全法立论（理解）。","解题思路":"企业握海量数据：泄露→用户隐私财产受损→汇聚成规模危害国家安全，故《数据安全法》要求企业守责，企业安全是整体安全的一环。","易错警示":"须用“个人—企业—国家”链条论证，不能只谈企业自保。","方法点拨":"“为何立法”题按危害传导链作答：个体受损→规模汇聚→国家安全。"}},{"sec":"拓展挑战","type":"拓展","num":1,"text":"两难：常用的学习App把作业数据悄悄共享给广告商。你很依赖它，又不满被卖数据。请写出维权与应对方案（多步）。","opts":[],"subs":[],"ans":"①在设置关闭个性化推荐与数据共享授权；②向平台投诉要求停止并删除；③向12321举报，改用更合规国产工具；④提醒同学检查权限。理由：便利不抵隐私，维权从最小授权做起。","al":{"考查点":"企业违规情境多步处置（应用+决策）。","解题思路":"四步方案：①在设置中关闭个性化推荐与数据共享授权（最小授权）；②向平台投诉要求停止共享并删除数据；③向12321举报、改用合规国产工具；④提醒同学检查各自权限。理由：便利不抵隐私，维权从最小授权做起。","易错警示":"“继续用但忍着”不可取；方案须含“关授权+投诉+举报+提醒他人”闭环。","方法点拨":"“依赖它又被侵权”两难题=先用最小授权自保→再投诉举报维权→最后换合规替代。"}},{"sec":"拓展挑战","type":"拓展","num":2,"text":"评价：有人认为“平台审核删评论是侵犯言论自由”。请结合企业四责说明理由并表态。","opts":[],"subs":[],"ans":"保障内容安全是法律要求，审核清理违法有害信息而非压制正当表达；删违规内容属保障安全责任，正当发言不受影响。理由：自由有边界，安全与表达需平衡。","al":{"考查点":"内容审核责任辩证评价（评价+思辨）。","解题思路":"观点：平台审核删除违规内容不侵犯正当言论自由。理由：①保障内容安全是法律赋予企业的责任（四责之保障安全）；②清理的对象是违法有害信息而非正当表达；③自由有边界，安全与表达需平衡。","易错警示":"“审核=侵犯言论自由”是把治理与压制混为一谈；须区分“违法信息”与“正当言论”。","方法点拨":"辩证评价题：亮观点→区分概念（违规≠正当）→引法规责任→谈平衡。"}},{"sec":"变式闯关","type":"变式","num":1,"text":"换场景：小区新装人脸门禁，由企业运维并留存人脸数据。居民担心“企业把数据卖了”。请用本课知识提两条监督建议。","opts":[],"subs":[],"ans":"①要求企业明示数据用途与保存期限，落实最小必要；②建议采用国产安全系统、定期审计，并向监管部门举报违规。","al":{"考查点":"人脸门禁企业责任监督（应用+迁移）。","解题思路":"两条监督建议：①要求企业明示人脸数据用途、保存期限与删除机制，落实最小必要与知情同意；②采用国产安全系统并定期审计，发现违规向监管部门举报。","易错警示":"监督须“外有举报渠道、内有审计机制”双线，只口头抗议无效。","方法点拨":"“监督企业”题=用户端要求透明（用途期限）＋治理端审计举报双管齐下。"}},{"sec":"间隔复习","type":"间隔","num":1,"text":"上节课学了“流转即风险”。举一个企业收集用户数据的场景，说明它在哪一“站”可能泄露。","opts":[],"subs":[],"ans":"（第27课《个人信息防泄露》）　如购物App：注册（手机号）→下单（地址）→支付（银行卡）→物流（姓名电话），任何一站防护不力都可能泄露，企业须担保护责。","al":{"考查点":"企业四责考察＋维权＋自主可控论证（评价+创造）。","解题思路":"三问三采分面：①四责考察问题——创新驱动（功能更新）、保护用户（隐私政策透明、可删除）、尊重版权（素材授权标注）、保障安全（加密与事件通报），每责一条具体问题；②维权两步——先关授权自保，再投诉举报并换平台，路径要闭环；③自主可控论证——校园数据涉未成年人隐私，境外/不可控平台数据出境风险大、难追责，国产合规平台数据境内存储、依法可监管，论证“命脉在己手”。","易错警示":"考察问题空泛（“它好不好”）不给分，须逐责对应可核实问题；维权漏“举报”环节不完整。","方法点拨":"“考察表”题按四责展开成四行问题；“自主可控”论证用“数据在哪里=风险在哪里”推理。"}},{"sec":"思维进阶","type":"挑战","num":1,"text":"【真实情境】班里想选一款“学习打卡App”长期使用，有同学提议先考察这家公司靠不靠谱。请你以“学生网络安全观察员”身份设计一份《学习App企业责任考察表》。请写出：①围绕企业“四责”（创新驱动/保护用户/尊重版权/保障安全）各设计一条考察问题；②考察发现该App“把学习数据共享给广告商”，写出两步维权动作；③从“自主可控”角度说明：为什么优先选用国产合规平台对校园数据更重要。","opts":[],"subs":[],"open":true,"ans":"参考设计要点：①四责考察题：创新驱动——产品近一年有哪些新功能迭代？保护用户——是否明示收集哪些学习数据并可选关闭？尊重版权——内置内容是否有正版授权？保障安全——是否有漏洞响应机制与未成年人保护模式？②两步维权：第一步向平台客服正式投诉并要求说明数据用途、关闭共享授权；第二步向老师家长反映，必要时通过12377或网信部门举报其违规收集行为；③自主可控角度：国产合规平台受我国法律与监管直接约束，数据存储与处理更可控、可追责，校园学习数据涉及未成年人，优先选用可管可控的平台更安全。","al":{"考查点":"开放创造：企业责任的考察与维权设计（创造+评价）","解题思路":"四责各出一条\"可考察的具体问题\"而非口号；维权两步有层级（先企业后监管）；自主可控落到\"数据+未成年人\"场景","易错警示":"考察表问\"好不好用\"偏离四责；维权只写\"投诉\"没有后续升级路径","方法点拨":"考察表公式：四责各一问+维权分两级+自主可控结合数据安全。"}}]},{"t":"第 30 课 · 配套练习 · 建议用时15分钟","n":"网络生态建设好","isExam":false,"qs":[{"sec":"回忆热身","type":"回忆","num":1,"text":"面对网络谣言，应遵循“四不”：不信、不传、不____、举报。","opts":[],"subs":[],"ans":"评（不参与网暴）","al":{"考查点":"谣言应对四不原则（识记）。","解题思路":"“四不”=不信、不传、不评（不参与网暴起哄）、举报。题干给出三不，末空“评”。","易错警示":"第三“不”是“不评”而非“不删”；举报是正向行动不算“不”。","方法点拨":"四不口诀“不信不传不评，违法就举报”，把“举报”记成主动收尾。"}},{"sec":"回忆热身","type":"回忆","num":2,"text":"网络生态三大问题是网络暴力、____和水军，它们像病毒一样快速蔓延。","opts":[],"subs":[],"ans":"谣言","al":{"考查点":"网络生态三大问题（识记）。","解题思路":"三大问题=网络暴力、谣言、水军。题干给出网暴与末项，中空“谣言”。","易错警示":"“水军”是独立问题，勿与谣言合并；三问题都会“像病毒一样蔓延”。","方法点拨":"三问题捆绑记“暴、谣、军”，对策分别对“四不、三查、辨话术”。"}},{"sec":"基础巩固","type":"单选","num":1,"text":"看到“某校食堂用工业盐”的惊人文，正确第一步是：","opts":[{"label":"A","text":"立刻转发提醒家长"},{"label":"B","text":"先质疑并查来源与官方"},{"label":"C","text":"跟风骂食堂"},{"label":"D","text":"置之不理"}],"subs":[],"ans":"答案B　先质疑并查来源与官方","al":{"考查点":"谣言应对第一步（应用）。","解题思路":"看到惊人消息，正确第一步=先质疑（不信）并核查来源与官方通报，再决定是否处理。","逐项剖析":"A项立刻转发提醒家长——未经核实即传播，正是谣言放大器；B项先质疑并查来源与官方——对，四不先“不信”、三查先行动；C项跟风骂食堂——情绪化且可能构成网暴；D项置之不理——不作为但错在“未举报”而非第一步判断；题干问“正确第一步”选B。","易错警示":"“转发提醒”看似好心实则助谣；第一动作永远是核实而非传播。","方法点拨":"谣言处置铁律：先质疑→三查→再决定，任何“先转再说”都是错。"}},{"sec":"基础巩固","type":"单选","num":2,"text":"网络水军的典型特征是：","opts":[{"label":"A","text":"客观理性发言"},{"label":"B","text":"夸张重复带节奏刷量"},{"label":"C","text":"匿名但友善"},{"label":"D","text":"只发科普"}],"subs":[],"ans":"答案B　夸张重复带节奏刷量","al":{"考查点":"水军特征识别（理解）。","解题思路":"网络水军以盈利为目的，特征=夸张重复、带节奏、刷量控评。","逐项剖析":"A项客观理性发言——恰与水军相反；B项夸张重复带节奏刷量——对，典型画像；C项匿名但友善——匿名不等于水军；D项只发科普——正向内容。","易错警示":"水军判别看“话术模式（夸张重复）＋目的（带节奏牟利）”，不只看匿名。","方法点拨":"识水军三看：话术夸张否、重复刷量否、目的带节奏否。"}},{"sec":"基础巩固","type":"单选","num":3,"text":"举报违法不良信息，可拨打的专用电话是：","opts":[{"label":"A","text":"110"},{"label":"B","text":"12315"},{"label":"C","text":"12377"},{"label":"D","text":"12306"}],"subs":[],"ans":"答案C　12377","al":{"考查点":"举报专线（识记）。","解题思路":"网络违法和不良信息举报专线是12377（中央网信办举报中心）。","逐项剖析":"A项110——公安报警；B项12315——市场监管/消费投诉；C项12377——对，网络不良信息举报；D项12306——铁路客服。","易错警示":"四专线易混：网络举报认准12377。","方法点拨":"“123”系列专线按职能记：15消费、77网络、06铁路、10公安。"}},{"sec":"基础巩固","type":"单选","num":4,"text":"“清朗”系列专项行动主要依靠的组合是：","opts":[{"label":"A","text":"法律+平台+教育"},{"label":"B","text":"只靠网民自觉"},{"label":"C","text":"关闭所有网络"},{"label":"D","text":"仅做广告"}],"subs":[],"ans":"答案A　法律+平台+教育","al":{"考查点":"清朗行动治理组合（理解）。","解题思路":"“清朗”专项行动依靠多方共治：法律监管、平台履责、教育引导组合发力。","逐项剖析":"A项法律+平台+教育——对，政府监管+企业责任+社会素养三管齐下；B项只靠网民自觉——单边失效；C项关闭所有网络——因噎废食；D项仅做广告——形式主义。","易错警示":"“清朗”是综合治理工程，单选“网民自觉”或“平台自律”都不全面。","方法点拨":"生态治理题默认“政府+企业+个人”三方共治框架。"}},{"sec":"基础巩固","type":"判断","num":1,"text":"一条谣言传开后，只要有人辟谣就万事大吉，无需事前预防。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"谣言防治重心（评价）。","解题思路":"“辟谣就万事大吉”本末倒置：谣言跑遍全城时辟谣才出门，事前不信不传（切断传播）比事后辟谣更有效。","易错警示":"防治重心在“预防传播”，不在“事后澄清”。","方法点拨":"“预防vs补救”判断题：预防在前、效果更好，题干强调事后即错。"}},{"sec":"基础巩固","type":"判断","num":2,"text":"网络暴力只是“说说而已”，不会对当事人造成真实伤害。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"网暴危害认知（理解）。","解题思路":"“只是说说而已”是严重误判：人肉搜索与网暴可致当事人心理创伤、名誉受损甚至极端后果，法律已明确规制。","方法点拨":"网暴是“屏幕后的真伤害”，勿因看不见就低估。"}},{"sec":"基础巩固","type":"判断","num":3,"text":"每个人不转发未经证实的信息，就是在守护网络生态。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"个人守责价值（理解）。","解题思路":"每个人不转发未经证实信息=切断谣言传播链，人人都是防线，守护网络生态。表述正确。","方法点拨":"“个人行动价值”判断题，从“传播链+免疫”逻辑正向推导即可判对。"}},{"sec":"能力提升","type":"提升","num":1,"text":"连线：生态问题与应对配对（写序号）。①谣言 ②网暴 ③水军｜A.四不原则 B.不评不参与 C.查来源辨话术","opts":[],"subs":[],"ans":"①—A；②—B；③—C","al":{"考查点":"问题对策连线（应用）。","解题思路":"①谣言——四不原则（不信不传不评举报）A；②网暴——不评不参与（不围观不起哄）B；③水军——查来源辨话术（识破刷量带节奏）C。","易错警示":"水军对策是“辨别”而非“四不”，因其伪装客观最需辨识力。","方法点拨":"连线按“问题—核心动作”配对：谣→不信传、暴→不围观、军→辨话术。"}},{"sec":"能力提升","type":"提升","num":2,"text":"排序：收到一条惊人消息，正确处置顺序（写序号）。①再决定转不转 ②查官方与多方 ③先质疑 ④若违法截图存证","opts":[],"subs":[],"ans":"③→②→①→④（先质疑→核实→决定→举报）","al":{"考查点":"惊人消息处置排序（应用）。","解题思路":"正确顺序：先质疑（③，不信）→查官方与多方（②，三查）→再决定转不转（①）→若违法截图存证举报（④）。","易错警示":"“先质疑再核实”不可倒；“截图存证”在确认违法后而非第一时间。","方法点拨":"处置链“质疑→核实→决策→举报”，四步顺序固定。"}},{"sec":"能力提升","type":"提升","num":3,"text":"用“病毒传播”类比，解释为什么“人人都是网络生态的防线”。","opts":[],"subs":[],"ans":"一人乱转发如病毒扩散，每人均不传则链断；克制转发与举报如同免疫，故个人行为决定整体生态健康。","al":{"考查点":"人人防线类比（理解）。","解题思路":"谣言像病毒：一人乱转发如病毒扩散；每人均不传则传播链断裂；克制转发与举报如免疫机制。故个人行为决定整体生态健康。","易错警示":"类比须完整映射：谣言↔病毒、转发↔传播、不传/举报↔免疫。","方法点拨":"“病毒”类比题双线作答：扩散机理（个体放大）+免疫机理（个体阻断）。"}},{"sec":"能力提升","type":"提升","num":4,"text":"班级要办“网络安全宣传日”，列出三个可落地的活动环节。","opts":[],"subs":[],"ans":"示例：①主题班会讲四不原则；②张贴《校园网络安全倡议书》并签名；③设“谣言辨辨辨”互动问答角。","al":{"考查点":"宣传活动落地（应用+创造）。","解题思路":"三个可落地环节：①主题班会讲四不原则与三查方法；②张贴《校园网络安全倡议书》并组织签名承诺；③设“谣言辨辨辨”互动问答角，练手识别。","易错警示":"活动要“可落地”，勿写“发传单”等空泛口号；三类活动最好覆盖“学—诺—练”。","方法点拨":"宣传活动设计三件套：班会讲知识＋承诺建氛围＋互动练技能。"}},{"sec":"拓展挑战","type":"拓展","num":1,"text":"两难：班级群有人转“某同学作弊”截图，群里一片起哄。你认出是旧图断章取义，转发会伤人也你不想得罪群友。请写出做法（多步）。","opts":[],"subs":[],"ans":"①不跟风评论转发（不评不传）；②私信提醒发布者核实，说明是断章取义；③群内建议“先查真相”，或向老师反馈；④必要时举报。理由：沉默即纵容，守防线比合群重要。","al":{"考查点":"谣言网暴两难处置（应用+决策）。","解题思路":"做法链：①不跟风评论转发（不评不传）→②私信提醒发布者核实，指出断章取义→③群内建议“先查真相”或向老师反馈→④必要时举报。理由：沉默即纵容，守防线比合群重要。","易错警示":"“不得罪群友就沉默”是错误选项；既不当众撕破脸又可私信+上报，两全处理。","方法点拨":"群内两难题=公开不站队（不评）＋私下做工作（提醒）＋后台走流程（上报举报）。"}},{"sec":"拓展挑战","type":"拓展","num":2,"text":"责任行动：完善《校园网络安全倡议书》“网络生态”篇章，写出警示、措施、法律依据三点。","opts":[],"subs":[],"ans":"警示——网暴谣言水军正在撕裂信任；措施——不信不传不评、三查核实、违法就举报12377；依据——清朗行动依法治理网络生态，人人有责。","al":{"考查点":"倡议书生态篇章（综合+责任）。","解题思路":"三点齐备：警示——网暴谣言水军正在撕裂网络信任；措施——不信不传不评、三查核实、违法举报12377；依据——清朗行动依法治理网络生态，人人有责。","易错警示":"“警示—措施—依据”三要素缺一不可，措施须具体可执行。","方法点拨":"倡议书模板复用：一句话警示＋一串动作＋一条法规依据。"}},{"sec":"变式闯关","type":"变式","num":1,"text":"换场景：家族群长辈转发“吃某物防癌”偏方，还催你转给亲戚。你明知没依据，怎么既不让长辈难堪又守住“不传谣”？","opts":[],"subs":[],"ans":"私下温和说明“我查了官方说没证据”，建议长辈先别转；帮其关注权威健康号，用亲情而非说教把关。","al":{"考查点":"家族群辟谣沟通（应用+表达）。","解题思路":"对长辈：私下温和说明“我查了官方说没证据”，建议先别转；帮其关注权威健康号，用亲情和证据而非说教把关。","易错警示":"当众驳长辈面子或强硬制止会适得其反；既守原则又顾亲情。","方法点拨":"“劝长辈不传谣”题=私下沟通＋给替代信源＋语气温和，三重技巧缺一不可。"}},{"sec":"间隔复习","type":"间隔","num":1,"text":"上节课提醒“快递单别乱扔”。结合本课，说明随手转发的谣言与乱扔的快递单在“泄露风险”上有何相似处。","opts":[],"subs":[],"ans":"（第27课《个人信息防泄露》）　二者都把本应谨慎的信息随意扩散：快递单泄露隐私，谣言扩散误导他人；都因“随手”放大危害，需事前克制。","al":{"考查点":"谣言识别＋应对流程＋反网暴规则综合设计（创造+责任）。","解题思路":"三问三采分面：①谣言情景要具体（“食堂吃异物”“考试作弊”）且两条可疑线索真实可辨（图糊无出处、细节对不上、非官方首发）；②应对流程至少四步——不信（质疑）→三查核实→不转不评并私信提醒首发者→举报12377/报告老师，形成个人到集体的闭环；③反围观规则——不跟风、不转发截图、不人肉＋私信安慰被围攻者、报告老师，把“围观”转化为“守护”。","易错警示":"情景里的“可疑线索”必须与谣言特征（无出处/模糊/反常）对应；反围观规则只写“别骂人”太浅，须含正向支援动作。","方法点拨":"“演练方案”题=情景剧本（可演）＋流程脚本（四步闭环）＋班级规则（有温度可执行）。"}},{"sec":"思维进阶","type":"挑战","num":1,"text":"【真实情境】“清朗”行动进校园，学校请你担任“校园清朗小卫士”为班级设计一份《谣言与网暴应对演练方案》。请写出：①设计一个校园常见谣言情景（如“食堂吃出异物”“某同学考试作弊”）并写出它“可疑在哪里”的两条线索；②写出“发现该谣言后”的完整应对流程（从个人不信到阻止扩散到举报，至少四步）；③为防“网暴围观”设计一条班级层面的规则（当群里有人被围攻时，同学们应该怎样做）。","opts":[],"subs":[],"open":true,"ans":"参考设计要点：①情景示例：\"学校食堂的菜里吃出虫子，还配了一张模糊照片\"；可疑线索一：照片模糊且无拍摄时间地点，找不到原始出处；线索二：最早发布者是匿名小号，且同一文案在多个群同时出现（营销号特征）；②应对四步：个人不信——先质疑不转发；核实——通过学校后勤官方渠道或实地求证；阻断——私信提醒已转发的同学删除，并在群里辟谣附官方说明；举报——向平台举报发布者，情节严重的拨打12377；③防网暴围观规则：\"围攻发生时，不做第二只手\"——任何人不得跟风评论起哄，至少一人私聊安抚当事人，两名同学负责截证并报告老师，群主暂停相关话题。","al":{"考查点":"开放创造：谣言治理与反网暴的流程设计（创造+信息社会责任）","解题思路":"谣言情景要有两条\"可疑线索\"支撑判断；应对流程至少四步且顺序正确（不信→核实→阻断→举报）；网暴规则要\"保护当事人+留证+报告\"三合一","易错警示":"流程从\"转发提醒大家小心\"开始——这本身就是传谣；网暴规则没有落点动作","方法点拨":"清朗题三件套：可疑线索、四步流程、围观者守则。"}}]},{"t":"达标检测","n":"第六单元 共同守护互联网 · 达标检测卷","isExam":true,"qs":[{"sec":"选择题","type":"选择题","num":1,"text":"下列最易泄露个人信息的是：","opts":[{"label":"A","text":"正规网站登录"},{"label":"B","text":"随意丢弃未撕毁的快递单"},{"label":"C","text":"官方渠道缴费"},{"label":"D","text":"单位加密WiFi"}],"subs":[],"ans":"答案B　随意丢弃未撕毁的快递单","al":{"考查点":"泄露途径识别（应用）。","解题思路":"最易泄露=信息暴露面最大且无防护：快递单含姓名电话住址且随手丢弃。","逐项剖析":"A项正规网站登录——有平台保护；B项随意丢弃未撕毁的快递单——对，面单信息直接裸露；C项官方渠道缴费——正规；D项单位加密WiFi——有加密防护。","易错警示":"撕碎/打码快递单是标配动作，勿低估线下泄露口。"}},{"sec":"选择题","type":"选择题","num":2,"text":"不同账号用不同强密码并开短信验证，分别叫：","opts":[{"label":"A","text":"一密一用与双因素认证"},{"label":"B","text":"最小授权与加密"},{"label":"C","text":"水印与标识"},{"label":"D","text":"四不与三查"}],"subs":[],"ans":"答案A　一密一用与双因素认证","al":{"考查点":"防护术语辨析（识记）。","解题思路":"不同账号不同密码=一密一用；短信验证=双因素认证。","逐项剖析":"A项一密一用与双因素认证——对；B项最小授权与加密——分别管权限与传输；C项水印与标识——版权领域；D项四不与三查——谣言治理。","易错警示":"“验证码”是双因素的标志词，勿错配。"}},{"sec":"选择题","type":"选择题","num":3,"text":"把付费字体用于店招盈利，属于：","opts":[{"label":"A","text":"合理使用"},{"label":"B","text":"侵犯版权"},{"label":"C","text":"免费使用"},{"label":"D","text":"创作即享有"}],"subs":[],"ans":"答案B　侵犯版权","al":{"考查点":"版权侵权识别（应用）。","解题思路":"付费字体授权限于个人范围，用于店招盈利超出授权、构成侵权。","逐项剖析":"A项合理使用——商用不符；B项侵犯版权——对；C项免费使用——付费字体非免费；D项创作即享有——指自己创作的作品。","易错警示":"“买过”不等于“可商用”，授权范围决定合法性。"}},{"sec":"选择题","type":"选择题","num":4,"text":"互联网企业四责不包括：","opts":[{"label":"A","text":"创新驱动"},{"label":"B","text":"保护用户"},{"label":"C","text":"尊重版权"},{"label":"D","text":"随意收集数据"}],"subs":[],"ans":"答案D　随意收集数据","al":{"考查点":"企业四责（识记）。","解题思路":"四责=创新驱动、保护用户、尊重版权、保障安全；“随意收集数据”恰是法律禁止行为。","逐项剖析":"A/B/C项均为四责内容；D项随意收集数据——对，不属于四责，反被《个人信息保护法》禁止。","方法点拨":"“不包括”题先列全四责再找“反责任”表述。"}},{"sec":"选择题","type":"选择题","num":5,"text":"核心技术的“自主可控”主要指：","opts":[{"label":"A","text":"芯片操作系统根服务器握在己手"},{"label":"B","text":"全用进口"},{"label":"C","text":"系统越杂越好"},{"label":"D","text":"根服务器在外"}],"subs":[],"ans":"答案A　芯片操作系统根服务器握在己手","al":{"考查点":"自主可控（理解）。","解题思路":"自主可控=芯片、操作系统、根服务器等命脉握在自己手中。","逐项剖析":"A项芯片操作系统根服务器握在己手——对；B项全用进口——受制于人；C项系统越杂越好——无关；D项根服务器在外——不自主。","易错警示":"选“全用进口”忽视断供风险是典型误区。"}},{"sec":"选择题","type":"选择题","num":6,"text":"应对谣言的第一步是：","opts":[{"label":"A","text":"立刻转发"},{"label":"B","text":"先质疑并查来源"},{"label":"C","text":"跟风评论"},{"label":"D","text":"置之不理"}],"subs":[],"ans":"答案B　先质疑并查来源","al":{"考查点":"谣言应对第一步（应用）。","解题思路":"四不先“不信”：先质疑并查来源，再决定转不转。","逐项剖析":"A项立刻转发——助谣；B项先质疑并查来源——对；C项跟风评论——可能网暴；D项置之不理——不作为。","易错警示":"第一动作永远是核实而非传播。"}},{"sec":"判断题","type":"判断题","num":1,"text":"网上图片免费看就等于可免费商用。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"版权权利分层（理解）。","解题思路":"免费看=浏览权；商用=复制传播权，须另获授权。","易错警示":"“能看≠能用≠能卖”，权利层层递进。"}},{"sec":"判断题","type":"判断题","num":2,"text":"AI换脸冒充亲友借钱，眼见一定为实。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"深度伪造识别（理解）。","解题思路":"AI换脸可高度仿真，眼见不一定为实；须实时验证（指定动作）+多渠道核实。","易错警示":"“眼见为实”在深度伪造时代失效。"}},{"sec":"判断题","type":"判断题","num":3,"text":"企业泄露用户数据只需道歉即可免责。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"企业泄露担责（理解）。","解题思路":"企业负保护责任，泄露依法须担责并赔偿，道歉不能免责。"}},{"sec":"判断题","type":"判断题","num":4,"text":"网络水军靠夸张重复带节奏操纵舆论。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"水军特征（识记）。","解题思路":"水军以夸张重复带节奏、刷量控评牟利——表述正确。"}},{"sec":"判断题","type":"判断题","num":5,"text":"个人不转发谣言就是在守护网络生态。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"个人生态责任（理解）。","解题思路":"不转发未经证实信息=切断传播链，人人都是防线——正确。"}},{"sec":"填空题","type":"填空题","num":1,"text":"作品创作完成即受保护、无需登记，称“____”原则。","opts":[],"subs":[],"ans":"创作即享有","al":{"考查点":"版权原则（识记）。","解题思路":"创作即享有：作品创作完成即自动受保护、无需登记。"}},{"sec":"填空题","type":"填空题","num":2,"text":"防护三宝：强密码（一密一用）、____、最小授权。","opts":[],"subs":[],"ans":"双因素认证","al":{"考查点":"防护三宝（识记）。","解题思路":"防护三宝=强密码（一密一用）、双因素认证、最小授权。"}},{"sec":"填空题","type":"填空题","num":3,"text":"判断是否侵权可问“四问”：目的、____、署名、是否影响收益。","opts":[],"subs":[],"ans":"数量（用量）","al":{"考查点":"合理使用四问（识记）。","解题思路":"四问=目的、数量（用量）、署名、是否影响收益。"}},{"sec":"填空题","type":"填空题","num":4,"text":"网络核心技术命脉包括芯片、操作系统与____。","opts":[],"subs":[],"ans":"根服务器","al":{"考查点":"核心技术命脉（识记）。","解题思路":"芯片、操作系统、根服务器三大命脉须自主可控。"}},{"sec":"填空题","type":"填空题","num":5,"text":"举报网络违法不良信息可拨____。","opts":[],"subs":[],"ans":"12377","al":{"考查点":"举报专线（识记）。","解题思路":"网络违法和不良信息举报专线12377。","方法点拨":"77网络、15消费、10公安、06铁路。"}},{"sec":"填空题","type":"填空题","num":6,"text":"面对谣言的“四不”原则是：不信、不传、不____、举报。","opts":[],"subs":[],"ans":"评","al":{"考查点":"四不原则（识记）。","解题思路":"四不=不信、不传、不评、举报。"}},{"sec":"简答题","type":"简答题","num":1,"text":"用“快递流转”类比说明“信息流转即风险”，并写两种防护做法（8分）。","opts":[],"subs":[],"ans":"信息像快递在注册、下单、支付、物流间传递，每站可被记录截获（4分）；防护：一密一用强密码、开双因素认证、最小授权、不点钓鱼链接（任选两点各2分）。","al":{"考查点":"流转即风险＋防护措施（应用）。","解题思路":"快递类比：信息在注册、下单、支付、物流各站传递，每站可被记录截获（4分）；防护任选两点：一密一用强密码、双因素认证、最小授权、不点钓鱼链接（各2分）。","易错警示":"防护须写“具体做法”而非“注意安全”。"}},{"sec":"简答题","type":"简答题","num":2,"text":"互联网企业“四责”是什么？结合“自主可控”说明核心技术为何要握在自己手里（12分）。","opts":[],"subs":[],"ans":"四责：创新驱动、保护用户、尊重版权、保障安全（每点1.5分共6分）。自主可控：芯片、操作系统、根服务器是命脉，断供应致设备与网络瘫痪、危及国家与用户安全，故须自立（6分）。","al":{"考查点":"企业四责＋自主可控（理解）。","解题思路":"四责各1.5分：创新驱动、保护用户、尊重版权、保障安全。自主可控（6分）：芯片、操作系统、根服务器是命脉，断供致设备与网络瘫痪、危及国家与用户安全，故须自立。","方法点拨":"自主可控按“命脉→断供后果→为何自立”三层论证。"}},{"sec":"案例分析题","type":"案例分析题","num":1,"text":"小宇在群里看到“某校食堂用工业盐”的转发，没核实就转给妈妈，妈妈又转家族群引发恐慌，后官方辟谣。请：（1）指出两人各违反“四不”中哪条（6分）；（2）用“核实三查”说明正确做法（9分）。","opts":[],"subs":[],"ans":"（1）小宇未经证实即转发，违反“不传”；妈妈再转也违反“不传”，均未“不信”先核实（各3分）。（2）三查：查来源是否权威、查官方有无通报、查多方平台是否佐证；先质疑再核实后才决定转否，违法则举报12377（每查3分）。","al":{"考查点":"四不原则案例应用（应用）。","解题思路":"（1）小宇未核实即转发违反“不传”；妈妈再转同样违反“不传”，均未做到“不信”先行核实（各3分）。（2）三查：查来源是否权威、查官方有无通报、查多方平台是否佐证；先质疑再核实后才决定转否，违法则举报12377（每查3分）。","易错警示":"“不传”与“不信”要分别落到两个人物身上分析。"}},{"sec":"综合实践题","type":"综合实践题","num":1,"text":"班级要制定《班级网络安全公约》并配套“事件处置方案”。请完成：（1）公约涵盖个人信息、数字版权、企业责任、网络生态四方面，各写一条（12分）；（2）针对“同学遭AI换脸诈骗或群内谣言”写处置流程三步（13分）。","opts":[],"subs":[],"ans":"（1）示例：个人信息——一密一用、双因素认证、最小授权；版权——转载必署名、用AI内容必标注；企业——选合规国产平台、关掉多余授权；生态——不信不传不评、谣言拨12377举报（每方面3分）。（2）处置：①先质疑并三查核实；②不转发不评论，私信提醒当事人；③向平台与12377举报，必要时告知老师家长（每步约4分，体现跨课综合）。评分要点：覆盖四课、措施具体、流程可执行。","al":{"考查点":"跨课综合公约＋处置方案（创造+评价）。","解题思路":"（1）四方面各3分：个人信息（一密一用、双因素、最小授权）；版权（转载署名、AI内容标注）；企业责任（选合规平台、关多余授权）；生态（不信不传不评、12377举报）。（2）处置三步：先质疑三查核实→不转不评并私信提醒当事人→平台与12377举报，必要时告知老师家长（体现跨课综合与可执行性）。","易错警示":"公约须“覆盖四课”，处置须“有顺序可执行”；每方面只写口号不给分。","方法点拨":"综合实践题把每课“最核心的一条行动”填进公约，处置流程按“核实→阻断→举报”三段。"}}]}]},{"t":"全册期末综合检测","isFinal":true,"lessons":[{"t":"全册综合检测卷（一）","n":"全册综合检测卷（一）","isExam":true,"qs":[{"sec":"选择题","type":"选择题","num":1,"text":"下列互联网发展历程排序正确的是：","opts":[{"label":"A","text":"万维网→阿帕网→移动互联→人工智能"},{"label":"B","text":"阿帕网→TCP/IP互联→万维网→5G与AI"},{"label":"C","text":"阿帕网→万维网→TCP/IP互联→5G与AI"},{"label":"D","text":"电报→电话→阿帕网→万维网"}],"subs":[],"ans":"答案B　阿帕网→TCP/IP互联→万维网→5G与AI","al":{"考查点":"互联网发展历程四阶段（识记）。","解题思路":"按时间轴排：1969年阿帕网诞生→1983年TCP/IP成为标准实现互联→1990年代万维网普及→5G与人工智能时代。","逐项剖析":"A项“万维网→阿帕网”倒置，万维网远晚于阿帕网；B项阿帕网→TCP/IP互联→万维网→5G与AI——对，顺序正确；C项把万维网排在TCP/IP互联之前，错；D项“电报→电话”是互联网史前史，不属于本题所问四阶段。","易错警示":"万维网（WWW，1991）晚于TCP/IP互联（1983），勿把两者顺序写反。","方法点拨":"记三个锚点年份：1969诞生、1983互联、1994中国接入，再按“诞生→互联→万维网→智能”排序。"}},{"sec":"选择题","type":"选择题","num":2,"text":"在浏览器中输入网址后能打开对应网站，其中“把域名转换成IP地址”的是：","opts":[{"label":"A","text":"路由器"},{"label":"B","text":"DNS域名解析系统"},{"label":"C","text":"防火墙"},{"label":"D","text":"网卡"}],"subs":[],"ans":"答案B　DNS域名解析系统","al":{"考查点":"DNS域名解析功能（识记）。","解题思路":"“域名→IP”的翻译工作由DNS（域名系统）完成：人记域名，机器认IP，DNS充当翻译官。","逐项剖析":"A项路由器——负责数据包转发选路，不翻译域名；B项DNS域名解析系统——对；C项防火墙——负责访问过滤安全；D项网卡——负责物理接入。","易错警示":"路由器管“路怎么走”，DNS管“名字翻译成地址”，二者分工勿混。","方法点拨":"DNS=电话簿比喻：域名是联系人名字，IP是电话号码，DNS负责查号。"}},{"sec":"选择题","type":"选择题","num":3,"text":"全球IPv4地址已近枯竭，推动其向下一代升级的主要原因是：","opts":[{"label":"A","text":"IPv4地址数量有限，难以满足海量设备接入"},{"label":"B","text":"IPv4速度太慢"},{"label":"C","text":"IPv4不支持任何加密"},{"label":"D","text":"IPv4只能用于有线网络"}],"subs":[],"ans":"答案A　IPv4地址数量有限，难以满足海量设备接入","al":{"考查点":"IPv4向IPv6升级动因（理解）。","解题思路":"IPv4地址仅约43亿个，物联网时代设备海量接入，地址严重不足，IPv6以超大地址空间解决此问题。","逐项剖析":"A项IPv4地址数量有限难以满足海量设备——对，根本动因；B项IPv4速度太慢——地址数量与网速无关；C项IPv4不支持任何加密——加密由上层协议（如HTTPS）承担，非换代主因；D项只能用于有线——IPv4同样支持无线。","易错警示":"升级主因是“地址枯竭”而非“速度/加密”，抓住数量瓶颈。","方法点拨":"凡问IPv6意义，先答“地址空间极大扩展，满足万物互联入网需求”。"}},{"sec":"选择题","type":"选择题","num":4,"text":"登录网上银行时，网址以“https://”开头且浏览器显示小锁图标，说明：","opts":[{"label":"A","text":"该网站没有内容"},{"label":"B","text":"数据传输经过加密，更安全"},{"label":"C","text":"网站速度一定更快"},{"label":"D","text":"网站一定可以信任，无需再核实"}],"subs":[],"ans":"答案B　数据传输经过加密，更安全","al":{"考查点":"HTTPS加密传输（理解）。","解题思路":"HTTPS=HTTP+加密层（TLS），数据在传输中被加密，降低被窃听与篡改风险；小锁图标是加密连接的标志。","逐项剖析":"A项该网站没有内容——荒谬；B项数据传输经过加密，更安全——对；C项速度一定更快——加密有计算开销，未必更快；D项一定可以信任无需再核实——错，加密≠可信，钓鱼网站也可用HTTPS，仍需辨别身份。","易错警示":"“加密”与“可信”是两个概念：加密防窃听，可信靠核实（看域名、查备案）。","方法点拨":"看到“https+锁”先判断“传输安全”，再单独判断“网站真伪”，两步不可合并。"}},{"sec":"选择题","type":"选择题","num":5,"text":"搜索引擎先在网络中“巡游”收集网页，再建立索引供用户检索，负责“巡游收集”的是：","opts":[{"label":"A","text":"爬虫程序"},{"label":"B","text":"防火墙"},{"label":"C","text":"电子邮件服务器"},{"label":"D","text":"域名服务器"}],"subs":[],"ans":"答案A　爬虫程序","al":{"考查点":"搜索引擎工作原理（理解）。","解题思路":"搜索引擎三环节：爬虫巡游抓取网页→建立索引→按算法排序响应查询。负责“巡游收集”的是爬虫程序。","逐项剖析":"A项爬虫程序——对，自动遍历网页抓取内容；B项防火墙——安全设备；C项电子邮件服务器——管邮件；D项域名服务器——管域名解析。","易错警示":"爬虫是“收集员”，索引是“目录册”，排序算法是“评卷员”，三者职能分明。","方法点拨":"搜索引擎流程口诀“爬—存—排”：先爬虫抓取，再建索引库，最后排序返回。"}},{"sec":"选择题","type":"选择题","num":6,"text":"查看某网页源代码时，发现文字内容大多放在下列哪组标签之间？","opts":[{"label":"A","text":"〈html〉与〈/html〉"},{"label":"B","text":"〈body〉与〈/body〉"},{"label":"C","text":"〈head〉与〈/head〉"},{"label":"D","text":"〈meta〉与〈/meta〉"}],"subs":[],"ans":"答案B　〈body〉与〈/body〉","al":{"考查点":"HTML结构标签（识记）。","解题思路":"页面可见正文放在body标签内：html是根标签，head放头部信息（标题、meta等），body放页面主体内容。","逐项剖析":"A项html与/html——整页根标签，涵盖head与body；B项body与/body——对，用户看到的正文所在；C项head与/head——放文档元信息，不直接显示为正文；D项meta与/meta——head内的元数据标签，无正文。","易错警示":"“head是头部信息、body是正文主体”是HTML第一课，勿把文字内容误归head。","方法点拨":"HTML骨架“html包head与body”：head管标题配置，body管显示内容。"}},{"sec":"选择题","type":"选择题","num":7,"text":"小明把照片传到网盘，系统提示“秒传”完成——这通常得益于：","opts":[{"label":"A","text":"网络突然提速"},{"label":"B","text":"摘要算法识别出与云端已有文件相同，无需重复上传"},{"label":"C","text":"照片被自动删除"},{"label":"D","text":"网盘赠送了更多空间"}],"subs":[],"ans":"答案B　摘要算法识别出与云端已有文件相同，无需重复上传","al":{"考查点":"云存储秒传原理（理解）。","解题思路":"秒传靠摘要算法：上传时给文件算“指纹”，与云端已有文件指纹相同即判定重复，只建引用不重复上传。","逐项剖析":"A项网络突然提速——秒传与网速无关；B项摘要算法识别出与云端已有文件相同无需重复上传——对；C项照片被自动删除——矛盾；D项网盘赠送空间——无关。","易错警示":"“秒传”是省上传不是传得快，本质是内容去重。","方法点拨":"凡“秒传”必答“摘要算法+指纹比对+免重复存储”。"}},{"sec":"选择题","type":"选择题","num":8,"text":"下列密码设置方式最安全的是：","opts":[{"label":"A","text":"用生日“20090101”"},{"label":"B","text":"所有网站都用同一个简单密码"},{"label":"C","text":"长且混用大小写字母、数字与符号的独立密码"},{"label":"D","text":"把密码写在便签贴电脑上"}],"subs":[],"ans":"答案C　长且混用大小写字母、数字与符号的独立密码","al":{"考查点":"密码安全强度（应用）。","解题思路":"强密码三要素：足够长、字符类型多样（大小写/数字/符号）、各账号独立；且不能明文记录在显眼处。","逐项剖析":"A项生日——易被猜到，弱密码；B项所有网站同一个简单密码——一处泄露全盘沦陷；C项长且混用大小写数字符号的独立密码——对，符合强密码标准；D项写在便签贴电脑上——明文泄露风险。","易错警示":"“好记”与“安全”常冲突，宁可配合密码管理器也不要短密码或一密多用。","方法点拨":"密码安全四标准：长、杂、独、秘（不写下来随处放）。"}},{"sec":"判断题","type":"判断题","num":1,"text":"星型网络中，中心交换机故障会导致全部终端无法互访。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"星型拓扑特点（理解）。","解题思路":"星型结构所有终端经中心节点（交换机）转发数据，中心节点是“咽喉”，一旦故障全网的互访都中断。","易错警示":"星型“单点故障在中心”，对比网状“局部故障不影响整体”。","方法点拨":"拓扑判断题先定“数据是否必经中心”，必经即中心故障=全网瘫痪。"}},{"sec":"判断题","type":"判断题","num":2,"text":"每台设备的IP地址一旦分配就永远固定不变。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"IP地址动态分配（理解）。","解题思路":"IP地址可由DHCP动态分配，重启、换网后可能变化；设备出厂固定的是MAC地址（物理地址），不是IP。","易错警示":"“IP固定不变”混淆了IP与MAC；IP是“临时门牌”，MAC是“身份证号”。","方法点拨":"记口诀：IP会变（动态分配），MAC不变（出厂固化）。"}},{"sec":"判断题","type":"判断题","num":3,"text":"与TCP相比，UDP传输更可靠、不会丢包。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"TCP与UDP特性（理解）。","解题思路":"UDP不建立可靠连接、不保证送达与顺序，丢包不重传；可靠传输是TCP的特点（有确认与重传机制）。","易错警示":"题干把“可靠”安给UDP，恰与事实相反；UDP的价值在“快”（直播/游戏适用）。","方法点拨":"TCP=挂号信（可靠慢）、UDP=平信（快可能丢），场景决定选型。"}},{"sec":"判断题","type":"判断题","num":4,"text":"一个完整的URL通常包含协议、服务器域名与资源路径等部分。（　）","opts":[],"subs":[],"ans":"√","al":{"考查点":"URL结构（识记）。","解题思路":"URL（统一资源定位符）完整含协议（https）、服务器域名（www.example.com）、资源路径（/index.html）等部分。","方法点拨":"拆URL三问：开头是什么协议？中间是谁的域名？后面指向哪个文件？"}},{"sec":"判断题","type":"判断题","num":5,"text":"Markdown是一种所见即所得的网页编程语言，用来替代HTML。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"Markdown定位辨析（理解）。","解题思路":"Markdown是轻量级标记语言，用于快速书写结构化文本（文档、笔记），不是所见即所得的网页编程语言，也不替代HTML。","易错警示":"“所见即所得”指Word式编辑；Markdown是“写标记再渲染”，且与HTML各司其职。","方法点拨":"区分三概念：HTML（网页结构语言）、Markdown（轻量写作标记）、WYSIWYG（所见即所得编辑方式）。"}},{"sec":"判断题","type":"判断题","num":6,"text":"网络上找到的图片，只要注明出处就可以随意用于商业宣传。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"版权授权与商用边界（理解）。","解题思路":"注明出处只解决“署名”问题，不代表获得商用授权；商业使用他人作品须经权利人许可，否则仍侵权。","易错警示":"“注明出处≠获得授权”，署名与许可是一事两面，商用场景缺一不可。","方法点拨":"素材商用三步：找权利人→获授权→按约定署名，缺一步都可能是侵权。"}},{"sec":"填空题","type":"填空题","num":1,"text":"互联网的前身诞生于____年，名为ARPANET。","opts":[],"subs":[],"ans":"1969","al":{"考查点":"互联网诞生年份（识记）。","解题思路":"互联网前身ARPANET诞生于1969年（美国国防部高级研究计划局）。","易错警示":"勿与1994（中国接入）混淆，一个问诞生、一个问中国接入。"}},{"sec":"填空题","type":"填空题","num":2,"text":"我国于____年正式全功能接入国际互联网。","opts":[],"subs":[],"ans":"1994","al":{"考查点":"中国接入互联网年份（识记）。","解题思路":"1994年我国正式全功能接入国际互联网，开启互联网时代。"}},{"sec":"填空题","type":"填空题","num":3,"text":"DNS的作用是把便于记忆的域名解析为____地址。","opts":[],"subs":[],"ans":"IP","al":{"考查点":"DNS解析结果（识记）。","解题思路":"DNS把域名解析为IP地址供机器寻址。"}},{"sec":"填空题","type":"填空题","num":4,"text":"制作网页使用的核心语言HTML全称是____标记语言。","opts":[],"subs":[],"ans":"超文本","al":{"考查点":"HTML全称（识记）。","解题思路":"HTML=HyperText Markup Language，超文本标记语言。"}},{"sec":"填空题","type":"填空题","num":5,"text":"为防止数据丢失，重要文件的备份应遵循多副本原则，一般提倡至少保留____份。","opts":[],"subs":[],"ans":"3（三）","al":{"考查点":"数据备份原则（理解）。","解题思路":"重要文件防丢失提倡“三备份”：本地、云端、异地各一份，分散单点风险。","方法点拨":"“鸡蛋分篮”原则：份数≥3且位置物理隔离。"}},{"sec":"填空题","type":"填空题","num":6,"text":"《未成年人网络保护条例》要求网络平台为未成年人设置____模式。","opts":[],"subs":[],"ans":"未成年人","al":{"考查点":"未成年人网络保护条例（识记）。","解题思路":"《未成年人网络保护条例》要求平台为未成年人设置“未成年人模式”，提供适龄内容与防沉迷保护。"}},{"sec":"简答题","type":"简答题","num":1,"text":"向同学解释“数据分包传输”相比“整包发送”的两点优势。","opts":[],"subs":[],"ans":"①灵活高效：小包可沿不同路径并行传输、充分利用带宽，单条线路繁忙时仍能送达（5分）；②便于差错控制：某个包丢失只需重传该包而非整个文件，且接收端可按序号重组（5分）。","al":{"考查点":"数据分包传输优势（理解）。","解题思路":"两点优势分头展开：①灵活高效——数据分成小包可沿不同路径并行传输，充分利用带宽，单线繁忙时仍能送达；②差错控制——某包丢失只需重传该包而非整个文件，接收端按序号重组（各5分）。","易错警示":"只答“快”太笼统，须落到“并行选路”与“局部重传”两个机制。","方法点拨":"“分包优势”答题链：拆小→多路并行（灵活）＋丢包只补小包（可靠）。"}},{"sec":"简答题","type":"简答题","num":2,"text":"从“制作网页—美化页面—多人协同—发布网站”的流程中任选两个环节，各写出两条操作要点。","opts":[],"subs":[],"ans":"示例——制作：先规划页面结构与内容提纲，再用HTML标签组织文字图片；美化：用CSS统一定义字体、颜色与布局，保持风格一致；协同：用版本管理工具或云协作平台分工，先拉取最新版再修改，避免互相覆盖；发布：检查链接与显示效果，上传到服务器并测试访问（每环节两条要点各5分）。","al":{"考查点":"网站制作流程操作要点（应用）。","解题思路":"任选两环节各写两条要点：制作——先规划结构与内容提纲，再用HTML标签组织文字图片；美化——用CSS统一定义字体颜色布局，保持风格一致；协同——用版本管理/云协作，先拉最新版再修改避免覆盖；发布——检查链接显示效果，上传服务器并测试访问（每环节两条各5分）。","易错警示":"要点须“可操作”（动词+对象），空喊“认真做”不得分。","方法点拨":"操作要点题用“先…再…”句式写步骤，每环节两条体现先后与关键动作。"}},{"sec":"案例分析题","type":"案例分析题","num":1,"text":"小明家的Wi-Fi密码是“12345678”。上周他在班级群里发了自己带身份证号的报名表照片请同学帮忙核对。请分析：（1）小明的做法存在哪些信息安全隐患（至少两点，6分）；（2）请给他提出至少三条改进建议（8分）。","opts":[],"subs":[],"ans":"（1）隐患：①Wi-Fi密码过于简单，易被暴力破解，蹭网者可窃取流量与设备信息；②身份证号属于敏感个人信息，在群里公开传播易被收集滥用，可能引发冒用风险（每点3分）。（2）建议：①将Wi-Fi密码改为长且复杂的组合并定期更换；②身份证照片打码后只发给必要的人，用后及时撤回或删除；③不在公开群聊发送含敏感信息的文件；④开启路由器与账号的双因素认证（如动态验证码）；⑤重要资料加密存储（每条2分，答出4条得满分）。","al":{"考查点":"信息安全隐患分析与防护建议（应用+评价）。","解题思路":"隐患（每点3分）：①Wi-Fi密码“12345678”过于简单，易被暴力破解，蹭网者可窃取流量与设备信息；②身份证号属敏感个人信息，群内公开易被收集滥用，可能被冒用。建议（答4条满分，每条2分）：①换长而复杂的组合密码并定期更换；②身份证照片打码后只发给必要的人，用后撤回删除；③不在公开群聊发含敏感信息的文件；④开双因素认证（动态验证码）；⑤重要资料加密存储。","易错警示":"隐患须“两点以上”且各自独立；建议要与隐患一一对应，避免答非所问。","方法点拨":"“找隐患+给建议”题成对作答：每个隐患配一条对症建议，再补一两条通用加固。"}},{"sec":"综合实践题","type":"综合实践题","num":1,"text":"学校要举办科技节，请你为活动设计一份线上宣传方案，需包含：（1）你选用的主要呈现形式（网页或短视频等）及一条选择理由（4分）；（2）该形式制作过程的三个要点（6分）；（3）宣传中需要注意的三条安全与版权事项（6分）；（4）一种推广渠道及理由（2分）。","opts":[],"subs":[],"ans":"（1）示例：选择短视频——传播快、适合学生浏览习惯、可图文声像并茂（理由合理即给分）。（2）要点示例：先写脚本分镜头再拍摄；画面与字幕清晰；用AI辅助配音或剪辑时明确人机分工并核查素材（每点2分）。（3）安全版权：不泄露学生姓名电话等隐私；使用的音乐图片须有授权或标注来源；不发布未经核实的活动信息（每点2分）。（4）渠道：学校公众号或班级群转发——覆盖本校师生家长，定向精准（理由合理即给分）。评分要点：要素齐全、方案可行、体现安全与版权意识。","al":{"考查点":"线上宣传方案综合设计（创造+评价）。","解题思路":"四问四采分面：①呈现形式+理由（4分）——如短视频传播快、合学生浏览习惯、图文声像并茂；②制作三要点（每点2分）——先写脚本分镜头再拍、画面字幕清晰、AI辅助时明确人机分工并核查素材；③安全版权三条（每点2分）——不泄露学生隐私、音乐图片有授权或标注来源、不发布未经核实的信息；④推广渠道+理由（2分）——学校公众号/班级群，覆盖师生家长定向精准。","易错警示":"每问都要“答到点子上”，尤其安全版权要写具体行为而非空话。","方法点拨":"综合方案题先拆小问，每题用“做法+理由”句式，安全与版权永远占一席。"}}]},{"t":"全册综合检测卷（二）·素养进阶","n":"全册综合检测卷（二）·素养进阶","isExam":true,"qs":[{"sec":"选择题","type":"选择题","num":1,"text":"地铁线路某站临时封闭，乘客换乘其他线路仍能到达目的地。这一现象最能体现的网络结构优势是：","opts":[{"label":"A","text":"星型结构的集中管理"},{"label":"B","text":"网状结构的多路径容错"},{"label":"C","text":"总线结构的低成本"},{"label":"D","text":"环型结构的单向传输"}],"subs":[],"ans":"答案B　网状结构的多路径容错","al":{"考查点":"网状结构容错优势（理解）。","解题思路":"地铁站封闭可换乘其他线路仍达目的地，正对应网络“一条路断了信息绕行”的多路径容错。","逐项剖析":"A项星型的集中管理——星型中心故障反而全网瘫痪，与“换乘仍可达”相反；B项网状结构的多路径容错——对；C项总线结构的低成本——总线单线共享，断线即全断；D项环型的单向传输——单环断点即断链。","易错警示":"“某点故障不影响整体”是网状结构标志，勿与星型（中心单点）混淆。","方法点拨":"容错题看“故障后能否绕行”：能绕=网状/部分网状，不能绕=星型/总线/环型。"}},{"sec":"选择题","type":"选择题","num":2,"text":"对着手机说“帮我定个明早7点的闹钟”即可完成操作，体现交互方式发展为：","opts":[{"label":"A","text":"字符交互"},{"label":"B","text":"语音/手势交互"},{"label":"C","text":"脑机交互"},{"label":"D","text":"纸质交互"}],"subs":[],"ans":"答案B　语音/手势交互","al":{"考查点":"交互方式演进（识记）。","解题思路":"语音说“定闹钟”即完成操作，属于语音交互（人机交互方式多元化的体现）。","逐项剖析":"A项字符交互——打字输入；B项语音/手势交互——对，本情境是语音；C项脑机交互——前沿实验阶段，非日常；D项纸质交互——非人机交互术语。","易错警示":"交互演进脉络：命令行→图形界面→触控→语音/手势→多模态，语音是当前主流新增方式。","方法点拨":"“对手机说话完成操作”=语音交互，题眼在“说”字。"}},{"sec":"选择题","type":"选择题","num":3,"text":"小美发现短视频App总推送她喜欢的内容，看得停不下来。这种现象属于：","opts":[{"label":"A","text":"信息茧房带来的沉浸风险"},{"label":"B","text":"网络带宽不足"},{"label":"C","text":"数字版权保护"},{"label":"D","text":"云存储空间不足"}],"subs":[],"ans":"答案A　信息茧房带来的沉浸风险","al":{"考查点":"信息茧房风险（理解）。","解题思路":"App总推喜欢内容使人沉浸停不下来，是算法推荐导致的“信息茧房”沉浸风险。","逐项剖析":"A项信息茧房带来的沉浸风险——对；B项网络带宽不足——与推送内容无关；C项数字版权保护——版权议题；D项云存储空间不足——存储议题。","易错警示":"“总推喜欢内容”不全是坏事，风险在于过度沉浸与视野窄化，需主动破茧。","方法点拨":"识别茧房信号：推荐单一化+时间失控感，应对=主动跨圈+限时管理。"}},{"sec":"选择题","type":"选择题","num":4,"text":"同学把你被恶搞的照片发到群里并配上嘲笑文字，正确的做法是：","opts":[{"label":"A","text":"立即截图保存证据并告知家长、老师"},{"label":"B","text":"也发一张对方的照片报复"},{"label":"C","text":"假装没看见默默忍受"},{"label":"D","text":"把照片转发到更多群求安慰"}],"subs":[],"ans":"答案A　立即截图保存证据并告知家长、老师","al":{"考查点":"网络欺凌正确应对（应用）。","解题思路":"被恶搞照片+嘲笑文字属网络欺凌，正确做法=截图保留证据并告知家长老师，寻求成年人介入。","逐项剖析":"A项立即截图保存证据并告知家长、老师——对，理性应对三步走；B项也发对方照片报复——以暴制暴、自己也侵权；C项假装没看见默默忍受——纵容欺凌、伤害自己；D项转发到更多群求安慰——扩大传播、二次伤害。","易错警示":"“报复”与“忍受”是两个极端，正确姿态是留证+求助。","方法点拨":"欺凌应对六字诀“留证—求助—举报”，凡“回击/忍受/扩散”皆错。"}},{"sec":"选择题","type":"选择题","num":5,"text":"某网站在未经同意的情况下收集并出售用户浏览记录，主要违背了企业的哪项责任？","opts":[{"label":"A","text":"依法经营责任"},{"label":"B","text":"信息保护责任"},{"label":"C","text":"技术研发责任"},{"label":"D","text":"税收缴纳责任"}],"subs":[],"ans":"答案B　信息保护责任","al":{"考查点":"企业信息保护责任（理解）。","解题思路":"未经同意收集并出售用户浏览记录，违背企业保护用户个人信息的责任（信息保护责任）。","逐项剖析":"A项依法经营责任——宽泛，未命中“信息”要害；B项信息保护责任——对；C项技术研发责任——无关；D项税收缴纳责任——无关。","易错警示":"企业四责（创新/保护用户/尊重版权/保障安全）中此题对应“保护用户”，落到个人信息即“信息保护”。","方法点拨":"凡“收集/出售用户数据”违规，一律答“信息保护责任”并援引最小必要原则。"}},{"sec":"选择题","type":"选择题","num":6,"text":"关于“技术自主可控”，下列理解最准确的是：","opts":[{"label":"A","text":"关起门来不用任何国外技术"},{"label":"B","text":"核心芯片、操作系统、根服务器等关键环节掌握在自己手中"},{"label":"C","text":"只买国产设备不买进口设备"},{"label":"D","text":"所有软件都自己从头编写"}],"subs":[],"ans":"答案B　核心芯片、操作系统、根服务器等关键环节掌握在自己手中","al":{"考查点":"自主可控准确内涵（理解）。","解题思路":"自主可控=关键核心技术（芯片、操作系统、根服务器等）掌握在自己手中，不受制于人，而非闭关锁国。","逐项剖析":"A项关起门不用任何国外技术——封闭主义，误读；B项核心芯片、操作系统、根服务器等关键环节掌握在自己手中——对；C项只买国产不买进口——表象化，不等于可控；D项所有软件自己从头写——极端化。","易错警示":"自主可控是“关键环节自主+开放合作”，不是“全部自研、拒绝交流”。","方法点拨":"自主可控题的标准答法：“命脉环节握在己手，开放中保安全”。"}},{"sec":"判断题","type":"判断题","num":1,"text":"“互联网+”就是把传统产业原样搬到网上运营。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"互联网+本质（理解）。","解题思路":"“互联网+”是用数据、算法与平台重构业务流程、创造新模式（如智慧大棚、在线医疗），不是把线下业务“原样上网”。","易错警示":"“+互联网”是加法（原样上网），“互联网+”是乘法（重构升级），一字之差本质不同。","方法点拨":"凡见“原样/照搬”描述互联网+，判错。"}},{"sec":"判断题","type":"判断题","num":2,"text":"搜索引擎的排序结果只与关键词匹配数量有关，与网页质量无关。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"搜索引擎排序机制（理解）。","解题思路":"搜索引擎排序综合相关度、网页质量（权威性）、时效性等多因素，垃圾低质页面会被降权。","易错警示":"“只与关键词数量有关”是过时认知，现代搜索重质量与语义。","方法点拨":"排序三因素：相关、权威、时效，缺一不可。"}},{"sec":"判断题","type":"判断题","num":3,"text":"使用盗版软件省了钱，还能推动软件产业发展。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"盗版软件危害（评价）。","解题思路":"盗版侵害开发者权益、挤占正版市场，打击创新积极性，长远损害产业生态，“推动发展”恰说反。","易错警示":"个人“省钱”建立在他人“损失”上，产业发展靠正版利润反哺研发。","方法点拨":"版权判断题站开发者与产业长期利益视角，勿被“省钱”绑架。"}},{"sec":"判断题","type":"判断题","num":4,"text":"短视频平台发布的内容无需审核，由网民自行辨别即可。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"平台内容审核责任（理解）。","解题思路":"平台负有内容审核治理责任，须依法处置违法和不良信息，“无需审核”错误。","易错警示":"“网民自行辨别”推卸平台责任，审核是法律义务而非可选项。","方法点拨":"生态治理三方共治：政府监管+平台履责+网民素养，缺一方不成立。"}},{"sec":"判断题","type":"判断题","num":5,"text":"看到网络谣言时，随手转发提醒“大家小心”也是负责任的做法。（　）","opts":[],"subs":[],"ans":"×","al":{"考查点":"谣言应对（应用）。","解题思路":"“随手转发提醒大家小心”看似好心，实则未经核实就传播，反而助推谣言扩散；应核实来源后处置。","易错警示":"“提醒式转发”也是传谣，正确做法=先质疑三查再决定。","方法点拨":"谣言铁律：任何“先转了再说”都不负责任，核实永远在传播之前。"}},{"sec":"填空题","type":"填空题","num":1,"text":"在域名“www.example.com”中，“com”属于____级域名。","opts":[],"subs":[],"ans":"顶（顶级）","al":{"考查点":"域名层级（识记）。","解题思路":"域名从右往左看：最右“com”是顶级域名（还有cn、org等），往左逐级细化。"}},{"sec":"填空题","type":"填空题","num":2,"text":"HTTPS比HTTP多出的“S”代表传输过程经过____处理。","opts":[],"subs":[],"ans":"加密（安全）","al":{"考查点":"HTTPS加密含义（识记）。","解题思路":"HTTPS多出的S=Secure（安全），表示传输过程经过加密处理（TLS）。","易错警示":"S是“加密”不是“更快”，勿答速度。"}},{"sec":"填空题","type":"填空题","num":3,"text":"除密码外再增加短信验证码等验证方式，叫作____认证。","opts":[],"subs":[],"ans":"双因素（两步）","al":{"考查点":"双因素认证（识记）。","解题思路":"密码之外再加短信验证码等第二重验证，叫双因素（两步）认证。"}},{"sec":"填空题","type":"填空题","num":4,"text":"为防止盗版，权利人常在自己的作品中嵌入不可见的数字____。","opts":[],"subs":[],"ans":"水印","al":{"考查点":"数字水印技术（识记）。","解题思路":"为防盗版，权利人常在作品中嵌入不可见的数字水印，用于标记归属与溯源。","易错警示":"水印是“隐形标记”不是“可见logo”；作用在溯源举证。"}},{"sec":"填空题","type":"填空题","num":5,"text":"制作展示家乡的短视频一般包括策划、拍摄、剪辑、配音、字幕、____六步。","opts":[],"subs":[],"ans":"发布（导出）","al":{"考查点":"短视频制作六步（识记）。","解题思路":"六步=策划（主题脚本）→拍摄→剪辑→配音→字幕→发布（导出分享）。"}},{"sec":"填空题","type":"填空题","num":6,"text":"抵制网络谣言要做到不造谣、不信谣、不____。","opts":[],"subs":[],"ans":"传谣（传播）","al":{"考查点":"抵制谣言三不（识记）。","解题思路":"抵制谣言三不=不造谣、不信谣、不传谣（四不在此基础上加“不评”与“举报”）。"}},{"sec":"简答题","type":"简答题","num":1,"text":"奶奶的手机弹出“此网站不安全”的警告，请你用通俗的话向她解释：（1）这个提示是什么意思；（2）为什么不能继续访问。","opts":[],"subs":[],"ans":"（1）意思是：这个网站没有采用HTTPS加密传输，就像寄信不封口、明信片人人可见，我们在页面上输入的信息可能被中途偷看或篡改（5分）。（2）如果在上面输入密码、验证码、银行卡号等信息，很可能被不法分子窃取利用，造成财产损失；正规网站（如银行、购物平台）都会用加密连接，看到“不安全”提示应果断退出（5分）。","al":{"考查点":"HTTPS安全通俗解释（理解+表达）。","解题思路":"（1）解释（5分）：该网站没用HTTPS加密，像寄信不封口、明信片人人可见，输入的信息可能被中途偷看篡改。（2）风险与行动（5分）：若输密码、验证码、银行卡号易被窃取造成损失；银行、购物等正规网站都用加密连接，见“不安全”提示应果断退出。","易错警示":"面向老人要类比生动、忌术语；两问都要答（什么意思+为何不能访问）。","方法点拨":"“向长辈解释”题用生活类比（明信片/不封口）打底，再落到具体危害与行动。"}},{"sec":"简答题","type":"简答题","num":2,"text":"小组四人要共同完成班级网站，请说明“多人协同”带来的两点好处，并写出两条避免互相覆盖、保证协作顺畅的规则。","opts":[],"subs":[],"ans":"好处：①并行分工提高效率，各写各的板块互不等待；②互相审阅可及早发现问题、提升质量（每点2.5分）。规则：①每次改动前先获取最新版本，完成后及时提交并写清改动说明；②按模块分工、避免两人同时编辑同一文件，或用版本管理工具合并（每条2.5分）。","al":{"考查点":"多人协同价值与规则（应用）。","解题思路":"好处（每点2.5分）：①并行分工提高效率，各写各的板块互不等待；②互相审阅及早发现问题、提升质量。规则（每条2.5分）：①改前先获取最新版本、改后及时提交并写清改动说明；②按模块分工避免两人同编一文件，或用版本管理工具合并。","易错警示":"“好处”讲效率质量，“规则”讲避免冲突，两者不能混答。","方法点拨":"协同题模板：好处=快+好；规则=版本管理（先拉后提交）+分工隔离（不同模块）。"}},{"sec":"案例分析题","type":"案例分析题","num":1,"text":"你发现班群里有同学被P图恶搞的照片正被转发，当事人很难过。请按“即时应对—证据留存—后续建议”写出你的三步处理方案。","opts":[],"subs":[],"ans":"即时应对：立即停止转发扩散，私信提醒已转发的人删除，并安慰当事人（4分）。证据留存：截图保存首发者与传播记录，作为后续处理依据（3分）。后续建议：告知老师或家长介入，由平台举报删除；必要时联系学校开展网络文明教育，引导大家换位思考、尊重他人（3分）。","al":{"考查点":"网络欺凌事件处置（应用）。","解题思路":"三步方案：即时应对（4分）——停止转发扩散、私信提醒已转发者删除、安慰当事人；证据留存（3分）——截图保存首发者与传播记录作后续依据；后续建议（3分）——告知老师家长介入、平台举报删除、必要时开展网络文明教育引导换位思考。","易错警示":"三步须按“应对→留证→建议”顺序写全，漏“安慰当事人”会让方案缺温度。","方法点拨":"欺凌处置按时间轴：立即止损→固定证据→成年人介入+教育引导。"}},{"sec":"案例分析题","type":"案例分析题","num":2,"text":"爸爸想把身份证照片和合同扫描件传到网盘备份。请从“是否该传、如何传、如何备”三方面给他安全建议。","opts":[],"subs":[],"ans":"是否该传：身份证等敏感文件不建议直接上传公有云盘，确有需要须先加密再上传（3分）。如何传：对文件压缩加密、设置强密码；开启账号双因素认证；上传后设置为私密并谨慎分享（4分）。如何备：遵循“三备份”原则，本地移动硬盘加云端各存一份；定期检查更新密码（3分）。","al":{"考查点":"敏感文件云备份安全建议（应用）。","解题思路":"三问三答：是否该传（3分）——身份证等敏感文件不建议直接传公有云盘，确需须先加密；如何传（4分）——压缩加密+强密码、开双因素认证、上传后设私密谨慎分享；如何备（3分）——按三备份原则，本地移动硬盘+云端各存一份，定期换密码。","易错警示":"“直接传原件”是高风险动作；加密、私密、多副本缺一不可。","方法点拨":"敏感数据上云三原则：先加密、设私密、多副本，回答按“该不该→怎么传→怎么备”展开。"}},{"sec":"综合实践题","type":"综合实践题","num":1,"text":"为家乡（如寿光）制作一份“数字名片”并参加评比。请完成：（1）说明你选用的呈现形式（短视频或网页）及理由（4分）；（2）规划名片中的三个内容板块（6分）；（3）若使用AI辅助创作，说明你与AI如何分工——哪些必须自己先想清楚（4分）；（4）列出三条素材版权与信息真实性注意事项（6分）。","opts":[],"subs":[],"ans":"（1）示例：短视频——直观生动、易于传播，适合展示家乡风光与特产（4分）。（2）板块示例：“家乡名片”（位置、历史、荣誉）、“特色产业”（蔬菜大棚、电商直播）、“风土人情”（美食、景点、方言）（每板块2分）。（3）分工示例：先自己确定主题、想清想表达的核心观点与素材框架，再让AI帮忙润色解说词、生成配图建议或剪辑节奏；所有AI产出须自己核查事实后再用（4分）。（4）注意事项：音乐、图片、字体须使用可商用素材或取得授权并标注来源；涉及本地数据（如产量、人数）须查证权威来源，不夸大不编造；人物出镜须征得本人同意，保护个人隐私（每条2分）。评分要点：形式理由充分、板块完整、人机分工体现思维先行、版权与真实意识到位。","al":{"考查点":"家乡数字名片综合设计（创造+评价）。","解题思路":"四问四采分面：①形式+理由（4分）——短视频直观生动易传播，适合展示风光特产；②三个内容板块（每板块2分）——家乡名片（位置历史荣誉）、特色产业（蔬菜大棚电商直播）、风土人情（美食景点方言）；③人机分工（4分）——先自己定主题、想清核心观点与素材框架，再让AI润色解说词/生成配图建议，AI产出自己核查后再用（思维先行）；④三条注意（每条2分）——音乐图片字体用可商用素材或取得授权并标注、本地数据查权威来源不夸大、人物出镜征得同意保护隐私。","易错警示":"人机分工要体现“人先想”，版权注意事项要写具体类别（音乐/图片/字体）。","方法点拨":"数字作品题四件套：形式理由+内容规划+人机分工（人主导）+版权真实清单，逐问作答。"}}]}]}];
