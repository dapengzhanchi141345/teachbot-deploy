        var ESSAY = ['提升','拓展','变式','间隔','简答题','案例分析题','综合实践题'];
        var ch = false;
        DATA.forEach(function(u, ui){ (u.lessons || []).forEach(function(l, li){ (l.qs || []).forEach(function(q, qi){
            if (q.type !== '回忆') return;
            var k = ui + '_' + li + '_' + qi;
            if (app.progress[k] !== 'partial') return;
            var wb = null;
            for (var i = 0; i < app.wrongBook.length; i++) {
                var it = app.wrongBook[i];
                if (it.unitIdx === ui && it.lessonIdx === li && it.qNum === qi) { wb = it; break; }
            }
            if (wb && fuzzy(norm(q.ans), norm(wb.userAnswer))) {
                app.progress[k] = 'right';
                app.wrongBook.splice(app.wrongBook.indexOf(wb), 1);
            } else if (wb) {
                app.progress[k] = 'wrong';
            } else {
                delete app.progress[k]; delete app.userAnswers[k];
            }
            ch = true;
        });});});
        var b = app.wrongBook.length;
        app.wrongBook = app.wrongBook.filter(function(it){
            var u = DATA[it.unitIdx]; var l = u && u.lessons ? u.lessons[it.lessonIdx] : null;
            var q = l && l.qs ? l.qs[it.qNum] : null;
            return !(q && (q.open || ESSAY.indexOf(q.type) >= 0));
        });
        if (b !== app.wrongBook.length) ch = true;
        if (ch) {
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify(app.progress)); } catch(e) {}
            try { localStorage.setItem(WRONG_KEY, JSON.stringify(app.wrongBook)); } catch(e) {}
        }
    } catch(e) {}
})();

/* ========= 工具函数 ========= */
function $(sel) { return document.querySelector(sel); }
function $$(sel) { return Array.from(document.querySelectorAll(sel)); }

function toast(msg, type='info') {
    const t = $('#toast');
    t.textContent = msg;
    t.className = 'toast show ' + type;
    setTimeout(() => { t.className = 'toast'; }, 2400);
}

function htmlEncode(s) {
    return String(s == null ? '' : s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

function escapeRegExp(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

function progressKey(ui, li, qn) { return `${ui}_${li}_${qn}`; }

function getStats() {
    const stats = { total: 0, right: 0, wrong: 0, partial: 0, view: 0, done: 0 };
    DATA.forEach((u, ui) => {
        u.lessons.forEach((l, li) => {
            l.qs.forEach((q, qi) => {
                if (q.open) return;
                stats.total++;
                const k = progressKey(ui, li, qi);
                const s = app.progress[k];
                if (s === 'right') stats.right++;
                else if (s === 'wrong') stats.wrong++;
                else if (s === 'partial') stats.partial++;
                else if (s === 'view') stats.view++;
                if (s) stats.done++;
            });
        });
    });
    stats.wrongBookSize = app.wrongBook.length;
    return stats;
}

function escapeShort(s, n = 30) {
    if (!s) return '';
    s = String(s).replace(/\s+/g, ' ').trim();
    return s.length > n ? s.slice(0, n) + '…' : s;
}

function renderQCard(q, ui, li, idx) {
    const k = progressKey(ui, li, idx);
    const status = app.progress[k];
    let statusClass = '';
    if (status === 'right') statusClass = 'q-status-right';
    else if (status === 'wrong') statusClass = 'q-status-wrong';
    else if (status === 'view' || status === 'partial') statusClass = 'q-status-done';
    const answered = !!status;

    const userAns = app.userAnswers[k];
    const correctAns = q.ans || '';
    const isChallenge = q.open;

    const TMAP = [
        [/^(单选|选择题)$/, 't-single', '🎯', '单选'],
        [/^(判断|判断题)$/, 't-judge', '⚖️', '判断'],
        [/^(填空|填空题)$/, 't-fill', '✏️', '填空'],
        [/^回忆$/, 't-recall', '🧠', '回忆'],
        [/^挑战$/, 't-hard', '⭐', '挑战'],
        [/^提升$/, 't-essay', '📝', '提升'],
        [/^拓展$/, 't-essay', '🚀', '拓展'],
        [/^变式$/, 't-essay', '🔁', '变式'],
        [/^间隔$/, 't-essay', '⏪', '间隔'],
        [/^错题$/, 't-essay', '🩺', '错题'],
        [/^分层$/, 't-essay', '🪜', '分层'],
    ];
    let tCls = 't-essay', tIc = '📌', tTxt = q.type;
    for (const [re, cls, ic, txt] of TMAP) { if (re.test(q.type)) { tCls = cls; tIc = ic; tTxt = txt; break; } }

    function bannerHtml() {
        if (isChallenge) return '<div class="q-banner half"><span class="ba-ic">✨</span>已查看参考方向 · 用自己的话组织答案更有收获</div>';
        if (status === 'right') return '<div class="q-banner right"><span class="ba-ic">🎉</span>答对了！本题已掌握，继续保持</div>';
        if (status === 'wrong') return '<div class="q-banner wrong"><span class="ba-ic">📒</span>答错了 · 已自动加入错题本，对照下方解析弄懂它</div>';
        if (status === 'partial') return '<div class="q-banner half"><span class="ba-ic">📝</span>主观题已记录 · 对照解析核对自己的思路要点</div>';
        if (status === 'view') return '<div class="q-banner half"><span class="ba-ic">👀</span>已查看答案 · 建议合上解析再独立做一遍</div>';
        return '';
    }

    const userMsg = userAns ? (status === 'right' ? `<span class="user-msg right">答: ${escapeShort(userAns, 14)}</span>` : (status === 'wrong' ? `<span class="user-msg wrong">答: ${escapeShort(userAns, 14)}</span>` : formatUserMsg(userAns))) : '';

    let html = `
    <div class="q-card ${statusClass} ${answered ? 'answered' : ''} ${isChallenge ? 'challenge' : ''}" id="q-${ui}-${li}-${idx}" data-num="${idx}">
        ${bannerHtml()}
        <div class="q-meta">
            <div class="q-tags">
                <span class="q-tag ${tCls}">${tIc} ${tTxt}</span>
                ${q.sec ? `<span class="q-tag">${escapeShort(q.sec, 8)}</span>` : ''}
                ${isChallenge ? '<span class="q-tag t-hard">⭐ 开放题</span>' : ''}
                ${userMsg}
            </div>
            <div class="q-num">#${q.num}</div>
        </div>
        <div class="q-text">${highlightBlank(escapeHtml(q.text))}</div>`;

    if (q.opts && q.opts.length > 0) {
        const m = correctAns && correctAns.match(/答案\s*([A-D])/);
        const correctLabel = m ? m[1] : '';
        html += `<div class="q-options">`;
        q.opts.forEach(o => {
            const selected = userAns === o.label;
            let optClass = '';
            if (status === 'right' && selected) optClass = 'is-selected is-correct';
            else if (status === 'wrong') {
                if (o.label === correctLabel) optClass = 'is-correct';
                else if (o.label === selected) optClass = 'is-wrong';
            } else if (selected) optClass = 'is-selected';
            html += `
                <div class="q-option ${optClass}" data-label="${o.label}">
                    <div class="marker">${o.label}</div>
                    <div class="text">${escapeHtml(o.text)}</div>
                </div>`;
        });
        html += `</div>`;
    } else if (q.type === '判断' || q.type === '判断题') {
        const v = correctAns.includes('√') ? '√' : '×';
        const picked = userAns;
        function jc(val) {
            if (status === 'right' && picked === val) return 'is-selected is-correct';
            if (status === 'wrong') { if (v === val) return 'is-correct'; if (picked === val) return 'is-wrong'; }
            if (picked === val) return 'is-selected';
            return '';
        }
        html += `<div class="q-options">
            <div class="q-option ${jc('√')}" data-label="√"><div class="marker">√</div><div class="text">正确</div></div>
            <div class="q-option ${jc('×')}" data-label="×"><div class="marker">×</div><div class="text">错误</div></div>
        </div>`;
    } else if (q.type === '填空' || q.type === '填空题') {
        html += `<input class="q-fill-input" type="text" placeholder="在此处填入你的答案…" value="${escapeAttr(userAns || '')}" ${answered ? 'disabled style="opacity:.75"' : ''}>`;
    } else {
        html += `<textarea class="q-fill-input" rows="3" placeholder="在下面写你的答案，再提交与标准答案对照…" ${answered ? 'disabled style="opacity:.75"' : ''}>${escapeHtml(userAns || '')}</textarea>`;
    }

    html += `<div class="q-actions">
        ${answered
            ? `<button class="btn btn-secondary hint-btn">${status === 'right' ? '✅ 已答对' : status === 'wrong' ? '📒 已入错题本' : status === 'partial' ? '📝 已记录' : '👀 已查看'} · 展开解析</button>`
            : (!isChallenge
                ? `<button class="btn btn-primary submit-btn">✓ 提交 · 判断对错</button>
                   <button class="btn btn-ghost hint-btn">👀 先看答案</button>`
                : `<button class="btn btn-secondary hint-btn">✨ 查看参考方向</button>`)}
        ${app.wrongBook.some(it => it.unitIdx === ui && it.lessonIdx === li && it.qNum === idx) ? '<button class="btn btn-ghost">📓 错题本中</button>' : ''}
    </div>`;

    html += renderAnalysis(q, isChallenge);
    html += `</div>`;
    return html;
}

function renderAnalysis(q, isChallenge) {
    let html = `<div class="analysis">`;
    if (isChallenge) {
        html += `<div class="analysis-title"><span class="at-ic">⭐</span>参考方向<span class="at-line"></span></div>`;
        html += `<div class="a-ans-box"><div class="a-ans-ic">💡</div><div><div class="a-ans-label">开放题 · 无标准答案</div><div class="a-ans-txt">按「问题定位 → 分条方案与理由 → 配图示/对比表」作答，能结合多课知识更佳。</div></div></div>`;
        html += `<div class="analysis-block t-point"><strong><span class="ab-ic">🎯</span>考查点</strong>跨课综合迁移 · 创造性方案设计</div>`;
        html += `<div class="analysis-block t-pit"><strong><span class="ab-ic">⚠️</span>作答建议</strong>结构完整（问题—方案—理由）比辞藻更重要；写完回读一遍检查逻辑。</div>`;
        html += `</div>`;
        return html;
    }
    if (!q.ans && !q.al) {
        html += `<div class="analysis-block t-pit"><strong><span class="ab-ic">📢</span>提示</strong>本题暂未配置标准答案，可参考教材或请教老师。</div>`;
        html += `</div>`;
        return html;
    }
    html += `<div class="analysis-title"><span class="at-ic">✨</span>五维深度解析<span class="at-line"></span></div>`;
    if (q.ans) {
        html += `<div class="a-ans-box"><div class="a-ans-ic">✓</div><div><div class="a-ans-label">正确答案</div><div class="a-ans-txt">${escapeHtml(q.ans)}</div></div></div>`;
    }
    const al = q.al || {};
    if (al.考查点) html += `<div class="analysis-block t-point"><strong><span class="ab-ic">🎯</span>考查点</strong>${escapeHtml(al.考查点)}</div>`;
    if (al.解题思路) html += `<div class="analysis-block t-way"><strong><span class="ab-ic">🧭</span>解题思路</strong>${escapeHtml(al.解题思路)}</div>`;
    if (al.逐项剖析) html += `<div class="analysis-block t-part"><strong><span class="ab-ic">🔬</span>逐项剖析</strong>${escapeHtml(al.逐项剖析)}</div>`;
    if (al.易错警示) html += `<div class="analysis-block t-pit"><strong><span class="ab-ic">⚠️</span>易错警示</strong>${escapeHtml(al.易错警示)}</div>`;
    if (al.方法点拨) html += `<div class="analysis-block t-method"><strong><span class="ab-ic">💡</span>方法点拨</strong>${escapeHtml(al.方法点拨)}</div>`;
    html += `</div>`;
    return html;
}

function renderWrongbook() {
    if (app.wrongBook.length === 0) {
        return `<div class="empty"><div class="icon">📓</div><div class="e-title">错题本是空的</div><p>作答被判错的题会自动归档到这里，方便你集中回炉、逐个攻克。</p>
        <div class="e-act"><button class="btn btn-primary" onclick="goHome()">🏠 去练几道题</button></div></div>`;
    }
    const list = app.wrongBook.slice().reverse();
    let html = `
    <div class="wb-head">
        <div class="wb-t">
            <div class="wb-ic">📓</div>
            <div>
                <h2>错题本</h2>
                <div class="wb-sub">作答被判错的题自动归档 · 点「重练」回到原题再战</div>
            </div>
        </div>
        <div style="display:flex;gap:9px;align-items:center;flex-wrap:wrap">
            <span class="wb-count">共 ${app.wrongBook.length} 道</span>
            <button class="btn btn-ghost" onclick="clearWrongbook()">🗑 清空</button>
        </div>
    </div>`;

    list.forEach(it => {
        const u = DATA[it.unitIdx];
        if (!u) return;
        const l = u.lessons[it.lessonIdx];
        const q = l && l.qs[it.qNum];
        if (!q) return;
        const tm = String(q.type || '').match(/^(单选|选择题)$/) ? '🎯' : String(q.type || '').match(/^(判断|判断题)$/) ? '⚖️' : '📝';
        const when = it.ts ? new Date(it.ts) : null;
        const whenTxt = when ? `${when.getMonth()+1}月${when.getDate()}日 ${String(when.getHours()).padStart(2,'0')}:${String(when.getMinutes()).padStart(2,'0')}` : '';
        html += `<div class="q-card wb-item">
            <div class="wb-src"><span class="q-tag t-hard">📒 错题</span><span>📍 ${escapeShort(u.t, 16)} / ${escapeShort(l.n || l.t, 18)}</span><span>#${q.num} · ${tm} ${escapeHtml(q.type || '')}</span>${whenTxt ? '<span style="margin-left:auto">🗓 ' + whenTxt + '</span>' : ''}</div>
            <div class="q-text" style="font-size:14.5px;margin-bottom:10px">${highlightBlank(escapeHtml(q.text))}</div>
            <div class="wb-compare">
                <div class="wb-yours"><b>✗ 你的答案</b>${escapeHtml(it.userAnswer || '（未作答）')}</div>
                <div class="wb-correct"><b>✓ 正确答案</b>${escapeHtml(q.ans || '')}</div>
            </div>
            <div class="q-actions" style="margin-top:13px">
                <button class="btn btn-primary" onclick="toQ(${it.unitIdx},${it.lessonIdx},${it.qNum})">↻ 重练本题</button>
                <button class="btn btn-secondary" onclick="toggleWbAna(event, this)">🔍 看解析</button>
                <button class="btn btn-ghost" onclick="removeWrong(${it.unitIdx},${it.lessonIdx},${it.qNum})">🗑 移出</button>
            </div>
            <div class="analysis" style="display:none">${buildAna(q)}</div>
        </div>`;
    });
    return html;
}

function buildAna(q) {
    if (!q.al) return '<div class="analysis-block t-point"><strong>提示</strong>暂无解析</div>';
    let h = '';
    const al = q.al;
    if (al.考查点) h += `<div class="analysis-block t-point"><strong><span class="ab-ic">🎯</span>考查点</strong>${escapeHtml(al.考查点)}</div>`;
    if (al.解题思路) h += `<div class="analysis-block t-way"><strong><span class="ab-ic">🧭</span>解题思路</strong>${escapeHtml(al.解题思路)}</div>`;
    if (al.逐项剖析) h += `<div class="analysis-block t-part"><strong><span class="ab-ic">🔬</span>逐项剖析</strong>${escapeHtml(al.逐项剖析)}</div>`;
    if (al.易错警示) h += `<div class="analysis-block t-pit"><strong><span class="ab-ic">⚠️</span>易错警示</strong>${escapeHtml(al.易错警示)}</div>`;
    if (al.方法点拨) h += `<div class="analysis-block t-method"><strong><span class="ab-ic">💡</span>方法点拨</strong>${escapeHtml(al.方法点拨)}</div>`;
    return h;
}
function toggleWbAna(ev, btn) {
    ev.stopPropagation();
    const ana = btn.closest('.q-card').querySelector('.analysis');
    if (ana) ana.style.display = ana.style.display === 'none' ? 'block' : 'none';
}

function highlightBlank(s) {
    return s.replace(/_{2,}|____/g, '<span class="blank"></span>');
}

function escapeHtml(s) {
    return String(s == null ? '' : s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
}
function escapeAttr(s) {
    return escapeHtml(s).replace(/"/g, '&quot;');
}

function formatUserMsg(ans) {
    if (!ans) return '';
    if (ans.length > 16) return `<span class="user-msg partial">答: ${escapeShort(ans, 12)}</span>`;
    return `<span class="user-msg partial">答: ${escapeHtml(ans)}</span>`;
}

/* ========= V3 工具：界面刷新 / 导航 / 统计抽屉 ========= */
function numAnim(el, to, suf) {
    if (!el) return;
    const dur = 850, t0 = performance.now(), from = 0;
    function step(t) {
        const p = Math.min(1, (t - t0) / dur);
        const e = 1 - Math.pow(1 - p, 3);
        el.textContent = Math.round(from + (to - from) * e) + (suf || '');
        if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
}

function updateChrome() {
    const st = getStats();
    const pct = st.total ? Math.round(st.done / st.total * 100) : 0;
    const bar = document.getElementById('topProgBar');
    if (bar) bar.style.width = pct + '%';
    const wb = document.getElementById('wbBadge');
    if (wb) { wb.textContent = st.wrongBookSize; wb.style.display = st.wrongBookSize ? 'grid' : 'none'; }
    document.body.classList.toggle('qdock-on', app.view === 'lesson');
    if (app.view === 'lesson') fillDock();
    if (app.view === 'lesson') {
        const u = DATA[app.currentUnitIdx], l = u && u.lessons[app.currentLessonIdx];
        if (l) document.title = `${l.n || l.t} · 信息科技练习`;
    } else document.title = '信息科技 · 七年级全册练习系统';
}

function dockToggle() {
    const d = document.getElementById('qdock');
    if (d) d.classList.toggle('min');
}
function dockGo(qi) {
    const t = document.getElementById(`q-${app.currentUnitIdx}-${app.currentLessonIdx}-${qi}`);
    if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' });
    const d = document.getElementById('qdock');
    if (d && d.classList.contains('min')) d.classList.remove('min');
    document.querySelectorAll('.qdock .q-jump-item.cur').forEach(x => x.classList.remove('cur'));
    const it = document.querySelector(`.qdock .q-jump-item[data-jump="${qi}"]`);
    if (it) it.classList.add('cur');
}
function fillDock() {
    if (app.view !== 'lesson') return;
    const u = DATA[app.currentUnitIdx];
    const l = u && u.lessons[app.currentLessonIdx];
    const grid = document.getElementById('qdGrid');
    if (!l || !grid) return;
    const state = document.getElementById('qdState');
    let done = 0, total = 0, html = '';
    l.qs.forEach((q, qi) => {
        if (q.open) return;
        total++;
        const s = app.progress[progressKey(app.currentUnitIdx, app.currentLessonIdx, qi)];
        if (s) done++;
        let cls = s === 'right' ? 'done' : s === 'wrong' ? 'wrong' : (s === 'partial' || s === 'view') ? 'half' : '';
        html += `<div class="q-jump-item ${cls}" data-jump="${qi}" onclick="dockGo(${qi})">${qi + 1}</div>`;
    });
    grid.innerHTML = html;
    if (state) state.textContent = `${done}/${total} 已做`;
}

function goContinue() {
    let first = null;
    for (let ui = 0; ui < DATA.length; ui++) {
        const u = DATA[ui];
        for (let li = 0; li < u.lessons.length; li++) {
            const l = u.lessons[li];
            if (!first && !l.isExam) first = { ui, li };
            for (let qi = 0; qi < l.qs.length; qi++) {
                if (l.qs[qi].open) continue;
                if (!app.progress[progressKey(ui, li, qi)]) { toQ(ui, li, qi); return; }
            }
        }
    }
    if (first) { toQ(first.ui, first.li, 0); toast('🎉 全册基本练完，从第一课开始巩固', 'success'); }
    else toast('🎉 恭喜！所有题目都已作答，去错题本巩固吧', 'success');
}

function backToUnit() {
    app.currentLessonIdx = -1;
    app.view = 'unit';
    app.history.push('unit');
    render();
}

function toQ(ui, li, qi) {
    app.currentUnitIdx = ui;
    app.currentLessonIdx = li;
    app.view = 'lesson';
    render();
    setTimeout(() => {
        const t = document.getElementById(`q-${ui}-${li}-${qi}`);
        if (t) { t.scrollIntoView({ behavior: 'smooth', block: 'start' }); t.classList.add('animate-pop'); }
    }, 420);
}

function removeWrong(ui, li, qi) {
    app.wrongBook = app.wrongBook.filter(it => !(it.unitIdx === ui && it.lessonIdx === li && it.qNum === qi));
    saveWrong();
    render();
    toast('已从错题本移出', 'info');
}

function fillDrawer() {
    const st = getStats();
    const pct = st.total ? Math.round(st.done / st.total * 100) : 0;
    const acc = (st.right + st.wrong) ? Math.round(st.right / (st.right + st.wrong) * 100) : 0;
    const accCls = acc >= 80 ? 'ok' : acc >= 50 ? 'war' : 'bad';
    let h = `<div class="dr-overview">
        <div class="dr-ov-card inf"><b>${pct}%</b><span>总完成度</span></div>
        <div class="dr-ov-card ${accCls}"><b>${acc}%</b><span>作答正确率</span></div>
        <div class="dr-ov-card ok"><b>${st.right}</b><span>答对</span></div>
        <div class="dr-ov-card bad"><b>${st.wrong}</b><span>答错</span></div>
    </div>`;
    const CN = ['零','一','二','三','四','五','六'];
    const IC = ['', '🌐', '🧭', '⚡', '🎨', '🚀', '🛡️', '🏆'];
    DATA.forEach((u, ui) => {
        let total = 0, done = 0, rw = 0;
        u.lessons.forEach((l, li) => l.qs.forEach((q, qi) => {
            if (q.open) return;
            total++;
            const s = app.progress[progressKey(ui, li, qi)];
            if (s) done++;
            if (s === 'right') rw++;
        }));
        const up = total ? Math.round(done / total * 100) : 0;
        const uNo = u.isFinal ? 7 : parseInt((String(u.t).match(/第([一二三四五六])\s*单元/) || [])[1] === undefined ? 0 : CN.indexOf(String(u.t).match(/第([一二三四五六])\s*单元/)[1]) + 1) || 0;
        const name = String(u.t).replace(/^第\s*[一二三四五六]\s*单元\s*/, '').slice(0, 12);
        h += `<div class="dr-unit">
            <div class="du-top"><b>${IC[uNo] || '📦'} ${escapeShort(u.t, 20)}</b><span>${done}/${total} · ${up}%</span></div>
            <div class="du-track"><i style="width:${up}%"></i></div>
        </div>`;
    });
    h += `<div class="ai-hint" style="margin-top:18px"><span class="hint-ic">🧠</span><div><b>学习科学提示</b>：检索练习每做一题都是记忆加固；做错的题间隔 1-2 天回炉一次，掌握更牢。</div></div>`;
    document.getElementById('drBody').innerHTML = h;
}
function openDrawer(mode) {
    mode = mode || 'stats';
    const d = document.getElementById('drawer');
    if (d.classList.contains('on') && app.drawerMode === mode) { closeDrawer(); return; }
    app.drawerMode = mode;
    const t = document.getElementById('drTitle');
    if (mode === 'catalog') { if (t) t.textContent = '📚 课时目录'; fillCatalog(); }
    else { if (t) t.textContent = '📊 学习统计'; fillDrawer(); }
    d.classList.add('on');
    document.getElementById('drMask').classList.add('on');
}
function fillCatalog() {
    const CN = ['一','二','三','四','五','六'];
    const IC = ['', '🌐', '🧭', '⚡', '🎨', '🚀', '🛡️', '🏆'];
    let h = '<div class="dr-scroll">';
    DATA.forEach((u, ui) => {
        const uNo = u.isFinal ? 7 : (CN.indexOf((String(u.t).match(/第([一二三四五六])\s*单元/) || ['', ''])[1]) + 1) || 0;
        h += `<div class="cat-unit">${IC[uNo] || '📦'} ${escapeShort(u.t, 22)} <span class="cat-bar"></span></div>`;
        u.lessons.forEach((l, li) => {
            const qc = l.qs.filter(x => !x.open).length;
            const exam = l.isExam ? 'is-exam' : '';
            const no = lessonNo(l) ? '第 ' + lessonNo(l) + ' 课' : (l.isExam ? '★ 达标' : '课时');
            const name = l.isExam ? '单元达标检测卷' : (l.n || l.t);
            h += `<div class="cat-lesson ${exam}" onclick="toQ(${ui},${li},0);closeDrawer()">
                <span class="cl-no">${no}</span><span class="cl-name">${escapeShort(name, 22)}</span><span class="cl-meta">${qc} 题</span>
            </div>`;
        });
    });
    h += '</div>';
    document.getElementById('drBody').innerHTML = h;
}
function printLesson() {
    if (app.view === 'lesson') { toast('🖨 正在准备打印…', 'info'); setTimeout(() => window.print(), 350); }
    else toast('请先进入一个课时再打印', 'warn');
}
function resetLesson() {
    const ui = app.currentUnitIdx, li = app.currentLessonIdx;
    const l = DATA[ui] && DATA[ui].lessons[li];
    if (!l) return;
    if (!confirm(`确定重做「${l.n || l.t}」？本课作答记录与错题将清空。`)) return;
    l.qs.forEach((q, qi) => {
        const k = progressKey(ui, li, qi);
        delete app.progress[k]; delete app.userAnswers[k];
    });
    app.wrongBook = app.wrongBook.filter(it => !(it.unitIdx === ui && it.lessonIdx === li));
    streak = 0;
    saveProgress(); saveWrong();
    render();
    toast('↺ 本课已重置，重新开始吧', 'info');
}
function closeDrawer() {
    document.getElementById('drawer').classList.remove('on');
    document.getElementById('drMask').classList.remove('on');
}

/* ========= 事件绑定 ========= */
function attachEvents() {
    // 单元卡片
    $$('.unit-card').forEach(el => {
        el.addEventListener('click', () => {
            app.currentUnitIdx = +el.dataset.uidx;
            app.currentLessonIdx = -1;
            app.history.push('unit');
            app.view = 'unit';
            render();
        });
    });
    // 课时卡片
    $$('.lesson-card').forEach(el => {
        el.addEventListener('click', () => {
            app.currentLessonIdx = +el.dataset.lidx;
            app.history.push('lesson');
            app.view = 'lesson';
            render();
        });
    });
    // 选项点击
    $$('.q-option').forEach(opt => {
        opt.addEventListener('click', e => {
            const card = opt.closest('.q-card');
            if (card.classList.contains('answered')) return;
            const label = opt.dataset.label;
            const qNum = +card.dataset.num;
            card.querySelectorAll('.q-option').forEach(o => o.classList.remove('is-selected'));
            opt.classList.add('is-selected');
            const k = progressKey(app.currentUnitIdx, app.currentLessonIdx, qNum);
            app.userAnswers[k] = label;
            saveProgress();
        });
    });
    // 提交答案 + 判断对错
    $$('.submit-btn').forEach(btn => {
        btn.addEventListener('click', e => {
            const card = btn.closest('.q-card');
            const qNum = +card.dataset.num;
            const u = DATA[app.currentUnitIdx];
            const l = u.lessons[app.currentLessonIdx];
            const q = l.qs[qNum];
            const k = progressKey(app.currentUnitIdx, app.currentLessonIdx, qNum);
            const userAns = app.userAnswers[k];
            if (!userAns || !String(userAns).trim()) { toast('请先选择或填写答案', 'warn'); return; }

            let isRight = false, isPartial = false;
            if (q.type === '判断' || q.type === '判断题') {
                const correct = q.ans && ((q.ans.includes('√') && userAns === '√') || (q.ans.includes('×') && userAns === '×'));
                isRight = !!correct;
            } else if (q.type === '单选' || q.type === '选择题') {
                const m = q.ans && q.ans.match(/答案\s*([A-D])/);
                const correctLabel = m ? m[1] : '';
                isRight = userAns === correctLabel;
            } else if (q.type === '填空' || q.type === '填空题' || q.type === '回忆') {
                const norm = s => String(s || '').replace(/[（）()【】\[\]，。,、；;\s]/g, '').toLowerCase();
                const std = norm(q.ans), usr = norm(userAns);
                if (std && usr) {
                    if (usr === std) { isRight = true; }
                    else {
                        const parts = std.split(/[、；;，,/]/).map(norm).filter(Boolean);
                        if (parts.length >= 2) { isRight = parts.includes(usr) || parts.every(p => usr.includes(p)); }
                        else {
                            const ratio = Math.min(usr.length, std.length) / Math.max(usr.length, std.length);
                            isRight = usr.length >= 2 && ratio >= 0.45 && (std.includes(usr) || usr.includes(std));
                        }
                    }
                }
                isPartial = !isRight && String(userAns).trim().length > 0;
            } else {
                isPartial = true; isRight = false;
            }

            // 选项着色
            if (q.opts && q.opts.length > 0) {
                const m = q.ans && q.ans.match(/答案\s*([A-D])/);
                const correctLabel = m ? m[1] : '';
                card.querySelectorAll('.q-option').forEach(o => {
                    o.classList.remove('is-selected', 'is-wrong');
                    if (o.dataset.label === correctLabel) o.classList.add('is-correct');
                    else if (o.dataset.label === userAns && !isRight) o.classList.add('is-wrong');
                });
            }
            if (q.type === '判断' || q.type === '判断题') {
                const v = q.ans && q.ans.includes('√') ? '√' : '×';
                card.querySelectorAll('.q-option').forEach(o => {
                    o.classList.remove('is-selected', 'is-wrong');
                    if (o.dataset.label === v) o.classList.add('is-correct');
                    else if (o.dataset.label === userAns && !isRight) o.classList.add('is-wrong');
                });
            }

            if (isRight) app.progress[k] = 'right';
            else if (isPartial) app.progress[k] = 'partial';
            else app.progress[k] = 'wrong';

            if (!isRight && q.ans && !q.open && ['提升','拓展','变式','间隔','简答题','案例分析题','综合实践题'].indexOf(q.type) < 0) {
                const ex = app.wrongBook.find(it => it.unitIdx === app.currentUnitIdx && it.lessonIdx === app.currentLessonIdx && it.qNum === qNum);
                if (ex) { ex.userAnswer = userAns; ex.ts = Date.now(); }
                else { app.wrongBook.push({ unitIdx: app.currentUnitIdx, lessonIdx: app.currentLessonIdx, qNum, userAnswer: userAns, correctAnswer: q.ans, ts: Date.now() }); }
                saveWrong();
            }
            saveProgress();

            // 连对激励 + 本课通关庆祝
            if (isRight) { streak++; if (streak >= 3 && streak % 3 === 0) toast(`🔥 连对 ${streak} 题，手感火热！`, 'success'); }
            else streak = 0;
            let allDone = true;
            l.qs.forEach((qq, qqi) => { if (!qq.open && !app.progress[progressKey(app.currentUnitIdx, app.currentLessonIdx, qqi)]) allDone = false; });
            if (allDone && !app.lessonCelebrated) {
                app.lessonCelebrated = true;
                const dl = document.querySelector('.lesson-header h2');
                const nm = dl ? dl.textContent : (l.n || '本课');
                setTimeout(() => toast(`🏆 恭喜完成「${nm.slice(0, 18)}」！全部 ${l.qs.filter(x=>!x.open).length} 题已作答`, 'success'), 900);
            }

            // 视觉：结果横幅 + 锁定
            card.classList.add('answered', isRight ? 'q-status-right' : isPartial ? 'q-status-done' : 'q-status-wrong');
            const oldB = card.querySelector('.q-banner'); if (oldB) oldB.remove();
            const b = document.createElement('div');
            if (isRight) { b.className = 'q-banner right'; b.innerHTML = '<span class="ba-ic">🎉</span>答对了！本题已掌握，继续保持'; }
            else if (isPartial) { b.className = 'q-banner half'; b.innerHTML = '<span class="ba-ic">📝</span>主观题已记录 · 对照解析核对自己的思路要点'; }
            else { b.className = 'q-banner wrong'; b.innerHTML = '<span class="ba-ic">📒</span>答错了 · 已自动加入错题本，对照下方解析弄懂它'; }
            card.prepend(b);

            card.querySelectorAll('.q-actions .btn').forEach(x => { x.disabled = true; x.classList.add('answered'); });
            const ana = card.querySelector('.analysis');
            if (ana) ana.classList.add('show');
            fillDock(); updateChrome();
            toast(isRight ? '🎉 答对了！' : (isPartial ? '📝 已记录' : '📒 答错 · 已入错题本'), isRight ? 'success' : (isPartial ? 'info' : 'danger'));
        });
    });
    // 只看答案 / 展开解析
    $$('.hint-btn').forEach(btn => {
        btn.addEventListener('click', e => {
            const card = btn.closest('.q-card');
            const ana = card.querySelector('.analysis');
            if (ana) ana.classList.toggle('show');
            const k = progressKey(app.currentUnitIdx, app.currentLessonIdx, +card.dataset.num);
            if (!app.progress[k]) {
                app.progress[k] = 'view';
                card.classList.add('q-status-done');
                saveProgress();
                fillDock(); updateChrome();
            }
        });
    });
    // 填空/简答输入
    $$('.q-fill-input').forEach(input => {
        input.addEventListener('input', e => {
            const card = input.closest('.q-card');
            const k = progressKey(app.currentUnitIdx, app.currentLessonIdx, +card.dataset.num);
            app.userAnswers[k] = input.value;
            saveProgress();
        });
        input.addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey && input.tagName === 'INPUT') {
                e.preventDefault();
                const sb = input.closest('.q-card').querySelector('.submit-btn');
                if (sb) sb.click();
            }
        });
    });
}

/* ========= 全局动作 ========= */
function goHome() {
    app.view = 'home';
    app.currentUnitIdx = -1;
    app.currentLessonIdx = -1;
    app.history = ['home'];
    render();
}
function showWrongbook() {
    app.view = 'wrongbook';
    app.currentUnitIdx = -1;
    app.currentLessonIdx = -1;
    app.history.push('wrongbook');
    render();
}
function toggleStats() { openDrawer('stats'); }
function toggleTheme() {
    document.body.classList.toggle('light');
    const light = document.body.classList.contains('light');
    try { localStorage.setItem('itq_theme', light ? 'light' : 'dark'); } catch (e) {}
    toast(light ? '☀️ 已切换浅色护眼主题' : '🌙 已切换深色专注主题', 'info');
}
function clearWrongbook() {
    if (confirm('确定清空错题本？此操作不可恢复')) {
        app.wrongBook = [];
        saveWrong();
        render();
    }
}

/* ========= 启动 ========= */
(function init() {
    try { if (localStorage.getItem('itq_theme') === 'light') document.body.classList.add('light'); } catch (e) {}
    updateChrome();
    render();
})();

/* ========= 键盘导航：课时内上下翻题 ========= */
document.addEventListener('keydown', e => {
    if (app.view !== 'lesson') return;
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    const k = e.key;
    if (k !== 'ArrowDown' && k !== 'ArrowUp' && k !== 'ArrowRight' && k !== 'ArrowLeft') return;
    const cards = $$('.q-card');
    if (cards.length < 2) return;
    let cur = 0, bestD = 1e9;
    cards.forEach((c, i) => { const r = c.getBoundingClientRect(); if (r.top > -60) { const d = Math.abs(r.top - 100); if (d < bestD) { bestD = d; cur = i; } } });
    let go = cur;
    if (k === 'ArrowDown' || k === 'ArrowRight') go = Math.min(cards.length - 1, cur + 1);
    else if (k === 'ArrowUp' || k === 'ArrowLeft') go = Math.max(0, cur - 1);
    if (go !== cur) { e.preventDefault(); cards[go].scrollIntoView({ behavior: 'smooth', block: 'start' }); }
    const d = document.getElementById('qdock'); if (d && d.classList.contains('min')) d.classList.remove('min');
    document.querySelectorAll('.qdock .q-jump-item.cur').forEach(x => x.classList.remove('cur'));
    const it = document.querySelector(`.qdock .q-jump-item[data-jump="${go}"]`);
    if (it) it.classList.add('cur');
});

/* 路由：浏览器返回按钮 */
window.addEventListener('popstate', e => {
    app.history.pop();
    const v = app.history[app.history.length - 1] || 'home';
    app.view = v;
    render();
});

</script>
<script id="__AGNES_XL__">
(function(){
  if(location.protocol!=="http:" && location.protocol!=="https:") return;
  var m=location.hostname.match(/^\d+(\.\d+)+$/);
  if(!m) return;
  var S=location.protocol+"//"+m[0]+":8001";
  var last=0;
  function beat(){
    var now=Date.now();if(now-last<20000)return;last=now;
    var data={file:document.title.slice(0,60),ts:now};
    try{
      var keys=Object.keys(localStorage).filter(function(k){
        return /save|dash|prof|streak|exp|star|study|xq|score|progress|quiz|learn/i.test(k);
      });
      keys.forEach(function(k){
        try{data[k]=localStorage.getItem(k).slice(0,5000);}catch(e){}
      });
    }catch(e){}
    try{var x=new XMLHttpRequest();x.open("POST",S+"/beat");x.setRequestHeader("Content-Type","application/json");x.send(JSON.stringify(data));}catch(e){}
  }
  document.addEventListener("visibilitychange",function(){if(!document.hidden)beat();});
  setInterval(function(){beat();},25000);
  window.addEventListener("pagehide",function(){try{beat();}catch(e){}});
  setTimeout(beat,1500);
})();
</script>
